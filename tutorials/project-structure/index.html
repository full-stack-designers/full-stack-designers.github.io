<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Structure from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right a live map (the repository tree beside the Kestrel blueprint) above a terminal that changes it. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#141D27; --muted:#566575; --line:#D2D9E0;
  --accent:#C93A16; --accent-soft:#FBE4DC;
  --add:#1B7447; --add-soft:#DDF2E6; --pr:#0B5CD6; --pr-soft:#DCE9FC; --del:#B4261C; --warn:#8A5A00; --warn-soft:#FBEFD0;
  --term-bg:#121A23; --term-ink:#DCE4EC; --term-muted:#8496A8; --term-line:#263341;
  --t-add:#6FD39A; --t-del:#FF8F84; --t-accent:#FF8A66; --t-coach:#F2C14E;
  --font-display:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#17202A; --sunk:#121A23; --ink:#E4EAF0; --muted:#94A4B4; --line:#2A3743;
    --accent:#FF7A55; --accent-soft:#3A2018;
    --add:#5BC98C; --add-soft:#16301F; --pr:#7DB4FF; --pr-soft:#13294B; --del:#FF8A7E; --warn:#E3B341; --warn-soft:#33290F;
    --term-bg:#090E14; --term-line:#1E2935;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#17202A; --sunk:#121A23; --ink:#E4EAF0; --muted:#94A4B4; --line:#2A3743;
  --accent:#FF7A55; --accent-soft:#3A2018;
  --add:#5BC98C; --add-soft:#16301F; --pr:#7DB4FF; --pr-soft:#13294B; --del:#FF8A7E; --warn:#E3B341; --warn-soft:#33290F;
  --term-bg:#090E14; --term-line:#1E2935;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--font-mono);font-size:.9em}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}

.app{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:700 22px/1 var(--font-display);letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px;display:none}
@media (min-width:1500px){.brand span{display:inline}}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1 1 420px;padding:2px}
.nav button{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;font-size:14px;white-space:nowrap}
.nav button .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font:600 12px/1 var(--font-mono)}
.nav button.done .n{background:var(--add);border-color:var(--add);color:var(--surface)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.nav button[aria-current="true"] .n{color:var(--ink)}
.nav button[aria-current="true"].done .n{color:var(--surface)}
.nav button.sheet{padding-left:12px}

.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
.lesson{padding:24px 20px 40px;background:var(--surface)}
.lesson-in{max-width:66ch;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{margin:0;font:600 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lesson h1{font-size:34px;font-weight:700}
.lesson h2{font-size:20px;font-weight:700;margin-top:8px}
.prose{display:flex;flex-direction:column;gap:12px}
.prose p,.prose ul,.prose dl{margin:0}
.prose ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prose dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.prose dt{font-weight:600}
.prose dd{margin:0;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:15px}
.note p{margin:0}
.note p+p{margin-top:6px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.step .dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font:600 13px/1 var(--font-mono);color:var(--muted)}
.step.done .dot{background:var(--add);border-color:var(--add);color:var(--surface)}
.step.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step.now .dot{border-color:var(--accent);color:var(--accent)}
.step.next{background:var(--sunk);color:var(--muted)}
.step .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.step p{margin:0}
.steps .part{font:600 12.5px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.flow{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.flow li{flex:1 1 150px;border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.4;background:var(--sunk)}
.flow b{display:block;font:600 13px/1.5 var(--font-mono);color:var(--accent)}
.owntoggle{display:flex;flex-direction:column;gap:8px;border:1px solid var(--pr);border-left-width:3px;background:var(--pr-soft);border-radius:0 8px 8px 0;padding:10px 12px;font-size:15px;cursor:pointer}
.owntoggle label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.step .own.ide{border-left-color:var(--ink)}
.owntoggle input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--pr)}
.step.next .own{color:var(--muted)}
.step .own{font-size:14.5px;border-left:3px solid var(--pr);padding-left:10px}
.step .after{font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.cmd{display:inline-block;max-width:100%;text-align:left;font:500 13.5px/1.4 var(--font-mono);padding:3px 8px;margin:1px 0;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--sunk);color:var(--ink);overflow-wrap:anywhere}
.cmd:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14.5px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a0d08}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a0d08}}
.btn.primary:hover{filter:brightness(1.08)}
.complete{border:1px solid var(--add);background:var(--add-soft);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.complete h3{font-size:18px}
.complete ul{margin:0;padding-left:20px}
.reading ul{margin:6px 0 0;padding-left:20px;font-size:15px}
.sheet-table{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}

.bench{display:flex;flex-direction:column;gap:12px;padding:16px 20px 24px;min-width:0}
.map{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:auto}
.map-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.map-head b{font:700 14px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone.wide{grid-column:span 2}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--ink);border-right:1px solid var(--line);min-width:0;transition:background-color .6s}
.zone.flash{background:var(--accent-soft);transition:none}
.zone h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.zone .sub{font-size:12px;color:var(--muted);margin-top:2px}
.zone .list{display:flex;flex-direction:column;gap:6px;flex:1;font-size:13px}
.zone .empty{color:var(--muted);font-size:13px}
.zone .exit{font:500 12px/1.3 var(--font-mono);color:var(--accent);border-top:1px dashed var(--line);padding-top:6px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.file .mono{overflow-wrap:anywhere}
.chip{font:500 11px/1 var(--font-mono);padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.untracked{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.chip.changed{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.staged,.chip.new{border-color:var(--add);color:var(--add);background:var(--add-soft)}
.chip.head{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.merged{background:var(--add);border-color:var(--add);color:var(--surface)}
.file.ignored .mono{color:var(--muted);text-decoration:line-through}
.commit{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;position:relative}
.commit::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);margin-top:4px;z-index:1}
.commit.side::before{border-color:var(--accent);margin-left:0}
.commit:not(:last-child)::after{content:"";position:absolute;left:4px;top:14px;bottom:-10px;width:2px;background:var(--line)}
.commit .c-body{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;min-width:0}
.commit .hash{font:400 12px/1.3 var(--font-mono);color:var(--muted)}
.commit .msg{overflow-wrap:anywhere}
.commit .chip,.pr .chip{white-space:normal;overflow-wrap:anywhere;line-height:1.3}
.ico{width:14px;height:14px;flex:none;color:var(--muted)}
.ico.dir{color:var(--accent)}
.win,.repo{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);font-size:12.5px}
.win{box-shadow:0 2px 8px rgba(20,29,39,.10)}
.win-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--sunk);border-bottom:1px solid var(--line)}
.win-bar .dots{display:flex;gap:4px}
.win-bar .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.win-title{display:flex;gap:5px;align-items:center;font-weight:600}
.win-path{padding:4px 8px;color:var(--muted);font:400 11.5px/1.4 var(--font-mono);border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.win-cols{display:flex;justify-content:space-between;padding:4px 8px;font:600 10.5px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.win-row{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;width:100%;padding:5px 8px;border:0;background:none;text-align:left;font-size:12.5px;color:var(--ink)}
button.win-row:hover{background:var(--accent-soft)}
.win-row .mono{overflow-wrap:anywhere}
.win-row .chip{margin-left:auto}
.win-row.dotfile .ico,.win-row.dotfile .mono{opacity:.72}
.win-row.empty{color:var(--muted)}
.snip{tab-size:4;max-height:190px;overflow:auto}
.win-row.ignored .mono{color:var(--muted);text-decoration:line-through}
.win-foot{padding:4px 8px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
.repo-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:8px 10px 4px;font-size:13.5px}
.repo-head .owner{color:var(--muted)}
.repo-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 6px;border-bottom:1px solid var(--line)}
.repo-tabs button{display:flex;gap:4px;align-items:center;border:0;border-bottom:2px solid transparent;background:none;padding:6px 6px;font-size:12px;color:var(--muted);white-space:nowrap}
.repo-tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.count{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:0 6px;font:500 11px/1.5 var(--font-mono);color:var(--ink)}
.repo-body{display:flex;flex-direction:column;gap:8px;padding:8px}
.repo-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.repo select{font:600 12px/1.3 var(--font-body);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);max-width:100%}
.repo-box{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.repo-latest{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;padding:6px 8px;background:var(--sunk);border-bottom:1px solid var(--line)}
.repo-latest .msg{overflow-wrap:anywhere}
.repo-latest .hash{font:400 11.5px/1.3 var(--font-mono);color:var(--muted);margin-left:auto}
.avatar{display:grid;place-items:center;width:18px;height:18px;flex:none;border-radius:50%;background:var(--ink);color:var(--surface);font:600 10px/1 var(--font-body)}
.repo-file{display:grid;grid-template-columns:14px minmax(0,auto) minmax(0,1fr);gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line)}
.repo-file:last-child{border-bottom:0}
.repo-file .mono{overflow-wrap:anywhere}
.repo-file .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;font-size:11.5px}
.pr{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--sunk);font-size:13px}
.pr.open{border-color:var(--pr);border-left-width:3px}
.pr-name{display:inline-block;background:var(--pr-soft);color:var(--pr);border:1px solid var(--pr);border-radius:5px;padding:2px 8px;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.pr label{font-weight:600;color:var(--pr)}
.pr .pr-input{border-color:var(--pr);color:var(--pr);font-weight:600}
.count.hot{background:var(--pr);border-color:var(--pr);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.term-out .pr{color:#8FC0FF;border:0;padding:0;display:block;background:none;font-size:inherit}
.pr.banner{border-color:var(--warn);background:var(--warn-soft)}
.pr input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.pr .btn{font-size:13px;padding:6px 10px}
.pr .btn.merge{background:var(--add);border-color:var(--add);color:var(--surface)}
.diff{font:400 12px/1.5 var(--font-mono);border:1px solid var(--line);border-radius:5px;background:var(--surface);overflow-x:auto}
.diff div{padding:0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .f{color:var(--muted);border-bottom:1px solid var(--line)}
.diff .a{color:var(--add);background:var(--add-soft)}
.diff .d{color:var(--del)}

.term{display:flex;flex-direction:column;border-radius:8px;background:var(--term-bg);color:var(--term-ink);font:400 13.5px/1.5 var(--font-mono);min-height:300px;border:1px solid var(--term-line);overflow:hidden}
.term-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--term-line);color:var(--term-muted);font-size:12px}
.term-bar button{background:none;border:1px solid var(--term-line);color:var(--term-muted);border-radius:4px;padding:2px 8px;font-size:12px}
.term-bar select{background:var(--term-bg);border:1px solid var(--term-line);color:var(--term-muted);border-radius:4px;padding:2px 4px;font:inherit;font-size:12px;max-width:150px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.errs{display:flex;flex-direction:column;gap:10px}
.err{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.err p{margin:0}
.err .m{font:500 12.5px/1.5 var(--font-mono);color:var(--del);background:var(--sunk);border-radius:5px;padding:6px 8px;overflow-wrap:anywhere}
.fix{font:500 13px/1.5 var(--font-mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 6px;overflow-wrap:anywhere}
.note .mono{overflow-wrap:anywhere}
.shellbox{border:1px solid var(--line);border-left:3px solid var(--pr);border-radius:0 8px 8px 0;background:var(--sunk);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.shellbox p{margin:0}
.shellbox h3{font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.term-bar button:hover{color:var(--term-ink);border-color:var(--term-muted)}
.pane{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px}
.term-bar .tabs button{border-color:transparent;font:600 13px/1.4 var(--font-body);padding:4px 12px}
.term-bar .tabs button[aria-selected="true"]{color:var(--term-ink);background:var(--term-line);border-color:var(--term-line)}
.ed-files{display:flex;gap:2px;align-items:center;overflow-x:auto;padding:6px 8px 0;border-bottom:1px solid var(--term-line)}
.ed-files button,.ed-files input{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--term-muted);font:inherit;font-size:12.5px;padding:5px 9px;white-space:nowrap}
.ed-files button:hover{color:var(--term-ink)}
.ed-files button[aria-selected="true"]{color:var(--term-ink);border-bottom-color:var(--t-accent)}
.ed-files form{display:flex;gap:4px;align-items:center}
.ed-files input{border:1px solid var(--term-line);border-radius:4px;color:var(--term-ink);width:130px}
.ed-files #ed-add,.ed-files form button{color:var(--t-accent)}
#ed-text{flex:1 1 240px;min-height:240px;width:100%;resize:none;border:0;background:transparent;color:var(--term-ink);font:inherit;line-height:1.6;padding:10px 12px;tab-size:4;white-space:pre;overflow:auto}
#ed-text:focus{outline:none;box-shadow:inset 0 0 0 2px var(--t-accent)}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--term-line);color:var(--term-muted);font-size:12.5px}
.ed-foot button{background:var(--t-accent);color:#1a0d08;border:0;border-radius:5px;padding:5px 14px;font:600 13px/1.4 var(--font-body)}
.ed-foot button:disabled{opacity:.45;cursor:default}
.ed-foot button{white-space:nowrap}
.ed-foot button.ghost{background:none;border:1px solid var(--term-muted);color:var(--term-ink)}
.ed-foot .row{flex-wrap:nowrap;gap:8px}
.chip.conflict{border-color:var(--del);color:var(--del);align-self:flex-start}
.snip{display:block;width:100%;text-align:left;font:500 13.5px/1.5 var(--font-mono);padding:6px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:5px;background:var(--sunk);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.snip:hover{border-color:var(--accent);color:var(--accent)}
.term-out{flex:1 1 240px;height:240px;overflow:auto;padding:10px 12px}
.term-out div{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}

  {
    short: 'Scaffold', title: 'What the scaffold gave you',
    intro: `
      <p>A <strong>scaffold</strong> is the starter project a tool generates so you do not begin from an empty folder. Before adding structure of your own, learn what is already there. Most of it you will never edit.</p>
      <dl>
        <dt><code>package.json</code></dt><dd>The parts list: the packages the app needs and the commands it understands (<code>npm run dev</code>, <code>npm run build</code>, <code>npm run lint</code>).</dd>
        <dt><code>index.html</code></dt><dd>The single page the browser loads. React draws everything else inside it.</dd>
        <dt><code>src/</code></dt><dd>Your code. Everything you and your agent write for the cockpit goes in here, and the rest of this tutorial is about how to organise it.</dd>
        <dt><code>public/</code></dt><dd>Files served exactly as they are, such as the favicon.</dd>
        <dt>Config files</dt><dd><code>vite.config.ts</code>, the <code>tsconfig</code> files and <code>eslint.config.js</code> are settings for the build tool, TypeScript and the linter. Leave them until a tutorial tells you to change one.</dd>
        <dt><code>node_modules/</code></dt><dd>The downloaded packages. It appears when you run <code>npm install</code>, it is huge, and it is never committed. The scaffold's own <code>.gitignore</code> already excludes it.</dd>
      </dl>
      <p>Inside <code>src/</code> you will add exactly three folders. They are the top level of a feature-based structure:</p>
      <dl>
        <dt><code>app/</code></dt><dd>The frame that assembles the application: which page shows at which address, and anything that wraps every page.</dd>
        <dt><code>features/</code></dt><dd>One folder per feature. Most of the code lives here.</dd>
        <dt><code>shared/</code></dt><dd>Things at least two features use: a button, the code that talks to the API, a date formatter.</dd>
      </dl>
      <p>Code depends in one direction only: <strong>app uses features, features use shared</strong>, never the reverse. Lesson 6 comes back to this.</p>`,
    steps: [
      { do: `Move into the front-end app: ${c('cd cockpit')}`, cmd: 'cd cockpit',

      { do: `Download the packages that <code>package.json</code> lists. Run this inside <code>cockpit</code>, where that file is. It adds <code>node_modules</code> directly inside <code>cockpit</code>: ${c('npm install')}`, cmd: 'npm install',
        own: `run it inside <span class="mono">cockpit</span>, not at the repository root. If npm reports that it cannot find <span class="mono">package.json</span>, the terminal is in the wrong folder. Your numbers will differ from the sandbox's. If the output ends with a line such as <span class="mono">11 high severity vulnerabilities</span>, the install still worked: npm checks every downloaded package against a public list of known security problems and reports how many matched. Carry on. If you like, run <span class="mono">npm audit</span> to see the list and <span class="mono">npm audit fix</span> to apply the safe updates. Do not run <span class="mono">npm audit fix --force</span>: it can jump packages to new major versions and break the scaffold. The line about packages looking for funding is about donations and can be ignored.`,

        after: `<code>main.tsx</code> is the entry point: the first code that runs, and the file that starts React. <code>App.tsx</code> is the one starter screen. Both are sitting loose in <code>src/</code>, which is fine for a demo and unworkable for a product.` },
      { do: `The next three folders all go directly inside <code>cockpit/src</code>, side by side. The terminal stays in <code>cockpit</code>, and the path <code>src/app</code> puts the new folder inside <code>src</code>. First, the frame that will assemble the pages: ${c('mkdir src/app')}`, cmd: 'mkdir src/app' },

    recap: ['The scaffold gives you a working app. You edit <code>src/</code>; the rest is configuration.', '<code>node_modules/</code> is generated by <code>npm install</code> and never committed. <code>package-lock.json</code> is committed.', '<code>src/</code> gets three folders: <code>app/</code> (assembles pages), <code>features/</code> (most of the code), <code>shared/</code> (used by two or more features).'],
    reading: [['Vite: project structure and index.html', 'https://vite.dev/guide/#index-html-and-project-root'], ['npm Docs: package.json', 'https://docs.npmjs.com/cli/configuring-npm/package-json'], ['React: Start a new React project', 'https://react.dev/learn/creating-a-react-app']]

  {
    short: 'Features', title: 'Slice by feature, not by file type',
    intro: `
      <p>There are two common ways to organise <code>src/</code>. The first sorts files by <em>what kind of file they are</em>: all components in one folder, all hooks in another. The second sorts them by <em>what part of the product they belong to</em>.</p>
      ${COMPARE}
      <p>Hangar 7 does not store the Kestrel as a bin of bolts, a bin of armour plates and a bin of cables. It stores it by <strong>section</strong>: an arm, a leg, the reactor. Each section carries its own plates, wiring and control laws, so a tech servicing the arm works in one place. A <strong>feature folder</strong> is a section of the suit.</p>
      <p>The benefits are practical:</p>
      <ul>
        <li><strong>Changes stay local.</strong> Most work touches one feature, so it touches one folder.</li>
        <li><strong>The folder list reads like the product.</strong> Someone arriving cold, a person or a coding agent, sees what the app does before opening a file.</li>
        <li><strong>A feature can be removed or rewritten</strong> without hunting through five shared folders for its pieces.</li>
      </ul>
      <p><strong>How to find the features:</strong> read what the user does. The Kestrel requirements list it under "What a pilot does":</p>
      <table><thead><tr><th>The pilot…</th><th>Feature folder</th></tr></thead><tbody>
        <tr><td>signs in</td><td><code>auth</code></td></tr>
        <tr><td>runs preflight: queues subsystem checks and starts the preflight</td><td><code>preflight</code></td></tr>
        <tr><td>flies Aster retrieval, giving orders while the power budget is enforced</td><td><code>flight</code></td></tr>
        <tr><td>reads the mission log</td><td><code>missions</code></td></tr>
      </tbody></table>
      <p>A good feature is something a user could name, has its own screens and rules, and could be deleted without breaking the others. Name it in lowercase, with a hyphen if it needs two words.</p>`,
    steps: [
      { do: `Every feature is a folder directly inside <code>cockpit/src/features</code>, one level down from <code>src</code>. The terminal is still in <code>cockpit</code>. Create the first section: ${c('mkdir src/features/preflight')}`, cmd: 'mkdir src/features/preflight',
        after: `Balloon 1 on the blueprint: the legs and waist are fitted. Each feature you add fits another section.` },
      { do: `The mission itself, beside <code>preflight</code> and at the same level, directly inside <code>features</code>: ${c('mkdir src/features/flight')}`, cmd: 'mkdir src/features/flight',
        after: `Balloon 2: the torso, the wing binders and the reactor housing. The reactor stays dark until the flight rules exist.` },
      { do: `Signing in, also directly inside <code>features</code>: ${c('mkdir src/features/auth')}`, cmd: 'mkdir src/features/auth',
        after: `Balloon 3: the head. <code>auth</code> is the conventional short name for authentication, which is why it is not called <code>sign-in</code>.` },
      { do: `The mission log, the fourth folder directly inside <code>features</code>: ${c('mkdir src/features/missions')}`, cmd: 'mkdir src/features/missions',
        after: `Balloon 4: the shoulders and the comms mast, which is now transmitting.` },
      { do: `Read the product back from its folders: ${c('ls src/features')}`, cmd: 'ls src/features',
        after: `Four names, and you know what the cockpit does. That is the test of a feature list.` }

    extra: `<div class="note"><p><strong>How big should a feature be?</strong></p><p>If two candidate features always change together, they are one feature. If one folder grows past a few dozen files and you can name two halves of it, split it. Features are cheap to rename early and expensive to rename late, so settle the names now, while the folders are empty.</p></div>`,
    commit: { none: `Nothing to commit after this lesson: it created four empty folders, and Git does not record empty folders. Run <span class="mono">git status</span> to confirm it reports nothing new, then carry on.` },
    recap: ['Sorting by file type scatters every change across the app. Sorting by feature keeps a change in one folder.', 'A feature is a part of the product a user could name: here <code>auth</code>, <code>preflight</code>, <code>flight</code>, <code>missions</code>.', 'Find the features by reading what the user does in the requirements.'],
    reading: [['Bulletproof React: Project structure', 'https://github.com/alan2207/bulletproof-react/blob/master/docs/project-structure.md'], ['Feature-Sliced Design: Overview', 'https://feature-sliced.design/docs/get-started/overview'], ['React (legacy docs): File structure', 'https://legacy.reactjs.org/docs/faq-structure.html']]

  {
    short: 'Five places', title: 'Inside a feature: five places',
    intro: `
      <p>Every feature folder is organised the same way inside, so once you know one you know them all. There are five places, and each holds one kind of work:</p>
      <div class="sheet-table"><table><thead><tr><th>Place</th><th>Its one job</th><th>In <code>flight</code></th></tr></thead><tbody>
        <tr><td><code>components/</code></td><td>Draw the screen. A component is a reusable piece of interface, like a component in Figma. It shows what it is given and reports clicks. It decides nothing.</td><td><span class="mono">MainDisplay.tsx</span>, <span class="mono">AlertBar.tsx</span></td></tr>
        <tr><td><code>hooks/</code></td><td>Hold the changing state and connect the screen to the rules. A hook is a function whose name starts with <code>use</code>. It is the wiring behind the panel.</td><td><span class="mono">useFlight.ts</span></td></tr>
        <tr><td><code>domain/</code></td><td>The business rules, as plain functions: given this state and this order, what is allowed? No screen, no network.</td><td><span class="mono">power.ts</span>, <span class="mono">orders.ts</span></td></tr>
        <tr><td><code>services/</code></td><td>Talk to the API. Every network request the feature makes is written here and nowhere else.</td><td><span class="mono">missionApi.ts</span></td></tr>
        <tr><td><code>types.ts</code></td><td>The shapes of the feature's data: what a flight state or an order consists of. The spec sheet the other four agree on.</td><td><span class="mono">FlightState</span>, <span class="mono">Order</span></td></tr>
      </tbody></table></div>
      <p>In suit terms: components are the armour plates and instrument faces (what you see), hooks are the wiring, the domain is the control laws, services are the comms links, and <code>types.ts</code> is the section's spec sheet.</p>
      <p>The split that matters most is <strong>domain apart from everything else</strong>. The Kestrel requirements put it as a ground rule: a screen may decide what to show, it may not decide what is allowed. Rules kept in <code>domain/</code> can be tested in milliseconds without opening a browser, and they survive a complete redesign of the screens.</p>
      <p><strong>Not every feature needs all five.</strong> Preflight makes no network requests, so it will have no <code>services/</code>. Create a place when its first file exists, not before.</p>`,
    steps: [
      { do: `Build out the flight feature. The five places all go directly inside <code>cockpit/src/features/flight</code>, side by side, never inside one another. The terminal is still in <code>cockpit</code>. First the place for what the pilot sees: ${c('mkdir ' + FL + '/components')}`, cmd: 'mkdir ' + FL + '/components' },

      { do: `And the spec sheet, a single file directly inside <code>flight</code>, beside the four folders and not inside any of them: ${c('touch ' + FL + '/types.ts')}`, cmd: 'touch ' + FL + '/types.ts',

      { do: `Check the section: ${c('ls ' + FL)}`, cmd: 'ls ' + FL,
        after: `Five places. Any feature in any project organised this way will look the same inside.` }

    extra: `<div class="note"><p><strong>Where do tests go?</strong></p><p>A test for a rule sits beside the rule: <span class="mono">power.ts</span> and <span class="mono">power.test.ts</span> in the same <span class="mono">domain/</span> folder. You find the test by finding the file, and moving one moves the other. Browser tests that click through the whole app are different: they belong to no single feature, so they get their own top-level folder outside <span class="mono">cockpit</span>.</p></div>`,

    recap: ['<code>components/</code> draw, <code>hooks/</code> wire, <code>domain/</code> decides, <code>services/</code> call the API, <code>types.ts</code> describes the data.', 'The domain is kept free of screens and network code so the rules can be tested alone and outlive a redesign.', 'Create only the places a feature needs. A unit test lives beside the file it tests.'],
    reading: [['React: Reusing logic with custom hooks', 'https://react.dev/learn/reusing-logic-with-custom-hooks'], ['React: Keeping components pure', 'https://react.dev/learn/keeping-components-pure'], ['TypeScript Handbook: Everyday types', 'https://www.typescriptlang.org/docs/handbook/2/everyday-types.html']]
  },
  {
    short: 'Sort', title: 'Sort the pile',
    ownLesson: `<strong>The sorting drill is practice.</strong> Its nine files exist only in the drill and on the sandbox map. You never created them and they are not on your machine, so do not look for them there. The one step to repeat on your own project is step 2, moving <span class="mono">App.tsx</span>.`,
    setupNote: 'Tomo has sent nine prototype files. The sorting drill in step 1 decides where each one goes.',
    intro: `
      <p>Structure is a habit more than a diagram. The real skill is looking at one file and knowing where it goes. On a real project you use that skill at the moment you create a file: you make it directly in its place, and it never needs to move.</p>
      <p>To practise, Tomo, the cockpit tech, has handed over a quick prototype: nine files in one pile, the way a first prototype usually arrives. You will sort them in a drag-and-drop drill, not with terminal commands, because the decision is the lesson and the typing is not.</p>
      <p>For every file, ask three questions in order:</p>
      <ol>
        <li><strong>Which feature is it part of?</strong> If exactly one, it goes in that feature. If two or more features use it, it goes in <code>shared/</code>. If it assembles features into the app, it goes in <code>app/</code>.</li>
        <li><strong>What kind of work does it do?</strong> Draws (component), wires (hook), decides (domain), calls the API (service), or describes data (types).</li>
        <li><strong>Does it have a companion?</strong> A test travels with the file it tests.</li>
      </ol>`,
    steps: [
      { drill: 'sort', apply(S) { DRILL.files.forEach(f => { const dir = CK + '/' + DRILL.bins.find(b => b.id === f.to).path; FS.mkdirs(S, dir); FS.put(S, dir + '/' + f.name, 'f'); }); },
        do: `Sort Tomo's nine files into their folders. This step has no terminal command: <button type="button" class="btn primary" data-act="drill" data-drill="sort">Open the sorting drill</button>`,
        own: `<strong>Sandbox only.</strong> The drill's files are not on your machine, so there is nothing to do there for this step.`,
        after: `Nine files, nine decisions, no moves. The files now show on the map, each created directly inside the folder you chose, all under <code>kestrel-simulator/cockpit/src</code>. The arms on the blueprint are fitted: <code>shared/ui</code> holds the parts every section reaches for. <button type="button" class="btn" data-act="drill" data-drill="sort">Open the drill again</button>` },
      { do: `One real file <em>is</em> in the wrong place: the scaffold's own <code>App.tsx</code>, loose directly inside <code>cockpit/src</code>. It belongs to no feature. It is the frame that will choose which page to show, so it goes directly inside <code>cockpit/src/app</code>. This is the one move in the tutorial: ${c('mv src/App.tsx src/app/App.tsx')}`, cmd: 'mv src/App.tsx src/app/App.tsx',
        own: `<strong>This is the one step of this lesson to do on your own machine</strong>, because the scaffold gave you a real <span class="mono">App.tsx</span>. The easiest way is in VS Code: drag <span class="mono">App.tsx</span> from <span class="mono">cockpit/src</span> into <span class="mono">cockpit/src/app</span> in the Explorer and accept "Update imports", so the editor fixes the line that refers to it. If you move it from the terminal instead, first make sure the terminal is inside <span class="mono">cockpit</span>: if your prompt ends in <span class="mono">kestrel-simulator</span>, run <span class="mono">cd cockpit</span>. From the repository root this command fails with "cannot find the file specified", because <span class="mono">src</span> is inside <span class="mono">cockpit</span>. Then open <span class="mono">cockpit/src/main.tsx</span> and change <span class="mono">import App from './App.tsx'</span> to <span class="mono">import App from './app/App.tsx'</span> by hand. Then open <span class="mono">cockpit/src/app/App.tsx</span> itself: every import in it that starts with <span class="mono">'./'</span> now needs <span class="mono">'../'</span>, because the file is one folder deeper. In the Vite starter that is <span class="mono">'./App.css'</span> and the three <span class="mono">'./assets/...'</span> images. To confirm nothing is broken, run <span class="mono">npm run build</span> from inside <span class="mono">cockpit</span>: it stops with the file and line of any import it cannot find.`,
        after: `${shv('<code>mv</code>', '<code>move</code>', '<code>mv</code>')} takes the current path, then the new one. Moving a file breaks every line that imports it by its old path, and every line inside it that imports a neighbour. Here that is two lines: <code>main.tsx</code> must now import <code>./app/App.tsx</code>, and <code>App.tsx</code> must import <code>../App.css</code>. That is the cost of sorting late, and the reason to place each file correctly when it is created.` },
      { do: `Check what is still loose directly inside <code>cockpit/src</code>: ${c('ls src')}`, cmd: 'ls src',
        own: `on your machine <span class="mono">cockpit/src</span> should now hold <span class="mono">main.tsx</span>, the two stylesheets, and the folders <span class="mono">app</span>, <span class="mono">assets</span>, <span class="mono">features</span> and <span class="mono">shared</span>, with <span class="mono">App.tsx</span> inside <span class="mono">app</span>.`,
        after: `<code>main.tsx</code> and the two stylesheets stay at the top of <code>src/</code>. The entry point is the one file that belongs there.` }

    commit: { msg: 'Move App.tsx into src/app', what: `The drill's files exist only in the sandbox, so they are not part of this. The one real change is <span class="mono">App.tsx</span>, moved to <span class="mono">cockpit/src/app/App.tsx</span>, together with the import lines you updated in <span class="mono">cockpit/src/main.tsx</span> and in <span class="mono">App.tsx</span> itself. Git shows the move as a rename. If <span class="mono">main.tsx</span> is not in the list, its import line was not updated and the app will not start: fix it before committing.` },

    reading: [['Git: git-mv', 'https://git-scm.com/docs/git-mv'], ['VS Code: Refactoring, including move and update imports', 'https://code.visualstudio.com/docs/editing/refactoring'], ['Bulletproof React: Project structure', 'https://github.com/alan2207/bulletproof-react/blob/master/docs/project-structure.md']]
  },
  {
    short: 'Rules', title: 'Rules of the road: who may import whom',
    setup(S) {
      FS.put(S, CK + '/' + FL + '/index.ts', 'f', INDEX_TS);
      FS.put(S, CK + '/' + FL + '/domain/useBurnTimer.ts', 'f', BURN);
      S.txt[CK + '/eslint.config.js'] = ESLINT_JS;
    },
    ownLesson: `<strong>This whole lesson happens in the sandbox only.</strong> The import check is practice, and <span class="mono">index.ts</span>, <span class="mono">useBurnTimer.ts</span> and the extra linter rule exist on the pretend computer, not on yours. There is nothing to run on your own machine and nothing to commit. Your real project gets these when the later tutorials write the flight feature.`,
    setupNote: 'Two files arrived overnight in kestrel-simulator/cockpit/src/features/flight/: index.ts directly inside flight, and a late addition from Tomo one level down, in flight/domain/useBurnTimer.ts.',
    intro: `
      <p>Folders describe where files live. They do not stop a file in one place from reaching into another. To <strong>import</strong> is for one file to use code from another, and every import is a dependency: if the imported file changes, the importing one may break. A structure only works if imports follow rules. There are three.</p>
      <p><strong>1. Inside a feature, imports point one way.</strong></p>
      ${FLOW}
      <p>The screen depends on the rules. The rules never depend on the screen. That is what lets you redesign every panel without touching, or retesting, the 25 kW budget.</p>
      <p><strong>2. Features meet only at the front door.</strong> Each feature has an <code>index.ts</code>, a file directly inside the feature folder (for flight, <code>cockpit/src/features/flight/index.ts</code>), that lists what it offers to the rest of the app. Other code imports from <code>features/flight</code> and never from <code>features/flight/domain/power</code>. Everything not listed at the door is private, and can be reorganised freely.</p>
      <p><strong>3. Dependencies point down the stack.</strong> <code>app</code> may use features, features may use <code>shared</code>. <code>shared</code> never imports from a feature, and a feature never imports from <code>app</code>.</p>
      <p>Nobody polices this by reading every file. A <strong>linter</strong> does: a tool that reads the code and flags broken rules. The scaffold already includes one, ESLint, and Tomo has added a rule to it that guards the <code>domain/</code> folders.</p>
      <p>This lesson has two parts. First you apply the rules by hand, in a drag-and-drop check of ten imports. Then you watch the linter catch one of the same mistakes in the sandbox.</p>`,

const AGENTS_BLOCK = `## Project structure

One repository, two self-contained apps. They talk over HTTP only: nothing in \`cockpit/\` imports from \`api/\` or the reverse.

- \`cockpit/\`: the front end (React, TypeScript, Vite). Run npm commands from inside it.
- \`api/\`: the back end (Python, FastAPI). Run uv commands from inside it.
- \`docs/\`, \`specs/\`, \`tokens/\`: shared by both apps. One spec per feature at \`specs/NAME.md\`.

Both apps are organised by feature, not by file type. A feature that exists in both has the same name in both.

- \`cockpit/src/features/NAME/components/\`: presentational UI. No business rules, no fetch calls.
- \`cockpit/src/features/NAME/hooks/\`: state and orchestration. The only thing components call.
- \`cockpit/src/features/NAME/domain/\`: pure business rules. No React, no network, no storage. Unit tests sit beside each file as \`*.test.ts\`.
- \`cockpit/src/features/NAME/services/\`: API calls. All network requests for the feature go here.
- \`cockpit/src/features/NAME/types.ts\`: the feature's TypeScript types.
- \`cockpit/src/features/NAME/index.ts\`: the feature's public exports.
- \`cockpit/src/app/\`: routes and providers. Assembles features, holds no rules.
- \`cockpit/src/shared/\`: code used by two or more features. \`shared/ui/\` holds shared components.

        <li><a href="https://github.com/alan2207/bulletproof-react/blob/master/docs/project-structure.md" target="_blank" rel="noopener">Bulletproof React: Project structure</a>, the best-known write-up of this layout</li>
        <li><a href="https://feature-sliced.design/" target="_blank" rel="noopener">Feature-Sliced Design</a>, a stricter and more detailed version of the same idea</li>
        <li><a href="https://fastapi.tiangolo.com/tutorial/bigger-applications/" target="_blank" rel="noopener">FastAPI: Bigger applications</a></li>
        <li><a href="https://monorepo.tools/" target="_blank" rel="noopener">monorepo.tools</a></li>
      </ul></div>
      <div class="row"><button type="button" class="btn primary" data-go="${P.cur}">Back to lesson ${P.cur + 1}</button></div>
    </div>`;
  }
  function renderLesson() { $('lesson').innerHTML = P.view === 'quiz' ? quizHtml() : P.view === 'sheet' ? sheetHtml() : lessonHtml(); }

  /* ----- rendering: the map (repository tree + blueprint) ----- */
  const SHUT = new Set(['.git', 'tokens', 'cockpit/node_modules', 'cockpit/public', 'cockpit/src/assets']);
  const ROLE = [
    [/^cockpit$/, 'front-end app'], [/^api$/, 'back-end app'], [/^docs$/, 'shared documents'], [/^specs$/, 'one spec per feature'], [/^tokens$/, 'design tokens'], [/^\.git$/, "Git's data"],
    [/^cockpit\/node_modules$/, 'generated · never committed'], [/^cockpit\/src$/, 'your code'], [/^cockpit\/package\.json$/, 'parts list'], [/^cockpit\/src\/main\.tsx$/, 'entry point'],
    [/^cockpit\/src\/app$/, 'assembles pages'], [/^cockpit\/src\/features$/, 'one folder per feature'], [/^cockpit\/src\/shared$/, 'used by 2+ features'],
    [/\/features\/[^/]+\/components$/, 'draws'], [/\/features\/[^/]+\/hooks$/, 'wires'], [/\/features\/[^/]+\/domain$/, 'decides'], [/\/features\/[^/]+\/services$/, 'calls the API'],
    [/\/features\/[^/]+\/types\.ts$/, 'data shapes'], [/\/features\/[^/]+\/index\.ts$/, 'front door'],
    [/^api\/pyproject\.toml$/, 'parts list'], [/^api\/app$/, 'the code'], [/^api\/app\/main\.py$/, 'assembles routers']
  ];
  const BADGE = { 'cockpit/src/features/preflight': '1', 'cockpit/src/features/flight': '2', 'cockpit/src/features/auth': '3', 'cockpit/src/features/missions': '4', 'cockpit/src/shared': '5', api: 'A' };
  function isShut(rel) {
    if (userShut.has(rel)) return true; if (userOpen.has(rel)) return false;
    if (rel === 'cockpit' && (S.cwd === API || S.cwd.startsWith(API + '/'))) return true;
    return SHUT.has(rel);
  }
  function treeHtml() {
    const rows = [], bad = S.lint === 'bad' ? new Set(FS.violations(S)) : new Set();
    const row = (k, depth) => {
      const dir = S.n[k] === 'd', rel = k === REPO ? '' : k.slice(REPO.length + 1), name = FS.base(k), shut = dir && rel && isShut(rel);
      let chips = '';
      if (BADGE[rel]) chips += `<span class="t-badge">${BADGE[rel]}</span>`;
      const role = ROLE.find(r => r[0].test(rel)); if (role) chips += `<span class="chip">${role[1]}</span>`;
      else if (/^cockpit\/src\/features\/[^/]+$/.test(rel) || /^api\/app\/[^/.]+$/.test(rel)) chips += '<span class="chip">feature</span>';
      if (!dir && FS.parent(k) === CK + '/src' && (PILE.includes(name) || (name === 'App.tsx' && P.cur >= 4))) chips += '<span class="chip changed">unsorted</span>';
      if (bad.has(k)) chips += '<span class="chip conflict">lint error</span>';
      if (k === S.cwd) chips += '<span class="chip head">you are here</span>';
      const kidsN = dir ? FS.kids(S, k).length : 0;
      rows.push(`<div class="t-row${dir ? ' dir' : ''}${lastFx.changed.has(k) ? ' new' : ''}${name.startsWith('.') ? ' dot' : ''}${k === S.cwd ? ' here' : ''}" style="--d:${depth}">${dir && rel ? `<button type="button" class="t-tog" data-tog="${esc(rel)}" aria-expanded="${!shut}" aria-label="${shut ? 'Open' : 'Close'} ${esc(name)}">${shut ? '▸' : '▾'}</button>` : '<span class="t-tog"></span>'}${dir ? dirIcon : fileIcon}<span class="mono">${esc(name)}${dir ? '/' : ''}</span>${shut && kidsN ? `<span class="t-more">${kidsN} inside</span>` : ''}${dir && !kidsN && rel !== '.git' && rel !== 'cockpit/node_modules' ? '<span class="t-more">empty</span>' : ''}${chips}</div>`);
      if (dir && !shut) { const ks = FS.kids(S, k); ks.filter(x => S.n[x] === 'd').concat(ks.filter(x => S.n[x] !== 'd')).forEach(x => row(x, depth + 1)); }
    };
    row(REPO, 0);
    return rows.join('');
  }
  function suitView() {
    const has = p => !!S.n[p], F = CK + '/src/features/';
    const pre = has(F + 'preflight'), fl = has(F + 'flight'), au = has(F + 'auth'), mi = has(F + 'missions');
    const sh = Object.keys(S.n).some(k => k.startsWith(CK + '/src/shared/') && S.n[k] === 'f');
    const bad = S.lint === 'bad' && FS.violations(S).length > 0, cls = [];
    if (!has(CK)) cls.push('nosuit');
    if (pre) cls.push('on-a0', 'on-a1'); if (fl) cls.push('on-a3', 'on-a6'); if (au) cls.push('on-a5', 'sy-sensors'); if (mi) cls.push('on-a4', 'sy-comms'); if (sh) cls.push('on-a2');
    if (has(F + 'flight/domain')) { cls.push('pw-on'); if (bad) cls.push('over'); }
    if (has(API)) cls.push('api-on');
    const fitted = [pre, fl, au, mi].filter(Boolean).length, fin = allDone() && P.cur === N - 1;
    if (fin) cls.push('flying');
    const label = !has(CK) ? 'EMPTY GANTRY · NO APPS YET' : bad ? 'STRUCTURE FAULT · A FILE IS IN THE WRONG PLACE' : fin ? 'STRUCTURE COMPLETE · CLAMPS RELEASED' : fitted === 0 ? 'BARE FRAME · 0 OF 4 SECTIONS FITTED' : `${fitted} OF 4 SECTIONS FITTED`;
    return { gantry: fin ? 'open' : 'locked', cls, frame: has(CK), label, bal: { 1: pre ? 'on' : 'off', 2: fl ? (bad ? 'bad' : 'on') : 'off', 3: au ? 'on' : 'off', 4: mi ? 'on' : 'off', 5: sh ? 'on' : 'off', A: has(API) ? 'on' : 'off' } };
  }
  function renderMap() {
    const v = suitView(), key = [['1', 'preflight'], ['2', 'flight'], ['3', 'auth'], ['4', 'missions'], ['5', 'shared'], ['A', 'api']];
    $('map').innerHTML = `<div class="map-head"><b>Where every file goes</b><span>${inLesson() ? `Lesson ${P.cur + 1} sandbox` : 'Sandbox'}</span></div><div class="zones">
      <div class="zone" id="z-tree"><div><h3>Repository</h3><div class="sub">the folders and files, live. Click a folder to fold it.</div></div><div class="tree" id="tree">${treeHtml()}</div></div>
      <div class="zone" id="z-suit"><div><h3>KF-07 Kestrel Mk II</h3><div class="sub">one section of the suit per feature</div></div><div class="kfig">${kestrel(v, lastFx.fx, lastFx.chg)}</div>
        <p class="k-status ${v.bal[2] === 'bad' ? 'bad' : ''}" role="status">${esc(v.label)}</p><div class="legend">${key.map(([k, n]) => `<span class="lg ${v.bal[k]}"><b>${k}</b>${n}</span>`).join('')}</div></div>
    </div>`;
  }
  function render() { renderNav(); renderLesson(); renderMap(); localize(); $('tprompt').textContent = promptText(); $('shell-sel').value = shell(); }

  /* ----- drag-and-drop drills (lessons 5 and 6): drag a card onto a bin, or click a card then a bin ----- */
  let dId = 'sort', dSel = null, dMsg = null, dShake = null;
  const narrow = () => window.matchMedia('(max-width:759px)').matches;
  const D = () => DRILLS[dId];
  const dPlaced = () => { P.drills = P.drills || {}; return (P.drills[dId] = P.drills[dId] || {}); };
  const dLeft = () => { const o = D().order, l = D().files.filter(f => !dPlaced()[f.name]); return o ? l.sort((x, y) => o.indexOf(x.name) - o.indexOf(y.name)) : l; };
  const binLabel = b => (b.group || '') + b.name;
  function drillHtml() {
    const d = D(), left = dLeft(), done = !left.length, groups = [];
    d.bins.forEach(b => { let g = groups.find(x => x.g === b.group); if (!g) groups.push(g = { g: b.group, bins: [] }); g.bins.push(b); });
    const ico = d.folders ? dirIcon : '', fico = d.folders ? fileIcon : '';
    const bin = b => `<button type="button" class="bin${dShake === b.id ? ' shake' : ''}${b.tone ? ' ' + b.tone : ''}" data-bin="${b.id}" aria-label="${esc(binLabel(b) + ', ' + b.role)}"><span class="bin-h">${ico}<span class="${d.folders ? 'mono' : 'bin-t'}">${esc(b.name)}</span><span class="chip">${esc(b.role)}</span></span><span class="bin-files">${d.files.filter(f => f.to === b.id && dPlaced()[f.name]).map(f => `<span class="dchip">${fico}${esc(f.chip || f.name)}</span>`).join('')}</span></button>`;
    const stepWaiting = (curStep() || {}).drill === dId;
    return `<div class="drill" role="dialog" aria-modal="true" aria-labelledby="drill-h">
      <header><div><h2 id="drill-h">${esc(d.title)}</h2><p>${d.how}</p></div><button type="button" class="drill-x" data-act="drill-close" aria-label="Close the drill">×</button></header>
      <div class="drill-grid">
        <section class="pile" aria-label="Cards to sort"><h3>${esc(d.pileTitle)} <span>${done ? 'empty' : left.length + ' to place'}</span></h3>
          ${done ? `<p class="pile-done">${esc(d.doneMsg)}</p>` : left.map(f => `<button type="button" class="dfile${dSel === f.name ? ' sel' : ''}" draggable="true" data-file="${esc(f.name)}" aria-pressed="${dSel === f.name}">${fico}<span><b class="mono">${esc(f.title || f.name)}</b>${f.code ? `<code>${esc(f.code)}</code>` : ''}<span>${esc(f.what)}</span></span></button>`).join('')}
        </section>
        <section class="bins" aria-label="Where it goes"><h3>${esc(d.binsTitle)}</h3>
          ${d.rules ? `<ol class="drill-rules">${d.rules.map(r => `<li>${r}</li>`).join('')}</ol>` : ''}
          ${groups.map(g => g.g ? `<div class="bin-group"><p class="mono">${dirIcon}${esc(g.g)}</p><div class="bin-kids">${g.bins.map(bin).join('')}</div></div>` : g.bins.map(bin).join('')).join('')}
        </section>
      </div>
      <footer><p class="drill-fb ${dMsg ? dMsg[0] : ''}" role="status" aria-live="polite">${dMsg ? dMsg[1] : dSel ? `<strong>Selected.</strong> Now click where it belongs.` : 'Nothing placed yet. Pick a card to start.'}</p>
        <div class="row"><span class="hint">${d.files.length - left.length} of ${d.files.length} placed</span><button type="button" class="btn" data-act="drill-reset">Start over</button>${done ? `<button type="button" class="btn primary" data-act="drill-done">${stepWaiting ? esc(d.doneBtn) : 'Close'}</button>` : ''}</div></footer>
    </div>`;
  }
  function drillRender() { const y = (document.querySelector('.drill-grid') || {}).scrollTop || 0; $('drill').innerHTML = drillHtml(); const g = document.querySelector('.drill-grid'); if (g) g.scrollTop = y; dShake = null; }
  function drillOpen(id) { dId = DRILLS[id] ? id : 'sort'; dSel = null; dMsg = null; $('drill').hidden = false; document.body.classList.add('drill-open'); drillRender(); const f = $('drill').querySelector('.dfile, [data-act="drill-done"], .drill-x'); if (f) f.focus(); }
  function drillClose() { $('drill').hidden = true; $('drill').innerHTML = ''; document.body.classList.remove('drill-open'); }
  function drillPlace(name, binId) {
    const f = D().files.find(x => x.name === name); if (!f || dPlaced()[name]) return;
    const b = D().bins.find(x => x.id === binId), right = D().bins.find(x => x.id === f.to);
    if (f.to === binId) { dPlaced()[name] = 1; dSel = null; dMsg = ['ok', `<strong>${esc(D().yes(f, right))}</strong> ${esc(f.why)}`]; save(); }
    else { dShake = binId; dMsg = ['no', `<strong>${esc(D().no(f, b))}</strong> ${esc(f.hint)}`]; dSel = name; }
    const ok = !!dPlaced()[name];
    drillRender();
    const nxt = $('drill').querySelector(ok ? '.dfile, [data-act="drill-done"]' : '.dfile.sel'); if (nxt) nxt.focus({ preventScroll: true });
    if (ok && narrow()) $('drill').querySelector('.pile').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  function drillDone() {
    const id = dId; drillClose();
    const st = curStep(); if (!st || st.drill !== id || busy) return;
    const before = suitView(), old = S; S = stepState(S, st);
    const L = LESSONS[P.cur]; P.prog[P.cur]++;
    line(DRILLS[id].termLine, 'meta');
    line(P.prog[P.cur] === L.steps.length ? `✓ Lesson ${P.cur + 1} complete.` : `✓ Step ${P.prog[P.cur]} of ${L.steps.length} done.`, 'ok');
    const after = suitView(), chg = new Set(Object.keys(after.bal).filter(k => after.bal[k] !== before.bal[k]));
    lastFx = { changed: new Set(Object.keys(S.n).filter(k => !old.n[k])), fx: chg.size ? ['refit'] : [], chg };
    save(); render(); bottom(); follow();
    lastFx = { changed: new Set(), fx: [], chg: new Set() };
  }
  $('drill').addEventListener('dragstart', e => { const f = e.target.closest('.dfile'); if (!f) return; e.dataTransfer.setData('text/plain', f.dataset.file); e.dataTransfer.effectAllowed = 'move'; dSel = f.dataset.file; f.classList.add('dragging'); });
  $('drill').addEventListener('dragend', e => { const f = e.target.closest('.dfile'); if (f) f.classList.remove('dragging'); document.querySelectorAll('.bin.over').forEach(b => b.classList.remove('over')); });
  $('drill').addEventListener('dragover', e => { const b = e.target.closest('.bin'); if (!b) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; b.classList.add('over'); });
  $('drill').addEventListener('dragleave', e => { const b = e.target.closest('.bin'); if (b && !b.contains(e.relatedTarget)) b.classList.remove('over'); });
  $('drill').addEventListener('drop', e => { const b = e.target.closest('.bin'); if (!b) return; e.preventDefault(); drillPlace(e.dataTransfer.getData('text/plain') || dSel, b.dataset.bin); });
  $('drill').addEventListener('click', e => {
    if (e.target === $('drill')) { drillClose(); return; }
    const f = e.target.closest('.dfile'); if (f) { dSel = dSel === f.dataset.file ? null : f.dataset.file; dMsg = null; drillRender(); const s2 = $('drill').querySelector('.dfile.sel'); if (s2) s2.focus({ preventScroll: true }); if (dSel && narrow()) $('drill').querySelector('.bins').scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
    const b = e.target.closest('.bin'); if (b) { if (dSel) drillPlace(dSel, b.dataset.bin); else { dMsg = ['no', 'Pick a card from the left first, then click where it belongs.']; drillRender(); } }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('drill').hidden) drillClose(); });

  /* ----- events ----- */
  document.addEventListener('click', e => {
    const shb = e.target.closest('[data-shell]'); if (shb) { setShell(shb.dataset.shell); return; }
    const tog = e.target.closest('[data-tog]');
    if (tog) { const rel = tog.dataset.tog; if (isShut(rel)) { userShut.delete(rel); userOpen.add(rel); } else { userOpen.delete(rel); userShut.add(rel); } renderMap(); return; }
    const cmdBtn = e.target.closest('.cmd');
    if (cmdBtn) {
      const inp = $('tin'); inp.value = cmdBtn.dataset.cmd; inp.focus({ preventScroll: true });
      if (window.matchMedia('(max-width:1039px)').matches) inp.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    const opt = e.target.closest('.opt'); if (opt) { P.quiz = P.quiz || {}; P.quiz[+opt.dataset.q] = +opt.dataset.o; save(); const y = $('lesson').scrollTop; renderLesson(); $('lesson').scrollTop = y; return; }
    const vw = e.target.closest('[data-view]'); if (vw) { go(P.cur, vw.dataset.view); return; }
    const goBtn = e.target.closest('[data-go]'); if (goBtn) { go(+goBtn.dataset.go); return; }
    if (e.target.closest('#restart')) { restart(); return; }
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'quiz-reset') { P.quiz = {}; save(); renderLesson(); }
      if (act.dataset.act === 'drill') drillOpen(act.dataset.drill);
      if (act.dataset.act === 'drill-close') drillClose();
      if (act.dataset.act === 'drill-reset') { P.drills[dId] = {}; dSel = null; dMsg = null; save(); drillRender(); }
      if (act.dataset.act === 'drill-done') drillDone();
      if (act.dataset.act === 'copy-agents') {
        const done = ok => { $('copy-msg').textContent = ok ? 'Copied. Paste it into AGENTS.md.' : 'Copying is blocked here. Select the block and copy it by hand.'; };
        try { navigator.clipboard.writeText(AGENTS_BLOCK).then(() => done(true), () => done(false)); } catch (err) { done(false); }
      }
    }
  });
  $('shell-sel').addEventListener('change', e => setShell(e.target.value));
  $('lesson').addEventListener('change', e => { if (e.target.id === 'own-toggle') { P.own = e.target.checked; save(); const y = $('lesson').scrollTop; renderLesson(); localize(); $('lesson').scrollTop = y; } });
  $('tform').addEventListener('submit', e => { e.preventDefault(); if (busy) return; const v = $('tin').value; $('tin').value = ''; exec(v); });
  $('tin').addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && hist.length) { e.preventDefault(); hi = Math.max(0, hi - 1); $('tin').value = hist[hi]; }
    else if (e.key === 'ArrowDown' && hist.length) { e.preventDefault(); hi = Math.min(hist.length, hi + 1); $('tin').value = hist[hi] || ''; }
  });
  $('btn-help').addEventListener('click', () => exec('help'));
  $('btn-clear').addEventListener('click', () => { $('tout').textContent = ''; });
  $('tout').addEventListener('click', () => { if (!String(window.getSelection())) $('tin').focus({ preventScroll: true }); });

  /* ----- boot ----- */
  P = load() || { cur: 0, view: 'lesson', prog: LESSONS.map(() => 0), shell: 'bash', own: false, quiz: {} };
  if (!(P.cur >= 0 && P.cur < N)) P.cur = 0;
  S = replay(P.cur, Math.min(P.prog[P.cur], LESSONS[P.cur].steps.length));
  welcome(); render();
  window.__ps = { exec, drillOpen, get S() { return S; }, get P() { return P; }, toLocal, toCanon, go };
})();
</script>
</body>
</html>
