{title:'Scaffold',long:'Scaffold the project',mins:9,
idea:`<p>Nobody starts a React project from an empty folder. A <strong>scaffolder</strong> writes the starting files for you: a page, an entry point, and the configuration for TypeScript and the build. In the story, this is the hangar rolling out a bare cockpit frame for you to fit screens into.</p>
<dl class="terms">
<dt>npm</dt><dd>Node's package manager. It downloads the libraries a project depends on and runs the project's scripts.</dd>
<dt>package.json</dt><dd>The project's manifest: its name, the packages it depends on, and its scripts (<code>dev</code>, <code>build</code>).</dd>
<dt>node_modules</dt><dd>The folder the downloaded packages land in. Large, never edited by hand, never committed to git.</dd>
<dt>Dev server</dt><dd>A small local web server that serves your project and pushes each saved change to the browser without a full reload. That push is called <strong>hot module replacement (HMR)</strong>.</dd>
</dl>`,
labIntro:'This is a practice project. On your own machine, create it in a scratch folder outside your <code>kestrel-simulator</code> repository, which already has a <code>cockpit</code> folder of its own. Watch the blueprint when the dev server starts: the green power lamp on the console comes on, and the browser beside it loads the page.',
tasks:[
C_('npm create vite@latest cockpit -- --template react-ts','Create the project','<code>npm create vite@latest</code> downloads and runs Vite\'s scaffolder. <code>cockpit</code> is the folder to make. Everything after the bare <code>--</code> is handed to the scaffolder: <code>--template react-ts</code> picks React with TypeScript.','A folder called cockpit now exists. No libraries are in it yet, only the list of which ones it needs.'),
C_('cd cockpit','Step into the project folder','Every command from here on is run from inside the project.','The prompt now reads ~/cockpit.'),
C_('npm install','Download the packages','Reads <code>package.json</code> and downloads everything it lists into <code>node_modules</code>.','28 packages: React itself, TypeScript, Vite and what they need.'),
C_('ls','Look at what you have','Lists the project folder.','<code>src/</code> is where your code lives. <code>index.html</code> is the single page. The <code>tsconfig</code> files configure TypeScript, and <code>vite.config.ts</code> configures Vite. You will not need to change either in this guide.'),
C_('cat package.json','Read the manifest','Shows the project\'s dependencies and scripts.','Two <code>dependencies</code> ship to users: <code>react</code> and <code>react-dom</code>. The <code>devDependencies</code> are tools used only while building. Under <code>scripts</code>, <code>dev</code> runs Vite and <code>build</code> runs the type checker and then the bundler.'),
C_('cat src/main.tsx','Read the entry point','The first file of yours that the browser runs.','It finds the empty <code>&lt;div id="root"&gt;</code> in index.html and tells React to draw the <code>App</code> component inside it. Everything you build hangs off <code>App</code>.'),
C_('npm run dev','Start the dev server','Runs the <code>dev</code> script from package.json, which is <code>vite</code>.','The power lamp is lit and the browser shows "KF-07 Kestrel Mk II cockpit". No screen is online yet: that text is one plain heading, which is all <code>App</code> returns so far.')
],
notes:`<h2>main.tsx, line by line</h2>
<pre class="file">createRoot(document.getElementById('root')!).render(
  &lt;StrictMode&gt;
    &lt;App /&gt;
  &lt;/StrictMode&gt;,
)</pre>
<ul>
<li><code>document.getElementById('root')</code> finds the empty div in index.html.</li>
<li>The <code>!</code> after it is TypeScript, not JavaScript. <code>getElementById</code> might find nothing, so its type is "an element, or null". The <code>!</code> says "I promise it is there". It is your first sight of the checker making you account for a case you would otherwise forget.</li>
<li><code>createRoot(…).render(…)</code> hands that div to React and says what to draw in it.</li>
<li><code>&lt;StrictMode&gt;</code> switches on extra warnings during development. It draws nothing itself.</li>
</ul>
<h2>.ts and .tsx</h2>
<p>A <code>.ts</code> file is TypeScript. A <code>.tsx</code> file is TypeScript that may also contain <strong>JSX</strong>, the HTML-like markup you just saw. Components go in <code>.tsx</code> files; plain data and helpers go in <code>.ts</code>.</p>
<h2>One page, drawn by JavaScript</h2>
<p>index.html is almost empty. React builds the whole interface inside <code>#root</code> at run time. That model is called a <strong>single-page application (SPA)</strong>.</p>`,
quiz:[{q:'What does npm install do?',opts:['Starts the dev server','Downloads the packages listed in package.json into node_modules','Creates the project folder','Checks the code for type errors'],a:1,why:'package.json is the list; node_modules is where the listed packages are put.'},
{q:'Where does React draw the application?',opts:['In a new browser window','Inside the element that createRoot was given, here the div with id "root"','In vite.config.ts','Directly in package.json'],a:1,why:'main.tsx passes that div to createRoot, and everything React renders goes inside it.'}],
reading:[['Vite: Getting Started','https://vite.dev/guide/','The scaffolder, the dev server and the build command, from the source.'],['React: Creating a React App','https://react.dev/learn/creating-a-react-app','When to use a plain Vite project like this one, and when to reach for a framework.']]},

{title:'Components',long:'Screens are components',mins:10,
idea:`<p>A <strong>component</strong> is a function that returns markup. That is the whole definition. In the cockpit, each <strong>screen is a component</strong>: a self-contained part with a name, which you can place, move and reuse.</p>
<p>The markup is written in <strong>JSX</strong>. It looks like HTML, but it lives inside a TypeScript file and follows a few rules of its own:</p>
<ul>
<li><strong>Return one root element.</strong> Several elements must be wrapped in a parent.</li>
<li><strong>Close every tag</strong>, including ones HTML lets you leave open: <code>&lt;input /&gt;</code>.</li>
<li><strong>Write <code>className</code></strong>, not <code>class</code>, because <code>class</code> is a reserved word in JavaScript.</li>
<li><strong>Curly braces switch to code.</strong> Inside JSX, <code>{suit}</code> means "the value of the variable suit".</li>
<li><strong>Component names start with a capital letter.</strong> <code>&lt;header&gt;</code> is an HTML tag; <code>&lt;AlertBar /&gt;</code> is your component.</li>
</ul>
${say('ilse','In Figma I would draw the alert bar once, make it a component, and drop instances of it. It is the same move here, with a function instead of a frame.')}`,
labIntro:'The dev server is running, so every edit you apply reaches the browser at once. Watch screen 1 on the blueprint.',
tasks:[
E_('s1','Write the first screen inside App','Replace the heading with real markup: a wrapper div and a <code>header</code> for the alert bar. The classes come from Ilse\'s stylesheet. Note <code>{suit}</code>: a value dropped into the markup.','Screen 1 lit up. The terminal logged <code>hmr update</code>: Vite pushed the changed file to the browser without reloading the page.'),
E_('s2','Extract it into its own component','Move the header into a new file, <code>AlertBar.tsx</code>, as a function called <code>AlertBar</code>. <code>export</code> makes it available to other files; <code>App</code> imports it and uses it like a tag.','The screen looks exactly the same, and that is the point. <code>App</code> now reads as a list of screens, and the alert bar\'s details live in one file.')
],
notes:`<h2>What JSX really is</h2>
<p>JSX is a shorthand. Before the browser runs it, the build turns each tag into an ordinary function call that creates a small object describing an element. Because JSX is ordinary values, you can store it in a variable, return it from a function, or put it in a list.</p>
<h2>export and import</h2>
<p>Each file is a <strong>module</strong>. Nothing in it is visible elsewhere unless it is exported.</p>
<ul>
<li><code>export function AlertBar()</code> is a <strong>named export</strong>. Import it with the same name in braces: <code>import { AlertBar } from './AlertBar.tsx'</code>.</li>
<li><code>export default App</code> is a <strong>default export</strong>: one per file, imported without braces.</li>
</ul>
<p>The usual convention is one component per file, with the file named after the component.</p>
<h2>Components compose</h2>
<p><code>App</code> uses <code>AlertBar</code>; soon it will use three more. The result is a <strong>component tree</strong> with <code>App</code> at the root. React draws the tree from the top down.</p>`,
quiz:[{q:'Why must a component\'s name start with a capital letter?',opts:['It is only a style preference','React treats lowercase tags as HTML elements and capitalised ones as your components','Capitalised functions run faster','TypeScript rejects lowercase function names'],a:1,why:'<alertbar /> would be looked up as an unknown HTML tag. <AlertBar /> calls your function.'}],
reading:[['React: Your First Component','https://react.dev/learn/your-first-component','Defining, exporting and nesting components.'],['React: Writing Markup with JSX','https://react.dev/learn/writing-markup-with-jsx','The rules of JSX and why they exist.']]},

{title:'Props',long:'Props and types: the spec sheet',mins:13,
idea:`<p>A screen that always shows the same thing is not much use. <strong>Props</strong> are a component's inputs: the values its parent passes in, written like HTML attributes.</p>
<pre class="file">&lt;SystemRow name="Reactor" level={82} status="nominal" /&gt;</pre>
<p>In the story, props are the <strong>connector pins</strong> on a screen, and the <strong>type</strong> is the spec sheet that says what each pin carries. TypeScript reads the spec sheet and checks every place the part is plugged in.</p>
<p>You have already met type aliases and unions in <em>Business Logic from Zero</em>, so treat this as a recap. What is new here is using them to describe a component's props.</p>
<pre class="file">type Status = 'nominal' | 'caution' | 'fault'

type SystemRowProps = {
  name: string
  level: number
  status: Status
}</pre>
<dl class="terms">
<dt>Props</dt><dd>The inputs to a component. Passed by the parent, read-only inside the component.</dd>
<dt>Type alias</dt><dd><code>type Name = …</code> gives a shape a name so it can be reused.</dd>
<dt>Object type</dt><dd>Lists the properties an object must have and the type of each.</dd>
<dt>Union type</dt><dd><code>A | B | C</code>: the value must be one of the listed options. <code>Status</code> allows exactly three words and nothing else.</dd>
</dl>
${say('tomo','Careful with the dev server. Vite does not check types. It strips them out and runs whatever is left. The check is a separate step, and its name is tsc.')}`,
labIntro:'You will build one row of the systems screen, wire two of them in, then make a mistake on purpose and see who catches it.',
tasks:[
E_('s3a','Write the shared type and the SystemRow component','<code>types.ts</code> holds <code>Status</code>, which other files will need too. <code>SystemRow</code> declares its props type, then unpacks the three props in its parameter list: <code>{ name, level, status }</code>. Note <code>import type</code>: it imports something that exists only for the checker.','Two files saved, and nothing on screen changed. Nothing imports them yet.'),
E_('s3b','Use SystemRow twice in App','Text props use quotes: <code>name="Reactor"</code>. Anything else goes in braces: <code>level={82}</code> is the number 82.','Screen 2 is online with two rows. One component, two instances, different props.'),
E_('s3bad','Add a third row the way Tomo typed it at 2 a.m.','A hurried edit: <code>level="96"</code> is text, not a number, and <code>"warning"</code> is not one of the three allowed statuses.','Look at the live screen: the Sensors row appeared, and it almost looks right. Only its bar is grey, because no style exists for "warning". Vite ran the code without complaint.'),
C_('npx tsc -b','Run the type checker','<code>tsc</code> is the TypeScript compiler. <code>-b</code> (build mode) checks every part of the project that tsconfig.json points at. <code>npx</code> runs a tool from node_modules.','Two errors, each with file, line and column. <code>App.tsx(13,37)</code>: text where a number belongs. <code>App.tsx(13,48)</code>: <code>"warning"</code> is not a <code>Status</code>. The checker found both without running the app.',r=>r.meta.cmd==='tsc'&&r.meta.errors===2),
E_('s3fix','Fix the row','<code>level={96}</code> is a number, and <code>"nominal"</code> is on the list.','The bar turned green.'),
C_('npx tsc -b','Check again','The same command.','No output. From tsc, silence means the whole project fits its types.',r=>r.meta.cmd==='tsc'&&r.meta.errors===0)
],
notes:`<h2>Where you will really see type errors</h2>
<p>You rarely wait for <code>tsc</code>. An editor such as VS Code runs the same checker as you type and underlines the problem in red, with the same message, before you save. It also uses the types to autocomplete: type <code>status="</code> and it offers the three allowed words. The command matters for the moments nobody is looking at an editor: before a commit, and in CI.</p>
<h2>Reading an error</h2>
<pre class="file">src/App.tsx(13,37): error TS2322: Type 'string' is not assignable to type 'number'.</pre>
<p>File, then (line, column), then a code you can search for, then the sentence. "Not assignable to" means "does not fit where you are putting it".</p>
<h2>Optional props and defaults</h2>
<p>A question mark makes a prop optional, and a default fills it in:</p>
<pre class="file">type SystemRowProps = {
  name: string
  level: number
  status?: Status
}

function SystemRow({ name, level, status = 'nominal' }: SystemRowProps) { … }</pre>
<h2>Types vanish</h2>
<p>Types are removed when the code is converted to JavaScript. They cost nothing at run time, and they also check nothing at run time. Data arriving from outside (an API, a form) is whatever it is, regardless of the type you wrote for it.</p>`,
quiz:[{q:'The dev server showed the broken row without any error. Why?',opts:['The error was too small to matter','Vite removes the types and runs the code; checking them is tsc\'s job','React fixed the props automatically','The browser hides TypeScript errors'],a:1,why:'Running and checking are separate. That is why the build script runs tsc -b before vite build.'},
{q:'What does the type \'nominal\' | \'caution\' | \'fault\' allow?',opts:['Any text','Exactly one of those three words','A list containing all three','A number from 1 to 3'],a:1,why:'A union of literal strings is the type-level version of a variant property with fixed options.'}],
reading:[['React: Passing Props to a Component','https://react.dev/learn/passing-props-to-a-component','Props, destructuring and default values.'],['React: Using TypeScript','https://react.dev/learn/typescript','The official page on typing components, props and hooks.'],['TypeScript Handbook: Everyday Types','https://www.typescriptlang.org/docs/handbook/2/everyday-types.html','Strings, numbers, object types, unions and aliases.']]},

{title:'Lists',long:'Lists and data',mins:10,
idea:`<p>Writing one <code>&lt;SystemRow&gt;</code> per subsystem by hand does not scale, and the list of systems is really <strong>data</strong>, not markup. So keep it as data, an array of objects, and let the screen draw one row per item.</p>
<p>JavaScript's <code>map</code> turns each item of an array into something else. In JSX, you map each data item to an element:</p>
<pre class="file">{systems.map((s) =&gt; (
  &lt;SystemRow key={s.id} name={s.name} level={s.level} status={s.status} /&gt;
))}</pre>
<dl class="terms">
<dt>Array type</dt><dd><code>System[]</code> means "an array in which every item is a System".</dd>
<dt>key</dt><dd>A unique, stable label you give each item in a list so React can tell the items apart when the list changes. Use an id from the data.</dd>
<dt>Conditional rendering</dt><dd>Showing something only when a condition holds. <code>{faults &gt; 0 &amp;&amp; &lt;p&gt;…&lt;/p&gt;}</code> draws the paragraph only if there are faults.</dd>
</dl>`,
labIntro:'The systems screen gets its own component and draws itself from a typed list.',
tasks:[
E_('s4a','Describe a System, and list the KF-07 Kestrel Mk II\'s systems','<code>types.ts</code> gains the <code>System</code> shape. <code>systems.ts</code> holds the data, annotated <code>System[]</code>, so the checker verifies every entry against the shape.','Saved. Try to imagine a typo in that list, such as <code>status: \'falt\'</code>: tsc would point at the exact line.'),
E_('s4b','Build SystemsPanel and use it in App','The panel maps the list to rows, counts faults with <code>filter</code>, and shows a warning line only when the count is above zero.','Four rows from four data items, and the fault note appeared because the limbs report a fault. <code>App</code> is back to a short list of screens.')
],
notes:`<h2>Why keys matter</h2>
<p>When a list changes, React compares the new elements with the old ones. Keys are how it knows that "propulsion" is still "propulsion" even if it moved. Without keys, React warns in the console and may mix up items. An array index is a poor key if items can be reordered or removed; an id from the data is a good one.</p>
<h2>Derived values are just variables</h2>
<p><code>faults</code> is calculated from <code>systems</code> each time the component runs. It is not stored anywhere. If a value can be computed from data you already have, compute it. This habit prevents a whole class of bugs in the next lessons.</p>
<h2>import type</h2>
<p>This project's TypeScript settings ask you to mark imports that are only types with <code>import type</code>. It tells the build those lines can be deleted entirely.</p>`,
quiz:[{q:'What makes a good key for list items?',opts:['A random number generated on each render','A unique, stable id from the data','The item\'s position in the array, always','The component\'s name'],a:1,why:'The key must identify the same item from one render to the next. Random values change every time; positions change when the list does.'}],
reading:[['React: Rendering Lists','https://react.dev/learn/rendering-lists','map, filter and keys.'],['React: Conditional Rendering','https://react.dev/learn/conditional-rendering','&&, the ? : operator and early returns.']]},

{title:'State',long:'State and events',mins:12,
idea:`<p>So far every screen is fixed: same props in, same picture out. The main display needs a throttle the pilot can move, so it must <strong>remember a value that changes</strong>. That is <strong>state</strong>.</p>
<pre class="file">const [power, setPower] = useState(40)</pre>
<p><code>useState</code> gives you two things: the current value, and a function to change it. When you call <code>setPower(75)</code>, React runs the component again with <code>power</code> equal to 75 and updates the page to match the new result. That re-run is a <strong>re-render</strong>.</p>
<dl class="terms">
<dt>State</dt><dd>A value a component keeps between renders. In the story: the live reading on a gauge.</dd>
<dt>Hook</dt><dd>A function whose name starts with <code>use</code> and that plugs a component into a React feature. <code>useState</code> is the first one everybody learns.</dd>
<dt>Event handler</dt><dd>A function you attach to an element (<code>onChange</code>, <code>onClick</code>) that runs when the user does something.</dd>
<dt>Controlled input</dt><dd>An input whose value comes from state (<code>value={power}</code>) and whose changes go back into state (<code>onChange</code>). The state is the single source of truth.</dd>
</dl>
${say('ilse','A prototype link says "on drag, show that other frame". State says "on drag, remember this number", and the screen redraws itself from the number.')}`,
labIntro:'After this edit the live screen is interactive. The throttle lever on the blueprint follows the real slider.',
tasks:[
E_('s5','Build MainDisplay with a throttle','<code>useState(40)</code> starts the reactor at 40. The slider shows <code>power</code> and reports changes through <code>onChange</code>. <code>event.target.value</code> is always text, so <code>Number(…)</code> converts it before it goes into state. The note under the slider compares <code>power &gt; 90</code>. This limit is a stand-in so the screens have something to react to; the real rule is the 25 kW budget in the flight core, and <em>Wiring the Rules from Zero</em> replaces the stand-in with it.','Screen 3 is online at 40%.'),
{kind:'do',what:'Move the throttle on the live screen',why:'Drag the slider under "Reactor output" in the Control screens panel. Watch the number, the lever on the blueprint, and the update counters under it.',saw:'Each movement called <code>setPower</code>, React re-rendered <code>MainDisplay</code>, and the page changed. Only screen 3 counted updates: state is private to the component that owns it.',test:(v)=>v!==40}
],
notes:`<h2>Why not an ordinary variable?</h2>
<p>A plain <code>let power = 40</code> inside the function would be reset to 40 on every render, and changing it would not tell React to draw anything. State solves both: React stores the value outside the function, and the setter triggers a re-render.</p>
<h2>TypeScript and useState</h2>
<p>You did not write a type, and did not need to. From <code>useState(40)</code> TypeScript <strong>infers</strong> that <code>power</code> is a number and that <code>setPower</code> accepts only numbers. <code>setPower('full')</code> would be an error. When the starting value does not tell the whole story, you say it in angle brackets: <code>useState&lt;LogEntry[] | null&gt;(null)</code>. You will need that in lesson 8.</p>
<p>The <code>event</code> parameter is typed for you as well: because the handler is written inline on an <code>&lt;input&gt;</code>, TypeScript knows <code>event.target</code> is an input element with a <code>value</code>.</p>
<h2>The rules of hooks</h2>
<ul><li>Call hooks only at the top level of a component, never inside conditions or loops.</li><li>Call them only from components or from other hooks.</li></ul>
<h2>Never change state directly</h2>
<p>Always go through the setter. For objects and arrays that means creating a new one (<code>setItems([...items, newItem])</code>) rather than changing the old one in place.</p>`,
quiz:[{q:'What happens when you call setPower(75)?',opts:['The variable power changes immediately on the same line','React re-renders the component with power equal to 75 and updates the page','The whole page reloads','Nothing until you save the file'],a:1,why:'Setting state schedules a re-render. The component function runs again and returns markup for the new value.'}],
reading:[['React: State, a Component\'s Memory','https://react.dev/learn/state-a-components-memory','Why state exists and how useState works.'],['React: Responding to Events','https://react.dev/learn/responding-to-events','Event handlers and how to pass them.']]},

{title:'Sharing',long:'Sharing state between screens',mins:11,
idea:`<p>New requirement from Ilse: when the reactor goes over 90%, the <strong>alert bar</strong> must turn red. The 90% limit is a stand-in so the screens have something to react to; the real rule is the 25 kW budget in the flight core, and <em>Wiring the Rules from Zero</em> replaces the stand-in with it. But <code>power</code> lives inside <code>MainDisplay</code>, and the alert bar cannot see it. State is private.</p>
<p>The fix has a name: <strong>lifting state up</strong>. Move the state to the nearest component that contains both screens, here <code>App</code>, and pass it down as props.</p>
<ul>
<li><code>App</code> owns <code>power</code> and <code>setPower</code>.</li>
<li><code>AlertBar</code> receives <code>power</code> and only reads it.</li>
<li><code>MainDisplay</code> receives <code>power</code> and a function to call when the pilot moves the throttle.</li>
</ul>
<p>Data flows <strong>down</strong> through props. Requests for change flow <strong>up</strong> through functions passed as props. That is called <strong>one-way data flow</strong>, and it is why you can always answer the question "where does this value come from?".</p>
<pre class="file">type MainDisplayProps = {
  power: number
  onPowerChange: (power: number) =&gt; void
}</pre>
<p>The second line is a <strong>function type</strong>: a function that takes a number and returns nothing (<code>void</code>).</p>
${say('tomo','Two screens, one number. So the number lives in the nearest part that holds both, and gets wired down to each.')}`,
labIntro:'One edit touches three files. Then push the reactor past its limit.',
tasks:[
E_('s6','Lift power up into App','<code>MainDisplay</code> loses its <code>useState</code> and gains two props. <code>AlertBar</code> gains a <code>power</code> prop and works out <code>overLimit</code> from it. <code>App</code> now holds the state and wires both screens.','The screens look the same as before. The difference is who owns the number.'),
{kind:'do',what:'Push the throttle past 90%',why:'Drag the slider all the way up and watch screen 1.',saw:'The alert bar turned red on the live screen and on the blueprint. One <code>setPower</code> call in <code>App</code> re-rendered both children. Look at the counters: the alert bar\'s only went up when its text actually changed, because React changes the page only where the new result differs from the old.',test:(v)=>v>90},
C_('npx tsc -b','Type-check the rewiring','Three files changed their contracts. The checker confirms every plug still fits its socket.','Clean. If you had forgotten to pass <code>power</code> to <code>AlertBar</code>, this is where you would have been told.',r=>r.meta.cmd==='tsc'&&r.meta.errors===0)
],
notes:`<h2>Rendering is not the same as changing the page</h2>
<p>When <code>App</code>'s state changes, React calls <code>App</code> again, and with it <code>AlertBar</code>, <code>SystemsPanel</code> and <code>MainDisplay</code>. That is cheap: they are functions returning descriptions. React then compares the new description with the previous one and touches only the parts of the real page that differ. The counters under the blueprint count those real page changes.</p>
<h2>Naming the callback</h2>
<p>By convention, props that carry a function are named <code>onSomething</code>, like the built-in <code>onChange</code>. <code>App</code> could pass any function; here it passes <code>setPower</code> itself, which already has the right type.</p>
<h2>When lifting gets tiresome</h2>
<p>Passing a value down through many layers is called <strong>prop drilling</strong>. For values a large part of the tree needs (the signed-in user, a theme), React offers <strong>context</strong>, and bigger applications add a state library. Reach for those when the wiring hurts, not before.</p>`,
quiz:[{q:'Two sibling components need the same changing value. Where should the state live?',opts:['In both, kept in sync by hand','In their closest common parent, passed down as props','In a global variable','In the stylesheet'],a:1,why:'One owner, one source of truth. Two copies will disagree sooner or later.'}],
reading:[['React: Sharing State Between Components','https://react.dev/learn/sharing-state-between-components','Lifting state up, step by step.'],['React: Thinking in React','https://react.dev/learn/thinking-in-react','How to break a design into components and decide where state lives. Worth reading twice.']]},

{title:'Effects',long:'Effects: loading data',mins:12,
idea:`<p>The comms screen shows messages that come from <strong>outside</strong> the application: the hangar's API. A component's job while rendering is only to calculate markup. Reaching outside, to a server, a timer or the browser itself, is a <strong>side effect</strong>, and React gives it a separate place: <code>useEffect</code>.</p>
<pre class="file">useEffect(() =&gt; {
  // runs after the screen is on the page
  return () =&gt; {
    // cleanup: runs when the screen is removed
  }
}, [])</pre>
<dl class="terms">
<dt>Effect</dt><dd>Code that runs after rendering, to synchronise the component with something outside React.</dd>
<dt>Dependency array</dt><dd>The second argument. The effect re-runs when a value listed in it changes. An empty array means "run once, when the component first appears".</dd>
<dt>Cleanup</dt><dd>The function an effect returns. React calls it before the component is removed, so you can cancel what you started.</dd>
<dt>Promise</dt><dd>A value that will arrive later. <code>Promise&lt;LogEntry[]&gt;</code> is the type of "a list of log entries, eventually".</dd>
</dl>
<p>While the data is on its way, there is nothing to show. The state's type says so honestly: <code>LogEntry[] | null</code>, a list or nothing yet. TypeScript then <strong>makes you handle the "nothing yet" case</strong> before it lets you use the list.</p>
${say('tomo','Anything that reaches outside the screen goes in an effect, and every effect cleans up after itself. A request that answers after the screen is gone must not write to it.')}`,
labIntro:'The sandbox cannot make network requests, so api.ts stands in for the server: a function that answers after a second and a half. The component cannot tell the difference.',
tasks:[
E_('s7a','Describe a log entry and write the request function','<code>types.ts</code> gains <code>LogEntry</code>. <code>fetchMissionLog</code> is annotated to return <code>Promise&lt;LogEntry[]&gt;</code>. The comment at the top shows the two lines a real request would be.','Saved. The return type is a contract between the screen and the server, which is the job an OpenAPI spec does on the other side of the wire.'),
E_('s7b','Build CommsPanel and add it to App','State starts as <code>null</code>. The effect asks for the log and stores it when it arrives. The early <code>if (entries === null)</code> return draws a loading message; below it, TypeScript knows <code>entries</code> is a list.','Screen 4 came online showing "Contacting Hangar 7…", and a moment later the messages arrived: the state changed, and the screen re-rendered. All four screens are lit.')
],
notes:`<h2>Narrowing</h2>
<p><code>entries</code> has the type <code>LogEntry[] | null</code>. Calling <code>entries.map</code> straight away would be an error, because <code>null</code> has no <code>map</code>. After <code>if (entries === null) return …</code>, the checker knows that only the list is possible on the lines below. That is <strong>narrowing</strong>, and it is how TypeScript turns "I forgot the loading state" from a crash into a compile error.</p>
<h2>A real request</h2>
<pre class="file">export async function fetchMissionLog(): Promise&lt;LogEntry[]&gt; {
  const response = await fetch('/api/mission-log')
  if (!response.ok) throw new Error('Request failed: ' + response.status)
  return response.json()
}</pre>
<p>A complete screen also handles failure, so real code tracks three situations: loading, loaded and failed. The API on the other end is what <em>FastAPI from Zero</em> builds, and its shape is what <em>OpenAPI Design Tutor</em> designs.</p>
<h2>You might not need an effect</h2>
<p>Effects are for talking to the outside. They are not for calculating one value from another (use a variable, as with <code>faults</code>) or for reacting to a click (use the event handler). Most bugs in beginners' React code come from effects that should not exist.</p>
<h2>Beyond useEffect for data</h2>
<p>Production applications usually load data through a library such as TanStack Query, or through a framework's own loaders, which add caching, retries and error handling. They are built on the ideas in this lesson.</p>`,
quiz:[{q:'What does the empty array in useEffect(() => { … }, []) mean?',opts:['The effect never runs','The effect runs once, after the component first appears','The effect runs on every render','The effect returns an empty list'],a:1,why:'The array lists what the effect depends on. With nothing listed, nothing can change to trigger it again.'},
{q:'Why is the state typed LogEntry[] | null instead of just LogEntry[]?',opts:['null uses less memory','To represent "not loaded yet", so the checker forces the loading case to be handled','Arrays cannot be stored in state','It makes the request faster'],a:1,why:'The type tells the truth about the two situations, and narrowing makes you deal with both.'}],
reading:[['React: Synchronizing with Effects','https://react.dev/learn/synchronizing-with-effects','What effects are for, dependencies and cleanup.'],['React: You Might Not Need an Effect','https://react.dev/learn/you-might-not-need-an-effect','The cases where an effect is the wrong tool.'],['TypeScript Handbook: Narrowing','https://www.typescriptlang.org/docs/handbook/2/narrowing.html','How checks in your code refine a type.']]},

{title:'Own it',long:'Make a stock component your own',mins:14,
idea:`<p>In <em>Tailwind + shadcn/ui from Zero</em> you drew Button, Card and Input from stores and used them as they came. Sooner or later a design needs something the stock part does not do: a look that is not on the list, or a behaviour nobody shipped. Because shadcn/ui copies each component's <strong>source file into your project</strong>, you are allowed to change it. This lesson shows how, and when to change the file versus build around it.</p>
<p>There are two moves, and they answer two different needs:</p>
<div class="tscroll"><table class="types"><thead><tr><th>Move</th><th>Use it when</th><th>Example in this lesson</th></tr></thead><tbody>
<tr><td><strong>Edit the file</strong></td><td>Every use of the component should gain the option</td><td>A new <code>scram</code> variant on Button</td></tr>
<tr><td><strong>Wrap it</strong> in a component of your own</td><td>Only some uses need extra behaviour, and the stock part should stay stock</td><td><code>ConfirmButton</code>: press once to arm, again to fire</td></tr>
</tbody></table></div>
<h2>The anatomy of a stock component</h2>
<p>Every shadcn/ui component has the same four parts. Learn to spot them and you can change any of them.</p>
<pre class="file">type ButtonProps = ComponentProps&lt;'button'&gt; &amp; {
  variant?: keyof typeof variants
}

function Button({ className, variant = 'default', ...props }: ButtonProps) {
  return &lt;button className={cn('button', variants[variant], className)} {...props} /&gt;
}</pre>
<dl class="terms">
<dt>ComponentProps&lt;'button'&gt;</dt><dd>A type React provides: every prop a real <code>&lt;button&gt;</code> accepts (<code>onClick</code>, <code>disabled</code>, <code>type</code>, <code>aria-label</code> and the rest). The <code>&amp;</code> joins it to the component's own props. This is why you can put <code>onClick</code> on a Button nobody wrote an <code>onClick</code> for.</dd>
<dt>A variants table</dt><dd>A plain object mapping a name to class names. <code>keyof typeof variants</code> turns its keys into a union type, so adding a row adds an allowed value. shadcn/ui builds this table with a helper called <code>cva</code>.</dd>
<dt>...props (rest and spread)</dt><dd>In the parameter list, <code>...props</code> collects every prop you did not name. On the element, <code>{...props}</code> hands them all on. The component stays out of the way of anything it does not handle.</dd>
<dt>cn(…, className)</dt><dd>Merges the component's classes with any the caller passes, caller last. This is the door for one-off adjustments from outside.</dd>
</dl>
<div class="preface"><b>Stand-in</b>The practice cockpit has no Tailwind, so the Button here is a stand-in with the same anatomy as shadcn/ui's, styled by classes in <code>index.css</code>. Every change you make to it is made the same way in <code>src/shared/ui/button.tsx</code> in the console project. The notes below put the two side by side.</div>
${say('ilse','I want a scram control on the main display. It should not look like any other button on this suit, and nobody should be able to hit it by accident.')}
${say('tomo','Two different jobs. The look goes in the button file, so the whole suit can use it. The safety goes in a wrapper, because the other buttons must not start asking for a second press.')}`,
labIntro:'You will draw the stock button, use it as it comes, change its look in its own file, then build a wrapper that changes how it behaves. Watch screen 3.',
tasks:[
E_('s8a','Draw the stock Button from stores','Three files: <code>Button.tsx</code>, the small <code>cn.ts</code> helper it uses, and the button styles added to <code>index.css</code>. In the console project the command <code>npx shadcn@latest add button</code> writes the equivalent files for you. Read <code>Button.tsx</code> and find the four parts.','Saved. Nothing on screen changed: nothing imports the button yet.'),
E_('s8b','Use it as it comes','A scram control on the main display, with the stock <code>destructive</code> variant. Note that Button never mentions <code>onClick</code> or <code>children</code>: both arrive through <code>...props</code>.','A red Scram button under the throttle.'),
{kind:'do',clicks:1,hint:'Press Scram on the live screen below.',what:'Press Scram on the live screen',why:'One press, and watch the reactor output, the throttle lever on the blueprint, and how easy that was to do by accident.',saw:'Reactor output dropped to 0% on a single press. It works, it looks like every other destructive button, and one stray tap shuts the reactor down. Ilse asked for better on both counts.',test:(v)=>v===0},
E_('s8c','Change the look: add a variant of your own','One new row in the variants table, <code>scram</code>, and the classes it stands for in <code>index.css</code>. Then <code>MainDisplay</code> asks for it. You are editing the component\'s own file, which is exactly what it is there for.','The button now wears the hazard livery. Because the type of <code>variant</code> is read from the table, <code>"scram"</code> became an allowed value the moment you added the row, and a typo such as <code>"scarm"</code> would be a type error.'),
E_('s8d','Change the behaviour: wrap it in ConfirmButton','A new component that renders the stock Button and adds what it lacks. It keeps one piece of state, <code>armed</code>. The first press arms it and swaps the label; a second press within three seconds calls <code>onConfirm</code>; an effect stands it down if the second press never comes. <code>Button.tsx</code> is not touched.','Same livery, new behaviour. Its props type is <code>ComponentProps&lt;typeof Button&gt;</code> plus two of its own, so <code>variant="scram"</code> still works on it and is still checked.'),
{kind:'do',clicks:2,hint:'Press Scram, then Confirm scram, on the live screen below.',what:'Press Scram, then confirm',why:'Press once and read the button. Press again before the bar at its bottom edge runs out. Then try pressing once and waiting.',saw:'The first press only armed the control and changed its label. The second fired <code>onConfirm</code> and the reactor went to 0%. Left alone, it stands down after three seconds. Because the behaviour is built on <code>onClick</code>, it works the same with a mouse, a finger, or the keyboard.',test:(v)=>v===0},
C_('npx tsc -b','Type-check the new parts','Two new components and a changed one. The checker follows the props through the wrapper.','Clean. Leave out <code>confirmLabel</code> or <code>onConfirm</code> on a ConfirmButton and this is where you would be told.',r=>r.meta.cmd==='tsc'&&r.meta.errors===0)
],
notes:`<h2>The same moves in the real file</h2>
<p>This is the Button that shadcn/ui writes to <code>src/shared/ui/button.tsx</code> in the console project, trimmed, with a <code>scram</code> row added. The parts are the ones you just worked on.</p>
<pre class="file">const buttonVariants = cva(
  "inline-flex items-center justify-center rounded-md text-sm font-medium …",
  {
    variants: {
      variant: {
        default: "bg-primary text-primary-foreground hover:bg-primary/90",
        destructive: "bg-destructive text-white hover:bg-destructive/90",
        scram: "border border-brand bg-background uppercase tracking-widest text-brand",
      },
      size: { default: "h-9 px-4", sm: "h-8 px-3 text-xs" },
    },
    defaultVariants: { variant: "default", size: "default" },
  }
)

function Button({ className, variant, size, ...props }) {
  return (
    &lt;ButtonPrimitive className={cn(buttonVariants({ variant, size }), className)} {...props} /&gt;
  )
}</pre>
<div class="tscroll"><table class="types"><thead><tr><th>In this lesson</th><th>In the console project</th></tr></thead><tbody>
<tr><td>The <code>variants</code> object</td><td>The <code>variants</code> block inside <code>cva(…)</code>. One table per prop, so <code>variant</code> and <code>size</code> combine.</td></tr>
<tr><td>Class names defined in <code>index.css</code></td><td>Tailwind classes written in place, using tokens (<code>bg-brand</code>), never raw colours.</td></tr>
<tr><td><code>cn()</code> in <code>cn.ts</code></td><td><code>cn()</code> in <code>src/lib/utils.ts</code>. It also settles clashes, so a caller's <code>px-6</code> replaces the component's <code>px-4</code>.</td></tr>
<tr><td>A plain <code>&lt;button&gt;</code></td><td><code>ButtonPrimitive</code> from the library underneath, which supplies keyboard, focus and disabled handling.</td></tr>
<tr><td><code>ConfirmButton.tsx</code> beside the others</td><td>The same file, in the feature that needs it, or in <code>src/shared/ui</code> if several features do.</td></tr>
</tbody></table></div>
<h2>Three ways to change a component, mildest first</h2>
<ol>
<li><strong>Pass <code>className</code> at the call site.</strong> For a one-off: this one button needs more top margin. Nothing else changes.</li>
<li><strong>Edit the component's file.</strong> For a look or option the whole product should have: a variant, a size, a different base style. Change it once and every use can ask for it.</li>
<li><strong>Wrap it.</strong> For behaviour that only some uses need: confirming, loading, counting, remembering. The wrapper owns the state; the stock part stays simple.</li>
</ol>
<p>If you find yourself passing the same long <code>className</code> in several places, that is a variant asking to be written.</p>
<h2>What a good wrapper does</h2>
<ul>
<li><strong>Takes the inner component's props.</strong> <code>ComponentProps&lt;typeof Button&gt;</code> means "whatever Button accepts". If Button gains a size next month, ConfirmButton accepts it with no edit.</li>
<li><strong>Names only the props it handles</strong> and passes the rest on with <code>{...props}</code>.</li>
<li><strong>Still calls the caller's handler.</strong> <code>onClick?.(event)</code> runs the caller's <code>onClick</code> if one was given. The <code>?.</code> skips the call when it is undefined. Swallowing it would surprise whoever uses your component.</li>
<li><strong>Merges <code>className</code></strong> so the caller can still adjust it.</li>
<li><strong>Cleans up.</strong> The effect's timer is cleared if the button is disarmed or removed first, as in lesson 8.</li>
</ul>
<h2>Keep what the stock part gave you</h2>
<p>A stock component carries behaviour you never see: it can be reached with Tab, pressed with Enter or Space, announced by a screen reader, and disabled. When you change behaviour, build on the events that already work for everyone, as <code>onClick</code> does. A press-and-hold built only on pointer events would have locked out keyboard users. If the label changes, as it does here, the new label is what assistive technology reads, so make it say what the next press will do.</p>
<h2>Rules stay out of the button</h2>
<p>ConfirmButton decides how the pilot gives an order. It does not decide whether the order is allowed. In the simulator, <code>onConfirm</code> would send the order to the flight core, and the core's answer is what the screen shows.</p>
<h2>Your edits and future updates</h2>
<p>The file is a copy, so nothing updates it behind your back, and nothing brings you upstream fixes either. Adding the same component again can overwrite the file, so commit your version first and compare the two in git. A wrapper is untouched by that, which is one more reason to keep added behaviour out of the stock file.</p>`,
quiz:[{q:'Only the scram control needs a second press to confirm. Where does that behaviour belong?',opts:['Inside Button.tsx, switched on by a prop','In a wrapper component that renders Button','In index.css','In App, for every button on the page'],a:1,why:'Behaviour that a few uses need goes in a wrapper. The stock component stays simple, and a re-added Button cannot wipe it out.'},
{q:'What does ComponentProps<typeof Button> give ConfirmButton?',opts:['A copy of Button\'s code','The type of every prop Button accepts, kept in step automatically','Faster rendering','A default value for each prop'],a:1,why:'The wrapper\'s props are defined in terms of the inner component\'s, so variant and the native button props stay available and checked.'},
{q:'Why does ConfirmButton call onClick?.(event) before its own logic?',opts:['React requires it','So a handler the caller passed still runs','To cancel the click','To make the button keyboard accessible'],a:1,why:'The wrapper took onClick out of the props to add its own. Calling the caller\'s version keeps the component behaving like a button from the outside.'}],
reading:[['React: Passing Props to a Component','https://react.dev/learn/passing-props-to-a-component','Includes forwarding props with the spread syntax and passing JSX as children.'],['React: Using TypeScript','https://react.dev/learn/typescript','Typing props, children and event handlers.'],['shadcn/ui documentation','https://ui.shadcn.com/docs','How components are added to a project and why the code is yours to change.'],['Class Variance Authority','https://cva.style/docs','The helper behind the variants table in shadcn/ui components.']]},

{title:'Team',long:'One part, one home: keeping a team on the same components',mins:13,
idea:`<p>Stock parts take care of themselves. Everyone on the team runs the same <code>add</code> command and gets the same Button. The parts you make your own are different: <code>ConfirmButton</code> exists in one file that one person wrote, and the rest of the team has to <strong>know it is there</strong> and <strong>choose to use it</strong>. In practice they often do neither, and a second, slightly different confirm button appears. Then a third.</p>
<p>Nobody does this out of spite. It happens for ordinary reasons, and each one has an ordinary fix:</p>
<div class="tscroll"><table class="types"><thead><tr><th>Why a teammate rebuilds it</th><th>The guard</th></tr></thead><tbody>
<tr><td>They did not know it existed</td><td><strong>One home</strong> and a <strong>catalogue</strong> you can look at</td></tr>
<tr><td>Writing a new one was quicker than finding the old one</td><td>One short import path that is the same everywhere</td></tr>
<tr><td>Nothing stopped them</td><td>A <strong>lint rule</strong>, so the machine says so before a reviewer has to</td></tr>
<tr><td>The shared one did not quite fit</td><td>An agreed route to <strong>extend</strong> it (lesson 9) and a named owner to ask</td></tr>
<tr><td>An AI agent wrote it and was never told</td><td>A line in <code>AGENTS.md</code></td></tr>
</tbody></table></div>
<dl class="terms">
<dt>Shared component (a part on the parts list)</dt><dd>A component more than one feature uses. In the console project its home is <code>src/shared/ui</code>.</dd>
<dt>Barrel file</dt><dd>A file that only re-exports things from other files, so there is one place to import from. Here it is <code>parts.ts</code>.</dd>
<dt>Component catalogue</dt><dd>A page that shows every shared component in every variant. Storybook is the well-known tool for it; a plain page in the app does the same job on a small team.</dd>
<dt>Linter</dt><dd>A tool that reads the code and reports patterns the team has ruled out. The scaffold installed one, oxlint, and <code>npm run lint</code> runs it.</dd>
<dt>Drift</dt><dd>What happens when two copies of the same idea are changed separately. They start identical and stop being so.</dd>
</dl>
<p>Inside one repository there is no "version" problem as such: everyone who pulls <code>main</code> has the same <code>ConfirmButton.tsx</code>. The problem is <strong>copies</strong>. So the goal of this lesson is one copy, easy to find, with the machine watching for a second.</p>
${say('tomo','Night shift added a confirm step to the systems screen. Good instinct. But they built their own, and it does not stand down. Two confirm buttons on one suit, and they already disagree.')}
${say('ilse','If my parts list is hard to find, that one is on me. Put it where nobody can miss it, then make the linter the one who says no.')}`,
labIntro:'You will see drift happen, give the shared parts one front door and a catalogue, add a lint rule, and let it find the duplicate. Watch screen 2, and the new catalogue under the control screens.',
tasks:[
E_('s9a','Pull the night shift\'s change','A teammate added an "Acknowledge faults" control to the systems screen. Read the edit: a raw <code>&lt;button&gt;</code>, its own <code>sure</code> state, and the stock classes typed by hand. It is a second ConfirmButton, written from scratch.','Screen 2 has a new red button. It passes the type checker and it works, which is why this kind of duplicate gets merged.'),
{kind:'do',clicks:1,sel:'.systems button',hint:'Press Acknowledge faults once on the live screen below, then wait.',what:'Press it once, and wait',why:'Press "Acknowledge faults" a single time. Then press Scram once on the main display and watch both for a few seconds.',saw:'Scram stood down after three seconds. "Sure?" is still armed and will stay armed until someone presses it, perhaps by accident an hour from now. Same idea, two behaviours, and the label wording differs too. That is drift on day one.',test:(v,root)=>/Sure\?/.test(root.textContent)},
E_('s9b','Give the parts one front door, and a catalogue','<code>parts.ts</code> re-exports every shared control, so there is one import to remember. <code>PartsCatalogue.tsx</code> renders one of everything, and <code>App</code> shows it. <code>MainDisplay</code> now imports from the front door too.','A Parts catalogue panel appeared below the Comms screen (scroll the control screens down to see it): four Button variants and a ConfirmButton you can press. Anyone wondering "do we have one of these?" can now look instead of ask.'),
E_('s9c','Add a rule the linter enforces','Two additions to <code>.oxlintrc.json</code>, the linter\'s settings file in the project root. <code>react/forbid-elements</code> bans a raw <code>&lt;button&gt;</code> and says what to use instead. The <code>overrides</code> block switches the rule off for <code>Button.tsx</code>, the one file that is supposed to contain a real button.','Saved. Nothing has been checked yet: the linter runs when you ask it to.'),
C_('npm run lint','Run the linter','Runs the <code>lint</code> script from package.json, which is <code>oxlint</code>.','One error, with file, line and column: <code>src/SystemsPanel.tsx:25:10</code>, and your own message telling the author what to use. The night shift would have seen this before opening a pull request.',r=>r.meta.cmd==='lint'&&r.meta.errors===1),

{kind:'do',clicks:2,sel:'.systems button',hint:'Press Acknowledge faults, then Confirm acknowledge, on the live screen below.',what:'Acknowledge the fault, with the shared part',why:'Press "Acknowledge faults", then confirm before it stands down.',saw:'"Faults acknowledged." Both dangerous controls on the suit now arm, confirm and stand down the same way, because they are the same code. Change <code>ConfirmButton.tsx</code> and both change.',test:(v,root)=>/Faults acknowledged/.test(root.textContent)}

notes:`<h2>The five guards, in the console project</h2>
<ol>
<li><strong>One home.</strong> Shared parts live in <code>src/shared/ui</code> and are imported as <code>@/shared/ui/…</code>. A component starts life inside the feature that needs it. The day a second feature wants it, it moves to <code>shared/ui</code>; it is never copied.</li>
<li><strong>A catalogue.</strong> A page that renders every shared part in every variant, kept in the repository so it cannot go stale without someone noticing. On a real project this is a route only shown in development, or Storybook. It doubles as the place a designer checks the build against the Figma library, so give the parts the <strong>same names</strong> in both.</li>
<li><strong>A lint rule.</strong> Rules like the one you added turn "please use the shared button" from a request into a failed check. Run the linter in CI (<em>CI from Zero</em>) so a duplicate cannot be merged by accident.</li>
<li><strong>An owner.</strong> Someone has to be the person you ask. On GitHub a <code>CODEOWNERS</code> file names them, and with branch protection switched on, a change to the shared parts needs their review:
<pre class="file"># .github/CODEOWNERS
/cockpit/src/shared/ui/  @ilse-varga</pre></li>
<li><strong>A line for the agents.</strong> A coding agent will happily write a fourth confirm button. Tell it not to, in the file it reads first (<em>Agent Files Tutor</em>):
<pre class="file">## Code style
- Use the components in src/shared/ui before writing a new one.
- Never use a raw &lt;button&gt;. If no shared part fits, ask first.</pre></li>
</ol>
<h2>When the shared part does not quite fit</h2>
<p>This is the moment duplicates are born, so decide the route in advance. In order of preference:</p>
<ol>
<li>Pass a prop or <code>className</code> it already accepts.</li>
<li>Extend the shared part, with a new variant or prop, in a pull request the owner reviews. Everyone gains the option.</li>
<li>Wrap it, as lesson 9 did, and put the wrapper on the parts list.</li>
<li>Only if it is truly a different thing, build a new part, and add that to the parts list as well.</li>
</ol>
<p>"Copy the file and change it" is not on the list.</p>
<h2>Changing a shared part safely</h2>
<p>One copy means one edit reaches everything. That is the benefit, and also the risk. TypeScript carries most of it: rename a prop on <code>ConfirmButton</code> and <code>npx tsc -b</code> lists every screen that needs updating, in every feature, before anything ships. The catalogue shows you the visual result in every variant at once.</p>
<h2>Across more than one repository</h2>
<p>Everything above assumes one repository. When several projects need the same parts, the parts become a package with a version number that each project installs, or a private shadcn/ui registry that each project adds components from. Now "which version are you on?" is a real question, and the answer is written in each project's <code>package.json</code>. That is a later problem; do not reach for it until two repositories exist.</p>
<h2>About this practice project</h2>
<p>The practice cockpit keeps every file flat in <code>src</code>, so its front door is the single file <code>parts.ts</code>. In the console project the folder <code>src/shared/ui</code> plays that role, as laid out in <em>Project Structure from Zero</em>.</p>`,
quiz:[{q:'Everyone on the team has pulled main. What usually causes two teammates to be using "different versions" of a custom component?',opts:['Git gave them different files','One of them wrote or copied a second component instead of importing the shared one','Tailwind compiled it differently','Their browsers cached it'],a:1,why:'Within one repository everyone has the same file. The differences come from copies, which then drift apart.'},
{q:'What does the lint rule add that a note in the README does not?',opts:['It makes the code run faster','It checks every file automatically and fails with a message, in the editor and in CI','It writes the shared component for you','It replaces code review'],a:1,why:'A written rule relies on people remembering it. A lint rule is applied to every change without anyone having to notice.'},
{q:'The shared ConfirmButton nearly fits, but a new screen needs a different stand-down time. What is the best move?',opts:['Copy ConfirmButton.tsx into the feature and edit the copy','Write a new one with a raw button','Add a prop for the time to the shared ConfirmButton, in a reviewed pull request','Switch the lint rule off for that file'],a:2,why:'Extending the shared part keeps one copy and gives every screen the option. A copy starts drifting the day it is made.'}],
reading:[['Oxlint: configuration','https://oxc.rs/docs/guide/usage/linter/config','The settings file, rules, plugins and overrides.'],['GitHub: About code owners','https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners','How a CODEOWNERS file assigns reviewers to parts of a repository.'],['Storybook: Why Storybook?','https://storybook.js.org/docs/get-started/why-storybook','The case for a component catalogue, from the best-known tool for building one.'],['shadcn/ui documentation','https://ui.shadcn.com/docs','Includes how to publish your own components through a registry.']]},

{title:'Build',long:'Build and ship',mins:8,
idea:`<p>The dev server is for you. Pilots get a <strong>production build</strong>: the same application, type-checked, converted to plain JavaScript, bundled into a few small files and compressed.</p>
<p>The <code>build</code> script in package.json is two commands joined by <code>&amp;&amp;</code>:</p>
<pre class="file">tsc -b &amp;&amp; vite build</pre>
<p>First the type checker. Only if it passes does Vite bundle. A project with a type error cannot be built, which is exactly the guarantee Tomo wanted in lesson 1.</p>
${say('ilse','Four screens, each one a part I can redraw on its own. That is the cockpit I designed.')}
${say('tomo','And every plug checked against its spec sheet before it leaves the hangar. Good work.')}`,
labIntro:'Last lab. The dev server keeps running while you build.',
tasks:[
C_('npm run build','Build for production','Runs <code>tsc -b</code>, then <code>vite build</code>.','28 modules became three files. The JavaScript is about 223 kB, or 70 kB compressed (gzip), and nearly all of it is React itself.',r=>r.meta.cmd==='build'&&r.ok),
C_('ls dist','Look at the result','<code>dist</code> is the output folder.','<code>index.html</code> plus an <code>assets</code> folder. This folder is the entire deliverable.'),
C_('ls dist/assets','Look at the bundles','The compiled JavaScript and CSS.','The odd characters in the file names are a hash of the contents. Change the code and the name changes, so browsers can cache these files forever and still pick up every new release.'),
C_('cat dist/index.html','Read the built page','The page a pilot\'s browser actually loads.','The same near-empty page as before, now pointing at the bundled files. No TypeScript, no JSX, no node_modules.')
],
notes:`<h2>Shipping it</h2>
<p><code>dist/</code> is static files. Any web server can serve them. A common setup is a two-stage Dockerfile: one stage builds with Node, the second serves <code>dist/</code> with NGINX. The earlier guides cover each piece: <em>Docker from Zero</em>, <em>NGINX from Zero</em>, <em>CI from Zero</em> and <em>Cloud Deploy from Zero</em>. <code>npm run build</code> is the step CI runs, and a type error fails the pipeline.</p>
<h2>What you built</h2>
<p>A component tree with <code>App</code> at the root; typed props flowing down; one piece of shared state with a callback flowing up; a list drawn from typed data; and a screen that loads from outside through an effect. Every React application is these same pieces, more of them.</p>
<h2>Where next</h2>
<ul>
<li><strong>Styling and ready-made components:</strong> you met them in <em>Tailwind + shadcn/ui from Zero</em>, and lessons 9 and 10 showed how to change them and keep a team on the same ones.</li>
<li><strong>More than one page:</strong> a router (React Router or TanStack Router), or a framework such as Next.js that includes one.</li>
<li><strong>Forms:</strong> controlled inputs as in lesson 6, then a form library once validation grows.</li>
<li><strong>Testing:</strong> <em>Playwright + pytest from Zero</em> tests this kind of interface from the outside, in a real browser.</li>
</ul>
<h2>Cheat sheet</h2>
<div class="cheats" id="cheats"></div>`,
quiz:[{q:'Why does the build script run tsc -b before vite build?',opts:['To make the bundle smaller','So that a type error stops the build before anything is shipped','Because Vite cannot read .tsx files','To start the dev server'],a:1,why:'Vite only strips types. Putting the checker first, joined by &&, turns type errors into failed builds.'}],
reading:[['Vite: Building for Production','https://vite.dev/guide/build.html','What vite build does and how to configure it.'],['Vite: Deploying a Static Site','https://vite.dev/guide/static-deploy.html','Putting dist/ on common hosts.'],['React TypeScript Cheatsheets','https://react-typescript-cheatsheet.netlify.app/','A community reference for typing every React pattern you will meet.'],['The TypeScript Handbook','https://www.typescriptlang.org/docs/handbook/intro.html','The full language, in order.']]}
];

const G={i:0,pos:0,sim:null,done:new Set(),busy:false,answers:{}};
try{JSON.parse(localStorage.getItem('rts-done')||'[]').forEach(x=>G.done.add(x));}catch(e){}
const save=()=>{try{localStorage.setItem('rts-done',JSON.stringify([...G.done]));}catch(e){}};
const tout=()=>$('#term-out');
function addLine(text,cls){const d=document.createElement('div');d.className='tl'+(cls?' '+cls:'');d.textContent=text;tout().appendChild(d);tout().scrollTop=tout().scrollHeight;return d;}
async function printOut(text,ok){
  for(const line of text.split('\n')){
    if(line[0]==='\u0002'){await sleep(+line.slice(1));continue;}
    if(line[0]==='\u0003'){const k=line.indexOf('|'),ms=+line.slice(1,k),label=line.slice(k+1);
      const d=addLine('','prog');d.innerHTML='<span class="track"><span class="fill"></span></span><span></span>';d.lastChild.textContent=label;
      const f=d.querySelector('.fill');f.style.transitionDuration=ms+'ms';void f.getBoundingClientRect;f.style.width='100%';await sleep(ms);d.className='tl';d.textContent=label;continue;}
    addLine(line,/^sandbox:/.test(line)?'note':ok?'':'err');await sleep(26);
  }
}
function setBusy(b){G.busy=b;$('#term-form').classList.toggle('busy',b);}
async function run(line){
  line=line.trim().replace(/\s+/g,' ');if(!line||G.busy)return;
  setBusy(true);addLine($('#prompt').textContent+' '+line,'in');
  const before={stage:G.sim.s.stage,dev:G.sim.s.dev},r=G.sim.exec(line);r.line=line;
  if(r.clear)tout().textContent='';else await printOut(r.out,r.ok);
  if(G.sim.s.dev!==before.dev||G.sim.s.stage!==before.stage){mountApp(G.sim);refit();renderSource(G.sim);}
  syncMap(G.sim,true);setBusy(false);
  const t=task();if(t&&t.kind==='cmd'&&t.test(r,G.sim.s))await advance();
}
async function applyEdit(){
  const t=task();if(!t||t.kind!=='edit'||G.busy)return;
  setBusy(true);const r=G.sim.edit(t.stage);
  addLine('saved '+DATA.stages[t.stage].changed.map(P_).join(', '),'note');
  mountApp(G.sim);refit();renderSource(G.sim);syncMap(G.sim,true);
  await printOut(r.out,true);setBusy(false);await advance();
}
const task=()=>LESSONS[G.i].tasks[G.pos];
async function advance(){
  const t=task();addLine('✓ '+t.what,'ok');G.pos++;
  if(G.pos>=LESSONS[G.i].tasks.length){G.done.add(G.i);save();renderNav();}
  renderTasks();
  const now=document.querySelector('.task.now, .banner.fin');if(now&&now.scrollIntoView&&window.innerWidth>=1040)now.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function load(cmd){const inp=$('#term-input');inp.value=cmd;if(!coarse)inp.focus();if(window.innerWidth<1040&&inp.scrollIntoView)$('#term-form').scrollIntoView({block:'center',behavior:'smooth'});}
function editBlock(t,open){
  const S=DATA.stages[t.stage];
  return S.changed.map(f=>{const isNew=S.added[f].length===S.files[f].replace(/\n$/,'').split('\n').length;
    return '<details class="edit"'+(open?' open':'')+'><summary>'+P_(f)+' <span class="pill '+(isNew?'ok':'warn')+'">'+(isNew?'new file':'changed')+'</span></summary><div class="code">'+codeHtml(f,S.files[f],isNew?[]:S.added[f])+'</div></details>';}).join('');
}
function renderTasks(){
  const L=LESSONS[G.i],ol=$('#tasks');if(!ol)return;
  ol.innerHTML=L.tasks.map((t,n)=>{
    const st=n<G.pos?'done':n===G.pos?'now':'todo',kind=t.kind==='cmd'?'command':t.kind==='edit'?'edit':'on the live screen';
    let body='<p class="why">'+t.why+'</p>';
    if(t.kind==='cmd')body+='<button class="cmd'+(st==='now'?' next':'')+'" data-cmd="'+esc(t.cmd)+'"><span class="tap">tap to load into the terminal</span><code>'+esc(t.cmd)+'</code></button>';
    if(t.kind==='edit')body+=editBlock(t,st==='now')+(st==='done'?'':'<button class="btn'+(st==='now'?' next':'')+'" data-edit="'+n+'"'+(st==='now'?'':' disabled')+'>'+(st==='now'?'Apply edit':'Apply edit (after the steps above)')+'</button>');
    if(st==='done')body+='<p class="saw">'+t.saw+'</p>';
    return '<li class="task '+st+'"><div class="task-h"><span class="mark">'+(st==='done'?'✓':n+1)+'</span><div><span class="kind">'+kind+'</span><span class="what">'+t.what+'</span></div></div>'+body+'</li>';
  }).join('')+(G.pos>=L.tasks.length?'<li class="banner fin">Lab complete. The notes below fill in the detail.</li>':'');
  const sb=$('#stepbar'),t=task();
  if(!t)sb.innerHTML='<span class="sb-h">Lab complete</span><span class="sb-w">Scroll on for the notes and the quiz.</span>';
  else sb.innerHTML='<span class="sb-h">Step '+(G.pos+1)+' of '+L.tasks.length+'</span><span class="sb-w">'+t.what+'</span>'+(t.kind==='cmd'?'<button class="cmd" data-cmd="'+esc(t.cmd)+'"><span class="tap">tap to load</span><code>'+esc(t.cmd)+'</code></button>':t.kind==='edit'?'<button class="btn" data-edit="'+G.pos+'">Apply edit</button>':'<span class="hint">'+(t.hint||'Use the slider on the live screen below.')+'</span>');
}
function renderNav(){
  $('#nav').innerHTML=LESSONS.map((L,n)=>'<a class="nav-item'+(n===G.i?' active':'')+(G.done.has(n)?' done':'')+'" href="#lesson-'+(n+1)+'"><span class="num">'+(G.done.has(n)?'✓':n+1)+'</span>'+L.title+'</a>').join('');
  $('#progress-text').textContent=G.done.size+'/'+LESSONS.length+' labs done';
  $('#progress-bar').style.width=(G.done.size/LESSONS.length*100)+'%';
  const a=document.querySelector('.nav-item.active');if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'});
}
function renderQuiz(){
  const L=LESSONS[G.i];
  $('#quiz').innerHTML=L.quiz.map((q,n)=>{const got=G.answers[G.i+'-'+n];
    return '<div class="q"><p class="qt">'+esc(q.q)+'</p><div class="opts">'+q.opts.map((o,k)=>'<button class="opt'+(got===undefined?'':k===q.a?' right':k===got?' wrong':'')+'" data-q="'+n+'" data-k="'+k+'">'+esc(o)+'</button>').join('')+'</div>'+(got===undefined?'':'<p class="fb '+(got===q.a?'good':'bad')+'">'+(got===q.a?'Correct. ':'Not quite. ')+esc(q.why)+'</p>')+'</div>';}).join('');
}
const BENCH=$('#bench-in');
function placeBench(){
  const b=BENCH,wide=window.innerWidth>=1040,target=wide?$('#bench'):$('#slot');
  if(target&&b.parentNode!==target)target.appendChild(b);
}
function go(i){
  G.i=Math.max(0,Math.min(LESSONS.length-1,i));G.pos=0;
  const sim=G.sim=createSim();sim.s.booting=true;
  for(let k=0;k<G.i;k++)LESSONS[k].tasks.forEach(t=>{if(t.kind==='cmd')sim.exec(t.cmd);else if(t.kind==='edit')sim.edit(t.stage);});
  sim.s.booting=false;sim.s.lastEdit=null;
  const L=LESSONS[G.i];
  if(BENCH.parentNode!==$('#bench'))$('#bench').appendChild(BENCH);
  $('#main').innerHTML='<article><p class="eyebrow">lesson '+(G.i+1)+' of '+LESSONS.length+' · about '+L.mins+' min</p><h1>'+L.long+'</h1><div class="prose">'+L.idea+'</div>'
    +'<h2>Lab</h2><p>'+L.labIntro+'</p><ol class="tasks" id="tasks"></ol><div class="slot-sec"><div class="slot" id="slot"></div></div>'
    +'<div class="prose">'+L.notes+'</div><h2>Check yourself</h2><div id="quiz"></div><h2>Further reading</h2><ul class="reading">'+L.reading.map(r=>'<li><a href="'+r[1]+'" target="_blank" rel="noopener">'+esc(r[0])+'</a><span>'+esc(r[2])+'</span></li>').join('')+'</ul>'
    +'<div class="pager">'+(G.i?'<a class="btn ghost" href="#lesson-'+G.i+'">← '+LESSONS[G.i-1].title+'</a>':'<span></span>')+(G.i<LESSONS.length-1?'<a class="btn" href="#lesson-'+(G.i+2)+'">'+LESSONS[G.i+1].title+' →</a>':'<span></span>')+'</div></article>';
  const ch=$('#cheats');
  if(ch){let h='',grp='';CHEATS.forEach(c=>{if(c[0]!==grp){if(grp)h+='</dl>';grp=c[0];h+='<h3>'+grp+'</h3><dl class="cheat">';}h+='<dt><code>'+esc(c[1])+'</code></dt><dd>'+esc(c[2])+'</dd>';});ch.innerHTML=h+'</dl>';}
  placeBench();
  tout().textContent='';addLine('sandbox: lesson '+(G.i+1)+'. '+(G.i<2?'A fresh workstation.':'The project is as you left it, and the dev server is running.')+' Type help for the commands.','note');
  live.seen={};live.counts={};view.file='App.tsx';
  mountApp(sim);renderSource(sim);syncMap(sim,false);renderTasks();renderQuiz();renderNav();
  $('#main').scrollTop=0;if(window.scrollTo)try{window.scrollTo(0,0);}catch(e){}
}
/* wiring */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-cmd]');if(c){load(c.dataset.cmd);return;}
  const ed=e.target.closest('[data-edit]');if(ed&&!ed.disabled){applyEdit().then(()=>{if(window.innerWidth<1040){const m=document.querySelector('.map');if(m&&m.scrollIntoView)m.scrollIntoView({block:'start',behavior:'smooth'});}});return;}
  const o=e.target.closest('.opt');if(o){const k=G.i+'-'+o.dataset.q;if(G.answers[k]===undefined){G.answers[k]=+o.dataset.k;renderQuiz();}return;}
  const p=e.target.closest('.ptab');if(p){document.querySelectorAll('.ptab').forEach(x=>x.setAttribute('aria-pressed',x===p));$('#pane-cockpit').hidden=p.dataset.pane!=='cockpit';$('#pane-source').hidden=p.dataset.pane!=='source';renderSource(G.sim);return;}
  const f=e.target.closest('.ftab');if(f){view.file=f.dataset.f;renderSource(G.sim);return;}
});
$('#term-form').addEventListener('submit',e=>{e.preventDefault();const inp=$('#term-input'),v=inp.value;inp.value='';run(v);});
$('#term-clear').addEventListener('click',()=>{tout().textContent='';});
$('#root').addEventListener('click',e=>{
  if(!e.target.closest('button'))return;
  setTimeout(()=>{const r=$('#root input[type=range]'),v=r?+r.value:NaN;syncMap(G.sim,false);const t=task();if(t&&t.kind==='do'&&t.clicks&&!G.busy&&t.test(v,$('#root')))advance();},0);
});
$('#root').addEventListener('input',e=>{
  if(e.target.type!=='range')return;const v=+e.target.value;
  setTimeout(()=>{syncMap(G.sim,false);const t=task();if(t&&t.kind==='do'&&!t.clicks&&!G.busy&&t.test(v))advance();},0);
});
new MutationObserver(list=>{
  if(live.quiet)return;const hit=new Set();
  list.forEach(m=>{if(m.type==='attributes'&&m.target.nodeName==='INPUT')return;const el=(m.target.nodeType===1?m.target:m.target.parentElement);const sc=el&&el.closest&&el.closest('.screen');if(!sc)return;SCREENS.forEach(([k])=>{if(sc.classList.contains(k))hit.add(k);});});
  if(!hit.size)return;hit.forEach(k=>{live.counts[k]=(live.counts[k]||0)+1;});
  if(G.sim)syncMap(G.sim,false);hit.forEach(flash);
}).observe($('#root'),{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class','style']});
const fromHash=()=>{const m=/^#lesson-(\d+)$/.exec(location.hash);return m?+m[1]-1:0;};
window.addEventListener('hashchange',()=>go(fromHash()));
let wideWas=window.innerWidth>=1040;
window.addEventListener('resize',()=>{const w=window.innerWidth>=1040;if(w!==wideWas){wideWas=w;placeBench();}});
window.__guide={G,go,run,applyEdit,LESSONS};
go(fromHash());

</script>
</body>
</html>
