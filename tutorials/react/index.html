<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React + TypeScript from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Same guide family as Cloud Deploy from Zero: lesson on the left; on the right a blueprint of the Kestrel cockpit and the live control screens above a terminal. On phones the bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#61dafb; --accent-ink:#04222b; --accent-soft:#0e2f3a;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);margin:0}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono);color:var(--muted);margin-left:auto}
.bar{flex-basis:100%;height:2px;background:var(--line);order:4}
#progress-bar{height:100%;width:0;background:var(--good);transition:width .3s}
#nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:thin;flex:1 1 100%;order:3}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font:400 .82rem var(--mono);white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:28px;height:24px;border-radius:3px;background:var(--sunk);font:500 .75rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.eyebrow{font:500 .8rem var(--mono);color:var(--good);margin:12px 0 4px}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em;margin:0 0 16px;text-wrap:balance}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);margin:36px 0 8px;padding-top:20px;border-top:1px solid var(--line);text-wrap:balance}
h2::before{content:"## ";color:var(--muted);font-weight:400}
h3{font:600 1rem/1.3 var(--mono);margin:20px 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.saw code,.say code{background:var(--sunk);padding:1px 5px;border-radius:4px;color:#b6ecfb}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font:600 .92rem var(--mono)}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--line)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px;font-size:.82rem}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font:500 .92rem var(--mono);text-decoration:none}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.mini{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font:400 .85rem var(--mono)}
.pill{display:inline-block;font:500 .7rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
table.types{border-collapse:collapse;width:100%;font-size:.92rem;margin:0 0 12px}
table.types th{text-align:left;font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 10px 4px 0}
table.types td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top}
.tscroll{overflow-x:auto}
/* crew */
.crew{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:0 0 16px}
.member{display:flex;gap:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:12px}
.member b{font:700 .95rem var(--mono);display:block}
.member .role{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);display:block;margin-bottom:4px}
.member p{margin:0;font-size:.9rem;color:var(--muted)}
.av{flex:none;width:56px;height:56px;border-radius:4px;border:1px solid #2a5a96;background:linear-gradient(#134177 1px,transparent 1px) 0 0/100% 8px,linear-gradient(90deg,#134177 1px,transparent 1px) 0 0/8px 100%,#0b2f5c}
.av svg{display:block;width:100%;height:100%}
.avl{fill:#0e3a6e;stroke:#e6f2ff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.avf{fill:#08264a;stroke:#e6f2ff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.avn{fill:none;stroke:#e6f2ff;stroke-width:1.4;stroke-linecap:round}
.ava{fill:none;stroke:#8ff6ff;stroke-width:1.6;stroke-linecap:round}
.avt{fill:#ffd27a;stroke:#e6f2ff;stroke-width:1.2}
.say{display:flex;gap:12px;align-items:flex-start;margin:16px 0;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 4px 4px 0;padding:10px 12px}
.say.tomo{border-left-color:var(--warn)}
.say .av{width:44px;height:44px}
.say p{margin:0;font-size:.95rem}
.say b{font:700 .78rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);display:block}
.say.tomo b{color:var(--warn)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface);min-width:0}
.task.todo{opacity:.78}
.task.now{border-color:var(--accent);background:var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:3px;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font:600 .92rem var(--mono)}
.kind{font:500 .66rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.why{margin:8px 0 0;font-size:.92rem}
.saw{margin:8px 0 0;font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.saw::before{content:"\2713  ";color:var(--good)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0 0;background:var(--term);color:var(--term-ink);border:1px solid var(--term-line);border-radius:4px;padding:10px 12px}
.cmd code{background:none!important;padding:0!important;overflow-wrap:anywhere;font-size:.88rem;color:var(--good)!important}
.cmd code::before{content:"$ ";color:var(--term-dim)}
.cmd:hover{border-color:var(--accent)}
.tap{font:500 .68rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.next{outline:2px solid var(--good);outline-offset:3px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{outline-color:transparent}}
.edit{margin:10px 0 0;border:1px solid var(--term-line);border-radius:4px;background:var(--term);overflow:hidden}
.edit summary{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:7px 10px;font:500 .78rem var(--mono);cursor:pointer;background:var(--surface);list-style:none}
.edit summary::-webkit-details-marker{display:none}
.edit summary::before{content:"\25B8";color:var(--muted)}
.edit[open] summary::before{content:"\25BE"}
.edit summary .pill{font-size:.64rem}
.code{overflow:auto;padding:6px 0;font:400 .74rem/1.55 var(--mono);color:var(--term-ink);max-height:420px}
.pl{display:block;white-space:pre;padding-right:12px;border-left:3px solid transparent;min-width:max-content}
.pl.new{background:var(--good-soft);border-left-color:var(--good)}
.pl i{font-style:normal;display:inline-block;width:2.6em;text-align:right;padding-right:.8em;color:var(--term-dim);user-select:none}
.pl .k{color:#ffb86b}.pl .s{color:#e6c07b}.pl .c{color:var(--term-dim)}.pl .t{color:var(--accent)}
.task .btn{margin-top:10px}
.preface{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:4px;padding:10px 12px;margin:0 0 16px;font-size:.95rem;background:var(--surface)}
.preface b{color:var(--warn);font:600 .8rem var(--mono);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px}
.preface code{background:var(--sunk);padding:1px 5px;border-radius:4px;color:#b6ecfb}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin:12px 0;font-size:.95rem}
/* bench */
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .btn{align-self:flex-start;margin-top:6px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.map-head span{display:flex;flex-wrap:wrap;gap:4px}
.ptabs{display:flex;border-bottom:1px solid var(--line);background:var(--sunk)}
.ptab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;font:700 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ptab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--surface)}
.ptab.chg::after{content:" \25CF";color:var(--good)}
.pane{padding:10px;min-width:0;overflow:auto}
.pane[hidden]{display:none}
.duo{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.zh{font:700 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.kfig{border:1px solid #2a5a96;border-radius:4px;min-width:0;background:linear-gradient(#134177 1px,transparent 1px) 0 0/100% 20px,linear-gradient(90deg,#134177 1px,transparent 1px) 0 0/20px 100%,#0b2f5c}
.kfig svg{display:block;width:100%;height:auto}
.legend{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.legend li{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;background:var(--sunk);padding:4px 7px;min-width:0}
.legend li.on{border-left-color:var(--good)}
.legend li.danger{border-left-color:var(--bad)}
.legend li.hit{animation:glow .8s ease-out}
@keyframes glow{35%{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft)}}
.legend b{font:500 .74rem var(--mono);overflow-wrap:anywhere}
.legend .sub{flex-basis:100%;font:400 .66rem var(--mono);color:var(--muted)}
.bdg{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);font:700 .64rem var(--mono);background:var(--term)}
.legend li.on .bdg{border-color:var(--good)}
.bw{border:1px solid var(--line);border-radius:5px;overflow:hidden;min-width:0}
.bw-bar{display:flex;gap:8px;align-items:center;background:var(--sunk);padding:5px 8px}
.bw-bar::before{content:"\25CF \25CF \25CF";color:var(--line);font-size:.6rem;letter-spacing:1px}
.bw-url{flex:1;background:var(--term);border-radius:10px;padding:2px 10px;font:400 .7rem var(--mono);color:var(--term-ink)}
.bw-page{background:#020b10;padding:10px;min-height:120px}
.bw-off{font:400 .76rem var(--mono);color:var(--term-dim);text-align:center;padding:34px 8px;margin:0}
.ftabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ftab{font:500 .68rem var(--mono);padding:3px 8px;border-radius:3px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.ftab[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ftab.chg::after{content:" \25CF";color:var(--good)}
.src{background:var(--term);border:1px solid var(--line);border-radius:4px}
.src .code{max-height:none}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--surface)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.term-out{height:220px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim)}
.tl.ok{color:var(--good);margin:4px 0}
.tl.prog{display:flex;gap:10px;align-items:center;color:var(--term-dim)}
.prog .track{flex:0 0 130px;height:8px;background:var(--term-line);border-radius:2px;overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--good);transition:width linear}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 .9rem var(--mono);color:var(--good);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:var(--good);color:#04121f;border:0;border-radius:4px;padding:8px 16px;font:600 .9rem var(--mono)}
.term-in.busy .run{opacity:.45}
/* quiz, reading, pager, cheats */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font:600 .92rem var(--mono)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem;padding:9px 12px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font:500 .9rem var(--mono)}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere;color:#b6ecfb}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (min-width:720px){.duo{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}}
@media (min-width:1040px){
  .app{height:100%}
  .work{grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:0}
  main.lesson{overflow:auto;border-right:1px solid var(--line);padding:8px 28px 72px}
  .bench{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:16px}
  .bench-in{flex:1;min-height:0}
  .map{flex:0 1 auto;max-height:68%}
  .pane{flex:1 1 auto;min-height:0}
  .term{flex:1 1 0;min-height:200px}
  .term-out{height:auto;flex:1 1 0;min-height:0}
  .stepbar,.slot-sec{display:none}
  #nav{flex:1 1 420px;order:0;padding:0 0 10px}
  #progress-text{order:2}
}
@media (max-width:1039px){.bench-in .stepbar{order:-1}}
/* ---- the cockpit blueprint ---- */
.ck .wh{fill:#0e3a6e}.ck .fr{fill:#08264a}.ck .tl2{fill:#12457f}
.ck .wh,.ck .fr,.ck .tl2{stroke:#e6f2ff;stroke-width:1.15;stroke-linejoin:round}
.ck .ln{fill:none;stroke:#9cc8f5;stroke-width:.7}
.ck .ctr{fill:none;stroke:#6fa3d8;stroke-width:.7;stroke-dasharray:14 3 2 3}
.ck .lbl{font:700 7.5px var(--mono);fill:#a9cdf3;text-anchor:middle;letter-spacing:.08em}
.ck .sc{fill:#08264a;stroke:#9cc8f5;stroke-width:1.2;stroke-dasharray:4 3;stroke-linejoin:round;transition:fill .5s,stroke .5s}
.ck .ui{fill:none;stroke:#8ff6ff;stroke-width:1.6;stroke-linecap:round;opacity:0;transition:opacity .5s}
.ck .scr.on .sc{fill:#06343f;stroke:#8ff6ff;stroke-dasharray:none;stroke-width:1.6;filter:url(#ckG)}
.ck .scr.on .ui{opacity:.9}
.ck .scr.danger .sc{fill:#3b1716;stroke:var(--bad)}
.ck .scr.danger .ui{stroke:var(--bad)}
.ck .scr.boot .sc{animation:ckboot 1s steps(1)}
@keyframes ckboot{0%,40%,70%{fill:#8ff6ff}20%,55%{fill:#08264a}85%{fill:#06343f}}
.ck .scr.hit .sc{animation:ckhit .7s ease-out}
@keyframes ckhit{30%{stroke:#fff;stroke-width:4;fill:#0d5a6b}}
.ck .bal circle{fill:#0b2f5c;stroke:#9cc8f5;stroke-width:1.3}
.ck .bal text{font:700 9.5px var(--mono);fill:#fff;text-anchor:middle}
.ck .scr.on .bal circle{stroke:var(--good);stroke-width:2}
.ck .lev{fill:#ffd27a;stroke:#e6f2ff;stroke-width:1;transition:transform .15s}
.ck .pw{fill:#12305a;stroke:#52729b;stroke-width:1.2}
.ck.dev .pw{fill:#3ddc97;stroke:#e6f2ff;filter:url(#ckG)}

/* keep the guide's own heading styles out of the learner's app */
:where(#root) h1,:where(#root) h2{font:inherit;font-weight:700;letter-spacing:0;padding:0;border:0;margin:0}
:where(#root) h1::before,:where(#root) h2::before{content:none}
/* ---- the project's own src/index.css, as the learner sees it ---- */
/* Ilse's cockpit stylesheet. Every screen is a .screen; a second class says which one. */
#root { font-family: ui-monospace, 'JetBrains Mono', monospace; color: #d7f7ff; }
#root h1 { font-size: 1rem; margin: 0; }
.cockpit { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.screen { background: #04141c; border: 1px solid #1f5f73; border-radius: 6px; padding: 10px 12px; min-width: 0; }
.screen h2 { margin: 0 0 8px; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: #6fd3e8; }
.alert { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; border-color: #2fae7a; color: #7df0b4; }
.alert.danger { border-color: #ff6b5e; color: #ffb4a8; background: #2a0c0a; }
.systems ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; font-size: 0.78rem; }
.meter { grid-column: 1 / -1; grid-row: 2; height: 8px; background: #0d2a36; border-radius: 2px; overflow: hidden; }
.fill { display: block; height: 100%; background: #6b8794; }
.row.nominal .fill { background: #3ddc97; }
.row.caution .fill { background: #f2b84b; }
.row.fault .fill { background: #ff6b5e; }
.row.fault .name { color: #ffb4a8; }
.value { grid-column: 2; grid-row: 1; }
.big { font-size: 2rem; line-height: 1.1; margin: 0; font-weight: 700; }
.main input { width: 100%; margin-top: 8px; }
.note { margin: 8px 0 0; font-size: 0.74rem; color: #8fb7c4; }
.note.fault { color: #ffb4a8; }
.comms ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.76rem; }
.comms time { color: #6fd3e8; margin-right: 6px; }

/* Buttons: the stock set, as drawn from stores. */
.button { display: inline-flex; align-items: center; justify-content: center; margin-top: 10px; padding: 6px 12px; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
.button:focus-visible { outline: 2px solid #8ff6ff; outline-offset: 2px; }
.button-default { background: #6fd3e8; color: #04141c; }
.button-outline { background: transparent; border-color: #1f5f73; color: #d7f7ff; }
.button-destructive { background: #ff6b5e; color: #2a0c0a; }

/* Our own variant: hazard livery for the scram control. */
.button-scram { background: #1a1405; color: #f2b84b; border-color: #f2b84b; box-shadow: inset 6px 0 0 #f2b84b; padding-left: 18px; text-transform: uppercase; letter-spacing: 0.08em; }

/* While a ConfirmButton is armed. The bar drains over the three seconds it stays armed. */
.button.armed { position: relative; overflow: hidden; background: #ff6b5e; color: #2a0c0a; border-color: #ff6b5e; box-shadow: none; }
.button.armed::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: #2a0c0a; animation: drain 3s linear forwards; }
@keyframes drain { to { width: 0; } }

/* The parts catalogue: one of everything on the parts list. */
.parts { grid-column: 1 / -1; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches .button { margin-top: 4px; }

</style>

g { font-size: 2rem; line-height: 1.1; margin: 0; font-weight: 700; }\n.main input { width: 100%; margin-top: 8px; }\n.note { margin: 8px 0 0; font-size: 0.74rem; color: #8fb7c4; }\n.note.fault { color: #ffb4a8; }\n.comms ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.76rem; }\n.comms time { color: #6fd3e8; margin-right: 6px; }\n\n/* Buttons: the stock set, as drawn from stores. */\n.button { display: inline-flex; align-items: center; justify-content: center; margin-top: 10px; padding: 6px 12px; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; }\n.button:focus-visible { outline: 2px solid #8ff6ff; outline-offset: 2px; }\n.button-default { background: #6fd3e8; color: #04141c; }\n.button-outline { background: transparent; border-color: #1f5f73; color: #d7f7ff; }\n.button-destructive { background: #ff6b5e; color: #2a0c0a; }\n\n/* Our own variant: hazard livery for the scram control. */\n.button-scram { background: #1a1405; color: #f2b84b; border-color: #f2b84b; box-shadow: inset 6px 0 0 #f2b84b; padding-left: 18px; text-transform: uppercase; letter-spacing: 0.08em; }\n\n/* While a ConfirmButton is armed. The bar drains over the three seconds it stays armed. */\n.button.armed { position: relative; overflow: hidden; background: #ff6b5e; color: #2a0c0a; border-color: #ff6b5e; box-shadow: none; }\n.button.armed::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: #2a0c0a; animation: drain 3s linear forwards; }\n@keyframes drain { to { width: 0; } }\n","main.tsx":"import { StrictMode } from 'react'\nimport { createRoot } from 'react-dom/client'\nimport './index.css'\nimport App from './App.tsx'\n\ncreateRoot(document.getElementById('root')!).render(\n  \u003cStrictMode>\n    \u003cApp />\n  \u003c/StrictMode>,\n)\n","AlertBar.tsx":"type AlertBarProps = {\n  power: number\n}\n\nexport function AlertBar({ power }: AlertBar ; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }\n.screen { background: #04141c; border: 1px solid #1f5f73; border-radius: 6px; padding: 10px 12px; min-width: 0; }\n.screen h2 { margin: 0 0 8px; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: #6fd3e8; }\n.alert { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; border-color: #2fae7a; color: #7df0b4; }\n.alert.danger { border-color: #ff6b5e; color: #ffb4a8; background: #2a0c0a; }\n.systems ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }\n.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; font-size: 0.78rem; }\n.meter { grid-column: 1 / -1; grid-row: 2; height: 8px; background: #0d2a36; border-radius: 2px; overflow: hidden; }\n.fill { display: block; height: 100%; background: #6b8794; }\n.row.nominal .fill { background: #3ddc97; }\n.row.caution .fill { background: #f2b84b; }\n.row.fault .fill { background: #ff6b5e; }\n.row.fault .name { color: #ffb4a8; }\n.value { grid-column: 2; grid-row: 1; }\n.big { font-size: 2rem; line-height: 1.1; margin: 0; font-weight: 700; }\n.main input { width: 100%; margin-top: 8px; }\n.note { margin: 8px 0 0; font-size: 0.74rem; color: #8fb7c4; }\n.note.fault { color: #ffb4a8; }\n.comms ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.76rem; }\n.comms time { color: #6fd3e8; margin-right: 6px; }\n\n/* Buttons: the stock set, as drawn from stores. */\n.button { display: inline-flex; align-items: center; justify-content: center; margin-top: 10px; padding: 6px 12px; border: 1px solid transparent; border-radius: 6px; font: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; }\n.button:focus-visible { outline: 2px solid #8ff6ff; outline-offset: 2px; }\n.button-default { background: #6fd3e8; color: #04141c; }\n.button-outline { background: transparent; border-color: #1f5f73; color: #d7f7ff; }\n.button-destructive { background: #ff6b5e; color: #2a0c0a; }\n\n/* Our own variant: hazard livery for the scram control. */\n.button-scram { background: #1a1405; color: #f2b84b; border-color: #f2b84b; box-shadow: inset 6px 0 0 #f2b84b; padding-left: 18px; text-transform: uppercase; letter-spacing: 0.08em; }\n\n/* While a ConfirmButton is armed. The bar drains over the three seconds it stays armed. */\n.button.armed { position: relative; overflow: hidden; background: #ff6b5e; color: #2a0c0a; border-color: #ff6b5e; box-shadow: none; }\n.button.armed::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: #2a0c0a; animation: drain 3s linear forwards; }\n@keyframes drain { to { width: 0; } }\n\n/* The parts catalogue: one of everything on the parts list. */\n.parts { grid-column: 1 / -1; }\n.swatches { display: flex; flex-wrap: wrap; gap: 8px; }\n.swatches .button { margin-top: 4px; }\n","main.tsx":"import { StrictMode } from 'react'\nimport { createRoot } from 'react-dom/client'\nimport './index.css'\nimport App from './App.tsx'\n\ncreateRoot(document.getElementById('root')!).render(\n  \u003cStrictMode>\n    \u003cApp />\n  \u003c/StrictMode>,\n)\n","AlertBar.tsx":"type AlertBarProps = {\n  power: number\n}\n\nexport function AlertBar({ power }: AlertBarProps) {\n  const suit = 'KF-07 KESTREL MK II'\n  const overLimit = power > 90\n\n  return (\n    \u003cheader className={overLimit ? 'screen alert danger' : 'screen alert'}>\n      \u003cstrong>{suit}\u003c/strong>\n      \u003cspan>{overLimit ? 'REACTOR OVER LIMIT: throttle down' : 'All systems nominal'}\u003c/span>\n    \u003c/header>\n  )\n}\n","SystemRow.tsx":"import type { Status } from './types.ts'\n\ntype SystemRowProps = {\n  name: string\n  level: number\n  status: Status\n}\n\nexport function SystemRow({ name, level, status }: SystemRowProps) {\n  return (\n    \u003cli className={'row ' + status}>\n      \u003cspan className=\"name\">{name}\u003c/span>\n      \u003cspan tsx'\nimport { PartsCatalogue } from './PartsCatalogue.tsx'\nimport { SystemsPanel } from './SystemsPanel.tsx'\n\nfunction App() {\n  const [power, setPower] = useState(40)\n\n  return (\n    \u003cdiv className=\"cockpit\">\n      \u003cAlertBar power={power} />\n      \u003cSystemsPanel />\n      \u003cMainDisplay power={power} onPowerChange={setPower} />\n      \u003cCommsPanel />\n      \u003cPartsCatalogue />\n    \u003c/div>\n  )\n}\n\nexport default App\n","index.css":"/* Ilse's cockpit stylesheet. Every screen is a .screen; a second class says which one. */\n#root { font-family: ui-monospace, 'JetBrains Mono', monospace; color: #d7f7ff; }\n#root h1 { font-size: 1rem; margin: 0; }\n.cockpit { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }\n.screen { background: #04141c; border: 1px solid #1f5f73; border-radius: 6px; padding: 10px 12px; min-width: 0; }\n.screen h2 { margin: 0 0 8px; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: #6fd3e8; }\n.alert { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; border-color: #2fae7a; color: #7df0b4; }\n.alert.danger { border-color: #ff6b5e; color: #ffb4a8; background: #2a0c0a; }\n.systems ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }\n.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; font-size: 0.78rem; }\n.meter { grid-column: 1 / -1; grid-row: 2; height: 8px; background: #0d2a36; border-radius: 2px; overflow: hidden; }\n.fill { display: block; height: 100%; background: #6b8794; }\n.row.nominal .fill { background: #3ddc97; }\n.row.caution .fill { background: #f2b84b; }\n.row.fault .fill { background: #ff6b5e; }\n.row.fault .name { color: #ffb4a8; }\n.value { grid-column: 2; grid-row: 1; }\n.big { font-size: 2rem; line-height: 1.1; margin: 0; font-weight: 700; }\n.main input { width: 100%; margin-top: 8px; }\n.note { margin: 8px 0 0; font-size: 0.74rem; col     if(['code','vim','nano','vi'].includes(c))return E('sandbox: there is no editor to open here. Each edit in this guide is saved with the "Apply edit" button in its step; the Source tab shows the files.');
    if(c==='git')return E('sandbox: git is covered in Git Basics Sandbox. This project folder is not a repository yet.');
    return E('bash: '+c+': command not found\n\nsandbox: type help to see what this terminal understands.');
  }
  function exec(line){
    const parts=line.split('&&').map(x=>x.trim()).filter(Boolean);let out=[],last=OK('');
    for(const p of parts){last=one(p);if(last.clear)return last;if(last.out)out.push(last.out);if(!last.ok)break;}
    return {ok:last.ok,out:out.join('\n'),meta:last.meta};
  }
  function edit(stage){
    const S=DATA.stages[stage];s.stage=stage;s.lastEdit=stage;
    const cfg=S.changed.filter(f=>f[0]==='.'),live=S.changed.filter(f=>S.graph.includes(f)),dead=S.changed.filter(f=>!S.graph.includes(f)&&f[0]!=='.');
    const out=live.map(f=>'10:42:0'+(DATA.order.indexOf(stage)%10)+' AM [vite] (client) hmr update /src/'+f);
    if(dead.length)out.push('sandbox: saved '+dead.map(f=>'src/'+f).join(' and ')+'. '+(live.length?'':'Nothing imports '+(dead.length>1?'these files':'this file')+' yet, so the browser had nothing to reload.'));
    if(cfg.length)out.push('sandbox: saved '+cfg.join(' and ')+' in the project root. The linter reads it the next time it runs.');
    return OK(out,{cmd:'edit',stage});
  }
  return {s,exec,edit};
}

/* ---------- running the project's own code ---------- */
const live={root:null,quiet:false,counts:{},seen:{}};
function mountApp(sim){
  const rootEl=$('#root'),off=$('#bw-off');
  live.quiet=true;
  if(live.root){try{live.root.unmount();}catch(e){}live.root=null;}
  rootEl.textContent='';
  if(!sim.s.dev||!sim.s.stage){off.hidden=false;off.textContent=sim.s.made?'This site can’t be reached. localhost refused to connect. (Start the dev server: npm run dev)':'Nothing here yet. The project has not been created.';}
  else{
    off.hidden=true;
    const S=DATA.stages[sim.s.stage],cache={};
    const req=name=>{
      if(name==='react')return React;
      if(name==='react-dom/client')return {createRoot:el=>(live.root=ReactDOM.createRoot(el))};
      if(/\.css$/.test(name))return {};
      const p=name.replace(/^\.\//,'');
      if(cache[p])return cache[p].exports;
      if(S.js[p]===undefined)throw new Error('Cannot find module '+name);
      const m=cache[p]={exports:{}};
      new Function('require','module','exports',S.js[p])(req,m,m.exports);
      return m.exports;
    };
    try{ReactDOM.flushSync(()=>{req('./main.tsx');});}catch(e){rootEl.textContent='';off.hidden=false;off.textContent='The page failed to load: '+e.message;}
  }
  setTimeout(()=>{live.quiet=false;},0);
}
function syncMap(sim,animate){
  const ck=$('#ck'),root=$('#root');
  ck.classList.toggle('dev',sim.s.dev);
  SCREENS.forEach(([k])=>{
    const el=root.querySelector('.screen.'+k),g=ck.querySelector('[data-s="'+k+'"]'),was=!!live.seen[k];
    g.classList.toggle('on',!!el);g.classList.toggle('danger',!!(el&&el.classList.contains('danger')));
    if(el&&!was&&animate){g.classList.remove('boot');void g.getBoundingClientRect;g.classList.add('boot');setTimeout(()=>g.classList.remove('boot'),1100);}
    live.seen[k]=!!el;if(!el)live.counts[k]=0;
  });
  const r=root.querySelector('input[type=range]'),v=r?+r.value:0;
  $('#ck-lever').style.transform='translateY('+(-(v/100)*24)+'px)';
  $('#legend').innerHTML=SCREENS.map(([k,n,name,tag])=>{const on=live.seen[k],dg=on&&root.querySelector('.screen.'+k+'.danger');
    return '<li class="'+(on?'on':'')+(dg?' danger':'')+'" data-k="'+k+'"><span class="bdg">'+n+'</span><b>'+name+'</b><span class="sub">'+(on?esc(tag)+' · '+(live.counts[k]||0)+' update'+(live.counts[k]===1?'':'s'):'offline')+'</span></li>';}).join('');
  const st=sim.s,t=st.stage&&DATA.stages[st.stage].tsc;
  $('#pills').innerHTML='<span class="pill '+(st.dev?'ok':'off')+'">dev server '+(st.dev?'on':'off')+'</span>'+(st.installed?'<span class="pill '+(st.tsc!==st.stage?'':t?'bad':'ok')+'">types '+(st.tsc!==st.stage?'not checked':t?t.length+' errors':'clean')+'</span>':'');
  $('#prompt').textContent=(st.cwd==='cockpit'?'~/cockpit':'~')+' $';
}
function flash(k){
  const g=$('#ck [data-s="'+k+'"]'),li=$('#legend [data-k="'+k+'"]');
  [g,li].forEach(el=>{if(!el)return;el.classList.remove('hit');void el.getBoundingClientRect;el.classList.add('hit');});
  setTimeout(()=>{const g2=$('#ck [data-s="'+k+'"]');if(g2)g2.classList.remove('hit');},750);
}
function refit(){const ck=$('#ck');ck.classList.remove('refit');void ck.getBoundingClientRect;ck.classList.add('refit');setTimeout(()=>ck.classList.remove('refit'),1100);}

/* ---------- source viewer ---------- */
const view={file:'App.tsx'};
function renderSource(sim){
  const tabs=$('#ftabs'),code=$('#srccode');
  if(!sim.s.stage){tabs.innerHTML='';code.innerHTML='<span class="pl"><i></i>No project yet. Lesson 2 creates it.</span>';return;}
  const S=DATA.stages[sim.s.stage],names=Object.keys(S.files).sort((a,b)=>(a==='App.tsx'?-1:b==='App.tsx'?1:a<b?-1:1));
  if(!S.files[view.file])view.file='App.tsx';
  const chg=sim.s.lastEdit===sim.s.stage?S.changed:[];
  tabs.innerHTML=names.map(n=>'<button class="ftab'+(chg.includes(n)?' chg':'')+'" data-f="'+n+'" aria-pressed="'+(n===view.file)+'">'+n+'</button>').join('');
  code.innerHTML=codeHtml(view.file,S.files[view.file],chg.includes(view.file)?S.added[view.file]:[]);
  document.querySelector('.ptab[data-pane="source"]').classList.toggle('chg',chg.length>0&&$('#pane-source').hidden);
}

const cmdIs=c=>(r)=>r.ok&&r.line===c;
const E_=(stage,what,why,saw)=>({kind:'edit',stage,what,why,saw});
const C_=(cmd,what,why,saw,test)=>({kind:'cmd',cmd,what,why,saw,test:test||cmdIs(cmd)});
const LESSONS=[
{title:'Briefing',long:'Briefing: the cockpit and the crew',mins:6,
idea:`<div class="preface"><b>Practice build</b>This guide is not a build step for the Kestrel simulator. It is here to show what is under the hood of the screens you built in <em>Tailwind + shadcn/ui from Zero</em>: the React and TypeScript that those components, props and <code>useState</code> lines are made of. You build a small practice cockpit in its own folder, and none of its files go into your <code>kestrel-simulator</code> repository.</div>
<p>The KF-07 Kestrel Mk II is deployed and standing in Hangar 7. What it does not have yet is a cockpit a pilot can read. Its flight rules are already written and tested, in <em>Business Logic from Zero</em>. This guide builds the screens. The screens are not connected to those rules yet; that happens in <em>Wiring the Rules from Zero</em>. Here you join the <strong>cockpit dev team</strong> and build the control screens with <strong>React</strong> and <strong>TypeScript</strong>.</p>
<h2>The crew</h2>
<div class="crew">
<div class="member">${av('ilse')}<div><b>Ilse Varga</b><span class="role">Mobile suit designer</span><p>Drew the KF-07 Kestrel Mk II and its cockpit. Thinks in parts: every screen is a piece she can redesign without touching the rest.</p></div></div>
<div class="member">${av('tomo')}<div><b>Tomo Reyes</b><span class="role">Cockpit tech</span><p>Wires the screens into the suit. Trusts nothing that has not been checked on the ground first.</p></div></div>
</div>
${say('ilse','The cockpit is four screens. Build each one as its own part, and I can redraw one without you rewiring the others.')}
${say('tomo','And every part gets a spec sheet. If a screen expects a number and you hand it text, I want to hear about it in the hangar, not in flight.')}
<h2>The cockpit</h2>
<p>The blueprint in the sandbox is the pilot's view. Four screens are numbered on it, and each will become one piece of your code:</p>
<div class="tscroll"><table class="types"><thead><tr><th>#</th><th>Screen</th><th>Shows</th><th>You build it in</th></tr></thead><tbody>
<tr><td>1</td><td>Alert bar</td><td>The one thing the pilot must know right now</td><td>Lesson 3</td></tr>
<tr><td>2</td><td>Systems</td><td>Each subsystem's level and status</td><td>Lessons 4 and 5</td></tr>
<tr><td>3</td><td>Main display</td><td>Reactor output, with the throttle</td><td>Lessons 6 and 7</td></tr>
<tr><td>4</td><td>Comms</td><td>Messages loaded from the hangar</td><td>Lesson 8</td></tr>
</tbody></table></div>
<p>A screen on the blueprint is dashed while it is offline and lights up when your code puts it on the page. Beside the blueprint, <em>Control screens</em> is the real thing: your code running in a browser.</p>
<h2>The three tools</h2>
<dl class="terms">
<dt>React</dt><dd>A JavaScript library for building user interfaces out of <strong>components</strong>. A component is a function that returns the markup for one piece of the screen. You describe what the screen should look like for the current data, and React updates the page to match.</dd>
<dt>TypeScript</dt><dd>JavaScript plus <strong>types</strong>: written-down statements of what shape each value has (a number, a piece of text, one of three allowed words). A checker reads your code before it runs and reports every place the shapes do not fit. Browsers do not run TypeScript, so it is converted to plain JavaScript first.</dd>
<dt>Vite</dt><dd>The tool that creates the project, serves it while you work with instant reloads, and bundles it for production. You pronounce it "veet".</dd>
</dl>
<h2>If you come from design tools</h2>
<p>Most of React has a direct counterpart in Figma. Ilse keeps this table on the hangar wall:</p>
<div class="tscroll"><table class="types"><thead><tr><th>In Figma</th><th>In React + TypeScript</th></tr></thead><tbody>
<tr><td>Component</td><td>Component: a function that returns markup</td></tr>
<tr><td>Instance on the canvas</td><td>Element: <code>&lt;AlertBar /&gt;</code></td></tr>
<tr><td>Component properties</td><td>Props: the inputs passed to a component</td></tr>
<tr><td>A variant property with fixed options</td><td>Union type: <code>'nominal' | 'caution' | 'fault'</code></td></tr>
<tr><td>Interactive component state</td><td>State: a value the component remembers</td></tr>
<tr><td>The handoff spec</td><td>Types, which the computer enforces</td></tr>
</tbody></table></div>`,
labIntro:'One check before work starts. React projects are built with Node.js, the program that runs JavaScript outside a browser.',
