<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGINX from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right a live schematic of the Kestrel's compute bay (the balancer's orders, the path each command takes to a core, the energy it cost) above a terminal that changes it. One dark terminal world; on phones the map-and-terminal bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:attr(data-p) " ";color:var(--term-dim)}
.ran::before{content:attr(data-p) " ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-tables{border-top-color:var(--good)}.z-session{border-top-color:var(--accent)}.z-databases{border-top-color:var(--warn)}.z-roles{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-tables .zlist{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}

<script>
/* ---------- The Kestrel's compute bay: every config file is data, so what you read and what the sandbox runs cannot drift apart ---------- */
const NGV='nginx/1.28.0',CONF='/etc/nginx/conf.d/kestrel.conf',BUDGET_KW=25;
const CORES={
  'core-1':{port:8001,app:'targeting',node:'torso',cap:6,ms:50,kj:2},
  'core-2':{port:8002,app:'targeting',node:'arms',cap:3,ms:50,kj:3},
  'core-3':{port:8003,app:'targeting',node:'legs',cap:3,ms:50,kj:3},
  'reserve':{port:8004,app:'targeting',node:'backpack',cap:2,ms:90,kj:6,battery:true},
  'sensors':{port:8011,app:'sensors',node:'cockpit',cap:4,ms:30,kj:1},
  'thrusters':{port:8021,app:'thrusters',node:'legs',cap:4,ms:30,kj:1}};
const ORDER=Object.keys(CORES);
const S=(name,o)=>Object.assign({name},o||{});
const POOL=o=>[S('core-1',o),S('core-2',o),S('core-3',o)];
const FT={mf:1,ft:5};
const W2=o=>[S('core-1',Object.assign({weight:2},o)),S('core-2',o),S('core-3',o)];
const FULLPOOL=W2(FT).concat([S('reserve',{backup:true})]);
const TLOC=o=>Object.assign({path:'/targeting',up:'targeting'},o||{});
const CFG={
 '02-proxy.conf':{about:'every /targeting command goes to one core',locs:[{path:'/targeting',direct:'core-1',hdr:true}]},
 '02-typo.conf':{about:'the same orders, with one character missing',broken:true,locs:[{path:'/targeting',direct:'core-1',hdr:true}]},
 '03-pool.conf':{about:'three cores share the work, taking turns',log:true,srvHdr:true,ups:{targeting:{servers:POOL()}},locs:[TLOC()]},
 '04-weights.conf':{about:'the big core gets a double share',log:true,srvHdr:true,ups:{targeting:{servers:W2()}},locs:[TLOC()]},
 '04-least.conf':{about:'each command goes to the least busy core, for its size',log:true,srvHdr:true,ups:{targeting:{method:'least_conn',servers:W2()}},locs:[TLOC()]},
 '05-reserve.conf':{about:'skip dark cores quickly, and keep one in reserve',log:true,srvHdr:true,ups:{targeting:{method:'least_conn',servers:FULLPOOL}},locs:[TLOC()]},
 '06-budget.conf':{about:'no more than 10 solves a second',log:true,srvHdr:true,limit:{rate:10,burst:10},ups:{targeting:{method:'least_conn',servers:FULLPOOL}},locs:[TLOC({limit:true})]},
 '07-cache.conf':{about:'remember each answer for 60 seconds',log:true,srvHdr:true,limit:{rate:10,burst:10},cache:{valid:60},ups:{targeting:{method:'least_conn',servers:FULLPOOL}},locs:[TLOC({limit:true,cache:true})]},
 '08-routes.conf':{about:'one gate for every subsystem',log:true,srvHdr:true,limit:{rate:10,burst:10},cache:{valid:60},ups:{targeting:{method:'least_conn',servers:FULLPOOL}},locs:[TLOC({limit:true,cache:true}),{path:'/sensors',direct:'sensors'},{path:'/thrusters',direct:'thrusters'}]}
};
function confText(name,c){
  const L=['# '+name+': '+c.about,''];
  if(c.log)L.push("log_format kestrel '$remote_addr \"$request\" $status to=$upstream_addr '","                   'cache=$upstream_cache_status time=$request_time';",'');
  if(c.limit)L.push('limit_req_zone $binary_remote_addr zone=energy:10m rate='+c.limit.rate+'r/s;','');
  if(c.cache)L.push('proxy_cache_path /var/cache/nginx keys_zone=solves:10m;','');
  for(const u in (c.ups||{})){const U=c.ups[u];L.push('upstream '+u+' {');if(U.method)L.push('    '+U.method+';');
    U.servers.forEach(s=>{const B=CORES[s.name];let l='    server 127.0.0.1:'+B.port;if(s.weight)l+=' weight='+s.weight;if(s.mf)l+=' max_fails='+s.mf+' fail_timeout='+s.ft+'s';if(s.backup)l+=' backup';L.push(l+';  # '+s.name+(s.backup?', on battery':', '+B.node));});
    L.push('}','');}
  L.push('server {','    listen 80;');
  if(c.log)L.push('    access_log /var/log/nginx/access.log kestrel;');
  if(c.srvHdr)L.push('    proxy_set_header Host $host;','    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;');
  c.locs.forEach((l,i)=>{L.push('','    location '+l.path+' {');
    if(l.limit)L.push('        limit_req zone=energy burst='+c.limit.burst+' nodelay;','        limit_req_status 429;');
    if(l.cache)L.push('        proxy_cache solves;','        proxy_cache_valid 200 '+c.cache.valid+'s;','        add_header X-Cache-Status $upstream_cache_status;');
    L.push('        proxy_pass http://'+(l.up||'127.0.0.1:'+CORES[l.direct].port)+(c.broken&&!i?'':';'));
    if(l.hdr)L.push('        proxy_set_header Host $host;','        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;');
    L.push('    }');});
  L.push('}');return L.join('\n')+'\n';
}
const STEP={},CFG_BY_SRC=new Map();
for(const k in CFG){CFG[k].name=k;STEP[k]=confText(k,CFG[k]);CFG_BY_SRC.set(STEP[k],CFG[k]);}
const COMPOSE=`# The Kestrel's compute bay. Each service is one container.
services:
${ORDER.map(n=>`  ${n}:
    image: hangar/${CORES[n].app}:1.0
    ports:
      - "127.0.0.1:${CORES[n].port}:8000"`).join('\n')}
`;
const MAINCONF=`user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
`;
const keyOf=(o,v)=>Object.keys(o).find(k=>o[k]===v)||null;

/* ---------- The sandbox: a shell, nginx, and six containers ---------- */
function createSim(upto){
  const HOME='~/kestrel/';
  const w={files:{},skew:0,cols:72,nginx:{running:false,cfg:null,name:null,text:null},be:{},access:[],errors:[],rr:{},fails:{},lim:{excess:0,last:0},cache:{},last:null,total:0,stamp:0,solve:1040,conn:0,booting:false};
  ORDER.forEach(n=>w.be[n]={up:true,served:0,energy:0,peak:0,slow:1});
  for(const k in STEP)w.files[HOME+'steps/'+k]=STEP[k];
  w.files[HOME+'compose.yml']=COMPOSE;w.files['/etc/nginx/nginx.conf']=MAINCONF;
  const clock=()=>Date.now()+w.skew;
  const WAIT=ms=>'\u0002'+Math.max(1,Math.round(ms));
  const E=(out,meta)=>({ok:false,out:Array.isArray(out)?out.join('\n'):out,meta:meta||{}}),OK=(out,meta)=>({ok:true,out:Array.isArray(out)?out.join('\n'):(out||''),meta:meta||{}});
  const p2=n=>String(n).padStart(2,'0');
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const hms=d=>p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds());
  const errStamp=t=>{const d=new Date(t);return d.getUTCFullYear()+'/'+p2(d.getUTCMonth()+1)+'/'+p2(d.getUTCDate())+' '+hms(d);};
  const accStamp=t=>{const d=new Date(t);return p2(d.getUTCDate())+'/'+MON[d.getUTCMonth()]+'/'+d.getUTCFullYear()+':'+hms(d)+' +0000';};
  const httpDate=t=>{const d=new Date(t);return DAY[d.getUTCDay()]+', '+p2(d.getUTCDate())+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()+' '+hms(d)+' GMT';};
  const err=(t,msg)=>w.errors.push(errStamp(t)+' [error] 31#31: *'+w.conn+' '+msg);
  const REASON={200:'OK',404:'Not Found',429:'Too Many Requests',502:'Bad Gateway'};
  const page=s=>({status:s,html:true,ms:1,kj:0,body:'<html>\n<head><title>'+s+' '+REASON[s]+'</title></head>\n<body>\n<center><h1>'+s+' '+REASON[s]+'</h1></center>\n<hr><center>'+NGV+'</center>\n</body>\n</html>'});
  let batch=null;
  function record(r){const b=batch;b.n++;if(r.kind==='ok'||r.kind==='direct'){b.by[r.core]=(b.by[r.core]||0)+1;}else if(r.kind==='hit')b.hit++;else if(r.kind==='limit')b.rej++;else b.bad++;b.kj+=r.kj||0;b.hops.push({kind:r.kind,core:r.core||null});}

  /* ----- a compute core answering one command ----- */
  function serve(name,q,infl,kind){
    const B=CORES[name],b=w.be[name],n=(infl?infl(name):0)+1;b.served++;b.energy+=B.kj;w.total+=B.kj;if(n>b.peak)b.peak=n;
    const o={subsystem:B.app,core:name,node:B.node,solve:++w.solve};if(q.sector)o.sector=q.sector;o.energy_kj=B.kj;o.status=n>B.cap?'overheating':'nominal';
    return {status:200,body:JSON.stringify(o),core:name,kj:B.kj,ms:B.ms*b.slow*Math.max(1,n/B.cap),kind:kind||'ok'};
  }
  /* ----- nginx choosing a core from an upstream group ----- */

      else{const outs=[],results=[];let ok=true;for(let i=0;i<n;i++){const x=chain(m[2]);if(x.out!=='')outs.push(x.out);results.push(x.meta);if(!x.ok){ok=false;break;}}
        r={ok,out:outs.join('\n'),meta:{cmd:'loop',results}};}
    }else if(/^for\b/.test(line))r=E('sandbox: write the loop on one line, like this: for i in 1 2 3; do curl -s localhost/targeting; done');
    else r=chain(line);
    if(batch.n){w.last=batch;r.meta.hops=batch.hops;}
    return r;
  }
  function exec(line){return run(line.trim());}
  function view(){
    const t=clock(),N=w.nginx,cfg=N.running?N.cfg:null,disk=w.files[CONF]===undefined?null:w.files[CONF],role={};
    if(cfg){for(const u in (cfg.ups||{}))cfg.ups[u].servers.forEach(s=>role[s.name]={pool:u,weight:s.weight||1,backup:!!s.backup});cfg.locs.forEach(l=>{if(l.direct)role[l.direct]={path:l.path};});}
    const U=cfg&&cfg.ups&&cfg.ups.targeting;
    return {running:N.running,loaded:N.running?N.text:null,loadedName:N.running?N.name:null,disk,diskName:disk===null?null:keyOf(STEP,disk),pending:disk!==null&&(!N.running||disk!==N.text),
      cfg:cfg?{method:U?(U.method||(U.servers.some(s=>s.weight)?'weighted':'round robin')):null,limit:cfg.limit||null,cache:cfg.cache||null,paths:cfg.locs.map(l=>l.path)}:null,
      cores:ORDER.map(n=>Object.assign({name:n,up:w.be[n].up,served:w.be[n].served,energy:w.be[n].energy,peak:w.be[n].peak,role:role[n]||null,marked:(w.fails[n]||0)>t,slow:w.be[n].slow>1},CORES[n])),
      last:w.last,total:w.total,cached:Object.keys(w.cache).length,stamp:w.stamp};
  }
  /* ----- starting state: replay every command of the lessons before this one ----- */
  (function boot(){
    w.booting=true;
    LESSONS.forEach(L=>{if(L.id<upto)L.tasks.forEach(t=>{try{exec(t.cmd);}catch(e){}w.skew+=60000;});});
    w.booting=false;w.last=null;ORDER.forEach(n=>{w.be[n].served=0;w.be[n].energy=0;w.be[n].peak=0;});w.total=0;
  })();
  return {exec,world:w,view,prompt:()=>'kestrel $',help:HELP,setCols:n=>{w.cols=n;}};
}

const NOTES02=[
['server {','One <strong>server block</strong> is one virtual server: a set of rules for requests arriving at a particular port and name.'],
['    listen 80;','Listen on port 80, the standard HTTP port. That is why <code>curl localhost</code> needs no port number.'],
['    location /targeting {','A <strong>location block</strong> matches requests by path. This one takes any request whose path starts with /targeting.'],
['        proxy_pass http://127.0.0.1:8001;','The line that makes NGINX a reverse proxy. Open a connection to this address, send the request on, and relay the answer back. 127.0.0.1:8001 is core-1.'],
['        proxy_set_header Host $host;','The core now sees every request coming from NGINX. This passes on the host name the pilot actually asked for.'],
['        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;','And this passes on the pilot\'s address, so the core\'s own logs can still say who really asked.'],
['    }','End of the location.'],
['}','End of the server. Every directive ends in a semicolon and every block in a brace. Forgetting one is the most common NGINX mistake, and you will make it on purpose in the lab.']];
const NOTES03=[
['upstream targeting {','An <strong>upstream block</strong> names a group of servers that all do the same job. "targeting" is a name you choose.'],
['    server 127.0.0.1:8001;  # core-1, torso','One member of the group: an address and a port.'],
['    server 127.0.0.1:8002;  # core-2, arms','A second member. With no other instruction, NGINX hands requests to the members in turn. That is <strong>round robin</strong>.'],
['    server 127.0.0.1:8003;  # core-3, legs','A third. Adding capacity is now one line and a reload.'],
['}','End of the group.'],
['        proxy_pass http://targeting;','The location now points at the group\'s name instead of one address. NGINX picks a member for every request.'],
["log_format kestrel '… to=$upstream_addr …';",'A custom log line. <code>$upstream_addr</code> records which core NGINX chose, so the access log can answer "who handled that?".']];
const NOTES06=[
['limit_req_zone $binary_remote_addr zone=energy:10m rate=10r/s;','Declares the budget. Count requests <em>per client address</em> (<code>$binary_remote_addr</code>), keep the counters in 10 MB of shared memory called "energy", and allow 10 requests a second each.'],
['        limit_req zone=energy burst=10 nodelay;','Apply that budget to this location. <code>burst=10</code> lets a client run up to 10 requests ahead of the steady rate. <code>nodelay</code> serves those straight away instead of spacing them out.'],
['        limit_req_status 429;','What to answer when the budget is spent. The default is 503. 429 Too Many Requests is the honest code: "slow down", as opposed to "we are broken".']];
const NOTES07=[
['proxy_cache_path /var/cache/nginx keys_zone=solves:10m;','Where remembered answers live on disk, and a name ("solves") with 10 MB of memory for the index.'],
['        proxy_cache solves;','Use that cache for this location. The key is the request: scheme, host, path and query string.'],
['        proxy_cache_valid 200 60s;','Remember successful answers for 60 seconds. After that the next request goes to a core again. Errors are not remembered.'],
['        add_header X-Cache-Status $upstream_cache_status;','Tell the client what happened: MISS (asked a core), HIT (answered from memory) or EXPIRED (had one, too old, asked again).']];

const LESSONS=[
{id:1,title:'Three cores and no gate',mins:8,
idea:`
<p>In <em>Kubernetes from Zero</em> you put a Service in front of the Kestrel's sensor pods and it quietly spread requests across them. That was a <strong>load balancer</strong> you got for free. This guide builds one by hand, with <strong>NGINX</strong>, so you can see every part that was hidden.</p>
<p>The story this time is the Kestrel's compute bay. The fire-control console keeps asking for <strong>targeting solves</strong> (HTTP requests). Three <strong>compute cores</strong> (backend servers) can calculate them, and each solve draws energy from the reactor. The cores are not equal: core-1 in the torso is big and efficient, core-2 and core-3 in the limbs are small. The job of this guide is to spread the commands so that no core cooks, none sits idle, and the reactor is not drained.</p>
<p>Right now nothing does that job. Each core listens on its own port, and whoever sends a command has to pick a core and know its address.</p>
<dl class="terms">
<dt>Pilot console (client)</dt><dd>Whoever sends the request. Here it is you, using <code>curl</code>.</dd>
<dt>Compute core (backend server, or upstream server)</dt><dd>A program that does the real work and answers. Each one here is a container running the same targeting service.</dd>
<dt>The balancer (reverse proxy)</dt><dd>A server that stands in front of the cores. Clients talk only to it, and it passes each request to a core and relays the answer. NGINX is the most widely used one.</dd>
<dt>Load balancing</dt><dd>What a reverse proxy does when it has several cores to choose from: deciding which one gets each request.</dd>
<dt>Forward proxy</dt><dd>The other kind of proxy. It sits in front of <em>clients</em> and hides them from the internet, as a company web filter or a VPN does. A reverse proxy sits in front of <em>servers</em>. This guide is about the reverse kind.</dd>
</dl>
<p>The mental model to keep: <strong>a reverse proxy is the one door into the building.</strong> Because every request walks through it, it is the natural place to decide who answers, to notice who is down, to refuse a flood, and to remember answers. Lessons 2 to 8 add those one at a time.</p>
<p>One number to watch: the reactor budgets <strong>25 kW</strong> for compute. Short spikes above that are survivable. The panel shows what each command cost.</p>
<h2>Translation key</h2>
<p>The Kestrel is only there to make things easier to picture, so the real term always travels with it. The letters are the markers on the live schematic in the sandbox.</p>
<table class="types"><thead><tr><th>On the Kestrel</th><th>Marker</th><th>In a real system</th></tr></thead><tbody>
<tr><td>pilot console</td><td>P, the head</td><td>client: a browser, an app, another service</td></tr>
<tr><td>targeting solve, "command"</td><td>glowing dot</td><td>one HTTP request</td></tr>
<tr><td>the balancer, "the gate"</td><td>N, at the hip</td><td>NGINX: a reverse proxy and load balancer</td></tr>
<tr><td>compute cores</td><td>1 torso, 2 arms, 3 legs</td><td>backend (upstream) servers running the same service</td></tr>
<tr><td>the pool</td><td>conduits from N</td><td>an upstream group</td></tr>
<tr><td>the balancer's orders</td><td></td><td>the NGINX configuration file</td></tr>
<tr><td>a section filling with colour</td><td></td><td>requests in progress on that server, against its capacity</td></tr>
<tr><td>a core going dark</td><td>dashed outline</td><td>a backend that is down</td></tr>
<tr><td>reserve battery packs</td><td>R, behind the shoulders</td><td>a backup server</td></tr>
<tr><td>energy budget</td><td>red bar above N</td><td>a rate limit</td></tr>
<tr><td>memory bank</td><td>M</td><td>the proxy's cache</td></tr>
<tr><td>sensors, thrusters</td><td>S, T</td><td>other services behind the same proxy</td></tr>
<tr><td>the reactor</td><td>ring in the chest</td><td>whatever your requests cost: CPU, money, a database's patience</td></tr>
</tbody></table>`,

notes:`<h2>Where you have already met one</h2>
<ul>
<li><strong>Kubernetes Service.</strong> The thing that spread requests over sensor pods. It balances at the level of connections and knows nothing about HTTP.</li>
<li><strong>Kubernetes Ingress.</strong> The door from outside the cluster. The controller behind it is very often NGINX itself.</li>
<li><strong>Cloud load balancers</strong> (AWS ALB, Google Cloud Load Balancing, Azure Front Door) and <strong>CDNs</strong> such as Cloudflare are reverse proxies run for you.</li>
<li><strong>A typical FastAPI deployment.</strong> uvicorn runs the app on some port, and NGINX (or Caddy, or Traefik) sits in front on ports 80 and 443.</li>
</ul>
<h2>Layer 4 and layer 7</h2>
<p>You will see these two labels everywhere. A <strong>layer 4</strong> balancer forwards raw TCP connections and cannot read what is inside them. A <strong>layer 7</strong> balancer understands HTTP, so it can route by path, add headers, cache and rate-limit. Everything in this guide is layer 7. NGINX can also do layer 4, with its <code>stream</code> module.</p>`,

{id:2,title:'A gate in front: the reverse proxy',mins:12,
idea:`
<p>NGINX is installed on this machine but not running. You will give it its orders, start it, and from then on send every command to <strong>one address</strong>: plain <code>localhost</code>.</p>
<p>The orders live in a text file (the <strong>configuration file</strong>). NGINX reads it once when it starts and again whenever you tell it to <strong>reload</strong>. Editing the file changes nothing until then. That gap is useful: you can test a change before it takes effect.</p>
<p>This first version does no balancing. It forwards every targeting command to core-1. That alone already buys something: the consoles no longer need to know where the cores are. Move core-1, swap it, add ten more, and no console changes.</p>
<dl class="terms">
<dt>Directive</dt><dd>One instruction in the file, ending in a semicolon: <code>listen 80;</code></dd>
<dt>Block (context)</dt><dd>A group of directives in braces: <code>server { … }</code>. Blocks nest, and inner blocks inherit from outer ones.</dd>
<dt><code>proxy_pass</code></dt><dd>The directive that forwards a request to another server. It is what turns NGINX from a web server into a reverse proxy.</dd>
<dt>Reload</dt><dd>Re-read the configuration without dropping connections. New workers start on the new file; old ones finish their requests and exit.</dd>
</dl>`,

notes:`<h2>On your own machine</h2>
<ul>
<li>On Linux, NGINX is usually started by the system: <code>sudo systemctl start nginx</code> and <code>sudo systemctl reload nginx</code>. The sandbox accepts both spellings.</li>
<li>In Docker the usual pattern is the official <code>nginx</code> image with your file mounted at <code>/etc/nginx/conf.d/default.conf</code>. Inside a Compose project you proxy to a <em>service name</em>, for example <code>proxy_pass http://api:8000;</code>, because Compose gives every service a DNS name.</li>
<li>The main file is <code>/etc/nginx/nginx.conf</code>. It contains <code>include /etc/nginx/conf.d/*.conf;</code> inside its <code>http</code> block, which is why a file dropped into conf.d is picked up. Try <code>cat /etc/nginx/nginx.conf</code> in the sandbox.</li>
</ul>
<h2>Why the two headers matter</h2>
<p>Once a proxy is in the way, the backend sees every request arriving from the proxy's address. <code>X-Forwarded-For</code> carries the real client address along, and <code>Host</code> carries the name the client asked for. Web frameworks have a setting to trust these headers (in uvicorn it is <code>--proxy-headers</code>). Only trust them from your own proxy, since any client can type a fake one.</p>`,

{q:'What does proxy_pass do?',opts:['Checks a password','Forwards the request to another server and relays the answer','Redirects the browser to a new URL','Serves a file from disk'],a:1,why:'The client stays connected to NGINX. NGINX makes its own request to the backend and passes the response back.'},
{q:'nginx -s reload is run on a file with a syntax error. What happens?',opts:['NGINX stops','NGINX serves errors until the file is fixed','The reload is refused and the old configuration keeps running','It loads the file up to the error'],a:2,why:'NGINX validates the new configuration first. If it is invalid the running workers are left alone.'}],

{id:3,title:'Sharing the work: round robin',mins:10,
idea:`
<p>One core behind the gate is tidy, but core-1 still does everything. Now the balancer gets a <strong>pool of cores (an upstream group)</strong> and starts choosing.</p>
<p>The default way of choosing is <strong>round robin</strong>: core-1, core-2, core-3, core-1, and so on. It needs no measurement and no memory beyond "who was last", and for identical servers it is hard to beat.</p>
<p>The cores are stateless here: any core can answer any solve. That property is what makes balancing simple. Lesson 8's notes cover what to do when it is not true.</p>
<dl class="terms">
<dt><code>upstream</code></dt><dd>A named group of servers that do the same job. <code>proxy_pass</code> can point at the name.</dd>
<dt>Round robin</dt><dd>Take turns. The default method, used when the upstream block names no other.</dd>
<dt>Horizontal scaling</dt><dd>Handling more load by adding more servers, as opposed to buying a bigger one (vertical scaling). A load balancer is what makes it possible.</dd>
</dl>`,
widget:'cfg03',widgetTitle:'What changed in the file',widgetIntro:'These are the new lines in steps/03-pool.conf. Tap any line.',

 saw:`A different core. You did nothing differently. The balancer moved on to the next member of the pool.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===200},

{what:`Check the logbook for who handled what`,cmd:`tail -n 3 /var/log/nginx/access.log`,parts:[[`tail -n 3`,`The last three lines.`]],

],
notes:`<h2>On your own machine</h2>
<ul>
<li>In Docker Compose the pool is usually service names: <code>server api-1:8000; server api-2:8000;</code>. If you scale one service with <code>docker compose up --scale api=3</code>, a single <code>server api:8000;</code> line resolves to all three containers when NGINX starts.</li>
<li>The upstream block has to sit outside the server block, at the same level. Both live inside the <code>http</code> block of nginx.conf, which is where conf.d files are included.</li>
</ul>
<h2>What round robin assumes</h2>
<p>That every server is the same size, and that every request costs about the same. When either is false you get what the last step showed: a fair split that overloads the small machines.</p>`,

{q:'Why can any core answer any targeting request here?',opts:['NGINX copies data between them','The cores keep no per-client state, so they are interchangeable','They share one port','Round robin requires it'],a:1,why:'Stateless backends are what make simple balancing work. If a server remembered things about a particular client, that client would have to keep returning to it.'},

{id:4,title:'Matching load to capacity',mins:12,
idea:`
<p>The Kestrel's cores are unequal, so equal shares are the wrong shares. There are two ways to tell the balancer, and they answer different questions.</p>
<p><strong>Weights</strong> are you describing the hardware: "core-1 is twice the machine, give it twice the work." You write the number and NGINX obeys. It is simple and predictable, and it is only as good as your description stays true.</p>
<p><strong>Least connections</strong> (<code>least_conn</code>) is the balancer looking before it chooses. For each new command it checks how many each core is working on <em>right now</em>, and picks the least busy one for its weight. A core that has slowed down is still holding its earlier commands, so it gets passed over without anyone having to notice the fault.</p>
<p>There is an energy angle too. core-1 spends 2 kJ a solve and the small cores 3 kJ. Any method that leans on core-1 is cheaper for the reactor, as long as core-1 is not pushed past its capacity.</p>
<dl class="terms">
<dt><code>weight=N</code></dt><dd>A parameter on a server line. A server with weight 2 gets twice as many requests as one with weight 1. The default is 1.</dd>
<dt><code>least_conn</code></dt><dd>A method line inside the upstream block. Send each request to the server with the fewest active connections.</dd>
<dt><code>ip_hash</code></dt><dd>A third method you will see: always send the same client address to the same server. Lesson 8's notes explain when you need it.</dd>
</dl>`,
labIntro:'The same heavy test three times, under different orders and different damage. Compare the "who answered", "Time taken" and "over capacity" lines each time.',
tasks:[
{what:`Give core-1 a double share`,cmd:CP('04-weights.conf'),parts:P_CP('04-weights.conf'),
 saw:`One change, in green: weight=2 on core-1's line.`,test:(l,w,r)=>r.meta.cmd==='cp'&&r.meta.name==='04-weights.conf'},
{what:`Test and reload in one go`,cmd:RELOAD,parts:P_RELOAD,
 saw:`Loaded. From now on the lessons use this one-liner.`,test:(l,w,r)=>loaded(w,'04-weights.conf')},
{what:`Ask eight times`,cmd:LOOP(8),parts:P_LOOP(8),
 saw:`core-1 answers four of the eight, and the small cores two each. NGINX spreads core-1's extra turns out instead of sending them back to back.`,test:(l,w,r)=>r.meta.cmd==='loop'&&coresOf(r).filter(c=>c==='core-1').length===4},
{what:`Run the heavy test`,cmd:AB(60,12),parts:P_AB(60,12),
 saw:`30, 15 and 15, and no "over capacity" line: 12 commands at once now sit as 6, 3 and 3, exactly what the cores are built for. The energy is lower than the round-robin run too, because half the solves went to the efficient core.`,test:(l,w,r)=>r.meta.cmd==='ab'&&r.meta.by['core-1']===30&&!r.meta.over.length},
{what:`Damage: throttle core-3 to half a processor`,cmd:`docker update --cpus 0.5 kestrel-core-3-1`,parts:[[`docker update`,`Change a running container's resource limits.`],[`--cpus 0.5`,`Allow it half of one processor. The core still works, only slowly.`],[`kestrel-core-3-1`,`The container's full name, as docker compose ps lists it.`]],
 saw:`core-3 is now running at a third of its speed. It still answers, so nothing looks broken, and the balancer's orders still give it a full share.`,test:(l,w,r)=>r.meta.cmd==='update'&&w.be['core-3'].slow>1},
{what:`Run the heavy test again`,cmd:AB(60,12),parts:P_AB(60,12),
 saw:`Still 30, 15 and 15, because weights are fixed. But core-3 takes three times as long over each solve, so its share piled up: it is far over capacity and the whole test took longer. Weights describe the cores as they were on a good day.`,test:(l,w,r)=>r.meta.cmd==='ab'&&r.meta.over.includes('core-3')&&loaded(w,'04-weights.conf')},
{what:`Let the balancer look before it chooses`,cmd:CP('04-least.conf'),parts:P_CP('04-least.conf'),
 saw:`One new line at the top of the upstream block: least_conn. The weight stays, so "least busy" is judged relative to each core's size.`,test:(l,w,r)=>r.meta.cmd==='cp'&&r.meta.name==='04-least.conf'},
{what:`Test and reload`,cmd:RELOAD,parts:P_RELOAD,
 saw:`Loaded.`,test:(l,w,r)=>loaded(w,'04-least.conf')},
{what:`Run the heavy test a third time`,cmd:AB(60,12),parts:P_AB(60,12),
 saw:`No core is over capacity, and the test finished sooner. core-3 was handed far fewer solves: it was always still busy with its last ones, so the balancer kept choosing someone else. Nobody told NGINX that core-3 was damaged. It reacted to what it saw.`,test:(l,w,r)=>r.meta.cmd==='ab'&&!r.meta.over.includes('core-3')&&r.meta.by['core-3']<15&&loaded(w,'04-least.conf')},
{what:`Repair core-3`,cmd:`docker update --cpus 2 kestrel-core-3-1`,parts:[[`--cpus 2`,`Give it its processors back.`]],
 saw:`core-3 is at full speed again. least_conn will notice that by itself as well.`,test:(l,w,r)=>r.meta.cmd==='update'&&w.be['core-3'].slow===1}
],
notes:`<h2>Which one to use</h2>
<table class="types"><thead><tr><th>Method</th><th>Good when</th><th>Watch out for</th></tr></thead><tbody>
<tr><td>Round robin</td><td>Servers are identical and requests are similar</td><td>Uneven servers, or a few very slow requests</td></tr>
<tr><td>Weights</td><td>You know the servers' relative sizes and they do not change</td><td>The numbers go stale when hardware changes</td></tr>
<tr><td><code>least_conn</code></td><td>Requests vary a lot in duration, or servers vary in speed</td><td>With very short, uniform requests it behaves like round robin</td></tr>
<tr><td><code>ip_hash</code></td><td>A client must keep returning to the same server</td><td>Uneven load when many users share one address</td></tr>
</tbody></table>
<p>The two combine, as you did in the lab: <code>least_conn</code> respects weights, giving you a split that fits the hardware and still adapts when something slows down. For identical servers, <code>least_conn</code> with no weights is a sensible default.</p>
<h2>What the sandbox simplifies</h2>
<p>Each core here has a fixed speed and a fixed capacity, and slows down in proportion once it is over capacity. Real servers degrade less predictably, which is one more reason to prefer a method that looks over one that assumes.</p>`,
quiz:[
{q:'Server A has weight=3 and server B has no weight. Out of 8 requests, how many go to A?',opts:['3','4','6','8'],a:2,why:'B\'s weight is the default, 1. A gets 3 of every 4 requests, so 6 of 8.'},
{q:'What does least_conn look at when choosing a server?',opts:['Which server has answered the most requests in total','How many requests each server is handling at this moment','Which server has the lowest port number','The server\'s CPU temperature'],a:1,why:'It counts active connections. A server that finishes quickly has fewer open, so it is chosen more often.'},
{q:'Why did least_conn send fewer solves to the throttled core-3 without being told it was damaged?',opts:['It read the docker update command','core-3 is listed last','core-3 was still holding its earlier solves, so it was rarely the least busy','It did not; the split stayed 30, 15, 15'],a:2,why:'A slow server keeps its connections open for longer, so it looks busy and is passed over. The method reacts to what the servers actually do.'}],
reading:[
['Choosing a load-balancing method (admin guide)','https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/#choosing-a-load-balancing-method','Every method NGINX offers, with a config example for each.'],
['server directive: weight and other parameters',NX+'/http/ngx_http_upstream_module.html#server','The reference for weight, max_fails, fail_timeout, backup and down.'],
['Types of load balancing algorithms (Cloudflare)','https://www.cloudflare.com/learning/performance/types-of-load-balancing-algorithms/','Static and dynamic methods compared in plain language.']]},

{id:5,title:'When a core goes dark',mins:12,
idea:`
<p>Mobile suits take hits. A balancer that keeps sending commands to a dead core is worse than no balancer, so the second job of a load balancer is noticing failure and routing around it.</p>
<p>Open-source NGINX does this with <strong>passive health checks</strong>. It does not ping the cores. It learns from real traffic: when a connection to a core fails, NGINX marks that core as failed for a while, and <strong>tries the same request on the next core</strong>. The pilot sees a normal answer and never learns anything went wrong.</p>
<p>After the timeout NGINX lets one request try the failed core again. If it works, the core is back in rotation. If not, it sits out another round.</p>
<p>You will also add a <strong>reserve core (backup server)</strong>: a core on battery power that is expensive to run and receives nothing at all unless every regular core is down.</p>
<dl class="terms">
<dt><code>max_fails</code> and <code>fail_timeout</code></dt><dd>Parameters on a server line. After <code>max_fails</code> failed attempts within <code>fail_timeout</code>, skip this server for <code>fail_timeout</code>. The defaults are 1 and 10 seconds.</dd>
<dt><code>backup</code></dt><dd>Marks a server that only receives requests when all the non-backup servers are unavailable.</dd>
<dt>502 Bad Gateway</dt><dd>The status a proxy returns when it could not get an answer from any backend. It means "the gate is fine, nothing behind it answered".</dd>
<dt>Failover</dt><dd>Moving work from a failed server to a healthy one automatically.</dd>
</dl>`,
labIntro:'You will take cores down with docker compose stop and watch what the pilot sees. On the schematic a stopped core\'s section goes dark with a dashed outline and its conduit turns red. A core the balancer has stopped trying is outlined in amber and tagged "skipped".',
tasks:[
{what:`Take core-2 dark`,cmd:`docker compose stop core-2`,parts:[[`docker compose stop core-2`,`Stop one container. Nothing tells NGINX.`]],
 saw:`core-2 is down. The balancer does not know yet: its orders still list three cores.`,test:(l,w,r)=>r.meta.cmd==='stop'&&!w.be['core-2'].up},
{what:`Ask six times`,cmd:LOOP(6),parts:P_LOOP(6),
 saw:`Six answers, none from core-2, and no error anywhere. One of those commands was first sent to core-2, failed, and was quietly retried on another core.`,test:(l,w,r)=>r.meta.cmd==='loop'&&all200(r)&&!coresOf(r).includes('core-2')},
{what:`See what the balancer noticed`,cmd:`tail -n 3 /var/log/nginx/error.log`,parts:[[`/var/log/nginx/error.log`,`The error log: things that went wrong from NGINX's point of view, even when the client never saw them.`]],
 saw:`"connect() failed (111: Connection refused) while connecting to upstream", naming port 8002. One line, not six: after the first failure NGINX stopped trying core-2 for a while.`,test:(l,w,r)=>r.meta.cmd==='tail'&&/error/.test(r.meta.path)},
{what:`Add a reserve core and a shorter time-out`,cmd:CP('05-reserve.conf'),parts:P_CP('05-reserve.conf'),
 saw:`In green: max_fails=1 fail_timeout=5s written out on each core, and a fourth server marked backup.`,test:(l,w,r)=>r.meta.cmd==='cp'&&r.meta.name==='05-reserve.conf'},
{what:`Test and reload`,cmd:RELOAD,parts:P_RELOAD,
 saw:`Loaded. The battery packs behind the shoulders (marker R) have lit up with an amber conduit. The reserve will stay quiet while any regular core is alive.`,test:(l,w,r)=>loaded(w,'05-reserve.conf')},
{what:`Lose the other two cores as well`,cmd:`docker compose stop core-1 core-3`,parts:[[`stop core-1 core-3`,`Several services in one command.`]],
 saw:`All three regular cores are dark.`,test:(l,w,r)=>r.meta.cmd==='stop'&&!w.be['core-1'].up&&!w.be['core-3'].up},
{what:`Ask four times`,cmd:LOOP(4),parts:P_LOOP(4),
 saw:`Still four answers, all from the reserve, at 6 kJ each. Expensive, and far better than nothing. This is what a backup server is for.`,test:(l,w,r)=>r.meta.cmd==='loop'&&all200(r)&&coresOf(r).every(c=>c==='reserve')},
{what:`Lose the reserve too`,cmd:`docker compose stop reserve`,parts:[[`stop reserve`,`The last targeting core.`]],
 saw:`Nothing is left behind the gate.`,test:(l,w,r)=>r.meta.cmd==='stop'&&!w.be.reserve.up},
{what:`Ask once, with headers`,cmd:`curl -si localhost/targeting`,parts:[[`-si`,`Quiet, and show the status line and headers.`]],
 saw:`502 Bad Gateway, and note who sent it: "Server: nginx". The balancer is alive and honest. It tried and nothing answered.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===502},
{what:`Bring everything back`,cmd:`docker compose start core-1 core-2 core-3 reserve`,parts:[[`docker compose start`,`Start stopped containers again.`]],
 saw:`All four are up. Nobody told NGINX about that either.`,test:(l,w,r)=>r.meta.cmd==='start'&&['core-1','core-2','core-3','reserve'].every(n=>w.be[n].up)},
{what:`Ask six times`,cmd:LOOP(6),parts:P_LOOP(6),
 saw:`The regular cores are answering again and the reserve is quiet. The balancer found them by trying, the same way it lost them.`,test:(l,w,r)=>r.meta.cmd==='loop'&&coresOf(r).slice(-3).every(c=>/^core-/.test(c||''))}
],
notes:`<h2>Passive and active checks</h2>
<p>What you used is <strong>passive</strong>: NGINX learns from failed requests. The cost is that one real request has to hit the dead server first (and gets retried). <strong>Active</strong> health checks send a small probe request every few seconds, whether or not there is traffic, and take a server out before any real request reaches it. In NGINX that is a feature of the commercial NGINX Plus. HAProxy, Traefik, Envoy and every cloud load balancer include active checks for free, and Kubernetes does the same job with readiness probes.</p>
<h2>What gets retried</h2>
<p>By default NGINX retries on connection errors and timeouts (<code>proxy_next_upstream error timeout</code>). It does <em>not</em> retry a request that reached a server and then failed halfway if the request is not safe to repeat, such as a POST that creates something. That caution is deliberate: retrying a payment twice is worse than reporting an error once.</p>
<h2>"no live upstreams"</h2>
<p>If every server in a group is marked failed, NGINX answers 502 at once, writes "no live upstreams" in the error log, and clears the marks so the next request tries again. If you see that line in real life, the question is always the same: are the backends actually down, or did one slow moment make NGINX give up on all of them?</p>`,
quiz:[
{q:'core-2 is stopped. The next request NGINX would have sent it does what?',opts:['Returns 502 to the client','Waits until core-2 comes back','Fails to connect, and is retried on another core','Is dropped silently'],a:2,why:'A connection error triggers proxy_next_upstream: the same request is tried on the next server, and the client sees a normal answer.'},
{q:'When does a server marked backup receive requests?',opts:['Every fourth request','When the others are over a load threshold','Only when all non-backup servers are unavailable','Never; it is documentation'],a:2,why:'A backup server sits out entirely while any regular server is usable.'},
{q:'A client receives 502 Bad Gateway. What does that tell you?',opts:['NGINX has crashed','The client sent a bad request','NGINX is running and could not get an answer from any backend','The rate limit was hit'],a:2,why:'A 502 is sent by the proxy itself. The first place to look is the proxy\'s error log, then the backends.'}],
reading:[
['HTTP Health Checks (admin guide)','https://docs.nginx.com/nginx/admin-guide/load-balancer/http-health-check/','Passive checks in open-source NGINX and active checks in NGINX Plus.'],
['proxy_next_upstream',NX+'/http/ngx_http_proxy_module.html#proxy_next_upstream','Exactly which failures cause a request to be passed to the next server.'],
['502 Bad Gateway (MDN)',MDN+'/Status/502','What the status means and how it differs from 503 and 504.']]},

{id:6,title:'The energy budget: rate limiting',mins:12,
idea:`
<p>The cores are now shared sensibly and failures are survivable. One threat is left: <strong>too many commands</strong>. A stuck fire-control loop, a buggy script or an attacker can ask for solves faster than the reactor can pay for them. The balancer will faithfully spread that flood over every core and drain the suit.</p>
<p>The reactor budgets 25 kW for compute. A solve costs 2 to 3 kJ, so the budget covers about <strong>10 solves a second</strong>. The gate is where to enforce that, because the gate sees every command before any energy is spent on it.</p>
<p>NGINX's <strong>rate limiting</strong> (<code>limit_req</code>) works like a bucket with a hole. Each client's requests pour in, and they drain at the allowed rate. A short <strong>burst</strong> fits in the bucket. Anything that overflows is refused on the spot with <strong>429 Too Many Requests</strong>, and no core ever hears about it.</p>
<dl class="terms">
<dt><code>limit_req_zone</code></dt><dd>Declares a budget: what to count by (usually the client's address), where to keep the counters, and the rate.</dd>
<dt><code>limit_req</code></dt><dd>Applies a declared budget to a server or location, with an optional burst.</dd>
<dt>Burst</dt><dd>How far ahead of the steady rate a client may run before being refused.</dd>
<dt>429 Too Many Requests</dt><dd>The status that tells a client it is being rate-limited and should slow down.</dd>
</dl>`,
widget:'cfg06',widgetTitle:'The three new lines',widgetIntro:'From steps/06-budget.conf. Tap any line.',
labIntro:'The same flood twice: once with the gate wide open, once with a budget. Watch the reactor gauge at the bottom of the panel.',
tasks:[
{what:`Flood the gate: 200 commands, 20 at a time`,cmd:AB(200,20),parts:P_AB(200,20),
 saw:`Every one of the 200 was served. The cores ran over capacity and the reactor gauge is deep in the red, many times over the 25 kW budget. The balancer did its job perfectly and the Kestrel is worse off for it.`,test:(l,w,r)=>r.meta.cmd==='ab'&&r.meta.n===200&&r.meta.rej===0&&!r.meta.direct},
{what:`Put a budget on the gate`,cmd:CP('06-budget.conf'),parts:P_CP('06-budget.conf'),
 saw:`Three green lines: the zone at the top, and limit_req and limit_req_status inside the location.`,test:(l,w,r)=>r.meta.cmd==='cp'&&r.meta.name==='06-budget.conf'},
{what:`Test and reload`,cmd:RELOAD,parts:P_RELOAD,
 saw:`Loaded. The balancer card now carries a "budget" tag, and on the schematic a red bar has appeared above the balancer: the gate that refuses commands over budget.`,test:(l,w,r)=>loaded(w,'06-budget.conf')},
{what:`Send the same flood`,cmd:AB(200,20),parts:P_AB(200,20),
 saw:`Look for "Non-2xx responses" in the output: most of the 200 were refused at the gate. Only the burst got through, the energy spent is a fraction of last time, and no core is over capacity. ab finished faster too, because a refusal costs almost nothing.`,test:(l,w,r)=>r.meta.cmd==='ab'&&r.meta.rej>100},
{what:`Read what the balancer wrote about it`,cmd:`tail -n 2 /var/log/nginx/error.log`,parts:[[`tail -n 2`,`The last two lines of the error log.`]],
 saw:`"limiting requests, excess: … by zone "energy"". Each refusal is logged with the client's address, which is how you find out who is flooding you.`,test:(l,w,r)=>r.meta.cmd==='tail'&&/error/.test(r.meta.path)},
{what:`Check an ordinary command still gets through`,cmd:`curl -si localhost/targeting`,parts:[[`-si`,`Quiet, with the status line and headers.`]],
 saw:`200 OK. The budget refills at 10 a second, so a pilot sending commands at a human pace never notices it. If you saw 429, you were quicker than the refill: run it once more.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===200&&r.meta.via==='nginx'}
],
notes:`<h2>Choosing the numbers</h2>
<ul>
<li><strong>Rate</strong> is the sustained speed you can afford. Here it came from the reactor: 25 kW divided by about 2.5 kJ a solve.</li>
<li><strong>Burst</strong> is forgiveness for bunching. A web page that fires 8 requests at once is not an attack. Without a burst, a rate of 10 a second means "no two requests less than 100 ms apart", which refuses perfectly normal clients.</li>
<li><strong><code>nodelay</code></strong> serves the burst immediately. Without it NGINX holds burst requests back and releases them at the steady rate, which smooths the load on the backends at the price of slower answers.</li>
</ul>
<h2>Per client, not in total</h2>
<p>The zone is keyed by <code>$binary_remote_addr</code>, so each client address gets its own bucket. One noisy client is refused while everyone else is untouched. In the sandbox every request comes from 127.0.0.1, so there is one bucket. Behind another proxy or a CDN all requests appear to come from that proxy, and you would key on the forwarded address instead.</p>
<h2>What a good client does with 429</h2>
<p>Waits and tries again, with increasing pauses (exponential backoff). When you design an API, document the limit and send a <code>Retry-After</code> header so clients know how long to wait.</p>`,
quiz:[
{q:'Where is the cheapest place to refuse excess requests?',opts:['In each backend, after parsing the request','At the proxy, before any backend is involved','In the database','In the client'],a:1,why:'The proxy sees every request first. A refusal there costs almost nothing and protects everything behind it.'},
{q:'rate=10r/s with burst=10. A client sends 30 requests in the same instant. Roughly how many are served?',opts:['All 30','About 10','Exactly 1','None'],a:1,why:'The burst allowance lets about 10 through at once. The rest overflow and get 429. A second later, about 10 more would be allowed.'},
{q:'Why answer 429 instead of the default 503?',opts:['429 is faster to send','429 tells the client it is being limited and should slow down, while 503 suggests the service is broken','503 is not a valid status','NGINX cannot send 503'],a:1,why:'Status codes are messages to the client and to whoever reads the dashboards. 429 says precisely what happened.'}],
