{id:7,title:'Not computing twice: caching',mins:10,
idea:`
<p>The cheapest solve is the one nobody calculates. If the console asks for the solution to sector 7 twice within a few seconds, the answer has not changed. The gate can <strong>remember it (cache it)</strong> and reply from memory: no core, no energy, and an answer in about a millisecond.</p>
<p>A cache trades <strong>freshness</strong> for <strong>cost</strong>. You choose how old an answer may be. Here it is 60 seconds: fine for a target that is not moving much, wrong for one that is. That choice is the whole design problem of caching, and it belongs to whoever understands the data.</p>
<p>The cache is keyed by the request. <code>/targeting?sector=7</code> and <code>/targeting?sector=9</code> are different questions and get separate entries.</p>
<dl class="terms">
<dt>Cache HIT</dt><dd>The proxy had a fresh stored answer and returned it. No backend was involved.</dd>
<dt>Cache MISS</dt><dd>Nothing stored. The proxy asked a backend, returned the answer and kept a copy.</dd>
<dt>EXPIRED</dt><dd>There was a stored answer but it was too old. The proxy asked a backend again and replaced it.</dd>
<dt>TTL (time to live)</dt><dd>How long a stored answer counts as fresh.</dd>
</dl>`,
widget:'cfg07',widgetTitle:'The four new lines',widgetIntro:'From steps/07-cache.conf. Tap any line.',
labIntro:'Watch two things in each answer: the X-Cache-Status header, and the "solve" number in the body. A new number means a core did the work. The same number means you are looking at a remembered answer.',
tasks:[
{what:`Give the gate a memory`,cmd:CP('07-cache.conf'),parts:P_CP('07-cache.conf'),
 saw:`Four green lines: where the cache lives, and three lines in the location to use it.`,test:(l,w,r)=>r.meta.cmd==='cp'&&r.meta.name==='07-cache.conf'},
{what:`Test and reload`,cmd:RELOAD,parts:P_RELOAD,
 saw:`Loaded. A memory bank (marker M) has appeared beside the balancer.`,test:(l,w,r)=>loaded(w,'07-cache.conf')},
{what:`Ask for the solve to sector 7`,cmd:`curl -si "localhost/targeting?sector=7"`,parts:[[`"…?sector=7"`,`A query string. The quotes stop the shell treating ? as a wildcard.`]],
 saw:`X-Cache-Status: MISS. A core calculated it, and the gate will remember the answer for 60 seconds. Note the solve number.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.xcache==='MISS'},
{what:`Ask the identical question again`,cmd:`curl -si "localhost/targeting?sector=7"`,parts:[[`sector=7`,`Exactly the same request.`]],
 saw:`X-Cache-Status: HIT, and the body is the same down to the solve number. No core was asked and the reactor gauge shows 0 kJ. (If you saw EXPIRED, more than a minute had passed: run it once more.)`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.xcache==='HIT'},
{what:`Ask a different question`,cmd:`curl -si "localhost/targeting?sector=9"`,parts:[[`sector=9`,`A different query string, so a different cache key.`]],
 saw:`MISS. Sector 9 has never been asked, so a core had to work. The cache only helps with repeated questions.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.xcache==='MISS'&&/sector/.test(l)},
{what:`Ask about sector 7 six more times`,cmd:LOOP(6,'"localhost/targeting?sector=7"'),parts:P_LOOP(6),
 saw:`Six identical answers, all from memory, for 0 kJ. Without the cache that was 12 to 18 kJ.`,test:(l,w,r)=>r.meta.cmd==='loop'&&(r.meta.results||[]).length===6&&r.meta.results.slice(1).every(x=>x.xcache==='HIT')},
{what:`Let the answer go stale`,cmd:`sleep 60`,parts:[[`sleep 60`,`Wait 60 seconds. The sandbox skips ahead instead of making you sit there.`]],
 saw:`A minute has passed, which is the lifetime the orders give each answer.`,test:(l,w,r)=>r.meta.cmd==='sleep'&&r.meta.n>=60},
{what:`Ask about sector 7 once more`,cmd:`curl -si "localhost/targeting?sector=7"`,parts:[[`sector=7`,`The same question as before.`]],
 saw:`EXPIRED, and a new solve number. The stored answer was too old to trust, so a core recalculated it and the gate now remembers the new one.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.xcache==='EXPIRED'}
],
notes:`<h2>What is safe to cache</h2>
<ul>
<li><strong>Yes:</strong> answers that are the same for everyone and change slowly. Product lists, public pages, reference data, images, scripts.</li>
<li><strong>Careful:</strong> anything personal. A cached "my account" page served to the next user is a data leak. By default NGINX will not cache a response that sets a cookie, and you should keep authenticated routes out of the cache unless the key includes the user.</li>
<li><strong>No:</strong> requests that change things (POST, PUT, DELETE). NGINX only caches GET and HEAD unless told otherwise.</li>
</ul>
<h2>Who decides the lifetime</h2>
<p>Here the proxy decided, with <code>proxy_cache_valid</code>. The better long-term arrangement is for the application to say so itself, with a <code>Cache-Control: max-age=60</code> response header, which NGINX honours ahead of its own setting. The application knows what its data is; the proxy is guessing.</p>
<h2>The budget still counts</h2>
<p>In these orders the rate limit is checked before the cache, so a remembered answer still uses up a little of the client's budget. That is NGINX's order of operations, and it is why the lab repeats the question six times instead of two hundred.</p>`,
quiz:[
{q:'A response comes back with X-Cache-Status: HIT. Which backend handled it?',opts:['The first in the pool','The least busy','None; the proxy answered from its stored copy','The backup'],a:2,why:'A hit never reaches a backend. That is the saving.'},
{q:'/targeting?sector=7 is cached. A request arrives for /targeting?sector=9. What happens?',opts:['It gets the sector 7 answer','MISS: the query string is part of the cache key, so this is a different entry','An error','The cache is cleared'],a:1,why:'The default key includes the full request URI, query string included.'},
{q:'What do you give up by caching for longer?',opts:['Security','Freshness: clients may see an answer that is out of date for up to the lifetime','Nothing','The ability to reload NGINX'],a:1,why:'The lifetime is exactly the maximum staleness you have agreed to accept.'}],
reading:[
['NGINX Content Caching (admin guide)','https://docs.nginx.com/nginx/admin-guide/content-cache/content-caching/','Setting up proxy_cache, choosing what to cache, and purging.'],
['proxy_cache_valid and friends',NX+'/http/ngx_http_proxy_module.html#proxy_cache_valid','The reference for the caching directives used here.'],
['HTTP caching (MDN)','https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching','How Cache-Control works for browsers and for shared caches such as a proxy.']]},

{id:8,title:'One gate for everything: routing',mins:12,
idea:`
<p>The Kestrel is more than a targeting computer. The sensors and thrusters have their own services on their own ports, and so far the gate does not know them. The last job of a reverse proxy is <strong>routing</strong>: looking at each request's path and sending it to the right subsystem.</p>
<p>This is what makes a pile of separate services look like one application from outside. One address, one port, one place for the access log, the budget and (in real life) the HTTPS certificate. When a reverse proxy is used this way in front of several services it is often called an <strong>API gateway</strong>.</p>
<p>After this lab you will read the finished orders top to bottom. Every line in them is one you have added and tested.</p>
<dl class="terms">
<dt>Path-based routing</dt><dd>Choosing a backend by the request's path, with one <code>location</code> block per route.</dd>
<dt>API gateway</dt><dd>A reverse proxy acting as the single entry point to several services, applying the shared rules (limits, logging, authentication) in one place.</dd>
<dt>TLS termination</dt><dd>The proxy handles HTTPS with the outside world and talks plain HTTP to the services behind it, so certificates live in one place.</dd>
<dt>404 Not Found</dt><dd>Here, the gate's own answer for a path that matches none of its locations.</dd>
</dl>`,
labIntro:'Three subsystems, one address.',
tasks:[
{what:`Ask the gate for the sensors`,cmd:`curl -s localhost/sensors`,parts:[[`localhost/sensors`,`A path the current orders do not mention.`]],
 saw:`404 Not Found, from nginx. The sensors service is running (it was in docker compose ps), but the gate has no route to it.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===404&&r.meta.via==='nginx'},
{what:`Add the routes`,cmd:CP('08-routes.conf'),parts:P_CP('08-routes.conf'),
 saw:`Two new location blocks in green, each with a single proxy_pass. They have no pool, no budget and no cache: each location carries only the rules it needs.`,test:(l,w,r)=>r.meta.cmd==='cp'&&r.meta.name==='08-routes.conf'},
{what:`Test and reload`,cmd:RELOAD,parts:P_RELOAD,
 saw:`Loaded. On the schematic the sensor mast (S) and the outer thruster packs (T) have lit up, each with its own conduit from the balancer.`,test:(l,w,r)=>loaded(w,'08-routes.conf')},
{what:`Ask for the sensors again`,cmd:`curl -s localhost/sensors`,parts:[[`/sensors`,`Matched by the new location /sensors block.`]],
 saw:`The sensors subsystem answers, through the same front door as targeting.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.core==='sensors'},
{what:`And the thrusters`,cmd:`curl -s localhost/thrusters`,parts:[[`/thrusters`,`Matched by location /thrusters.`]],
 saw:`A third service, same address.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.core==='thrusters'},
{what:`Targeting still works as before`,cmd:`curl -s localhost/targeting`,parts:[[`/targeting`,`Still handled by the pool, the budget and the cache.`]],
 saw:`A solve, from the pool. Adding routes changed nothing for the existing one.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===200&&r.meta.path==='/targeting'&&r.meta.via==='nginx'},
{what:`Ask for something the Kestrel does not expose`,cmd:`curl -si localhost/railgun`,parts:[[`/railgun`,`No location matches this.`]],
 saw:`404 from the gate. Anything you have not routed is simply unreachable from outside, which is a security feature: services are private until you publish a path to them.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===404&&r.meta.path==='/railgun'},
{what:`Read the finished orders`,cmd:`cat `+CONF,parts:[[`cat`,`Print a file.`]],
 saw:`About thirty lines: a log format, a budget, a cache, a pool with a reserve, and three routes. You have added and tested every one.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path===CONF},
{what:`Read the logbook one last time`,cmd:`tail -n 5 /var/log/nginx/access.log`,parts:[[`tail -n 5`,`The last five requests.`]],
 saw:`One line for each request with its path, status, the core it went to and whether the cache was used. Three services, one logbook.`,test:(l,w,r)=>r.meta.cmd==='tail'&&/access/.test(r.meta.path)}
],
notes:`<h2>What a real deployment adds</h2>
<ul>
<li><strong>HTTPS.</strong> <code>listen 443 ssl;</code> plus <code>ssl_certificate</code> and <code>ssl_certificate_key</code>, and a second server block on port 80 that redirects to https. Certificates usually come free from Let's Encrypt via certbot. This is TLS termination: the services behind the gate stay plain HTTP.</li>
<li><strong>Time-outs.</strong> <code>proxy_connect_timeout</code> and <code>proxy_read_timeout</code> decide how long the gate waits for a backend before giving up with 504 Gateway Timeout.</li>
<li><strong>WebSockets and streaming</strong> need two extra headers (<code>Upgrade</code> and <code>Connection</code>) and usually <code>proxy_buffering off</code>.</li>
<li><strong>Upload size.</strong> <code>client_max_body_size</code> defaults to 1 MB. A "413 Request Entity Too Large" on a file upload is this setting.</li>
</ul>
<h2>Sticky sessions</h2>
<p>Everything here assumed any core can answer any request. If a server keeps something in its own memory about a user (a login session, an upload in progress), that user must keep landing on the same server. <code>ip_hash</code> does that by client address. The better fix is usually to move the state out of the servers into a shared store such as Postgres or Redis, so they become interchangeable again.</p>
<h2>NGINX and its neighbours</h2>
<table class="types"><thead><tr><th>Tool</th><th>Known for</th></tr></thead><tbody>
<tr><td>NGINX</td><td>The default choice. Web server, reverse proxy, cache. Configuration in files, applied on reload.</td></tr>
<tr><td>HAProxy</td><td>A pure load balancer. Active health checks and very detailed statistics built in.</td></tr>
<tr><td>Caddy</td><td>Gets and renews HTTPS certificates by itself. A two-line config for simple cases.</td></tr>
<tr><td>Traefik</td><td>Reads its routes from Docker labels or Kubernetes, so new containers are picked up with no reload.</td></tr>
<tr><td>Envoy</td><td>Built for service meshes and configured by API. Often underneath other products.</td></tr>
<tr><td>Cloud load balancers, CDNs</td><td>The same ideas run as a service: AWS ALB, Google Cloud Load Balancing, Cloudflare.</td></tr>
</tbody></table>
<p>The vocabulary carries over to all of them: upstreams (also called backends, targets or pools), health checks, routing rules, rate limits, caching, TLS termination.</p>
<h2>Back to Kubernetes</h2>
<p>A Kubernetes <strong>Service</strong> is the pool and the round robin from lesson 3. Readiness probes are the health checks from lesson 5. An <strong>Ingress</strong> (or the newer Gateway API) is the routing from this lesson, and the controller that implements it is frequently NGINX, generating a file much like the one you just read.</p>`,
quiz:[
{q:'How does NGINX decide which location block handles a request?',opts:['By the client\'s address','By matching the request\'s path against each location','By the order the services started','At random'],a:1,why:'Locations match on the path. With simple prefix locations like these, the longest matching prefix wins.'},
{q:'The sensors service was running all along. Why did /sensors return 404 at the start of the lab?',opts:['The service had crashed','The rate limit refused it','The gate had no location for that path, so it had no route to the service','curl needed a different flag'],a:2,why:'A reverse proxy only forwards what it has been told to. Unrouted paths get the proxy\'s own 404.'},
{q:'What is TLS termination?',opts:['Switching HTTPS off','The proxy handling HTTPS with clients and speaking plain HTTP to the backends','Ending a connection after a timeout','Encrypting the access log'],a:1,why:'Certificates and encryption live at the gate, and the services behind it do not each have to manage them.'}],
reading:[
['ngx_http_core_module: location',NX+'/http/ngx_http_core_module.html#location','The exact rules for how locations are matched, including the prefix, exact and regular-expression forms.'],
['Configuring HTTPS servers',NX+'/http/configuring_https_servers.html','The official guide to certificates, listen 443 ssl, and sensible TLS settings.'],
['Kubernetes Ingress','https://kubernetes.io/docs/concepts/services-networking/ingress/','The same routing idea inside a cluster, and where NGINX fits as a controller.']]}
];

/* ---------- UI ---------- */
(function(){

let saved={done:{},quiz:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done&&s.quiz)saved=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}};
const $=(s,r)=>(r||document).querySelector(s);
function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];
    if(k==='html')n.innerHTML=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v);}
  kids.flat(Infinity).forEach(c=>{if(c!=null)n.append(c);});
  return n;
}
const quizDone=L=>L.quiz.every((q,i)=>saved.quiz[L.id+'-'+i]===q.a);
const lessonDone=L=>L.tasks?!!saved.done[L.id]:quizDone(L);

/* ----- navigation ----- */
function renderNav(active){
  const nav=$('#nav');nav.textContent='';
  LESSONS.forEach(L=>{
    nav.append(el('a',{href:'#lesson-'+L.id,class:'nav-item'+(active===L.id?' active':'')+(lessonDone(L)?' done':''),'aria-current':active===L.id?'page':null},
      el('span',{class:'num',text:lessonDone(L)?'✓':String(L.id).padStart(2,'0')}),el('span',{class:'nav-title',text:L.title})));
  });
  nav.append(el('a',{href:'#cheat-sheet',class:'nav-item'+(active==='cheats'?' active':'')},el('span',{class:'num',text:'≡'}),el('span',{class:'nav-title',text:'Cheat sheet'})));
  const n=LESSONS.filter(lessonDone).length;
  $('#progress-text').textContent='['+n+'/'+LESSONS.length+'] lessons complete';
  $('#progress-bar').style.width=(n/LESSONS.length*100)+'%';
  const a=$('.nav-item.active',nav);if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'});
}

/* ----- widgets ----- */
const W={};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function annotated(box,notes,label){
  const pre=el('div',{class:'code-lines',role:'group','aria-label':label}),panel=el('div',{class:'explain','aria-live':'polite'});
  const btns=[];
  notes.forEach((n,i)=>{const b=el('button',{type:'button',class:'cl'+(n[0].startsWith('#')?' plain':''),text:n[0],onclick:()=>pick(i)});btns[i]=b;pre.append(b);});
  function pick(i){btns.forEach((b,k)=>b.setAttribute('aria-pressed',k===i));panel.innerHTML='<code>'+esc(notes[i][0].trim())+'</code><p>'+notes[i][1]+'</p>';}
  box.append(el('div',{class:'scroll-x'},pre),panel);pick(0);
}
function flow(box,steps){
  let i=0;const row=el('div',{class:'flow'}),panel=el('div',{class:'explain','aria-live':'polite'}),btns=[];
  const next=el('button',{type:'button',class:'btn next',text:'Next',onclick:()=>{i=(i+1)%steps.length;draw();}});
  steps.forEach((s,k)=>{const b=el('button',{type:'button',class:'fstep',onclick:()=>{i=k;draw();}},el('span',{class:'fnum',text:'step '+(k+1)}),el('span',{class:'ft',text:s[0]}),el('span',{class:'fs',text:s[1]}));btns.push(b);row.append(b);});
  function draw(){btns.forEach((b,k)=>{b.setAttribute('aria-pressed',k===i);b.classList.toggle('past',k<i);});
    panel.innerHTML='<code>'+(i+1)+' of '+steps.length+': '+esc(steps[i][0])+'</code><p>'+steps[i][2]+'</p>';
    next.textContent=i===steps.length-1?'Start again':'Next';next.classList.toggle('next',i<steps.length-1);}
  box.append(row,panel,el('div',{class:'row'},next));draw();
}

 ['Pilot console','client','The console wants a targeting solve. It knows one address, the balancer\'s, and nothing about the cores. In real terms: a browser, a mobile app or another service sends an HTTP request.'],

    }
    if(WIDE.matches)input.focus();
    requestAnimationFrame(keepInView);
  }
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();runLine();}
    else if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);input.value=hist[hi];}
    else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);input.value=hist[hi]||'';}
  });
  if(sec&&tasks.length)sec.append(el('p',{text:L.labIntro}),list,banner);
  const bench=el('div',{class:'bench-in'},
    el('section',{class:'map','aria-label':'The Kestrel\'s compute bay'},el('div',{class:'map-head'},el('b',{text:'Kestrel compute bay'}),statusEl),map,strip),
    stepbar,
    el('section',{class:'term','aria-label':'Terminal'},el('div',{class:'term-bar'},el('span',{text:'Terminal (simulated)'}),el('span',{class:'row'},el('button',{type:'button',class:'mini dark',text:'help',onclick:()=>{if(!busy)print(sim.help,'note');}}),el('button',{type:'button',class:'mini dark',text:'reset',onclick:()=>{if(cur<tasks.length)cur=0;reset(true);}}))),term,form));
  /* a skipped core is tried again once its time-out passes: keep the panel honest while you read */
  if(ticker)clearInterval(ticker);
  ticker=setInterval(()=>{if(!busy&&sigOf(sim.view())!==lastSig)drawMap(null);},1000);
  reset(false);
  return bench;
}

/* ----- quiz ----- */
function quiz(L,sec){
  L.quiz.forEach((q,i)=>{
    const key=L.id+'-'+i,fb=el('p',{class:'fb','aria-live':'polite'}),opts=el('div',{class:'opts'});
    function draw(){
      const ch=saved.quiz[key];opts.textContent='';
      q.opts.forEach((o,k)=>opts.append(el('button',{type:'button',class:'opt'+(ch===k?(k===q.a?' right':' wrong'):''),'aria-pressed':ch===k,text:o,onclick:()=>{saved.quiz[key]=k;save();draw();renderNav(L.id);}})));
      fb.className='fb'+(ch==null?'':ch===q.a?' good':' bad');
      fb.textContent=ch==null?'':ch===q.a?'Correct. '+q.why:'Not quite. Have another look at the options, or re-read the section above.';
    }
    sec.append(el('div',{class:'q'},el('p',{class:'qt',text:(i+1)+'. '+q.q}),opts,fb));draw();
  });
}

/* ----- page ----- */
function mount(art,bench,slot){
  const main=$('#main'),old=benchEl;main.textContent='';if(old)old.remove();
  main.append(art);benchEl=bench;slotEl=slot;placeBench();
}
function showLesson(id){
  const L=LESSONS.find(x=>x.id===id)||LESSONS[0];
  const art=el('article',{}),slot=el('div',{class:'slot'}),ctx={};
  art.append(el('p',{class:'eyebrow',text:'Lesson '+L.id+' of '+LESSONS.length+' · about '+L.mins+' minutes'}),el('h1',{text:L.title}),el('section',{class:'prose',html:L.idea}));
  if(L.widget){const box=el('div',{class:'widget'});art.append(el('section',{},el('h2',{text:L.widgetTitle}),el('p',{text:L.widgetIntro}),box));W[L.widget](box,ctx);}
  const s=el('section',{class:'lab'},el('h2',{text:'Try it'}));art.append(s);const bench=lab(L,s,ctx);s.append(slot);
  if(L.notes)art.append(el('section',{class:'prose notes',html:L.notes}));
  const qs=el('section',{},el('h2',{text:'Check yourself'}));art.append(qs);quiz(L,qs);
  art.append(el('section',{},el('h2',{text:'Further reading'}),el('ul',{class:'reading'},L.reading.map(r=>el('li',{},el('a',{href:r[1],target:'_blank',rel:'noopener',text:r[0]}),el('span',{text:r[2]}))))));
  const prev=LESSONS.find(x=>x.id===L.id-1),next=LESSONS.find(x=>x.id===L.id+1);
  art.append(el('nav',{class:'pager','aria-label':'Lessons'},prev?el('a',{href:'#lesson-'+prev.id,class:'btn ghost',text:'← '+prev.title}):el('span'),next?el('a',{href:'#lesson-'+next.id,class:'btn',text:next.title+' →'}):el('a',{href:'#cheat-sheet',class:'btn',text:'Cheat sheet →'})));
  mount(art,bench,slot);renderNav(L.id);
}
function showCheats(){
  const box=el('div',{class:'widget'}),slot=el('div',{class:'slot'});
  const art=el('article',{},el('p',{class:'eyebrow',text:'reference'}),el('h1',{text:'Cheat sheet'}),el('p',{class:'prose',text:'Every directive and command from the eight lessons. Words in capitals are placeholders for your own values. The sandbox here is free play: the finished gate from lesson 8, with every core online.'}),box,el('section',{class:'slot-sec'},el('h2',{text:'Sandbox'}),slot));
  W.cheats(box);mount(art,lab({id:0},null),slot);renderNav('cheats');
}
function route(){
  const h=location.hash.replace('#','');const m=/^lesson-(\d+)$/.exec(h);
  if(h==='cheat-sheet')showCheats();else showLesson(m?+m[1]:1);
  $('#main').scrollTop=0;window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
})();
