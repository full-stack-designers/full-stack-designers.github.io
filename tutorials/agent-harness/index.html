<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Harness from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>


/* Same guide family as Cloud Deploy from Zero: lesson on the left; on the right a blueprint of the Kestrel cockpit and the live control screens above a terminal. On phones the bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#61dafb; --accent-ink:#04222b; --accent-soft:#0e2f3a;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);margin:0}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono);color:var(--muted);margin-left:auto}
.bar{flex-basis:100%;height:2px;background:var(--line);order:4}
#progress-bar{height:100%;width:0;background:var(--good);transition:width .3s}
#nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:thin;flex:1 1 100%;order:3}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font:400 .82rem var(--mono);white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:28px;height:24px;border-radius:3px;background:var(--sunk);font:500 .75rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
.work0{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.eyebrow{font:500 .8rem var(--mono);color:var(--good);margin:12px 0 4px}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em;margin:0 0 16px;text-wrap:balance}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);margin:36px 0 8px;padding-top:20px;border-top:1px solid var(--line);text-wrap:balance}
h2::before{content:"## ";color:var(--muted);font-weight:400}
h3{font:600 1rem/1.3 var(--mono);margin:20px 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.saw code,.say code{background:var(--sunk);padding:1px 5px;border-radius:4px;color:#b6ecfb}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font:600 .92rem var(--mono)}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--line)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px;font-size:.82rem}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font:500 .92rem var(--mono);text-decoration:none}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.mini{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font:400 .85rem var(--mono)}
.pill{display:inline-block;font:500 .7rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
table.types{border-collapse:collapse;width:100%;font-size:.92rem;margin:0 0 12px}
table.types th{text-align:left;font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 10px 4px 0}
table.types td{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top}
.tscroll{overflow-x:auto}
/* crew */
.crew{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:0 0 16px}
.member{display:flex;gap:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:12px}
.member b{font:700 .95rem var(--mono);display:block}
.member .role{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);display:block;margin-bottom:4px}
.member p{margin:0;font-size:.9rem;color:var(--muted)}
.av{flex:none;width:56px;height:56px;border-radius:4px;border:1px solid #2a5a96;background:linear-gradient(#134177 1px,transparent 1px) 0 0/100% 8px,linear-gradient(90deg,#134177 1px,transparent 1px) 0 0/8px 100%,#0b2f5c}
.av svg{display:block;width:100%;height:100%}
.avl{fill:#0e3a6e;stroke:#e6f2ff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.avf{fill:#08264a;stroke:#e6f2ff;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.avn{fill:none;stroke:#e6f2ff;stroke-width:1.4;stroke-linecap:round}
.ava{fill:none;stroke:#8ff6ff;stroke-width:1.6;stroke-linecap:round}
.avt{fill:#ffd27a;stroke:#e6f2ff;stroke-width:1.2}
.say{display:flex;gap:12px;align-items:flex-start;margin:16px 0;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 4px 4px 0;padding:10px 12px}
.say.tomo{border-left-color:var(--warn)}
.say .av{width:44px;height:44px}
.say p{margin:0;font-size:.95rem}
.say b{font:700 .78rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);display:block}
.say.tomo b{color:var(--warn)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface);min-width:0}
.task.todo{opacity:.78}
.task.now{border-color:var(--accent);background:var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:3px;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font:600 .92rem var(--mono)}
.kind{font:500 .66rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.why{margin:8px 0 0;font-size:.92rem}
.saw{margin:8px 0 0;font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.saw::before{content:"\2713  ";color:var(--good)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0 0;background:var(--term);color:var(--term-ink);border:1px solid var(--term-line);border-radius:4px;padding:10px 12px}
.cmd code{background:none!important;padding:0!important;overflow-wrap:anywhere;font-size:.88rem;color:var(--good)!important}
.cmd code::before{content:"$ ";color:var(--term-dim)}
.cmd:hover{border-color:var(--accent)}
.tap{font:500 .68rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.next{outline:2px solid var(--good);outline-offset:3px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{outline-color:transparent}}
.edit{margin:10px 0 0;border:1px solid var(--term-line);border-radius:4px;background:var(--term);overflow:hidden}
.edit summary{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:7px 10px;font:500 .78rem var(--mono);cursor:pointer;background:var(--surface);list-style:none}
.edit summary::-webkit-details-marker{display:none}
.edit summary::before{content:"\25B8";color:var(--muted)}
.edit[open] summary::before{content:"\25BE"}
.edit summary .pill{font-size:.64rem}
.code{overflow:auto;padding:6px 0;font:400 .74rem/1.55 var(--mono);color:var(--term-ink);max-height:420px}
.pl{display:block;white-space:pre;padding-right:12px;border-left:3px solid transparent;min-width:max-content}
.pl.new{background:var(--good-soft);border-left-color:var(--good)}
.pl i{font-style:normal;display:inline-block;width:2.6em;text-align:right;padding-right:.8em;color:var(--term-dim);user-select:none}
.pl .k{color:#ffb86b}.pl .s{color:#e6c07b}.pl .c{color:var(--term-dim)}.pl .t{color:var(--accent)}
.task .btn{margin-top:10px}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin:12px 0;font-size:.95rem}
/* bench */
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .btn{align-self:flex-start;margin-top:6px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.map-head span{display:flex;flex-wrap:wrap;gap:4px}
.ptabs{display:flex;border-bottom:1px solid var(--line);background:var(--sunk)}
.ptab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;font:700 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ptab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--surface)}
.ptab.chg::after{content:" \25CF";color:var(--good)}
.pane{padding:10px;min-width:0;overflow:auto}
.pane[hidden]{display:none}
.duo{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.zh{font:700 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.kfig{border:1px solid #2a5a96;border-radius:4px;min-width:0;background:linear-gradient(#134177 1px,transparent 1px) 0 0/100% 20px,linear-gradient(90deg,#134177 1px,transparent 1px) 0 0/20px 100%,#0b2f5c}
.kfig svg{display:block;width:100%;height:auto}
.legend{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.legend li{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;background:var(--sunk);padding:4px 7px;min-width:0}
.legend li.on{border-left-color:var(--good)}
.legend li.danger{border-left-color:var(--bad)}
.legend li.hit{animation:glow .8s ease-out}
@keyframes glow{35%{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft)}}
.legend b{font:500 .74rem var(--mono);overflow-wrap:anywhere}
.legend .sub{flex-basis:100%;font:400 .66rem var(--mono);color:var(--muted)}
.bdg{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);font:700 .64rem var(--mono);background:var(--term)}
.legend li.on .bdg{border-color:var(--good)}
.bw{border:1px solid var(--line);border-radius:5px;overflow:hidden;min-width:0}
.bw-bar{display:flex;gap:8px;align-items:center;background:var(--sunk);padding:5px 8px}
.bw-bar::before{content:"\25CF \25CF \25CF";color:var(--line);font-size:.6rem;letter-spacing:1px}
.bw-url{flex:1;background:var(--term);border-radius:10px;padding:2px 10px;font:400 .7rem var(--mono);color:var(--term-ink)}
.bw-page{background:#020b10;padding:10px;min-height:120px}
.bw-off{font:400 .76rem var(--mono);color:var(--term-dim);text-align:center;padding:34px 8px;margin:0}
.ftabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ftab{font:500 .68rem var(--mono);padding:3px 8px;border-radius:3px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.ftab[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ftab.chg::after{content:" \25CF";color:var(--good)}
.src{background:var(--term);border:1px solid var(--line);border-radius:4px}
.src .code{max-height:none}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--surface)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.term-out{height:220px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim)}
.tl.ok{color:var(--good);margin:4px 0}
.tl.prog{display:flex;gap:10px;align-items:center;color:var(--term-dim)}
.prog .track{flex:0 0 130px;height:8px;background:var(--term-line);border-radius:2px;overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--good);transition:width linear}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 .9rem var(--mono);color:var(--good);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:var(--good);color:#04121f;border:0;border-radius:4px;padding:8px 16px;font:600 .9rem var(--mono)}
.term-in.busy .run{opacity:.45}
/* quiz, reading, pager, cheats */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font:600 .92rem var(--mono)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem;padding:9px 12px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font:500 .9rem var(--mono)}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere;color:#b6ecfb}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (min-width:720px){.duo{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}}
@media (min-width:1040px){
  .app{height:100%}
  .work0{grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:0}
  main.lesson{overflow:auto;border-right:1px solid var(--line);padding:8px 28px 72px}
  .bench{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:16px}
  .bench-in{flex:1;min-height:0}
  .map{flex:0 1 auto;max-height:68%}
  .pane{flex:1 1 auto;min-height:0}
  .term{flex:1 1 0;min-height:200px}
  .term-out{height:auto;flex:1 1 0;min-height:0}
  .stepbar,.slot-sec{display:none}
  #nav{flex:1 1 420px;order:0;padding:0 0 10px}
  #progress-text{order:2}
}
@media (max-width:1039px){.bench-in .stepbar{order:-1}}

/* ---- Business Logic guide additions: Mk II blueprint, flight state, Rulebook + Terminal tabs ---- */
:root{--accent:#c8e06a;--accent-ink:#1a2200;--accent-soft:#272f10}
.prose code,.task code,.saw code,.say code,dl.cheat dt code{color:#e3f0a8}
.pl .t{color:var(--accent)}
.hint{font:400 .78rem var(--mono);color:var(--muted)}
.map .pane{padding:8px}
.duo2{display:grid;grid-template-columns:minmax(118px,.72fr) minmax(0,1.28fr);gap:8px;align-items:start}
.kfig.bp{padding:0;border:1px solid #2a5a96;border-radius:4px;min-width:0;background:linear-gradient(#134177 1px,transparent 1px) 0 0/100% 20px,linear-gradient(90deg,#134177 1px,transparent 1px) 0 0/20px 100%,#0b2f5c}
.kfig.bp svg{display:block;width:100%;height:auto;max-height:min(58vh,470px);margin:0 auto}
/* flight state panel */
.fstate{display:flex;flex-direction:column;gap:5px;min-width:0}
.fs-h{font:700 .68rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.phases{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.ph{font:500 .66rem var(--mono);padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);background:var(--sunk)}
.ph.past{color:var(--ink)}
.ph.now{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.fs-row{display:grid;grid-template-columns:20px minmax(0,5.4em) minmax(30px,1fr) 2.4em;gap:6px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;background:var(--sunk);padding:3px 7px;min-width:0}
.fs-row b{font:500 .74rem var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-row .num{font:500 .74rem var(--mono);text-align:right}
.fs-row.on{border-left-color:var(--good)}
.fs-row.warn{border-left-color:var(--warn)}
.fs-row.danger{border-left-color:var(--bad)}
.fs-row.hit{animation:glow .8s ease-out}
.fs-row .bdg{min-width:18px;height:18px}

.kb .ctr{fill:none;stroke:#6fa3d8;stroke-width:.7;stroke-dasharray:14 3 2 3}
.kb .cp{fill:#08264a;stroke-dasharray:3 2}

@keyframes kbblink{50%{fill-opacity:.15}}

.kb .visor{fill:#12305a;stroke:#e6f2ff;stroke-width:.8;transition:fill .5s}

.kb .mast{fill:none;stroke:#e6f2ff;stroke-width:1.3}.kb .ball{fill:#08264a;stroke:#e6f2ff;stroke-width:1.15;transition:fill .5s}

.kb.sy-limbs .armg .tl,.kb.sy-limbs .armg .wh,.kb.sy-limbs .jt{stroke:#8ff6ff;stroke-width:1.9}
.kb.over.sy-propulsion #kb-wings .tl,.kb.over.sy-shield .shieldg .wh,.kb.over.sy-limbs .armg .wh,.kb.over.sy-limbs .jt{stroke:var(--bad);animation:kbflick .3s steps(1) infinite}
.kb.over.sy-sensors .visor,.kb.over.sy-comms .ball{fill:var(--bad)}
@keyframes kbflick{50%{stroke-opacity:.25}}
.kb #kb-wings{transform-box:fill-box;transform-origin:50% 85%}

.kb .suit{transition:transform 1.2s ease-in-out}

.kb.g-open .cl-l{transform:translateX(-22px)}.kb.g-open .cl-r{transform:translateX(22px)}
.kb.g-open.gmove .cl-l{animation:kbopenl 1.2s ease-in-out}.kb.g-open.gmove .cl-r{animation:kbopenr 1.2s ease-in-out}
.kb.g-locked.gmove .cl-l{animation:kbopenl 1s ease-in-out reverse}.kb.g-locked.gmove .cl-r{animation:kbopenr 1s ease-in-out reverse}

const DATA={"h1": {".env": "# Your own key from the Claude Console. This file never goes to GitHub.\nANTHROPIC_API_KEY=sk-ant-paste-your-key-here\n", ".gitignore": "# Secrets and machine-only files: never commit these.\n.env\n.venv/\nflight.json\ntrace.jsonl\n", "hello.py": "from anthropic import Anthropic\nfrom dotenv import load_dotenv\n\nload_dotenv()  # reads ANTHROPIC_API_KEY from the .env file\nclient = Anthropic()\n\n# One call to the model: text in, text out. No tools, no loop.\nreply = client.messages.create(\n    model=\"claude-sonnet-5-5\",\n    max_tokens=500,\n    messages=[{\"role\": \"user\", \"content\": \"Co-pilot, what is the Kestrel's reactor draw right now?\"}],\n)\n\nprint(reply.content[0].text)\n"}, "h2": {"harness.py": "import json\nimport sys\n\nfrom anthropic import Anthropic\nfrom dotenv import load_dotenv\n\nimport suit\n\nload_dotenv()\nclient = Anthropic()\nMODEL = \"claude-sonnet-5-5\"\n\n# The tools the co-pilot may ask for. Each has a name, a description\n# and the shape of its input. The model reads all three.\nTOOLS = [\n    {\n        \"name\": \"get_flight_state\",\n        \"description\": \"Read the Kestrel's current flight state: phase, burn, power draw and what is aboard.\",\n        \"input_schema\": {\"type\": \"object\", \"properties\": {}},\n    },\n]\n\n\ndef run_tool(name, args):\n    \"\"\"The harness, not the model, is what actually runs a tool.\"\"\"\n    if name == \"get_flight_state\":\n        return suit.get_flight_state()\n    raise ValueError(f\"unknown tool: {name}\")\n\n\ndef run(request):\n    # The whole conversation so far. The model remembers nothing between calls,\n    # so the harness sends all of it every time.\n    messages = [{\"role\": \"user\", \"content\": request}]\n    turn = 0\n\n    while True:\n        turn += 1\n        reply = client.messages.create(model=MODEL, max_tokens=1000, tools=TOOLS, messages=messages)\n        messages.append({\"role\": \"assistant\", \"content\": reply.content})\n\n        # No tool asked for: the co-pilot has finished. Leave the loop.\n        if reply.stop_reason != \"tool_use\":\n            return \"\".join(block.text for block in reply.content if block.type == \"text\")\n\n        # Run every tool the co-pilot asked for and hand the results back.\n        results = []\n        for block in reply.content:\n            if block.type != \"tool_use\":\n                continue\n            print(f\"[turn {turn}] co-pilot asks: {block.name}({json.dumps(block.input)})\")\n            output = run_tool(block.name, block.input)\n            print(f\"[turn {turn}] result: {json.dumps(output)}\")\n            results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": json.dumps(output)})\n        messages.append({\"role\": \"user\", \"content\": results})\n\n\nif __name__ == \"__main__\":\n    print()\n    print(run(sys.argv[1]))\n", "suit.py": "\"\"\"A stand-in for the Kestrel's flight rules, so this folder runs on its own.\n\nIn the finished simulator these functions would call kestrel-control (the FastAPI\nserver) instead. The flight state is kept in flight.json between runs.\n\"\"\"\nimport json\nimport sys\nfrom pathlib import Path\n\nFILE = Path(\"flight.json\")\nBUDGET_KW = 25\nLOADS = {\"flight_computer\": 1, \"navigation\": 1, \"sensors\": 2, \"containment\": 6, \"cruise\": 9, \"sprint\": 21}\n\n# For each order: the phases it is allowed in, and the phase it leads to.\nORDERS = {\n    \"launch\": {\"hangar\": \"transit\"},\n    \"jump\": {\"transit\": \"aster\", \"captured\": \"return\"},\n    \"approach\": {\"aster\": \"trap\"},\n    \"scan\": {\"trap\": \"trap\"},\n    \"capture\": {\"trap\": \"captured\"},\n    \"dock\": {\"return\": \"docked\"},\n}\n\nPHASE_TEXT = {\n    \"hangar\": \"parked in Hangar 7\",\n    \"transit\": \"in transit to gate-alpha\",\n    \"aster\": \"in the Aster system\",\n    \"trap\": \"holding off the trap station\",\n    \"captured\": \"holding off the trap station, sample aboard\",\n    \"return\": \"homebound from gate-alpha\",\n    \"docked\": \"docked in Hangar 7\",\n}\n\nSTART = {\"phase\": \"hangar\", \"burn\": \"cruise\", \"scanned\": False, \"antimatter_ng\": 0, \"delivered_ng\": 0}\n\n\ndef load():\n    return json.loads(FILE.read_text()) if FILE.exists() else dict(START)\n\n\ndef save(state):\n    FILE.write_text(json.dumps(state))\n\n\ndef reset(**changes):\n    save({**START, **changes})\n\n\ndef draw_kw(state):\n    parked = state[\"phase\"] in (\"hangar\", \"docked\")\n    thrusters = 0 if parked else LOADS[state[\"burn\"]]\n    containment = LOADS[\"containment\"] if state[\"antimatter_ng\"] > 0 else 0\n    return LOADS[\"flight_computer\"] + LOADS[\"navigation\"] + LOADS[\"sensors\"] + containment + thrusters\n\n\ndef check_budget(state):\n    draw = draw_kw(state)\n    if draw > BUDGET_KW:\n        raise ValueError(f\"power request denied: over budget (budget {BUDGET_KW} kW, asked {draw} kW)\")\n\n\ndef get_flight_state():\n    state = load()\n    return {**state, \"draw_kw\": draw_kw(state), \"budget_kw\": BUDGET_KW}\n\n\ndef give_order(name):\n    state = load()\n    if name not in ORDERS:\n        raise ValueError(f\"unknown order: {name}\")\n    to = ORDERS[name].get(state[\"phase\"])\n    if to is None:\n        raise ValueError(f\"cannot {name}: the Kestrel is {PHASE_TEXT[state['phase']]}\")\n    if name == \"capture\" and not state[\"scanned\"]:\n        raise ValueError(\"cannot capture: scan the trap station first\")\n    if name == \"dock\" and state[\"burn\"] == \"sprint\":\n        raise ValueError(\"cannot dock at sprint burn: set the thrusters to cruise first\")\n\n    state[\"phase\"] = to\n    if name == \"scan\":\n        state[\"scanned\"] = True\n    if name == \"capture\":\n        state[\"antimatter_ng\"] = 40\n    if name == \"dock\":\n        state[\"delivered_ng\"], state[\"antimatter_ng\"] = state[\"antimatter_ng\"], 0\n    check_budget(state)\n    save(state)\n    return {\"ok\": True, \"phase\": to, \"now\": PHASE_TEXT[to]}\n\n\ndef set_burn(burn):\n    state = load()\n    if burn not in (\"cruise\", \"sprint\"):\n        raise ValueError(f\"unknown burn profile: {burn}\")\n    state[\"burn\"] = burn\n    check_budget(state)\n    save(state)\n    return {\"ok\": True, \"burn\": burn, \"draw_kw\": draw_kw(state)}\n\n\nif __name__ == \"__main__\":\n    if sys.argv[1:] == [\"reset\"]:\n        reset()\n        print(\"Flight state reset: the Kestrel is parked in Hangar 7.\")\n    else:\n        print(json.dumps(get_flight_state(), indent=2))\n"}, "h3a": {"harness.py": "import json\nimport sys\n\nfrom anthropic import Anthropic\nfrom dotenv import load_dotenv\n\nimport suit\n\nload_dotenv()\nclient = Anthropic()\nMODEL = \"claude-sonnet-5-5\"\n\n# The tools the co-pilot may ask for. Each has a name, a description\n# and the shape of its input. The model reads all three.\nTOOLS = [\n    {\n        \"name\": \"get_flight_state\",\n        \"description\": \"Read the Kestrel's current flight state: phase, burn, power draw and what is aboard.\",\n        \"input_schema\": {\"type\": \"object\", \"properties\": {}},\n    },\n    {\n        \"name\": \"give_order\",\n        \"description\": \"Order.\",\n        \"input_schema\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}}, \"required\": [\"name\"]},\n    },\n    {\n        \"name\": \"set_burn\",\n        \"description\": \"Burn.\",\n        \"input_schema\": {\"type\": \"object\", \"properties\": {\"burn\": {\"type\": \"string\"}}, \"required\": [\"burn\"]},\n    },\n]\n\n\ndef run_tool(name, args):\n    \"\"\"The harness, not the model, is what actually runs a tool.\"\"\"\n    if name == \"get_flight_state\":\n        return suit.get_flight_state()\n    if name == \"give_order\":\n        return suit.give_order(args[\"name\"])\n    if name == \"set_burn\":\n        return suit.set_burn(args[\"burn\"])\n    raise ValueError(f\"unknown tool: {name}\")\n\n\ndef run(request):\n    # The whole conversation so far. The model remembers nothing between calls,\n    # so the harness sends all of it every time.\n    messages = [{\"role\": \"user\", \"content\": request}]\n    turn = 0\n\n    while True:\n        turn += 1\n        reply = client.messages.create(model=MODEL, max_tokens=1000, tools=TOOLS, messages=messages)\n        messages.append({\"role\": \"assistant\", \"content\": reply.content})\n\n        # No tool asked for: the co-pilot has finished. Leave the loop.\n        if reply.stop_reason != \"tool_use\":\n            return \"\".join(block.text for block in reply.content if block.type == \"text\")\n\n        # Run every tool the co-pilot asked for and hand the results back.\n        results = []\n        for block in reply.content:\n            if block.type != \"tool_use\":\n                continue\n            print(f\"[turn {turn}] co-pilot asks: {block.name}({json.dumps(block.input)})\")\n            output = run_tool(block.name, block.input)\n            print(f\"[turn {turn}] result: {json.dumps(output)}\")\n            results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": json.dumps(output)})\n        messages.append({\"role\": \"user\", \"content\": results})\n\n\nif __name__ == \"__main__\":\n    print()\n    print(run(sys.argv[1]))\n"}, "h3b": {"harness.py": "import json\nimport sys\n\nfrom anthropic import Anthropic\nfrom dotenv import load_dotenv\n\nimport suit\n\nload_dotenv()\nclient = Anthropic()\nMODEL = \"claude-sonnet-5-5\"\n\n# The tools the co-pilot may ask for. Each has a name, a description\n# and the shape of its input. The model reads all three.\nTOOLS = [\n    {\n        \"name\": \"get_flight_state\",\n        \"description\": \"Read the Kestrel's current flight state: phase, burn, power draw and what is aboard.\",\n        \"input_schema\": {\"type\": \"object\", \"properties\": {}},\n    },\n    {\n        \"name\": \"give_order\",\n        \"description\": (\n            \"Give the Kestrel one flight order. Orders only work in the right phase, in this sequence: \"\n            \"launch (from the hangar), jump (to the Aster system), approach (the trap station), scan (the trap), \"\n            \"capture (take the sample aboard), jump (back home), dock. \"\n            \"Read the flight state first if you are not sure of the phase. \"\n            \"A refused order comes back as an error that says why.\"\n        ),\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"name\": {\"type\": \"string\", \"enum\": [\"launch\", \"jump\", \"approach\", \"scan\", \"capture\", \"dock\"]},\n            },\n            \"required\": [\"name\"],\n        },\n    },\n    {\n        \"name\": \"set_burn\",\n        \"description\": (\n            \"Switch the thrusters between cruise (9 kW) and sprint (21 kW). \"\n            \"The reactor budget is 25 kW in total, and it refuses anything over.\"\n        ),\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\"burn\": {\"type\": \"string\", \"enum\": [\"cruise\", \"sprint\"]}},\n            \"required\": [\"burn\"],\n        },\n    },\n]\n\n\ndef run_tool(name, args):\n    \"\"\"The harness, not the model, is what actually runs a tool.\"\"\"\n    if name == \"get_flight_state\":\n        return suit.get_flight_state()\n    if name == \"give_order\":\n        return suit.give_order(args[\"name\"])\n    if name == \"set_burn\":\n        return suit.set_burn(args[\"burn\"])\n    raise ValueError(f\"unknown tool: {name}\")\n\n\ndef run(request):\n    # The whole conversation so far. The model remembers nothing between calls,\n    # so the harness sends all of it every time.\n    messages = [{\"role\": \"user\", \"content\": request}]\n    turn = 0\n\n    while True:\n        turn += 1\n        reply = client.messages.create(model=MODEL, max_tokens=1000, tools=TOOLS, messages=messages)\n        messages.append({\"role\": \"assistant\", \"content\": reply.content})\n\n        # No tool asked for: the co-pilot has finished. Leave the loop.\n        if reply.stop_reason != \"tool_use\":\n            return \"\".join(block.text for block in reply.content if block.type == \"text\")\n\n        # Run every tool the co-pilot asked for and hand the results back.\n        results = []\n        for block in reply.content:\n            if block.type != \"tool_use\":\n                continue\n            print(f\"[turn {turn}] co-pilot asks: {block.name}({json.dumps(block.input)})\")\n            try:\n                output = run_tool(block.name, block.input)\n                print(f\"[turn {turn}] result: {json.dumps(output)}\")\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": json.dumps(output)})\n            except ValueError as problem:\n                # A refused order is information, not a crash. Hand it back so the co-pilot can adapt.\n                print(f\"[turn {turn}] error: {problem}\")\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": str(problem), \"is_error\": True})\n        messages.append({\"role\": \"user\", \"content\": results})\n\n\nif __name__ == \"__main__\":\n    print()\n    print(run(sys.argv[1]))\n"}, "h4": {"harness.py": "import json\nimport sys\n\nfrom anthropic import Anthropic\nfrom dotenv import load_dotenv\n\nimport suit\n\nload_dotenv()\nclient = Anthropic()\nMODEL = \"claude-sonnet-5-5\"\n\n# The tools the co-pilot may ask for. Each has a name, a description\n# and the shape of its input. The model reads all three.\nTOOLS = [\n    {\n        \"name\": \"get_flight_state\",\n        \"description\": \"Read the Kestrel's current flight state: phase, burn, power draw and what is aboard.\",\n        \"input_schema\": {\"type\": \"object\", \"properties\": {}},\n    },\n    {\n        \"name\": \"give_order\",\n        \"description\": (\n rgs[\"burn\"])\n    raise ValueError(f\"unknown tool: {name}\")\n\n\ndef run(request):\n    # The whole conversation so far. The model remembers nothing between calls,\n    # so the harness sends all of it every time.\n    messages = [{\"role\": \"user\", \"content\": request}]\n    turn = 0\n\n    while True:\n        turn += 1\n        reply = client.messages.create(model=MODEL, max_tokens=1000, tools=TOOLS, messages=messages)\n        messages.append({\"role\": \"assistant\", \"content\": reply.content})\n\n        # No tool asked for: the co-pilot has finished. Leave the loop.\n        if reply.stop_reason != \"tool_use\":\n            return \"\".join(block.text for block in reply.content if block.type == \"text\")\n\n        # Run every tool the co-pilot asked for and hand the results back.\n        results = []\n        for block in reply.content:\n            if block.type != \"tool_use\":\n                continue\n            print(f\"[turn {turn}] co-pilot asks: {block.name}({json.dumps(block.input)})\")\n            try:\n                if needs_pilot(block.name, block.input) and not ask_pilot(block.name, block.input):\n                    raise ValueError(\"refused by the pilot. Do not retry this order; report where things stand.\")\n                output = run_tool(block.name, block.input)\n                print(f\"[turn {turn}] result: {json.dumps(output)}\")\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": json.dumps(output)})\n            except ValueError as problem:\n                # A refused order is information, not a crash. Hand it back so the co-pilot can adapt.\n                print(f\"[turn {turn}] error: {problem}\")\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": str(problem), \"is_error\": True})\n        messages.append({\"role\": \"user\", \"content\": results})\n\n\nif __name__ == \"__main__\":\n    print()\n    print(run(sys.argv[1]))\n"}, "h5": {"harness.py": "import argparse\nimport json\nfrom pathlib import Path\n\nfrom anthropic import Anthropic\nfrom dotenv import load_dotenv\n\nimport suit\n\nload_dotenv()\nclient = Anthropic()\nMODEL = \"claude-sonnet-5-5\"\n\n# Standing orders (the system prompt): sent with every call, ahead of the conversation.\nSYSTEM = Path(\"standing-orders.md\").read_text()\n\n# Stop rules: the loop ends here even if the co-pilot would carry on.\nMAX_TURNS = 12\nTOKEN_BUDGET = 20_000\n\n# The tools the co-pilot may ask for. Each has a name, a description\n# and the shape of its input. The model reads all three.\nTOOLS = [\n    {\n        \"name\": \"get_flight_state\",\n        \"description\": \"Read the Kestrel's current flight state: phase, burn, power draw and what is aboard.\",\n        \"input_schema\": {\"type\": \"object\", \"properties\": {}},\n    },\n    {\n        \"name\": \"give_order\",\n        \"description\": (\n            \"Give the Kestrel one flight order. Orders only work in the right phase, in this sequence: \"\n            \"launch (from the hangar), jump (to the Aster system), approach (the trap station), scan (the trap), \"\n            \"capture (take the sample aboard), jump (back home), dock. \"\n            \"Read the flight state first if you are not sure of the phase. \"\n            \"A refused order comes back as an error that says why.\"\n        ),\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"name\": {\"type\": \"string\", \"enum\": [\"launch\", \"jump\", \"approach\", \"scan\", \"capture\", \"dock\"]},\n            },\n            \"required\": [\"name\"],\n        },\n    },\n    {\n        \"name\": \"set_burn\",\n        \"description\": (\n            \"Switch the thrusters between cruise (9 kW) and sprint (21 kW). \"\n            \"The reactor budget is 25 kW in total, and it refuses anything over.\"\n        ),\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\"burn\": {\"type\": \"string\", \"enum\": [\"cruise\", \"sprint\"]}},\n            \"required\": [\"burn\"],\n        },\n    },\n]\n\n\n# Interlocks: orders that are hard to undo need the pilot's go-ahead.\n# Everything else the co-pilot may do on its own.\nASK_FIRST = {\"capture\", \"dock\"}\n\n\ndef needs_pilot(name, args):\n    return name == \"give_order\" and args.get(\"name\") in ASK_FIRST\n\n\ndef ask_pilot(name, args):\n    answer = input(f\"INTERLOCK  co-pilot wants {name}({json.dumps(args)}). Allow? [y/n] \")\n    return answer.strip().lower() == \"y\"\n\n\ndef run_tool(name, args):\n    \"\"\"The harness, not the model, is what actually runs a tool.\"\"\"\n    if name == \"get_flight_state\":\n        return suit.get_flight_state()\n    if name == \"give_order\":\n        return suit.give_order(args[\"name\"])\n    if name == \"set_burn\":\n        return suit.set_burn(args[\"burn\"])\n    raise ValueError(f\"unknown tool: {name}\")\n\n\ndef run(request, max_turns=MAX_TURNS):\n    # The whole conversation so far. The model remembers nothing between calls,\n    # so the harness sends all of it every time.\n    messages = [{\"role\": \"user\", \"content\": request}]\n    turn = 0\n    spent = 0\n\n    while turn < max_turns and spent < TOKEN_BUDGET:\n        turn += 1\n        reply = client.messages.create(\n            model=MODEL, max_tokens=1000, system=SYSTEM, tools=TOOLS, messages=messages\n        )\n        messages.append({\"role\": \"assistant\", \"content\": reply.content})\n        # input_tokens is the size of everything just sent: the context.\n        spent += reply.usage.input_tokens + reply.usage.output_tokens\n        print(f\"[turn {turn}] context {reply.usage.input_tokens:,} tokens, {spent:,} spent\")\n\n        # No tool asked for: the co-pilot has finished. Leave the loop.\n        if reply.stop_reason != \"tool_use\":\n            return \"\".join(block.text for block in reply.content if block.type == \"text\")\n\n        # Run every tool the co-pilot asked for and hand the results back.\n        results = []\n        for block in reply.content:\n            if block.type != \"tool_use\":\n                continue\n            print(f\"[turn {turn}] co-pilot asks: {block.name}({json.dumps(block.input)})\")\n            try:\n                if needs_pilot(block.name, block.input) and not ask_pilot(block.name, block.input):\n                    raise ValueError(\"refused by the pilot. Do not retry this order; report where things stand.\")\n                output = run_tool(block.name, block.input)\n                print(f\"[turn {turn}] result: {json.dumps(output)}\")\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": json.dumps(output)})\n            except ValueError as problem:\n                # A refused order is information, not a crash. Hand it back so the co-pilot can adapt.\n                print(f\"[turn {turn}] error: {problem}\")\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": str(problem), \"is_error\": True})\n        messages.append({\"role\": \"user\", \"content\": results})\n\n    # A stop rule fired. Say so plainly, with where things stand.\n    limit = f\"{max_turns} turns\" if turn >= max_turns else f\"{TOKEN_BUDGET:,} tokens\"\n    now = suit.PHASE_TEXT[suit.get_flight_state()[\"phase\"]]\n    return f\"Stopped: reached the limit of {limit}. The Kestrel is {now}.\"\n\n\nif __name__ == \"__main__\":\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"request\")\n    parser.add_argument(\"--max-turns\", type=int, default=MAX_TURNS)\n    options = parser.parse_args()\n    print()\n    print(run(options.request, options.max_turns))\n", "standing-orders.md": "You are the co-pilot of the KF-07 Kestrel Mk II on the Aster retrieval run.\nThe pilot gives you a request. You carry it out with your tools, one order at a time.\n\nStanding orders:\n1. Read the flight state before your first order, so you know the phase.\n2. The reactor budget is 25 kW. Containment needs 6 kW once the sample is aboard,\n   so set the burn to cruise before a capture and before docking.\n3. If an order is refused, read the reason and fix the cause. Never repeat a refused order unchanged.\n4. If the pilot refuses an order at the interlock, stop and report. Do not ask again.\n5. Do only what was asked. If the request stops at the trap station, stop there.\n6. Finish with one or two plain sentences: where the Kestrel is, and anything the pilot should know.\n"}, "h6": {"harness.py": "import argparse\nimport json\nimport time\nfrom pathlib import Path\n\nfrom anthropic import Anthropic\nfrom dotenv import load_dotenv\n\nimport suit\n\nload_dotenv()\nclient = Anthropic()\nMODEL = \"claude-sonnet-5-5\"\n\n# Standing orders (the system prompt): sent with every call, ahead of the conversation.\nSYSTEM = Path(\"standing-orders.md\").read_text()\n\n# Stop rules: the loop ends here even if the co-pilot would carry on.\nMAX_TURNS = 12\nTOKEN_BUDGET = 20_000\n\n# The tools the co-pilot may ask for. Each has a name, a description\n# and the shape of its input. The model reads all three.\nTOOLS = [\n    {\n        \"name\": \"get_flight_state\",\n        \"description\": \"Read the Kestrel's current flight state: phase, burn, power draw and what is aboard.\",\n        \"input_schema\": {\"type\": \"object\", \"properties\": {}},\n    },\n    {\n        \"name\": \"give_order\",\n        \"description\": (\n            \"Give the Kestrel one flight order. Orders only work in the right phase, in this sequence: \"\n            \"launch (from the hangar), jump (to the Aster system), approach (the trap station), scan (the trap), \"\n            \"capture (take the sample aboard), jump (back home), dock. \"\n            \"Read the flight state first if you are not sure of the phase. \"\n            \"A refused order comes back as an error that says why.\"\n        ),\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"name\": {\"type\": \"string\", \"enum\": [\"launch\", \"jump\", \"approach\", \"scan\", \"capture\", \"dock\"]},\n            },\n            \"required\": [\"name\"],\n        },\n    },\n    {\n        \"name\": \"set_burn\",\n        \"description\": (\n            \"Switch the thrusters between cruise (9 kW) and sprint (21 kW). \"\n            \"The reactor budget is 25 kW in total, and it refuses anything over.\"\n        ),\n        \"input_schema\": {\n            \"type\": \"object\",\n            \"properties\": {\"burn\": {\"type\": \"string\", \"enum\": [\"cruise\", \"sprint\"]}},\n            \"required\": [\"burn\"],\n        },\n    },\n]\n\n\n# Interlocks: orders that are hard to undo need the pilot's go-ahead.\n# Everything else the co-pilot may do on its own.\nASK_FIRST = {\"capture\", \"dock\"}\n\n\ndef needs_pilot(name, args):\n    return name == \"give_order\" and args.get(\"name\") in ASK_FIRST\n\n\ndef ask_pilot(name, args):\n    answer = input(f\"INTERLOCK  co-pilot wants {name}({json.dumps(args)}). Allow? [y/n] \")\n    return answer.strip().lower() == \"y\"\n\n\ndef run_tool(name, args):\n    \"\"\"The harness, not the model, is what actually runs a tool.\"\"\"\n    if name == \"get_flight_state\":\n        return suit.get_flight_state()\n    if name == \"give_order\":\n        return suit.give_order(args[\"name\"])\n    if name == \"set_burn\":\n        return suit.set_burn(args[\"burn\"])\n    raise ValueError(f\"unknown tool: {name}\")\n\n\ndef record(event, **details):\n    \"\"\"The flight recorder (trace): one line per thing that happened.\"\"\"\n    with open(\"trace.jsonl\", \"a\") as tape:\n        tape.write(json.dumps({\"at\": time.strftime(\"%H:%M:%S\"), \"event\": event, **details}) + \"\\n\")\n\n\ndef run(request, max_turns=MAX_TURNS, model=client, ask=ask_pilot):\n    # The whole conversation so far. The model remembers nothing between calls,\n    # so the harness sends all of it every time.\n    messages = [{\"role\": \"user\", \"content\": request}]\n    turn = 0\n    spent = 0\n    record(\"request\", text=request)\n\n    while turn < max_turns and spent < TOKEN_BUDGET:\n        turn += 1\n        reply = model.messages.create(\n            model=MODEL, max_tokens=1000, system=SYSTEM, tools=TOOLS, messages=messages\n        )\n        messages.append({\"role\": \"assistant\", \"content\": reply.content})\n        # input_tokens is the size of everything just sent: the context.\n        spent += reply.usage.input_tokens + reply.usage.output_tokens\n        print(f\"[turn {turn}] context {reply.usage.input_tokens:,} tokens, {spent:,} spent\")\n\n        # No tool asked for: the co-pilot has finished. Leave the loop.\n        if reply.stop_reason != \"tool_use\":\n            answer = \"\".join(block.text for block in reply.content if block.type == \"text\")\n            record(\"answer\", turn=turn, text=answer)\n            return answer\n\n        # Run every tool the co-pilot asked for and hand the results back.\n        results = []\n        for block in reply.content:\n            if block.type != \"tool_use\":\n                continue\n            print(f\"[turn {turn}] co-pilot asks: {block.name}({json.dumps(block.input)})\")\n            record(\"tool_call\", turn=turn, tool=block.name, input=block.input)\n            try:\n                if needs_pilot(block.name, block.input):\n                    allowed = ask(block.name, block.input)\n                    record(\"interlock\", turn=turn, tool=block.name, allowed=allowed)\n                    if not allowed:\n                        raise ValueError(\"refused by the pilot. Do not retry this order; report where things stand.\")\n                output = run_tool(block.name, block.input)\n                record(\"tool_result\", turn=turn, output=output)\n                print(f\"[turn {turn}] result: {json.dumps(output)}\")\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": json.dumps(output)})\n            except ValueError as problem:\n                # A refused order is information, not a crash. Hand it back so the co-pilot can adapt.\n                record(\"tool_error\", turn=turn, error=str(problem))\n                print(f\"[turn {turn}] error: {problem}\")\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": str(problem), \"is_error\": True})\n        messages.append({\"role\": \"user\", \"content\": results})\n\n    # A stop rule fired. Say so plainly, with where things stand.\n    limit = f\"{max_turns} turns\" if turn >= max_turns else f\"{TOKEN_BUDGET:,} tokens\"\n    now = suit.PHASE_TEXT[suit.get_flight_state()[\"phase\"]]\n    record(\"stopped\", turn=turn, limit=limit)\n    return f\"Stopped: reached the limit of {limit}. The Kestrel is {now}.\"\n\n\nif __name__ == \"__main__\":\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"request\")\n    parser.add_argument(\"--max-turns\", type=int, default=MAX_TURNS)\n    options = parser.parse_args()\n    print()\n    print(run(options.request, options.max_turns))\n", "replay.py": "\"\"\"Print the flight recorder for the last run, one event per line.\"\"\"\nimport json\n\nevents = [json.loads(line) for line in open(\"trace.jsonl\")]\nstart = max(i for i, event in enumerate(events) if event[\"event\"] == \"request\")\n\nfor event in events[start:]:\n    details = {key: value for key, value in event.items() if key not in (\"at\", \"event\")}\n    print(event[\"at\"], event[\"event\"].ljust(12), json.dumps(details))\n", "test_harness.py": "\"\"\"Tests for the harness's own rules. No real model is called: a scripted one stands in.\"\"\"\nfrom types import SimpleNamespace as Reply\n\nimport harness\nimport suit\n\n\ndef asks(tool, **args):\n    \"\"\"A model reply that asks for one tool.\"\"\"\n    block = Reply(type=\"tool_use\", id=\"call-1\", name=tool, input=args)\n    return Reply(stop_reason=\"tool_use\", content=[block], usage=Reply(input_tokens=0, output_tokens=0))\n\n\ndef says(text):\n    \"\"\"A model reply that is a final answer.\"\"\"\n    block = Reply(type=\"text\", text=text)\n    return Reply(stop_reason=\"end_turn\", content=[block], usage=Reply(input_tokens=0, output_tokens=0))\n\n\nclass ScriptedModel:\n    \"\"\"Plays back the replies it is given, in order, and keeps what it was sent.\"\"\"\n\n    def __init__(self, *replies):\n        self.replies = list(replies)\n        self.sent = []\n        self.messages = self  # so model.messages.create(...) works like the real client\n\n    def create(self, **request):\n        self.sent.append(request)\n        return self.replies.pop(0)\n\n\ndef test_capture_always_goes_through_the_interlock():\n    suit.reset(phase=\"trap\", scanned=True)\n    asked = []\n    model = ScriptedModel(asks(\"give_order\", name=\"capture\"), says(\"Sample aboard.\"))\n\n    harness.run(\"capture the sample\", model=model, ask=lambda tool, args: asked.append(args) or True)\n\n    assert asked == [{\"name\": \"capture\"}]\n    assert suit.get_flight_state()[\"antimatter_ng\"] == 40\n\n\ndef test_a_refusal_changes_nothing_and_reaches_the_copilot_as_an_error():\n    suit.reset(phase=\"trap\", scanned=True)\n    model = ScriptedModel(asks(\"give_order\", name=\"capture\"), says(\"Holding.\"))\n\n    harness.run(\"capture the sample\", model=model, ask=lambda tool, args: False)\n\n    assert suit.get_flight_state()[\"antimatter_ng\"] == 0\n    # The conversation is: request, the co-pilot's ask, then the tool results.\n    result = model.sent[1][\"messages\"][2][\"content\"][0]\n    assert result[\"is_error\"] is True\n    assert \"refused by the pilot\" in result[\"content\"]\n\n\ndef test_the_loop_stops_at_the_turn_limit():\n    suit.reset()\n    model = ScriptedModel(*[asks(\"get_flight_state\") for _ in range(10)])\n\n    answer = harness.run(\"keep checking\", max_turns=3, model=model)\n\n    assert answer == \"Stopped: reached the limit of 3 turns. The Kestrel is parked in Hangar 7.\"\n    assert len(model.sent) == 3\n"}, "s0": {"pyproject.toml": "[project]\nname = \"copilot\"\nversion = \"0.1.0\"\nrequires-python = \">=3.12\"\ndependencies = [\n    \"anthropic>=0.80.0\",\n    \"python-dotenv>=1.1.0\",\n]\n"}};

const KW=new Set('import from def return if else elif while for in not and or try except as raise class with continue pass lambda is None True False'.split(' '));
function hlPy(line){
  let out='',i=0;const n=line.length;
  while(i<n){
    const c=line[i];
    if(c==='#'){out+='<span class="c">'+esc(line.slice(i))+'</span>';break;}
    if(c==='"'||c==="'"){
      const tri=line.substr(i,3)===c+c+c;let j=i+(tri?3:1);
      if(tri){const k=line.indexOf(c+c+c,j);j=k<0?n:k+3;}
      else{while(j<n&&line[j]!==c){if(line[j]==='\\')j++;j++;}j=Math.min(n,j+1);}
      out+='<span class="s">'+esc(line.slice(i,j))+'</span>';i=j;continue;}
    if(/[A-Za-z_]/.test(c)){let j=i;while(j<n&&/\w/.test(line[j]))j++;const w=line.slice(i,j);
      if((w==='f'||w==='r')&&(line[j]==='"'||line[j]==="'")){out+=esc(w);i=j;continue;}
      out+=KW.has(w)?'<span class="k">'+w+'</span>':/^[A-Z][A-Z_]+$/.test(w)?'<span class="t">'+w+'</span>':esc(w);i=j;continue;}
    out+=esc(c);i++;
  }
  return out;
}
function codeHtml(path,text,added){
  const py=/\.py$/.test(path),lines=text.replace(/\n$/,'').split('\n'),set=new Set(added||[]);let doc=false;
  return lines.map((l,n)=>{
    let h;
    if(py){const q=(l.match(/"""/g)||[]).length;
      if(doc||(q===1&&/^\s*"""/.test(l))){h='<span class="s">'+esc(l)+'</span>';if(q===1)doc=!doc;}
      else h=hlPy(l);}
    else h=/^\s*#/.test(l)&&!/\.md$/.test(path)?'<span class="c">'+esc(l)+'</span>':esc(l);
    return '<span class="pl'+(set.has(n)?' new':'')+'"><i>'+(n+1)+'</i>'+(h||' ')+'</span>';}).join('');
}
function addedLines(prev,next){
  if(prev===undefined)return 'new';
  const a=prev.split('\n'),b=next.split('\n'),m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Uint16Array(n+1));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<m&&j<n){if(a[i]===b[j]){i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else{out.push(j);j++;}}
  while(j<n){out.push(j);j++;}
  return out;
}

/* 1 */{title:'Briefing',long:'Briefing: a model can only talk',mins:12,
idea:`<p>The Kestrel is getting a co-pilot: an AI that can take a request such as "take us to the trap station" and fly it. The AI itself is a <strong>language model</strong>. On its own a model does exactly one thing: you send it text, it sends text back. It cannot read an instrument, press a control or remember what you said a minute ago.</p>
<p>Everything else is the <strong>agent harness</strong>: the code wrapped around the model that lets it act. Model plus harness is what people call an <strong>agent</strong>.</p>
${say('ilse','So the co-pilot is a brain in a jar until we strap it into the cockpit.')}
${say('tomo','Right. The harness is the seat, the linkages to the controls, the interlocks and the flight recorder. I build those. You decide what they should be.')}
<h2>Why this is a design job</h2>
<p>Most of what makes an agent good or dangerous is decided in the harness, and those decisions are design decisions: what it is allowed to touch, when it must ask a person, what it is told, when it stops, and what it shows of its work. You do not need to be the one who writes the code, but you do need to know what the parts are. This guide has you build a small harness so that each part is concrete, and has you make one design decision per lesson for an agent of your own.</p>
<h2>The parts of a harness</h2>
<dl class="terms">
<dt>The loop</dt><dd>Ask the model, do what it asks for, show it the result, ask again. Repeats until the model answers without asking for anything.</dd>
<dt>Control linkages (tools)</dt><dd>The named actions the model may ask for. The harness runs them; the model only asks.</dd>
<dt>Interlocks (permissions, human in the loop)</dt><dd>Which actions run freely and which wait for a person.</dd>
<dt>Standing orders (the system prompt)</dt><dd>What the model is told before every request.</dd>
<dt>Working memory (context)</dt><dd>The conversation so far. The harness keeps it and resends it, because the model keeps nothing.</dd>
<dt>Stop rules (limits)</dt><dd>When the loop ends even if the model would carry on.</dd>
<dt>Flight recorder (trace) and tests</dt><dd>The record of what happened, and the proof that the rules hold.</dd></dl>
<h2>How this guide works</h2>
<p>On the right, the Mk II blueprint and a panel show the harness as you fit it. Under them are two tabs. <strong>Build</strong> is a terminal where you build the Kestrel's co-pilot harness in Python, one command at a time. <strong>Design</strong> is your own harness spec, which fills in as you make a decision in each lesson. Lesson 7 finishes the spec so you can hand it to a coding agent or a developer.</p>
<p>The blueprint's callouts: <strong>K</strong> cockpit, where the co-pilot (model) sits; <strong>S</strong> sensors (read tools); <strong>P</strong> propulsion (action tools); <strong>L</strong> the magnetic bottle on the right arm (the flight itself); <strong>G</strong> the gantry clamps (interlocks); <strong>R</strong> reactor (stop rules); <strong>C</strong> communication array (flight recorder).</p>
<h2>Where the code goes</h2>
<p>The harness lives in a new folder named <code>copilot</code> at the <strong>root</strong> of the <code>kestrel-simulator</code> repo, beside <code>api</code> and <code>cockpit</code>, not inside either. It is Python, like <code>api</code>, and it is managed with <code>uv</code>, a tool that creates the project, fetches packages and runs your files with the same commands on Windows, macOS and Linux.</p>

<li>You need an API key from the <a href="https://platform.claude.com/" target="_blank" rel="noopener">Claude Console</a>. Real calls cost money: the whole guide comes to a few cents.</li>
<li>The sandbox on this page calls no real model. Its replies are recorded, so they are the same every time. A real model words things differently on each run and may take a slightly different route.</li></ul>`)}`,

/* 2 */{title:'The loop',long:'The loop: ask, act, show, repeat',mins:12,
idea:`<p>The heart of every agent harness is a short loop. It is the same loop whether the agent flies a mobile suit or files expense reports.</p>
<ol><li>Send the model the conversation so far, with a list of the tools it may ask for.</li>
<li>The model replies. Either it <strong>asks for a tool</strong> ("read the flight state"), or it gives a <strong>final answer</strong>.</li>
<li>If it asked for a tool, the harness runs it and adds the result to the conversation. Back to step 1.</li>
<li>If it gave a final answer, the loop ends.</li></ol>
<p>One pass through the loop is a <strong>turn</strong>. The reply carries a field named <code>stop_reason</code> that tells the harness which of the two happened: <code>"tool_use"</code> means "I am waiting for a tool result", and anything else means the model has stopped.</p>
${say('tomo','The model never touches the suit. It hands me a slip that says "read the flight state". I do it and hand the reading back.')}
<h2>The conversation is the memory</h2>
<p>The model keeps nothing between calls. So the harness holds a list named <code>messages</code> and sends <strong>all of it</strong> every turn: the pilot's request, each thing the model asked for, and each result. That growing list is the model's working memory (its <strong>context</strong>). Lesson 5 comes back to what happens when it gets long.</p>
<h2>A stand-in for the suit</h2>
<p>The edit below adds <code>suit.py</code>, a small copy of the Kestrel's flight rules so that this folder runs on its own. It knows the phases, the orders and the 25 kW reactor budget, and keeps the flight state in a file named <code>flight.json</code>. In the finished simulator these calls would go to <code>kestrel-control</code> (the FastAPI server) instead.</p>`,

notes:`<h2>Reading the loop</h2>
<p>Three lines in <code>run()</code> carry the idea. <code>messages.append({"role": "assistant", …})</code> stores what the model said, including what it asked for. <code>if reply.stop_reason != "tool_use": return …</code> is the exit. And the final <code>messages.append({"role": "user", "content": results})</code> hands the tool results back, each tagged with the <code>tool_use_id</code> of the request it answers, so the model can match them up.</p>
<h2>Agent or workflow?</h2>
<p>If you can draw the job as a flowchart with no "it depends" in it, write the flowchart as code and call the model inside the steps that need language. That is a <strong>workflow</strong>. Use an agent loop when the path cannot be known ahead of time. Getting to the trap station is a good example: what to do next depends on where the suit already is.</p>
