/* 3 */{title:'Tools',long:'Control linkages: designing tools',mins:15,
idea:`<p>A tool has three parts, and the model reads all three: a <strong>name</strong>, a <strong>description</strong>, and the shape of its input (the <strong>input schema</strong>). The description is the only manual the model gets. Writing it is interface design for a reader that follows instructions literally and cannot ask you what you meant.</p>
${say('ilse','So a tool description is microcopy. Just for a very literal user.')}
${say('tomo','And the schema is the form validation. If a field has six legal values, list the six.')}
<h2>What a good description says</h2>
<ul><li><strong>What it does</strong>, in the words the user would use.</li>
<li><strong>When to use it</strong>, and what to do first if unsure.</li>
<li><strong>What comes back</strong>, including what a refusal looks like.</li>
<li><strong>Limits</strong> the model must respect, with the numbers.</li></ul>
<h2>Errors are information</h2>
<p>The flight rules refuse some orders: you cannot jump from the hangar. When a tool refuses, the harness must hand the reason back to the model as a result marked as an error (<code>is_error</code>). The model reads it and tries something else. If the harness lets the error escape instead, the whole program crashes mid-flight.</p>`,
labIntro:'Add two action tools the lazy way and watch it fail. Then write them properly and watch the same request succeed.',
tasks:[
E_('h3a','Add two tools with lazy descriptions','<code>harness.py</code> gains <code>give_order</code> and <code>set_burn</code>. Look at their descriptions: one word each. The input is any text at all.','Action tools are fitted, but the panel marks them vague.',['harness.py']),
C_(RUNQ('Take us to the trap station'),'Try a real request','With a one-word description, the model has to guess what an order looks like.','The co-pilot guessed <code>"go to the trap station"</code> as the order name. The flight rules refused it, nothing caught the refusal, and the harness crashed with a traceback. Two faults: a description that left the model guessing, and an error that was not handed back.',r=>ran(r)&&r.meta.crashed),
E_('h3b','Write the tools properly','Same two tools. The descriptions now say what each does, the sequence the orders go in, and the reactor figures. Each input is a fixed list of choices (an <code>enum</code>). And <code>run()</code> wraps the tool call in <code>try / except</code>, so a refusal goes back to the co-pilot as an error result.','Green lines mark the changes. Parts fitted: errors handed back.',['harness.py']),
C_(RUNQ('Take us to the trap station'),'Run the same request again','Nothing else has changed: same model, same request.','It read the state, then launched, jumped and approached, one order per turn. The gantry opened and the suit left the hangar.',r=>ran(r)&&!r.meta.crashed&&G.sim.s.flight.phase==='trap'),
C_(RUNQ('Go to sprint, scan the trap and capture the sample'),'Give it an order that will be refused','At sprint the suit draws all 25 kW. Capturing adds 6 kW for containment. The co-pilot does not know that yet.','The capture was refused: over budget, 31 kW asked. The error went back to the co-pilot, which dropped to cruise and captured on the next try. The harness did not crash, and the model recovered by reading the reason.',r=>ran(r)&&r.meta.errors>=1&&G.sim.s.flight.antimatter_ng===40),
P_('tools','Decide: what size are your agent’s tools?','The Kestrel has three tools, each a thing the pilot would name. Choose the approach for your own agent.')
],
notes:`<h2>What changed between the two runs</h2>
<p>Only words and a safety net. The first description, "Order.", told the model nothing, so it invented an order name. The second listed the legal orders and their sequence, and the <code>enum</code> made any other value impossible to send. Most agent failures that look like "the model is not smart enough" are a tool the model was never properly told about.</p>
<h2>Tools wrap rules; they do not replace them</h2>
<p><code>give_order</code> does not move the suit itself. It calls the flight rules, and the rules decided that a capture at sprint is over budget. Keep your product's rules in the product and let tools call them. Then the agent cannot do anything a person using the product could not do.</p>
<h2>One thing to notice</h2>
<p>The co-pilot just took 40 ng of antimatter aboard, and nobody was asked. The rules allowed it, so it happened. That is the subject of the next lesson.</p>
${own(`<ul><li>If a run ends somewhere unexpected, <code>uv run suit.py reset</code> puts the Kestrel back in the hangar.</li>
<li>Commit and push: <code>git add .</code>, <code>git commit -m "Add order and burn tools with error hand-back"</code>, <code>git push</code>.</li></ul>`)}`,
quiz:[
{q:'A tool input has exactly six legal values. What is the best way to tell the model?',opts:['Mention them somewhere in the system prompt','List them as an enum in the input schema and name them in the description','Let the model try values until one works'],a:1,why:'An enum makes any other value impossible to send, and the description explains when each applies.'},
{q:'A tool refuses an order. What should the harness do?',opts:['Crash, so a developer notices','Hide the error and report success','Hand the reason back to the model as an error result'],a:2,why:'The reason is information. The model can read it and correct course, as it did with the over-budget capture.'}],
reading:[
['Define tools','https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools','Names, descriptions and input schemas, with guidance on writing descriptions.'],
['Handle tool calls','https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls','Returning results and errors, including the is_error flag used here.'],
['Writing effective tools for agents','https://www.anthropic.com/engineering/writing-tools-for-agents','Anthropic’s engineering notes on designing and testing tools.']]},
/* 4 */{title:'Interlocks',long:'Interlocks: when the agent must ask',mins:14,
idea:`<p>At the end of the last lesson the co-pilot captured antimatter on its own say-so. The rules allowed it, and that was the problem: "allowed by the rules" and "fine to do without asking" are different questions. The second one is answered by <strong>interlocks</strong>, which in real terms are <strong>permissions</strong> with a <strong>human in the loop</strong>.</p>
${say('ilse','I do not want a prompt on every order. Pilots will stop reading them.')}
${say('tomo','Then sort the orders. Most go straight through. A few wait for a hand on the lever.')}
<h2>Three tiers</h2>
<dl class="terms">
<dt>Auto</dt><dd>Reading, and anything easily reversed. Runs without asking.</dd>
<dt>Ask</dt><dd>Hard or impossible to undo, costly, or visible to other people. The harness pauses and a person says yes or no.</dd>
<dt>Never</dt><dd>Not offered as a tool at all. The safest interlock is a control the agent does not have.</dd></dl>
<h2>The interlock lives in the harness</h2>
<p>You could write "always ask before capturing" in the standing orders and hope. Do not rely on that for anything that matters. A model follows instructions most of the time; code follows them every time. The interlock here is an <code>if</code> statement that runs <strong>before</strong> the tool does, and the model cannot talk its way past it.</p>`,
labIntro:'Sort the Kestrel’s actions into tiers, fit the interlock, then allow one order and refuse another.',
tasks:[
S_('Sort the actions into tiers','The question for each card: if the co-pilot got this wrong, could the pilot simply undo it?',['Auto','Ask the pilot','Never'],[
 ['Read the flight state',0,'Reading changes nothing, so it never needs a prompt.'],
 ['Switch between cruise and sprint',0,'It can be switched straight back, and the reactor budget already guards it.'],
 ['Capture the antimatter sample',1,'Antimatter cannot be un-captured, so a person confirms.'],
 ['Dock and hand the sample to the vault',1,'Docking ends the mission. That is the pilot’s call.'],
 ['Raise the 25 kW reactor budget',2,'A safety limit is not the agent’s to change. Do not build this tool.'],
 ['Erase the flight recorder',2,'An agent must never be able to remove the record of what it did.']],
 'Two auto, two ask, two never. The “never” cards are simply not built as tools.'),
E_('h4','Fit the interlock','<code>harness.py</code> gains <code>ASK_FIRST</code>, the set of orders that need the pilot, and <code>ask_pilot()</code>, which prints the request and waits for y or n. In <code>run()</code>, the check sits just before <code>run_tool()</code>. A refusal becomes an error result, the same way a refused order does.','The gantry callout <strong>G</strong> is armed: capture and dock now wait for the pilot.',['harness.py']),
C_('uv run suit.py reset','Put the Kestrel back in the hangar','The last lesson left the suit at the trap station with the sample aboard. Start this flight clean.','Parked in Hangar 7, nothing aboard.',r=>r.meta.cmd==='reset'),
C_(RUNQ('Fly out to the trap station, scan it and capture the sample'),'Fly out to the capture','Routine orders go straight through. Watch for the harness to stop and ask.','Launch, jump, approach and scan ran without a prompt. At capture the harness stopped: the loop is paused at the interlock and nothing has happened yet.',null,{untilAsk:true}),
C_('y','Allow the capture','The prompt shows exactly what the co-pilot wants to do. Answer <code>y</code>.','You allowed it, the capture ran, and the co-pilot reported the sample aboard.'),
C_(RUNQ('Take us home and dock'),'Head home','The jump home is routine. Docking is not.','The jump ran. At dock, the harness is waiting for you again.',null,{untilAsk:true}),
C_('n','Refuse the docking','Say no this time, and watch what the co-pilot does with a refusal.','The dock never ran. The refusal went back as an error result that says not to retry, and the co-pilot stopped and reported that it is holding on the return leg.'),
P_('locks','Decide: when does your agent ask?','Too few prompts is dangerous. Too many trains people to press yes without reading. Choose a policy for your own agent.')
],
notes:`<h2>What a good prompt shows</h2>
<p>The interlock printed the exact tool and input: <code>give_order({"name": "capture"})</code>. A person can only give a meaningful yes to something specific. When you design this for a real screen, show the action in the user's words, what it will change, and whether it can be undone. "Allow the agent to continue?" is not an informed question.</p>
<h2>A refusal is also a result</h2>
<p>When you answered <code>n</code>, the harness did not end the program. It told the co-pilot the order was refused and not to retry, and the co-pilot wrote a sensible report. Design the "no" path as carefully as the "yes" path: what the agent is told, and what the person sees next.</p>
${own(`<ul><li>On your machine the prompt appears in the same terminal. Type <code>y</code> or <code>n</code> and press Enter.</li>
<li>Commit and push: <code>git add .</code>, <code>git commit -m "Add pilot interlock for capture and dock"</code>, <code>git push</code>.</li></ul>`)}`,
quiz:[
{q:'Where should the rule “ask before capturing” be enforced?',opts:['In the system prompt, in capital letters','In harness code that runs before the tool does','In the tool description'],a:1,why:'A prompt is advice the model usually follows. Code in the harness runs every time.'},
{q:'What is the safest way to handle an action the agent must never take?',opts:['Do not offer it as a tool','Ask the user twice','Describe the danger in the tool description'],a:0,why:'An agent cannot use a control it does not have.'}],
reading:[
['Building effective agents','https://www.anthropic.com/engineering/building-effective-agents','Includes guidance on human checkpoints and where autonomy is appropriate.'],
['Scaling Managed Agents: decoupling the brain from the hands','https://www.anthropic.com/engineering/managed-agents','How a production harness separates the model from the things it can act on.']]},
/* 5 */{title:'Orders + limits',long:'Standing orders, memory and stop rules',mins:14,
idea:`<p>Three things are still missing. The co-pilot has never been told how the pilot wants it to work. Its memory grows without limit. And nothing stops the loop if the co-pilot never finishes.</p>
<h2>Standing orders (the system prompt)</h2>
<p>The <strong>system prompt</strong> is text sent with every call, ahead of the conversation. It is where you put what the agent is, how it should work, and what it should know before any request. Keep it in its own file, in plain numbered sentences, so that a designer can read and change it without touching code.</p>
${say('ilse','Last time it tried to capture at sprint and had to be told no. I would rather it knew.')}
${say('tomo','Write it down once. Standing order: cruise before a capture.')}
<h2>Working memory (context)</h2>
<p>Every turn adds to <code>messages</code>, and all of it is sent again on the next turn. Size is measured in <strong>tokens</strong> (roughly three-quarters of a word each). A long conversation costs more on every turn, and a model's attention gets worse as its context fills. A model also has a hard maximum, its <strong>context window</strong>. A harness for long jobs has to manage this: trim old tool results, summarise, or hand over to a fresh conversation with notes.</p>
<h2>Stop rules</h2>
<p>A loop needs an exit that does not depend on the model. Two cheap ones cover most cases: a maximum number of <strong>turns</strong>, and a <strong>token budget</strong>. When either fires, the harness stops and says so plainly.</p>`,
labIntro:'Write the standing orders, add the two stop rules, and see each take effect.',
tasks:[
E_('h5','Add standing orders and stop rules','A new file, <code>standing-orders.md</code>, in <code>copilot</code>: six numbered orders. <code>harness.py</code> reads it into <code>SYSTEM</code> and sends it with every call. The loop’s <code>while True</code> becomes <code>while turn &lt; max_turns and spent &lt; TOKEN_BUDGET</code>, and each turn prints the size of the context.','The reactor callout <strong>R</strong> is live: the panel now counts turns and tokens.',['standing-orders.md','harness.py']),
C_('uv run suit.py reset','Back to the hangar','Start this flight clean.','Parked in Hangar 7.',r=>r.meta.cmd==='reset'),
C_(RUNQ('Fly the Aster run')+' --max-turns 3','Hit the turn limit on purpose','The whole mission needs about nine turns. <code>--max-turns 3</code> allows three. The flag goes after the closing quote.','Three turns ran: read the state, launch, jump. Then the harness stopped the loop and reported the limit and where the Kestrel is. Nothing was left half-done, because each turn is one whole order.',r=>ran(r)&&r.meta.stopped),
C_(RUNQ('Go to sprint, fly on to the trap station, scan it and capture the sample'),'See the standing orders at work','The same kind of request that was refused for power in lesson 3. Watch the context figure grow each turn.','Before the capture, the co-pilot set the burn to cruise without being refused first. That is standing order 2. The harness is now waiting at the interlock.',null,{untilAsk:true}),
C_('y','Allow the capture','Interlocks still apply. Standing orders change how the co-pilot behaves, not what it is permitted to do.','Sample aboard, with no refused order and no wasted turn.'),
P_('limits','Decide: what happens when a limit is hit?','The Kestrel stops and reports. That suits a short job with a pilot present. A long job may need something else. Choose for your own agent.')
],
notes:`<h2>Orders shape behaviour; code enforces limits</h2>
<p>Compare the two halves of this lesson. The standing orders made the co-pilot <em>better</em>: fewer refused orders, shorter reports. But they are advice. The stop rules and the interlock are code, and they hold even if the model ignores every word of its orders. Put preferences in the prompt and guarantees in the harness.</p>
<h2>Watching the context grow</h2>
<p>Each turn's context figure was larger than the last, because every request and result is added and resent. Over a seven-turn flight that is small. Over a two-hour job it is the main design problem. The further reading covers the usual answers: clearing old tool results, summarising (compaction), and structured hand-over notes between fresh conversations.</p>
${own(`<ul><li>Edit <code>standing-orders.md</code> and run a request again to see how the co-pilot changes. Try removing order 2.</li>
<li>Commit and push: <code>git add .</code>, <code>git commit -m "Add standing orders and stop rules"</code>, <code>git push</code>.</li></ul>`)}`,
quiz:[
{q:'Which belongs in the standing orders rather than in harness code?',opts:['“Finish with one or two plain sentences”','“Never run more than 12 turns”','“Capture requires the pilot’s yes”'],a:0,why:'Style and working method are preferences, which suit a prompt. Limits and permissions must be guaranteed, so they are code.'},
{q:'Why does the context get bigger every turn?',opts:['The model forgets to delete old messages','The harness adds each request and result to the conversation and resends all of it','Tokens expire and are replaced'],a:1,why:'The conversation is the model’s only memory, so the harness keeps appending to it.'}],
reading:[
['Effective context engineering for AI agents','https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents','What to put in a model’s context, and how to keep it useful as it grows.'],
['Effective harnesses for long-running agents','https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents','How a harness carries work across many context windows.'],
['Harness design for long-running application development','https://www.anthropic.com/engineering/harness-design-long-running-apps','A worked account of designing a harness for multi-hour tasks.']]},
/* 6 */{title:'Recorder + tests',long:'The flight recorder, and proving the rules hold',mins:14,
idea:`<p>An agent chooses its own steps, so two runs of the same request can differ. When one goes wrong you need to see exactly what happened, in order. And before anyone trusts the harness you need proof that its guarantees hold: that a capture always meets the interlock, and that the loop always stops.</p>
<h2>The flight recorder (trace)</h2>
<p>A <strong>trace</strong> is a log with one line per event: the request, each tool call, each interlock decision, each result or error, and the answer. It is the first thing to build when an agent misbehaves and the first thing to read. Here it is a plain text file, <code>trace.jsonl</code>, one JSON object per line.</p>
<h2>Testing with a scripted model</h2>
<p>You cannot write a normal test against a real model: it costs money, it is slow, and it words things differently each time. But the harness's own rules do not depend on what the model says. So the tests swap the model for a <strong>scripted model</strong>, a few lines of code that play back fixed replies. "The model asks to capture; assert that the pilot was asked." That is repeatable, takes milliseconds, and can run in CI.</p>
${say('tomo','I do not need the real co-pilot to prove the lever works. I need something that pulls it.')}
<p>Checking whether the real model makes good decisions is a different activity, called <strong>evals</strong>: a fixed set of real requests, run against the real model and scored. The further reading covers it.</p>`,
labIntro:'Fit the recorder, replay a flight, then run tests that prove the interlock and the stop rule.',
tasks:[
E_('h6','Fit the recorder and add tests','<code>harness.py</code> gains <code>record()</code>, called at every event, and <code>run()</code> now takes the model and the ask function as parameters so that a test can swap them. Two new files in <code>copilot</code>: <code>replay.py</code> prints the last flight, and <code>test_harness.py</code> holds three tests and the scripted model.','The communication array <strong>C</strong> is live. All eight parts are fitted.',['test_harness.py','harness.py']),
C_('uv run suit.py reset','Back to the hangar','Start clean.','Parked in Hangar 7.',r=>r.meta.cmd==='reset'),
C_(RUNQ('Launch and jump to the Aster system'),'Fly a short leg','Any run now writes to the recorder as it goes.','Three orders’ worth of events are on the tape, and the panel shows the count.',r=>ran(r)&&!r.meta.stopped&&G.sim.s.flight.phase==='aster'),
C_('uv run replay.py','Replay the flight','<code>replay.py</code> reads <code>trace.jsonl</code> and prints the last run, one event per line with its time.','The whole flight in order: request, tool_call, tool_result, and the answer. This is what you read when someone asks “why did it do that?”',r=>r.meta.cmd==='replay'),
C_('uv add --dev pytest','Add the test runner','<code>pytest</code> finds files named <code>test_*.py</code> and runs every function in them whose name starts with <code>test_</code>. <code>--dev</code> records it as a development tool.','pytest is installed and listed under <code>[dependency-groups]</code> in <code>pyproject.toml</code>.',r=>r.meta.cmd==='pytest-add'),
C_('uv run pytest','Prove the rules','Three tests, no real model: a capture always goes through the interlock; a refusal changes nothing and reaches the co-pilot as an error; the loop stops at the turn limit.','3 passed in a fraction of a second. These hold whatever the model says, because they test the harness, not the model.',r=>r.meta.cmd==='pytest'),
P_('proof','Decide: what is your evidence?','How will you know your agent’s harness works, and keep knowing after each change? Choose for your own agent.')
],
notes:`<h2>Why <code>run()</code> grew two parameters</h2>
<p><code>run(request, max_turns, model=client, ask=ask_pilot)</code>: by default the model is the real client and <code>ask</code> is the real prompt. A test passes a scripted model and a function that answers yes or no at once. This is called <strong>dependency injection</strong>, and it is the one structural thing to insist on when someone builds a harness for you. If the model is hard-wired inside the loop, the loop cannot be tested.</p>
<h2>What the three tests guarantee</h2>
<p>Read their names in <code>test_harness.py</code>. They are the promises from lessons 4 and 5, restated so a machine can check them on every change. If someone later edits the loop and the interlock check ends up after the tool call, the first test fails before the change is merged.</p>
${own(`<ul><li>Run <code>uv run pytest</code> before every commit from now on.</li>
<li>Commit and push: <code>git add .</code>, <code>git commit -m "Add flight recorder and harness tests"</code>, <code>git push</code>. <code>trace.jsonl</code> is in <code>.gitignore</code>.</li>
<li>Then open a pull request for the <code>copilot-harness</code> branch, as in the Git and CI guides.</li></ul>`)}`,
quiz:[
{q:'Why do the tests use a scripted model instead of the real one?',opts:['The real model refuses to be tested','So the tests are fast, free and give the same result every time','Because pytest cannot make network calls'],a:1,why:'The harness’s rules do not depend on the model’s wording, so a scripted stand-in tests them repeatably.'},
{q:'An agent did something surprising yesterday. Where do you look first?',opts:['The trace of that run','The system prompt','The model’s documentation'],a:0,why:'The trace shows each request, tool call, result and decision in order. Everything else is guessing.'}],
reading:[
['Demystifying evals for AI agents','https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents','How to score what a real model does, beyond testing the harness.'],
['pytest: get started','https://docs.pytest.org/en/stable/getting-started.html','How pytest finds and runs tests.'],
['Harness design for long-running application development','https://www.anthropic.com/engineering/harness-design-long-running-apps','Includes using a separate evaluator to judge an agent’s work.']]},
/* 7 */{title:'Your harness',long:'Design: write the spec for your own harness',mins:15,
idea:`<p>You have built every part once. The harness for the Kestrel is about 150 lines, and you can now read all of them. This lesson turns to the agent you want to design. The six decisions you made are waiting in the <strong>Design</strong> tab as a draft. Here you complete it into a spec that a coding agent or a developer can build from.</p>
${say('ilse','I will never write the loop myself. But now I know what to ask for.')}
${say('tomo','And what to refuse to sign off without. A recorder. Tests on the interlocks.')}
<h2>Review your six decisions</h2>
<p>Change any of them here. The spec in the Design tab updates as you do.</p>
<h3>1. Autonomy</h3>__job__
<h3>2. Shape</h3>__shape__
<h3>3. Tools</h3>__tools__
<h3>4. Interlocks</h3>__locks__
<h3>5. When a limit is hit</h3>__limits__
<h3>6. Evidence</h3>__proof__`,
labIntro:'Describe your agent, then copy the finished spec.',
tasks:[
{kind:'form',what:'Describe your agent',why:'Fill these in for the agent you have in mind. If you want to see a complete example first, the button fills in the Kestrel co-pilot, and you can edit from there. Tools go one per line, as <code>name | what it does | tier</code>.',saw:'Your agent is named and its tools and limits are in the spec.'},
{kind:'copy',what:'Copy the spec',why:'The Design tab now holds the complete document. Copy it and save it as <code>specs/harness.md</code>. The <code>specs</code> folder is at the repo root, beside <code>copilot</code>, as set up in Project Structure from Zero.',saw:'Copied. Save it as <code>specs/harness.md</code> at the repo root.'}
],
notes:`<h2>Handing it over</h2>
<p>Give the spec to a coding agent with a short instruction, for example: <em>"Read specs/harness.md and build this harness in a new folder. Start with the loop and one read-only tool, show me a run, then add the rest one section at a time. Write the tests in section 6 before the interlocks."</em> Asking for it in stages lets you check each part the way you did here.</p>
<h2>What to check in what comes back</h2>
<ul><li><strong>The loop is readable.</strong> One function, top to bottom. If you cannot follow it, ask for it to be simplified.</li>
<li><strong>Tool descriptions read like microcopy.</strong> You are the right person to edit them.</li>
<li><strong>Interlocks are code that runs before the tool.</strong> Not a sentence in a prompt.</li>
<li><strong>Refusals and errors go back to the model.</strong> Nothing crashes the loop.</li>
<li><strong>The loop has an exit the model does not control.</strong></li>
<li><strong>Every run leaves a trace, and the tests pass without a real model.</strong></li></ul>
<h2>When not to build your own</h2>
<p>Ready-made harnesses exist, such as the Claude Agent SDK, and for production work one of them is usually the right starting point. They provide the loop, context management, permissions and tracing, and you supply tools and orders. The decisions in your spec still have to be made either way. A ready-made harness gives you defaults for them, and you still have to check that the defaults suit your product.</p>
${own(`<ul><li>Save the spec as <code>specs/harness.md</code> (repo root), on your <code>copilot-harness</code> branch.</li>
<li>Commit and push: <code>git add specs/harness.md</code>, <code>git commit -m "Add harness spec"</code>, <code>git push</code>.</li></ul>`)}`,
quiz:[
{q:'Which of these belongs in a harness spec?',opts:['The exact wording of the model’s answers','Which actions wait for a person, and what happens on a no','The colour of the terminal text'],a:1,why:'Permissions and the refusal path are harness design. The model’s wording is not something a spec can fix.'},
{q:'A developer says the interlock is handled by a line in the system prompt. What do you ask for?',opts:['A longer line','A check in code that runs before the tool, with a test','Nothing: that is enough'],a:1,why:'A guarantee has to be code, and a test keeps it true after later changes.'}],
reading:[
['Building effective agents','https://www.anthropic.com/engineering/building-effective-agents','Worth rereading now that each part has a concrete meaning.'],
['Effective harnesses for long-running agents','https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents','The next step: agents that work for hours across many conversations.'],
['Writing effective tools for agents','https://www.anthropic.com/engineering/writing-tools-for-agents','For when you start editing your own tool descriptions.']]}
];

/* ---------- the flight rules (a JS twin of suit.py) ---------- */
const ORDERS={launch:{hangar:'transit'},jump:{transit:'aster',captured:'return'},approach:{aster:'trap'},scan:{trap:'trap'},capture:{trap:'captured'},dock:{return:'docked'}};
const PHASE_TEXT={hangar:'parked in Hangar 7',transit:'in transit to gate-alpha',aster:'in the Aster system',trap:'holding off the trap station',captured:'holding off the trap station, sample aboard',return:'homebound from gate-alpha',docked:'docked in Hangar 7'};
const LOADS={cruise:9,sprint:21};
const START=()=>({phase:'hangar',burn:'cruise',scanned:false,antimatter_ng:0,delivered_ng:0});
const drawKw=f=>4+(['hangar','docked'].includes(f.phase)?0:LOADS[f.burn])+(f.antimatter_ng>0?6:0);
function budget(f){const d=drawKw(f);if(d>25)throw new Error('power request denied: over budget (budget 25 kW, asked '+d+' kW)');}
const SUIT={
  get_flight_state:f=>({out:Object.assign({},f,{draw_kw:drawKw(f),budget_kw:25}),next:f}),
  give_order(f,a){const name=a.name;
    if(!Object.prototype.hasOwnProperty.call(ORDERS,name))throw new Error('unknown order: '+name);
    const to=ORDERS[name][f.phase];
    if(!to)throw new Error('cannot '+name+': the Kestrel is '+PHASE_TEXT[f.phase]);
    if(name==='capture'&&!f.scanned)throw new Error('cannot capture: scan the trap station first');

  if(b.dataset.pick!==undefined){const id=b.dataset.pick;G.dec[id]=+b.dataset.k;save();const t=task();showTab('design');if(t&&t.kind==='pick'&&t.id===id)await advance();else{renderTasks();document.querySelectorAll('.picks[data-dec="'+id+'"]').forEach(el=>{el.outerHTML=pickHtml(id,false);});}renderSpec();return;}
  if(b.dataset.chip!==undefined){const S=G.sort[G.i+'-'+b.dataset.sort];S.sel=S.sel===+b.dataset.chip?null:+b.dataset.chip;S.bad=null;renderTasks();return;}
  if(b.dataset.q!==undefined){const k=G.i+'-'+b.dataset.q;if(G.answers[k]===undefined){G.answers[k]=+b.dataset.k;renderQuiz();}return;}
  if(b.dataset.fill){Object.assign(G.form,EXAMPLE);save();renderTasks();renderSpec();return;}
  if(b.dataset.formok){if(!F('name')||!F('job')){$('#form-msg').textContent='Give the agent a name and a one-sentence job first.';return;}const t=task();if(t&&t.kind==='form')await advance();return;}
  if(b.dataset.copy){const txt=specText();let ok=false;try{await navigator.clipboard.writeText(txt);ok=true;}catch(err){}
    showTab('design');const m=$('#copy-msg');
    if(!ok){const r=document.createRange();r.selectNodeContents($('#spec'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}
    const t=task();if(t&&t.kind==='copy')await advance();
    const m2=$('#copy-msg')||m;if(m2)m2.textContent=ok?'Copied. Paste it into specs/harness.md.':'The spec is selected in the Design tab. Press Ctrl+C (or Cmd+C) to copy it.';return;}
  if(b.classList.contains('ptab')){showTab(b.dataset.pane);return;}
  if(b.id==='term-clear'){tout().textContent='';return;}
});
document.addEventListener('click',e=>{
  const bin=e.target.closest('.bin');if(!bin||e.target.closest('button'))return;
  const n=+bin.dataset.sort,S=G.sort[G.i+'-'+n];if(S&&S.sel!==null&&S.sel!==undefined)place(n,S.sel,+bin.dataset.bin);
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip[data-chip]');if(c&&e.dataTransfer){e.dataTransfer.setData('text/plain',c.dataset.sort+':'+c.dataset.chip);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{const bin=e.target.closest&&e.target.closest('.bin');if(bin){e.preventDefault();bin.classList.add('over');}});
document.addEventListener('dragleave',e=>{const bin=e.target.closest&&e.target.closest('.bin');if(bin)bin.classList.remove('over');});
document.addEventListener('drop',e=>{const bin=e.target.closest&&e.target.closest('.bin');if(!bin)return;e.preventDefault();const d=(e.dataTransfer.getData('text/plain')||'').split(':');if(d.length===2&&+d[0]===+bin.dataset.sort)place(+d[0],+d[1],+bin.dataset.bin);});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){G.form[f]=e.target.value;save();renderSpec();}});
$('#term-form').addEventListener('submit',e=>{e.preventDefault();const inp=$('#term-input'),v=inp.value;inp.value='';run(v);});
const fromHash=()=>{const m=/^#lesson-(\d+)$/.exec(location.hash);return m?+m[1]-1:0;};
window.addEventListener('hashchange',()=>go(fromHash()));
let wideWas=window.innerWidth>=1040;
window.addEventListener('resize',()=>{const w=window.innerWidth>=1040;if(w!==wideWas){wideWas=w;placeBench();}});
go(fromHash());

</script>
