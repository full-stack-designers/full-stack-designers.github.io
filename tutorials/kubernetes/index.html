const MANIFEST_NOTES=[
['apiVersion: apps/v1','<b>Which part of the Kubernetes API this object belongs to.</b> Deployments live in the group called apps, version v1. You copy this line. Nobody memorises them.'],
['kind: Deployment','<b>The type of object.</b> Together, apiVersion and kind tell the cluster how to read the rest of the file.'],
['metadata:','<b>Information that identifies the object.</b> Indentation matters in YAML: two spaces per level, never tabs.'],
['  name: sensors','<b>The object\'s name.</b> It must be unique among Deployments in the namespace. It is what you type in kubectl get deployment sensors.'],
['spec:','<b>The desired state.</b> Everything under spec is what you are asking for. The cluster reports what actually exists in a separate section called status, which you never write.'],
['  replicas: 1','<b>How many pods you want.</b> The base frame runs one sensor controller. The recon mission overrides this to three.'],
['  selector:','<b>How the Deployment recognises its own pods.</b>'],
['    matchLabels:',''],
['      app: sensors','<b>The label to look for.</b> Any pod carrying app=sensors counts toward the replicas. It must match the labels in the template below, or the Deployment is rejected.'],
['  template:','<b>The pod template.</b> Everything under here describes one pod. The Deployment stamps out copies of it. Changing anything in the template triggers a rolling update.'],
['    metadata:',''],
['      labels:',''],
['        app: sensors','<b>The label each pod is given.</b> This is the other half of the selector above, and it is also what the Service at the bottom of the file selects.'],
['    spec:','<b>The pod\'s own desired state:</b> which containers it holds.'],
['      containers:','<b>A list.</b> The dash on the next line starts one entry. Nearly always there is exactly one container per pod.'],
['        - name: sensors','<b>The container\'s name inside the pod.</b> It is the name you used in kubectl set image deployment/targeting targeting=...'],
['          image: hangar/sensors:1.0','<b>The image to run,</b> exactly as in docker run. Always give a specific tag. With "latest" you cannot tell what is deployed, and a rollback has nothing to go back to.'],
['          ports:',''],
['            - containerPort: 8080','<b>The port the program listens on.</b> Like EXPOSE in a Dockerfile, this is mainly documentation. The Service below is what makes it reachable.'],
['---','<b>A separator.</b> Three dashes start a new object in the same file. Keeping a Deployment and its Service together is a common habit.'],
['apiVersion: v1','<b>Services belong to the original core API,</b> which is written simply as v1.'],
['kind: Service',''],
['metadata:',''],
['  name: sensors','<b>The Service\'s name, which is also its host name</b> inside the cluster. Other pods call http://sensors.'],
['spec:',''],
['  selector:',''],
['    app: sensors','<b>Which pods receive the traffic:</b> those labelled app=sensors. This is the same label the Deployment puts on its pods, and that shared label is the only thing connecting the two objects.'],
['  ports:',''],
['    - port: 80','<b>The port the Service listens on.</b>'],
['      targetPort: 8080','<b>The port on the pods to forward to.</b> It matches containerPort above.']
];

/* ----- the frame: an original schematic, drawn from live state ----- */

  const boost=(k,i,x,y,w,h,a,px,py)=>'<g transform="rotate('+a+' '+px+' '+py+')"><rect '+c(k,i,1,'boost')+' x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="5"/><path '+det(k,i)+' d="M'+x+' '+(y+12)+'h'+w+'M'+x+' '+(y+h-10)+'h'+w+'"/><path class="flame '+st(k,i)+'"'+d(k,i)+' d="M'+(x+2)+' '+(y-1)+'l'+(w/2-2)+' -13l'+(w/2-2)+' 13z"/></g>';
  const title=o.title?'<text class="ttl" x="252" y="350">'+o.title+'</text><text class="ttl sub" x="252" y="364">FRONT ELEVATION · 1:100</text>'+

  return '<svg class="mech" viewBox="'+(o.box||'-34 0 368 372')+'" role="img" aria-label="'+(o.label||'Schematic of the KF-07 Kestrel frame')+'">'+title+
  /* boosters sit behind the shoulders */

      else{showLine(ln,cls&&ln.charAt(0)==='('?'note':cls);if(n<lines.length-1)await sleep(gap);}
      if(id!==runId)return;
    }
    await sleep(gap);
  }
  function keepInView(){if(WIDE.matches)return;const b=form.getBoundingClientRect();if(b.bottom>window.innerHeight||b.top<80)form.scrollIntoView({block:'end',behavior:'smooth'});}
  async function runLine(){
    if(busy)return;
    const line=input.value.trim();if(!line)return;input.value='';hist.push(line);hi=hist.length;
    print('$ '+line,'in');
    keepInView();
    const r=sim.exec(line);
    if(r.clear){term.textContent='';return;}
    drawMap(true);
    const id=runId;busy=true;form.classList.add('busy');input.disabled=true;
    await printOut(r.out,r.ok?'':'err',id);
    if(id!==runId)return;
    busy=false;form.classList.remove('busy');input.disabled=false;
    if(ctx.onRun)ctx.onRun(line,r);
    if(cur<tasks.length){
      const l=norm(line);let pass=false,jump=0;try{pass=!!tasks[cur].test(l,sim.world,r,sim);}catch(e){}
      /* ran a later step's command: move on to it and mark the ones in between as skipped */
      if(!pass)for(let k=cur+1;k<tasks.length;k++){let ok=false;try{ok=l===norm(tasks[k].cmd)&&!!tasks[k].test(l,sim.world,r,sim);}catch(e){}
        if(ok){for(let s=cur;s<k;s++)skipped.add(s);jump=k-cur;cur=k;pass=true;break;}}
      /* went back to a skipped step: tick it off */
      if(!pass)for(const s of [...skipped]){let ok=false;try{ok=l===norm(tasks[s].cmd)&&!!tasks[s].test(l,sim.world,r,sim);}catch(e){}
        if(ok){skipped.delete(s);print('✓ Step '+(s+1)+' of '+tasks.length+' done. '+tasks[s].saw,'ok');drawTasks();break;}}
      if(pass){
        const t=tasks[cur];cur++;
        print('✓ Step '+cur+' of '+tasks.length+' done'+(jump?' ('+jump+' earlier step'+(jump>1?'s':'')+' skipped). ':'. ')+t.saw,'ok');
        if(cur>=tasks.length){saved.done[L.id]=true;save();renderNav(L.id);print('✓ Lesson '+L.id+' lab complete.','ok');}
        drawTasks();
        if(WIDE.matches){const n=$('.task.now',list)||banner;if(n.scrollIntoView)n.scrollIntoView({block:'nearest'});}
      }else if(!r.ok&&/^(kubectl|k)\b/.test(line)){print('Hint: read the message above. This step is waiting for: '+tasks[cur].cmd,'note');}
    }
    if(!input.disabled&&WIDE.matches)input.focus({preventScroll:true});
    if(ctx.hold)ctx.hold=false;else requestAnimationFrame(keepInView);
  }
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();runLine();}
    else if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);input.value=hist[hi];}
    else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);input.value=hist[hi]||'';}
  });
  if(sec&&tasks.length)sec.append(el('p',{text:L.labIntro}),list,banner);
  const bench=el('div',{class:'bench-in'},
    el('section',{class:'map','aria-label':'What the cluster holds right now'},el('div',{class:'map-head'},el('b',{text:'Cluster kestrel: live status'}),mission),map),
    stepbar,
    el('section',{class:'term','aria-label':'Terminal'},el('div',{class:'term-bar'},el('span',{text:'Terminal (simulated)'}),el('span',{class:'row'},el('button',{type:'button',class:'mini dark',text:'help',onclick:()=>{input.value='help';runLine();}}),el('button',{type:'button',class:'mini dark',text:'reset',onclick:()=>{if(cur<tasks.length)cur=0;reset(true);}}))),term,form));
  ctx.sim=()=>sim;ctx.load=c=>loadCmd(c,true);
  reset(false);
  /* pods start and stop over time, so the schematic follows the clock as well as the commands */
  if(ticker)clearInterval(ticker);
  ticker=setInterval(()=>{if(!bench.isConnected)return;if(snapshot()!==live)drawMap(true);},350);
  return bench;
}

/* ----- quiz ----- */
function quiz(L,sec){
  L.quiz.forEach((q,i)=>{
    const key=L.id+'-'+i,fb=el('p',{class:'fb','aria-live':'polite'}),opts=el('div',{class:'opts'});
    function draw(){
      const ch=saved.quiz[key];opts.textContent='';
      q.opts.forEach((o,k)=>opts.append(el('button',{type:'button',class:'opt'+(ch===k?(k===q.a?' right':' wrong'):''),'aria-pressed':ch===k,text:o,onclick:()=>{saved.quiz[key]=k;save();draw();renderNav(L.id);}})));
      fb.className='fb'+(ch==null?'':ch===q.a?' good':' bad');
      fb.textContent=ch==null?'':ch===q.a?'Correct. '+q.why:'Not quite. Have another look at the options, or re-read the section above.';
    }
    sec.append(el('div',{class:'q'},el('p',{class:'qt',text:(i+1)+'. '+q.q}),opts,fb));draw();
  });
}

/* ----- page ----- */
function mount(art,bench,slot){
  const main=$('#main'),old=benchEl;main.textContent='';if(old)old.remove();
  main.append(art);benchEl=bench;slotEl=slot;placeBench();
}
function showLesson(id){
  const L=LESSONS.find(x=>x.id===id)||LESSONS[0];
  const art=el('article',{}),slot=el('div',{class:'slot'}),ctx={};
  art.append(el('p',{class:'eyebrow',text:'Lesson '+L.id+' of '+LESSONS.length+' · about '+L.mins+' minutes'}),el('h1',{text:L.title}),el('section',{class:'prose',html:L.idea}));
  if(L.widget){const box=el('div',{class:'widget'});art.append(el('section',{},el('h2',{text:L.widgetTitle}),el('p',{text:L.widgetIntro}),box));W[L.widget](box,ctx);}
  let bench;
  if(L.tasks){const s=el('section',{class:'lab'},el('h2',{text:'Try it'}));art.append(s);bench=lab(L,s,ctx);s.append(slot);}
  else{bench=lab(L,null,ctx);art.append(el('section',{class:'slot-sec'},el('h2',{text:'Sandbox'}),el('p',{text:'This lesson has no lab, but the sandbox is open if you want to look around.'}),slot));}
  if(L.notes)art.append(el('section',{class:'prose notes',html:L.notes}));
  const qs=el('section',{},el('h2',{text:'Check yourself'}));art.append(qs);quiz(L,qs);
  art.append(el('section',{},el('h2',{text:'Further reading'}),el('ul',{class:'reading'},L.reading.map(r=>el('li',{},el('a',{href:r[1],target:'_blank',rel:'noopener',text:r[0]}),el('span',{text:r[2]}))))));
  const prev=LESSONS.find(x=>x.id===L.id-1),next=LESSONS.find(x=>x.id===L.id+1);
  art.append(el('nav',{class:'pager','aria-label':'Lessons'},prev?el('a',{href:'#lesson-'+prev.id,class:'btn ghost',text:'← '+(prev.short||prev.title)}):el('span'),next?el('a',{href:'#lesson-'+next.id,class:'btn',text:(next.short||next.title)+' →'}):el('a',{href:'#cheat-sheet',class:'btn',text:'Cheat sheet →'})));
  mount(art,bench,slot);renderNav(L.id);
}
function showCheats(){
  const box=el('div',{class:'widget'}),slot=el('div',{class:'slot'});
  const art=el('article',{},el('p',{class:'eyebrow',text:'kubectl --help  # reference'}),el('h1',{text:'Cheat sheet'}),el('p',{class:'prose',text:'Every command from the nine lessons. Words in capitals are placeholders for your own names. The sandbox here is free play, with the standard frame already running: try any of them.'}),box,el('section',{class:'prose'},el('h2',{text:'Translation key'}),el('p',{text:'Every Kestrel term used in this guide, and what it stands for in an ordinary web system.'}),el('div',{html:KEY_HTML})),el('section',{class:'slot-sec'},el('h2',{text:'Sandbox'}),slot));
  W.cheats(box);mount(art,lab({id:0,seed:['kubectl apply -k frame/']},null),slot);renderNav('cheats');
}
function route(){
  const h=location.hash.replace('#','');const m=/^lesson-(\d+)$/.exec(h);
  if(h==='cheat-sheet')showCheats();else showLesson(m?+m[1]:1);
  $('#main').scrollTop=0;window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
})();
