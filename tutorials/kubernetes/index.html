<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubernetes from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right a live schematic of the cluster, above a terminal that changes it. One dark terminal world; on phones the map-and-terminal bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:"$ ";color:var(--term-dim)}
.ran::before{content:"$ ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-containers{border-top-color:var(--good)}.z-images{border-top-color:var(--accent)}.z-volumes{border-top-color:var(--warn)}.z-networks{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-containers .zlist{flex-direction:row;flex-wrap:wrap}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}
.stepbar .cmd code{color:var(--good);overflow-wrap:anywhere;font-size:.88rem}
.term{display:flex;flex-direction:column}

/* ----- schematic in motion: parts deploy, lock in, idle and retract ----- */
.mech [data-k],.mech .half,.mech .nd{transform-box:fill-box;transform-origin:50% 50%}
.mech [data-a=boost]{transform-origin:50% 100%}
.mech [data-a=mast],.mech [data-a=swing]{transform-origin:0% 100%}
.mech [data-a=dish]{transform-origin:50% 100%}
.mech [data-a=slide]{transform-origin:0% 50%}
.mech [data-a=shield]{transform-origin:100% 12%}
.mech .ring{stroke:#34444f}
.mech .ring.on{stroke:var(--accent);stroke-dasharray:10 6.5;animation:m-spin 5s linear infinite}
.mech .ring.pend{stroke:var(--warn);stroke-dasharray:3 5;animation:m-spin 1.2s linear infinite}
.mech .flame{fill:var(--good);stroke:none;display:none;transform-origin:50% 100%}
.mech .flame.on{display:inline;animation:m-flame .32s ease-in-out infinite alternate}
.mech .core.on{animation:m-pulse 1.6s ease-in-out infinite}
.mech .eq.pend,.mech .det.pend,.mech .core.pend{animation:m-blink .55s steps(2,jump-none) infinite}
.mech .gyro.on{animation:m-rot 6s linear infinite}
.mech .e-sensors.on[data-a=dish]{animation:m-sweep 3.2s ease-in-out infinite alternate}
.mech .e-sensors.on[data-a=tip],.mech .e-comms.on[data-a=tip]{animation:m-ping 1.8s ease-out infinite}
.mech .e-targeting.on[data-a=core]{animation:m-visor 2.6s ease-in-out infinite}
.mech .e-life-support.on{animation:m-march 1.4s linear infinite}
.mech .e-thrusters.det.on,.mech .e-railgun.det.on,.mech .det.on[data-k=railgun],.mech .det.on[data-k=shield]{animation:m-glow 1.3s ease-in-out infinite alternate}
.mech .cordon .pl{animation:m-march 1s linear infinite}
/* deploy (in) and retract (out) share one set of moves; out plays them backwards */
.mech .in[data-a=boost],.mech .out[data-a=boost]{animation:d-boost .9s cubic-bezier(.3,1.3,.5,1) both}
.mech .in[data-a=mast],.mech .out[data-a=mast]{animation:d-grow .6s cubic-bezier(.3,1.3,.5,1) both}
.mech .in[data-a=tip],.mech .out[data-a=tip]{animation:d-pop .9s cubic-bezier(.3,1.5,.5,1) both}
.mech .in[data-a=dish],.mech .out[data-a=dish]{animation:d-dish .9s cubic-bezier(.3,1.3,.5,1) both}
.mech .in[data-a=slide],.mech .out[data-a=slide]{animation:d-slide .9s cubic-bezier(.3,1.2,.5,1) both}
.mech .in[data-a=swing],.mech .out[data-a=swing]{animation:d-swing 1s cubic-bezier(.3,1.3,.5,1) both}
.mech .in[data-a=shield],.mech .out[data-a=shield]{animation:d-shield 1.1s cubic-bezier(.3,1.25,.5,1) both}
.mech .in[data-a=seal],.mech .out[data-a=seal]{animation:d-seal .9s ease-out both}
.mech .in[data-a=core]{animation:d-pop .7s cubic-bezier(.3,1.5,.5,1) both}
.mech .in[data-a=fade],.mech .out[data-a=fade],.mech .ring.in,.mech .core.in{animation:d-fade .9s ease-out both}
.mech .out{display:inline!important;animation-direction:reverse!important;animation-duration:.6s!important;animation-delay:0s!important;stroke:var(--muted)!important}
.mech .flame.out,.mech .flame.in{display:none!important}
.mech .eq.lock{animation:d-lock .9s ease-out}
@keyframes m-spin{to{stroke-dashoffset:-132}}
@keyframes m-march{to{stroke-dashoffset:-22}}
@keyframes m-pulse{50%{transform:scale(1.3);fill:#b9ffe1}}
@keyframes m-blink{50%{opacity:.35}}
@keyframes m-rot{to{transform:rotate(360deg)}}
@keyframes m-sweep{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes m-ping{0%{filter:drop-shadow(0 0 0 var(--accent))}60%{filter:drop-shadow(0 0 7px var(--accent))}100%{filter:drop-shadow(0 0 0 transparent)}}
@keyframes m-visor{50%{fill:var(--accent)}}
@keyframes m-glow{to{stroke:#d6ecff}}
@keyframes m-flame{from{transform:scaleY(.55);opacity:.55}to{transform:scaleY(1.15);opacity:1}}
@keyframes d-boost{0%{transform:rotate(42deg) scaleY(.08);opacity:0}25%{opacity:1}70%{transform:rotate(-7deg) scaleY(1.06)}100%{transform:none}}
@keyframes d-grow{0%{transform:scale(0)}100%{transform:none}}
@keyframes d-pop{0%,45%{transform:scale(0)}80%{transform:scale(1.5)}100%{transform:none}}
@keyframes d-dish{0%{transform:rotate(-130deg) scale(.25);opacity:0}30%{opacity:1}100%{transform:none}}
@keyframes d-slide{0%{transform:scaleX(0)}75%{transform:scaleX(1.05)}100%{transform:none}}
@keyframes d-swing{0%{transform:rotate(60deg) scaleX(.15);opacity:0}30%{opacity:1}75%{transform:rotate(-5deg)}100%{transform:none}}
@keyframes d-shield{0%{transform:rotate(-75deg) scale(.12);opacity:0}25%{opacity:1}75%{transform:rotate(6deg) scale(1.03)}100%{transform:none}}
@keyframes d-seal{0%{transform:scale(1.3);opacity:0}100%{transform:none}}
@keyframes d-fade{0%,55%{opacity:0}100%{opacity:1}}
@keyframes d-lock{0%{stroke:#fff;fill:var(--accent);filter:drop-shadow(0 0 9px var(--accent))}100%{filter:drop-shadow(0 0 0 transparent)}}
/* refit sequence: the frame opens up, a scan passes, and it closes again */
.mech .scan{fill:var(--accent);opacity:0}
.mech.refit .scan{animation:r-scan 1.5s linear}
.mech.refit .n-arms .half{animation:r-arms 1.5s cubic-bezier(.5,0,.3,1)}
.mech.refit .n-legs .half{animation:r-legs 1.5s cubic-bezier(.5,0,.3,1)}
.mech.refit .n-cp{animation:r-head 1.5s cubic-bezier(.5,0,.3,1)}
.mech.refit .n-torso{animation:r-torso 1.5s cubic-bezier(.5,0,.3,1)}
.mech.refit .pl{animation:r-plate 1.5s ease-in-out}
.mech.refit .cordon .pl{animation:m-march 1s linear infinite}
@keyframes r-scan{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(370px);opacity:.2}}
@keyframes r-arms{22%,68%{transform:translate(-8px,-3px)}}
@keyframes r-legs{22%,68%{transform:translate(-5px,2px)}}
@keyframes r-head{22%,68%{transform:translateY(-7px)}}
@keyframes r-torso{22%,68%{transform:translateY(-2px)}}
@keyframes r-plate{30%,60%{stroke:var(--accent)}}
@media (prefers-reduced-motion:reduce){.mech *,.mech .scan{animation:none!important}}

<script>
/* ---------- Kubernetes simulator: pure logic, no DOM ---------- */
const APPS={
  reactor:{x:{output_mw:1380},log:['[reactor] ignition sequence complete','[reactor] core temperature nominal, output 1380 MW','[reactor] listening on :8080']},
  balancer:{x:{tilt_deg:0.4},log:['[balancer] gyros spun up','[balancer] stance locked, tilt 0.4 deg','[balancer] listening on :8080']},
  comms:{x:{channel:'hangar-control'},log:['[comms] antenna deployed','[comms] channel hangar-control open','[comms] listening on :8080']},
  sensors:{x:{contacts:2},log:['[sensors] array calibrated','[sensors] sweep started, 2 contacts','[sensors] listening on :8080']},
  thrusters:{x:{thrust_pct:12},log:['[thrusters] nozzle check passed','[thrusters] idle at 12 percent','[thrusters] listening on :8080']},
  targeting:{x:{lock:'none'},log:['[targeting] solver loaded','[targeting] waiting for sensor feed','[targeting] listening on :8080']},
  railgun:{x:{charge_pct:100},log:['[railgun] capacitors charged','[railgun] safety on','[railgun] listening on :8080']},
  shield:{x:{integrity_pct:100},log:['[shield] plate locked to forearm mount','[shield] integrity 100 percent','[shield] listening on :8080']},
  'life-support':{x:{cabin_kpa:101},log:['[life-support] cabin sealed','[life-support] pressure 101 kPa','[life-support] listening on :8080']}
};
const dep1=(name,replicas,ver)=>({kind:'Deployment',name,image:'hangar/'+name+':'+(ver||'1.0'),replicas});
const svc1=name=>({kind:'Service',name,port:80,target:8080});
const mission=data=>({kind:'ConfigMap',name:'mission',data});
const FS={
  'frame/kustomization.yaml':{kust:true,resources:['reactor.yaml','balancer.yaml','comms.yaml','sensors.yaml','thrusters.yaml','targeting.yaml','hardpoints.yaml']},
  'frame/reactor.yaml':[dep1('reactor',1),svc1('reactor')],
  'frame/balancer.yaml':[dep1('balancer',1)],
  'frame/comms.yaml':[dep1('comms',1),svc1('comms')],
  'frame/sensors.yaml':[dep1('sensors',1),svc1('sensors')],
  'frame/thrusters.yaml':[dep1('thrusters',2)],
  'frame/targeting.yaml':[dep1('targeting',1),svc1('targeting')],
  'frame/hardpoints.yaml':[dep1('railgun',0),dep1('shield',0),dep1('life-support',0)],
  'missions/recon/kustomization.yaml':{kust:true,resources:['../../frame','mission.yaml'],replicas:{sensors:3}},
  'missions/recon/mission.yaml':[mission({PROFILE:'recon',SENSOR_RANGE_KM:'120',POWER_MODE:'silent'})],
  'missions/assault/kustomization.yaml':{kust:true,resources:['../../frame','mission.yaml'],replicas:{thrusters:3,targeting:2,railgun:2,shield:1}},
  'missions/assault/mission.yaml':[mission({PROFILE:'assault',SENSOR_RANGE_KM:'40',POWER_MODE:'full'})],
  'missions/orbital/kustomization.yaml':{kust:true,resources:['../../frame','mission.yaml'],replicas:{sensors:2,thrusters:4,'life-support':1}},
  'missions/orbital/mission.yaml':[mission({PROFILE:'orbital',SENSOR_RANGE_KM:'400',POWER_MODE:'cruise'})]
};
const yq=v=>/^[A-Za-z][\w.\/:-]*$/.test(String(v))?String(v):'"'+v+'"';
function toYaml(o){
  if(o.kust){
    const L=['apiVersion: kustomize.config.k8s.io/v1beta1','kind: Kustomization','resources:'].concat(o.resources.map(r=>'  - '+r));
    if(o.replicas){L.push('replicas:');for(const k in o.replicas)L.push('  - name: '+k,'    count: '+o.replicas[k]);}
    return L.join('\n');
  }
  if(o.kind==='Deployment'){

    if(c==='expose'){const {pos,fl}=parse(r);const d=one(pos,'expose');if(fl.port===undefined)E('error: couldn\'t find port via --port flag or introspection');
      mkSvc(typeof fl.name==='string'?fl.name:d.name,d.name,+fl.port,+(fl['target-port']||fl.port),typeof fl.type==='string'?fl.type:'ClusterIP');out.push('service/'+(typeof fl.name==='string'?fl.name:d.name)+' exposed');return true;}
    if(c==='port-forward'){const {pos}=parse(r);const t=pos[0]||'';const m=/^(\d+):(\d+)$/.exec(pos[1]||'');if(!t.includes('/')||!m)E('error: usage is kubectl port-forward service/NAME LOCAL:REMOTE, for example 8080:80');
      const k=kind(t.split('/')[0]);if(k!=='service')E('error: in this sandbox, forward to a service: kubectl port-forward service/NAME 8080:80');
      const s=w.svcs.find(x=>x.name===t.split('/')[1])||nf('services',t.split('/')[1]);if(+m[2]!==s.port)E('error: Service '+s.name+' does not have a service port '+m[2]);
      w.fwd[+m[1]]={svc:s.name,port:s.port};out.push('Forwarding from 127.0.0.1:'+m[1]+' -> '+s.target+'\nForwarding from [::1]:'+m[1]+' -> '+s.target);
      out.push('(On a real machine this command keeps running and holds the terminal until you press Ctrl+C. Here it carries on in the background so you can type the next command.)');return true;}
    if(c==='patch'){const {pos,fl}=parse(r);const t=target(pos);if(!t.length||t[0][0]!=='configmap')E('error: in this sandbox patch works on a configmap');
      const cm=w.cms.find(x=>x.name===t[0][1])||nf('configmaps',t[0][1]);let j;try{j=JSON.parse(fl.patch);}catch(e){E('error: unable to parse "'+fl.patch+'": the patch must be JSON, like \'{"data":{"PROFILE":"assault"}}\'');}
      if(!j||typeof j.data!=='object')E('error: the patch needs a "data" object');for(const k in j.data)cm.data[k]=String(j.data[k]);out.push('configmap/'+cm.name+' patched');return true;}
    E('error: unknown command "'+c+'" for "kubectl". Type help to see what this sandbox understands');
  }
  function run(line){
    const out=[];let ok=true;meta={};gc();
    const a=tok(line.trim());
    if(!a.length)return {out:'',ok:true,meta};
    try{
      if(a[0]==='kubectl'||a[0]==='k')ok=kubectl(a.slice(1),out);
      else if(a[0]==='curl')ok=curl(a.slice(1),out,null);
      else if(a[0]==='help'){out.push(HELP);}
      else if(a[0]==='clear'){return {out:'',ok:true,meta,clear:true};}
      else if(a[0]==='ls'){const p=norm(a[1]||'');const pre=p?p+'/':'';const names=new Set();Object.keys(FS).forEach(k=>{if(k.startsWith(pre)){const r=k.slice(pre.length).split('/');names.add(r.length>1?r[0]+'/':r[0]);}});
        if(!names.size){out.push('ls: cannot access \''+a[1]+'\': No such file or directory');ok=false;}else out.push([...names].sort().join('  '));}
      else if(a[0]==='cat'){const p=norm(a[1]||'');if(FS[p])out.push(fileText(p));else{out.push('cat: '+(a[1]||'')+': '+(isDir(p)?'Is a directory':'No such file or directory'));ok=false;}}
      else if(a[0]==='docker'){out.push('This sandbox has no docker command: on a cluster you do not start containers yourself. You tell Kubernetes what should run, with kubectl, and it starts them.');ok=false;}
      else{out.push(a[0]+': this sandbox only understands kubectl, curl, ls, cat, help and clear');ok=false;}
    }catch(e){out.push(e.message);ok=false;}
    return {out:out.join('\n'),ok:ok!==false,meta};
  }
  function seedWith(cmds){skew=-95000;cmds.forEach(c=>run(c));skew=0;gc();}
  return {exec:run,world:w,busy,status,seed:seedWith,q:{dep,owned,alive,endpoints,depReady,tplHash,rollingOut}};
}

const LESSONS=[
{id:1,title:'From one container to a whole machine',short:'Why Kubernetes',mins:7,
idea:`
<p>In <em>Docker from Zero</em> you packed an app into an image and ran it as a container. With Compose you ran a few containers together on one computer. That is enough for a laptop, and often for one small server.</p>
<p>It stops being enough when the questions change. What restarts a container that crashes at 3 a.m.? What happens when the one server dies? How do you run five copies and spread visitors across them? How do you ship a new version with nobody noticing? You could answer each with scripts. <strong>Kubernetes</strong> is the standard answer to all of them at once: you describe what should be running, and it works continuously to make that true.</p>
<p>To make this concrete, this guide gives you a machine to run. You are the systems operator of the <strong>KF-07 Kestrel</strong>, a 17-metre piloted frame. Every subsystem on board (reactor, sensors, thrusters, targeting) is a container. Kubernetes is the control system that keeps them alive and re-arranges them for each mission.</p>
<p>The machine is only there to make things easier to picture, so the real term always travels with it. Whenever a Kestrel word appears, its real-world name follows in parentheses, and the full translation key is further down this page and on the cheat sheet.</p>
<dl class="terms">
<dt>Cluster</dt><dd>A group of computers that Kubernetes manages as one. In real life: your servers or cloud virtual machines. Here: the whole frame.</dd>
<dt>Node</dt><dd>One computer in the cluster. Containers run on nodes. The Kestrel has three worker nodes, one in each section: <code>torso</code>, <code>arms</code> and <code>legs</code>.</dd>
<dt>Control plane</dt><dd>The part of the cluster that makes decisions: it stores what you asked for, picks a node for each container, and notices when reality drifts. Here it lives on a fourth node, <code>cockpit</code>.</dd>
<dt>Pod</dt><dd>The smallest thing Kubernetes runs: a wrapper around one container (occasionally a few that must live together). You will mostly read "pod" as "one running container, plus its own network address".</dd>
<dt>kubectl</dt><dd>The command-line remote control, pronounced "kube-control" or "kube-cuddle" depending on who you ask. Like <code>docker</code>, it only sends requests. The control plane does the work.</dd>
</dl>
<p>The one idea to carry through every lesson: <strong>you declare a desired state, and Kubernetes closes the gap</strong>. You do not say "start a thruster controller" (start a worker). You say "there should be two thruster controllers" (two copies of the worker), and from then on that is a standing order.</p>
<h2>Translation key</h2>
<p>Every Kestrel term used in this guide, and what it stands for in an ordinary web system.</p>
${KEY_HTML}`,
widget:'anatomy',widgetTitle:'The machine, part by part',
widgetIntro:'Pick a Kubernetes term to see where it sits on the Kestrel. This schematic comes back in every lab, live, at the top of the sandbox.',
notes:`
<h2>How this guide works</h2>
<p>As in the Docker guide, the cluster here is simulated in the page. Nothing is installed, and the commands are the real ones. On wide screens the sandbox sits on the right: a live schematic of the frame on top, a terminal underneath. On a phone it sits inside each lesson, under the steps.</p>
<p>Pods take a moment to start, exactly as they do on a real cluster. If you list them straight after creating them you will catch them in <code>ContainerCreating</code>, and the schematic shows it: a part unfolds into place in amber while its pod starts, locks in blue once it is running, and folds away when the pod stops. When one command changes several subsystems at once, the whole frame opens up for a refit.</p>
<p>Lesson 9 covers how to get a real cluster on your own machine once the ideas have settled.</p>`,

{q:'What is the main thing Kubernetes adds on top of running containers with Docker?',opts:['A faster way to build images','It replaces containers with virtual machines','It keeps a declared set of containers running across several machines, and repairs it when something fails','A graphical dashboard for Docker'],a:2,why:'Docker starts a container when you ask. Kubernetes holds a standing description of what should run and keeps working to match it, across many nodes.'},
{q:'On the Kestrel, which part plays the role of the control plane?',opts:['The reactor','The cockpit node, which stores the desired state and makes scheduling decisions','Each thruster','The kubectl command on your laptop'],a:1,why:'The control plane is the decision-making part of the cluster. kubectl only sends it requests, and worker nodes only run what it assigns to them.'}],

{id:2,title:'Power up: nodes and pods',short:'Nodes and pods',mins:10,
idea:`
<p>Before changing anything, look around. Two questions cover most of what you need to know about any cluster: <strong>which machines are in it</strong>, and <strong>what is running on them</strong>.</p>
<p>Then you will start one subsystem (one service of an application) by hand: the reactor, which stands for the core API that everything else depends on. In Docker you would write <code>docker run</code>. The closest Kubernetes command is <code>kubectl run</code>, which creates a single <strong>pod</strong>.</p>
<p>Notice what you do <em>not</em> say: which machine to use. A part of the control plane called the <strong>scheduler</strong> picks a node that has room. The node then pulls the image and starts the container, the same way Docker did on your laptop.</p>
<p>You will then start two more subsystems the same way, to see where the scheduler puts them. The sandbox accepts any of the Kestrel's images, so you can bring up other parts yourself at any point: <code>hangar/balancer</code>, <code>thrusters</code>, <code>targeting</code>, <code>railgun</code>, <code>shield</code> and <code>life-support</code>, all with the tag <code>1.0</code>.</p>
<p>A pod created this way is on its own. If you delete it, or its node fails, nothing brings it back. That weakness is the reason the next lesson exists.</p>`,

{id:3,title:'Deployments: subsystems that heal',short:'Deployments',mins:10,
idea:`
<p>You almost never create pods directly. You create a <strong>Deployment</strong>, which is a standing order: "keep <em>N</em> copies of this container running".</p>
<p>A controller in the control plane then runs a loop, forever: count the pods that match, compare with the number you asked for, and create or remove pods to close the gap. This is called <strong>reconciliation</strong>, and it is the heart of Kubernetes.</p>
<dl class="terms">
<dt>Replicas</dt><dd>The number of identical pods you want. Two thruster controllers means <code>replicas: 2</code>.</dd>
<dt>Label</dt><dd>A key=value tag on an object, such as <code>app=thrusters</code>. Labels are how a Deployment knows which pods are its own, and how you select a group of pods in a command.</dd>
<dt>ReplicaSet</dt><dd>A helper object the Deployment creates. The ReplicaSet does the counting, and the Deployment manages ReplicaSets. You rarely touch one, but you will see its name inside every pod name.</dd>
</dl>
<p>The lab uses the thrusters, which stand for any stateless service you run several identical copies of, such as web servers or queue workers.</p>
<p>Because pods under a Deployment are replaceable, they get throwaway names with a random ending. You stop caring about any single pod, and that is the point.</p>`,
labIntro:'Give the thrusters a Deployment, then try to break it.',

{what:'Create a Deployment with two thruster controllers (two copies of a worker)',cmd:'kubectl create deployment thrusters --image=hangar/thrusters:1.0 --replicas=2',

{what:'List only the thruster pods',cmd:'kubectl get pods -l app=thrusters',
 parts:[['-l app=thrusters','Label selector. Show only objects carrying the label app=thrusters.']],

{id:4,title:'Services: a stable channel',short:'Services',mins:11,
idea:`
<p>The targeting computer needs data from the sensor array. In real terms, one service needs to call another, the way a web app calls an API. Each sensor pod has its own IP address, so targeting could call one directly. But you just saw that pods are disposable: when one is replaced, the new pod has a new address. And with three sensor pods, which one should it call?</p>
<p>A <strong>Service</strong> solves both problems. It is a fixed name and a fixed address that stands in front of a changing set of pods.</p>
<ul>
<li>It picks its pods by <strong>label</strong>, the same way a Deployment does.</li>
<li>Inside the cluster, the Service's name works as a host name. Other pods simply call <code>http://sensors</code>.</li>
<li>Each request is passed to one of the pods that are currently ready, so traffic is spread across them.</li>
</ul>
<p>If you remember Compose, where the service name <code>db</code> worked as a host name, this is the same idea made to work across many machines.</p>
<p>The default kind of Service, <strong>ClusterIP</strong>, is only reachable from inside the cluster. To reach one from your own computer while developing, <code>kubectl port-forward</code> opens a temporary tunnel.</p>`,
seed:['kubectl create deployment sensors --image=hangar/sensors:1.0 --replicas=3','kubectl create deployment targeting --image=hangar/targeting:1.0'],
labIntro:'The sandbox starts with three sensor pods (three copies of a backend service) and one targeting pod (the service that calls it) already running. Connect them.',
tasks:[
{what:'See the pods and their addresses',cmd:'kubectl get pods -o wide',
 parts:[['-o wide','Shows each pod\'s IP address and node.']],

 test:(l,w,r)=>r.ok&&/exec\b.*curl\b.*sensors/.test(l)},

{id:5,title:'Manifests: the frame, written down',short:'Manifests',mins:11,
idea:`
<p>So far you have typed orders one at a time: create this, scale that. Those are <strong>imperative</strong> commands. They are fine for exploring, but nobody can review them, repeat them exactly, or see what changed last Tuesday.</p>
<p>The way Kubernetes is really used is <strong>declarative</strong>. You write each object in a YAML file called a <strong>manifest</strong>, keep the files in Git, and hand them to the cluster with one command: <code>kubectl apply</code>.</p>
<p><code>apply</code> means "make the cluster match this file". If the object is missing it is created. If it differs it is changed. If it already matches, nothing happens. You can run it as often as you like, which is what makes it safe to automate.</p>
<p>The engineers have written the Kestrel's standard configuration this way, in a folder called <code>frame</code>. It is the blueprint of the machine (in a real project, the base configuration: your application's manifests, kept in its Git repository).</p>`,
widget:'manifest',widgetTitle:'Reading a manifest',
widgetIntro:'This is frame/sensors.yaml: a Deployment and a Service in one file. Tap any line to see what it does.',
labIntro:'Build the frame from its files.',
tasks:[
{what:'List the blueprint files',cmd:'ls frame',
 parts:[['ls frame','List the files in the frame folder. This is an ordinary shell command, not kubectl.']],
 saw:'One YAML file per subsystem, hardpoints.yaml for the optional mounts, and a kustomization.yaml, which you will open in a moment.',
 test:(l,w,r)=>r.ok&&/^ls frame\/?$/.test(l)},
{what:'Read the reactor\'s manifest',cmd:'cat frame/reactor.yaml',
 parts:[['cat frame/reactor.yaml','Print the file.']],
 saw:'Two objects separated by a line of three dashes: a Deployment (one reactor pod) and a Service (the name "reactor" on port 80). Everything you set with flags earlier is here as text.',
 test:(l,w,r)=>r.ok&&/^cat frame\/reactor\.yaml$/.test(l)},
{what:'Apply it',cmd:'kubectl apply -f frame/reactor.yaml',
 parts:[['kubectl apply','Make the cluster match what the file describes.'],['-f frame/reactor.yaml','The file to read.']],
 saw:'Both objects say "created", because neither existed. The reactor ring on the schematic comes on.',
 test:(l,w,r)=>!!depOf(w,'reactor')},
{what:'Apply the same file again',cmd:'kubectl apply -f frame/reactor.yaml',
 parts:[['kubectl apply -f','The identical command.']],
 saw:'"unchanged", twice. The cluster already matches the file, so there is nothing to do. Applying is safe to repeat.',
 test:(l,w,r)=>r.ok&&/unchanged/.test(r.out)&&/apply\b.*reactor\.yaml/.test(l)},
{what:'Read the list of what belongs to the frame',cmd:'cat frame/kustomization.yaml',
 parts:[['kustomization.yaml','A small index file. Its resources list names every manifest that makes up this folder\'s configuration.']],
 saw:'Seven files listed under resources. A tool built into kubectl, called Kustomize, reads this list. It becomes much more useful in lesson 7.',
 test:(l,w,r)=>r.ok&&/^cat frame\/kustomization\.yaml$/.test(l)},
{what:'Apply the whole frame (the complete base configuration)',cmd:'kubectl apply -k frame/',
 parts:[['-k frame/','Apply a folder through its kustomization.yaml: every file on the list, in one go. Use -f for single files and -k for a folder like this one.']],
 saw:'The reactor is unchanged and everything else is created. The schematic fills in: sensors, comms, balancer, targeting and two thrusters. The railgun, shield and life-support (optional services) exist as Deployments with zero replicas: defined, but switched off.',
 test:(l,w,r)=>w.deps.length>=9},
{what:'Check every subsystem',cmd:'kubectl get deployments',
 parts:[['kubectl get deployments','List all Deployments with their ready counts.']],
 saw:'Nine Deployments. The three hardpoints read 0/0: defined, with nothing mounted. That is the standard frame.',
 test:(l,w,r)=>r.ok&&/get (deployments?|deploy)\b/.test(l)},
{what:'Make a change by hand',cmd:'kubectl scale deployment thrusters --replicas=5',
 parts:[['kubectl scale','An imperative change that exists only in the cluster. No file records it.']],
 saw:'Five thrusters. The cluster now disagrees with the blueprint. This is called drift, and it is how real systems slowly become mysteries.',
 test:(l,w,r)=>reps(w,'thrusters')===5},
{what:'Apply the blueprint again',cmd:'kubectl apply -k frame/',
 parts:[['kubectl apply -k frame/','Make the cluster match the files again.']],
 saw:'thrusters says "configured" and is back to two. The files are the source of truth. Change the file and apply, and your change survives. Change the cluster by hand, and the next apply undoes it.',
 test:(l,w,r)=>r.ok&&reps(w,'thrusters')===2&&/apply\b/.test(l)},
{what:'Remove one subsystem (one service) using its file',cmd:'kubectl delete -f frame/comms.yaml',
 parts:[['kubectl delete -f','Delete every object the file describes. The file names what to remove, so you do not have to.']],
 saw:'The comms Deployment and its Service are both gone. Note that removing a file from a folder does not delete anything from the cluster. Deleting is always explicit.',
 test:(l,w,r)=>!depOf(w,'comms')}],
quiz:[
{q:'You run kubectl apply on a file whose objects already exist and match. What happens?',opts:['An AlreadyExists error','The pods are restarted','Nothing changes: each object is reported as unchanged','The objects are deleted and recreated'],a:2,why:'apply compares the file with the cluster and only acts on differences. kubectl create, by contrast, fails if the object exists.'},
{q:'Someone scaled a Deployment by hand, and later the manifests were applied again. Which replica count wins?',opts:['The one in the manifest','The hand-typed one, permanently','Whichever is larger','The cluster refuses to apply'],a:0,why:'apply sets every field the file specifies. That is why teams change the file, not the cluster.'}],
reading:[
['Declarative management with configuration files','https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/','How kubectl apply works, including how it merges changes.'],
['Objects in Kubernetes','https://kubernetes.io/docs/concepts/overview/working-with-objects/','apiVersion, kind, metadata and spec: the four fields every manifest has.'],
['Deployment v1 API reference','https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/deployment-v1/','Every field a Deployment accepts. Dense, but it is the final authority.']]
},

{id:6,title:'Mission parameters: ConfigMaps and Secrets',short:'Config and secrets',mins:11,
idea:`
<p>In the Docker guide you passed settings with <code>-e KEY=value</code>, so one image could run with different settings. Kubernetes keeps the same principle (settings stay <em>out</em> of the image) and gives the settings their own objects.</p>
<dl class="terms">
<dt>ConfigMap</dt><dd>A named set of ordinary key=value settings. On the Kestrel: a mission profile and a sensor range. In a real system: an environment name, a log level, a feature switch, the address of another service.</dd>
<dt>Secret</dt><dd>The same shape, for sensitive values. On the Kestrel: the identification (IFF) codes. In a real system: database passwords, API keys, signing keys. It is handled a little more carefully by the cluster and can be locked down separately.</dd>
</dl>
<p>A Deployment then <em>refers</em> to a ConfigMap or Secret, and its pods receive the values as environment variables when they start.</p>
<p>Two facts catch nearly everyone, and the lab makes you run into both on purpose:</p>
<ul>
<li>A Secret is <strong>encoded, not encrypted</strong>. Anyone who can read the object can read the value.</li>
<li>Environment variables are read <strong>once, when a pod starts</strong>. Editing a ConfigMap does not reach pods that are already running.</li>
</ul>`,
seed:['kubectl create deployment targeting --image=hangar/targeting:1.0 --replicas=2','kubectl create deployment sensors --image=hangar/sensors:1.0'],
labIntro:'The sandbox starts with two targeting pods and one sensor pod. Give targeting (a service of your app) its mission parameters (its settings).',
tasks:[
{what:'Create a ConfigMap with the mission parameters (application settings)',cmd:'kubectl create configmap mission --from-literal=PROFILE=patrol --from-literal=SENSOR_RANGE_KM=40',
 parts:[['kubectl create configmap mission','Create a ConfigMap named mission.'],['--from-literal=KEY=value','One setting. Repeat the flag for each one. (In real projects you would write this as a manifest, as in lesson 5.)']],
 saw:'The ConfigMap exists, and it appears in the Config column of the schematic. No pod uses it yet.',
 test:(l,w,r)=>w.cms.some(c=>c.name==='mission')},
{what:'Read it back',cmd:'kubectl get configmap mission -o yaml',
 parts:[['-o yaml','Print the object as YAML, the same shape as a manifest. This works for any object and is a handy way to see how something is written.']],
 saw:'Plain text under data. Note the quotes around "40": ConfigMap values are always text, so a number has to be quoted in YAML.',
 test:(l,w,r)=>r.ok&&/get (configmaps?|cm)[ \/]mission\b.*-o ?yaml/.test(l)},
{what:'Connect the targeting Deployment to the ConfigMap',cmd:'kubectl set env deployment/targeting --from=configmap/mission',
 parts:[['kubectl set env deployment/targeting','Change the environment variables in this Deployment\'s pod template.'],['--from=configmap/mission','Take every key in the ConfigMap as a variable.']],
 saw:'You changed the pod template, so the Deployment is replacing its pods with new ones built from the new template. Watch the targeting pods on the schematic turn over.',
 test:(l,w,r)=>{const d=depOf(w,'targeting');return !!d&&d.envFrom.includes('configmap/mission');}},
{what:'Wait for the replacement to finish',cmd:'kubectl rollout status deployment/targeting',
 parts:[['kubectl rollout status','Follow a Deployment while it replaces its pods, and return when it is done.']],
 saw:'"successfully rolled out": both targeting pods now come from the new template. Lesson 8 looks at rollouts properly.',
 test:(l,w,r)=>r.ok&&/rollout status\b.*targeting/.test(l)},
{what:'Look at the environment inside a targeting pod',cmd:'kubectl exec deploy/targeting -- env',
 parts:[['-- env','Run env inside the container to print its environment variables.']],
 saw:'PROFILE=patrol and SENSOR_RANGE_KM=40 are there, delivered from the ConfigMap. The image did not change.',
 test:(l,w,r)=>r.ok&&/PROFILE=/.test(r.out)},
{what:'Store the identification code (a credential) as a Secret',cmd:'kubectl create secret generic iff-codes --from-literal=IFF_KEY=kestrel-7-amber',
 parts:[['kubectl create secret generic iff-codes','Create a Secret named iff-codes. "generic" means plain key=value pairs, as opposed to special kinds such as registry logins.'],['--from-literal=IFF_KEY=...','The sensitive value.']],
 saw:'Created. Typing a secret on the command line leaves it in your shell history, so real projects load Secrets from a file or a secrets manager.',
 test:(l,w,r)=>w.secrets.some(c=>c.name==='iff-codes')},
{what:'Read the Secret back',cmd:'kubectl get secret iff-codes -o yaml',
 parts:[['get secret iff-codes -o yaml','Print the Secret as YAML.']],
 saw:'IFF_KEY looks scrambled, but it is only base64, an encoding anyone can reverse in one command. A Secret is not encrypted by being a Secret. Never commit a Secret manifest to Git as it is.',
 test:(l,w,r)=>r.ok&&/get secrets?[ \/]iff-codes\b.*-o ?yaml/.test(l)},
{what:'Change the mission profile (edit a setting)',cmd:'kubectl patch configmap mission -p \'{"data":{"PROFILE":"assault"}}\'',
 parts:[['kubectl patch configmap mission','Change part of an existing object in place.'],['-p \'{"data":{"PROFILE":"assault"}}\'','The patch, written as JSON: set the PROFILE key under data. (With manifests you would edit the file and apply it instead.)']],
 saw:'The ConfigMap now says assault. The schematic header changes, because it reads the ConfigMap.',
 test:(l,w,r)=>profile(w)==='assault'},
{what:'Ask a running pod which profile it has',cmd:'kubectl exec deploy/targeting -- printenv PROFILE',
 parts:[['printenv PROFILE','Print one environment variable.']],
 saw:'Still patrol. The pod read its environment when it started and has no way to notice the ConfigMap changed. This catches everyone once.',
 test:(l,w,r)=>r.ok&&/printenv PROFILE/.test(l)&&/patrol/.test(r.out)},
{what:'Restart the pods so they read the new value',cmd:'kubectl rollout restart deployment/targeting',
 parts:[['kubectl rollout restart','Replace every pod of a Deployment with a fresh one, gradually, without changing anything else.']],
 saw:'The Deployment is replacing its pods one after another. No downtime: old pods stay until new ones are ready.',
 test:(l,w,r)=>r.ok&&/rollout restart\b.*targeting/.test(l)},
{what:'Wait for it',cmd:'kubectl rollout status deployment/targeting',
 parts:[['kubectl rollout status','Follow the restart until it completes.']],
 saw:'Rolled out.',
 test:(l,w,r)=>r.ok&&/rollout status\b.*targeting/.test(l)},
{what:'Ask again',cmd:'kubectl exec deploy/targeting -- printenv PROFILE',
 parts:[['printenv PROFILE','The same question, to a fresh pod.']],
 saw:'assault. New pods, new environment. The rule to remember: after changing a ConfigMap or Secret that pods read as environment variables, restart those pods.',
 test:(l,w,r)=>r.ok&&/assault/.test(r.out)}],
quiz:[
{q:'What protection does storing a value in a Secret give you by default?',opts:['It is encrypted with a key only you hold','It is base64-encoded, which is not encryption. Protection comes from limiting who can read Secrets','It cannot be read by kubectl','It is deleted after first use'],a:1,why:'Base64 is a reversible encoding. Real protection comes from access rules, encryption at rest in the cluster, or an external secrets manager.'},
{q:'You edit a ConfigMap that a Deployment loads as environment variables. When do the running pods see the change?',opts:['Immediately','Within a minute','Only after the pods are replaced, for example with kubectl rollout restart','Never, the Deployment must be deleted'],a:2,why:'Environment variables are fixed when a container starts. A restart creates new pods, which read the current values.'}],
reading:[
['ConfigMaps','https://kubernetes.io/docs/concepts/configuration/configmap/','All the ways a pod can consume a ConfigMap, including as files.'],
['Secrets','https://kubernetes.io/docs/concepts/configuration/secret/','What Secrets are, their types, and their limits.'],
['Good practices for Kubernetes Secrets','https://kubernetes.io/docs/concepts/security/secrets-good-practices/','Encryption at rest, access control, and external stores.']]
},

{id:7,title:'Mission loadouts',short:'Mission loadouts',mins:12,
idea:`
<p>The Kestrel flies different missions (environments), and each needs the machine set up differently. Reconnaissance wants more sensors and nothing heavy. An assault wants the railgun and shield mounted. Orbital work wants every thruster and a sealed cabin.</p>
<p>You could keep three complete copies of the blueprint, one per mission. But then every fix has to be made three times, and the copies drift apart. This is exactly the problem real teams have with <strong>development, staging and production</strong>: nearly the same system, with a few deliberate differences.</p>
<p>The standard solution is built into kubectl and is called <strong>Kustomize</strong>:</p>
<dl class="terms">
<dt>Base</dt><dd>The shared configuration, written once. Here: the <code>frame</code> folder from lesson 5. In a real project it is usually a folder called <code>base</code>.</dd>
<dt>Overlay</dt><dd>A small folder that says "start from the base, then change these few things". Here: one folder per mission under <code>missions</code>, and each mission's result is called a loadout. In a real project: one folder per environment under <code>overlays</code>, such as <code>dev</code>, <code>staging</code> and <code>production</code>.</dd>
</dl>
<p>An overlay's <code>kustomization.yaml</code> is only a few lines long, and <code>kubectl apply -k</code> combines it with the base and applies the result. Reconfiguring the whole machine becomes one command, and the difference between two missions is a file you can read in ten seconds.</p>`,
widget:'missions',widgetTitle:'Three loadouts, one frame',
widgetIntro:'Pick a mission to see what its overlay changes. Everything not listed stays as the base frame defines it.',
seed:['kubectl apply -k frame/'],
labIntro:'The sandbox starts with the standard frame (the base) from lesson 5 already applied. Refit it three times. Read each mission as an environment: recon, assault and orbital are this guide\'s dev, staging and production.',
tasks:[
{what:'Check the standard frame',cmd:'kubectl get deployments',
 parts:[['kubectl get deployments','List every subsystem and its ready count.']],
 saw:'The base: one of each core subsystem, two thrusters, and the three hardpoints at 0/0.',
 test:(l,w,r)=>r.ok&&/get (deployments?|deploy)\b/.test(l)},
{what:'See what a mission folder contains',cmd:'ls missions/recon',
 parts:[['ls missions/recon','List the recon overlay\'s files.']],
 saw:'Only two files: the overlay\'s kustomization.yaml, and mission.yaml, which holds this mission\'s ConfigMap.',
 test:(l,w,r)=>r.ok&&/^ls missions\/recon\/?$/.test(l)},
{what:'Read the recon overlay',cmd:'cat missions/recon/kustomization.yaml',
 parts:[['resources','What to start from: the whole frame folder (two levels up), plus this mission\'s own mission.yaml.'],['replicas','Kustomize\'s shortcut for changing replica counts: for the Deployment with this name, use this count instead of the base\'s.']],
 saw:'The entire difference between the standard frame and a recon mission: three sensors instead of one, and a ConfigMap. Nothing is copied from the base.',
 test:(l,w,r)=>r.ok&&/^cat missions\/recon\/kustomization\.yaml$/.test(l)},
{what:'Refit for reconnaissance (apply one environment\'s overlay)',cmd:'kubectl apply -k missions/recon',
 parts:[['kubectl apply -k missions/recon','Build the base plus this overlay, then make the cluster match the result.']],
 saw:'Almost everything is "unchanged". sensors is "configured" and the mission ConfigMap is "created". Two more sensor units appear on the schematic, and the header shows the mission.',
 test:(l,w,r)=>profile(w)==='recon'&&reps(w,'sensors')===3},
{what:'Confirm the loadout',cmd:'kubectl get deployments',
 parts:[['kubectl get deployments','The same list as step 1.']],
 saw:'sensors reads 3/3 once the new pods are up. Every other line is as it was.',
 test:(l,w,r)=>r.ok&&/get (deployments?|deploy)\b/.test(l)},
{what:'Refit for assault (switch to another environment\'s overlay)',cmd:'kubectl apply -k missions/assault',
 parts:[['missions/assault','A different overlay on the same base: three thrusters, two targeting computers, two railgun controllers and the shield.']],
 saw:'Read the reply line by line. sensors went back to one without anyone mentioning it, because the assault overlay does not override it and the base says one. The railgun and shield mount on the schematic.',
 test:(l,w,r)=>profile(w)==='assault'&&reps(w,'railgun')===2},
{what:'See where the scheduler put everything',cmd:'kubectl get pods -o wide',
 parts:[['-o wide','Shows the node for each pod.']],
 saw:'Twelve pods, spread across torso, arms and legs. You described a loadout and never chose a node.',
 test:(l,w,r)=>r.ok&&/get (pods?|po)\b.*-o ?wide/.test(l)},
{what:'Refit for orbit (a third environment)',cmd:'kubectl apply -k missions/orbital',
 parts:[['missions/orbital','Four thrusters, two sensors, life-support on, and nothing on the weapon mounts.']],
 saw:'The railgun and shield scale to zero and come off the schematic. Life-support seals the cabin and two more thrusters come online.',
 test:(l,w,r)=>profile(w)==='orbital'&&reps(w,'thrusters')===4},
{what:'Read the active mission parameters (this environment\'s settings)',cmd:'kubectl get configmap mission -o yaml',
 parts:[['get configmap mission -o yaml','The ConfigMap each overlay supplies.']],
 saw:'PROFILE is orbital and the sensor range is 400 km. Each overlay carries its own copy of this one object. (As lesson 6 showed, pods that read it as environment variables would need a restart to see the change.)',
 test:(l,w,r)=>r.ok&&/get (configmaps?|cm)[ \/]mission\b.*-o ?yaml/.test(l)}],
notes:`
<h2>The same idea at work</h2>
<p>With the words swapped back, this is an everyday project layout: a <code>base</code> folder with the app's Deployment and Service, and overlays called <code>dev</code>, <code>staging</code> and <code>production</code>. Dev runs one replica with debug settings. Production runs five with real ones. One fix to the base reaches all three.</p>
<p>Two things worth knowing before you use Kustomize for real:</p>
<ul>
<li><code>kubectl kustomize missions/recon</code> prints the combined YAML without applying it. Use it to check what an overlay really produces. It works in this sandbox too.</li>
<li>Overlays can change much more than replica counts: image tags, labels, name prefixes, and arbitrary fields through patches. Kustomize can also generate ConfigMaps whose names change when their contents change, which makes pods restart automatically and removes the gotcha from lesson 6.</li>
</ul>
<p>The other common tool for this job is <strong>Helm</strong>, which uses templates with fill-in values instead of overlays. Many teams use Helm to install other people's software and Kustomize for their own.</p>`,
quiz:[
{q:'The assault overlay does not mention sensors. After applying it, how many sensor pods run?',opts:['Three, left over from recon','One, because the base says one and the overlay does not override it','Zero','It depends on which mission was applied before'],a:1,why:'Every apply -k builds the complete configuration from base plus overlay. The result does not depend on what was applied before, which is what makes it predictable.'},

{id:8,title:'Refits and repairs: rollouts and drains',short:'Rollouts and drains',mins:12,
idea:`
<p>Two things happen to every running system. The software gets a new version, and the hardware needs work. On the Kestrel that is a firmware update to a subsystem (a new release of one of your services, shipped as a new image tag) and maintenance on a section (a server being patched, upgraded or replaced). Kubernetes can handle both while the system keeps running.</p>
<dl class="terms">
<dt>Rolling update</dt><dd>When you change a Deployment's image, it does not stop everything and start again. It starts a pod with the new version, waits until that pod is ready, then retires an old one, and repeats. There is always something to answer requests.</dd>
<dt>Rollback</dt><dd>The Deployment keeps its previous versions. If a new version is bad, one command returns to the last one.</dd>
<dt>Drain</dt><dd>Before working on a node, you ask Kubernetes to move its pods elsewhere and stop sending new ones. The node empties without any subsystem going offline.</dd>
</dl>
<p>The rolling update has a safety property that matters more than its speed: <strong>it will not retire old pods until new ones are ready</strong>. If the new version cannot start, the rollout stalls and the old version keeps serving. You are about to rely on that.</p>`,
seed:['kubectl apply -k frame/','kubectl scale deployment targeting --replicas=3'],
labIntro:'The sandbox starts with the standard frame, with targeting (one service of the app) scaled to three pods on firmware 1.0 (image tag 1.0). Update it mid-flight, which is to say without downtime.',
tasks:[
{what:'Check the targeting pods before the update',cmd:'kubectl get pods -l app=targeting',
 parts:[['-l app=targeting','Only the targeting pods.']],
 saw:'Three pods, all with the same code in the middle of their names. That code identifies the ReplicaSet for firmware 1.0.',
 test:(l,w,r)=>r.ok&&/get (pods?|po)\b.*app=targeting/.test(l)},
{what:'Roll out firmware 2.0 (a new release, as a new image tag)',cmd:'kubectl set image deployment/targeting targeting=hangar/targeting:2.0',
 parts:[['kubectl set image deployment/targeting','Change an image in this Deployment\'s pod template.'],['targeting=hangar/targeting:2.0','container name = new image. The container in this Deployment is called targeting.']],
 saw:'The rollout has started. Watch the targeting pods on the schematic: new ones appear in amber, and old ones leave only as new ones turn green.',
 test:(l,w,r)=>{const d=depOf(w,'targeting');return !!d&&/:2\.0$/.test(d.image);}},
{what:'Follow the rollout',cmd:'kubectl rollout status deployment/targeting',
 parts:[['kubectl rollout status','Report progress until the rollout finishes.']],
 saw:'"successfully rolled out". Three pods on 2.0, and at no moment were there fewer than the frame needed.',
 test:(l,w,r)=>r.ok&&/rollout status\b.*targeting/.test(l)},
{what:'Now roll out an untested build (a bad release)',cmd:'kubectl set image deployment/targeting targeting=hangar/targeting:2.1-beta',
 parts:[['hangar/targeting:2.1-beta','A build with a fault: it crashes a moment after starting.']],
 saw:'The Deployment accepted it, as it would accept any image name. Whether that build works is about to become clear.',
 test:(l,w,r)=>{const d=depOf(w,'targeting');return !!d&&/2\.1-beta$/.test(d.image);}},
{what:'Check the pods',cmd:'kubectl get pods -l app=targeting',
 parts:[['kubectl get pods -l app=targeting','The same list as step 1.']],
 saw:'One new pod in CrashLoopBackOff (starting, crashing, waiting, trying again) and three 2.0 pods still Running. The rollout stalled at the first failure, so targeting never went down.',
 test:(l,w,r)=>r.ok&&/get (pods?|po)\b.*app=targeting/.test(l)},
{what:'Read why the new pod is crashing',cmd:'kubectl logs deploy/targeting',
 parts:[['kubectl logs deploy/targeting','Logs from a pod of this Deployment. Here that is the newest, failing one.']],
 saw:'A panic about a missing calibration table. The logs of a crashing pod are where the reason is. Kubernetes can only tell you that it crashed.',
 test:(l,w,r)=>r.ok&&/^(kubectl|k) logs\b/.test(l)},
{what:'List the versions the Deployment remembers',cmd:'kubectl rollout history deployment/targeting',
 parts:[['kubectl rollout history','Show the numbered revisions of a Deployment. Each is a ReplicaSet kept in reserve.']],
 saw:'Three revisions: 1.0, 2.0 and the broken 2.1-beta.',
 test:(l,w,r)=>r.ok&&/rollout history\b/.test(l)},
{what:'Go back to the last good version',cmd:'kubectl rollout undo deployment/targeting',
 parts:[['kubectl rollout undo','Return the Deployment to its previous revision.']],
 saw:'Rolled back. The crashing pod is removed and the three 2.0 pods carry on. In a team, you would also revert the image tag in the manifest, or the next apply would bring 2.1-beta straight back.',
 test:(l,w,r)=>{const d=depOf(w,'targeting');return r.ok&&!!d&&/:2\.0$/.test(d.image);}},
{what:'Take the legs (one node) offline for maintenance',cmd:'kubectl drain legs --ignore-daemonsets',
 parts:[['kubectl drain legs','Mark the node unschedulable (cordon it), then evict every pod running on it.'],['--ignore-daemonsets','Leave alone the per-node system pods such as kube-proxy. Drain refuses to run without this flag on almost every cluster.']],
 saw:'Each pod on legs was evicted, and its Deployment immediately started a replacement on another node. The legs section on the schematic is marked as out of service.',
 test:(l,w,r)=>r.ok&&w.nodes.find(n=>n.name==='legs').cordoned&&/drain\b/.test(l)},
{what:'See where the pods went',cmd:'kubectl get pods -o wide',
 parts:[['-o wide','Shows the node for each pod.']],
 saw:'Everything now runs on torso and arms. Nothing was lost, because every pod belonged to a Deployment. A bare pod like the one in lesson 2 would simply have been deleted.',
 test:(l,w,r)=>r.ok&&/get (pods?|po)\b.*-o ?wide/.test(l)},
{what:'Bring the legs (the node) back into service',cmd:'kubectl uncordon legs',
 parts:[['kubectl uncordon legs','Allow the scheduler to place pods on this node again.']],
 saw:'legs is schedulable again. Existing pods do not move back on their own, because Kubernetes does not disturb healthy pods. New pods will land there as they are created.',
 test:(l,w,r)=>r.ok&&!w.nodes.find(n=>n.name==='legs').cordoned}],
quiz:[
{q:'A rolling update\'s new pods keep crashing. What happens to the old version?',opts:['It was already removed, so there is an outage','Its pods keep running, because old pods are retired only as new ones become ready','It is deleted after five minutes','Kubernetes automatically rolls back'],a:1,why:'The rollout stalls rather than proceeding. Kubernetes does not roll back on its own by default: that is your decision, with kubectl rollout undo.'},
{q:'What does kubectl drain do to a node?',opts:['Deletes the node from the cluster','Restarts the node','Stops new pods being scheduled there and evicts the ones on it, so their controllers recreate them elsewhere','Removes all its images'],a:2,why:'Drain is cordon plus evict. The node stays in the cluster, empty, until you uncordon it.'}],
reading:[
['Performing a rolling update','https://kubernetes.io/docs/tutorials/kubernetes-basics/update/update-intro/','The official tutorial, with diagrams of each stage.'],
['Rolling back a Deployment','https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-back-a-deployment','History, undo, and returning to a specific revision.'],
['Safely drain a node','https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/','Drain in detail, including how to protect apps with disruption budgets.']]
},

{id:9,title:'Back on Earth: running it for real',short:'For real',mins:8,
idea:`
<p>The Kestrel was a stand-in, and the parentheses along the way said what for. Put together: the frame was a cluster, its sections were servers, each subsystem was one service of an application, the hangar was a container registry, firmware versions were image tags, and missions were environments. Every command you ran is the command you would run on a real system. Only the names change.</p>
<h2>From Compose to Kubernetes</h2>
<p>Here is how the pieces you already know from Compose map across.</p>
<dl class="terms">
<dt>A service in compose.yaml</dt><dd>Becomes a <strong>Deployment</strong> (to run the containers) plus a <strong>Service</strong> (to give them a name).</dd>
<dt>ports: "8000:8000"</dt><dd>For visitors from the internet, an <strong>Ingress</strong> or Gateway: one front door that routes web addresses to Services. For a quick look while developing, <code>kubectl port-forward</code>.</dd>
<dt>environment:</dt><dd>A <strong>ConfigMap</strong> for ordinary settings and a <strong>Secret</strong> for sensitive ones.</dd>
<dt>volumes:</dt><dd>A <strong>PersistentVolumeClaim</strong>: a request for durable disk that outlives pods. Programs that own data, like Postgres, use a <strong>StatefulSet</strong> instead of a Deployment so that each pod keeps its identity and its disk.</dd>
<dt>healthcheck:</dt><dd><strong>Probes</strong>. A readiness probe decides whether a pod receives traffic. A liveness probe decides whether it should be restarted.</dd>
<dt>docker compose up</dt><dd><code>kubectl apply -k</code>, usually run by a pipeline after your tests pass, not by hand.</dd>
</dl>
<h2>Translation key</h2>
<p>The same key as in lesson 1, now that every row has a lab behind it.</p>
${KEY_HTML}
<h2>Getting a real cluster on your machine</h2>
<ol>
<li><strong>Install kubectl</strong>. Docker Desktop already includes it.</li>
<li><strong>Start a local cluster.</strong> The simplest choice if you have Docker Desktop is to switch on Kubernetes in its settings. The alternatives are <strong>kind</strong> (runs each node as a Docker container, and is what this guide imitates) and <strong>minikube</strong>. With kind, <code>kind create cluster</code> is the whole setup.</li>
<li><strong>Run <code>kubectl get nodes</code>.</strong> A node in Ready state means you have a working cluster. Every command from these lessons now works for real, with <code>nginx</code> in place of the hangar images.</li>
</ol>
<h2>Things this guide left out</h2>
<ul>
<li><strong>Resource requests and limits.</strong> Each container declares how much CPU and memory it needs. The scheduler uses those numbers to decide what fits where. This guide's "six pods per section" stood in for that.</li>
<li><strong>Namespaces.</strong> Folders that separate teams or environments inside one cluster. You met <code>kube-system</code>.</li>
<li><strong>Access control (RBAC).</strong> Who may do what. It is the thing that actually protects Secrets.</li>
<li><strong>Managed clusters.</strong> Cloud providers will run the control plane for you (GKE, EKS, AKS and others), so you only look after the workloads.</li>
</ul>
<h2>Do you need Kubernetes at all?</h2>
<p>Often not, and it is worth saying plainly. One server running Docker Compose is a perfectly good home for a small product. Kubernetes earns its complexity when you need several machines, updates without downtime, automatic recovery, or many services owned by different people. Many teams also meet it without choosing it, because their platform or hosting provider already runs it. In that case what you learned here is the vocabulary: you can now read the manifests, follow a rollout, and ask precise questions.</p>`,
seed:['kubectl apply -k missions/recon'],
quiz:[
{q:'You are moving a Compose service to Kubernetes. Which pair of objects usually replaces it?',opts:['A Node and a Pod','A Deployment to run its containers and a Service to give them a stable name','A ConfigMap and a Secret','An Ingress and a Namespace'],a:1,why:'The Deployment keeps the right number of pods running, and the Service makes them reachable under one name.'},
{q:'Why does Postgres normally run as a StatefulSet with a PersistentVolumeClaim, and not as a plain Deployment?',opts:['Deployments cannot run databases','Its data must survive pod replacement, and each pod needs a stable identity and its own disk','StatefulSets are faster','Postgres needs more than one container'],a:1,why:'Deployment pods are interchangeable and disposable. A database pod is neither, so it needs durable storage that follows it. Many teams avoid the question by using a managed database outside the cluster.'}],
reading:[
['kind quick start','https://kind.sigs.k8s.io/docs/user/quick-start/','Install kind and create a local cluster in a few minutes.'],
['minikube start','https://minikube.sigs.k8s.io/docs/start/','The other popular local cluster, with a built-in dashboard.'],
['Configure liveness, readiness and startup probes','https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/','How to tell Kubernetes whether your app is healthy.'],
['Resource management for pods and containers','https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/','Requests and limits, and how the scheduler uses them.'],
['Ingress','https://kubernetes.io/docs/concepts/services-networking/ingress/','Routing outside traffic to Services by host name and path.'],
['Translate a Docker Compose file to Kubernetes','https://kubernetes.io/docs/tasks/configure-pod-container/translate-compose-kubernetes/','The Kompose tool, useful for seeing how your own compose.yaml would map.']]
}
