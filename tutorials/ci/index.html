{q:'A workflow refers to ${{ secrets.API_KEY }} and no secret of that name exists. What happens?',opts:['The run fails with "secret not found"','The expression becomes an empty string and the run carries on','GitHub asks you for the value','The step is skipped'],a:1,why:'A missing secret is silently empty. The failure shows up later, as a login or request that does not work.'},
{q:'Why do pull requests from forks not receive secrets?',opts:['Forks are slower','A stranger could otherwise open a pull request whose workflow reads the secrets and sends them away','Secrets only work on main','It is a bug'],a:1,why:'The pull request\'s author controls what the workflow runs. Giving that code your secrets would hand them to anyone.'},
{q:'You removed a password from a file and committed. Is it safe now?',opts:['Yes','No. It is still in earlier commits, so it must be changed at the service it belongs to','Yes, after the next push','Only if the repository is private'],a:1,why:'Git keeps every version. A committed credential should be considered exposed and replaced.'}],

['Using secrets in GitHub Actions',GD+'/how-tos/write-workflows/choose-what-workflows-do/use-secrets','Creating secrets and passing them to steps.'],

{id:10,title:'The whole pipeline',mins:12,
idea:`
<p>The workflow now lints, runs unit tests, runs browser tests against a real shop, keeps evidence, and handles a secret. This last lesson adds the finishing pieces that most mature workflows have, and then steps back to look at what you built.</p>
<dl class="terms">
<dt>Matrix</dt><dd>A way to run one job several times with one value changed each time: three Python versions, two operating systems, or here two browsers.</dd>
<dt>workflow_dispatch</dt><dd>A trigger that lets a person start the workflow by hand.</dd>
<dt>schedule</dt><dd>A trigger that starts the workflow at set times, written in cron syntax.</dd>
<dt>Concurrency group</dt><dd>A label that stops runs piling up. With <code>cancel-in-progress</code>, a newer run replaces an older one for the same branch.</dd>
<dt>Timeout</dt><dd>A limit on how long a job may run before GitHub stops it.</dd>
<dt>CD</dt><dd>Continuous delivery or deployment: the stage after CI, where a change that passed every check is released automatically. Same workflow files, more jobs, and usually more secrets.</dd>
</dl>
<p>One consequence of a matrix is worth meeting in the lab rather than in production. A matrix job's checks are named after its values: <code>browser (chromium)</code> and <code>browser (firefox)</code>. The ruleset from lesson 6 requires a check called <code>browser</code>, and after this change no job reports under that name. The pull request will be fully green and still unmergeable until the rule is updated.</p>`,

notes:`<h2>What you built</h2>
<ol>
<li>A workflow file, versioned with the code, that defines "working".</li>
<li>Checks on every pull request, and a rule that makes them binding.</li>
<li>Fast checks in front of slow ones, with caches for the downloads.</li>
<li>Evidence kept from failures, and a way to tell a real failure from a flaky one.</li>
<li>Secrets passed in without being written down, and a token with minimal permissions.</li>
<li>Two browsers, a nightly run, a manual trigger, and limits on time and overlap.</li>
</ol>
<h2>Reading a pull request as a product owner</h2>
<ul>
<li><strong>All green:</strong> nothing that was checked is broken. Ask what was not checked.</li>
<li><strong>Red:</strong> open the failing check's details. Is it your change, or a flaky test? If the tests and the code disagree about a rule, that is a product question for you.</li>
<li><strong>A diff that touches <code>.github/workflows/</code>, the tests, or the ruleset:</strong> read it with extra care. Those files are the gate. A coding agent that makes CI pass by deleting a test has not fixed anything.</li>
<li><strong>Green on the second attempt:</strong> ask what failed the first time.</li>
</ul>
<h2>What comes after CI</h2>
<p>The same machinery deploys. A job with <code>needs: [lint, unit, browser]</code> that only runs on pushes to main can build a Docker image and release it. That is continuous delivery, and it rests entirely on trusting the checks before it. Where this guide's workflow pulls a ready-made shop image, a real project would build that image from its own Dockerfile first, which is where the Docker guide in this series joins up.</p>`,

{q:'What does cancel-in-progress: true do when you push twice quickly to the same pull request?',opts:['Both runs finish','The older run is cancelled and only the newer commit is tested','The newer run waits a day','The pull request is closed'],a:1,why:'Runs in the same concurrency group replace each other. Testing a commit that has already been superseded is wasted time.'},
{q:'After adding a matrix, every check is green and the pull request still cannot be merged. Most likely reason?',opts:['GitHub is down','The ruleset requires the job\'s old name, and no check reports under that name any more','Matrix jobs cannot be required','The cache is full'],a:1,why:'Matrix jobs report as "name (value)". A rule still asking for the bare name waits for a status that never arrives.'}],

/* ----- quiz ----- */
function quiz(L,sec){
