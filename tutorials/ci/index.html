<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right a live map of what CI is doing (your files and git state, GitHub's runs with their jobs and steps, the repository's rules) above a terminal that changes it. One dark terminal world; on phones the map-and-terminal bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:attr(data-p) " ";color:var(--term-dim)}
.ran::before{content:attr(data-p) " ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-tables{border-top-color:var(--good)}.z-session{border-top-color:var(--accent)}.z-databases{border-top-color:var(--warn)}.z-roles{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-tables .zlist{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}

.wcards{display:flex;flex-direction:column;gap:10px}
.wcard{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.wcard>code{overflow-wrap:anywhere;font-size:.8rem;color:var(--good)}
.wcard .caption{font-size:.88rem}
.wtrack{position:relative;height:18px;background:var(--sunk);border-radius:2px;margin:0 6px}
.wtrack i{position:absolute}
.wtrack .upd{top:-2px;bottom:-2px;width:2px;background:var(--good)}
.wtrack .chk{top:5px;width:8px;height:8px;border-radius:50%;margin-left:-4px}
.chk.n{background:var(--bad)}.chk.y{background:var(--good);box-shadow:0 0 0 2px var(--sunk)}
.notes table.types code{white-space:nowrap}
.widget .bw-page{max-height:none}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}

/* ---- CI guide additions ---- */
:root{--accent:#a78bfa;--accent-ink:#150a33;--accent-soft:#251d44}
.prose code,.task code,.explain code,.saw code{color:#cfc0ff}
.z-git{border-top-color:var(--accent)}
.pz .z-run{border-bottom:0}
.xsteps li.going::before{content:"\25B8";color:var(--warn)}
.xsteps li.wait::before{content:"\00B7";color:var(--muted)}
.xsteps li.going code{color:var(--warn)}
.xsteps li.wait code,.xsteps li.skip code{color:var(--muted)}
.xsteps{margin:0 0 4px 22px}
.tm.passed,.tm.failed,.tm.running,.tm.queued{line-height:1.5}
.rbody{white-space:pre-wrap;overflow-wrap:anywhere;max-height:210px}
.runlist{max-height:96px}
.crow{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line);font:400 .76rem/1.4 var(--mono)}
.crow:last-child{border-bottom:0}
.crow .sha{color:var(--warn)}
.crow .cmsg{flex:1 1 12ch;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.crow .sub{flex-basis:auto}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.pdot.warn{background:var(--warn)}
.z-git .kv{gap:4px}
.z-git .zlist{gap:10px}
.lane .track{height:18px}
.lanes .lane span{overflow-wrap:anywhere}
.widget .segs{flex-wrap:wrap}
.pl .d{color:var(--accent)}
.prose ol{padding-left:22px;margin:0 0 12px}
.z-steps .tr b{font-size:.8rem}

.jobs{display:flex;flex-wrap:wrap;gap:4px}
.jtab{display:flex;align-items:center;gap:6px;font:500 .74rem var(--mono);padding:3px 9px 3px 4px;border-radius:3px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.jtab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.strip{border-top:1px solid var(--line)}
.strip .zone{border-top:0;border-right:0;padding:8px 12px;gap:6px}
.strip .zsub{display:none}
.strip h3{font-size:.7rem;color:var(--muted)}
.strip .zlist{flex-direction:row;flex-wrap:wrap;gap:6px 18px}
.strip .kv .empty{font:400 .75rem var(--mono)}
@media (min-width:1040px){
  .map{display:flex;flex-direction:column;overflow:hidden;max-height:66%}
  .map>.pz{flex:1 1 auto;min-height:0;overflow:auto}
  .map>.strip{flex:none;max-height:36%;overflow:auto}
}

def cart_total(prices, discount=0):

    total = sum(prices)

def shipping(total):
    """${doc}"""

{id:1,title:'What CI is',mins:8,
idea:`
<p>You have a repository with tests in it. The tests only protect you if somebody runs them, and people forget, or run them on a machine that happens to be set up differently. <strong>Continuous integration</strong>, CI for short, takes that job away from people. A service watches the repository, and every time the code changes it starts a clean machine, downloads the code, runs the checks, and reports a tick or a cross next to the commit.</p>
<p>This guide follows on from two earlier ones. The <em>Git Basics Sandbox</em> gave you commits, branches and pushing. <em>Playwright + pytest from Zero</em> gave you a test suite for the Leaf &amp; Bean shop. CI is where those two meet: git says when something changed, and the tests say whether it still works.</p>
<p>The CI service used here is <strong>GitHub Actions</strong>, which is built into GitHub. The ideas are the same in GitLab CI, CircleCI and the rest; only the file format differs.</p>
<dl class="terms">
<dt>Workflow</dt><dd>A file in the repository that says what to run and when. One repository can have several.</dd>
<dt>Event</dt><dd>The thing that happened which starts a workflow: a push, a pull request being opened, a time of day, a person pressing a button.</dd>
<dt>Run</dt><dd>One execution of a workflow, for one event. Each has an ID, a log, and an outcome.</dd>
<dt>Job</dt><dd>A unit of work inside a run. Each job gets its own machine.</dd>
<dt>Step</dt><dd>One command or one packaged action inside a job. Steps run in order on the job's machine.</dd>
<dt>Runner</dt><dd>The machine a job runs on. A GitHub-hosted runner is a virtual machine that is created for the job and thrown away when it ends.</dd>
<dt>Check</dt><dd>The result a job reports back against a commit: passing, failing or still running. Checks are what appear on a pull request.</dd>
</dl>
<p>The mental model to keep: <strong>CI is someone else's computer that runs your checks on every change and cannot be talked out of it.</strong> It proves the code works on a machine that has only what is in the repository, which is the only version of the code your teammates and your servers will ever get.</p>`,
widget:'journey',widgetTitle:'From a push to a green tick',
widgetIntro:'Every run goes through the same stages. Press Next to walk through them, or tap any box.',
labIntro:'On wide screens the sandbox is on the right; on a phone it is just below these steps. The panel at the top shows your files, your git history and what GitHub is doing, and the terminal underneath is where you type. Tap a command to load it, then press Run. This first lab only looks around.',

notes:`<h2>On your own machine</h2>
<ul>
<li>Install the GitHub CLI from <code>cli.github.com</code> and sign in once with <code>gh auth login</code>. In the sandbox that is already done.</li>
<li>Everything <code>gh</code> shows is also on the website: the <strong>Actions</strong> tab of a repository lists runs, and clicking one shows its jobs, steps and logs. Use whichever you prefer. The commands are worth knowing because they are quick, and because they are how an agent such as Claude Code checks its own work.</li>
<li>GitHub Actions is free for public repositories. Private repositories get a monthly allowance of minutes that depends on the plan, and the browser tests in lesson 6 are where minutes go.</li>
</ul>
<h2>What CI does not do</h2>
<p>CI runs the checks you wrote. It cannot tell you that a test is missing, or that the tests check the wrong thing. A green tick means "nothing we thought to check is broken", which is valuable, and smaller than "it works".</p>`,

{id:2,title:'Your first workflow',mins:12,
idea:`
<p>A workflow is a text file. Put it in the right folder, push it, and GitHub starts obeying it. There is no dashboard to configure and nothing to install on GitHub's side.</p>
<dl class="terms">
<dt>.github/workflows/</dt><dd>The folder GitHub looks in. Any file there ending in <code>.yml</code> is a workflow. The leading dot is part of the folder's name.</dd>
<dt>YAML</dt><dd>The format the file is written in. Structure comes from indentation: a line indented under another belongs to it. Indent with spaces, never tabs. A dash starts an item in a list.</dd>
<dt>on</dt><dd>The key that names the events which start the workflow.</dd>
<dt>runs-on</dt><dd>The key that picks the kind of machine for a job.</dd>
<dt>uses</dt><dd>A step that runs an <em>action</em>: a reusable, packaged step published in its own GitHub repository. <code>actions/checkout</code> means the repository <code>checkout</code> owned by <code>actions</code>.</dd>
<dt>run</dt><dd>A step that runs a shell command, the same text you would type in a terminal.</dd>
</dl>
<p>The first workflow here does four things: fetch the code, install uv, install the project's packages, and run the pricing tests. Those are the same four things you would do by hand on a new laptop. A good first test of any workflow is to read its <code>run</code> lines and ask whether you could type them yourself on a clean machine and get the same result.</p>`,
widget:'first',widgetTitle:'The workflow file, line by line',
widgetIntro:'This is the file you are about to add. Tap each line to see what it does.',
labIntro:'The repository is as you left it: three commits, no workflow.',
tasks:[
{what:'Make the folder GitHub looks in',cmd:'mkdir -p .github/workflows',parts:[['mkdir -p','Create a folder, and any missing folders above it.'],['.github/workflows','The one place GitHub looks for workflow files.']],

{what:'Stage the new folder',cmd:'git add .github',parts:[['git add','Mark changes to go into the next commit.'],['.github','The folder, and everything in it.']],
 saw:'The file is staged. A workflow is versioned like any other file, which means a change to CI is reviewed like a change to code.',test:(l,w)=>w.git.staged.has(WFP)||w.git.commits[w.git.branches.main].tree[WFP]!==undefined},

 saw:'One file changed. The Git tab shows the new commit with "not pushed" beside it: GitHub still knows nothing.',test:(l,w,r)=>committed(r,WFP)},

 saw:'The push printed what it always prints, and returned straight away. Now look at the panel: under GitHub Actions a run has appeared and its steps are ticking off. Pushing was the event.',test:(l,w,r)=>pushed(r,'main')&&w.gh.runs.length>0},
{what:'Watch the run from the terminal',cmd:'gh run watch',parts:P_WATCH,
 saw:'Each step printed a tick as it finished, ending with "completed with \'success\'". If the run was already over, gh said so instead. Tap a step in the panel to read its log.',test:(l,w,r)=>r.meta.cmd==='run watch'&&r.meta.conclusion==='success'},
{what:'Look at the finished run',cmd:'gh run view',parts:[['gh run view','Summarise one run: what triggered it, its jobs, and how long each took.']],
 saw:'One job, unit, with a tick. The Git tab now shows a tick beside your commit. That tick is public and permanent: anyone can see this commit passed.',test:(l,w,r)=>r.meta.cmd==='run view'&&!r.meta.log},

notes:`<h2>Things that go wrong with a first workflow</h2>
<ul>
<li><strong>Nothing happens after the push.</strong> The file is in the wrong folder, or its name does not end in <code>.yml</code> or <code>.yaml</code>. It must be exactly <code>.github/workflows/</code> at the top of the repository.</li>
<li><strong>The run fails at once with "Invalid workflow file".</strong> Nearly always indentation. YAML is strict: two spaces per level, no tabs, and list items lined up.</li>
<li><strong>"Unable to resolve action".</strong> The version after <code>@</code> does not exist. Action versions are tags in the action's own repository, so check its releases page.</li>
</ul>
<h2>Why the versions look different</h2>
<p><code>actions/checkout@v6</code> follows a tag that its authors move forward as they release fixes. <code>astral-sh/setup-uv@v8.3.2</code> names one exact release, because that project stopped publishing moving tags in 2026 and <code>@v8</code> no longer exists. Both are normal. When you copy a workflow from a blog post, check the versions against each action's releases page, because they go out of date quickly.</p>`,
quiz:[
{q:'Where must a workflow file live for GitHub to run it?',opts:['Anywhere, as long as it is named ci.yml','In .github/workflows/ at the top of the repository','In a folder named in the repository settings','In the same folder as the tests'],a:1,why:'GitHub only looks in .github/workflows/. The file name inside that folder is your choice.'},
{q:'What is the difference between a uses step and a run step?',opts:['uses is faster','run only works on Linux','uses runs a packaged action; run executes a shell command','There is none'],a:2,why:'An action is reusable code published in its own repository. A run step is just a command line.'},
{q:'The job has no actions/checkout step. What happens at uv sync?',opts:['It works, because GitHub copies the repository automatically','It fails: the machine has no pyproject.toml, because your code was never downloaded','It installs the latest version of everything','The job is skipped'],a:1,why:'A runner starts without your repository. Checkout is the step that puts the files there.'}],
reading:[
['Workflows',GD+'/concepts/workflows-and-actions/workflows','What a workflow is made of and how GitHub decides when to run one.'],
['Workflow syntax for GitHub Actions','https://docs.github.com/actions/reference/workflow-syntax-for-github-actions','The reference for every key a workflow file can contain.'],
['Using uv in GitHub Actions','https://docs.astral.sh/uv/guides/integration/github/','The uv project\'s own guide to installing uv, syncing and caching in a workflow.'],
['gh run watch',CLI+'/gh_run_watch','Options for following a run from the terminal.']]},

{id:3,title:'Reading a red run',mins:12,
idea:`
<p>CI earns its keep the first time it goes red. This lesson breaks the build on purpose, in the way it usually happens: a small, well-meant change that nobody ran the tests for.</p>
<dl class="terms">
<dt>Exit code</dt><dd>The number every command reports when it ends. Zero means success. Anything else means failure. This is the only thing CI looks at: it has no idea what pytest is.</dd>
<dt>Failed step</dt><dd>A step whose command exited with a non-zero code. The remaining steps of the job are skipped and the job is marked failed.</dd>
<dt>Log</dt><dd>Everything a step printed. It is kept with the run, so you can read it long after the machine is gone.</dd>
<dt>Broken main</dt><dd>The state where the newest commit on the main branch fails its checks. Everyone who starts work from it inherits the problem.</dd>
<dt>Reproduce</dt><dd>To make the same failure happen on your own machine, where you can investigate it quickly.</dd>
</dl>
<p>Reading a red run is a two-step habit. First find <em>which step</em> failed, which tells you the kind of problem: a failed install is a different day from a failed test. Then read <em>what that step printed</em>. For a test step that is an ordinary pytest report, which the Playwright guide taught you to read.</p>`,
widget:'redrun',widgetTitle:'A failed run, from the summary down to the cause',
widgetIntro:'These are the lines you are about to produce, from two commands. Tap each one.',
labIntro:'The workflow from lesson 2 is in place and the last run was green. A colleague suggests tidying the shipping rule into named constants. It looks harmless.',
tasks:[
{what:'Make the "tidy-up" change',cmd:CP('prices_tidy.py','prices.py'),parts:cpParts('prices_tidy.py','prices.py','It replaces the pricing code, as saving the file in your editor would.'),
 saw:'prices.py changed. The numbers 50 and 5 now have names. The changed lines are marked in green in the Files panel.',test:(l,w)=>isF(w,'prices.py',PRICES.tidy)},
{what:'Review the change',cmd:'git diff',parts:[['git diff','Show what has changed in tracked files since the last commit. Lines starting with - were removed, lines starting with + were added.']],
 saw:'Look closely at the two return lines. The old one says >= 50. The new one says > FREE_SHIPPING_FROM. One character went missing in the tidy-up, and it is easy to read straight past.',test:(l,w,r)=>r.meta.cmd==='git diff'},
{what:'Commit it without running the tests',cmd:'git commit -am "Tidy up the shipping rule"',parts:P_COMMIT_AM('Tidy up the shipping rule'),
 saw:'Committed. It was only a tidy-up, so why bother with the tests.',test:(l,w,r)=>committed(r,'prices.py')},
{what:'Push it',cmd:'git push',parts:P_PUSH,
 saw:'GitHub accepted the push without complaint and started a run. Nothing stopped a broken commit landing on main.',test:(l,w,r)=>pushed(r,'main')},
{what:'Watch the run',cmd:'gh run watch',parts:P_WATCH,
 saw:'The first steps passed and then the pytest step got an X. The run failed, and the Git tab shows a cross beside your commit.',test:(l,w,r)=>r.meta.cmd==='run watch'&&r.meta.conclusion==='failure'},
{what:'Read why it failed',cmd:'gh run view --log-failed',parts:P_LOGF,
 saw:'A pytest report. test_shipping[50-0] failed: an order of exactly $50 was charged $5 shipping, and the test says it should be free. The last line, "exit code 1", is what CI acted on.',test:(l,w,r)=>r.meta.cmd==='run view'&&r.meta.failed},
{what:'Reproduce it on your machine',cmd:'uv run pytest test_prices.py',parts:[['uv run pytest','Run pytest in the project\'s environment.'],['test_prices.py','Only this file, which is exactly the command the workflow ran.']],
 saw:'The same failure, in a fraction of a second. Running the command from the failing step yourself is the fastest route from "CI is red" to "I can see it".',test:(l,w,r)=>r.meta.cmd==='pytest'&&r.meta.failed===1},
{what:'Fix the code',cmd:CP('prices_tidy_fixed.py','prices.py'),parts:cpParts('prices_tidy_fixed.py','prices.py','The same tidy-up with the comparison put back to >=.'),
 saw:'Two lines changed: the comparison is >= again, and the comment says "$50 or more".',test:(l,w)=>isF(w,'prices.py',PRICES.fixed)},
{what:'Check before committing this time',cmd:'uv run pytest test_prices.py',parts:[['uv run pytest test_prices.py','The same command again.']],
 saw:'7 passed.',test:(l,w,r)=>r.meta.cmd==='pytest'&&r.meta.passed===7&&isF(w,'prices.py',PRICES.fixed)},
{what:'Commit the fix',cmd:'git commit -am "Free shipping starts at exactly 50"',parts:P_COMMIT_AM('Free shipping starts at exactly 50'),
 saw:'A second commit. The broken one stays in the history: you fix forward, you do not erase.',test:(l,w,r)=>committed(r,'prices.py')},
{what:'Push the fix',cmd:'git push',parts:P_PUSH,
 saw:'A new run started for the new commit.',test:(l,w,r)=>pushed(r,'main')},
{what:'Watch it go green',cmd:'gh run watch',parts:P_WATCH,
 saw:'Success. Red to green.',test:(l,w,r)=>r.meta.cmd==='run watch'&&r.meta.conclusion==='success'},
{what:'Look at the record',cmd:'gh run list',parts:[['gh run list','Recent runs, newest first.']],
 saw:'Tick, cross, tick. Between the cross and the tick, main was broken, and anyone who pulled got broken code. CI told you afterwards. The next two lessons make it tell you before.',test:(l,w,r)=>r.meta.cmd==='run list'}
],
notes:`<h2>What the red cross did and did not do</h2>
<p>It told you within seconds, with the exact failing line, and it left a permanent record against the commit. It did not stop the commit reaching main. A workflow that runs on push is a smoke alarm: it goes off after the fire starts. That is still far better than no alarm, and for a solo project it is often enough.</p>
<h2>When the failing step is not the tests</h2>
<ul>
<li><strong>Checkout or setup fails:</strong> usually GitHub or a download having a bad minute. Re-running often fixes it. Lesson 8 covers re-runs.</li>
<li><strong><code>uv sync</code> fails:</strong> the lock file and <code>pyproject.toml</code> disagree, or a package cannot be built on Linux. Run <code>uv lock</code> locally and commit the result.</li>
<li><strong>The test step fails with "command not found" or "No module named":</strong> the workflow is missing an install step, or a file was never committed. Lesson 7 is about this family of problems.</li>
</ul>`,
quiz:[
{q:'How does GitHub Actions decide that a run step failed?',opts:['It scans the output for the word FAILED','The command exited with a code other than zero','The step took too long','pytest sends it a message'],a:1,why:'Only the exit code. That is why any tool can be used in CI, and why a script that prints "error" but exits with 0 passes.'},
{q:'The third of five steps fails. What happens to steps four and five?',opts:['They run anyway','They are skipped, and the job fails','The job restarts from step one','They run on a different machine'],a:1,why:'By default a failure stops the job. Lesson 8 shows how to mark a step to run regardless.'},
{q:'CI is red on a test. What is usually the quickest next move?',opts:['Re-run the job and hope','Read the failed step\'s log, then run the same command locally','Delete the test','Ask who pushed last'],a:1,why:'The log names the failing test and line. Running the workflow\'s own command on your machine lets you see it happen and try a fix in seconds.'}],
reading:[
['gh run view',CLI+'/gh_run_view','Viewing a run, one job, or just the failed logs.'],
['pytest: exit codes','https://docs.pytest.org/en/stable/reference/exit-codes.html','What each exit code from pytest means. 0 is all passed and 1 is some tests failed.'],
['Using workflow run logs',GD+'/how-tos/monitor-workflows/use-workflow-run-logs','Reading, searching and downloading logs on the GitHub website.']]},

{id:4,title:'Checking before merging',mins:12,
idea:`
<p>In lesson 3 CI found the bug after it was on main. The fix is a change of habit, with one line of workflow to support it: stop committing to main directly. Put each change on a <strong>branch</strong>, open a <strong>pull request</strong>, and have CI test the pull request. Main only receives changes that have already been tested.</p>
<dl class="terms">
<dt>Pull request (PR)</dt><dd>A request to merge one branch into another, usually into main. It is a page on GitHub that shows the changes, the discussion and the checks.</dd>
<dt>pull_request event</dt><dd>Fires when a pull request is opened, and again every time new commits are pushed to its branch.</dd>
<dt>Checks</dt><dd>The list on a pull request showing each CI job and whether it passed. One job, one check.</dd>
<dt>Branch filter</dt><dd>A setting under an event that limits it to certain branches. <code>push: branches: [main]</code> means "only pushes to main".</dd>
<dt>Merge</dt><dd>Bringing the branch's changes into main. After that the pull request is closed.</dd>
</dl>
<p>The workflow in this lesson changes its <code>on:</code> block to two triggers: <code>pull_request</code>, and <code>push</code> limited to main. The first tests a change before it merges. The second tests main after each merge, so the main branch always has a tick of its own. Leaving <code>push</code> unfiltered would run everything twice on every pull request, once for the push and once for the pull request.</p>
<p>The change you will propose is a product decision: free shipping from $40 instead of $50. Watch what CI makes of it.</p>`,
widget:'prlife',widgetTitle:'The life of a pull request',
widgetIntro:'Seven stages, from an idea to a tested commit on main. Press Next, or tap a box.',
labIntro:'Main is green again after lesson 3. First update the workflow, then make the next change the careful way.',

{what:'Update the workflow\'s triggers',cmd:CP('ci_04.yml',WFP),parts:cpParts('ci_04.yml',WFP,'It replaces the workflow file.'),
 saw:'The on: block grew. It now lists push, limited to main, and pull_request.',test:(l,w)=>wfIs(w,'ci_04.yml')},

 saw:'Committed on main. This is the last change in this guide that goes straight to main.',test:(l,w,r)=>committed(r,WFP)},

 saw:'The prompt shows the new branch name. Nothing has changed on main.',test:(l,w)=>w.git.head==='free-shipping-40'},
{what:'Change the rule',cmd:CP('prices_free40.py','prices.py'),parts:cpParts('prices_free40.py','prices.py','The pricing code with the threshold lowered to 40.'),
 saw:'FREE_SHIPPING_FROM is 40. That is the whole change.',test:(l,w)=>isF(w,'prices.py',PRICES.free40)},
{what:'Commit it on the branch',cmd:'git commit -am "Free shipping from 40 dollars"',parts:P_COMMIT_AM('Free shipping from 40 dollars'),
 saw:'The commit is on free-shipping-40, not on main.',test:(l,w,r)=>committed(r,'prices.py')&&w.git.head==='free-shipping-40'},
{what:'Push the branch',cmd:'git push -u origin free-shipping-40',parts:P_PUSHU('free-shipping-40'),
 saw:'A new branch on GitHub, and no run. The push trigger is limited to main now, and there is no pull request yet.',test:(l,w,r)=>pushed(r,'free-shipping-40')},
{what:'Open a pull request',cmd:'gh pr create --fill',parts:P_PRCREATE,
 saw:'Pull request #1 exists, and opening it was an event: a run started with "pull_request" beside it. The strip at the bottom of the panel shows the pull request and its checks.',test:(l,w,r)=>r.meta.cmd==='pr create'&&!!r.meta.n},
{what:'Watch its checks',cmd:'gh pr checks --watch',parts:P_CHECKSW,
 saw:'CI/unit failed. The check is named workflow/job. Main is untouched and still green: the failure is contained on the branch.',test:(l,w,r)=>r.meta.cmd==='pr checks'&&r.meta.pass===false},
{what:'Read why',cmd:'gh run view --log-failed',parts:P_LOGF,
 saw:'test_shipping[49.99-5] failed: a $49.99 order was charged nothing, and the test still expects $5. The code now follows the new rule and the tests still describe the old one.',test:(l,w,r)=>r.meta.cmd==='run view'&&r.meta.failed},
{what:'Check whether anything stops the merge',cmd:'gh pr view',parts:[['gh pr view','Summarise the pull request for the current branch.']],
 saw:'Checks: failing. Merge: allowed. The red cross is advice. Anyone in a hurry could merge this now. Lesson 5 turns the advice into a rule.',test:(l,w,r)=>r.meta.cmd==='pr view'}
],
notes:`<h2>Who is wrong, the test or the code?</h2>
<p>Neither is broken. The tests are the written-down version of the old decision, and the code implements the new one. CI has done something useful that has nothing to do with bugs: it noticed that a product rule changed in one place and not the other, and it will not go green until someone updates the tests on purpose. As a product owner, that failing check is your cue to confirm the new rule, not a technical error to wave through.</p>
<h2>What exactly gets tested on a pull request</h2>
<p>For a <code>pull_request</code> event GitHub does not test your branch as it stands. It tests the result of merging your branch into the current main. So the check answers the question you care about: "will main still work after this goes in?"</p>
<h2>On the website</h2>
<p>The pull request page has a box near the bottom listing every check with a tick, a cross or a spinner, and a <strong>Details</strong> link on each that opens its log. That box is where most people meet CI.</p>`,
quiz:[
{q:'Why limit the push trigger to main once pull_request is added?',opts:['Pushes to other branches are not allowed','Otherwise every push to a branch with an open pull request starts two runs of the same tests','pull_request cannot be combined with push','To make main faster'],a:1,why:'An unfiltered push trigger fires for the branch push, and pull_request fires for the same commits. Limiting push to main gives one run per pull request update and one per merge.'},
{q:'You push a second commit to a branch that has an open pull request. What happens?',opts:['Nothing until you reopen the pull request','The pull request\'s checks run again against the new commit','Only the changed files are tested','The first run\'s result is reused'],a:1,why:'The pull_request event fires on every push to the branch. The checks shown are always for the newest commit.'},
{q:'A pull request\'s check is red and no rules are configured. Can it be merged?',opts:['No, GitHub blocks it','Yes. A failing check is only information until a rule requires it','Only by an administrator','Only after 24 hours'],a:1,why:'Checks are advisory by default. Requiring them is a separate setting, which the next lesson adds.'}],
reading:[
['Events that trigger workflows',GD+'/reference/workflows-and-actions/events-that-trigger-workflows','Every event, including push and pull_request, with their filters.'],
['gh pr create',CLI+'/gh_pr_create','Opening a pull request from the terminal.'],
['gh pr checks',CLI+'/gh_pr_checks','Listing and watching the checks on a pull request.'],
['About pull requests','https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests','GitHub\'s explanation of what a pull request is and how the page is laid out.']]},

{id:5,title:'Making red block the merge',mins:10,
idea:`
<p>A check that can be ignored will be ignored, on the day it matters most. The last piece is a rule on the main branch: no change gets in unless it came through a pull request, and unless named checks have passed. On GitHub this is called a <strong>ruleset</strong>.</p>
<dl class="terms">
<dt>Ruleset</dt><dd>A set of rules GitHub enforces on one or more branches. The older name for the same idea, which you will still see, is <em>branch protection</em>.</dd>
<dt>Required status check</dt><dd>A check that must be passing on a pull request before it can be merged. You name it, and the name must match the job's name.</dd>
<dt>Require a pull request</dt><dd>A rule that refuses direct pushes to the branch. Every change needs a pull request.</dd>
<dt>Bypass</dt><dd>Permission for certain people to ignore the rules. Useful in an emergency, and a hole if handed out freely.</dd>
<dt>Gate</dt><dd>Informal word for a check that blocks. "CI gates the merge."</dd>
</dl>
<p>Most people set this up by clicking through <strong>Settings → Rules → Rulesets</strong> on the website. Underneath, the settings page calls GitHub's API, and so can you. The lab uses the API with a prepared JSON file, so that the step is a command like every other step and you can see exactly what the rule says.</p>
<p>Once the rule is on, the workflow stops being a suggestion. It becomes the definition of "allowed into main", written in a file that is itself reviewed.</p>`,
widget:'rule',widgetTitle:'The ruleset, line by line',
widgetIntro:'This is the file the lab sends to GitHub. Tap the highlighted lines.',
labIntro:'Pull request #1 is open, its check is red, and nothing prevents a merge.',
tasks:[
{what:'Create the ruleset',cmd:API+' --method POST --input ../steps/require-ci.json',parts:[['gh api','Call GitHub\'s API directly. Anything the website can do has an API call behind it.'],['repos/'+REPO+'/rulesets','The address for this repository\'s rulesets.'],['--method POST','Create something new.'],['--input ../steps/require-ci.json','The body of the request: the ruleset, as JSON.']],
 saw:'GitHub replied with the new ruleset. The strip at the bottom of the panel now shows the rule on main: a pull request is required, and so is the check called unit.',test:(l,w)=>!!w.gh.rules},
{what:'Confirm it is active',cmd:'gh ruleset list',parts:[['gh ruleset list','List the rulesets that apply to this repository.']],
 saw:'Protect main, active, 2 rules, with ID 4471. You will need that ID to change it later.',test:(l,w,r)=>r.meta.cmd==='ruleset list'},
{what:'Try to merge the red pull request',cmd:'gh pr merge --squash',parts:[['gh pr merge','Merge the pull request for the current branch.'],['--squash','Combine its commits into one commit on main.']],
 saw:'Refused: "the base branch policy prohibits the merge". The same pull request that was mergeable a minute ago is now blocked, because the required check is failing.',test:(l,w,r)=>r.meta.cmd==='pr merge'&&r.meta.blocked},
{what:'Update the tests to the new rule',cmd:CP('test_prices_free40.py','test_prices.py'),parts:cpParts('test_prices_free40.py','test_prices.py','The tests rewritten for a $40 threshold.'),
 saw:'One line changed: the boundary rows are now 39.99 and 40. The test file states the new decision.',test:(l,w)=>isF(w,'test_prices.py',TESTP.t40)},
{what:'Run them locally first',cmd:'uv run pytest test_prices.py',parts:[['uv run pytest test_prices.py','The command the unit job runs.']],
 saw:'7 passed. Code and tests agree again.',test:(l,w,r)=>r.meta.cmd==='pytest'&&r.meta.passed===7&&isF(w,'test_prices.py',TESTP.t40)},
{what:'Commit on the branch',cmd:'git commit -am "Update the shipping tests for the 40 dollar rule"',parts:P_COMMIT_AM('Update the shipping tests for the 40 dollar rule'),
 saw:'A second commit on free-shipping-40.',test:(l,w,r)=>committed(r,'test_prices.py')},
{what:'Push it',cmd:'git push',parts:P_PUSH,
 saw:'No -u needed this time. The pull request picked up the new commit and its checks started again.',test:(l,w,r)=>pushed(r,'free-shipping-40')},
{what:'Watch the checks',cmd:'gh pr checks --watch',parts:P_CHECKSW,
 saw:'All checks were successful. The strip at the bottom now shows the pull request as mergeable.',test:(l,w,r)=>r.meta.cmd==='pr checks'&&r.meta.pass===true},
{what:'Merge it',cmd:'gh pr merge --squash --delete-branch',parts:P_MERGE,
 saw:'Merged, and you are back on main with the result. The two branch commits became one commit on main, titled after the pull request.',test:(l,w,r)=>r.meta.cmd==='pr merge'&&r.meta.merged},
{what:'See what the merge triggered',cmd:'gh run list',parts:[['gh run list','Recent runs.']],
 saw:'The newest run has the event push on main: the merge was a push, so main got tested once more. Below it are the pull request\'s runs, red then green.',test:(l,w,r)=>r.meta.cmd==='run list'}
],
notes:`<h2>What a direct push looks like now</h2>
<p>If you commit on main and try to push, GitHub refuses the push itself:</p>
<pre class="file">remote: error: GH013: Repository rule violations found for refs/heads/main.
remote: - Changes must be made through a pull request.
remote: - Required status check "unit" is expected.
 ! [remote rejected] main -> main (push declined due to repository rule violations)</pre>
<p>The commit is still on your machine. Move it to a branch and open a pull request, or drop it with <code>git reset --hard origin/main</code>.</p>
<h2>Choosing what to require</h2>
<ul>
<li>Require checks that are fast and trustworthy. A required check that fails at random teaches everyone to resent the gate.</li>
<li>Requiring a check that never runs blocks every pull request, with the status "Expected: waiting for status to be reported". The name in the rule must match a job name that really runs on pull requests.</li>
<li>The ruleset has a <code>--admin</code> escape hatch for people with bypass rights. Treat using it as an incident worth writing down.</li>
</ul>
<h2>For a team</h2>
<p>Raise <code>required_approving_review_count</code> to 1 and the same ruleset also demands that a person approves each pull request. Machine checks and human review answer different questions, and most teams want both.</p>`,
quiz:[
{q:'What does a required status check change?',opts:['The check runs faster','A pull request cannot be merged until that check passes','The check runs on every branch','Failed checks are retried automatically'],a:1,why:'The workflow already ran. Requiring the check is what gives its result the power to block.'},
{q:'The ruleset requires a check named "tests", and your job is named "unit". What do pull requests show?',opts:['They merge normally','They are blocked, waiting for a check called "tests" that will never report','GitHub renames the job','The rule is ignored'],a:1,why:'The rule matches by exact name. A name that no job reports leaves every pull request waiting forever.'},
{q:'Why is the workflow file itself worth reviewing carefully once checks are required?',opts:['It is hard to read','Because it now defines what is allowed into main: weakening it weakens the gate','GitHub charges per line','It cannot be changed after the rule is on'],a:1,why:'Someone who can change the workflow can change what "passing" means, for example by deleting the test step. Changes to it deserve the same review as changes to code.'}],
reading:[
['About rulesets','https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets','What rulesets can enforce, and how they relate to the older branch protection rules.'],
['gh pr merge',CLI+'/gh_pr_merge','Merge methods, --auto, and deleting the branch afterwards.'],
['gh api',CLI+'/gh_api','Calling any GitHub API endpoint from the terminal.']]},

{id:6,title:'More jobs: lint, unit, browser',mins:14,
idea:`
<p>So far CI runs seven fast tests. The repository also has browser tests, which need a browser installed and the shop running, and it has no check on code style at all. This lesson grows the workflow to three jobs and looks at what that costs.</p>
<dl class="terms">
<dt>Lint</dt><dd>A check that reads the code without running it, looking for mistakes and untidiness: unused imports, undefined names, risky patterns. The linter here is <strong>ruff</strong>. It takes about a second.</dd>
<dt>Parallel jobs</dt><dd>Jobs in the same workflow start at the same time, each on its own machine, unless you say otherwise.</dd>
<dt>needs</dt><dd>A key that makes a job wait for other jobs to succeed first. If one of them fails, the waiting job is skipped.</dd>
<dt>Cache</dt><dd>Files saved at the end of one run and restored at the start of a later one, so that slow downloads happen once. A cache is found by its <em>key</em>.</dd>
<dt>Cache key</dt><dd>A name for a cache, usually built from a hash of the lock file. Same lock file, same key, cache hit. Change a dependency and the key changes, so the stale cache is not used.</dd>
<dt>Service under test</dt><dd>The running application the browser tests talk to. Here the workflow starts the shop with <code>docker compose up -d --wait</code>.</dd>
</dl>
<p>The new workflow has this shape: <code>lint</code> and <code>unit</code> start together and finish in seconds. <code>browser</code> has <code>needs: [lint, unit]</code>, so it only starts once both have passed. The cheap checks act as a filter in front of the expensive one. There is no point spending a minute installing a browser to test code that has a syntax error.</p>
<p>The browser job also uses a cache for the browser download, which is the slowest step by far. The uv packages are cached too, without any extra lines: the <code>setup-uv</code> action does it by default on GitHub's runners.</p>`,
widget:'lanes',widgetTitle:'One job, three jobs, and caching',
widgetIntro:'The same checks arranged three ways. Pick an arrangement and compare when you get your first answer with when everything is finished.',
labIntro:'Main is green and protected. From here on, every change goes through a pull request.',
tasks:[
{what:'Start a branch',cmd:'git switch -c more-checks',parts:P_SWITCH('more-checks'),
 saw:'On a new branch, more-checks.',test:(l,w)=>w.git.head==='more-checks'},
{what:'Add the linter to the project',cmd:'uv add --dev ruff',parts:[['uv add','Install a package and record it in pyproject.toml and uv.lock.'],['--dev','As a development dependency: a tool for working on the code.'],['ruff','A fast Python linter and formatter.']],
 saw:'Two files changed: pyproject.toml lists ruff, and uv.lock records the exact version. CI installs from the lock file, so the linter has to be in it.',test:(l,w)=>/ruff/.test(w.files['shop-tests/pyproject.toml'])},
{what:'Run the linter locally',cmd:'uv run ruff check .',parts:[['uv run ruff check','Lint the code.'],['.','Everything under the current folder.']],
 saw:'All checks passed. As with tests: run it yourself first, then let CI confirm it.',test:(l,w,r)=>r.meta.cmd==='ruff'},
{what:'Replace the workflow with the three-job version',cmd:CP('ci_06.yml',WFP),parts:cpParts('ci_06.yml',WFP,'The workflow with lint, unit and browser jobs.'),
 saw:'The file is much longer. Scroll it in the Files panel: three jobs, and under browser the lines needs, timeout-minutes, a cache step with a key, the browser install and docker compose.',test:(l,w)=>wfIs(w,'ci_06.yml')},
{what:'Commit all three changed files',cmd:'git commit -am "Add lint and browser test jobs"',parts:P_COMMIT_AM('Add lint and browser test jobs'),
 saw:'Three files in one commit: the workflow, pyproject.toml and uv.lock. They belong together, because the workflow would fail without ruff in the lock file.',test:(l,w,r)=>committed(r,WFP)&&r.meta.files.includes('uv.lock')},
{what:'Push the branch',cmd:'git push -u origin more-checks',parts:P_PUSHU('more-checks'),
 saw:'The branch is on GitHub.',test:(l,w,r)=>pushed(r,'more-checks')},
{what:'Open the pull request',cmd:'gh pr create --fill',parts:P_PRCREATE,
 saw:'Pull request #2, and a run with three jobs. In the panel, lint and unit start together while browser waits.',test:(l,w,r)=>r.meta.cmd==='pr create'&&!!r.meta.n},
{what:'Watch the three checks',cmd:'gh pr checks --watch',parts:P_CHECKSW,
 saw:'lint and unit finished in under twenty seconds. browser then took about a minute and a half, most of it downloading Chromium. Tap the browser job in the panel and open its actions/cache step: "Cache not found". This was the first run with that key.',test:(l,w,r)=>r.meta.cmd==='pr checks'&&r.meta.pass===true},
{what:'Require all three checks',cmd:API+'/4471 --method PUT --input ../steps/require-ci-all.json',parts:[['gh api … /rulesets/4471','The address of the existing ruleset, by its ID.'],['--method PUT','Replace it with the version in the file.'],['--input ../steps/require-ci-all.json','The same ruleset, now naming lint, unit and browser.']],
 saw:'The rule on main lists three checks. It was safe to do this now because all three have just reported on this pull request.',test:(l,w)=>!!w.gh.rules&&w.gh.rules.checks.includes('browser')&&w.gh.rules.checks.includes('lint')},
{what:'Merge',cmd:'gh pr merge --squash --delete-branch',parts:P_MERGE,
 saw:'Merged. A run started on main.',test:(l,w,r)=>r.meta.cmd==='pr merge'&&r.meta.merged},
{what:'Watch the run on main',cmd:'gh run watch',parts:P_WATCH,
 saw:'The browser download happened again. A cache saved by a pull request can only be used by that pull request. Caches saved on main can be used by every branch, so this run on main is the one that makes later pull requests fast.',test:(l,w,r)=>r.meta.cmd==='run watch'&&r.meta.conclusion==='success'},
{what:'List the caches',cmd:'gh cache list',parts:[['gh cache list','List the caches stored for this repository, with their keys and sizes.']],
 saw:'A uv cache and a Playwright cache saved from refs/heads/main, which every future pull request can restore. The next lesson\'s pull request will show the difference.',test:(l,w,r)=>r.meta.cmd==='cache list'}
],
notes:`<h2>The trade you just made</h2>
<p>Three jobs use more machine time in total than one, because each job starts from an empty machine and repeats the checkout and install. What you get for it is two answers in seconds, each with its own name on the pull request, and an expensive job that does not start when the cheap ones fail. For most projects that is the right trade. Do not split further than is useful: ten tiny jobs spend most of their time setting up.</p>
<h2>Caching rules of thumb</h2>
<ul>
<li>Cache downloads, never results. A cache makes a step faster; it must not change what the step produces.</li>
<li>Build the key from the lock file, as here with <code>hashFiles('uv.lock')</code>. When dependencies change, the key changes and a fresh cache is built.</li>
<li>A pull request can read caches from its own branch and from main, and nothing else. Keep a workflow running on pushes to main so there is always a current cache to share.</li>
<li>Never put secrets in a cached folder. Anyone who can open a pull request can read caches.</li>
</ul>
<h2>Starting the application</h2>
<p><code>docker compose up -d --wait</code> starts the shop in the background and returns once its health check passes. The <code>--wait</code> matters: without it the tests would start while the shop is still booting and fail with "connection refused". How you start your own application will differ, and the principle is the same: start it, wait until it is ready, then test.</p>`,
quiz:[
{q:'Two jobs have no needs line. When does the second one start?',opts:['After the first finishes','At the same time as the first, on a separate machine','Only if the first fails','In alphabetical order'],a:1,why:'Jobs are parallel by default. needs is what creates an order.'},
{q:'browser has needs: [lint, unit] and lint fails. What happens to browser?',opts:['It runs anyway','It is skipped','It runs but its result is ignored','It waits for a re-run'],a:1,why:'A job whose needs did not all succeed is skipped, which saves the time and cost of the expensive job.'},
{q:'You add a package, so uv.lock changes. What happens to a cache keyed on the hash of uv.lock?',opts:['It is restored and the new package is missing','The key no longer matches, so there is a cache miss and a new cache is saved','The run fails','The old cache is edited in place'],a:1,why:'A different lock file gives a different hash and so a different key. That is the point of putting the hash in the key.'}],
reading:[
['Dependency caching reference',GD+'/reference/workflows-and-actions/dependency-caching','How keys are matched, which branches can read which caches, and size limits.'],
['Ruff','https://docs.astral.sh/ruff/','The linter: what it checks and how to configure it.'],
['Playwright for Python: Continuous integration','https://playwright.dev/python/docs/ci','Running Playwright tests on CI services, including the system dependencies browsers need.'],
['actions/cache','https://github.com/actions/cache','The cache action\'s own documentation and examples.']]},

{id:7,title:'Green on your laptop, red in CI',mins:10,
idea:`
<p>Sooner or later a test passes on your machine and fails in CI. The instinct is to blame CI. The useful question is the opposite one: <em>what does my machine have that the repository does not?</em> CI is the honest environment. Your laptop is the one with history.</p>
<p>The differences that cause this fall into a short list:</p>
<dl class="terms">
<dt>Files that were never committed</dt><dd>CI starts from a fresh clone. A file you forgot to <code>git add</code> exists for you and not for it.</dd>
<dt>Tools and versions</dt><dd>You installed something by hand months ago. CI has only what the workflow installs and what the lock file pins.</dd>
<dt>Speed</dt><dd>CI runners are small shared machines, often several times slower than a laptop, and uneven from run to run. Anything that depends on timing behaves differently.</dd>
<dt>Data</dt><dd>Your local database has months of test orders in it. CI's is created empty every time.</dd>
<dt>Configuration and secrets</dt><dd>You have a <code>.env</code> file and saved logins. CI has only what the workflow gives it.</dd>
<dt>Operating system</dt><dd>CI is Linux in the UTC time zone. File names are case-sensitive there. Dates, sorting and paths can differ from macOS or Windows.</dd>
</dl>
<p>In this lesson a new browser test passes locally every time and fails in CI. You will get as far as the log can take you, and find that for a browser test the log alone is not enough. Lesson 8 fetches better evidence.</p>`,
widget:'differ',widgetTitle:'Six reasons for "works on my machine"',
widgetIntro:'Each is a way your laptop differs from a CI runner, with the usual symptom. Press Next, or tap a box.',
labIntro:'Main is green, with three required checks. A new test for the shop\'s search box is ready to add.',
tasks:[
{what:'Start a branch',cmd:'git switch -c search-test',parts:P_SWITCH('search-test'),
 saw:'On search-test.',test:(l,w)=>w.git.head==='search-test'},
{what:'Add the new test',cmd:CP('test_search_flaky.py','test_search.py'),parts:cpParts('test_search_flaky.py','test_search.py','A new test file. The name starts with test_, so pytest will find it.'),
 saw:'test_search.py: type "tea" into the search box, wait 300 milliseconds for the list to update, then count the products. Remember that wait.',test:(l,w)=>isF(w,'test_search.py',SEARCH.flaky)},
{what:'Run it locally',cmd:'uv run pytest test_search.py',parts:[['uv run pytest test_search.py','Run only the new file.']],
 saw:'1 passed. Run it again if you like: it passes every time here.',test:(l,w,r)=>r.meta.cmd==='pytest'&&r.meta.passed===1&&r.meta.paths.includes('test_search.py')},
{what:'Stage the new file',cmd:'git add test_search.py',parts:[['git add test_search.py','A new file is not tracked yet, so commit -a would miss it. Forgetting this step is itself a classic cause of "green here, red in CI".']],
 saw:'Staged.',test:(l,w)=>w.git.staged.has('test_search.py')||w.git.commits[w.git.branches[w.git.head]].tree['test_search.py']!==undefined},
{what:'Commit',cmd:'git commit -m "Add a search test"',parts:[['git commit -m','Commit what is staged, with this message.']],
 saw:'Committed on the branch.',test:(l,w,r)=>committed(r,'test_search.py')},
{what:'Push',cmd:'git push -u origin search-test',parts:P_PUSHU('search-test'),
 saw:'The branch is on GitHub.',test:(l,w,r)=>pushed(r,'search-test')},
{what:'Open a pull request',cmd:'gh pr create --fill',parts:P_PRCREATE,
 saw:'Pull request #3, and its run has started.',test:(l,w,r)=>r.meta.cmd==='pr create'&&!!r.meta.n},
{what:'Watch the checks',cmd:'gh pr checks --watch',parts:P_CHECKSW,
 saw:'lint and unit passed, and browser failed. Notice how much quicker the browser job was than in lesson 6: open its actions/cache step in the panel and it says "Cache hit". The cache saved on main did its job.',test:(l,w,r)=>r.meta.cmd==='pr checks'&&r.meta.pass===false},
{what:'Read the failure',cmd:'gh run view --log-failed',parts:P_LOGF,
 saw:'assert 4 == 2. On the runner the page still listed all four products when the test counted them. The log tells you what was wrong. It cannot tell you why, because you cannot see the page.',test:(l,w,r)=>r.meta.cmd==='run view'&&r.meta.failed},
{what:'Run it locally once more',cmd:'uv run pytest test_search.py',parts:[['uv run pytest test_search.py','The same test, on your machine.']],
 saw:'Passed. Same code, same test, two answers. Something differs between the machines, and the failing one has been deleted. That is the problem lesson 8 solves.',test:(l,w,r)=>r.meta.cmd==='pytest'&&r.meta.passed===1&&r.meta.paths.includes('test_search.py')&&w.gh.prs.some(p=>p.head==='search-test')}
],
notes:`<h2>A checklist for "it passes for me"</h2>
<ol>
<li><strong>Is everything committed?</strong> <code>git status</code> should be clean. An untracked file is the most common cause and the quickest to rule out.</li>
<li><strong>Am I running the same command?</strong> Copy the <code>run</code> line from the workflow. Running one file locally and the whole suite in CI are different experiments.</li>
<li><strong>Is my environment the locked one?</strong> <code>uv sync</code> makes your <code>.venv</code> match <code>uv.lock</code> exactly, removing anything extra you installed.</li>
<li><strong>Does it depend on time, speed or order?</strong> Fixed waits, today's date, and tests that rely on another test having run first all behave differently on a slower, cleaner machine.</li>
<li><strong>Does it depend on data or settings I have and CI lacks?</strong> Seed data, <code>.env</code> files, saved logins.</li>
</ol>
<h2>What not to do</h2>
<p>Do not mark the test as skipped in CI, and do not remove the browser job from the required checks. Both make the tick green by making it mean less. A test that fails only in CI is very often telling you about something your users' machines will hit too.</p>`,
quiz:[
{q:'A test fails in CI with "No such file or directory: fixtures/orders.json". It passes locally. Most likely cause?',opts:['CI is unreliable','The file exists on your machine and was never committed','Linux cannot read JSON','The test is flaky'],a:1,why:'CI clones the repository. A file that only exists in your working folder is not there. git status would show it as untracked.'},
{q:'Why are tests that wait a fixed time especially likely to fail in CI?',opts:['CI ignores sleep commands','Runners are slower and less even than a laptop, so a wait that is long enough for you may be too short there','CI runs tests in reverse order','Fixed waits are not allowed'],a:1,why:'A fixed wait is a guess about speed. The guess was made on a fast machine.'},
{q:'The browser check is required and fails only in CI. Which response keeps the gate meaningful?',opts:['Remove browser from the required checks','Skip the test when running in CI','Find out what differs between the machines and fix the test or the code','Merge with --admin'],a:2,why:'The other three all make the tick green without making the software work.'}],
reading:[
['Playwright: Auto-waiting','https://playwright.dev/python/docs/actionability','Why Playwright\'s own actions and assertions wait for the page, and why a fixed sleep is the wrong tool.'],
['GitHub-hosted runners',GD+'/concepts/runners/github-hosted-runners','What the machines are: operating systems, sizes and preinstalled software.'],
['pytest: Flaky tests','https://docs.pytest.org/en/stable/explanation/flaky.html','pytest\'s own page on tests that pass and fail without a code change, and common causes.']]},

{id:8,title:'Evidence: artifacts, traces and re-runs',mins:14,
idea:`
<p>When a job ends, its machine is destroyed, and everything on it goes too: screenshots, traces, reports. The log survives because GitHub copies it off as the job runs. Anything else you want to keep, the workflow has to save on purpose. A saved file is called an <strong>artifact</strong>.</p>
<dl class="terms">
<dt>Artifact</dt><dd>A file or folder uploaded from a runner and attached to the run. You can download it from the run's page or with <code>gh run download</code>. Kept for 90 days unless you say otherwise.</dd>
<dt>Trace</dt><dd>Playwright's recording of a test: every action, with a snapshot of the page before and after. The Playwright guide opened one locally. Here it comes from a machine that no longer exists.</dd>
<dt>if: on a step</dt><dd>A condition for running the step. By default a step only runs if every earlier step succeeded. <code>if: \${{ !cancelled() }}</code> means "run even after a failure".</dd>
<dt>Re-run</dt><dd>Running a finished run again without a new commit. Each try is a numbered <em>attempt</em>.</dd>
<dt>Flaky test</dt><dd>A test that sometimes passes and sometimes fails with no change to the code. A re-run turning red into green is the tell-tale sign.</dd>
</dl>
<p>There is a difference between a cache and an artifact, and they are easy to mix up. A <strong>cache</strong> is an input: files a run reuses to go faster, which you never look at. An <strong>artifact</strong> is an output: files a run produces for a person to open.</p>
<p>This lesson collects the evidence for last lesson's failure, reads it, and then uses a re-run to learn something uncomfortable about the test.</p>`,

notes:`<h2>When is a re-run the right call?</h2>
<p>Re-run when the failure has nothing to do with your change: a download timed out, GitHub had an outage, the runner lost its network. The sign is that the failing step is setup, not tests, and the error mentions a network or a service.</p>
<p>When a <em>test</em> goes green on a re-run, you have learned that the test is flaky, and the re-run fixed nothing. Each flaky test fails only now and then, but twenty of them make most runs red, and people stop believing the cross. Fix it or delete it. For browser tests the fix is nearly always the one you just made: replace a fixed wait with an assertion that waits.</p>
<h2>What else to upload</h2>
<ul>
<li>Test reports in a format GitHub or another tool can display, such as JUnit XML.</li>
<li>Coverage reports.</li>
<li>Built files, when a later job or a person needs them.</li>
</ul>
<p>Artifacts count against storage, so upload on failure where that is enough, and set <code>retention-days</code> to something short for bulky ones. Never upload a folder that might contain secrets: anyone who can read the repository can download its artifacts.</p>`,

{q:'What is the difference between a cache and an artifact?',opts:['They are the same','A cache is an input reused to save time; an artifact is an output kept for a person to look at','Artifacts are faster','Caches are kept longer'],a:1,why:'Caches speed runs up and are never read by a person. Artifacts are the results and evidence of a run.'},
{q:'A test fails, you re-run without changing anything, and it passes. What have you learned?',opts:['The bug is fixed','The test or the code has a timing or order problem that will come back','CI is broken','Nothing'],a:1,why:'An outcome that changes with no change in the code means something non-deterministic is involved. It will fail again, for someone else, at a worse time.'}],

{id:9,title:'Secrets and permissions',mins:12,
idea:`
<p>Look at <code>test_shop.py</code> in the Files panel. The sign-in test types the password <code>teatime</code>, and that password is sitting in a file in the repository. For a test account on a demo shop it hardly matters. As a habit it is how real passwords and API keys end up public. CI needs a way to use a value without the value being written down anywhere people can read.</p>
<dl class="terms">
<dt>Secret</dt><dd>A named value stored encrypted in the repository's settings. You can set it and replace it. Nobody can read it back, including you.</dd>
<dt>secrets context</dt><dd>How a workflow refers to a secret: <code>\${{ secrets.NAME }}</code>. GitHub substitutes the value when the job starts.</dd>
<dt>Environment variable</dt><dd>A named value handed to a program by whatever starts it. Passing a secret to a test as an environment variable keeps it out of the command line and out of the code.</dd>
<dt>Masking</dt><dd>GitHub replaces any secret's value with <code>***</code> wherever it appears in a log.</dd>
<dt>Variable</dt><dd>Like a secret, for settings that are not sensitive, such as a URL. Readable in settings and shown in logs. Referred to as <code>\${{ vars.NAME }}</code>.</dd>
<dt>GITHUB_TOKEN and permissions</dt><dd>Every run is given a temporary token for talking to GitHub. The <code>permissions:</code> key limits what it can do. Give it the least that works.</dd>
</dl>
<p>Two safety facts explain how the system is designed. Workflows triggered by pull requests <em>from forks</em> get no secrets, because otherwise a stranger could open a pull request whose workflow prints them. And a secret that does not exist is not an error: it is an empty string. The lab starts by tripping over that second fact.</p>`,

notes:`<h2>The password is still in the history</h2>
<p>Removing a secret from a file does not remove it from earlier commits. Anyone with the repository can still find <code>teatime</code> in the history. The only real fix for a leaked secret is to <strong>change it</strong> at the service it belongs to and store the new value as a secret. Treat any credential that was ever committed as public.</p>
<h2>Running the test locally now</h2>
<p>Your machine needs the variable too. For one terminal session: <code>export SHOP_TEST_PASSWORD=teatime</code>. For everyday use, keep it in a <code>.env</code> file that is listed in <code>.gitignore</code>, and commit a <code>.env.example</code> with the names and no values so the next person knows what to set.</p>
<h2>Supply chain: the actions you use</h2>
<p>A <code>uses:</code> line runs somebody else's code on a machine that holds your secrets. Three habits limit the risk:</p>
<ul>
<li>Use actions from publishers you would trust with the secret, and as few as you can.</li>
<li>Pin versions. A tag like <code>@v6</code> can be moved by its owner to different code. A full release tag is steadier, and a commit hash cannot change at all. This is why <code>setup-uv</code> stopped offering moving tags.</li>
<li>Keep <code>permissions:</code> minimal, so that a compromised step holds a token that can do little.</li>
</ul>`,
