{id:1,sys:'reactor',lab:'total',title:'What a test case is',mins:10,
idea:`
<p>Before anyone writes test code, someone has to decide <em>what</em> to check. That decision, written down, is a test case. The Playwright guide teaches the tools that run checks; this guide teaches the part that comes first and that the tools cannot do for you: working out which checks are worth running, and writing each one so that it can only be read one way.</p>
<p>Picture the hangar of the KF-07 Kestrel Mk II. Before every sortie the crew works through a preflight checklist (a <strong>test suite</strong>). Each line on it is one check (a <strong>test case</strong>): put the suit in a known state, do one thing, and compare what happens with what the design says should happen. A line that only says "check the reactor" is useless, because two techs would do two different things and both would tick the box.</p>
<p>Every test case, on paper or in code, has the same three parts:</p>
<dl class="terms">
<dt>Given (arrange)</dt><dd>The starting state, also called the <strong>preconditions</strong>. Which loads are switched on, which page is open, who is signed in. Everything the result depends on.</dd>
<dt>When (act)</dt><dd>The one action being checked. A calculation, a click, a form being sent.</dd>
<dt>Then (assert)</dt><dd>The <strong>expected result</strong>: something you can observe and compare, decided <em>before</em> you run the case. This is the part that makes it a test.</dd>
<dt>System under test</dt><dd>The real thing being checked. Here: the Kestrel's power rules and, later, its web console.</dd>
<dt>Pass and fail</dt><dd>A case passes when what happened matches the expected result, and fails when it does not. A fail says the case and the system <em>disagree</em>. It does not say which of the two is wrong.</dd>
<dt>Test oracle</dt><dd>Where the expected result comes from. It must be something other than the system itself: a written rule, a design, a calculation by hand. If you run the system and copy down whatever it shows, the case can never find a bug.</dd>
</dl>
<p>You will see the three parts under two sets of names. <strong>Given / When / Then</strong> is how cases are written in plain language. <strong>Arrange / Act / Assert</strong> is the same idea as it appears in test code, which is how the Playwright guide phrases it. They are one structure.</p>
<p>The first rule you will write cases for is the reactor's power budget, rule R1. It is shown at the top of the bench throughout the lab, because a case is always written against a rule (a <strong>requirement</strong>), never against a feeling.</p>`,
widget:'anatomy',widgetTitle:'One case, line by line',widgetIntro:'This is a complete written test case. Tap a line to see what it is for.',
labIntro:'The bench has three parts. At the top is the rule and the Kestrel\'s schematic. In the middle is your case sheet and the builds your cases run against. At the bottom is the case form and a log. Tap a step\'s case to load it into the form, then press Run case. Besides the real Kestrel, the hangar keeps a training rig: a copy of the control software with one fault planted in it (in testing, a <b>mutant</b>). Your cases run against both. A good set of cases passes on the real Kestrel and fails on the faulty copy.',
tasks:[
{what:'Write your first case',load:LD({loads:'6.5, 12.0',exp:'18.5'},'Given loads 6.5, 12.0 · Then 18.5 kW'),
 parts:[['Given: 6.5, 12.0','Two loads switched on: the sensors (6.5 kW) and the reactor\'s own systems (12 kW).'],['When','Fixed in this lab: the total draw is worked out.'],['Then: 18.5','Worked out by hand from rule R1, before running anything. That is the oracle.']],
 saw:'PASS on the Kestrel as specified: it gave 18.5 kW, which is what the case expected. The planted fault was not caught, though. Keep that in mind.',test:s=>s.cases.some((c,i)=>s.res[i].status==='pass')},
{what:'Get the expected result wrong on purpose',load:LD({loads:'6.5, 12.0',exp:'19'},'Given loads 6.5, 12.0 · Then 19 kW'),
 parts:[['Then: 19','A slip in the arithmetic. It happens constantly in real case writing.']],
 saw:'FAIL, and the Kestrel was right. The case was wrong. Whenever a case fails, the first question is which side is mistaken: the system, the case, or the rule both were written from.',test:s=>s.res.some(r=>r.status==='fail')},
{what:'Remove the wrong case',act:'In the case sheet on the bench, press × beside the failing case.',
 saw:'A sheet should never keep a case you know is wrong. People learn to ignore a checklist that always has a red line on it.',test:s=>s.cases.length>0&&!s.res.some(r=>r.status==='fail')},
{what:'Check the "nothing switched on" sentence of the rule',load:LD({loads:'',exp:'0'},'Given no loads · Then 0 kW'),
 parts:[['Given: empty','No loads at all. The rule has a sentence about this, so it deserves a case.'],['Then: 0','Straight from the rule\'s second sentence.']],
 saw:'PASS. Two cases, both green, and the fault is still not caught: each of your cases gives the same answer on the faulty copy as on the real Kestrel.',test:s=>s.cases.some((c,i)=>c.in.loads.length===0&&s.res[i].status==='pass')},
{what:'Catch the planted fault',load:LD({loads:'6.5, 12.0, 14.0',exp:'32.5'},'Given loads 6.5, 12.0, 14.0 · Then 32.5 kW'),
 parts:[['Given: three loads','Rule R1 says "every load". Neither earlier case had more than two.'],['Then: 32.5','6.5 + 12 + 14.']],
 saw:'CAUGHT. The faulty copy added only the first two loads and answered 18.5 kW. Your first two cases could not see that, because they never switched on a third load. A passing case proves only what it actually exercised.',test:s=>!!s.caught.A}
],
notes:`<h2>On a real project</h2>
<ul>
<li>Written cases live in many places: a spreadsheet, a test management tool, a Markdown file in the repository, the acceptance criteria of a ticket. The format matters less than the three parts being there.</li>
<li>Most cases also carry an <strong>ID</strong> (so people can refer to them), a short <strong>title</strong>, and a <strong>priority</strong>. Lesson 7 covers priority and lesson 8 puts it all on one sheet.</li>
<li>There is no training rig with planted faults on a real project. It is here so that you can see what your cases can and cannot detect. The technique exists in real tooling, where it is called <strong>mutation testing</strong>, but most teams never use it. They rely on the habits the next lessons teach.</li>
</ul>`,
quiz:[
{q:'What turns a list of steps into a test case?',opts:['It is stored in a test tool','It has an expected result decided before the case is run','It has been run at least once','It is written by a tester'],a:1,why:'Without an expected result there is nothing to compare against, so the case cannot fail, and a case that cannot fail checks nothing.'},
{q:'A case fails. What do you know for certain?',opts:['The system has a bug','The case is badly written','The case and the system disagree','The requirement is wrong'],a:2,why:'A fail is a disagreement. The system, the case, or the rule they were both written from may be the one at fault, and finding out which is the next job.'},
{q:'Where should the expected result of a case come from?',opts:['From running the system and writing down what it shows','From the requirement or design, worked out independently','From the developer who wrote the code','From the previous test run'],a:1,why:'If the expectation is copied from the system\'s own output, the case can only confirm that the system does what it does, bugs included.'}],
reading:[
['Given When Then, by Martin Fowler',FOWLER+'/bliki/GivenWhenThen.html','A short explanation of the three-part structure and how it relates to arrange, act, assert.'],
['Test oracle',WIKI+'Test_oracle','Where expected results can come from, and why the system itself is not a valid source.'],
['ISTQB glossary','https://glossary.istqb.org/','The standard definitions of test case, precondition, expected result and the other terms in this guide.']]},

{id:2,sys:'propulsion',lab:'throttle',title:'From a requirement to cases',mins:12,
idea:`
<p>Cases are not invented. They are <em>derived</em> from a requirement, and the method is nearly mechanical: read the rule slowly, and treat every claim it makes as a debt that at least one case must pay off.</p>
<p>Take the Kestrel's propulsion rule, R2:</p>
<p class="sysnote">Throttling back takes <b>a percentage</b> off the total draw. Throttle back is <b>a whole number from 0 to 100</b>. At <b>0 nothing is taken off</b>; at <b>100 the draw is 0 kW</b>.</p>
<p>Four claims are hiding in three sentences: it is a percentage (not an amount), there is a range, and the two ends of the range behave in a stated way. Each one is a <strong>test condition</strong>: something that could be true or false of the real system.</p>
<dl class="terms">
<dt>Requirement</dt><dd>A statement of what the system must do. It might be a rule in a spec, an acceptance criterion on a ticket, or a sentence in a design. If you cannot point to one, you have no oracle.</dd>
<dt>Test condition</dt><dd>One checkable claim taken from a requirement. "Throttle back is a percentage" is a condition. "The throttle works" is not.</dd>
<dt>Coverage</dt><dd>How many of the conditions have at least one case. Coverage is counted against the requirement, not against the code.</dd>
<dt>Test data</dt><dd>The particular values a case uses. Choosing them well is most of the skill, and it is what this lesson's lab is about.</dd>
</dl>
<p>The trap is in the test data. For any condition there are many values you could use, and some of them are <strong>blind</strong>: a wrong system gives the right answer for them by coincidence. The classic blind values are 0, 1, 100, and anything that makes two different calculations come out the same. A case built on blind data passes on the real Kestrel and passes on a broken one, so it tells you nothing.</p>
<p>So when you pick values, ask one question: <strong>if the system had got this rule wrong in the most likely way, would this case notice?</strong> The lab plants four likely mistakes and lets you find out.</p>`,
labIntro:'Rule R2 is on the bench. The training rig now holds four faulty copies. Each fault\'s description stays hidden until one of your cases catches it. Work through the steps and watch which case catches what.',
tasks:[
{what:'Start with the easiest value',load:LD({loads:'20, 30',thr:'0',exp:'50'},'Given loads 20, 30 · When 0% · Then 50 kW'),
 parts:[['When: 0%','The "at 0 nothing is taken off" claim.'],['Then: 50','20 + 30, nothing removed.']],
 saw:'PASS, and it catches one fault of four. Taking 0 off is the same as taking 0% off, and the same as ignoring the throttle. Zero is a blind value for three of the four mistakes.',test:s=>s.cases.some((c,i)=>c.in.thr===0&&s.res[i].status==='pass')},
{what:'Try a tidy number',load:LD({loads:'60, 40',thr:'10',exp:'90'},'Given loads 60, 40 · When 10% · Then 90 kW'),
 parts:[['Given: 60, 40','A total of exactly 100 kW, which makes the arithmetic easy.'],['Then: 90','10% of 100 is 10, and 100 minus 10 is 90.']],
 saw:'PASS, and one more fault caught, but the likeliest mistake of all is still loose. With a total of 100, "take off 10%" and "take off 10 kW" both give 90. The easy arithmetic is what made the data blind.',test:s=>s.cases.some((c,i)=>sum(c.in.loads)===100&&c.in.thr===10&&s.res[i].status==='pass')},
{what:'Choose data that separates the two readings',load:LD({loads:'20, 30',thr:'10',exp:'45'},'Given loads 20, 30 · When 10% · Then 45 kW'),
 parts:[['Given: 20, 30','A total of 50 kW. Now 10% is 5 kW, which is not 10.'],['Then: 45','50 minus 10% of 50. A system that takes off 10 kW would say 40.']],
 saw:'CAUGHT: the copy that subtracts the number as kilowatts answered 40 kW. This is the same case, with the same numbers, that the Playwright guide automates in its lesson 2.',test:s=>!!s.caught.A},
{what:'Check the far end of the range',load:LD({loads:'20, 30',thr:'100',exp:'0'},'Given loads 20, 30 · When 100% · Then 0 kW'),
 parts:[['When: 100%','The last claim in the rule, and the largest value allowed.'],['Then: 0','Stated outright in the rule.']],
 saw:'CAUGHT: one copy stopped throttling at 90% and still drew 5 kW. Nothing in the middle of the range could have found that. The ends of a range get their own cases, which is the subject of the next lesson.',test:s=>!!s.caught.D}
],
notes:`<h2>On a real project</h2>
<ul>
<li>Requirements are rarely this tidy. Deriving cases is often how the gaps are found: R2 does not say what happens at 101, or at 12.5. Asking that question <em>before</em> the code is written is one of the most useful things a designer or product owner can do with a draft spec.</li>
<li>A simple <strong>traceability</strong> habit helps: next to each case, note which rule it checks (R2), and next to each rule, which cases check it. A rule with no cases is a gap. A case with no rule is either a missing requirement or wasted effort.</li>
<li>When a coding agent writes tests for you, it tends to pick tidy values like 0, 1, 10 and 100. Reviewing its test data for blind values is a fast, high-value check.</li>
</ul>`,
quiz:[
{q:'What is a test condition?',opts:['The state the system is in before the test','One checkable claim taken from a requirement','A reason a test might be skipped','The environment the tests run in'],a:1,why:'Conditions are the individual claims inside a requirement. Listing them is the step between reading a rule and writing cases.'},
{q:'Why was "loads 60, 40 at 10% gives 90" a weak case for telling a percentage from an amount?',opts:['The numbers were too large','It used two loads instead of one','With a total of 100, taking off 10% and taking off 10 kW give the same answer','It did not have an expected result'],a:2,why:'The data was blind to that mistake: the right calculation and the wrong one agreed. Good test data makes likely mistakes give a different answer.'},
{q:'A rule has four claims and your sheet has six cases, all about the first claim. What is the coverage problem?',opts:['Too many cases','Three conditions have no case at all','The cases should be in code','Nothing, six is more than four'],a:1,why:'Coverage is counted per condition. Six cases on one claim leave the other three unchecked.'}],
reading:[
['Test Behavior, Not Implementation (Google Testing Blog)','https://testing.googleblog.com/2013/08/testing-on-toilet-test-behavior-not.html','A one-page argument for writing tests against what the system should do, not how it does it.'],
['Mutation testing',WIKI+'Mutation_testing','The real technique behind this guide\'s training rig: planting small faults to see whether the tests notice.'],
['Requirements traceability',WIKI+'Requirements_traceability','How rules and cases are linked in both directions.']]},

{id:3,sys:'limbs',lab:'starter',title:'Classes and boundaries',mins:12,
idea:`
<p>The starter cell rule takes any total draw from 0 upwards. You cannot test every number, and you do not need to. Two techniques, used together, tell you which handful of values does the work of all of them. They are the most useful pair of ideas in test design.</p>
<p class="sysnote"><b>Rule R3.</b> A total draw of 50 kW or more keeps the reactor self-sustaining, so the starter cell gives 0 kW. Less than 50 kW needs 5 kW from the starter cell. The limbs cannot move until one or the other is true.</p>
<h3>Equivalence classes</h3>
<p>The rule sorts every possible input into groups that are all treated the same way. Here there are two: totals under 50 (starter cell helps) and totals of 50 or more (it does not). Each group is an <strong>equivalence class</strong>. If the system handles 10 kW correctly it almost certainly handles 11, 20 and 37 correctly too, because the same line of the rule deals with all of them. So you need <em>one</em> representative from each class, not ten.</p>
<h3>Boundary values</h3>
<p>Mistakes cluster where one class ends and the next begins. "50 or more" becomes "more than 50" with one mistyped character. A threshold is copied as 49 or 60. So for every boundary, test <strong>the value on it and the nearest value on each side</strong>. For R3 that is 50 itself and a value just below it.</p>
<svg viewBox="0 0 640 132" role="img" aria-label="A number line of total draw from 0 to 120 kW, split at 50. Below 50 the starter cell gives 5 kW, from 50 up it gives 0. Four test values are marked: 10, 49.99, 50 and 120." style="width:100%;height:auto;margin:6px 0 12px">
<rect x="20" y="46" width="250" height="26" rx="3" style="fill:var(--warn-soft);stroke:var(--warn)"/>
<rect x="270" y="46" width="350" height="26" rx="3" style="fill:var(--good-soft);stroke:var(--good)"/>
<text x="145" y="64" text-anchor="middle" style="fill:var(--warn);font:500 12px var(--mono)">under 50 → 5 kW</text>
<text x="445" y="64" text-anchor="middle" style="fill:var(--good);font:500 12px var(--mono)">50 or more → 0 kW</text>
<line x1="270" y1="30" x2="270" y2="88" style="stroke:var(--ink);stroke-width:2"/>
<text x="270" y="22" text-anchor="middle" style="fill:var(--ink);font:700 12px var(--mono)">boundary: 50</text>
<g style="fill:var(--accent)"><circle cx="70" cy="96" r="5"/><circle cx="262" cy="96" r="5"/><circle cx="278" cy="96" r="5"/><circle cx="560" cy="96" r="5"/></g>
<g style="fill:var(--muted);font:400 11px var(--mono)" text-anchor="middle"><text x="70" y="118">10</text><text x="240" y="118">49.99</text><text x="292" y="118">50</text><text x="560" y="118">120</text></g>
</svg>
<dl class="terms">
<dt>Equivalence class (partition)</dt><dd>A set of inputs the rule treats identically. One case per class.</dd>
<dt>Boundary value</dt><dd>The value where one class meets the next, and its nearest neighbours. One case each.</dd>
<dt>Redundant case</dt><dd>A case that can only fail when some other case already fails. It costs time on every run and finds nothing new.</dd>
</dl>`,
labIntro:'Five faulty copies this time, each a mistake a developer could plausibly make with rule R3. The sheet now marks any case that catches nothing new.',
tasks:[
{what:'One representative of the low class',load:LD({total:'10',exp:'5'},'Given total 10 kW · Then starter 5 kW'),
 parts:[['Given: 10','Comfortably under 50. Any value from 0 to about 45 would do the same job.'],['Then: 5 kW','Under 50, so the starter cell helps.']],
 saw:'PASS, and one fault caught: the copy that never uses the starter cell.',test:s=>!!s.caught.C},
{what:'One representative of the high class',load:LD({total:'120',exp:'0'},'Given total 120 kW · Then starter 0 kW'),
 parts:[['Given: 120','Comfortably over 50.'],['Then: 0 kW','50 or more, so the reactor sustains itself.']],
 saw:'PASS, and a second fault caught: the copy that always uses the starter cell. Two classes, two cases.',test:s=>!!s.caught.D},
{what:'Add another value from the same class',load:LD({total:'200',exp:'0'},'Given total 200 kW · Then starter 0 kW'),
 parts:[['Given: 200','The same class as 120. Does a second representative help?']],
 saw:'PASS, marked "catches nothing new". It is in the same class as 120, so anything it could detect, 120 already detects. This is what a redundant case looks like. In a real suite it would be deleted.',test:s=>s.res.some(r=>r.redundant)},
{what:'Test the value on the boundary',load:LD({total:'50',exp:'0'},'Given total 50 kW · Then starter 0 kW'),
 parts:[['Given: 50','Exactly on the boundary. The rule says "50 or more", so 50 belongs to the high class.'],['Then: 0 kW','Read the rule\'s wording carefully here. This is the value people argue about.']],
 saw:'Two faults CAUGHT with one case: "more than 50" in place of "50 or more", and a threshold of 60. Neither 10 nor 120 could see either of them.',test:s=>!!s.caught.A&&!!s.caught.B},
{what:'Test the value just below the boundary',load:LD({total:'49.99',exp:'5'},'Given total 49.99 kW · Then starter 5 kW'),
 parts:[['Given: 49.99','As close to 50 as the units allow, on the low side.'],['Then: 5 kW','Still under 50.']],
 saw:'CAUGHT: the copy with its threshold at 49. All five faults are found by four useful cases: 10, 49.99, 50 and 120. Those are exactly the four rows the Playwright guide feeds to one parametrized test in its lesson 3.',test:s=>!!s.caught.E}
],
notes:`<h2>On a real project</h2>
<ul>
<li>Classes are not only about numbers. "Signed in / signed out", "empty list / one item / many items", "valid email / malformed email / empty field" are all partitions. Whenever a rule says <em>if</em>, <em>when</em>, <em>unless</em>, <em>at least</em> or <em>up to</em>, it is drawing a class boundary.</li>
<li>Do not forget the <strong>invalid classes</strong>: a negative load, text where a number is expected, a value above the maximum. The rule often does not say what should happen, which is a question to take back to whoever owns the requirement.</li>
<li>"Just below" depends on the units. For whole numbers, the neighbours of 50 are 49 and 51. For money, 49.99. For a date, the day before.</li>
<li>A fair question: is it worth testing <em>just above</em> 50 as well? With a rule this simple, 50 and 49.99 pin the boundary down. When both sides of a boundary have their own complicated behaviour, test all three.</li>
</ul>`,
quiz:[
{q:'Rule: "orders of 100 units or more ship free". Which pair of values best tests the boundary?',opts:['50 and 150','99 and 100','100 and 200','1 and 1000'],a:1,why:'99 is the last value that pays shipping and 100 is the first that does not. A mistake in the comparison or the threshold changes the answer for at least one of them.'},
{q:'You have a passing case for a total draw of 120 kW. What does adding a case for 130 kW achieve?',opts:['It doubles confidence in the high class','It tests the boundary','Almost nothing: both are in the same equivalence class','It tests an invalid value'],a:2,why:'Both values are handled by the same part of the rule. One representative per class is enough, and extra ones cost run time without finding more.'},
{q:'Why do boundaries deserve their own cases?',opts:['They run faster','Requirements always mention them','Mistakes such as > for >= or a mistyped threshold only show up there','They are easier to automate'],a:2,why:'Values in the middle of a class give the same answer whether the comparison is slightly wrong or not. Only values at the edge can tell.'}],
reading:[
['Equivalence partitioning',WIKI+'Equivalence_partitioning','The technique, with further examples of valid and invalid partitions.'],
['Boundary-value analysis',WIKI+'Boundary-value_analysis','Why and how to pick values at the edges of each partition.'],
['pytest: How to parametrize tests','https://docs.pytest.org/en/stable/how-to/parametrize.html','How one test function is run once per row of values, which is how boundary cases are usually automated.']]},

{id:4,sys:'guidance',lab:'search',title:'Happy, negative and edge cases',mins:12,
idea:`
<p>So far the cases have checked calculations. From here on they check the Kestrel's web console, the same one the Playwright guide drives with a real browser. The thinking is the same, but a screen adds a new way to miss things: it is very easy to test only what a user is <em>supposed</em> to do.</p>
<p>The guidance team needs to find the navigation systems fast, so the console has a search box. Rule R4 on the bench describes it. A complete set of cases for any feature looks at it from three directions:</p>
<dl class="terms">
<dt>Happy path (positive case)</dt><dd>The user does the expected thing and it works. Search for "nav", see the two nav systems. Every feature needs at least one, and it is the case people write first and, too often, last.</dd>
<dt>Negative case</dt><dd>The user does something that should <em>not</em> succeed, and the system must refuse or explain properly. Search for something that does not exist. Type a wrong password. The expected result is the right error, not a crash and not a silent blank.</dd>
<dt>Edge case</dt><dd>A legal but unusual input at the limits of what the feature accepts: an empty search, capitals, the longest allowed text, one item, nine items. These are lesson 3's boundaries, applied to a screen.</dd>
</dl>
<p>A screen also raises the question of what, exactly, to look at in the Then. After a search, two things are observable: how many subsystems are listed, and whether the "No systems match" message is showing. A case that checks only the first can pass while the second is broken. <strong>List what can be observed, then decide which of it this case is about.</strong></p>
<p>One more habit: for every negative case, ask what the user should see. "Nothing happens" is almost never the right design, and writing the case is often when someone first notices that the rule does not say.</p>`,
labIntro:'Rule R4 is on the bench with four faulty copies of the console. The Given is fixed: the home page, listing all nine subsystems.',
tasks:[
{what:'The happy path',load:LD({term:'nav',count:'2',msg:'no'},'When "nav" · Then 2 listed, no message'),
 parts:[['When: nav','A category, not a name. Sensors and Guidance are both in the nav category.'],['Then: 2, not shown','Both observable results, stated.']],
 saw:'PASS, one fault caught: a copy that searched names only and found nothing for "nav".',test:s=>!!s.caught.B},
{what:'A negative case',load:LD({term:'warp drive',count:'0',msg:'yes'},'When "warp drive" · Then 0 listed, message shown'),
 parts:[['When: warp drive','Something the Kestrel does not have.'],['Then: 0, shown','The rule promises a message. An empty list with no explanation looks like a broken page.']],
 saw:'CAUGHT: one copy showed an empty list and said nothing. The happy path could never have found this, because it never asked for something that was not there.',test:s=>!!s.caught.C},
{what:'An edge case: the empty search',load:LD({term:'',count:'9',msg:'no'},'When empty search · Then 9 listed, no message'),
 parts:[['When: empty','A legal input at the lower limit of length.'],['Then: 9, not shown','The rule\'s second sentence.']],
 saw:'CAUGHT: one copy treated an empty search as matching nothing. Clearing the search box would have emptied the page.',test:s=>!!s.caught.D},
{what:'An edge case: capitals',load:LD({term:'REACTOR',count:'1',msg:'no'},'When "REACTOR" · Then 1 listed, no message'),
 parts:[['When: REACTOR','The rule says capitals are ignored. Pilots type with caps lock on.'],['Then: 1, not shown','Only the Reactor.']],
 saw:'CAUGHT: the last copy compared capitals. Four cases, three directions, every planted fault found.',test:s=>!!s.caught.A}
],
notes:`<h2>On a real project</h2>
<ul>
<li>A useful checklist of edge inputs for any text field: empty, only spaces, one character, the maximum length, capitals, accented letters (this matters in Québec: é, à, ç), and pasted text with a trailing space.</li>
<li>For lists: none, one, many, and more than fits on the screen.</li>
<li>Negative cases are where accessibility and UX problems surface, because error states get the least design attention. As a designer you are well placed to write these: you know what the error <em>should</em> look like.</li>
<li>Resist testing every combination. The aim is one case per distinct behaviour. The search does not behave differently for "nav" and "power", so one of them is enough.</li>
</ul>`,
quiz:[
{q:'Which of these is a negative case for a sign-in form?',opts:['Signing in with the right email and password','Signing in with the right email and a wrong password, and seeing an error','Checking the form has two fields','Signing in twice in a row'],a:1,why:'A negative case feeds the system something that should be refused and checks that it is refused in the right way.'},
{q:'A search case checks only that zero subsystems are listed for "warp drive". What can it miss?',opts:['That the search box exists','That the search is too slow','That the "No systems match" message is missing','Nothing'],a:2,why:'Zero rows is true whether or not the message appears. If the message matters, the Then has to mention it.'},
{q:'Why is the empty search an edge case and not a negative case?',opts:['Because it is a legal input at the limit of what is accepted, and should work','Because it produces an error','Because nobody would do it','Because it cannot be automated'],a:0,why:'Edge cases are valid inputs at the extremes. The feature should handle them normally. Negative cases are inputs that should be refused.'}],
reading:[
['Playwright: Best practices','https://playwright.dev/docs/best-practices','The official advice on testing what the user can see, which is the same idea as an observable Then.'],
['Happy path',WIKI+'Happy_path','The term, and its counterparts for error and edge scenarios.'],
['Negative testing',WIKI+'Negative_testing','A short definition with examples.']]},

{id:5,sys:'sensors',lab:'queue',title:'State and independent cases',mins:12,
idea:`
<p>The power rules were pure calculations: the same inputs always gave the same answer. A console has <strong>state</strong>. It remembers what is in the check queue and who is signed in, so the result of an action depends on what happened before it. Two things follow, and both are common sources of wasted hours in testing.</p>
<h3>The Given has to say everything</h3>
<p>If the result depends on the queue being empty, "the queue is empty" belongs in the Given. A precondition that is assumed but not written is the commonest reason a case passes for its author and fails for everyone else.</p>
<h3>Cases must not depend on each other</h3>
<p>Each case sets up its own starting state and leaves nothing behind that another case relies on. Then cases can run in any order, alone or together, and a failure points at one behaviour. When cases share state, one early failure knocks over everything after it, and the results change depending on what ran first.</p>
<dl class="terms">
<dt>State</dt><dd>What the system remembers between actions: queue contents, the signed-in user, saved data.</dd>
<dt>Precondition</dt><dd>A fact about the state that must be true before the When. Written in the Given.</dd>
<dt>Independent (isolated) case</dt><dd>A case whose result does not depend on any other case having run. Playwright enforces this by giving every test a brand-new browser context.</dd>
<dt>One behaviour per case</dt><dd>A case checks one thing. Its Then may contain more than one check, as long as they are all about that one behaviour.</dd>
</dl>
<p>This lesson's rule, R5, also combines with an earlier one: the queue page adds the starter cell from R3 to the total. When rules combine, the expected result needs more care, and the lab includes the same mistake that the Playwright guide walks into on purpose in its lesson 7.</p>`,
labIntro:'Rule R5 is on the bench. Tick the subsystems to queue, then give the two expected results. The draws are shown beside each name. Further down the steps you will switch isolation off to see what shared state does.',
tasks:[
{what:'Queue one check',load:LD({sys:['Sensors'],count:'1',total:'11.5'},'When queue Sensors · Then Queue (1), total 11.5 kW'),
 parts:[['When: Sensors','6.5 kW.'],['Then: Queue (1)','One check queued.'],['Then: 11.5','The load is 6.5 kW, which is under 50, so rule R3 adds 5 kW of starter cell.']],
 saw:'PASS, and one fault caught: a copy that left the starter cell out of the total.',test:s=>!!s.caught.A},
{what:'Queue two checks, and forget a rule',load:LD({sys:['Sensors','Defense systems'],count:'2',total:'20.5'},'When queue Sensors, Defense systems · Then Queue (2), total 20.5 kW'),
 parts:[['Then: 20.5','6.5 + 14. Is that the total draw, or only the load?']],
 saw:'FAIL on the real Kestrel, which showed 25.5 kW. The console is right: 20.5 is the load, and the starter cell adds 5. The expected result came from half the rule. When a case fails, check the case against the requirement before reporting a bug.',test:s=>s.res.some(r=>r.status==='fail')},
{what:'Remove the wrong case',act:'In the case sheet on the bench, press × beside the failing case.',
 saw:'Gone. Now write it again from the whole rule.',test:s=>s.cases.length>0&&!s.res.some(r=>r.status==='fail')},
{what:'Write it again from the whole rule',load:LD({sys:['Sensors','Defense systems'],count:'2',total:'25.5'},'When queue Sensors, Defense systems · Then Queue (2), total 25.5 kW'),
 parts:[['Then: 25.5','Load 20.5 kW, plus 5 kW of starter cell because the load is under 50.']],
 saw:'PASS and a fault CAUGHT: a copy whose Queue link stopped counting at 1. It took a second queued check to see it.',test:s=>!!s.caught.D},
{what:'Cross the 50 kW boundary on the screen',load:LD({sys:['Defense systems','Locomotion','Propulsion'],count:'3',total:'52'},'When queue Defense, Locomotion, Propulsion · Then Queue (3), total 52 kW'),
 parts:[['When: three heavy systems','14 + 16 + 22 = 52 kW of load.'],['Then: 52','At 50 or more the starter cell gives nothing, so total equals load.']],
 saw:'CAUGHT: a copy that always added the starter cell showed 57 kW. Lesson 3\'s boundary still matters when the rule is reached through a screen.',test:s=>!!s.caught.B},
{what:'The edge case: an empty queue',load:LD({sys:[],count:'0',total:'0'},'When nothing queued · Then Queue (0), total 0 kW'),
 parts:[['When: nothing','Open the queue page without queueing anything.'],['Then: 0','The rule says an empty queue needs no starter cell.']],
 saw:'CAUGHT: the last copy charged 5 kW for an empty queue. Every fault is found. Now break the cases without touching them.',test:s=>!!s.caught.C},
{what:'Switch isolation off',act:'Under the case form, untick "Give every case a fresh console". Every case now starts with whatever the case before it left in the queue.',
 saw:'Only the first case still passes. Not one case changed, and the Kestrel did not change either. Each case says "Given a fresh console", and that stopped being true. This is what a suite looks like when its cases share state.',test:s=>!s.iso},
{what:'Switch isolation back on',act:'Tick "Give every case a fresh console" again.',
 saw:'All green again. Every case sets up its own starting state, so the order no longer matters. Playwright does this for you: each test gets a fresh browser context with an empty queue and nobody signed in.',test:s=>s.iso}
],
notes:`<h2>On a real project</h2>
<ul>
<li>Isolation is cheap in a browser test and harder when a database is involved. Teams deal with it by creating fresh data in each test's setup, by resetting the database between tests, or by making each test's data unique. Whichever is used, the Given in the written case should still say what state it needs.</li>
<li>A long "journey" case that queues, signs in, starts a preflight and checks the log in one go is tempting because it mirrors a user flow. Keep one or two for the smoke set (lesson 7), and check the individual behaviours separately so a failure points somewhere.</li>
<li>If a case only passes when run after another, write that dependency out as a precondition, then find a way to set the state up directly.</li>
</ul>`,
quiz:[
{q:'A case passes when you run the whole sheet and fails when you run it alone. What is the most likely cause?',opts:['The system is slow','It depends on state that an earlier case left behind','Its expected result is wrong','It has too many steps'],a:1,why:'Something it needs is being set up by another case and not by its own Given. On its own, that state is missing.'},
{q:'The queue page showed 25.5 kW and your case expected 20.5 kW. What should you do first?',opts:['Report a bug in the queue page','Change the expected result to 25.5 because that is what the page shows','Re-read the requirement to see which of the two is right','Delete the case'],a:2,why:'A fail is a disagreement. Go back to the rule. Here the rule sides with the page, so the case is corrected. Copying the page\'s answer without checking the rule would be using the system as its own oracle.'},
{q:'Which Given is complete for "pressing Start preflight sends a signed-out pilot to the sign-in page"?',opts:['The console is open','Signed out, with one check in the queue, on the queue page','On the queue page','The pilot wants to start a preflight'],a:1,why:'The result depends on who is signed in, what is queued and which page is open. All three are state, so all three belong in the Given.'}],
reading:[
['Playwright: Isolation','https://playwright.dev/python/docs/browser-contexts','How each test gets its own browser context, and why.'],
['pytest: About fixtures','https://docs.pytest.org/en/stable/explanation/fixtures.html','Fixtures are how the Given is written in pytest: setup that runs fresh for each test.'],
['Eradicating Non-Determinism in Tests, by Martin Fowler',FOWLER+'/articles/nonDeterminism.html','A longer article on why tests that depend on order or shared state become unreliable.']]},

{id:6,sys:'cockpit',lab:'signin',title:'Writing a case anyone can run',mins:12,
idea:`
<p>A written case is an instruction for someone who was not in the room: a tester, a developer, a coding agent, or you in three months. The standard to aim for is that <strong>two different readers would do the same thing and reach the same verdict</strong>. Most weak cases fail that standard in one of three places.</p>
<dl class="terms">
<dt>A vague Given</dt><dd>"The console is running." On which page? Signed in or out? The reader has to guess, and a guess is a different test.</dd>
<dt>A vague When</dt><dd>"The pilot signs in." With which email and password? Typed where? Concrete test data belongs in the case.</dd>
<dt>A Then that is not observable</dt><dd>"Sign-in works correctly." Nobody can compare a screen with the word "correctly". An observable Then names something that can be seen and matched exactly: an address, a heading, a number, a message.</dd>
</dl>
<p>The third is the most damaging, because a vague Then does not look broken. The case runs, the reader glances at the screen, nothing is on fire, and it is marked as passed. It will be marked as passed on a broken build too.</p>
<p>A second, quieter problem is the <strong>weak Then</strong>: observable, but checking the absence of a problem instead of the presence of the right result. "No error appears" is true of a blank page. Prefer stating what <em>must</em> be there.</p>
<h3>Wording that survives automation</h3>
<p>Describe what a person can perceive, not how the page is built. "The heading reads Welcome back, Ada" is still true after a redesign. "The div with class hdr-2 contains Ada" is not. The Playwright guide finds elements the same way, by role and visible name, so a case written like this translates almost word for word into a test.</p>`,
labIntro:'This lab works differently. The cockpit crew wrote rule R6 for sign-in, and a hangar tech will run whatever you write, literally. Instead of typing values, you choose the wording for each part of the case. Some wordings are vague. See what the tech, and the four faulty copies, make of each.',
tasks:[
{what:'Run the case as someone first wrote it',load:LD({g:'g0',w:'w0',t:'t0'},'The console is running · The pilot signs in · Sign-in works correctly'),
 parts:[['All three parts','Each one reads fine and sounds like a test. Each one leaves the reader guessing.']],
 saw:'BLOCKED. The tech could not start: which page, and is someone already signed in? A case that cannot be run as written is not yet a case.',test:s=>s.res.some(r=>r.status==='blocked')},
{what:'Fix the Given and the When, leave the Then',load:LD({g:'g1',w:'w1',t:'t0'},'Signed out on /login · Type ada@example.com and skyward · Sign-in works correctly'),
 parts:[['Given','Now states the page and the signed-out state.'],['When','Now gives the exact data and the control to press.'],['Then','Still "works correctly".']],
 saw:'PASS on the real Kestrel, and PASS on all four faulty copies. The tech had nothing specific to compare, so everything looked fine. This case cannot fail, and it would sit in a suite for years reporting green.',test:s=>s.cases.some((c,i)=>c.in.t==='t0'&&s.res[i].status==='pass')},
{what:'Try a Then that checks for no error',load:LD({g:'g1',w:'w1',t:'t1'},'Signed out on /login · Type ada@example.com and skyward · No error appears'),
 parts:[['Then: no error appears','Observable this time. But it describes what is absent.']],
 saw:'PASS, and still nothing caught. One faulty copy leaves the pilot on the sign-in page with no message at all. No error appeared, so the case passed.',test:s=>s.cases.some((c,i)=>c.in.t==='t1'&&c.in.w==='w1'&&s.res[i].status==='pass')},
{what:'State what must be there',load:LD({g:'g1',w:'w1',t:'t2'},'Signed out on /login · Type ada@example.com and skyward · Address /account, heading "Welcome back, Ada"'),
 parts:[['Then: address and heading','Two things anyone can see and match exactly. Both are evidence of the one behaviour: the pilot got in, as Ada.']],
 saw:'Two faults CAUGHT: the sign-in that silently does nothing, and the page that greets the pilot as "undefined". The same Given and When were used all along. Only the Then changed.',test:s=>!!s.caught.A&&!!s.caught.D},
{what:'Write the negative case to the same standard',load:LD({g:'g1',w:'w2',t:'t3'},'Signed out on /login · Type ada@example.com and wrong password · Still /login, alert "Wrong email or password"'),
 parts:[['When: wrong password','The exact wrong value is given, so everyone types the same thing.'],['Then: address and alert text','Checks both that the pilot was kept out and that the console said why.']],
 saw:'The last two faults CAUGHT: a wrong password being accepted, and a refusal with no message. Two precise cases found everything. Three vague ones found nothing.',test:s=>!!s.caught.B&&!!s.caught.C}
],
notes:`<h2>On a real project</h2>
<ul>
<li>A quick review test for any Then: could a script check it? If the answer needs the word "looks", "properly", "correctly" or "as expected", it is not observable yet.</li>
<li>Test data in cases should be made up for the purpose, like ada@example.com here. Never put a real person's password or a production account in a case.</li>
<li>Titles matter more than they seem. A good title states the behaviour, so a failing test's name reads as a bug report: <em>wrong password is refused with a reason</em>. The Playwright guide's test names follow the same pattern.</li>
<li>When you hand cases to a coding agent, precise Thens stop it from quietly weakening a check to make a test pass. "Assert the heading reads Welcome back, Ada" leaves it no room.</li>
</ul>`,
quiz:[
{q:'Which Then is observable?',opts:['The page loads properly','The queue behaves as expected','The menu link reads "Queue (1)"','The search is fast enough'],a:2,why:'It names one visible thing and its exact content. The others need someone to decide what "properly", "as expected" or "enough" mean.'},
{q:'What is the danger of a case whose Then is "no error appears"?',opts:['It runs slowly','It passes when the right thing fails to happen quietly','It cannot be automated','It needs a signed-in user'],a:1,why:'A blank or unchanged page shows no error either. Checking for the presence of the correct result catches silent failures; checking for the absence of an error does not.'},
{q:'Two testers run the same case and report different verdicts on the same build. What is the most likely fault?',opts:['The build is unstable','The case leaves something open to interpretation','One tester is wrong','The case is too short'],a:1,why:'A well-written case leaves no choices to the reader. Differing verdicts usually trace back to a vague Given, When or Then.'}],
reading:[
['Gherkin reference (Cucumber)','https://cucumber.io/docs/gherkin/reference/','The formal Given/When/Then language some teams write cases in. Useful for its wording conventions even if you never use the tool.'],
['Playwright: Locators','https://playwright.dev/python/docs/locators','How tests find elements by role and visible name, which is why cases worded around what a person sees translate directly.'],
['Playwright: Assertions','https://playwright.dev/python/docs/test-assertions','The list of things a test can assert about a page. Each one is a kind of observable Then.']]},

{id:7,sys:'locomotion',custom:'triage',title:'Which cases first',mins:10,
idea:`
<p>You can now write more good cases than anyone has time to run. The Kestrel has a launch window, and the preflight has to fit inside it. Deciding which cases run first, which run later and which are not worth having is part of case writing, not an afterthought.</p>
<h3>Risk decides priority</h3>
<p>Rank each case by the failure it guards against: <strong>how likely</strong> is that failure, and <strong>how bad</strong> would it be? A rule that changes every sprint and stalls the reactor when wrong is high on both. A footer that shows the wrong year is low on both. Multiply the two and you have a rough priority. It is a judgement, but writing it down makes the judgement visible and arguable.</p>
<h3>Level decides cost</h3>
<p>The same behaviour can often be checked at more than one level, and the cost differs enormously:</p>
<svg viewBox="0 0 640 170" role="img" aria-label="The test pyramid: a wide base of many fast unit tests, a narrower middle layer, and a small top of few slow browser tests." style="width:100%;height:auto;margin:6px 0 12px">
<polygon points="320,10 395,60 245,60" style="fill:var(--warn-soft);stroke:var(--warn)"/>
<polygon points="245,66 395,66 470,112 170,112" style="fill:var(--accent-soft);stroke:var(--accent)"/>
<polygon points="170,118 470,118 548,162 92,162" style="fill:var(--good-soft);stroke:var(--good)"/>
<g text-anchor="middle" style="font:500 12px var(--mono)"><text x="320" y="48" style="fill:var(--warn)">browser</text><text x="320" y="94" style="fill:var(--accent)">API / integration</text><text x="320" y="145" style="fill:var(--good)">unit</text></g>
<g style="fill:var(--muted);font:400 11px var(--mono)"><text x="408" y="40">few · seconds each</text><text x="484" y="94">some</text><text x="560" y="145">many · ms</text></g>
</svg>
<dl class="terms">
<dt>Unit level</dt><dd>Calls one function directly, with no browser and no server. The starter cell rule at four values runs in a tenth of a second. The Playwright guide's lessons 1 to 3 work at this level, with pytest alone.</dd>
<dt>Browser level (end to end)</dt><dd>Drives the real console through a browser. Slower by a factor of thousands, and the only level that proves the screens, the server and the rules work together.</dd>
<dt>Test pyramid</dt><dd>The resulting advice: check each behaviour at the lowest level that can check it. Many fast unit cases, fewer browser cases, each of which earns its seconds.</dd>
<dt>Smoke set</dt><dd>The small group of cases that must pass before anything else is worth doing. If the console does not open, nobody cares that search ignores capitals.</dd>
<dt>Regression set</dt><dd>Everything else worth keeping, run less often: before a release, or overnight.</dd>
</dl>
<p>A rule's detail belongs at unit level. The boundary at 50 kW needs four values there. At browser level it needs one case that proves the queue page uses the rule at all, not the same four again through a slower door.</p>`,
customTitle:'Choose the smoke set',
customIntro:'The Kestrel walks out of the hangar in 16 seconds. Tick the cases that run before it does. Each has a run time, a level, and a risk score (how likely × how bad, each from 1 to 3). Then press Walk out and see which of today\'s four problems you caught in the hangar and which the pilot found in the field.',
notes:`<h2>On a real project</h2>
<ul>
<li>The smoke set is what CI runs on every push, and what you would run by hand after a deploy. The Playwright guide marks its smoke tests in its final lesson and the CI guide runs them.</li>
<li>Priorities are usually written as P1, P2, P3 on the sheet. P1: release is blocked if this fails. P2: must be fixed soon. P3: nice to know.</li>
<li>Deleting a low-value case is a legitimate decision. Every case is run, read and maintained for as long as it exists.</li>
<li>Risk changes. A feature that has just been rewritten is more likely to break than one untouched for a year, so its cases move up for a while.</li>
</ul>`,
quiz:[
{q:'Which case most deserves a place in the smoke set?',opts:['The footer shows the right year','A pilot can sign in','Search ignores capitals','The mission log lists two past missions'],a:1,why:'If sign-in is broken, most of the console is unusable. The impact is high, and the case is quick to run.'},
{q:'The starter cell rule has four boundary values. Where should those four checks live?',opts:['All four as browser tests','At unit level, with one browser case showing the queue page uses the rule','Nowhere, the rule is too simple','In the smoke set only'],a:1,why:'The rule\'s detail is cheapest to check directly. The browser case then only needs to prove the screen is wired to the rule.'},
{q:'How is a case\'s priority best decided?',opts:['By how long it took to write','By how likely the failure is and how bad it would be','By its position on the sheet','By whether it is automated'],a:1,why:'Likelihood and impact together are the risk the case guards against, and risk is what the limited run time should be spent on.'}],
reading:[
['Test Pyramid, by Martin Fowler',FOWLER+'/bliki/TestPyramid.html','The original short explanation of why most checks belong at the lower levels.'],
['The Practical Test Pyramid',FOWLER+'/articles/practical-test-pyramid.html','A long, worked example of deciding what to test at which level.'],
['Smoke testing (software)',WIKI+'Smoke_testing_(software)','The term and where it comes from.']]},

{id:8,sys:'comms',custom:'sheet',title:'Your test case sheet',mins:10,
idea:`
<p>The last step is to put the cases where they will be used. A <strong>test case sheet</strong> is one document that lists every case for a feature or product in a consistent shape. It is what you transmit to whoever runs or automates the cases, which is why this lesson belongs to the Kestrel's communication array.</p>
<p>Each entry on the sheet carries the parts you have practised, and nothing else:</p>
<dl class="terms">
<dt>ID</dt><dd>Short and stable, with an area prefix: TC-PWR-07. People will quote it in bug reports and commit messages.</dd>
<dt>Title</dt><dd>The behaviour, stated as a fact: "No starter cell from exactly 50 kW".</dd>
<dt>Priority</dt><dd>P1 for the smoke set, P2 for regression, P3 for nice to have (lesson 7).</dd>
<dt>Level</dt><dd>Unit or browser (lesson 7). It tells the automator which tool to reach for.</dd>
<dt>Given / When / Then</dt><dd>Complete preconditions, one action with concrete data, an observable expected result (lessons 1, 5 and 6).</dd>
</dl>
<p>The sheet on the bench starts with the cases from this guide: the ones you wrote in the labs, in their final wording. Untick any you do not want, add your own for a part of the console you think is under-tested, and copy the result. It is Markdown, so it can go in a repository next to the code, in a ticket, or straight into a prompt.</p>
<h3>Handing it to the Playwright guide, or to an agent</h3>
<p>Most of these cases are the very ones <a href="${PWURL}" target="_blank" rel="noopener">Playwright + pytest from Zero</a> automates, and the sheet notes the lesson and test name for each. Read that guide next with the sheet open: every test in it is one of these cases with Arrange, Act and Assert written in Python.</p>
<p>A few cases on the sheet are <em>not</em> in that guide, and are marked as yours to automate. They are a good first exercise once you have finished it. If you give the sheet to a coding agent instead, the closing section of the sheet tells it how to treat the cases: one case to one test, the title as the test name, and no weakening of a Then to make a test pass.</p>`,
customTitle:'Build the sheet',
customIntro:'Tick the cases to include, add your own below them, then copy the Markdown. Your selection is kept in this browser.',
notes:`<h2>Where to go next</h2>
<ul>
<li><a href="${PWURL}" target="_blank" rel="noopener">Playwright + pytest from Zero</a> turns these cases into running tests, starting with TC-PWR-01.</li>
<li>For the Kestrel simulator build, write the sheet for a feature <em>before</em> building it. Each acceptance criterion becomes one or more cases, and the cases become the tests that tell you when the feature is done.</li>
<li>Keep the sheet in the repository, for example at <code>docs/test-cases.md</code>, and change it in the same pull request as the behaviour it describes.</li>
</ul>`,
quiz:[
{q:'Why does every case get a stable ID?',opts:['So the cases sort alphabetically','So people can refer to one case exactly, in bug reports, commits and conversations','Because test tools require one','To count the cases'],a:1,why:'"TC-AUTH-02 fails on staging" is unambiguous. "The password one is broken" is not.'},
{q:'What is the relationship between a written case and an automated test?',opts:['They are unrelated documents','The test is the case, with Given, When and Then written as code that arranges, acts and asserts','The test replaces the need to think about cases','The case is generated from the test'],a:1,why:'Automation changes who runs the case, not what the case is. The thinking in this guide comes first either way.'},
{q:'An agent implementing your sheet changes a Then from "heading reads Welcome back, Ada" to "a heading is visible" so its test passes. What happened?',opts:['A sensible simplification','The check was weakened: it can now pass on a build that greets the pilot wrongly','Nothing, both are observable','The case was improved'],a:1,why:'The new Then is observable but weaker. Lesson 6\'s "undefined" fault would pass it. A precise sheet, and an instruction not to weaken a Then, is the defence.'}],
reading:[
['Playwright + pytest from Zero',PWURL,'The next guide in the path: the same console, the same cases, as running tests.'],
['pytest: Good integration practices','https://docs.pytest.org/en/stable/explanation/goodpractices.html','Where test files live in a repository and how they are named.'],
['Writing tests (Playwright for Python)','https://playwright.dev/python/docs/writing-tests','How a browser test is laid out: navigate, act, expect.']]}
];

const ANATOMY=[
['TC-PWR-01  Total draw adds up the loads','<b>ID and title.</b> The ID is how people refer to the case. The title states the behaviour as a fact, so that if the case fails, the title alone says what is broken.'],
['Checks: rule R1          Priority: P1          Level: unit','<b>Housekeeping.</b> Which requirement the case comes from, how much it matters, and whether it calls the rule directly (unit) or goes through a browser. Lessons 2 and 7.'],
['Given  loads of 6.5 and 12.0 kW are switched on','<b>Given (arrange).</b> The starting state, with real values. Everything the result depends on is written here, so two people set up the same situation.'],
['When   the total draw is worked out','<b>When (act).</b> One action. If you find yourself writing "and then", you probably have two cases.'],
['Then   the total draw is 18.5 kW','<b>Then (assert).</b> The expected result: observable, exact, and worked out from the rule before the case is ever run. 6.5 + 12 = 18.5.']
];

const GLOSSARY=[
['Preflight checklist','Test suite','All the cases for a product or feature, run together.'],
['One line of the checklist','Test case','A Given, a When and a Then, with an ID and a title.'],
['The Kestrel as specified','System under test (SUT)','The real thing being checked.'],
['The rule on the bench','Requirement, acceptance criterion','What the system is supposed to do. The oracle for expected results.'],
['Faulty copy on the training rig','Mutant','The system with one deliberate fault, used to see whether the cases notice.'],
['Caught / missed','Killed / survived','Whether at least one case fails on the mutant.'],
['A fresh console for each case','Test isolation','No case depends on state left behind by another.'],
['Walk-out checks','Smoke tests','The few cases that must pass before anything else.'],
['Hangar tech','Tester, or a test runner such as pytest','Whoever, or whatever, carries out the cases.']
];

/* ---------- UI ---------- */
(function(){
const KEY='test-cases-guide-v1';
let saved={done:{},quiz:{},cases:{},sheet:null,triage:null};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done&&s.quiz)saved=Object.assign(saved,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}};
const $=(s,r)=>(r||document).querySelector(s);
function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];
    if(k==='html')n.innerHTML=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v);}
  kids.flat(Infinity).forEach(c=>{if(c!=null)n.append(c);});
  return n;
}
const quizDone=Ls=>Ls.quiz.every((q,i)=>saved.quiz[Ls.id+'-'+i]===q.a);
const lessonDone=Ls=>Ls.lab?!!saved.done[Ls.id]:quizDone(Ls);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const WIDE=window.matchMedia('(min-width:1040px)');
let benchEl=null,slotEl=null,token=0;
function placeBench(){if(!benchEl)return;const host=WIDE.matches?$('#bench'):slotEl;if(host&&benchEl.parentNode!==host)host.append(benchEl);}
WIDE.addEventListener('change',placeBench);

/* ----- navigation ----- */
function renderNav(active){
  const nav=$('#nav');nav.textContent='';
  LESSONS.forEach(Ls=>{
    nav.append(el('a',{href:'#lesson-'+Ls.id,class:'nav-item'+(active===Ls.id?' active':'')+(lessonDone(Ls)?' done':''),'aria-current':active===Ls.id?'page':null},
      el('span',{class:'num',text:lessonDone(Ls)?'✓':String(Ls.id).padStart(2,'0')}),el('span',{class:'nav-title',text:Ls.title})));
  });
  nav.append(el('a',{href:'#cheat-sheet',class:'nav-item'+(active==='cheats'?' active':'')},el('span',{class:'num',text:'≡'}),el('span',{class:'nav-title',text:'Cheat sheet'})));
  const n=LESSONS.filter(lessonDone).length;

function quiz(Ls,sec){
  Ls.quiz.forEach((q,i)=>{
    const key=Ls.id+'-'+i,fb=el('p',{class:'fb','aria-live':'polite'}),opts=el('div',{class:'opts'});

      fb.className='fb'+(ch==null?'':ch===q.a?' good':' bad');
      fb.textContent=ch==null?'':ch===q.a?'Correct. '+q.why:'Not quite. Have another look at the options, or re-read the section above.';

    sec.append(el('div',{class:'q'},el('p',{class:'qt',text:(i+1)+'. '+q.q}),opts,fb));draw();

function showCheats(){

    el('section',{class:'prose',html:`
<p>Everything from the eight lessons on one page: the shape of a case, the techniques for choosing cases, a review checklist, and the Kestrel words next to the standard ones.</p>
<h2>The shape of a case</h2>
<pre class="file">### TC-AREA-01 · The behaviour, stated as a fact

Priority: P1 | P2 | P3 · Level: unit | browser · Checks: rule or ticket

- **Given** the complete starting state, with real values
- **When** one action, with the exact data
- **Then** what must be observable afterwards, exactly</pre>
<h2>Choosing cases</h2>
<div class="tscroll"><table class="types"><thead><tr><th>Technique</th><th>Ask yourself</th><th>Lesson</th></tr></thead><tbody>
<tr><td>Conditions from the rule</td><td>What does each sentence of the requirement claim? Does every claim have a case?</td><td>2</td></tr>
<tr><td>Data that is not blind</td><td>If the system had got this wrong in the likeliest way, would these values notice? Avoid 0, 1, 100 and tidy totals as the only data.</td><td>2</td></tr>
<tr><td>Equivalence classes</td><td>Which inputs does the rule treat the same? One representative each, including invalid ones.</td><td>3</td></tr>
<tr><td>Boundary values</td><td>Where does one class meet the next? Test the value on the boundary and its nearest neighbour.</td><td>3</td></tr>
<tr><td>Happy, negative, edge</td><td>What should work, what should be refused (and how), and what is legal but unusual: empty, capitals, one, many?</td><td>4</td></tr>
<tr><td>State</td><td>What does the result depend on that the Given does not yet say?</td><td>5</td></tr>
<tr><td>Risk</td><td>How likely is this failure and how bad? Lowest level that can check it?</td><td>7</td></tr>
</tbody></table></div>
<h2>Reviewing a case</h2>
<ul>
<li>Could two people run it and disagree about what to do? Then the Given or the When is vague.</li>
<li>Could a script check the Then? If it needs "correctly", "properly" or "as expected", it is not observable.</li>
<li>Does the Then say what must be present, not only that no error appeared?</li>
<li>Was the expected result worked out from the requirement, not copied from the screen?</li>
<li>Can the case fail? Name a plausible bug that would make it fail. If you cannot, it checks nothing.</li>
<li>Does it check one behaviour? Would its title still be accurate if it failed?</li>
<li>Does it pass when run alone and when run last?</li>
<li>Is there another case that would always fail whenever this one does? Then one of them is redundant.</li>
</ul>
<h2>Kestrel words and standard words</h2>
<div class="tscroll"><table class="types"><thead><tr><th>In this guide</th><th>Standard term</th><th>Meaning</th></tr></thead><tbody>
${GLOSSARY.map(g=>'<tr><td>'+esc(g[0])+'</td><td>'+esc(g[1])+'</td><td>'+esc(g[2])+'</td></tr>').join('')}
</tbody></table></div>
<h2>Next</h2>
<p><a href="${PWURL}" target="_blank" rel="noopener">Playwright + pytest from Zero</a> automates the cases from this guide. Take your sheet from lesson 8 with you.</p>`}));
