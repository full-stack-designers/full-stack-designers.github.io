<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playwright + pytest from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right a live map of what the tests are doing (files, test run, browser, steps, project) above a terminal that changes it. One dark terminal world; on phones the map-and-terminal bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:attr(data-p) " ";color:var(--term-dim)}
.ran::before{content:attr(data-p) " ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-tables{border-top-color:var(--good)}.z-session{border-top-color:var(--accent)}.z-databases{border-top-color:var(--warn)}.z-roles{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-tables .zlist{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}

.wcards{display:flex;flex-direction:column;gap:10px}
.wcard{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.wcard>code{overflow-wrap:anywhere;font-size:.8rem;color:var(--good)}
.wcard .caption{font-size:.88rem}
.wtrack{position:relative;height:18px;background:var(--sunk);border-radius:2px;margin:0 6px}
.wtrack i{position:absolute}
.wtrack .upd{top:-2px;bottom:-2px;width:2px;background:var(--good)}
.wtrack .chk{top:5px;width:8px;height:8px;border-radius:50%;margin-left:-4px}
.chk.n{background:var(--bad)}.chk.y{background:var(--good);box-shadow:0 0 0 2px var(--sunk)}
.notes table.types code{white-space:nowrap}
.widget .bw-page{max-height:none}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}

/* ---- Kestrel edition: schematic strip and blueprint console ---- */
.kz{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#0b2f5c22;min-width:0}
.kz-anim{flex:0 0 auto;width:min(216px,46%);aspect-ratio:4/3;border:1px solid #2a5c94;border-radius:4px;background:#0b2f5c;overflow:hidden;display:grid;place-items:center}
.kz-anim svg{display:block;width:100%;height:100%}
.kz-info{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:4px}
.kz-h{font:700 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#8fbbe8}
.kz-info b{font:700 1rem var(--mono)}
.kz-info .sub{flex-basis:auto}
.kz-board{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kchip{font:500 .64rem/1.4 var(--mono);padding:2px 7px;border-radius:3px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.kchip::before{content:"\25CF  "}
.kchip.ok{color:var(--good);border-color:#1f6f54}
.kchip.bad{color:var(--bad);border-color:#7a2f2c}
.kchip.on{box-shadow:0 0 0 2px var(--accent)}
.sysnote{border-left:3px solid #2a5c94;background:#0b2f5c33;padding:8px 12px;border-radius:0 4px 4px 0;font-size:.95rem}
.sysnote b{font-family:var(--mono);font-size:.9rem}
.bw-page{background:#0b2f5c;color:#e6f2ff}
.bw-blank{color:#7f9dbd}
.pg-nav{border-bottom-color:#2a5c94}
.pg-a{color:#8ff6ff}
.pg-label{color:#a9cdf3}
.pg-input{background:#08264a;border-color:#6fa3d8;color:#e6f2ff}
.pg-input.ph{color:#7f9dbd}
.pg-button{background:#1b6665;color:#eafff5;box-shadow:inset 0 0 0 1px #3ddc97}
.pg-li{border-color:#2a5c94;background:#0e3a6e}
.pg-p.note{background:#0f3d33;color:#8af0c2}
.pg-p.err{background:#4a1f24;color:#ffc2b8}
.pg-th,.pg-td{border-bottom-color:#2a5c94}
.pg-th{color:#a9cdf3}
.bw-page .tag{font:500 .6rem var(--mono);border:1px solid #2a5c94;border-radius:3px;padding:0 5px;color:#a9cdf3}
.bw-page .hl{outline-color:#ff8ad1;box-shadow:0 0 0 4px rgba(255,138,209,.28)}
@media (min-width:1040px){.map{max-height:66%}}
</style>

<body>
<a href="/" aria-label="Back to the Designer Learning Path" style="position:fixed;left:12px;bottom:12px;z-index:2147483000;display:inline-flex;align-items:center;gap:6px;font:600 13px/1 system-ui,-apple-system,Segoe UI,sans-serif;padding:10px 14px;border-radius:999px;background:#D9481C;color:#fff;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25)">← Learning Path</a>
<div class="app">
<header class="top"><div class="top-in">
  <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
  <p class="brand"><span>~/</span>playwright-pytest-from-zero<b class="cur" aria-hidden="true"></b></p>
  <nav id="nav" aria-label="Lessons"></nav>
  <span id="progress-text"></span>
  <div class="bar" aria-hidden="true"><div id="progress-bar"></div></div>
</div></header>
<div class="work">
  <main id="main" class="lesson" tabindex="-1"></main>
  <aside id="bench" class="bench" aria-label="Sandbox"></aside>
</div>
</div>
<script>
/* ---------- The shop under test: a small page model, so tests have something real to act on ---------- */
const ORIGIN='http://127.0.0.1:8000';
const SYSTEMS=[['Sensors','nav',6.5],['Reactor','power',12],['Defense systems','defense',14],['Guidance','nav',7.5],['Limbs','motion',9],['Locomotion','motion',16],['Propulsion','power',22],['Communication array','comms',4],['Cockpit','crew',3]];
const kw=n=>n.toFixed(1)+' kW';
const norm=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
const ROLE={h1:'heading',h2:'heading',h3:'heading',a:'link',button:'button',ul:'list',li:'listitem',table:'table',tr:'row',th:'columnheader',td:'cell',nav:'navigation'};
function N(tag,p,kids){
  const n=Object.assign({tag,text:'',kids:[]},p||{});
  if(typeof kids==='string')n.text=kids;else n.kids=(kids||[]).filter(Boolean);
  if(!n.role)n.role=tag==='input'?(n.type==='search'?'searchbox':'textbox'):ROLE[tag]||null;
  return n;
}
const fullText=n=>norm((n.text||'')+' '+n.kids.map(fullText).join(' '));
const accName=n=>n.aria?n.aria:n.tag==='input'?n.label||'':/^(heading|link|button|cell|columnheader)$/.test(n.role||'')?fullText(n):'';
const desc=r=>{const o=[];(function w(n){n.kids.forEach(k=>{o.push(k);w(k);});})(r);return o;};
const TITLES={'/':'Kestrel Console · KF-07 preflight','/queue':'Check queue · Kestrel Console','/login':'Sign in · Kestrel Console','/account':'Pilot account · Kestrel Console','/missions':'Mission log · Kestrel Console'};
function createShop(){
  const s={path:null,cart:[],user:null,q:'',pend:null,status:'',err:false,f:{},t:0};
  const nav=()=>N('nav',{},[N('a',{href:'/'},'Home'),N('a',{href:'/queue'},'Queue ('+s.cart.length+')'),s.user?N('a',{href:'/missions'},'Mission log'):N('a',{href:'/login'},'Sign in')]);
  function body(){
    if(s.path==='/'){
      const shown=SYSTEMS.filter(p=>(p[0]+' '+p[1]).toLowerCase().includes(s.q.toLowerCase()));
      return [N('h1',{},'Kestrel Console'),
        N('label',{},[N('span',{},'Search systems'),N('input',{type:'search',label:'Search systems',ph:'Search reactor, sensors, nav',value:s.f.search||'',key:'search'})]),
        N('h2',{},'Subsystems'),
        N('p',{role:'status',hidden:!s.status,cls:'note'},s.status),
        shown.length?N('ul',{aria:'Subsystems'},shown.map(p=>N('li',{},[N('h3',{},p[0]),N('span',{cls:'tag'},p[1]),N('span',{cls:'price'},kw(p[2])),N('button',{act:'add:'+p[0]},'Queue check')]))):N('p',{},'No systems match "'+s.q+'"')];
    }
    if(s.path==='/queue'){
      const items=s.cart.map(n=>SYSTEMS.find(p=>p[0]===n));const sub=items.reduce((a,p)=>a+p[2],0);const ship=!items.length||sub>=50?0:5;
      return [N('h1',{},'Check queue'),
        items.length?N('table',{},[N('tr',{},[N('th',{},'System'),N('th',{},'Draw')])].concat(items.map(p=>N('tr',{},[N('td',{},p[0]),N('td',{},kw(p[2]))])))):N('p',{},'The queue is empty'),
        N('p',{cls:'sum'},[N('span',{},'Load'),N('span',{testid:'queue-load'},kw(sub))]),
        N('p',{cls:'sum'},[N('span',{},'Starter cell'),N('span',{testid:'queue-starter'},kw(ship))]),
        N('p',{cls:'sum'},[N('span',{},'Total draw'),N('strong',{testid:'queue-total'},kw(sub+ship))]),
        N('button',{act:'checkout'},'Start preflight')];
    }
    if(s.path==='/login')return [N('h1',{},'Sign in'),
      N('label',{},[N('span',{},'Email'),N('input',{type:'email',label:'Email',value:s.f.email||'',key:'email'})]),
      N('label',{},[N('span',{},'Password'),N('input',{type:'password',label:'Password',value:(s.f.password||'').replace(/./g,'•'),key:'password'})]),
      N('button',{act:'signin'},'Sign in'),
      s.err?N('p',{role:'alert',cls:'err'},'Wrong email or password'):null];
    if(s.path==='/account')return [N('h1',{},'Welcome back, Ada'),N('p',{},'Signed in as ada@example.com, pilot of KF-07'),N('a',{href:'/missions'},'See the mission log')];
    if(s.path==='/missions')return [N('h1',{},'Mission log'),N('table',{},[N('tr',{},[N('th',{},'Mission'),N('th',{},'Date'),N('th',{},'Result')]),
      N('tr',{},[N('td',{},'M-041'),N('td',{},'2 Nov 2026'),N('td',{},'Complete')]),N('tr',{},[N('td',{},'M-058'),N('td',{},'9 Nov 2026'),N('td',{},'Complete')])])];
    return [N('h1',{},'404'),N('p',{},'There is no page at this address.')];
  }
  const api={
    get url(){return s.path===null?'about:blank':ORIGIN+s.path;},
    get title(){return s.path===null?'':TITLES[s.path]||'Not found · Kestrel Console';},
    get state(){return s;},
    render(){let id=0;const root=N('body',{},s.path===null?[]:[nav()].concat(body()));(function w(n){n.id=id++;n.kids.forEach(w);})(root);return root;},
    goto(path){if(path==='/missions'&&!s.user)path='/login';if(path==='/account'&&!s.user)path='/login';s.path=path;s.status='';s.err=false;s.f={};s.q='';s.pend=null;},
    click(n){
      if(n.tag==='a')return api.goto(n.href);
      if(!n.act)return;
      if(n.act.startsWith('add:')){const name=n.act.slice(4);s.cart.push(name);s.status='Queued the '+name+' check';}
      else if(n.act==='checkout'){if(!s.user)api.goto('/login');else s.status='Preflight started';}
      else if(n.act==='signin'){if(s.f.email==='ada@example.com'&&s.f.password==='skyward'){s.user='ada';api.goto('/account');}else s.err=true;}
    },
    fill(n,v){s.f[n.key]=v;if(n.key==='search')s.pend={at:s.t+300,q:v};},
    tick(ms){s.t+=ms;if(s.pend&&s.t>=s.pend.at){s.q=s.pend.q;s.pend=null;}},
    snap(hl,when){return {url:api.url,title:api.title,tree:api.render(),hl:hl||[],when:when||'after'};}
  };
  return api;
}
/* ----- locators: the same lookups Playwright does, on the page model ----- */
const Q=s=>'"'+s+'"';
const nmatch=(have,want,exact)=>exact?norm(have)===want:norm(have).toLowerCase().includes(String(want).toLowerCase());
const Loc={
  role:(role,name,exact)=>({py:'get_by_role('+Q(role)+(name?', name='+Q(name):'')+(exact?', exact=True':'')+')',find:r=>desc(r).filter(n=>n.role===role&&!n.hidden&&(!name||nmatch(accName(n),name,exact)))}),
  text:(t,exact)=>({py:'get_by_text('+Q(t)+(exact?', exact=True':'')+')',find:r=>desc(r).filter(n=>!n.hidden&&n.text&&n.tag!=='input'&&nmatch(n.text,t,exact))}),
  label:t=>({py:'get_by_label('+Q(t)+')',find:r=>desc(r).filter(n=>n.tag==='input'&&nmatch(n.label,t))}),
  placeholder:t=>({py:'get_by_placeholder('+Q(t)+')',find:r=>desc(r).filter(n=>n.tag==='input'&&n.ph&&nmatch(n.ph,t))}),
  testid:t=>({py:'get_by_test_id('+Q(t)+')',find:r=>desc(r).filter(n=>n.testid===t)}),
  css:(sel,fn)=>({py:'locator('+Q(sel)+')',find:fn})
};
const within=(a,b)=>({py:a.py+'.'+b.py,find:r=>[...new Set(a.find(r).flatMap(p=>b.find(p)))]});
const filt=(a,t)=>({py:a.py+'.filter(has_text='+Q(t)+')',find:r=>a.find(r).filter(n=>nmatch(fullText(n),t))});
const firstOf=a=>({py:a.py+'.first',find:r=>a.find(r).slice(0,1)});
const htmlOf=n=>'<'+n.tag+(n.testid?' data-testid="'+n.testid+'"':'')+(n.tag==='input'?' type="'+n.type+'"':'')+'>'+(n.tag==='input'?'':fullText(n)+'</'+n.tag+'>');
function akaOf(n,root,loc,i){
  if(n.testid)return 'get_by_test_id('+Q(n.testid)+')';
  const li=desc(root).find(x=>x.role==='listitem'&&desc(x).includes(n));
  if(li){const hd=li.kids.find(k=>k.role==='heading');return 'get_by_role("listitem").filter(has_text='+Q(hd?fullText(hd):fullText(li))+').get_by_role('+Q(n.role)+')';}
  return loc.py+(i===0?'.first':'.nth('+i+')');
}

/* ---------- Step files: written as data, so the Python you read and what the sandbox runs cannot drift apart ---------- */
const pyVal=v=>typeof v==='string'?Q(v):String(v);
const S={
  goto:(u,v)=>({py:(v||'page')+'.goto('+Q(u)+')',op:'goto',url:u}),
  click:(loc,expr)=>({py:(expr||'page.'+loc.py)+'.click()',op:'click',loc}),
  fill:(loc,val,expr)=>({py:(expr||'page.'+loc.py)+'.fill('+Q(val)+')',op:'fill',loc,val}),
  set:(name,loc,v)=>({py:name+' = '+(v||'page')+'.'+loc.py,op:'noop'}),
  expect:(loc,m,arg,expr)=>({py:'expect('+(expr||'page.'+loc.py)+').'+m+'('+(arg===undefined?'':pyVal(arg))+')',op:'expect',loc,m,arg}),
  expectPage:(m,re,v)=>({py:'expect('+(v||'page')+').'+m+'(re.compile('+Q(re)+'))',op:'expectPage',m,re}),
  count:(loc,n)=>({py:'assert page.'+loc.py+'.count() == '+n,op:'count',loc,n}),
  eq:(expr,fn,want,where)=>({py:'assert '+expr+' == '+want,op:'eq',fn,want,where:where||expr}),
  raw:line=>({py:line,op:'noop'})
};
const PRICES={
v1:`def total_draw(loads, throttle_back=0):
    """Add up the loads in kW, then take a percentage off for throttling back."""
    total = sum(loads)
    return total - throttle_back


def starter_draw(total):
    """50 kW or more keeps the reactor self-sustaining. Less needs 5 kW from the starter cell."""
    return 0 if total >= 50 else 5
`,
v2:`def total_draw(loads, throttle_back=0):
    """Add up the loads in kW, then take a percentage off for throttling back."""
    total = sum(loads)
    return round(total * (1 - throttle_back / 100), 2)


def starter_draw(total):
    """50 kW or more keeps the reactor self-sustaining. Less needs 5 kW from the starter cell."""
    return 0 if total >= 50 else 5
`};
const MODS={
  v1:{total_draw:(p,d)=>p.reduce((a,b)=>a+b,0)-(d||0),starter_draw:t=>t>=50?0:5},
  v2:{total_draw:(p,d)=>Math.round(p.reduce((a,b)=>a+b,0)*(1-(d||0)/100)*100)/100,starter_draw:t=>t>=50?0:5}
};
const pf=x=>Number.isInteger(x)?x+'.0':String(x);
const U0=ORIGIN+'/';
const LI=Loc.role('listitem'),ADD=Loc.role('button','Queue check'),CARTLINK=Loc.role('link','Queue');
const TEA=filt(LI,'Sensors'),MUG=filt(LI,'Defense systems'),SEARCH=Loc.label('Search systems');
const PW_IMPORTS=['import re','','from playwright.sync_api import Page, expect'];
const addTea=()=>[S.set('sensors',TEA),S.click(within(TEA,ADD),'sensors.'+ADD.py)];
const signIn=v=>[S.goto('/login',v),S.fill(Loc.label('Email'),'ada@example.com',v+'.'+Loc.label('Email').py),S.fill(Loc.label('Password'),'skyward',v+'.'+Loc.label('Password').py),S.click(Loc.role('button','Sign in'),v+'.'+Loc.role('button','Sign in').py)];
const CART_FIX={name:'arm_loads',args:[],steps:[S.raw('# setup: runs before each test that asks for "arm_loads"'),S.raw('loads = [6.5, 12.0, 14.0]'),S.raw('yield loads'),S.raw('# teardown: runs after that test, whether it passed or failed'),S.raw('loads.clear()')],value:()=>[6.5,12,14]};
/* every test names the Kestrel subsystem it checks (sys): the schematic panel plays that subsystem's animation */
const FILEDEFS={
'power_v1.py':{src:PRICES.v1},
'power_v2.py':{src:PRICES.v2},
'test_01_first.py':{imports:['from power import total_draw'],needs:['prices'],tests:[
  {name:'test_total_adds_up',sys:'reactor',steps:[S.eq('total_draw([6.5, 12.0])',e=>e.mod.total_draw([6.5,12]),'18.5')]},
  {name:'test_no_load_is_zero',sys:'reactor',steps:[S.eq('total_draw([])',e=>e.mod.total_draw([]),'0')]}]},
'test_02_throttle.py':{imports:['from power import total_draw, starter_draw'],needs:['prices'],tests:[
  {name:'test_total_adds_up',sys:'reactor',steps:[S.eq('total_draw([6.5, 12.0])',e=>e.mod.total_draw([6.5,12]),'18.5')]},
  {name:'test_no_load_is_zero',sys:'reactor',steps:[S.eq('total_draw([])',e=>e.mod.total_draw([]),'0')]},
  {name:'test_throttle_back_is_a_percentage',sys:'propulsion',steps:[S.eq('total_draw([20.0, 30.0], throttle_back=10)',e=>e.mod.total_draw([20,30],10),'45.0')]},
  {name:'test_no_starter_from_50',sys:'propulsion',steps:[S.eq('starter_draw(50)',e=>e.mod.starter_draw(50),'0'),S.eq('starter_draw(49.99)',e=>e.mod.starter_draw(49.99),'5')]}]},
'conftest_03.py':{imports:['import pytest'],fixtures:[CART_FIX]},
'test_03_fixtures.py':{imports:['import pytest','','from power import total_draw, starter_draw'],needs:['prices'],tests:[
  {name:'test_arm_total',sys:'limbs',args:['arm_loads'],steps:[S.eq('total_draw(arm_loads)',e=>e.mod.total_draw(e.fx.arm_loads),'32.5','total_draw([6.5, 12.0, 14.0])')]},
  {name:'test_arm_loads_are_fresh_each_time',sys:'limbs',args:['arm_loads'],steps:[S.raw('arm_loads.append(100.0)'),S.eq('len(arm_loads)',e=>e.fx.arm_loads.length+1,'4','len([6.5, 12.0, 14.0, 100.0])')]},
  {name:'test_starter',sys:'limbs',args:['total','expected'],params:{names:'total, expected',rows:[[10,5],[49.99,5],[50,0],[120,0]]},
   steps:[{py:'assert starter_draw(total) == expected',op:'eq',fn:e=>e.mod.starter_draw(e.vals[0]),wantFn:e=>e.vals[1],where:'starter_draw(total)'}]}]},
'test_04_cockpit.py':{imports:PW_IMPORTS,needs:['playwright'],tests:[
  {name:'test_console_has_title',sys:'cockpit',args:['page: Page'],steps:[S.goto(U0),S.expectPage('to_have_title','Kestrel Console')]},
  {name:'test_console_lists_subsystems',sys:'cockpit',args:['page: Page'],steps:[S.goto(U0),S.expect(Loc.role('heading','Subsystems'),'to_be_visible'),S.expect(LI,'to_have_count',9)]}]},
'test_05_strict.py':{imports:PW_IMPORTS,needs:['playwright'],tests:[
  {name:'test_queue_sensors_check',sys:'sensors',args:['page: Page'],steps:[S.goto(U0),S.click(ADD),S.expect(CARTLINK,'to_have_text','Queue (1)')]}]},
'test_05_fixed.py':{imports:PW_IMPORTS,needs:['playwright'],tests:[
  {name:'test_queue_sensors_check',sys:'sensors',args:['page: Page'],steps:[S.goto(U0)].concat(addTea(),[S.expect(CARTLINK,'to_have_text','Queue (1)'),S.expect(Loc.role('status'),'to_have_text','Queued the Sensors check')])}]},
'test_06_flaky.py':{imports:PW_IMPORTS,needs:['playwright'],tests:[
  {name:'test_search_finds_nav_systems',sys:'guidance',args:['page: Page'],steps:[S.goto(U0),S.fill(SEARCH,'nav'),S.count(LI,2)]}]},
'test_06_search.py':{imports:PW_IMPORTS,needs:['playwright'],tests:[
  {name:'test_search_finds_nav_systems',sys:'guidance',args:['page: Page'],steps:[S.goto(U0),S.fill(SEARCH,'nav'),S.expect(LI,'to_have_count',2),S.expect(firstOf(LI),'to_contain_text','Sensors')]},
  {name:'test_search_with_no_results',sys:'guidance',args:['page: Page'],steps:[S.goto(U0),S.fill(SEARCH,'warp drive'),S.expect(Loc.text('No systems match'),'to_be_visible'),S.expect(LI,'to_have_count',0)]},
  {name:'test_sign_in',sys:'guidance',args:['page: Page'],steps:[S.goto(ORIGIN+'/login'),S.fill(Loc.label('Email'),'ada@example.com'),S.fill(Loc.label('Password'),'skyward'),S.click(Loc.role('button','Sign in')),S.expectPage('to_have_url','/account'),S.expect(Loc.role('heading','Welcome back, Ada'),'to_be_visible')]}]},
'test_07_total.py':{imports:PW_IMPORTS,needs:['playwright'],tests:[
  {name:'test_queue_shows_total_draw',sys:'defense',args:['page: Page'],steps:[S.goto(U0)].concat(addTea(),[S.set('defense',MUG),S.click(within(MUG,ADD),'defense.'+ADD.py),S.click(CARTLINK),S.expect(Loc.testid('queue-total'),'to_have_text','20.5 kW')])}]},
'test_07_fixed.py':{imports:PW_IMPORTS,needs:['playwright'],tests:[
  {name:'test_queue_shows_total_draw',sys:'defense',args:['page: Page'],steps:[S.goto(U0)].concat(addTea(),[S.set('defense',MUG),S.click(within(MUG,ADD),'defense.'+ADD.py),S.click(CARTLINK),S.expect(Loc.testid('queue-load'),'to_have_text','20.5 kW'),S.expect(Loc.testid('queue-starter'),'to_have_text','5.0 kW'),S.expect(Loc.testid('queue-total'),'to_have_text','25.5 kW')])}]},
'conftest_08.py':{imports:['import pytest','from playwright.sync_api import Page, expect'],fixtures:[CART_FIX,
  {name:'signed_in_page',args:['page: Page'],uses:['page'],steps:signIn('page').concat([S.expect(Loc.role('heading','Welcome back, Ada'),'to_be_visible'),S.raw('return page')])}]},

    let t0=null;const f=n=>{if(t0===null)t0=n;const t=Math.min(to,from+(n-t0)/1000);draw(t);if(t<to)raf=requestAnimationFrame(f);};raf=requestAnimationFrame(f);
  }
  return {load,show(mode){if(mode==='pass')play(0,2.96);else if(mode==='fail')play(3,5.98);else{cancelAnimationFrame(raf);draw(0);}}};
}

{id:1,sys:'reactor',title:'What a test is',mins:10,setup:'fresh',
idea:`
<p>A test is a small program that uses your real program and checks that it did the right thing. Nothing more. Instead of opening the Kestrel's console, queueing two system checks and reading the total power draw yourself, you write those steps down once, and the computer repeats them in seconds every time the code changes.</p>
<p>This guide uses two tools that are often mentioned in one breath but do different jobs:</p>
<dl class="terms">
<dt>pytest</dt><dd>The test runner. It finds your test functions, runs each one, and reports which passed and which failed. It knows nothing about browsers. Lessons 1 to 3 use pytest alone.</dd>
<dt>Playwright</dt><dd>A library that drives a real browser: open this page, click that button, read this text. It knows nothing about passing or failing. Lessons 4 onwards add it.</dd>
<dt>pytest-playwright</dt><dd>The plugin that joins the two. It hands each test a ready browser tab and adds browser options to the pytest command.</dd>
<dt>Test function</dt><dd>A Python function whose name starts with <code>test_</code>, in a file whose name starts with <code>test_</code>. That naming is how pytest finds it.</dd>
<dt>assert</dt><dd>The Python keyword that does the checking. <code>assert x == 5</code> does nothing if it is true and stops the test with an error if it is false.</dd>
<dt>Code under test</dt><dd>The real code a test exercises. Here that starts as two small power-budget functions and later becomes the Kestrel's whole web console.</dd>
</dl>
<p>The code under test belongs to the KF-07 Kestrel Mk II, the mobile suit from the other guides. Before a mission its nine subsystems are checked one at a time: reactor, propulsion, limbs, cockpit, sensors, guidance, defense systems, communication array and locomotion. Each lesson's tests check one of them, and the schematic in the sandbox plays that subsystem passing or failing as the tests run.</p>
<p>The power-budget rules the first tests check are simple. Add up the loads in kilowatts, take a percentage off when the thrusters are throttled back, and add 5 kW from the starter cell when the load is under 50 kW.</p>
<p>The mental model to keep: <strong>a test arranges a situation, acts on the code, and asserts what should be true afterwards.</strong> If every assert holds, the test passes.</p>`,

notes:`<h2>On your own machine</h2>
<ul>
<li>Install uv once (see the uv link below). Everything else in this guide is installed per project by <code>uv add</code>.</li>
<li>In a real repository the tests usually live next to the application, in a folder called <code>tests/</code>, and share its pyproject.toml. A separate project, as here, is also common for browser tests, because they test the running application from outside and do not import its code.</li>
<li>You will normally run tests from your editor as well. VS Code and PyCharm both find pytest tests and put a run button beside each one. The terminal commands are still worth knowing, because they are what CI runs and what a coding agent will type.</li>

{id:2,sys:'propulsion',title:'Reading a failure',mins:12,setup:'l2',
idea:`
<p>A passing test tells you little. A failing test is where the value is, and pytest's failure report is dense. Once you can read it, you can usually name the bug without opening an editor. That is a useful skill when someone else, or a coding agent, wrote the code and you are deciding whether the fix is right.</p>
<dl class="terms">
<dt>Failure</dt><dd>An assert was false. The code ran, and gave the wrong answer. Shown as <code>F</code>.</dd>
<dt>Error</dt><dd>The test could not run properly at all: something it needed was missing, or its setup crashed. Shown as <code>E</code>. Lesson 3 produces one on purpose.</dd>
<dt>Assertion introspection</dt><dd>pytest's best trick. When an assert fails it shows the actual values on each side, and where each value came from. You write a plain <code>assert</code> and get a detailed explanation for free.</dd>
<dt>Node ID</dt><dd>The full address of one test: <code>file.py::test_name</code>. You can pass it to pytest to run just that test.</dd>
<dt>Red, green</dt><dd>Shorthand for failing and passing. The normal rhythm of work is: see a test go red, change the code, see it go green.</dd>
</dl>
<p>This lesson adds a test for the throttle-back rule, which belongs to propulsion. The rule says throttling back takes a percentage off the load. The code has a bug, and the test finds it.</p>`,

notes:`<h2>Who is wrong, the test or the code?</h2>
<p>A failing test only tells you that the test and the code disagree. Here the code was wrong. Lesson 7 has a case that goes the other way. Deciding which one is right is a product question as often as a technical one, and the test is useful precisely because it writes the expected behaviour down where everyone can read it.</p>
<h2>More ways to choose what runs</h2>
<ul>
<li><code>-x</code> stops at the first failure. Useful when one broken thing causes fifty failures.</li>
<li><code>-q</code> prints less: just the dots and the verdict.</li>
<li><code>--ff</code> runs everything, but the tests that failed last time go first.</li>
<li><code>-k</code> matches against the whole node ID, so <code>-k test_power</code> selects a file.</li>
</ul>`,

{id:3,sys:'limbs',title:'Fixtures and parameters',mins:14,setup:'l3',
idea:`
<p>Most tests need something prepared before they can start: some data, a signed-in user, an open browser. Copying that preparation into every test makes the suite long and fragile. pytest's answer is the <em>fixture</em>, and it is the single most important idea to carry into the browser lessons, because the browser itself arrives as a fixture.</p>
<dl class="terms">
<dt>Fixture</dt><dd>A function that prepares something a test needs and hands it over. A test asks for a fixture by listing its name as a parameter. That is the whole mechanism.</dd>
<dt>Setup and teardown</dt><dd>What a fixture does before the test (setup) and after it (teardown). A <code>yield</code> in the fixture separates the two.</dd>
<dt>conftest.py</dt><dd>A file pytest reads automatically. Fixtures defined there can be used by every test in the folder without importing anything.</dd>
<dt>Isolation</dt><dd>Each test gets its own fresh fixture, so one test cannot spoil another by changing shared data. Tests that depend on each other's leftovers are the commonest cause of suites that fail at random.</dd>
<dt>Parametrize</dt><dd>Run one test function several times with different inputs. Each set of inputs is reported as its own test.</dd>
</dl>
<p>The mental model: <strong>the parameters of a test function are a shopping list, and pytest goes and fetches each item before calling the test.</strong></p>`,

notes:`<h2>Fixture scope</h2>
<p>By default a fixture is rebuilt for every test: function scope. For something slow to create, you can ask for it to be built once and shared, with <code>@pytest.fixture(scope="session")</code>. The browser in the next lesson works that way: starting a browser takes about half a second, so it starts once, while each test still gets its own clean tab.</p>
<h2>Built-in fixtures</h2>
<p>pytest ships with several. The error message in step 2 listed them. Two worth knowing: <code>tmp_path</code> gives the test an empty temporary folder, and <code>monkeypatch</code> temporarily changes a setting or environment variable and puts it back afterwards.</p>`,

{q:'Two tests both use the arm_loads fixture, and the first one appends a load. What does the second test receive?',opts:['The list with the extra load','An empty list','A fresh list with the original three loads','An error'],a:2,why:'A function-scoped fixture runs again for each test. That isolation is the point.'},
{q:'A parametrized test has four rows and the third fails. What does the report show?',opts:['One failed test','Four failed tests','Three passed and one failed, each row named separately','Only the first failure, then it stops'],a:2,why:'Each row is its own test with its own name, such as test_starter[50-0], so you see precisely which input broke.'}],

{id:4,sys:'cockpit',title:'Driving a real browser',mins:14,setup:'l4',
idea:`
<p>Everything so far tested Python functions directly. That is the cheapest kind of test and you want many of them. But it cannot tell you whether the Queue check button works, because that depends on HTML, CSS, JavaScript, the API and the database all cooperating. A browser test checks the whole thing the way a pilot would: by using the site.</p>
<dl class="terms">
<dt>End-to-end test</dt><dd>A test that goes through the real user interface of a running application. Often shortened to E2E. Slower and more valuable per test than a unit test, so you write fewer of them.</dd>
<dt>Browser binary</dt><dd>Playwright does not use the Chrome on your machine. It downloads its own copies of Chromium, Firefox and WebKit (the engine behind Safari), at versions it has been tested against. This is a separate download from the Python package.</dd>
<dt>Headless</dt><dd>Running a browser with no window. The page is loaded, laid out and scripted exactly as normal; it is just not drawn on a screen. This is the default, and it is how CI runs.</dd>
<dt>Headed</dt><dd>The opposite: a visible window you can watch. Slower, and only for when you want to see what a test does.</dd>
<dt>page</dt><dd>A fixture supplied by the plugin: one browser tab, opened fresh for the test.</dd>
<dt>expect</dt><dd>Playwright's assertion function. Unlike a bare <code>assert</code>, it waits for the thing to become true. Lesson 6 is about why that matters.</dd>
</dl>
<p>The Kestrel's console is already running at <code>http://127.0.0.1:8000</code>. Browser tests need the application to be up: they do not start it for you.</p>`,

notes:`<h2>On your own machine</h2>
<ul>
<li><code>playwright install</code> downloads several hundred megabytes into <code>~/.cache/ms-playwright</code> on Linux, <code>~/Library/Caches/ms-playwright</code> on a Mac. It is shared between projects.</li>
<li>Each release of the playwright package expects specific browser builds. After upgrading the package you will see the boxed error again until you re-run <code>playwright install</code>.</li>
<li>On Linux, <code>playwright install --with-deps</code> also installs the system libraries browsers need. On a Mac or Windows you do not need it.</li>
<li>To test with the real Google Chrome instead of Chromium, add <code>--browser-channel chrome</code>.</li>
</ul>`,

{id:5,sys:'sensors',title:'Locators',mins:14,setup:'l5',
idea:`
<p>Before a test can click something it has to say <em>which</em> thing. That description is called a locator, and choosing locators well is most of the craft of browser testing. A poor locator breaks whenever a developer rearranges the page. A good one keeps working for as long as the page still makes sense to a user.</p>
<p>Playwright's advice is to describe elements the way a person, or a screen reader, would: "the button called Queue check", "the field labelled Email". As a designer you already think in those terms.</p>
<dl class="terms">
<dt>Locator</dt><dd>A description of how to find an element, such as <code>page.get_by_role("button", name="Sign in")</code>. It is not the element itself: Playwright looks the element up afresh every time the locator is used.</dd>
<dt>Role</dt><dd>What kind of thing an element is to assistive technology: button, link, heading, textbox, listitem, row. Proper HTML gives elements roles automatically. A <code>&lt;button&gt;</code> has the role button.</dd>
<dt>Accessible name</dt><dd>What a screen reader would call the element: a button's text, a field's label, an image's alt text.</dd>
<dt>Strict mode</dt><dd>An action such as click needs exactly one element. If the locator matches several, Playwright refuses to guess and fails with a "strict mode violation".</dd>
<dt>Test ID</dt><dd>An attribute, <code>data-testid</code>, added to the HTML purely so that tests can find an element. The fallback for elements with no role or text to hold on to.</dd>
<dt>CSS selector</dt><dd>A description by HTML structure and class names, like <code>ul > li:first-child button.btn-primary</code>. Possible, and discouraged, because it describes how the page is built, not what the user sees.</dd>
</dl>
<p>A side benefit: if a test cannot find the button by role and name, a screen-reader user probably cannot either. Role-based tests are a rough accessibility check that you get without extra work.</p>`,
widget:'locators',widgetTitle:'Try locators on the console\'s home page',
widgetIntro:'Pick a locator and see what it matches on the page. Strict mode needs exactly one match before it will click or type.',
labIntro:'The Chromium browser is installed and the home page tests pass. This lab writes a test that queues the Sensors check, and gets the locator wrong first.',
tasks:[
{what:'Add a test that clicks Queue check',cmd:CP('test_05_strict.py','test_sensors.py'),parts:cpParts('test_05_strict.py','test_sensors.py','A new test file.'),
 saw:'The test clicks get_by_role("button", name="Queue check"). Look at the home page in the widget above: how many buttons have that name?',test:(l,w)=>isStep(w,'test_sensors.py','test_05_strict.py')},
{what:'Run it',cmd:'uv run pytest test_sensors.py',parts:[['pytest test_sensors.py','Run the new file.']],
 saw:'"strict mode violation ... resolved to 9 elements". Playwright lists all nine, and after "aka" suggests a locator that would pick out each one. The Browser panel outlines the nine buttons it found.',test:(l,w,r)=>ranPy(r)&&r.meta.failed===1},
{what:'Narrow the locator',cmd:CP('test_05_fixed.py','test_sensors.py'),parts:cpParts('test_05_fixed.py','test_sensors.py','It replaces the test with a corrected one.'),
 saw:'The test now finds the list item that contains the text "Sensors", then looks for the button inside that item. It reads the way you would explain it to a person.',test:(l,w)=>isStep(w,'test_sensors.py','test_05_fixed.py')},
{what:'Run it, and watch',cmd:'uv run pytest test_sensors.py --headed',parts:[['--headed','Play the steps in the Browser panel.']],
 saw:'1 passed. One button outlined this time, the queue link changed to Queue (1), and a status message appeared. The test asserts both.',test:(l,w,r)=>ranPy(r)&&r.meta.passed===1&&r.meta.opts.headed},
{what:'Let Playwright write locators for you',cmd:'uv run playwright codegen --target python-pytest '+U,parts:[['playwright codegen','Open a browser and record what you do in it as test code.'],['--target python-pytest','Write the recording as a pytest test function.'],[U,'The page to start on.']],
 saw:'A recorded session, played in the Browser panel, and the code the recorder wrote. It chose role and test-ID locators by itself. Codegen is the quickest way to get a first draft and to find out what a good locator for an element looks like.',test:(l,w,r)=>r.meta.cmd==='codegen'}
],
notes:`<h2>Which locator to reach for</h2>
<ol>
<li><code>get_by_role</code>, with a name. Works for buttons, links, headings, form fields, rows, list items.</li>
<li><code>get_by_label</code> for form fields, <code>get_by_placeholder</code> if a field has no label.</li>
<li><code>get_by_text</code> for plain content such as a message or a paragraph.</li>
<li><code>get_by_test_id</code> when nothing above is stable, for example a reading that changes.</li>
<li><code>page.locator("css")</code> as a last resort.</li>
</ol>
<h2>Narrowing</h2>
<ul>
<li><strong>Chain</strong>: <code>row.get_by_role("button")</code> searches only inside what <code>row</code> matched.</li>
<li><strong>Filter</strong>: <code>.filter(has_text="Sensors")</code> keeps only the matches that contain that text.</li>
<li><code>.first</code>, <code>.last</code> and <code>.nth(2)</code> pick by position. They pass strict mode, and they break as soon as the order changes, so treat them as a smell.</li>
<li><code>exact=True</code> on a name or text turns off the default matching, which ignores case and accepts a partial match.</li>
</ul>
<h2>A note about the recording</h2>
<p>The recorder wrote <code>get_by_role("link", name="Queue (1)")</code>. That works today and breaks the moment the queue holds two checks. Recorded code is a draft: read each locator and ask whether it describes the element or just its state at the time.</p>`,
quiz:[
{q:'A click fails with "strict mode violation ... resolved to 9 elements". What is the right fix?',opts:['Add .first to the locator','Make the locator more specific, for example by filtering to the right list item','Increase the timeout','Turn strict mode off'],a:1,why:'The locator is ambiguous. Narrowing it to the intended element fixes the cause. .first would silence the error and click whichever element happens to come first.'},
{q:'Why does Playwright recommend get_by_role over a CSS selector?',opts:['It runs faster','It describes the element as a user perceives it, so it survives changes to markup and styling','CSS selectors do not work in Firefox','It is shorter to type'],a:1,why:'Roles and names are what the user and assistive technology see. Class names and nesting change in routine refactoring without the page changing at all.'},
{q:'When is get_by_test_id the appropriate choice?',opts:['Always: it is the most reliable','Never: it is deprecated','When an element has no stable role, label or text to locate it by','Only for buttons'],a:2,why:'Test IDs are stable but invisible to users, so they tell you nothing about usability. Use them where user-facing locators cannot do the job.'}],
reading:[
['Playwright: Locators',PW+'/locators','Every get_by_ method with examples, plus filtering and chaining.'],
['Playwright: Generating tests',PW+'/codegen-intro','Using codegen, and its Pick locator tool for finding a locator on a live page.'],
['Playwright: Other locators',PW+'/other-locators','CSS and XPath, and why they are the last resort.']]},

{id:6,sys:'guidance',title:'Actions and assertions that wait',mins:14,setup:'l6',
idea:`
<p>Web pages do not change instantly. You type in a search box and the results arrive a moment later. You press Sign in and the next page takes a few hundred milliseconds. A test runs far faster than a person, so it constantly arrives before the page is ready. Handling that badly is the main reason browser tests get a reputation for failing at random.</p>
<p>Playwright's answer is to wait for you, in two places.</p>
<dl class="terms">
<dt>Action</dt><dd>Something the test does to the page: <code>click()</code>, <code>fill("text")</code>, <code>press("Enter")</code>, <code>check()</code>, <code>select_option("Large")</code>.</dd>
<dt>Auto-waiting</dt><dd>Before an action, Playwright waits until the element exists, is visible, has stopped moving, and is enabled. You do not write any of that. If it does not happen within 30 seconds, the action fails.</dd>
<dt>Web-first assertion</dt><dd>An assertion written with <code>expect(...)</code>. It checks, and if the answer is no, checks again, and keeps going for up to 5 seconds. It passes the moment the condition becomes true.</dd>
<dt>Flaky test</dt><dd>A test that sometimes passes and sometimes fails with no change to the code. Nearly always a timing problem. A flaky suite is worse than no suite, because people learn to ignore red.</dd>
<dt>Timeout</dt><dd>How long Playwright keeps trying before giving up. A timeout is an upper limit, not a delay: when things are fast, nothing waits.</dd>
</dl>
<p>The rule that follows: <strong>never read a value from the page and compare it with a plain assert. Hand the locator to expect and let it do the waiting.</strong></p>`,
widget:'waiting',widgetTitle:'Three ways to check a page that is still loading',
widgetIntro:'A test types "nav" into the search box, and the console takes a moment to update the list. Drag the slider to make the console faster or slower, and see what each way of checking does.',
labIntro:'The console\'s search box updates the subsystem list about a third of a second after you stop typing. That small delay is enough to break a carelessly written test.',
tasks:[
{what:'Add a search test with a plain assert',cmd:CP('test_06_flaky.py','test_guidance.py'),parts:cpParts('test_06_flaky.py','test_guidance.py','A new test file.'),
 saw:'The test types "nav", then reads the number of list items with .count() and compares it with 2 using a bare assert.',test:(l,w)=>isStep(w,'test_guidance.py','test_06_flaky.py')},
{what:'Run it',cmd:'uv run pytest test_guidance.py',parts:[['pytest test_guidance.py','Run the new file.']],
 saw:'"assert 9 == 2". The count was taken a few milliseconds after typing, before the list had updated, so all nine subsystems were still there. In the steps panel, the count step says it looked once. On a faster console this would pass, which is exactly what makes it flaky.',test:(l,w,r)=>ranPy(r)&&r.meta.failed===1},
{what:'Replace it with assertions that wait',cmd:CP('test_06_search.py','test_guidance.py'),parts:cpParts('test_06_search.py','test_guidance.py','It replaces the test file with three tests that use expect.'),
 saw:'The count is now checked with expect(...).to_have_count(2). Two more tests were added: a search with no results, and signing in.',test:(l,w)=>isStep(w,'test_guidance.py','test_06_search.py')},
{what:'Run them',cmd:'uv run pytest test_guidance.py -v',parts:[['-v','One line per test.']],
 saw:'3 passed. Tap test_search_finds_nav_systems in the Test run panel: its to_have_count step says it was not true at first and became true after a few hundred milliseconds. It waited exactly as long as needed.',test:(l,w,r)=>ranPy(r)&&r.meta.passed===3},
{what:'Watch the search test',cmd:'uv run pytest test_guidance.py::test_search_finds_nav_systems --headed --slowmo 600',parts:[['test_guidance.py::test_search_finds_nav_systems','One test, by address.'],['--headed --slowmo 600','Play it step by step.']],
 saw:'After the text is typed, the list still shows nine subsystems. By the assertion it shows two.',test:(l,w,r)=>ranPy(r)&&r.meta.opts.headed&&r.meta.ids.length===1},
{what:'Watch the sign-in test',cmd:'uv run pytest -k sign_in --headed --slowmo 600',parts:[['-k sign_in','Select by keyword.']],
 saw:'Two fields filled by their labels, one button clicked by its name, and two assertions: the address changed to /account, and a welcome heading is visible. Asserting on the result the user sees is better than asserting on anything internal.',test:(l,w,r)=>ranPy(r)&&r.meta.opts.headed&&/sign_in/.test(r.meta.opts.k||'')},
{what:'Run the whole suite',cmd:'uv run pytest',parts:[['pytest','Everything.']],
 saw:'16 passed.',test:(l,w,r)=>ranPy(r)&&r.meta.passed===16&&!r.meta.opts.paths.length}
],
notes:`<h2>The assertions you will use most</h2>
<table class="types"><tr><th>Assertion</th><th>True when</th></tr>
<tr><td><code>to_be_visible()</code></td><td>The element is on the page and a user could see it</td></tr>
<tr><td><code>to_have_text("…")</code></td><td>The element's text is exactly this</td></tr>
<tr><td><code>to_contain_text("…")</code></td><td>The element's text includes this</td></tr>
<tr><td><code>to_have_count(3)</code></td><td>The locator matches exactly three elements</td></tr>
<tr><td><code>to_have_value("…")</code></td><td>A form field holds this value</td></tr>
<tr><td><code>to_be_enabled()</code>, <code>to_be_checked()</code></td><td>The control is in that state</td></tr>
<tr><td><code>expect(page).to_have_url(…)</code></td><td>The tab is at this address</td></tr>
<tr><td><code>expect(page).to_have_title(…)</code></td><td>The tab has this title</td></tr></table>
<p>Every one has a negative form: <code>expect(x).not_to_be_visible()</code>.</p>
<h2>What not to write</h2>
<ul>
<li><code>time.sleep(2)</code>, or <code>page.wait_for_timeout(2000)</code>. A fixed wait is too long when the page is fast and too short on the day it is slow.</li>
<li><code>assert page.get_by_text("Saved").is_visible()</code>. <code>is_visible()</code> answers immediately, yes or no. It looks like the expect version and does not wait.</li>
<li><code>assert locator.count() == 2</code>, as you saw.</li>
</ul>`,
quiz:[
{q:'Why did "assert page.get_by_role(\'listitem\').count() == 2" fail when the console does return two results?',opts:['count() is broken','The locator was wrong','count() looked once, immediately, before the list had updated','The console was down'],a:2,why:'A plain read happens at once and is never repeated. The list updated a fraction of a second later, after the assert had already failed.'},
{q:'expect(locator).to_have_count(2) has a 5 second timeout. The list updates after 300 ms. How long does the assertion take?',opts:['5 seconds','About 300 ms','It fails','Exactly 1 second'],a:1,why:'The timeout is a limit. expect re-checks until the condition holds and returns as soon as it does.'},
{q:'A test passes on your laptop and fails about one run in ten on CI. What is the most likely cause?',opts:['CI uses a different programming language','A timing assumption: something read from the page before it was ready','Too many tests','The test is too short'],a:1,why:'CI machines are slower and busier, so anything that depends on the page being ready "by now" fails there first. Look for bare asserts on page values and for fixed sleeps.'}],
reading:[
['Playwright: Auto-waiting',PW+'/actionability','Exactly which checks each action makes before it acts.'],
['Playwright: Assertions',PW+'/test-assertions','The full list of expect assertions, and how to change the timeout.'],
['Playwright: Actions',PW+'/input','Typing, clicking, checkboxes, dropdowns, uploads and keyboard shortcuts.']]},

{id:7,sys:'defense',title:'When a browser test fails',mins:14,setup:'l7',
idea:`
<p>A failed function test gives you two numbers to compare. A failed browser test raises a harder question: what was on the screen? The test ran headless, perhaps on a CI machine that no longer exists. Playwright can record evidence as a test runs, so that you can look afterwards.</p>
<dl class="terms">
<dt>Trace</dt><dd>A recording of one test: every action, a snapshot of the page before and after each, the network requests, and the console output. Saved as a single <code>trace.zip</code>.</dd>
<dt>Trace Viewer</dt><dd>The program that opens a trace. It shows a timeline of the test's steps; you click a step and see the page as it was at that moment. It is the main debugging tool for browser tests.</dd>
<dt>Screenshot</dt><dd>One image of the page, usually taken at the moment of failure. Quick to glance at, and much less informative than a trace.</dd>
<dt>Video</dt><dd>A recording of the whole test. Occasionally useful for animations. Traces are usually better.</dd>
<dt>test-results</dt><dd>The folder where these files are written, one sub-folder per test. It is emptied at the start of every run.</dd>
<dt>retain-on-failure</dt><dd>Record for every test, and keep the file only if the test failed. The setting to use by default: evidence when you need it, no clutter when you do not.</dd>
</dl>
<p>This lesson also has the case promised in lesson 2: a failure where the application is behaving correctly and the <em>test</em> is wrong.</p>`,

notes:`<h2>Other ways to look</h2>
<ul>
<li><code>--headed --slowmo 500</code>, as in the earlier lessons, to watch a test run.</li>
<li><code>PWDEBUG=1 uv run pytest test_defense.py</code> opens the browser with the Playwright Inspector attached and pauses before the first action. You step through one action at a time.</li>
<li>Put <code>page.pause()</code> on a line of the test to stop there with the Inspector open, then poke at the page yourself.</li>
<li><a href="https://trace.playwright.dev" target="_blank" rel="noopener">trace.playwright.dev</a> is the Trace Viewer as a web page. Drop a trace.zip onto it. The file is opened in your browser and not uploaded. Useful for a trace downloaded from CI.</li>
</ul>
<h2>Three questions to ask of any failure</h2>
<ol>
<li><strong>Did the element exist?</strong> "element(s) not found" means the page was not what the test thought, or the locator is wrong.</li>
<li><strong>Did the value keep changing, or stay the same?</strong> The call log shows how many times it looked. A steady wrong value is a real disagreement. A value that was still changing is a timing problem.</li>
<li><strong>Who is right?</strong> Check the expected behaviour against the requirement, not against whichever of the two was written first.</li>
</ol>`,
quiz:[
{q:'What does --tracing retain-on-failure do?',opts:['Records only after a test has failed once','Records every test, and keeps the trace only for those that fail','Retries failed tests','Prints more detail in the terminal'],a:1,why:'It has to record from the start, because it cannot know in advance which test will fail. Passing tests\' traces are deleted.'},
{q:'The call log says "14 × locator resolved to <strong>25.5 kW</strong>, unexpected value". What does that tell you?',opts:['The element was never found','The page showed the same wrong value on every check, so more waiting would not help','The test ran 14 times','The locator matched 14 elements'],a:1,why:'Found every time, same value every time. This is a genuine disagreement between test and application, not a timing issue.'},
{q:'The trace shows the application behaving as the requirements say, and the test expecting something else. What should change?',opts:['The application, so the test passes','The test','Both','Neither: mark the test as skipped'],a:1,why:'A test encodes an expectation. If the expectation was mistaken, correct it. Changing correct behaviour to satisfy a wrong test would introduce a bug.'}],

['Playwright: Trace viewer',PW+'/trace-viewer-intro','Recording and opening traces, and a tour of the viewer\'s panels.'],
['Playwright: Debugging tests',PW+'/debug','The Inspector, PWDEBUG, page.pause() and headed mode.'],
['Playwright: Pytest plugin reference',PW+'/test-runners','The --tracing, --screenshot, --video and --output options.']]},

{id:8,sys:'comms',title:'Fixtures for browser tests',mins:14,setup:'l8',
idea:`
<p>Lesson 3 said the browser would arrive as a fixture. Now that you have used <code>page</code> for four lessons, it is worth seeing what stands behind it, because the same machinery lets you write your own: a page that is already signed in, for example, so that twenty tests do not each repeat the sign-in steps.</p>
<dl class="terms">
<dt>Browser</dt><dd>The Chromium process. Slow to start, so the plugin starts it once per run and every test shares it.</dd>
<dt>Browser context</dt><dd>An isolated browser profile inside that process, like a fresh incognito window. It has its own cookies, storage and cache. The plugin creates a new one for every test, which takes a few milliseconds.</dd>
<dt>Page</dt><dd>One tab in a context. The <code>page</code> fixture is a tab in a brand new context.</dd>
<dt>Base URL</dt><dd>The address of the site under test, set once in configuration. Tests then write <code>page.goto("/queue")</code>, and the same tests can run against your laptop, a staging server or production by changing one setting.</dd>
<dt>pytest.ini</dt><dd>pytest's configuration file. Settings and default command-line options go here, so that everyone, and CI, runs the tests the same way.</dd>
</dl>
<p>Because each test has its own context, tests cannot leak into each other: one test signing in does not sign the next one in, and checks in one test's queue are not in another's. That is the browser version of the fresh arm_loads fixture from lesson 3.</p>`,

notes:`<h2>Signing in once instead of every time</h2>
<p>The fixture here signs in through the form for each test that needs it. That is simple and fine for a few tests. With hundreds it adds up. The usual upgrade is to sign in once, save the browser's cookies to a file with <code>context.storage_state(path="auth.json")</code>, and have every later context start from that file. The Authentication page below shows the pattern.</p>
<h2>Preparing data through the API</h2>
<p>A browser test should use the UI for the thing it is testing, and nothing else. If a test of the mission log needs a mission to exist, creating it by clicking through the whole console is slow and adds ways to fail. Playwright can call your API directly: the <code>playwright</code> fixture has a <code>request</code> object that sends HTTP requests, so a fixture can <code>POST /missions</code> in a few milliseconds and the test can start on the mission log.</p>
<h2>Changing the base URL</h2>
<p><code>uv run pytest --base-url https://staging.example.com</code> overrides pytest.ini for one run. That is how the same suite checks a deployed environment.</p>
<h2>Page objects</h2>
<p>When many tests use the same screen, people often wrap its locators in a small class, a <em>page object</em>, so a change to the screen is fixed in one place. You will see this in larger suites. It is an organising habit, not a Playwright feature.</p>`,
quiz:[
{q:'What does each test get from the page fixture?',opts:['The same tab as the previous test, to save time','A new tab in a new, isolated browser context','A new browser process','A screenshot of the page'],a:1,why:'The browser process is shared, and each test gets its own context with its own cookies and storage, so tests cannot affect each other.'},
{q:'A test fails with "Cannot navigate to invalid URL" on page.goto("/queue"). What is missing?',opts:['The queue page','A base URL, in pytest.ini or with --base-url','The browser binary','A trailing slash'],a:1,why:'A path alone is not an address. With base_url set, Playwright joins the two.'},
{q:'In --setup-show output, the browser fixture is marked S and the page fixture F. What does that mean?',opts:['S is slow, F is fast','S succeeded, F failed','browser is created once for the whole session; page is created for each test function','S is synchronous, F is a function'],a:2,why:'S and F are fixture scopes: session and function. Expensive things are session-scoped and shared; anything that must be clean is function-scoped.'}],

{id:9,sys:'locomotion',title:'The whole suite, and CI',mins:14,setup:'l9',
idea:`
<p>Tests that only run when someone remembers to run them stop being run. The last step is to have a machine run them on every change, and to make that run trustworthy and its failures easy to investigate. You have every piece already. This lesson arranges them.</p>
<dl class="terms">
<dt>CI</dt><dd>Continuous integration: a service that runs your checks on a clean machine whenever code is pushed. GitHub Actions is the one built into GitHub.</dd>
<dt>Marker</dt><dd>A label on a test, written as a decorator: <code>@pytest.mark.smoke</code>. You then run just the tests with that label using <code>-m smoke</code>.</dd>
<dt>Smoke test</dt><dd>One of a handful of quick tests that answer "is the thing basically working?" The name comes from switching a device on and seeing whether smoke comes out. Run them first, and after every deploy.</dd>
<dt>addopts</dt><dd>A pytest.ini setting holding command-line options that are added to every run. It is how you make tracing on failure the default for everyone.</dd>
<dt>Cross-browser</dt><dd>Running the same tests in more than one engine. Chromium covers Chrome and Edge, WebKit covers Safari, Firefox is Firefox.</dd>
<dt>Artifact</dt><dd>In CI, a file saved from a run so that you can download it afterwards. Here: the test-results folder with its traces.</dd>
</dl>`,

notes:`<h2>Reviewing browser tests someone else wrote</h2>
<p>If a coding agent or a colleague writes the tests and you review them, these are the things worth checking. Each one maps to a lesson.</p>
<ul>
<li><strong>Does every test assert something a user would notice?</strong> A test that clicks through a flow and asserts nothing passes forever. (Lesson 1)</li>
<li><strong>Are the locators roles, labels and text?</strong> Long CSS selectors, XPath, and <code>.nth()</code> or <code>.first</code> are fragile. (Lesson 5)</li>
<li><strong>Is every check on the page made with <code>expect</code>?</strong> Search for <code>time.sleep</code>, <code>wait_for_timeout</code>, <code>.is_visible()</code> and <code>.count()</code> inside a bare assert. (Lesson 6)</li>
<li><strong>Can each test run alone, and in any order?</strong> Try one by its node ID. A test that only passes after another one is relying on leftovers. (Lessons 3 and 8)</li>
<li><strong>Is repeated setup in a fixture?</strong> The same eight sign-in lines pasted into ten tests should be one fixture. (Lesson 8)</li>
<li><strong>Do the names say what is being promised?</strong> <code>test_missions_need_a_sign_in</code> is a requirement you can check against the spec. <code>test_missions_2</code> is not.</li>
<li><strong>Was a failing test "fixed" by weakening it?</strong> Watch for an assertion that was deleted, or an exact text check that became a loose one, in the same change that made a test pass. (Lesson 7)</li>
</ul>
<h2>Making the suite faster</h2>
<ul>
<li>Add the <code>pytest-xdist</code> package and run <code>uv run pytest -n auto</code> to spread tests across your CPU cores. This works only because every test is isolated.</li>
<li>Keep the proportions sensible: many function-level tests, a moderate number of API tests, and a few dozen browser tests covering the journeys that matter most.</li>
</ul>
<h2>Retries</h2>
<p>The <code>pytest-rerunfailures</code> package adds <code>--reruns 2</code>, which re-runs a failed test before reporting it. It is reasonable in CI as a guard against a network blip. It is not a cure for flaky tests: a test that needs retries to pass has a timing bug, and lesson 6 is how you fix it.</p>
<h2>About the workflow file</h2>
<p>The version numbers after <code>@</code> go out of date. Check each action's page for its current major version when you set this up. The step that starts the application will also be specific to your project.</p>`,
quiz:[
{q:'What does uv run pytest -m smoke do?',opts:['Runs tests whose name contains "smoke"','Runs only tests decorated with @pytest.mark.smoke','Runs the tests more slowly','Marks every test as smoke'],a:1,why:'-m selects by marker. -k is the one that matches names.'},
{q:'Why put --tracing retain-on-failure in addopts instead of typing it when needed?',opts:['It makes tests faster','So the evidence exists the first time a test fails, including on CI, without anyone having to re-run it','pytest requires it','It hides warnings'],a:1,why:'A failure on CI may be hard to reproduce. With tracing as a default, the trace of that very failure is already saved.'},
{q:'In the workflow, why does the upload step have "if: ${{ !cancelled() }}"?',opts:['To skip uploading when tests pass','So the traces are uploaded even though the pytest step failed','To cancel slow runs','It is required syntax for every step'],a:1,why:'By default, a failed step stops the job, so the upload would be skipped exactly when there are traces to upload. This condition makes it run anyway.'}],
