      const zl=el('div',{class:'zlist'},items);next[key]=zl.textContent;
      const z=el('div',{class:'zone z-'+key},el('h3',{text:title}),el('div',{class:'zsub',text:sub}),zl,foot?el('div',{class:'zfoot',text:foot}):null);
      if(flash&&sig[key]!==undefined&&sig[key]!==next[key]){z.classList.add('flash');requestAnimationFrame(()=>requestAnimationFrame(()=>z.classList.remove('flash')));}
      map.append(z);return z;
    };
    /* actors and messages */
    const ai=[el('div',{class:'actors'},['user','client','as','rs'].map(k=>el('div',{class:'actor'+(v.lit.includes(k)?' on':'')},el('b',{text:ACT[k][0]}),el('span',{text:ACT[k][1]}))))];
    if(!v.msgs.length)ai.push(el('span',{class:'empty',text:'no messages yet: every request you send shows up here as a line'}));
    else ai.push(el('ol',{class:'seq','aria-label':'Recent messages'},v.msgs.map(m=>el('li',{class:(m.fresh?'new':'')+(m.bad?' bad':'')},el('span',{class:'sq-hop',text:SHORT[m.from]+' → '+SHORT[m.to]}),el('span',{text:m.text})))));
    zone('actors','Who is talking to whom','the four parties, and the latest messages between them (newest at the bottom)',ai);
    /* what the app holds */
    const hi2=[];
    if(!v.held.length)hi2.push(el('span',{class:'empty',text:'nothing yet: values you store with NAME=$(…) appear here'}));
    v.held.forEach(h=>hi2.push(el('div',{class:'rowi held'},
      el('div',{class:'row'},el('b',{text:'$'+h.name}),el('span',{class:'sub',text:h.label}),h.status?el('span',{class:'pill '+(h.cls||'off'),text:h.status}):null),
      h.chips.length?el('span',{class:'chips'},h.chips.map(c=>chip(c,'ix'))):null,
      el('span',{class:'sub',text:h.sub||h.value}))));
    if(v.redirect)hi2.push(kv('last redirect the browser followed',el('span',{class:'sub',text:v.redirect.url})));
    zone('held','What the app is holding','shell variables in this terminal',hi2);
    /* inside the token */
    const J=v.jwt,ji=[];
    if(!J)ji.push(el('span',{class:'empty',text:'no token looked at yet'}));
    else{
      ji.push(el('div',{class:'tokmini'},el('span',{class:'t-h',text:'header'}),'.',el('span',{class:'t-p',text:'payload'}),'.',el('span',{class:'t-s',text:J.sigLen?'signature':'(empty)'})));
      ji.push(kv('header',el('code',{class:'t-h jline',text:JSON.stringify(J.h)})));
      const pre=el('pre',{class:'rbody',tabindex:'0','aria-label':'Token payload'});
      Object.keys(J.p).forEach(k=>{const val=J.p[k];let note='';
        if(k==='exp')note=val>J.now?'  ← '+fmtTime(val).slice(11)+', in '+fmtSpan(val-J.now):'  ← expired '+fmtSpan(J.now-val)+' ago';
        else if(k==='iat'||k==='auth_time')note='  ← '+fmtTime(val).slice(11);
        else if(k==='aud')note='  ← who it is for';else if(k==='sub')note='  ← who it is about';else if(k==='iss')note='  ← who signed it';
        pre.append(el('span',{class:'t-p',text:JSON.stringify(k)+': '+JSON.stringify(val)}),el('span',{class:'jn'+(k==='exp'&&val<=J.now?' bad':''),text:note}),'\n');});
      ji.push(kv('payload (claims)',pre));
      const vd=J.verdict||{};
      ji.push(kv('signature',el('span',{class:'row'},el('span',{class:'pill '+(vd.ok===true?'ok':vd.ok===false?'bad':'warn'),text:vd.ok===true?'checked':vd.ok===false?'rejected':'not checked'}),el('span',{class:'sub',text:(J.sigLen?J.sigLen+' characters. ':'')+(vd.text||'')}))));
    }
    zone('jwt','Inside the token',J?J.label:'decoded header and claims',ji);
    /* last request */
    const Lr=v.last,xi=[];
    if(!Lr)xi.push(el('span',{class:'empty',text:'nothing yet: send a request with curl'}));
    else{
      xi.push(el('div',{class:'xreq',text:Lr.m+' '+Lr.hostname+Lr.path}));
      if(Lr.auth)xi.push(el('span',{class:'sub',text:'carrying:'+Lr.auth.replace(' +','')}));
      if(Lr.sent)xi.push(el('span',{class:'sub',text:'form: '+(Lr.sent.length>110?Lr.sent.slice(0,110)+'…':Lr.sent)}));
      xi.push(el('ol',{class:'xsteps'},Lr.trace.map(s=>el('li',{class:s.skip?'skip':s.ok?'':'no',text:s.t}))));
      const cls=Lr.status>=400?(Lr.status===403?'warn':'bad'):Lr.status>=300?'re':'ok';
      xi.push(el('div',{class:'row'},el('span',{class:'pill '+cls,text:Lr.status+' '+Lr.phrase}),el('span',{class:'sub',text:Lr.status===401?'who are you?':Lr.status===403?'known, and not allowed':Lr.status>=400?'the request was refused':Lr.status>=300?'look elsewhere':'success'})));
      let body=Lr.json!==undefined?JSON.stringify(Lr.json,(k,x)=>typeof x==='string'&&x.length>64?x.slice(0,30)+'…'+x.slice(-8):x,2):Lr.body;
      if(body){const ls=body.split('\n');if(ls.length>26)body=ls.slice(0,26).join('\n')+'\n… '+(ls.length-26)+' more lines';xi.push(el('pre',{class:'rbody',tabindex:'0','aria-label':'Response body',text:body}));}
      else xi.push(el('span',{class:'sub',text:'(no body)'}));
    }
    zone('exchange','Last request','every check the server made, in order',xi);
    /* the authorization server's memory */
    const si=[];
    si.push(kv('registered clients',el('span',{class:'chips'},v.clients.map(c=>chip(c.id+(c.type==='public'?' · public':c.grants[0]==='client_credentials'?' · machine':' · has secret'),c.type==='public'?'vol':'net')))));
    si.push(kv('signing key',el('span',{class:'row'},chip(v.kid,'port'),el('span',{class:'sub',text:'private half stays here; public half is in the JWKS'}))));
    si.push(kv('authorization codes issued',v.codes.length?v.codes.map(c=>el('div',{class:'row'},el('b',{text:c.code}),el('span',{class:'pill '+(c.state==='unused'?'ok':c.state==='used'?'off':'bad'),text:c.state}),c.pkce?chip('PKCE','ix'):null,el('span',{class:'sub',text:c.client}))):el('span',{class:'sub',text:'none'})));
    si.push(kv('refresh tokens on file',v.refresh.length?v.refresh.map(r=>el('div',{class:'row'},el('b',{text:r.tok}),el('span',{class:'pill '+(r.state==='active'?'ok':r.state==='rotated'?'warn':'bad'),text:r.state+(r.replayed?', then replayed':'')}),el('span',{class:'sub',text:'family '+r.fam}))):el('span',{class:'sub',text:'none'})));
    zone('as','auth.shop.test','what the authorization server remembers',si,'api.shop.test remembers nothing about tokens: it checks each one from scratch');
    statusEl.textContent='sandbox clock '+v.clock;
    sig=next;
  }
  function reset(clearTerm){
    sim=createSim(L.setup);sig={};skipped.clear();runId++;busy=false;form.classList.remove('busy');input.disabled=false;if(clearTerm)term.textContent='';
    print('A simulated terminal. Nothing is installed or run on your device, and no request leaves this page. Press help for what the sandbox understands.','note');
    print(INTRO[L.setup]||'','note');
    drawTasks();drawMap(false);
  }
  let busy=false,runId=0;
  /* output arrives one line at a time, and the newest line is kept in view */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function showLine(text,cls){const d=el('div',{class:'tl '+(cls||''),text:text});term.append(d);term.scrollTop=term.scrollHeight;term.scrollLeft=0;return d;}
  async function printOut(text,cls,id){
    if(text==='')return;
    const lines=text.split('\n'),gap=Math.max(22,Math.min(100,2200/lines.length));
    for(let n=0;n<lines.length;n++){
      const ln=lines[n];
      if(ln.charCodeAt(0)===2){const ms=+ln.slice(1)||300;const d=showLine('…','wait');await sleep(ms);d.remove();}
      else{showLine(ln,cls);if(n<lines.length-1)await sleep(gap);}
      if(id!==runId)return;
    }
    await sleep(gap);
  }
  function keepInView(){if(WIDE.matches)return;const b=form.getBoundingClientRect();if(b.bottom>window.innerHeight||b.top<80)form.scrollIntoView({block:'end',behavior:'smooth'});}
  async function runLine(){
    if(busy)return;
    const raw=input.value,line=raw.trim();if(!line)return;input.value='';hist.push(line);hi=hist.length;
    print('$ '+line,'in');
    keepInView();
    let r;try{r=sim.exec(line);}catch(e){r={ok:false,out:'sandbox: could not run that ('+e.message+').',meta:{},stdout:''};}
    if(r.clear){term.textContent='';return;}
    const id=runId;busy=true;form.classList.add('busy');input.disabled=true;
    await printOut(r.out,r.ok?'':'err',id);
    if(id!==runId)return;
    busy=false;form.classList.remove('busy');input.disabled=false;
    if(cur<tasks.length){
      const l=norm(line);let pass=false,jump=0;try{pass=!!tasks[cur].test(l,sim.world,r);}catch(e){}
      /* ran a later step's command: move on to it and mark the ones in between as skipped */
      if(!pass)for(let k=cur+1;k<tasks.length;k++){let ok=false;try{ok=l===norm(tasks[k].cmd)&&!!tasks[k].test(l,sim.world,r);}catch(e){}
        if(ok){for(let s=cur;s<k;s++)skipped.add(s);jump=k-cur;cur=k;pass=true;break;}}
      /* went back to a skipped step: tick it off */
      if(!pass)for(const s of [...skipped]){let ok=false;try{ok=l===norm(tasks[s].cmd)&&!!tasks[s].test(l,sim.world,r);}catch(e){}
        if(ok){skipped.delete(s);print('✓ Step '+(s+1)+' of '+tasks.length+' done. '+tasks[s].saw,'ok');drawTasks();break;}}
      if(pass){
        const t=tasks[cur];cur++;
        print('✓ Step '+cur+' of '+tasks.length+' done'+(jump?' ('+jump+' earlier step'+(jump>1?'s':'')+' skipped). ':'. ')+t.saw,'ok');
        if(cur>=tasks.length){saved.done[L.id]=true;save();renderNav(L.id);print('✓ Lesson '+L.id+' lab complete.','ok');}
        drawTasks();
        if(WIDE.matches){const n=$('.task.now',list)||banner;if(n.scrollIntoView)n.scrollIntoView({block:'nearest'});}
      }else if(!r.ok){
        const lj=sim.world.last&&sim.world.last.tick===sim.world.tick?sim.world.last.json:null;
        if(lj&&lj.error==='invalid_grant'&&/code/.test(lj.error_description||'')&&/already|not valid|expired/.test(lj.error_description))print('Hint: authorization codes work once. Run the open command again to get a fresh one, and use the code it prints.','note');
        else print('Hint: read the message above. This step is waiting for: '+tasks[cur].cmd,'note');
      }
    }
    drawMap(true);
    if(WIDE.matches)input.focus();
    requestAnimationFrame(keepInView);
  }
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();runLine();}
    else if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);input.value=hist[hi];}
    else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);input.value=hist[hi]||'';}
  });
  if(sec&&tasks.length)sec.append(el('p',{text:L.labIntro}),list,banner);
  const bench=el('div',{class:'bench-in'},
    el('section',{class:'map','aria-label':'What every party is doing right now'},el('div',{class:'map-head'},el('b',{text:'Who knows what, right now'}),statusEl),map),
    stepbar,
    el('section',{class:'term','aria-label':'Terminal'},el('div',{class:'term-bar'},el('span',{text:'Terminal (simulated)'}),el('span',{class:'row'},el('button',{type:'button',class:'mini dark',text:'help',onclick:()=>{if(!busy)print(sim.help,'note');}}),el('button',{type:'button',class:'mini dark',text:'reset',onclick:()=>{if(cur<tasks.length)cur=0;reset(true);}}))),term,form));
  reset(false);
  return bench;
}

/* ----- quiz ----- */
function quiz(L,sec){
  L.quiz.forEach((q,i)=>{
    const key=L.id+'-'+i,fb=el('p',{class:'fb','aria-live':'polite'}),opts=el('div',{class:'opts'});
    function draw(){
      const ch=saved.quiz[key];opts.textContent='';
      q.opts.forEach((o,k)=>opts.append(el('button',{type:'button',class:'opt'+(ch===k?(k===q.a?' right':' wrong'):''),'aria-pressed':String(ch===k),text:o,onclick:()=>{saved.quiz[key]=k;save();draw();renderNav(L.id);}})));
      fb.className='fb'+(ch==null?'':ch===q.a?' good':' bad');
      fb.textContent=ch==null?'':ch===q.a?'Correct. '+q.why:'Not quite. Have another look at the options, or re-read the section above.';
    }
    sec.append(el('div',{class:'q'},el('p',{class:'qt',text:(i+1)+'. '+q.q}),opts,fb));draw();
  });
}

/* ----- page ----- */
function mount(art,bench,slot){
  const main=$('#main'),old=benchEl;main.textContent='';if(old)old.remove();
  main.append(art);benchEl=bench;slotEl=slot;placeBench();
}
function showLesson(id){
  const L=LESSONS.find(x=>x.id===id)||LESSONS[0];
  const art=el('article',{}),slot=el('div',{class:'slot'}),ctx={};
  art.append(el('p',{class:'eyebrow',text:'Lesson '+L.id+' of '+LESSONS.length+' · about '+L.mins+' minutes'}),el('h1',{text:L.title}),el('section',{class:'prose',html:L.idea}));
  if(L.widget){const box=el('div',{class:'widget'});art.append(el('section',{},el('h2',{text:L.widgetTitle}),el('p',{text:L.widgetIntro}),box));W[L.widget](box,ctx);}
  const s=el('section',{class:'lab'},el('h2',{text:'Try it'}));art.append(s);const bench=lab(L,s,ctx);s.append(slot);
  if(L.notes)art.append(el('section',{class:'prose notes',html:L.notes}));
  const qs=el('section',{},el('h2',{text:'Check yourself'}));art.append(qs);quiz(L,qs);
  art.append(el('section',{},el('h2',{text:'Further reading'}),el('ul',{class:'reading'},L.reading.map(r=>el('li',{},el('a',{href:r[1],target:'_blank',rel:'noopener',text:r[0]}),el('span',{text:r[2]}))))));
  const prev=LESSONS.find(x=>x.id===L.id-1),next=LESSONS.find(x=>x.id===L.id+1);
  art.append(el('nav',{class:'pager','aria-label':'Lessons'},prev?el('a',{href:'#lesson-'+prev.id,class:'btn ghost',text:'← '+prev.title}):el('span'),next?el('a',{href:'#lesson-'+next.id,class:'btn',text:next.title+' →'}):el('a',{href:'#cheat-sheet',class:'btn',text:'Cheat sheet →'})));
  mount(art,bench,slot);renderNav(L.id);
}
function showCheats(){
  const box=el('div',{class:'widget'}),slot=el('div',{class:'slot'});
  const art=el('article',{},el('p',{class:'eyebrow',text:'reference'}),el('h1',{text:'Cheat sheet'}),el('p',{class:'prose',text:'Every request and term from the eight lessons. Words in capitals are placeholders for your own values, and AUTH stands for the authorization server\'s address. The sandbox here is free play, with every client and endpoint available.'}),box,el('section',{class:'slot-sec'},el('h2',{text:'Sandbox'}),slot));
  W.cheats(box);mount(art,lab({id:0,setup:'free'},null),slot);renderNav('cheats');

function route(){
  const h=location.hash.replace('#','');const m=/^lesson-(\d+)$/.exec(h);
  if(h==='cheat-sheet')showCheats();else showLesson(m?+m[1]:1);
  $('#main').scrollTop=0;window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
})();
