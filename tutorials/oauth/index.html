<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAuth from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right a live map of what the API is doing (code, routes, last request, server, data) above a terminal that changes it. One dark terminal world; on phones the map-and-terminal bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:attr(data-p) " ";color:var(--term-dim)}
.ran::before{content:attr(data-p) " ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-tables{border-top-color:var(--good)}.z-session{border-top-color:var(--accent)}.z-databases{border-top-color:var(--warn)}.z-roles{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-tables .zlist{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}

      if(s[i+1]==='('){let d=1,j=i+2,q=null;for(;j<s.length;j++){const ch=s[j];if(q){if(ch===q)q=null;}else if(ch==='"'||ch==="'")q=ch;else if(ch==='(')d++;else if(ch===')'){d--;if(!d)break;}}
        if(d)throw new ShErr("bash: unexpected EOF while looking for matching `)'");
        const r=pipeline(s.slice(i+2,j));if(r.err)subErr.push(r.err);cur+=r.stdout.replace(/\n+$/,'');i=j+1;return;}
      const m=/^\$\{(\w+)\}|^\$([A-Za-z_]\w*)/.exec(s.slice(i));
      if(m){const v=w.vars[m[1]||m[2]];cur+=v==null?'':v;i+=m[0].length;}else{cur+='$';i++;}
    };
    while(i<s.length){const ch=s[i];
      if(ch===' '||ch==='\t'){if(has){words.push(cur);cur='';has=false;}i++;}
      else if(ch==="'"){const j=s.indexOf("'",i+1);cur+=s.slice(i+1,j);has=true;i=j+1;}
      else if(ch==='"'){i++;has=true;while(i<s.length&&s[i]!=='"'){if(s[i]==='\\'&&'"\\$`'.includes(s[i+1])){cur+=s[i+1];i+=2;}else if(s[i]==='$')expand();else cur+=s[i++];}i++;}
      else if(ch==='\\'){cur+=s[i+1]||'';has=true;i+=2;}
      else if(ch==='$'){has=true;expand();}
      else{cur+=ch;has=true;i++;}
    }
    if(has)words.push(cur);return words;
  }
  function pipeline(line){
    const segs=splitTop(line);let stdin='',last=null;const errs=[],metas=[];
    for(let k=0;k<segs.length;k++){
      let words=tokenize(segs[k]);
      if(words[0]==='export')words=words.slice(1);
      if(!words.length){if(segs.length>1)throw new ShErr("bash: syntax error near unexpected token `|'");return {ok:true,stdout:'',err:'',meta:{cmd:''},metas:[]};}
      if(segs.length===1&&words.every(x=>/^[A-Za-z_]\w*=/.test(x))){words.forEach(x=>{const e=x.indexOf('=');w.vars[x.slice(0,e)]=x.slice(e+1);});return {ok:true,stdout:'',err:'',meta:{cmd:'assign',names:words.map(x=>x.slice(0,x.indexOf('=')))},metas:[]};}
      const r=runCmd(words,stdin);metas.push(r.meta);if(r.err)errs.push(r.err);stdin=r.out||'';last=r;
    }
    return {ok:metas.length>0&&errs.length===0&&last.ok,stdout:last.out||'',err:errs.join('\n'),meta:metas[0],metas};
  }
  const HELP=['This terminal is a simulation. It understands:','  curl [-s] [-i] [-X METHOD] [-H "Header: value"] [-d key=value] [-u id:secret] URL','  open "URL"                  send the browser to the authorization server (Ada signs in for you)','  jwt decode | verify | sign  a small helper for reading, checking and making JWTs','  jq . | jq -r .field         pretty-print JSON, or pull one field out of it','  NAME=value   NAME=$(command)   echo $NAME   env      shell variables','  base64 [-d]   basenc --base64url   cut -d. -f2   tr -d =   openssl rand -hex 32   openssl dgst -sha256 -binary','  sleep SECONDS               fast-forward the sandbox clock (tokens really expire)','  cat FILE   ls   date   clear','','Servers: https://auth.shop.test (authorization server) and https://api.shop.test (the API).','User: ada, password teatime.  Clients: shop-web / s3cr3t-web, shop-spa (public), report-job / s3cr3t-job.'].join('\n');
  function exec(line){
    line=line.trim();w.tick++;w.now+=3;subErr=[];
    if(line==='clear')return {ok:true,out:'',clear:true,meta:{cmd:'clear'},stdout:''};
    if(line==='help')return {ok:true,out:HELP,meta:{cmd:'help'},stdout:''};
    try{
      const r=pipeline(line);const errs=subErr.concat(r.err?[r.err]:[]).join('\n');
      const out=(errs?errs+(r.stdout?'\n':''):'')+r.stdout.replace(/\n$/,'');
      return {ok:r.ok&&!subErr.length,out,stdout:r.stdout.replace(/\n$/,''),meta:r.meta||{},metas:r.metas};
    }catch(e){if(e instanceof ShErr)return {ok:false,out:e.message,stdout:'',meta:{}};throw e;}
  }

  /* ----- starting state ----- */
  if(setup==='token'||setup==='free')w.files['ada.jwt']=issueAccess('ada','shop-web','orders:read')+'\n';
  if(setup==='web'||setup==='free')w.files['client.env']='# What auth.shop.test handed over when the Shop Web app was registered\nCLIENT_ID=shop-web\nCLIENT_SECRET=s3cr3t-web\nREDIRECT_URI=https://app.shop.test/callback\n';
  if(setup==='spa')w.files['client.env']='# What auth.shop.test handed over when the single-page app was registered\nCLIENT_ID=shop-spa\n# no CLIENT_SECRET: this app runs in the browser, where nothing stays secret\nREDIRECT_URI=https://spa.shop.test/callback\n';
  if(setup==='job')w.files['client.env']='# What auth.shop.test handed over when the nightly job was registered\nCLIENT_ID=report-job\nCLIENT_SECRET=s3cr3t-job\n';

  /* ----- what the status map shows ----- */
  function view(){
    const fresh=w.msgs.filter(m=>m.tick===w.tick),lit=new Set();fresh.forEach(m=>{lit.add(m.from);lit.add(m.to);});
    const held=Object.keys(w.vars).map(name=>{
      const v=w.vars[name],k=kind(v),o={name,kind:k,value:short(v,34),chips:[]};
      if(k==='access'||k==='id'||k==='jwt'){const t=readJwt(v);
        o.label=k==='access'?'access token':k==='id'?'ID token':'JWT ('+t.h.alg+')';
        if(t.p.exp!=null){const left=t.p.exp-w.now;o.cls=left>0?'ok':'bad';o.status=left>0?'valid for '+fmtSpan(left):'expired '+fmtSpan(-left)+' ago';}else{o.cls='warn';o.status='never expires';}
        if(t.p.scope)o.chips=String(t.p.scope).split(' ');
        o.sub=k==='id'?'for '+t.p.aud+', about '+t.p.sub:k==='access'?'for '+String(t.p.aud).slice(8)+(t.p.sub===t.p.client_id?', no user':', on behalf of '+t.p.sub):Object.keys(t.p).filter(x=>!['iat','exp'].includes(x)).map(x=>x+'='+t.p[x]).join(' ');
      }else if(k==='refresh'){const r=w.as.refresh.find(x=>x.tok===v);o.label='refresh token';o.cls=r.state==='active'?'ok':r.state==='rotated'?'warn':'bad';o.status=r.state==='active'?'active':r.state==='rotated'?'already used':'revoked';o.sub='opaque: only auth.shop.test can read it';}
      else if(k==='code'){const c=w.as.codes.find(x=>x.code===v);o.label='authorization code';o.cls=c.used?'warn':c.exp>w.now?'ok':'bad';o.status=c.used?'used':c.exp>w.now?'unused':'expired';}
      else if(k==='verifier'){o.label='PKCE code verifier';o.cls='ok';o.status='secret';o.sub='stays with the app until the token request';}
      else if(k==='challenge'){o.label='PKCE code challenge';o.cls='off';o.status='public';o.sub='SHA-256 of the verifier: safe to show';}
      else if(k==='response'){o.label='token response';let j={};try{j=JSON.parse(v);}catch(e){}o.sub='JSON holding: '+Object.keys(j).filter(x=>/token$/.test(x)).join(', ');}
      else if(k==='error'){o.label='error response';o.cls='bad';let j={};try{j=JSON.parse(v);}catch(e){}o.status=j.error||'error';}
      else{o.label='text';}
      return o;});
    return {clock:fmtTime(w.now).slice(11),lit:[...lit],msgs:w.msgs.slice(-7).map(m=>({from:m.from,to:m.to,text:m.text,bad:m.bad,fresh:m.tick===w.tick})),held,
      redirect:w.redirect,jwt:w.jwt?Object.assign({},w.jwt,{now:w.now}):null,last:w.last,
      clients:Object.values(CLIENTS),kid:KID,
      codes:w.as.codes.map(c=>({code:short(c.code,14),client:c.client,pkce:!!c.challenge,state:c.used?'used':c.exp>w.now?'unused':'expired'})),
      refresh:w.as.refresh.map(r=>({tok:short(r.tok,14),client:r.client,fam:r.fam,state:r.state,replayed:!!r.replayed}))};
  }
  return {world:w,exec,view,prompt:()=>'$',help:HELP};
}

{id:1,title:'Why tokens exist',mins:10,setup:'token',
idea:`
<p>Every API has to answer two questions about each request that arrives. <strong>Who is asking?</strong> That is <em>authentication</em>. <strong>Are they allowed to do this?</strong> That is <em>authorization</em>. The two words look alike and are abbreviated authn and authz, and most confusion about OAuth starts with mixing them up.</p>
<p>The oldest way to answer both is to send a username and password with every single request. It works, and it has four problems that get worse as a system grows:</p>
<ul>
<li>The password travels over the network constantly, so there are many chances to leak it.</li>
<li>Any app that wants to act for you has to be given your password. Think of a budgeting app that asks for your bank login.</li>
<li>A password is all or nothing. You cannot hand an app "read my orders" without also handing it "cancel my orders" and "change my address".</li>
<li>The only way to cut one app off is to change the password, which cuts every app off.</li>
</ul>
<p>OAuth replaces the password with a <em>token</em>. The closest everyday thing is a hotel key card. You prove who you are once, at the front desk. The desk gives you a card that opens your room and the gym, stops working on Friday, and can be cancelled without changing the locks. The door never sees your passport. It only checks the card.</p>
<p>This guide uses one small cast all the way through. Meet them now, because every later lesson is about who sends what to whom:</p>
<dl class="terms">
<dt>Ada</dt><dd>The user. She has an account, a password (<code>teatime</code>) and some orders.</dd>
<dt>The app</dt><dd>A program that wants to do something with Ada's orders. In the labs, your terminal plays the app.</dd>
<dt>auth.shop.test</dt><dd>The <em>authorization server</em>: the front desk. It is the only place Ada's password is ever typed, and the only thing that issues tokens.</dd>
<dt>api.shop.test</dt><dd>The API that holds the orders: the door. It checks tokens and never sees a password.</dd>
<dt>Access token</dt><dd>The key card: a string the app sends with each API request to show what it has been allowed to do.</dd>
<dt>Bearer token</dt><dd>A token that works for whoever holds ("bears") it, like cash. This is why tokens only ever travel over HTTPS.</dd>
<dt>Scope</dt><dd>One named permission carried by a token, such as <code>orders:read</code>.</dd>
</dl>
<p>The mental model to keep: <strong>a password proves who you are. A token shows what one particular app has been allowed to do, for a while.</strong></p>`,

notes:`
<h2>What to take from this</h2>
<ul>
<li><strong>401 and 403 are different answers.</strong> 401 Unauthorized is really "unauthenticated": no valid proof of identity. 403 Forbidden means the proof was fine and the permission was missing. You will read these two codes constantly when debugging.</li>
<li><strong>Encoding is not encryption.</strong> Base64 makes bytes safe to put in a header. It hides nothing. The same is true of the tokens in the next lesson.</li>
<li><strong>A token is limited three ways:</strong> in time (minutes, not forever), in power (scopes), and in reach (it works for one API). A password is limited in none of them.</li>
</ul>`,

{id:2,title:'Inside a JWT',mins:12,setup:'none',
idea:`
<p>A token can be built in two ways. An <em>opaque</em> token is a random string that means nothing by itself: the server that receives it has to look it up somewhere to learn what it stands for. A <em>self-contained</em> token carries the facts inside it, so the receiver can read them directly. The self-contained format almost everyone uses is the <strong>JSON Web Token</strong>, written JWT and usually pronounced "jot".</p>
<p>A JWT is three pieces of text joined by dots:</p>
<pre class="file"><span class="t-h">header</span>.<span class="t-p">payload</span>.<span class="t-s">signature</span></pre>
<ul>
<li>The <strong>header</strong> is a small JSON object saying how the token was signed.</li>
<li>The <strong>payload</strong> is a JSON object of <em>claims</em>: statements such as "this is about Ada" and "this stops working at 19:15".</li>
<li>The <strong>signature</strong> is a number computed from the first two parts and a key. Change one character of the header or payload and the signature no longer fits.</li>
</ul>
<p>Each part is written in <em>base64url</em>, the URL-safe cousin of the base64 you met in lesson 1. That leads to the single most important fact about JWTs: <strong>a JWT is signed, not encrypted.</strong> Anyone who holds one can read every claim in it. What they cannot do is change a claim without breaking the signature. So a JWT is a good place for "who" and "what is allowed", and a bad place for anything secret.</p>
<dl class="terms">
<dt>Claim</dt><dd>One name and value in the payload. Some names are standard and some are whatever the issuer chooses.</dd>
<dt><code>sub</code> (subject)</dt><dd>Who the token is about. Usually a user id.</dd>
<dt><code>iss</code> (issuer)</dt><dd>Who created and signed the token.</dd>
<dt><code>aud</code> (audience)</dt><dd>Who the token is meant for: which API should accept it.</dd>
<dt><code>exp</code> and <code>iat</code></dt><dd>Expiry time and issued-at time, as a count of seconds since 1 January 1970. Every language can convert these.</dd>
<dt>HS256</dt><dd>A signing method that uses one shared secret. The same secret both creates and checks the signature.</dd>
</dl>
<p>The mental model: <strong>a JWT is a postcard with a wax seal. Everyone can read the postcard. Only the holder of the seal could have made it.</strong></p>`,

notes:`

<li><strong>In code:</strong> every language has a JWT library (PyJWT in Python, jose in JavaScript). They all have a "decode without verifying" function. It is for debugging only.</li>
<li><strong>Names you will see:</strong> strictly, the signed format is called JWS, and there is an encrypted variant called JWE. In everyday speech "JWT" means the signed kind you just made.</li>

{id:3,title:'Why an API can trust a token',mins:12,setup:'token',
idea:`
<p>The token you made in lesson 2 had a weakness built in. With HS256, the secret that <em>checks</em> a signature is the same secret that <em>creates</em> one. So every API that can verify tokens can also mint them. In a system with one authorization server and ten APIs, that is ten extra places a token-forging secret can leak from.</p>
<p>Real systems fix this with a <strong>key pair</strong>. The authorization server keeps a <em>private key</em> and uses it to sign. It publishes the matching <em>public key</em>, which can only verify. Any API can download the public key and check signatures, and none of them can create one. The algorithm names you will see are <strong>RS256</strong> (RSA) and <strong>ES256</strong> (elliptic curve, same idea with shorter signatures).</p>
<dl class="terms">
<dt>JWKS</dt><dd>JSON Web Key Set: a public URL where the authorization server lists its current public keys.</dd>
<dt><code>kid</code></dt><dd>Key id. A label in the token's header saying which key in the set signed it, so keys can be replaced on a schedule without breaking anything.</dd>
<dt>Stateless verification</dt><dd>Checking a token using only the token and a public key, without calling any other server or database.</dd>
</dl>
<p>A valid signature is necessary and nowhere near enough. Before trusting a token, a careful API runs the same list every time:</p>
<ol>
<li><strong>Algorithm.</strong> Is <code>alg</code> the one I expect? The API decides this, never the token. Old libraries that believed the header could be tricked with <code>"alg":"none"</code>, a token with no signature at all.</li>
<li><strong>Signature.</strong> Does it match the public key named by <code>kid</code>?</li>
<li><strong>Issuer.</strong> Is <code>iss</code> the authorization server I trust?</li>
<li><strong>Audience.</strong> Is <code>aud</code> me? A token made for a different API must be refused, even if the same server signed it.</li>
<li><strong>Expiry.</strong> Is <code>exp</code> still in the future?</li>
<li><strong>Scope.</strong> Does the token carry the permission this particular route needs?</li>
</ol>
<p>The mental model: <strong>the API trusts no one it talks to. It trusts mathematics and a list of checks.</strong> The price of not phoning the authorization server is that a token cannot be taken back once issued, which is why access tokens live for minutes.</p>`,
labIntro:'You start with the same file as lesson 1: a real access token from auth.shop.test. Watch the Last request panel after each call to the API. It lists the six checks in order and shows which one stopped a bad token.',
tasks:[
{what:'Load the access token',cmd:'TOKEN=$(cat ada.jwt)',
 parts:[['TOKEN=$(cat ada.jwt)','Store the token from the file in a variable.']],
 saw:'$TOKEN holds an access token with about five minutes left.',
 test:(l,w)=>isK(w,'TOKEN','access')},
{what:'Read its header and claims',cmd:'jwt decode $TOKEN',
 parts:[['jwt decode $TOKEN','Decode without verifying.']],
 saw:'The header says RS256 and names a key, shop-2026-11. The payload has the full set: iss, sub, aud, scope, iat, exp. The signature is 342 characters, far longer than the HS256 one, because it is an RSA signature.',
 test:(l,w,r)=>r.meta.cmd==='jwt decode'},
{what:'Fetch the authorization server\'s public keys',cmd:'curl -s '+JWKS+' | jq .',
 parts:[P_S,[JWKS,'The JWKS address. Anyone may read it: it holds public keys only.'],P_JQ],
 saw:'One key, with the same kid as the token\'s header. n and e are the two numbers that make up an RSA public key. The private half is not here and never leaves auth.shop.test.',
 test:(l,w)=>got(w,'as','/.well-known/jwks.json',200)},
{what:'Verify the token against those keys',cmd:'jwt verify $TOKEN --jwks '+JWKS,
 parts:[['--jwks '+JWKS,'Fetch the key set from this address, pick the key whose kid matches the token, and check the signature with it.']],
 saw:'Valid, and you checked it without knowing any secret. This is exactly what the API does, except it downloads the keys once and keeps them.',
 test:(l,w,r)=>r.meta.cmd==='jwt verify'&&r.meta.valid===true},
{what:'Use the token',cmd:'curl -s '+BT+' '+U_API+'/orders | jq .',
 parts:[P_BEARER,P_JQ],
 saw:'Ada\'s orders. In the Last request panel, read the checks from top to bottom: algorithm, key, signature, issuer, audience, expiry, scope. No call to the authorization server and no database lookup was needed to know who is asking.',
 test:(l,w)=>got(w,'rs','/orders',200)},
{what:'Attack: write an unsigned token with every claim you want',cmd:'FORGED=$(jwt sign --alg none \'{"iss":"https://auth.shop.test","sub":"grace","aud":"https://api.shop.test","scope":"orders:read orders:write","exp":1999999999}\')',
 parts:[['--alg none','Produce a token whose header says "alg":"none" and whose signature is empty.'],['"sub":"grace"','Claim to be a different customer.'],['"exp":1999999999','Claim to be valid until the year 2033.']],
 saw:'The claims are perfect: right issuer, right audience, more scope, another user. Only the signature is missing.',
 test:(l,w)=>{const t=w.readJwt(w.vars.FORGED||'');return !!t&&t.h.alg==='none';}},
{what:'Send the forged token to the API',cmd:'curl -i -H "Authorization: Bearer $FORGED" '+U_API+'/orders',
 parts:[['-H "Authorization: Bearer $FORGED"','Present the forged token exactly as a real one would be presented.']],
 saw:'401 invalid_token. The API stopped at the very first check, the algorithm, and never looked at the claims. An API that had trusted the header would have handed over Grace\'s orders.',
 test:(l,w)=>got(w,'rs','/orders',401)},
{what:'Let ten minutes pass',cmd:'sleep 600',
 parts:[['sleep 600','Wait 600 seconds. The sandbox fast-forwards its clock instead of making you wait, and the clock at the top of the panel jumps.']],
 saw:'The sandbox clock moved ten minutes. In the panel, $TOKEN has turned from valid to expired, although nothing about the token itself changed.',
 test:(l,w,r)=>r.meta.cmd==='sleep'&&isK(w,'TOKEN','access')&&w.readJwt(w.vars.TOKEN).p.exp<w.now},
{what:'Use the real token again',cmd:'curl -i '+BT+' '+U_API+'/orders',
 parts:[P_BEARER],
 saw:'401 again, for a different reason: the signature is still perfect, and the expiry check failed. A stolen copy of this token would now be worthless too, which is the whole point of short lifetimes.',
 test:(l,w)=>got(w,'rs','/orders',401)}
],
notes:`
<h2>The other design: ask the issuer</h2>
<p>Stateless checking is fast and has one cost: until <code>exp</code> passes, a signed token stays valid even if the user has logged out or been banned. Systems that cannot accept that use <em>opaque</em> tokens and a standard endpoint called <strong>introspection</strong>: the API sends each token to the authorization server and asks "is this still good?". That is one extra network call per request in exchange for instant revocation. Many systems mix the two: JWTs with a five-minute life for ordinary calls, and an introspection check before anything dangerous.</p>
<p>The sandbox has an introspection endpoint if you want to see one answer: <code>curl -s https://auth.shop.test/introspect -u shop-web:s3cr3t-web -d token=$TOKEN | jq .</code></p>`,
quiz:[
{q:'Why do real systems prefer RS256 or ES256 over HS256 for access tokens?',opts:['The tokens are shorter','APIs can verify tokens without being able to create them','They encrypt the payload','They never expire'],a:1,why:'With a key pair, verifying needs only the public key. With HS256, anything that can verify can also forge.'},
{q:'A token has a valid signature from your authorization server, but its aud claim names a different API. What should your API do?',opts:['Accept it: the signature is valid','Refuse it','Accept it if the scope looks right','Ask the user'],a:1,why:'A token is issued for one audience. Accepting tokens meant for someone else lets one compromised API be used against all the others.'},
{q:'An API verifies JWTs locally and a user\'s access is revoked. When does their current access token stop working?',opts:['Immediately','When it reaches its exp time','When they close the browser','Never'],a:1,why:'Local verification never asks the issuer, so the token works until it expires. That is why access tokens are kept short-lived.'}
],
reading:[
['RFC 9068: JWT Profile for OAuth 2.0 Access Tokens','https://datatracker.ietf.org/doc/html/rfc9068','What claims an access token should carry and how an API must validate it. Section 4 is the checklist from this lesson.'],
['RFC 7517: JSON Web Key','https://datatracker.ietf.org/doc/html/rfc7517','The format of the keys you fetched from the JWKS address.'],
['RFC 8725: JWT Best Current Practices','https://datatracker.ietf.org/doc/html/rfc8725','Covers the "none" attack and algorithm confusion in sections 2.1 and 3.1.']
]},

{id:4,title:'The authorization code flow',mins:15,setup:'web',
idea:`
<p>So far a token has simply been lying in a file. This lesson is about the real question OAuth answers: <strong>how does an app get a token for Ada without ever learning Ada's password?</strong></p>
<p>OAuth gives each party a formal name. You have met all four:</p>
<dl class="terms">
<dt>Resource owner</dt><dd>Ada. The person whose data it is, and the only one who can say yes.</dd>
<dt>Client</dt><dd>The app that wants access. The word has nothing to do with "customer": it is a client of the API.</dd>
<dt>Authorization server</dt><dd>auth.shop.test. It signs Ada in, asks her permission and issues tokens. Products such as Auth0, Keycloak, Okta and Microsoft Entra ID are authorization servers.</dd>
<dt>Resource server</dt><dd>api.shop.test. The API holding the data.</dd>
</dl>
<p>Before anything can happen, the app is <em>registered</em> with the authorization server, once, by a developer. Registration produces a <code>client_id</code> (public, names the app), a <code>client_secret</code> (the app's own password, kept on its server), and a list of exact <code>redirect_uri</code> addresses the server is allowed to send users back to.</p>
<p>Then the flow runs in two halves:</p>
<ol>
<li><strong>Through the browser.</strong> The app sends Ada's browser to the authorization server. She signs in there and approves what the app asked for. The server sends her browser back to the app's redirect address carrying a short-lived, one-time <em>authorization code</em>.</li>
<li><strong>Server to server.</strong> The app's back end sends that code, together with its client secret, straight to the authorization server and receives the tokens in the reply.</li>
</ol>
<p>Why two steps instead of putting the token on the redirect? Because the first half goes through the browser, and a browser's address bar is a leaky place: URLs end up in history, in logs and in other tabs. So only a code travels that way, and a code is useless without the client secret. The valuable tokens only ever move on the direct, encrypted connection between two servers.</p>
<dl class="terms">
<dt><code>state</code></dt><dd>A random value the app invents and sends on the first request. The server returns it untouched. If the value that comes back is not the one the app sent, the redirect did not come from a flow this user started, and the app must drop it.</dd>
<dt>Grant</dt><dd>OAuth's word for "a way of getting a token". This one is the authorization code grant.</dd>
</dl>
<p>The mental model: <strong>the browser carries a claim ticket, and the app trades the ticket for the coat at a counter the public cannot reach.</strong></p>`,

notes:`
<h2>What your terminal was standing in for</h2>
<ul>
<li>In a real web app the <code>open</code> step is a "Sign in" button that redirects the browser, and the token exchange is a few lines in the back end, normally done by a library (Authlib in Python, for example). You will rarely write these requests by hand. You will read them in logs all the time.</li>
<li>If Ada presses Deny, her browser is still sent back to the app, with <code>?error=access_denied</code> instead of a code.</li>
<li>Every error from the token endpoint has the same shape: an <code>error</code> code from a short standard list (<code>invalid_grant</code>, <code>invalid_client</code>, <code>invalid_scope</code> and a few more) plus a human-readable <code>error_description</code>.</li>
</ul>`,

],

{id:5,title:'PKCE: apps that cannot keep a secret',mins:12,setup:'spa',
idea:`
<p>Lesson 4 leaned on one assumption: the app has a back end where a client secret can sit safely. Many apps do not. A single-page app is JavaScript that the browser downloads and anyone can read. A mobile or desktop app is a file on the user's device that can be unpacked. Whatever you ship inside them is public.</p>
<dl class="terms">
<dt>Confidential client</dt><dd>An app with a server-side part that can hold a secret. The Shop Web app from lesson 4.</dd>
<dt>Public client</dt><dd>An app that cannot: browser apps, mobile apps, desktop apps, command-line tools. It has a client id and no secret.</dd>
</dl>
<p>Take the secret away and the flow has a hole. The authorization code comes back through the browser or the phone's operating system, and now the code alone is enough to get tokens. On a phone, a malicious app can register to receive the same kind of link. In a browser, an extension can read the address bar. Whoever grabs the code first wins.</p>
<p><strong>PKCE</strong> closes the hole. It stands for Proof Key for Code Exchange and is pronounced "pixy". The app makes up a fresh secret for every single login, so there is nothing to ship and nothing to steal in advance:</p>
<ol>
<li>The app generates a long random string, the <code>code_verifier</code>, and keeps it in memory.</li>
<li>It computes the SHA-256 hash of that string, the <code>code_challenge</code>, and sends the challenge on the first request. A hash cannot be run backwards, so showing it reveals nothing.</li>
<li>The authorization server remembers the challenge alongside the code it issues.</li>
<li>When the app redeems the code, it sends the original <code>code_verifier</code>. The server hashes it and compares.</li>
</ol>
<p>Someone who intercepts the code saw, at most, the challenge. They cannot produce the verifier, so the code is useless to them.</p>
<p>PKCE turned out to protect against enough other problems that it is now expected from <em>every</em> client, including ones with a secret: the security best-practice document recommends it and the OAuth 2.1 draft requires it. If you remember one rule from this guide, make it this: <strong>a flow with a user in it is the authorization code flow with PKCE.</strong></p>`,
labIntro:'Your terminal now plays a single-page app, registered as shop-spa with no secret. You will build the verifier and challenge by hand, exactly as a library does, then play the thief, then the real app.',
tasks:[
{what:'See what a public client gets at registration',cmd:'cat client.env',
 parts:[['cat client.env','Print this app\'s OAuth settings.']],

{what:'Invent this login\'s secret: the code verifier',cmd:'VERIFIER=$(openssl rand -hex 32)',
 parts:[['openssl rand -hex 32','Generate 32 random bytes and print them as 64 hexadecimal characters.'],['VERIFIER=$( … )','Keep them in a variable. In a real app this lives in memory for a few seconds.']],

 test:(l,w)=>/^[0-9a-f]{64}$/.test(w.vars.VERIFIER||'')},

 parts:[['printf %s $VERIFIER','Print the verifier with no line break after it. A stray line break would change the hash.'],['openssl dgst -sha256 -binary','Compute the SHA-256 hash and output the 32 raw bytes.'],['basenc --base64url','Write those bytes in base64url so they can go in a URL.'],['tr -d =','Delete the = padding characters, as the PKCE standard requires.']],

 parts:[['-d code_verifier=$VERIFIER','The original random string. Only the app that started this login has it.'],['RESP=$( … )','Keep the reply.']],
 saw:'The Last request panel shows the server hashing the verifier and finding that it equals the stored challenge. Tokens issued.',
 test:(l,w)=>isK(w,'RESP','response')},
{what:'Read the reply',cmd:'echo $RESP | jq .',
 parts:[['echo $RESP | jq .','Print the stored reply, formatted.']],
 saw:'The same kind of reply as lesson 4: an access token, a refresh token, the granted scope. The app proved itself without ever owning a long-term secret.',

{what:'Try to skip PKCE altogether',cmd:AUTHZ('shop-spa',CB_SPA,'orders:read','&state=xyz456'),
 parts:[['(no code_challenge)','The same first request as before with the two PKCE parameters left out.']],
 saw:'The server sent the browser back with error=invalid_request and no code. For a public client it refuses to start a flow that PKCE does not protect.',
 test:(l,w,r)=>r.meta.cmd==='open'&&r.meta.err==='invalid_request'}
],
notes:`
<h2>In real projects</h2>
<ul>
<li>You will not type these pipelines. Every OAuth library generates the verifier and challenge for you. Knowing what the two parameters are makes the library's settings, and its error messages, readable.</li>
<li><code>basenc</code> is part of GNU coreutils on Linux. On a Mac the same step is usually written <code>openssl base64 -A | tr '+/' '-_' | tr -d =</code>.</li>
<li>There is an older <code>plain</code> challenge method where the challenge is the verifier itself. It protects much less. Use <code>S256</code>, and expect servers to refuse anything else, as this one does.</li>
</ul>`,
quiz:[
{q:'Why can\'t a single-page app use a client secret?',opts:['Browsers block the Authorization header','Its code is downloaded to the user\'s device, so anything in it can be read','Secrets only work over HTTP','Single-page apps cannot make POST requests'],a:1,why:'Anything shipped to a browser or a phone is public. A secret that everyone can read is not a secret.'},
{q:'What does a thief who intercepts the redirect see, in a PKCE flow?',opts:['The code verifier','The code, and nothing that lets them redeem it','The access token','The client secret'],a:1,why:'The verifier never travels through the browser. Only its hash was sent earlier, and a hash cannot be reversed.'},
{q:'Which clients should use PKCE today?',opts:['Only mobile apps','Only apps without a back end','Every client that uses the authorization code flow','None: it has been replaced'],a:2,why:'Current best practice recommends PKCE for all clients, and the OAuth 2.1 draft requires it, confidential ones included.'}
],
reading:[
['RFC 7636: Proof Key for Code Exchange','https://datatracker.ietf.org/doc/html/rfc7636','The PKCE standard. Short and readable. Section 1 describes the interception attack.'],
['PKCE on oauth.net','https://oauth.net/2/pkce/','A one-page summary with links to libraries and videos.'],
['RFC 9700: Best Current Practice for OAuth 2.0 Security','https://datatracker.ietf.org/doc/html/rfc9700','The current security rules. Section 2.1.1 covers the authorization code grant and PKCE.']
]},

{id:6,title:'Scopes, expiry and refresh tokens',mins:15,setup:'web',
idea:`
<p>You have now seen a token issued and a token expire. This lesson is about living with tokens over time: limiting what they can do, replacing them when they run out, and taking them away.</p>
<h3>Scopes limit the app</h3>
<p>A scope is a permission the app asked for and the user approved. It is carried inside the access token, and each API route checks for the one it needs. Scope names are invented by whoever designs the API. <code>orders:read</code> and <code>orders:write</code> are typical.</p>
<p>One point trips people up: <strong>scopes limit what the app may do for the user. They do not replace the user's own permissions.</strong> A token with <code>orders:read</code> lets the app read orders as Ada, which means Ada's orders. Whether Ada herself may see a given order is still decided by the API's own rules.</p>
<h3>Two tokens with two jobs</h3>
<p>Lesson 3 ended on a trade-off: an API that verifies tokens locally cannot take one back, so access tokens must be short-lived. But nobody wants to sign in every five minutes. OAuth solves this with a second token.</p>
<dl class="terms">
<dt>Access token</dt><dd>Short life, minutes. Sent to the API on every request, so it is the one most exposed. If stolen, it soon stops working.</dd>
<dt>Refresh token</dt><dd>Long life, days or weeks. Sent only to the authorization server, to ask for a new access token. Because the server looks it up on every use, it can be cancelled at any moment.</dd>
<dt>Rotation</dt><dd>Each time a refresh token is used, the server retires it and returns a new one. A refresh token therefore works once.</dd>
<dt>Reuse detection</dt><dd>If a retired refresh token shows up again, two parties are holding copies of it and one of them is a thief. The server cannot tell which, so it revokes the entire chain and the user signs in again.</dd>
<dt>Revocation</dt><dd>Deliberately cancelling a token before it expires: what "sign out" and "remove this app's access" do behind the scenes.</dd>
</dl>
<p>The mental model: <strong>the access token is a day pass you show at every door. The refresh token is the membership card you show only at the front desk to get tomorrow's pass.</strong></p>`,
labIntro:'You are the Shop Web app again. The first four steps repeat lesson 4 quickly to get a pair of tokens. From step 5 on, watch two places: the status next to $TOKEN and $REFRESH, and the refresh token list in the auth.shop.test panel.',
tasks:[
{what:'Send Ada to sign in and approve',cmd:AUTHZ('shop-web',CB_WEB,'orders:read','&state=k3y9'),
 parts:[P_OPEN,['scope=orders:read','The app asks for reading only.']],
 saw:'Ada approved "read your orders" and the app received a code.',
 test:(l,w,r)=>r.meta.cmd==='open'&&!!r.meta.code},
{what:'Trade the code for tokens',cmd:EXCH_WEB,
 parts:P_EXCH,
 saw:'$RESP holds the reply, with both an access token and a refresh token in it.',
 test:(l,w)=>isK(w,'RESP','response')},
{what:'Keep the access token',cmd:'TOKEN=$(echo $RESP | jq -r .access_token)',
 parts:[['jq -r .access_token','Take the access token out of the reply.']],
 saw:'$TOKEN: an access token, valid for five minutes.',
 test:(l,w)=>isK(w,'TOKEN','access')},
{what:'Keep the refresh token',cmd:'REFRESH=$(echo $RESP | jq -r .refresh_token)',
 parts:[['jq -r .refresh_token','Take the refresh token out of the reply.']],
 saw:'$REFRESH is marked opaque. It is a random string, not a JWT: only the authorization server can make sense of it, by looking it up.',
 test:(l,w)=>isK(w,'REFRESH','refresh')},
{what:'Ask for something outside the token\'s scope',cmd:'curl -i -X DELETE '+BT+' '+U_API+'/orders/1',
 parts:[['-X DELETE','Try to cancel an order, which needs orders:write.'],P_BEARER],
 saw:'403 insufficient_scope, and the header names the scope that is missing. The app would have to send Ada back to the consent page to ask for orders:write. It cannot upgrade itself.',
 test:(l,w)=>got(w,'rs','/orders/1',403)},
{what:'Let the access token run out',cmd:'sleep 600',
 parts:[['sleep 600','Fast-forward the sandbox clock by ten minutes.']],
 saw:'$TOKEN now reads expired. $REFRESH is still active: its life is counted in weeks.',
 test:(l,w,r)=>r.meta.cmd==='sleep'&&isK(w,'TOKEN','access')&&w.readJwt(w.vars.TOKEN).p.exp<w.now},
{what:'Confirm the API refuses it',cmd:'curl -i '+BT+' '+U_API+'/orders',
 parts:[P_BEARER],
 saw:'401, "The access token expired". A real app treats this particular answer as its cue to refresh, without bothering the user.',
 test:(l,w)=>got(w,'rs','/orders',401)},
{what:'Use the refresh token to get a new access token',cmd:'RESP=$(curl -s '+U_AS+'/token -u shop-web:s3cr3t-web -d grant_type=refresh_token -d refresh_token=$REFRESH)',
 parts:[['-d grant_type=refresh_token','A different kind of exchange: no code, no browser, no Ada.'],['-d refresh_token=$REFRESH','The refresh token goes to the authorization server. It is never sent to the API.'],['-u shop-web:s3cr3t-web','The app still proves who it is.']],
 saw:'In the auth.shop.test panel the first refresh token turned to "rotated" and a second one appeared in the same family. $REFRESH in your terminal still holds the old one.',
 test:(l,w)=>isK(w,'RESP','response')&&w.as.refresh.some(r=>r.state==='rotated')},
{what:'Read what came back',cmd:'echo $RESP | jq .',
 parts:[['echo $RESP | jq .','Print the reply, formatted.']],
 saw:'A new access token and a new refresh token. Ada was not asked anything. A real app would now replace both stored values.',
 test:(l,w,r)=>/"refresh_token"/.test(r.stdout)&&/\n/.test(r.stdout)},
{what:'Replay the old refresh token, as a thief with a stolen copy would',cmd:'curl -s '+U_AS+'/token -u shop-web:s3cr3t-web -d grant_type=refresh_token -d refresh_token=$REFRESH | jq .',
 parts:[['refresh_token=$REFRESH','Still the first refresh token, which was retired two steps ago.']],
 saw:'invalid_grant, and look at the auth.shop.test panel: the new refresh token was revoked as well. The server saw a retired token come back, concluded that a copy had leaked, and shut the whole family down. Ada will have to sign in again.',
 test:(l,w)=>tokErr(w,'invalid_grant')&&w.as.refresh.some(r=>r.state==='revoked')}
],
notes:`
<h2>Taking tokens away on purpose</h2>
<p>Two more standard endpoints exist on most authorization servers, and both work in this sandbox.</p>
<ul>
<li><strong>Revocation.</strong> <code>curl -i https://auth.shop.test/revoke -u shop-web:s3cr3t-web -d token=$REFRESH</code> cancels a refresh token. This is what a proper "sign out" calls. The answer is 200 whether or not the token existed, so the endpoint cannot be used to test guesses.</li>
<li><strong>Introspection.</strong> <code>curl -s https://auth.shop.test/introspect -u shop-web:s3cr3t-web -d token=$REFRESH | jq .</code> asks the server whether a token is still active.</li>
</ul>
<p>Remember the limit from lesson 3: revoking stops <em>new</em> access tokens from being issued. An access token that is already out, held by an API that verifies locally, keeps working until its <code>exp</code>. With a five-minute life, that window is small on purpose.</p>
<p>In OpenID Connect systems, a refresh token is usually only issued if the app asks for the scope <code>offline_access</code>. This sandbox issues one every time to keep the commands short.</p>`,
quiz:[
{q:'A token carries the scope orders:read and belongs to Ada. Whose orders can the app read with it?',opts:['Every customer\'s','Ada\'s','None until it also has orders:write','Whichever the app chooses'],a:1,why:'Scopes limit what the app may do on the user\'s behalf. The user\'s own permissions still apply.'},
{q:'Why is the refresh token never sent to the API?',opts:['The API could not read it','It is the long-lived, powerful one, so it is shown only to the authorization server, over one well-protected route','It is too long for a header','It expires too quickly'],a:1,why:'Keeping the refresh token away from every API shrinks the number of places it could leak from to one.'},
{q:'A refresh token that has already been used arrives at the authorization server again. What does a server with reuse detection do?',opts:['Issues new tokens as normal','Ignores the request silently','Revokes every token descended from the same sign-in','Extends the access token'],a:2,why:'A second use means two parties hold the token. The server cannot tell the thief from the real app, so it ends the session for both.'}
],
reading:[
['Refresh tokens on oauth.com','https://www.oauth.com/oauth2-servers/access-tokens/refreshing-access-tokens/','How refreshing works, with the request and response spelled out.'],
['RFC 7009: Token Revocation','https://datatracker.ietf.org/doc/html/rfc7009','The revocation endpoint from the notes above.'],
['RFC 7662: Token Introspection','https://datatracker.ietf.org/doc/html/rfc7662','The "is this token still active?" endpoint.']
]},

/* ------------------------------------------------------------------ 7 */
{id:7,title:'OpenID Connect: signing in',mins:12,setup:'web',
idea:`
<p>Here is something that surprises almost everyone: <strong>OAuth by itself does not tell the app who the user is.</strong> Look back at lesson 4. The app ended up with an access token it could send to the API. Nothing in the standard said the app may read that token, or what would be in it if it did. OAuth is about <em>delegated access</em>: letting an app do things. It was never designed as a login system.</p>
<p>People used it as one anyway, each in their own incompatible way, and some of those ways were unsafe. <strong>OpenID Connect</strong>, OIDC for short, is the standard that fixed this. It is a thin layer on top of the exact flow you already know. "Sign in with Google", "Sign in with Microsoft" and "Sign in with Apple" are all OpenID Connect.</p>
<p>OIDC adds four things:</p>
<dl class="terms">
<dt>The <code>openid</code> scope</dt><dd>Adding this one word to the scope list turns an OAuth request into an OpenID Connect request.</dd>
<dt>ID token</dt><dd>A second JWT returned next to the access token. It is addressed to the <em>app</em> and says: this user, signed in at this time, by this server.</dd>
<dt>UserInfo endpoint</dt><dd>An API on the authorization server that returns profile details about the signed-in user, when called with the access token.</dd>
<dt>Discovery</dt><dd>A fixed address, <code>/.well-known/openid-configuration</code>, where the server lists every endpoint and feature, so a library can configure itself from one URL.</dd>
</dl>
<p>The scopes <code>profile</code> and <code>email</code> are standard too, and control which details about the user are released.</p>
<p>The part worth memorising is which token is for whom:</p>
<table class="types">
<thead><tr><th></th><th>ID token</th><th>Access token</th></tr></thead>
<tbody>
<tr><td>Answers</td><td>Who signed in?</td><td>What may this app do?</td></tr>
<tr><td>Audience (<code>aud</code>)</td><td>The app (its client id)</td><td>The API</td></tr>
<tr><td>Read by</td><td>The app</td><td>The API. The app should treat it as an opaque string.</td></tr>
<tr><td>Sent to APIs</td><td>Never</td><td>On every request</td></tr>
</tbody>
</table>
<p>The mental model: <strong>the ID token is a receipt for the app that a sign-in happened. The access token is the key card for the API. Do not hand the receipt to the door.</strong></p>`,
labIntro:'Same app, same flow. The only new ingredient is the word openid in the scope list. Watch what extra item appears in the reply.',
tasks:[
{what:'Read the discovery document',cmd:'curl -s '+U_AS+'/.well-known/openid-configuration | jq .',

 saw:'One document names the issuer, every endpoint, the JWKS address, the scopes and the signing algorithms. Give a library the issuer URL and it can find the rest here.',

 test:(l,w,r)=>r.meta.cmd==='jwt decode'&&/"nonce"/.test(r.stdout)},
{what:'Take out the access token',cmd:'TOKEN=$(echo $RESP | jq -r .access_token)',

 saw:'$TOKEN is the access token: for api.shop.test, carrying all four scopes.',
 test:(l,w)=>isK(w,'TOKEN','access')},
{what:'Ask the UserInfo endpoint about the user',cmd:'curl -s '+BT+' '+U_AS+'/userinfo | jq .',
 parts:[[U_AS+'/userinfo','An API on the authorization server itself. It takes the access token, as any API does.'],P_BEARER],
 saw:'The same facts about Ada, fetched live. Apps use this when they want profile details that were not put in the ID token.',
 test:(l,w)=>got(w,'as','/userinfo',200)},
{what:'Make the classic mistake: send the ID token to the API',cmd:'curl -i -H "Authorization: Bearer $ID" '+U_API+'/orders',
 parts:[['-H "Authorization: Bearer $ID"','Present the ID token where an access token belongs.']],
 saw:'401. Read the checks in the Last request panel: algorithm, key, signature and issuer all passed. The audience check stopped it, because this token is addressed to shop-web and not to the API. This is the check from lesson 3 doing its job.',

],
notes:`
<h2>How an app uses the ID token</h2>
<ul>
<li>It verifies the signature with the JWKS, then checks <code>iss</code>, that <code>aud</code> is its own client id, <code>exp</code>, and that <code>nonce</code> equals the value it sent. Your library does all five.</li>
<li>It reads <code>sub</code> as the user's stable identifier. Use <code>sub</code> (together with <code>iss</code>) as the key for the user in your database. An email address can change. A <code>sub</code> does not. Real servers use an opaque id here, not a readable name like <code>ada</code>.</li>
<li>It then creates its own session for the user, typically a cookie. The ID token has done its job at that point and does not need to be stored.</li>
</ul>
<p>The vocabulary changes slightly in OIDC documents: the authorization server is called the <em>OpenID Provider</em> or identity provider (IdP), and the app is the <em>relying party</em>. They are the same two boxes.</p>`,
quiz:[
{q:'What turns an ordinary OAuth authorization request into an OpenID Connect one?',opts:['Using a different endpoint','Including openid in the scope','Sending the client secret in the URL','Using response_type=id'],a:1,why:'The openid scope is the switch. Everything else about the flow stays the same.'},
{q:'Who is the audience of an ID token?',opts:['The API','The user\'s browser','The app that requested it','The authorization server'],a:2,why:'The ID token\'s aud is the client id. It tells the app who signed in. APIs must refuse it.'},
{q:'Which value should an app use as the permanent key for a user in its own database?',opts:['The email claim','The name claim','The sub claim, together with the issuer','The access token'],a:2,why:'sub is the stable identifier the issuer guarantees. Emails and names can change or be reused.'}
],
reading:[
['How OpenID Connect works','https://openid.net/developers/how-connect-works/','The OpenID Foundation\'s own plain-language overview.'],
['OpenID Connect Core 1.0','https://openid.net/specs/openid-connect-core-1_0.html','The specification. Section 2 defines the ID token and section 5.1 lists the standard claims.'],
['User authentication with OAuth 2.0','https://oauth.net/articles/authentication/','Why plain OAuth is not a login protocol, and what goes wrong when it is used as one.']
]},

{id:8,title:'Machines, and choosing a flow',mins:12,setup:'job',
idea:`
<p>Every flow so far had a person in it. Plenty of software has none: a nightly job that builds a report, one back-end service calling another. There is no browser to redirect and nobody to press Allow.</p>
<p>For these, OAuth has the simplest grant of all, <strong>client credentials</strong>. The program sends its own client id and secret to the token endpoint and gets an access token back. One request. The token's subject is the program itself, and its scopes are whatever that client was registered to have.</p>
<p>With that, you have seen every flow you are likely to need. The full menu is short:</p>
<table class="types">
<thead><tr><th>Situation</th><th>Flow</th></tr></thead>
<tbody>
<tr><td>A person uses a web app that has a back end</td><td>Authorization code + PKCE, with a client secret</td></tr>
<tr><td>A person uses a browser-only, mobile or desktop app</td><td>Authorization code + PKCE, no secret</td></tr>
<tr><td>A person uses a device with no browser or keyboard (a TV, a tool over SSH)</td><td>Device authorization: the device shows a short code and the person approves on their phone</td></tr>
<tr><td>No person at all</td><td>Client credentials</td></tr>
</tbody>
</table>
<p>Two older flows appear in a great many tutorials, and you should recognise them in order to avoid them:</p>
<dl class="terms">
<dt>Implicit flow</dt><dd><code>response_type=token</code>. Returned the access token directly on the redirect URL, the leaky channel from lesson 4. Replaced by authorization code + PKCE.</dd>
<dt>Password grant</dt><dd><code>grant_type=password</code>. The app collects the user's password and forwards it. This brings back every problem from lesson 1.</dd>
</dl>
<p><strong>OAuth 2.1</strong> is the name for OAuth 2.0 with a decade of these lessons folded in: PKCE always, exact redirect matching, refresh token rotation for public clients, and the two flows above removed. In late 2026 it is still an IETF draft and not yet a finished standard, but its rules are already what current servers and libraries enforce, and newer protocols build on it directly.</p>`,

notes:`
<h2>Where a browser app keeps its tokens</h2>
<p>JavaScript storage (<code>localStorage</code>, <code>sessionStorage</code>) can be read by any script that runs on the page, including one injected through a bug in the site or in one of its dependencies. Two patterns are considered sound:</p>
<ul>
<li><strong>Backend for frontend.</strong> A small server does the OAuth flow, keeps the tokens on its side, and gives the browser an <code>HttpOnly</code>, <code>Secure</code>, <code>SameSite</code> session cookie that scripts cannot read. This is the most robust choice when you have a back end.</li>
<li><strong>In memory only.</strong> A browser-only app keeps the access token in a variable, never in storage, and relies on short lifetimes and refresh token rotation.</li>
</ul>
<h2>Checklist for an API that accepts tokens</h2>
<ol>
<li>Fix the accepted algorithm in configuration. Never read it from the token.</li>
<li>Verify the signature with the issuer's JWKS, and cache the keys.</li>
<li>Check <code>iss</code>, <code>aud</code> and <code>exp</code> on every request.</li>
<li>Check the scope each route needs. Answer 401 for a bad token and 403 for a missing scope.</li>
<li>Then apply your own rules about what this user may see.</li>
<li>Use a maintained library for steps 1 to 3. Do not write them yourself.</li>
</ol>
<h2>Where you will meet this</h2>
<ul>

<li><strong>MCP.</strong> Remote Model Context Protocol servers use OAuth for authorization: the MCP server is the resource server, the AI application is the client, and the flow is authorization code with PKCE.</li>
