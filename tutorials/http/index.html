{id:3,title:'Report codes: status codes',mins:12,
idea:`
<p>Every report starts with a three-digit <strong>status code</strong>. Programs read that number before anything else, and so should you when something breaks. You do not need to memorise the list. You need the five families, because the first digit already tells you whose move it is.</p>
<table class="types"><thead><tr><th>Family</th><th>Means</th><th>Whose move</th><th>On the schematic</th></tr></thead><tbody>
<tr><td>1xx</td><td>Hold on, still going. Rare in daily work.</td><td></td><td></td></tr>
<tr><td>2xx</td><td>It worked.</td><td>nobody's</td><td>green</td></tr>
<tr><td>3xx</td><td>Look somewhere else.</td><td>the client should follow</td><td>blue</td></tr>
<tr><td>4xx</td><td>The order was wrong.</td><td>the client must change the request</td><td>amber</td></tr>
<tr><td>5xx</td><td>The order was fine and the Kestrel failed.</td><td>the server's owner</td><td>red</td></tr>
</tbody></table>
<p>That last split is the most useful debugging rule in this guide: <strong>4xx, fix what you sent. 5xx, look at the server.</strong> Sending the same bad request again will give the same 4xx every time.</p>
<dl class="terms">
<dt>200 OK, 201 Created, 204 No Content</dt><dd>The three successes you met in lesson 2.</dd>
<dt>301 Moved Permanently, 302 Found</dt><dd>The thing lives at another URL, given in the <code>Location</code> header. 301 is for good, 302 is for now.</dd>
<dt>400, 404, 405, 422</dt><dd>Bad request, no such thing, wrong method for this path, and "I understood the format but the values are not valid".</dd>
<dt>401, 403</dt><dd>"I do not know who you are" and "I know who you are, and no". Lesson 6.</dd>
<dt>500, 502, 503, 504</dt><dd>The program crashed; the gate could not reach the program; the server is overloaded or down for maintenance; the program took too long.</dd>
</dl>`,
labIntro:'Eight orders, eight different outcomes. After each one, look at the colour on the schematic before you read the terminal.',
tasks:[
{what:`A success, for comparison`,cmd:`curl -si kestrel.test/status`,parts:[P_SI,[`/status`,`A path that exists and accepts GET.`]],
 saw:`200 OK. Green.`,test:(l,w,r)=>is(r,{status:200,path:'/status',headers:true})},
{what:`Ask for something that does not exist`,cmd:`curl -si kestrel.test/railgun`,parts:[[`/railgun`,`The Kestrel has no such path.`]],
 saw:`404 Not Found. The connection worked, the gate (G) passed the order on, and the API had nothing at that path. A 404 is still a perfectly good HTTP conversation: there is a status line, headers and a JSON body explaining.`,test:(l,w,r)=>is(r,{status:404,path:'/railgun'})},
{what:`Use a method the path does not accept`,cmd:`curl -si -X DELETE kestrel.test/status`,parts:[[`-X DELETE`,`/status exists, but you cannot delete the status of a mobile suit.`]],
 saw:`405 Method Not Allowed. Different from 404: the path is right, the verb is wrong. The allow header lists what would work.`,test:(l,w,r)=>is(r,{status:405})},
{what:`Send a value of the wrong type`,cmd:`curl -si "kestrel.test/targeting?sector=north"`,parts:[[`sector=north`,`The targeting subsystem expects a whole number.`]],
 saw:`422. The body says exactly which input was wrong and why: query, sector, "Input should be a valid integer". FastAPI writes these for you. Read the body of a 4xx before anything else. (Newer servers name this code "Unprocessable Content". The number is what matters.)`,test:(l,w,r)=>is(r,{status:422,path:'/targeting'})},
{what:`Ask for something that has moved`,cmd:`curl -si kestrel.test/radar`,parts:[[`/radar`,`An old path. The sensors were renamed.`]],
 saw:`301 Moved Permanently, in blue, with a Location header pointing at /sensors. curl stops here and shows you the redirect. It was the gate (NGINX) that answered: the order never reached a subsystem.`,test:(l,w,r)=>is(r,{status:301,path:'/radar'})&&r.meta.followed===0},
{what:`Follow the redirect`,cmd:`curl -sL kestrel.test/radar`,parts:[[`-L`,`Follow Location headers. A browser always does this, which is why you rarely notice a redirect.`]],
 saw:`Two requests happened: /radar got the 301, then curl asked /sensors and got the data. The sensor mast (S) lit up.`,test:(l,w,r)=>is(r,{status:200,node:'sensors'})&&r.meta.followed===1},
{what:`Trigger a bug in the server`,cmd:`curl -si "kestrel.test/targeting?sector=0"`,parts:[[`sector=0`,`A perfectly valid whole number. The targeting code divides by it.`]],
 saw:`500 Internal Server Error, in red. Your request was fine: the program crashed while handling it. Nothing you change at the bench will fix this. The fix is in the server's code, and the details are in the server's logs, not in the response.`,test:(l,w,r)=>is(r,{status:500})},
{what:`Call a subsystem that is powered down`,cmd:`curl -si kestrel.test/thrusters`,parts:[[`/thrusters`,`The thruster service is switched off while the suit is in the hangar.`]],
 saw:`502 Bad Gateway, and the body is an HTML page signed nginx, not JSON. That signature is the clue: the gate is up, and the service behind it did not answer. You saw this from the other side in NGINX from Zero.`,test:(l,w,r)=>is(r,{status:502})}
],
notes:`<h2>Who wrote the response?</h2>
<p>When there is a reverse proxy in front, two programs can answer. A JSON body shaped like <code>{"detail": …}</code> came from the FastAPI app. An HTML page that ends in <code>nginx</code> came from the gate. 404 can come from either. 502, 503 and 504 nearly always come from the gate or a load balancer.</p>
<h2>A short field guide</h2>
<table class="types"><thead><tr><th>You see</th><th>First thing to check</th></tr></thead><tbody>
<tr><td>400 / 422</td><td>Read the response body. It usually names the bad field.</td></tr>
<tr><td>401</td><td>Is the token being sent at all? Has it expired?</td></tr>
<tr><td>403</td><td>The token is fine. Does this user have the role or scope?</td></tr>
<tr><td>404</td><td>Typo in the path? Wrong id? Wrong environment?</td></tr>
<tr><td>405</td><td>GET where POST was needed, or the reverse.</td></tr>
<tr><td>429</td><td>You are being rate-limited. Slow down and retry later.</td></tr>
<tr><td>500</td><td>The server's own logs. There will be a stack trace.</td></tr>
<tr><td>502 / 503 / 504</td><td>Is the service behind the proxy running, healthy and fast enough?</td></tr>
</tbody></table>
<h2>For product and UX work</h2>
<p>Status codes are a design decision. A screen needs a different message for 401 (sign in again), 403 (you do not have access), 404 (this no longer exists), 422 (fix this field) and 5xx (our fault, try again). Collapsing them all into "Something went wrong" throws away what the server told you.</p>`,
quiz:[
{q:'A request returns 500. What should you change in the request?',opts:['The method','The Content-Type header','Probably nothing: 5xx means the server failed, so look at the server','The port'],a:2,why:'5xx is the server\'s fault. The request may be completely correct.'},
{q:'What is the difference between 404 and 405?',opts:['None','404: nothing at that path. 405: the path exists, but not for that method','404 is the server\'s fault, 405 the client\'s','405 means the token is missing'],a:1,why:'405 comes with an allow header listing the methods that would work.'},
{q:'You get an HTML error page that ends with the word nginx, from an API that normally returns JSON. What does that tell you?',opts:['The API changed format','The reverse proxy answered, so the request probably never got a reply from the app','Your JSON was invalid','DNS failed'],a:1,why:'The body\'s author is a clue. An nginx-signed 502 means the gate could not get an answer from the service behind it.'}],
reading:[
['HTTP response status codes (MDN)',MDN+'/Status','Every code, grouped by family, each with a short explanation.'],
['HTTP Cats','https://http.cat/','Every status code as a cat photo. Surprisingly good for remembering them.'],
['Redirections in HTTP (MDN)',MDN+'/Redirections','301 against 302, 307 and 308, and what browsers do with each.']]},

{id:4,title:'Callsigns: how DNS finds the Kestrel',mins:12,
idea:`
<p>You have typed <code>kestrel.test</code> a dozen times. Networks do not route by name. They route by number: the Kestrel's <strong>bay address</strong> (IP address) on the hangar network is <code>10.7.0.10</code>. Something turned the <strong>callsign</strong> (domain name) into that number before the first byte of HTTP was sent. That something is <strong>DNS</strong>, the Domain Name System: the hangar's <strong>callsign registry</strong>, marker D on the schematic.</p>
<p>DNS is a lookup, and it happens first. If it fails, nothing else is attempted: no connection, no request, no status code. That is why "could not resolve host" is a different kind of failure from a 404.</p>
<dl class="terms">
<dt>Resolver</dt><dd>The DNS server your machine asks. Here it is the hangar's, at 10.7.0.1. At home it is usually your router or your provider's.</dd>
<dt>A record</dt><dd>The basic entry: this name has this IPv4 address. (AAAA is the same for IPv6.)</dd>
<dt>CNAME record</dt><dd>An alias: this name is another name. The resolver then looks that one up.</dd>
<dt>TTL (time to live)</dt><dd>How many seconds an answer may be remembered before asking again. It is why a DNS change "takes time to propagate".</dd>
<dt>NXDOMAIN</dt><dd>The registry's answer for a name that does not exist.</dd>
<dt><code>/etc/hosts</code></dt><dd>A small file on your own machine that is checked <em>before</em> DNS. Handy for testing, and a classic source of confusion when forgotten.</dd>
</dl>`,
widget:'dns',widgetTitle:'What happens before the request',widgetIntro:'Press Next to follow one lookup, or tap any box.',
labIntro:'The strip at the bottom of the panel shows which names the resolver currently remembers and for how much longer, and any entries you add to /etc/hosts.',
tasks:[
{what:`Ask the registry for the Kestrel's address`,cmd:`dig +short kestrel.test`,parts:[[`dig`,`The standard tool for asking DNS a question directly.`],[`+short`,`Print only the answer.`],[`kestrel.test`,`The name to look up.`]],
 saw:`10.7.0.10. On the schematic the dot went from the bench (B) to the registry (D) and nowhere else: no order reached the Kestrel. A DNS lookup is a separate conversation with a separate server.`,test:(l,w,r)=>r.meta.cmd==='dig'&&r.meta.name==='kestrel.test'&&r.meta.short},
{what:`Ask again, and read the full answer`,cmd:`dig kestrel.test`,parts:[[`dig kestrel.test`,`Without +short you get the whole reply, in sections.`]],
 saw:`Find the ANSWER SECTION: name, TTL, IN, record type A, and the address. The TTL started at 300 seconds and has already counted down a little since your first question. Near the bottom, SERVER shows who answered: 10.7.0.1, the hangar's resolver.`,test:(l,w,r)=>r.meta.cmd==='dig'&&r.meta.name==='kestrel.test'&&!r.meta.short&&r.meta.found},
{what:`Look up an alias`,cmd:`dig +short www.kestrel.test`,parts:[[`www.kestrel.test`,`A second name for the same machine.`]],
 saw:`Two lines. First the CNAME: www.kestrel.test is really kestrel.test. Then the address of that. One name can point at another, so only one record has to change if the Kestrel moves bays.`,test:(l,w,r)=>r.meta.cmd==='dig'&&r.meta.name==='www.kestrel.test'&&r.meta.chain.length===2},
{what:`Look up a name that does not exist`,cmd:`dig railgun.kestrel.test`,parts:[[`railgun.kestrel.test`,`Nobody registered this callsign.`]],
 saw:`status: NXDOMAIN and ANSWER: 0. The registry replied, clearly and quickly, that there is no such name.`,test:(l,w,r)=>r.meta.cmd==='dig'&&!r.meta.found&&!r.meta.short},
{what:`See what curl does with that name`,cmd:`curl -s railgun.kestrel.test/status`,parts:[[`railgun.kestrel.test/status`,`An HTTP request to a name with no address.`]],
 saw:`curl: (6) Could not resolve host. There is no status code because there was no HTTP: curl never learned where to connect. The exchange panel is empty for the same reason.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.fail==='nx'},
{what:`Look at this bench's private list of names`,cmd:`cat /etc/hosts`,parts:[[`cat`,`Print a file.`],[`/etc/hosts`,`Checked before DNS for every lookup a normal program makes.`]],
 saw:`One line: 127.0.0.1 is called localhost. That is where the name localhost comes from. It is not in DNS at all.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path==='/etc/hosts'},
{what:`Give the Kestrel a nickname, on this bench only`,cmd:`echo "10.7.0.10 kes" | sudo tee -a /etc/hosts`,parts:[[`echo "10.7.0.10 kes"`,`The line to add: an address, then a name for it.`],[`|`,`Feed that text into the next command.`],[`sudo tee -a /etc/hosts`,`Append it to the file as root. -a means append: without it the file would be replaced.`]],
 saw:`The line is in the file, and the strip in the status panel lists it. No other machine in the hangar knows this name.`,test:(l,w,r)=>r.meta.cmd==='tee'&&r.meta.names.includes('kes')},
{what:`Use the nickname`,cmd:`curl -s kes/status`,parts:[[`kes`,`The name you just invented.`]],
 saw:`It works, and no dot went to the registry: the bench found kes in its own file and never asked DNS. Meanwhile dig kes would say NXDOMAIN, because dig always asks DNS directly. When a name behaves differently for you than for everyone else, check /etc/hosts.`,test:(l,w,r)=>is(r,{status:200,src:'hosts'})}
],
notes:`<h2>The records you will actually touch</h2>
<table class="types"><thead><tr><th>Type</th><th>Says</th><th>You set it when</th></tr></thead><tbody>
<tr><td>A / AAAA</td><td>name → IPv4 / IPv6 address</td><td>pointing a domain at a server</td></tr>
<tr><td>CNAME</td><td>name → another name</td><td>pointing www, or a subdomain, at a hosting provider or load balancer</td></tr>
<tr><td>TXT</td><td>name → free text</td><td>proving you own a domain, for email or a certificate</td></tr>
<tr><td>MX</td><td>name → mail server</td><td>setting up email</td></tr>
<tr><td>NS</td><td>name → the servers that hold its records</td><td>moving a domain to a DNS provider</td></tr>
</tbody></table>
<h2>Why a DNS change is not instant</h2>
<p>Resolvers remember an answer for its TTL. Change an A record with a TTL of 3600 and some users will keep reaching the old address for up to an hour. Before a planned move, lower the TTL a day ahead. This is the same wait you meet when attaching a domain in <em>Cloud Deploy from Zero</em>.</p>
<h2>Inside Docker and Kubernetes</h2>
<p>The service names from those guides (<code>db</code>, <code>sensors</code>, <code>sensors.default.svc.cluster.local</code>) are DNS names too, answered by a small resolver built into Docker or the cluster. The mechanism is exactly this one.</p>
<p><code>.test</code> is a name reserved for examples: it can never exist on the public internet, which makes it safe for a guide.</p>`,
quiz:[
{q:'curl prints "Could not resolve host". What has been sent to the web server?',opts:['A GET request','Only the headers','Nothing: the name lookup failed, so no connection was attempted','A 404'],a:2,why:'DNS comes first. Without an address there is nowhere to connect to.'},
{q:'You change a domain\'s A record. A colleague still reaches the old server twenty minutes later. Most likely cause?',opts:['Their browser is broken','A resolver is still holding the old answer until its TTL runs out','HTTP status codes are cached','The server is refusing them'],a:1,why:'Answers are remembered for their TTL. Until it expires, the old address keeps being handed out.'},
{q:'A name resolves on your laptop and nowhere else. Where do you look first?',opts:['The server\'s logs','Your /etc/hosts file','The TLS certificate','The Content-Type header'],a:1,why:'The hosts file is checked before DNS and only affects the machine it is on.'}],
reading:[
['What is DNS? (Cloudflare)',CF+'/dns/what-is-dns/','The lookup step by step, with the different kinds of server involved.'],
['How DNS works (comic)','https://howdns.works/','A short illustrated story of one lookup. Ten minutes, and it sticks.'],
['DNS record types (Cloudflare)',CF+'/dns/dns-records/','A, AAAA, CNAME, MX, TXT, NS and the rest, one page each.']]},

{id:5,title:'Hatches: addresses and ports',mins:12,
idea:`
<p>DNS gave you the Kestrel's <strong>bay address</strong> (IP address): which machine. That is not yet enough to deliver an order, because one machine runs many programs. Each program that accepts connections waits behind a numbered <strong>hatch</strong> (a <strong>port</strong>), from 1 to 65535. An address and a port together, <code>10.7.0.10:80</code>, name exactly one listening program.</p>
<p>Before any HTTP is sent, the bench opens a <strong>TCP connection</strong> to that address and port: a short handshake that says "is anyone there?" and "yes, go ahead". HTTP then travels over that connection. So there are now three things that must work, in this order: the name, the connection, the request. Each fails with its own message.</p>
<table class="types"><thead><tr><th>You see</th><th>It means</th></tr></thead><tbody>
<tr><td>Could not resolve host</td><td>DNS: no address for that name.</td></tr>
<tr><td>Connection refused</td><td>The machine is there, and nothing is listening on that port. An instant, definite no.</td></tr>
<tr><td>Connection timed out</td><td>No reply at all: the machine is off, the address is wrong, or a firewall is silently dropping you.</td></tr>
<tr><td>Any status code, even 500</td><td>Name, connection and HTTP all worked. The problem is in the application.</td></tr>
</tbody></table>
<dl class="terms">
<dt>Well-known ports</dt><dd>Conventions, not rules: 80 for HTTP, 443 for HTTPS, 22 for SSH, 5432 for Postgres, 53 for DNS. Leaving the port out of a URL means 80 for http and 443 for https.</dd>
<dt>Listening</dt><dd>A program has claimed a port and is waiting for connections. Only one program can listen on a given address and port.</dd>
<dt>localhost / 127.0.0.1</dt><dd>"This machine itself." It never means the server, unless you are sitting on the server.</dd>
<dt>Private address</dt><dd>10.x.x.x, 192.168.x.x and 172.16–31.x.x only work inside a local network, like this hangar.</dd>
</dl>`,
widget:'url',widgetTitle:'A URL holds all three',widgetIntro:'Tap each part of the URL to see which step uses it.',
labIntro:'This lab uses nc (netcat) to knock on hatches without sending any HTTP. The connection card on the schematic shows the result of each knock.',
tasks:[
{what:`Find this bench's own address`,cmd:`hostname -I`,parts:[[`hostname -I`,`Print this machine's IP addresses.`]],
 saw:`10.7.0.5. The bench and the Kestrel (10.7.0.10) share the first three numbers, 10.7.0: they are on the same local network.`,test:(l,w,r)=>r.meta.cmd==='hostname'&&r.meta.addr},
{what:`Check the Kestrel is reachable at all`,cmd:`ping -c 2 kestrel.test`,parts:[[`ping`,`Send a tiny "are you there?" packet and time the reply. It involves no ports.`],[`-c 2`,`Send two, then stop.`]],
 saw:`Two replies from 10.7.0.10 in under a millisecond. The machine is switched on and the network path works. This says nothing yet about any program on it.`,test:(l,w,r)=>r.meta.cmd==='ping'&&r.meta.alive&&r.meta.ip===GW},
{what:`Knock on hatch 80`,cmd:`nc -zv kestrel.test 80`,parts:[[`nc`,`netcat: opens raw TCP connections.`],[`-z`,`Only test whether the port accepts a connection, then hang up.`],[`-v`,`Say what happened.`],[`kestrel.test 80`,`The machine and the port.`]],
 saw:`Succeeded. Something is listening on port 80: the gate (G), which is NGINX. The label [tcp/http] is only nc looking the number up in a list of conventions.`,test:(l,w,r)=>r.meta.cmd==='nc'&&r.meta.state==='ok'&&r.meta.port===80},
{what:`Knock on the targeting subsystem's own hatch`,cmd:`nc -zv kestrel.test 8001`,parts:[[`8001`,`The port core-1 listened on in NGINX from Zero.`]],
 saw:`Connection refused, straight away. The targeting service is running, but it listens on 127.0.0.1:8001, meaning "only from inside the Kestrel itself". From the hangar network that hatch is welded shut, and the only way in is through the gate. This is deliberate, and it is what "127.0.0.1:8001:8000" meant in that guide's compose file.`,test:(l,w,r)=>r.meta.cmd==='nc'&&r.meta.state==='refused'&&r.meta.port===8001},
{what:`Knock on an address where no machine lives`,cmd:`nc -zv -w 3 10.7.0.99 80`,parts:[[`-w 3`,`Give up after 3 seconds.`],[`10.7.0.99`,`An empty bay.`]],
 saw:`Timed out. Compare with the last step: refused came back instantly from a machine that exists, while this waited and heard nothing. Refused means wrong port or the program is not running. Timeout means wrong address, machine down, or a firewall.`,test:(l,w,r)=>r.meta.cmd==='nc'&&r.meta.state==='timeout'},
{what:`Knock on hatch 22`,cmd:`nc -zv kestrel.test 22`,parts:[[`22`,`The conventional port for SSH, the remote shell.`]],
 saw:`Open. A different program on the same machine: the SSH server.`,test:(l,w,r)=>r.meta.cmd==='nc'&&r.meta.state==='ok'&&r.meta.port===22},
{what:`Send HTTP through the SSH hatch`,cmd:`curl -s kestrel.test:22`,parts:[[`kestrel.test:22`,`A port number after the host, with a colon. curl will speak HTTP to whatever is there.`]],
 saw:`An error from curl: the connection opened, and what came back was not HTTP. A port is only a number. What matters is which protocol the program behind it speaks, and both sides have to agree.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.fail==='http09'},
{what:`Ask "localhost" for the Kestrel's status`,cmd:`curl -s localhost/status`,parts:[[`localhost`,`This machine. The bench, not the Kestrel.`]],
 saw:`Connection refused. localhost is the bench itself, and the bench runs no web server. This catches everyone once: a URL with localhost in it only works on the machine where the server runs, and inside a container localhost is the container.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.fail==='refused'&&r.meta.host==='localhost'}
],
notes:`<h2>127.0.0.1 and 0.0.0.0</h2>
<p>When a server starts it chooses which address to listen on. <code>127.0.0.1</code> accepts connections only from the same machine. <code>0.0.0.0</code> means every address the machine has, so other machines can connect. This is why a dev server sometimes works in your browser and not from your phone, and why uvicorn inside a container must be started with <code>--host 0.0.0.0</code>: to the container, Docker's port forwarding counts as "another machine".</p>
<h2>Seeing what is listening</h2>
<p>On a server you control, <code>ss -tlnp</code> (Linux) or <code>lsof -i -P | grep LISTEN</code> (macOS) lists every open port and the program behind it. "Address already in use" when starting a server means another program got to that port first.</p>
<h2>Docker's -p, again</h2>
<p><code>-p 8080:80</code> from <em>Docker from Zero</em> reads as hatch 8080 on the host leads to hatch 80 inside the container. A Kubernetes Service does the same job one level up.</p>
<h2>Firewalls and security groups</h2>
<p>In the cloud, each machine has a list of which ports accept connections from where. A new server that times out on port 443 almost always needs that port opened in its security group. Timeouts point to firewalls; refusals point to the program.</p>`,
quiz:[
{q:'"Connection refused" arrives instantly. What does that tell you?',opts:['DNS failed','The machine answered, and no program is listening on that port','A firewall dropped the packets','The server returned 403'],a:1,why:'A refusal is an active reply from the machine. Check the port number and whether the service is running.'},
{q:'Your API works at http://localhost:8000 on your laptop. A teammate opens the same URL on their laptop and it fails. Why?',opts:['Their browser blocks port 8000','localhost means their own machine, where your API is not running','DNS has not propagated','They need a certificate'],a:1,why:'localhost always points at the machine you are sitting at.'},
{q:'A URL has no port in it: https://example.com/page. Which port is used?',opts:['80','8080','443','It asks DNS'],a:2,why:'443 is the default for https, and 80 for http.'}],
reading:[
['What is a computer port? (Cloudflare)',CF+'/network-layer/what-is-a-computer-port/','Ports, the well-known numbers, and how firewalls use them.'],
['What is an IP address? (Cloudflare)',CF+'/dns/glossary/what-is-my-ip-address/','Public and private addresses, IPv4 and IPv6.'],
['What is TCP/IP? (Cloudflare)',CF+'/ddos/glossary/tcp-ip/','The connection underneath HTTP, including the three-way handshake.']]},

{id:6,title:'Headers: the fine print on every order',mins:12,
idea:`
<p>Between the first line and the body, every request and response carries <strong>headers</strong>: <code>Name: value</code> lines of information about the message. Most of the behaviour people find mysterious in web systems is a header doing its job. This lesson takes the four you will meet most.</p>
<dl class="terms">
<dt><code>Host</code> (request)</dt><dd>Which site you want. One address and port can serve many sites, and this header is how the server tells them apart. It is what <code>server_name</code> matched in <em>NGINX from Zero</em>.</dd>
<dt><code>Authorization</code> (request)</dt><dd>Your credentials, sent on every request because HTTP remembers nothing. <code>Bearer</code> followed by a token is the form from <em>OAuth from Zero</em>.</dd>
<dt><code>Content-Type</code> (both)</dt><dd>The format of the body that follows. Send JSON without it and the server will not read it as JSON.</dd>
<dt><code>Accept</code> (request)</dt><dd>The formats you would like back. The server picks one and names it in the response's Content-Type. This is called content negotiation.</dd>
</dl>
<p>Header names are not case-sensitive: <code>Content-Type</code>, <code>content-type</code> and <code>CONTENT-TYPE</code> are the same header. You will see both styles in one response here, because NGINX writes its own headers capitalised and passes the app's along in lower case.</p>
<p>The Kestrel's <strong>reactor</strong> readout (R, the ring in the chest) is restricted. It accepts two tokens in this sandbox: <code>pilot-1</code> belongs to a pilot and <code>tech-7</code> to a hangar tech.</p>`,
labIntro:'Watch the exchange panel on the left: the headers you add with -H appear in the request, exactly as typed.',
tasks:[
{what:`Reach the Kestrel by its address instead of its name`,cmd:`curl -si 10.7.0.10/status`,parts:[P_SI,[`10.7.0.10`,`The IP address, so DNS is skipped entirely.`]],
 saw:`200. In the exchange panel the request says Host: 10.7.0.10, because curl fills in Host from whatever you put in the URL.`,test:(l,w,r)=>is(r,{status:200,host:'10.7.0.10',reqHost:'10.7.0.10'})},
{what:`Same address, same port, different Host`,cmd:`curl -si -H "Host: www.kestrel.test" 10.7.0.10/status`,parts:[[`-H "Host: www.kestrel.test"`,`Override the Host header. The connection still goes to 10.7.0.10 port 80.`]],
 saw:`301 this time. Nothing about the connection changed, only one header, and the gate treated it as a different site: the www one, whose whole job is to redirect to the main name. This is how one server hosts hundreds of sites on one address.`,test:(l,w,r)=>is(r,{status:301,reqHost:'www.kestrel.test'})},
{what:`Read the reactor with no credentials`,cmd:`curl -si kestrel.test/reactor`,parts:[[`/reactor`,`A restricted readout.`]],
 saw:`401 Unauthorized. The name is misleading: it means unauthenticated, "I do not know who you are". The www-authenticate header says what kind of credentials it wants: Bearer.`,test:(l,w,r)=>is(r,{status:401,auth:false})},
{what:`Try with the hangar tech's token`,cmd:`curl -si -H "Authorization: Bearer tech-7" kestrel.test/reactor`,parts:[[`-H "Authorization: Bearer tech-7"`,`Send credentials: the word Bearer, a space, and the token.`]],
 saw:`403 Forbidden. A different answer: the Kestrel recognised the token and knows it belongs to a tech, and techs may not read the reactor. 401 is "who are you?". 403 is "I know who you are, and no".`,test:(l,w,r)=>is(r,{status:403})},
{what:`Try with the pilot's token`,cmd:`curl -si -H "Authorization: Bearer pilot-1" kestrel.test/reactor`,parts:[[`Bearer pilot-1`,`A token that carries the right role.`]],
 saw:`200, and the reactor ring lights up. Same URL, same method: the header alone changed the outcome. Leave it off the next request and you are back to 401, because nothing is remembered.`,test:(l,w,r)=>is(r,{status:200,node:'reactor'})},
{what:`Send JSON without saying it is JSON`,cmd:`curl -s -X POST -d '{"name":"dock","x":1,"y":2}' kestrel.test/waypoints`,parts:[[`-d '{…}'`,`A JSON body, as in lesson 2.`],[`(no -H)`,`The Content-Type header from lesson 2 is missing.`]],
 saw:`422. Look at the request in the exchange panel: curl labelled the body application/x-www-form-urlencoded, the format of an old-style web form, because that is its default for -d. The Kestrel was told "this is a form" and could not find the fields. The body was fine. The label was wrong.`,test:(l,w,r)=>is(r,{status:422,method:'POST'})&&/form/.test(r.meta.sentType)},
{what:`Ask for the status as plain text`,cmd:`curl -si -H "Accept: text/plain" kestrel.test/status`,parts:[[`-H "Accept: text/plain"`,`Tell the server which format you prefer.`]],
 saw:`The same resource in another format: one line of text, and the response's Content-Type now says text/plain. The URL did not change. Request and response negotiated the representation through headers.`,test:(l,w,r)=>is(r,{status:200,path:'/status'})&&/text\/plain/.test(r.meta.ctype||'')}
],
notes:`<h2>More headers worth recognising</h2>
<table class="types"><thead><tr><th>Header</th><th>Direction</th><th>Does</th></tr></thead><tbody>
<tr><td>Cookie / Set-Cookie</td><td>request / response</td><td>The server hands the browser a small value, and the browser sends it back on every later request to that site. How sessions and "stay signed in" work.</td></tr>
<tr><td>Cache-Control</td><td>both</td><td>Whether and for how long an answer may be reused. The basis of the cache in NGINX from Zero.</td></tr>
<tr><td>Location</td><td>response</td><td>Where to go next, on a 3xx or a 201.</td></tr>
<tr><td>User-Agent</td><td>request</td><td>Which program is asking.</td></tr>
<tr><td>X-Forwarded-For</td><td>request</td><td>Added by a proxy: the original client's address.</td></tr>
<tr><td>Retry-After</td><td>response</td><td>With 429 or 503: how long to wait.</td></tr>
</tbody></table>
<h2>Cookies or bearer tokens?</h2>
<p>Both solve the same problem: proving who you are on every stateless request. The browser attaches cookies automatically, which is convenient and is also the reason cross-site rules exist (next lesson). A bearer token has to be attached by your own code.</p>
<h2>Custom headers</h2>
<p>You may invent your own, such as <code>X-Request-ID</code> for tracing one request through several services. Anything in a header is visible to every proxy on the way, so the next two lessons matter for what you put there.</p>`,
quiz:[
{q:'Two websites share one IP address and port. How does the server know which one a request is for?',opts:['The path','The Host header','The User-Agent','It cannot'],a:1,why:'Host carries the name the client asked for. The server picks the matching site.'},
{q:'401 or 403: a signed-in user with a valid token tries to open an admin page they have no rights to.',opts:['401','403','404','422'],a:1,why:'They are authenticated, so not 401. They are not permitted: 403.'},
{q:'A POST with a correct JSON body returns 422 "Input should be a valid dictionary". Most likely cause?',opts:['The server is down','The Content-Type header does not say application/json','DNS','The token expired'],a:1,why:'Without the right Content-Type the server does not parse the body as JSON.'}],
reading:[
['HTTP headers (MDN)',MDN+'/Headers','The reference list, grouped by purpose.'],
['HTTP authentication (MDN)',MDN+'/Authentication','The Authorization and WWW-Authenticate pair, and the 401 flow.'],
['Content negotiation (MDN)',MDN+'/Content_negotiation','How Accept and Content-Type cooperate.']]},

{id:7,title:'Clearance for cockpit screens: CORS',mins:14,
idea:`
<p>In <em>React + TypeScript from Zero</em> the cockpit dev team built the pilot's screens. Those screens are a web page, served by a dev server at <code>http://cockpit.kestrel.test:5173</code>, and the page's JavaScript calls the Kestrel's API at <code>http://kestrel.test</code>. Sooner or later that produces the most-searched error in web development: <em>"blocked by CORS policy"</em>.</p>
<p>The rule behind it is the browser's <strong>same-origin policy</strong>. An <strong>origin</strong> is three things together: scheme, host and port. A page's script may freely read responses from its own origin. For any other origin, the browser makes the request and then <strong>refuses to hand the answer to the script</strong>, unless the answering server has said that this page's origin is allowed. <strong>CORS</strong> (cross-origin resource sharing) is how the server says so, in response headers. Think of it as the Kestrel's <strong>clearance list</strong> for cockpit screens.</p>
<p>Three facts clear up most of the confusion:</p>
<ol>
<li><strong>The browser enforces it, not the server.</strong> curl, Postman, mobile apps and other servers are never blocked. That is why "it works in curl and fails in the browser" is the signature of a CORS problem.</li>
<li><strong>The fix is always on the server being called.</strong> No change to the front-end code can grant itself clearance.</li>
<li><strong>It protects the user, not the API.</strong> Without it, any page you visit could quietly read your webmail or your bank using the cookies in your browser. It is no substitute for authentication.</li>
</ol>
<dl class="terms">
<dt>Origin</dt><dd><code>http://cockpit.kestrel.test:5173</code> and <code>http://kestrel.test</code> differ in host and port, so they are different origins. So are http and https versions of one site.</dd>
<dt><code>Origin</code> (request header)</dt><dd>The browser adds it to cross-origin requests: "the page asking came from here".</dd>
<dt><code>Access-Control-Allow-Origin</code> (response header)</dt><dd>The server's reply: the one origin allowed to read this answer, or <code>*</code> for anyone.</dd>
<dt>Preflight</dt><dd>Before a request that could change something (a DELETE, or a POST with JSON), the browser first sends an <code>OPTIONS</code> request asking permission. Only if that passes does it send the real one.</dd>
</dl>`,
widget:'cors',widgetTitle:'The Kestrel\'s clearance list, in FastAPI',widgetIntro:'This is all the configuration there is. Tap any line.',
labIntro:'curl is not a browser, so it will show you every answer regardless. To see what a browser would do, you will add the Origin header by hand, and a new card on the schematic, marked P, gives the browser\'s verdict for a page from that origin.',
tasks:[
{what:`Fetch the cockpit page itself`,cmd:`curl -s cockpit.kestrel.test:5173`,parts:[[`cockpit.kestrel.test:5173`,`The dev server from the React guide. Port 5173 is Vite's default.`]],
 saw:`A small HTML page that loads the app's script. Note the address: a different host and a different port from the API. Everything that script requests from kestrel.test is cross-origin.`,test:(l,w,r)=>is(r,{status:200,via:'vite'})},
{what:`Call the API as the cockpit page would`,cmd:`curl -si ${ORIGIN_OK} kestrel.test/waypoints`,parts:[P_SI,[ORIGIN_OK,`What a browser adds by itself when the page at that origin calls another origin.`]],
 saw:`200, and among the headers: access-control-allow-origin with the cockpit's origin. The dot came from P this time, and the P card says the browser hands the answer to the page.`,test:(l,w,r)=>is(r,{status:200,origin:COCKPIT})&&r.meta.cors.ok},
{what:`Call it from a page that is not on the list`,cmd:`curl -si -H "Origin: http://evil.test" kestrel.test/waypoints`,parts:[[`-H "Origin: http://evil.test"`,`Pretend the request comes from a page on some other site.`]],
 saw:`Look closely: still 200, and the waypoints are right there in the body. The Kestrel answered. The only difference is that access-control-allow-origin is missing, and on that alone a browser would refuse to let evil.test's script see the answer. curl shows it to you because curl is not a browser.`,test:(l,w,r)=>is(r,{status:200,origin:'http://evil.test'})&&!r.meta.cors.ok},
{what:`Send the preflight a browser sends before a DELETE`,cmd:`curl -si -X OPTIONS ${ORIGIN_OK} -H "Access-Control-Request-Method: DELETE" kestrel.test/waypoints/1`,parts:[[`-X OPTIONS`,`The method browsers use to ask permission.`],[ORIGIN_OK,`Who is asking.`],[`-H "Access-Control-Request-Method: DELETE"`,`What the real request will be.`]],
 saw:`200 with access-control-allow-methods and access-control-max-age. Nothing was deleted: the preflight only asks. max-age 600 lets the browser remember this permission for ten minutes. In the browser's Network tab this is the extra OPTIONS row that appears before your real request.`,test:(l,w,r)=>is(r,{status:200,method:'OPTIONS',pre:true})&&r.meta.cors.ok},
{what:`Send the same preflight from the other site`,cmd:`curl -si -X OPTIONS -H "Origin: http://evil.test" -H "Access-Control-Request-Method: DELETE" kestrel.test/waypoints/1`,parts:[[`-H "Origin: http://evil.test"`,`Not on the clearance list.`]],
 saw:`400 Disallowed CORS origin. A browser stops here and never sends the DELETE. For requests that change things, the preflight means the dangerous request is not even made.`,test:(l,w,r)=>is(r,{status:400,pre:true})},
{what:`Reproduce the classic local-development failure`,cmd:`curl -si -H "Origin: http://localhost:5173" kestrel.test/waypoints`,parts:[[`-H "Origin: http://localhost:5173"`,`A developer running the cockpit app on their own laptop.`]],
 saw:`200 and no access-control-allow-origin, so the browser blocks it. The app is the same app, but its origin is now http://localhost:5173, and that exact string is not on the list. The fix is on the API: add that origin to allow_origins for development. Changing the front end cannot help.`,test:(l,w,r)=>is(r,{status:200,origin:'http://localhost:5173'})&&!r.meta.cors.ok}
],
notes:`<h2>Reading the browser's error</h2>
<p>The console message names both sides: <em>Access to fetch at 'http://kestrel.test/waypoints' from origin 'http://localhost:5173' has been blocked by CORS policy: No 'Access-Control-Allow-Origin' header is present.</em> The second URL is the string that must appear in the server's list. Then open the Network tab and look for the OPTIONS request and its status.</p>
<h2>Three ways out, in order of preference</h2>
<ol>
<li><strong>Do not be cross-origin.</strong> Serve the front end and the API from one origin, with the gate routing <code>/api</code> to the API and everything else to the front end, as in lesson 8 of <em>NGINX from Zero</em>. No CORS involved. In development, Vite's <code>server.proxy</code> setting does the same thing.</li>
<li><strong>List the exact origins</strong> in the API's CORS settings, with separate lists for development and production.</li>
<li><strong><code>*</code></strong> only for truly public, read-only data. It cannot be combined with cookies or credentials, by design.</li>
</ol>
<h2>What triggers a preflight</h2>
<p>A plain GET, or a simple form POST, goes straight through (and is still subject to the read check). Anything with a method like PUT, PATCH or DELETE, a JSON Content-Type, or an Authorization header gets a preflight first. Most API calls from a modern front end therefore cost two requests the first time.</p>
<h2>A CORS error that is not a CORS problem</h2>
<p>If the API crashes with a 500, or the gate answers 502, the error page usually carries no CORS headers, and the browser reports a CORS failure. Check the status code of the failing request before touching the clearance list.</p>`,
quiz:[
{q:'Who enforces CORS?',opts:['The API server refuses the request','The browser, by withholding the response from the page\'s script','The DNS resolver','The reverse proxy'],a:1,why:'The server only states its policy in headers. The browser is what blocks, which is why curl is never affected.'},
{q:'Are http://kestrel.test and https://kestrel.test the same origin?',opts:['Yes, same host','No: the scheme differs, and so does the default port','Only in Chrome','Only for GET'],a:1,why:'An origin is scheme, host and port together. Any difference makes it a different origin.'},
{q:'The front end at http://localhost:5173 is blocked from calling the API. Where is the fix made?',opts:['In the React code','In the browser\'s settings','In the API\'s CORS configuration, by adding that origin','In /etc/hosts'],a:2,why:'Only the server being called can grant clearance.'}],
reading:[
['Cross-Origin Resource Sharing (MDN)',MDN+'/CORS','The full explanation, with diagrams of simple and preflighted requests.'],
['FastAPI: CORS','https://fastapi.tiangolo.com/tutorial/cors/','The middleware from the widget above, option by option.'],
['Same-origin policy (MDN)','https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy','The underlying rule, and what counts as the same origin.']]},

{id:8,title:'A sealed channel: TLS and HTTPS',mins:14,
idea:`
<p>Look at the strip at the bottom of the panel, "On the wire". Every order you have sent so far crossed the hangar network as readable text. Anyone on that network (another bench, the wifi, any router on the way) could read it and could change it. That includes the pilot's token from lesson 6.</p>
<p><strong>TLS</strong> (Transport Layer Security) fixes this by wrapping the connection in a <strong>sealed channel</strong>. HTTP over TLS is <strong>HTTPS</strong>, on port 443. The HTTP inside is exactly what you already know: same methods, headers and status codes. TLS adds three guarantees around it:</p>
<ul>
<li><strong>Privacy.</strong> Nobody in between can read it.</li>
<li><strong>Integrity.</strong> Nobody in between can alter it unnoticed.</li>
<li><strong>Identity.</strong> You are really talking to kestrel.test, and not to something pretending to be it.</li>
</ul>
<p>Identity is the subtle one, because encryption is useless if you have sealed a channel with an impostor. The Kestrel proves who it is with an <strong>ID plate</strong> (a <strong>certificate</strong>): a small file stating "this key belongs to kestrel.test", signed by a <strong>hangar authority</strong> (a <strong>certificate authority</strong>, CA). Your machine holds a list of authorities it trusts. If the signature traces back to one of them, and the name on the plate matches the name you asked for, and the date is valid, the channel opens. Otherwise the client refuses, loudly.</p>
<dl class="terms">
<dt>Certificate</dt><dd>A public key, the names it is valid for, an expiry date, and a CA's signature over all of it.</dd>
<dt>Certificate authority (CA)</dt><dd>An organisation that checks you control a domain and then signs your certificate. Let's Encrypt does it for free, automatically.</dd>
<dt>Trust store</dt><dd>The list of CAs your operating system or browser already trusts.</dd>
<dt>Handshake</dt><dd>The exchange at the start of the connection where the server presents its certificate and both sides agree on encryption keys.</dd>
<dt>TLS termination</dt><dd>The gate handles TLS and talks plain HTTP to the services behind it. You met this at the end of <em>NGINX from Zero</em>.</dd>
</dl>
<p>In this hangar the Kestrel's certificate was signed by a private authority, the Hangar Root CA. Its public certificate is in a file on this bench, <code>hangar-ca.pem</code>, and the bench has not yet been told to trust it.</p>`,
widget:'tls',widgetTitle:'The handshake',widgetIntro:'What happens between "connected" and the first line of HTTP. Press Next, or tap any box.',
labIntro:'Keep an eye on the "On the wire" strip, and on the data cable running from the bench (B) into the Kestrel on the blueprint: it turns solid green when the channel is sealed.',
tasks:[
{what:`Send the pilot's token over plain HTTP`,cmd:`curl -s -H "Authorization: Bearer pilot-1" http://kestrel.test/reactor`,parts:[[`http://`,`Plain HTTP, port 80. Written out this time, to contrast with what follows.`],[`-H "Authorization: …"`,`The token from lesson 6.`]],
 saw:`It works, and now read "On the wire": the path, the Host and the line Authorization: Bearer pilot-1 are all there in the clear. Anyone listening now has the pilot's token and can use it.`,test:(l,w,r)=>is(r,{status:200,node:'reactor',scheme:'http'})},
{what:`Switch to https`,cmd:`curl -s https://kestrel.test/status`,parts:[[`https://`,`HTTP inside TLS, on port 443.`]],
 saw:`curl refused with error 60: it could not verify the certificate, because it was signed by an authority this bench does not know. No request was sent. This is TLS doing its job: an unknown signer could be anyone.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.fail==='issuer'},
{what:`Find the hangar authority's certificate`,cmd:`ls`,parts:[[`ls`,`List the files in this folder.`]],
 saw:`hangar-ca.pem: the public certificate of the Hangar Root CA. It is safe to share. It lets you check signatures, not make them.`,test:(l,w,r)=>r.meta.cmd==='ls'},
{what:`Tell curl to trust that authority`,cmd:`curl -s --cacert hangar-ca.pem https://kestrel.test/status`,parts:[P_CA,[`https://kestrel.test/status`,`The same request as before.`]],
 saw:`200. The signature on the Kestrel's certificate traced back to an authority you trust, the name matched, and the channel opened. The cable from B is solid green, and "On the wire" now shows only that a TLS connection to kestrel.test exists, followed by unreadable bytes.`,test:(l,w,r)=>is(r,{status:200,scheme:'https',path:'/status'})&&!r.meta.insecure&&!r.meta.verbose},
{what:`Watch the handshake and read the certificate`,cmd:`curl -sv --cacert hangar-ca.pem https://kestrel.test/status`,parts:[[`-v`,`Verbose, as in lesson 1. The TLS steps appear between "Connected" and the first > line.`]],
 saw:`Find four things: "SSL connection using TLSv1.3"; subject CN=kestrel.test (the name on the plate); the expire date; and issuer CN=Hangar Root CA with "SSL certificate verify ok". After that the > and < lines are ordinary HTTP.`,test:(l,w,r)=>is(r,{status:200,scheme:'https',verbose:true})},
{what:`Connect by address instead of by name`,cmd:`curl -s --cacert hangar-ca.pem https://10.7.0.10/status`,parts:[[`https://10.7.0.10`,`The right machine, reached without using its name.`]],
 saw:`Refused again, for a different reason: the certificate is trusted, but it says kestrel.test and you asked for 10.7.0.10. A certificate vouches for a name. This is why HTTPS and DNS are tied together, and why a certificate for one domain cannot be used on another.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.fail==='certname'},
{what:`Send the pilot's token again, sealed`,cmd:`curl -s --cacert hangar-ca.pem -H "Authorization: Bearer pilot-1" https://kestrel.test/reactor`,parts:[P_CA,[`-H "Authorization: …"`,`The same header as in step 1.`]],
 saw:`The same answer as step 1. Now read "On the wire": the token, the path and the response are gone. The only readable things left are the address and the server name. This is why credentials must only ever travel over https.`,test:(l,w,r)=>is(r,{status:200,node:'reactor',scheme:'https'})},
{what:`See the shortcut you should not take`,cmd:`curl -sk https://kestrel.test/status`,parts:[[`-k`,`Insecure: skip certificate verification completely.`]],
 saw:`It works with no --cacert, and that is the problem. The traffic is encrypted, but curl did not check who it is encrypted to, so an impostor would be accepted just as happily. -k is for a quick look at your own test server. In scripts, CI and production, give the client the right CA instead.`,test:(l,w,r)=>is(r,{status:200,scheme:'https',insecure:true})}
],
notes:`<h2>On the public internet</h2>
<p>You will not pass <code>--cacert</code> for real websites. Their certificates are signed by public authorities that are already in every trust store. <strong>Let's Encrypt</strong> issues them free of charge: a tool such as certbot, or a server such as Caddy, proves you control the domain (often by placing a DNS TXT record, lesson 4), receives a 90-day certificate and renews it automatically. Cloud platforms like the ones in <em>Cloud Deploy from Zero</em> do all of this for you when you attach a domain.</p>
<h2>What HTTPS does not hide</h2>
<p>The IP address and port, the server's name (sent in the clear at the start of the handshake, as SNI), and roughly how much data moved and when. The path, query string, headers, cookies and bodies are all sealed.</p>
<h2>Certificate errors, translated</h2>
<table class="types"><thead><tr><th>Message contains</th><th>Meaning</th></tr></thead><tbody>
<tr><td>unable to get local issuer certificate / unknown CA / self-signed</td><td>Signed by an authority the client does not trust.</td></tr>
<tr><td>subject name does not match / hostname mismatch</td><td>The certificate is for a different name than the URL.</td></tr>
<tr><td>certificate has expired</td><td>Renewal failed. The most common production TLS outage.</td></tr>
<tr><td>wrong version number</td><td>You spoke https to a port that serves plain http.</td></tr>
</tbody></table>
<h2>Small things that follow from all this</h2>
<ul>
<li>Sites redirect port 80 to 443 with a 301 (lesson 3), and send a <code>Strict-Transport-Security</code> header so browsers skip plain http next time. The Kestrel sends it too: add -i to an https request to see it.</li>
<li>An https page cannot call an http API. Browsers block it as "mixed content".</li>
<li>http and https versions of a site are different origins (lesson 7).</li>
<li>OAuth requires https for redirect URLs, with localhost as the one exception, because tokens travel in them.</li>
</ul>`,
quiz:[
{q:'What does a certificate prove?',opts:['That the site is safe to use','That the holder of a particular key controls a particular domain name, according to a CA you trust','That the server is fast','That the content is true'],a:1,why:'It binds a key to a name. It says nothing about the intentions of whoever runs the site.'},
{q:'With https, which of these can someone on the same wifi still see?',opts:['The Authorization header','The request body','The server\'s name and IP address','The path and query string'],a:2,why:'The destination is visible. Everything inside the HTTP messages is encrypted.'},
{q:'Why is curl -k (or "verify=False") dangerous in production code?',opts:['It disables encryption','It skips the identity check, so a server impersonating the real one is accepted','It slows requests down','It sends the password twice'],a:1,why:'The connection is still encrypted, but possibly to the wrong party. Encryption without identity protects nothing.'}],
reading:[
['How HTTPS works (comic)','https://howhttps.works/','From the makers of the DNS comic: certificates, authorities and the handshake as a story.'],
['What happens in a TLS handshake? (Cloudflare)',CF+'/ssl/what-happens-in-a-tls-handshake/','Each step of the handshake in order.'],
['How Let\'s Encrypt works','https://letsencrypt.org/how-it-works/','How a CA checks that you control a domain and issues a certificate automatically.']]}
];

function createSim(upto){
  const w={skew:0,hosts:[['127.0.0.1','localhost']],rcache:{},wps:[{id:1,name:'hangar',x:0,y:0},{id:2,name:'gate-alpha',x:4,y:18}],nextId:3,solve:1040,last:null,stamp:0,booting:false,sport:51200};
  const clock=()=>Date.now()+w.skew;
  const WAIT=ms=>'\u0002'+(w.booting?1:Math.max(1,Math.round(ms)));
  const E=(out,meta)=>({ok:false,out:Array.isArray(out)?out.join('\n'):out,meta:meta||{}}),OK=(out,meta)=>({ok:true,out:Array.isArray(out)?out.join('\n'):(out||''),meta:meta||{}});
  const p2=n=>String(n).padStart(2,'0');
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const httpDate=t=>{const d=new Date(t);return DAY[d.getUTCDay()]+', '+p2(d.getUTCDate())+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()+' '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds())+' GMT';};
  const isIp=h=>/^\d+\.\d+\.\d+\.\d+$/.test(h);

  /* ----- names to addresses ----- */
  function dnsLookup(name){
    const out=[];let n=name;
    if(n==='localhost')return {chain:[[n,'A','127.0.0.1',0]],ip:'127.0.0.1'};
    for(let k=0;k<4;k++){
      const z=ZONE[n];if(!z)return null;
      const t=clock();let c=w.rcache[n];if(!c||t>=c.exp)c=w.rcache[n]={exp:t+z.ttl*1000,ip:null};
      const ttl=Math.max(1,Math.ceil((c.exp-t)/1000));
      if(z.cname){out.push([n,'CNAME',z.cname+'.',ttl]);c.ip='→ '+z.cname;n=z.cname;}else{out.push([n,'A',z.a,ttl]);c.ip=z.a;return {chain:out,ip:z.a};}
    }
    return null;
  }
  function resolve(host){
