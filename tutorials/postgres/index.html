<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postgres from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right the Kestrel Mk II blueprint with a callout per part of the Postgres server, the same parts as rows beside it, the tables underneath, and a psql terminal that changes them. One dark terminal world; on phones the bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:attr(data-p) " ";color:var(--term-dim)}
.ran::before{content:attr(data-p) " ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-tables{border-top-color:var(--good)}.z-session{border-top-color:var(--accent)}.z-databases{border-top-color:var(--warn)}.z-roles{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-tables .zlist{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}

.wcards{display:flex;flex-direction:column;gap:10px}
.wcard{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.wcard>code{overflow-wrap:anywhere;font-size:.8rem;color:var(--good)}
.wcard .caption{font-size:.88rem}
.wtrack{position:relative;height:18px;background:var(--sunk);border-radius:2px;margin:0 6px}
.wtrack i{position:absolute}
.wtrack .upd{top:-2px;bottom:-2px;width:2px;background:var(--good)}
.wtrack .chk{top:5px;width:8px;height:8px;border-radius:50%;margin-left:-4px}
.chk.n{background:var(--bad)}.chk.y{background:var(--good);box-shadow:0 0 0 2px var(--sunk)}
.notes table.types code{white-space:nowrap}
.widget .bw-page{max-height:none}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}

/* ---- CI guide additions ---- */
:root{--accent:#a78bfa;--accent-ink:#150a33;--accent-soft:#251d44}
.prose code,.task code,.explain code,.saw code{color:#cfc0ff}
.z-git{border-top-color:var(--accent)}
.pz .z-run{border-bottom:0}
.xsteps li.going::before{content:"\25B8";color:var(--warn)}
.xsteps li.wait::before{content:"\00B7";color:var(--muted)}
.xsteps li.going code{color:var(--warn)}
.xsteps li.wait code,.xsteps li.skip code{color:var(--muted)}
.xsteps{margin:0 0 4px 22px}
.tm.passed,.tm.failed,.tm.running,.tm.queued{line-height:1.5}
.rbody{white-space:pre-wrap;overflow-wrap:anywhere;max-height:210px}
.runlist{max-height:96px}
.crow{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line);font:400 .76rem/1.4 var(--mono)}
.crow:last-child{border-bottom:0}
.crow .sha{color:var(--warn)}
.crow .cmsg{flex:1 1 12ch;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.crow .sub{flex-basis:auto}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.pdot.warn{background:var(--warn)}
.z-git .kv{gap:4px}
.z-git .zlist{gap:10px}
.lane .track{height:18px}
.lanes .lane span{overflow-wrap:anywhere}
.widget .segs{flex-wrap:wrap}
.pl .d{color:var(--accent)}
.prose ol{padding-left:22px;margin:0 0 12px}
.z-steps .tr b{font-size:.8rem}

.jobs{display:flex;flex-wrap:wrap;gap:4px}
.jtab{display:flex;align-items:center;gap:6px;font:500 .74rem var(--mono);padding:3px 9px 3px 4px;border-radius:3px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.jtab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.strip{border-top:1px solid var(--line)}
.strip .zone{border-top:0;border-right:0;padding:8px 12px;gap:6px}
.strip .zsub{display:none}
.strip h3{font-size:.7rem;color:var(--muted)}
.strip .zlist{flex-direction:row;flex-wrap:wrap;gap:6px 18px}
.strip .kv .empty{font:400 .75rem var(--mono)}
@media (min-width:1040px){
  .map{display:flex;flex-direction:column;overflow:hidden;max-height:66%}
  .map>.pz{flex:1 1 auto;min-height:0;overflow:auto}
  .map>.strip{flex:none;max-height:36%;overflow:auto}
}
/* ---- NGINX guide additions ---- */
:root{--accent:#22d3ee;--accent-ink:#031a1f;--accent-soft:#0c2b33}
.prose code,.task code,.explain code,.saw code{color:#a5ecf7}
.pl .d{color:var(--accent)}.pl .k{color:#ffb86b}
.z-path{border-top-color:var(--good)}.z-reactor{border-top-color:var(--warn)}
.pz .z-path{border-bottom:0}
.pycode{max-height:330px}
.gate{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.arrowr{align-self:center;color:var(--muted);font:500 1rem var(--mono)}
.node{flex:1 1 120px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.node b{font:500 .8rem var(--mono)}
.node.on{border-color:var(--accent)}
.node.off{opacity:.55;border-style:dashed}
.node.bad{animation:refuse .5s}
@keyframes refuse{20%,60%{border-color:var(--bad);background:var(--bad-soft)}}
.lanes2{display:flex;flex-direction:column;gap:5px}
.ln{display:grid;grid-template-columns:minmax(26px,.32fr) minmax(0,2.4fr);align-items:center}
.ltrack{position:relative;height:2px;background:var(--accent)}
.ln.unwired .ltrack{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.pkt{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);opacity:0;animation:fly .55s ease-in forwards}
.pkt.hit{background:var(--good);box-shadow:0 0 6px var(--good)}
.pkt.limit{background:var(--bad);box-shadow:0 0 6px var(--bad)}
@keyframes fly{0%{left:0;opacity:1}90%{opacity:1}100%{left:calc(100% - 10px);opacity:0}}
.ccard{border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;background:var(--sunk);padding:5px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ccard b{font:500 .82rem var(--mono)}
.ccard.up{border-left-color:var(--good)}
.ccard.down{border-left-color:var(--bad);opacity:.7}
.ccard.over{border-left-color:var(--bad)}
.ccard.spec{border-left-color:var(--accent);border-style:dashed;border-left-style:solid}
.ccard.glow{animation:glow .9s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--accent)}35%{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.ccard .sub,.node .sub{flex-basis:auto}
.lbar{height:6px;border-radius:2px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--good);transition:width .4s}
.lbar.over i{background:var(--bad)}
.strip .z-reactor .zlist{align-items:flex-end}
.kv.grow{flex:1 1 220px}
.gauge{position:relative;flex:1 1 120px;min-width:100px;height:12px;border-radius:2px;background:var(--sunk);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--good);transition:width .5s}
.gauge.over i{background:var(--bad)}
.gauge em{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--warn)}
.kv b.hot{color:var(--bad)}
.kv .row{flex-wrap:nowrap}
.pill.re{white-space:nowrap}
@media (min-width:1040px){.map{max-height:68%}}
@media (prefers-reduced-motion:reduce){.pkt{animation:none}.ccard.glow,.node.bad{animation:none}}

/* the Kestrel load map */
.duo2{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:start}
@media (min-width:720px){.duo2{grid-template-columns:minmax(170px,.82fr) minmax(0,1.18fr)}.kfig{position:sticky;top:0}}
.kfig{border:1px solid var(--line);border-radius:4px;padding:2px;min-width:0;background:linear-gradient(var(--term-line) 1px,transparent 1px) 0 0/100% 20px,linear-gradient(90deg,var(--term-line) 1px,transparent 1px) 0 0/20px 100%,var(--term)}
.kfig svg{display:block;width:100%;height:auto;max-height:340px;margin:0 auto;overflow:visible}
.kes .pl{fill:var(--lf,#121a22);stroke:var(--ls,#52697b);stroke-width:1.4;stroke-linejoin:round;transition:fill .6s,stroke .6s}
.kes .ln{fill:none;stroke:#3d5263;stroke-width:1}
.kes .nd.dark .pl{stroke-dasharray:4 3}
.kes .nd.skip .pl{stroke:var(--warn);stroke-dasharray:7 3}
.kes .nd.hot .pl{animation:hot .5s ease-in-out 4 alternate}
@keyframes hot{to{fill:rgba(255,123,114,.85)}}
.kes .nd.aux{opacity:.28;transition:opacity .6s}
.kes .nd.aux.used{opacity:1}
.kes .nd.head .pl{stroke:var(--accent)}
.kes .reactor .ring{fill:none;stroke:var(--good);stroke-width:2.2}
.kes .reactor .glow{fill:var(--good);transition:fill-opacity .6s}
.kes .reactor .pip{fill:var(--term);stroke:var(--good);stroke-width:1.4}
.kes .reactor.idle .ring,.kes .reactor.idle .pip{stroke:#52697b}
.kes .reactor.over .ring,.kes .reactor.over .pip{stroke:var(--bad)}
.kes .reactor.over .glow{fill:var(--bad);animation:melt .45s ease-in-out infinite alternate}
@keyframes melt{to{fill-opacity:.25}}
.kes .cd{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 4;opacity:.85}
.kes .cd.bk{stroke:var(--warn)}
.kes .cd.dead{stroke:var(--bad);opacity:.55}
.kes .cd.skip{stroke:var(--warn);opacity:.55}
.kes .cd.mem{stroke:var(--good)}
.kes.refit .cd{stroke-dasharray:320;animation:cdraw .9s ease-out}
@keyframes cdraw{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
.kes .scan{fill:var(--accent);opacity:0}
.kes.refit .scan{animation:sweep 1s ease-out}
@keyframes sweep{from{transform:translateY(0);opacity:.9}to{transform:translateY(370px);opacity:0}}
.kes .mk circle,.kes .mk rect{fill:var(--term);stroke:#7d8d99;stroke-width:1.4}
.kes .mk text{font:700 11px var(--mono);fill:var(--ink);text-anchor:middle}
.kes .mk.on circle,.kes .mk.on rect{stroke:var(--good)}
.kes .mk.bal.on circle,.kes .mk.pilot circle{stroke:var(--accent)}
.kes .mk.off{opacity:.5}
.kes .mk.down circle,.kes .mk.hot circle{stroke:var(--bad)}
.kes .mk.down text{fill:var(--bad)}
.kes .mk.hit circle,.kes .mk.hit rect{animation:mkhit .9s ease-out}
@keyframes mkhit{30%{fill:var(--accent);stroke-width:4}}
.kes .mk.err circle{animation:mkerr .6s}
@keyframes mkerr{30%,70%{fill:var(--bad)}}
.kes .gatebar{stroke:var(--bad);stroke-width:3;stroke-linecap:round;opacity:.55}
.kes .gatebar.shut{animation:shut .8s}
@keyframes shut{30%{opacity:1;stroke-width:6}}
.kes .pk{fill:var(--accent);opacity:0;offset-rotate:0deg;animation:pkrun .8s linear forwards;filter:drop-shadow(0 0 3px var(--accent))}
.kes .pk.hit{fill:var(--good);filter:drop-shadow(0 0 3px var(--good))}
.kes .pk.limit{fill:var(--bad);filter:drop-shadow(0 0 3px var(--bad));animation-duration:.5s}
@keyframes pkrun{0%{offset-distance:0%;opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.bdg{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:50%;border:1.5px solid var(--muted);font:700 .68rem var(--mono);color:var(--ink);background:var(--term)}
.bdg.on{border-color:var(--good)}.bdg.down,.bdg.over{border-color:var(--bad)}.bdg.lim{border-color:var(--bad);color:var(--bad);border-radius:4px}
.ccard.gatec{border-left-color:var(--accent)}
.gatec .bdg{border-color:var(--accent)}
.gatec .arrowr{font-size:.8rem}
@media (prefers-reduced-motion:reduce){.kes .pk,.kes .nd.hot .pl,.kes .reactor.over .glow,.kes.refit .cd,.kes.refit .scan,.kes .mk.hit circle,.kes .mk.hit rect,.kes .mk.err circle,.kes .gatebar.shut{animation:none}}
@media (min-width:720px){.pz{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr)}.duo2{grid-template-columns:minmax(200px,1fr) minmax(0,1.05fr)}}
.kfig svg{max-height:none}

const T_PILOTS=`CREATE TABLE pilots (id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY, callsign varchar(30) NOT NULL UNIQUE, joined_at timestamptz NOT NULL DEFAULT now(), grade varchar(20), clearance integer NOT NULL, email text NOT NULL UNIQUE, role text NOT NULL CHECK (role IN ('pilot', 'tech')));`;
const T_SORTIES=`CREATE TABLE sorties (id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY, pilot_id integer NOT NULL REFERENCES pilots(id), mission varchar(40) NOT NULL, launched_at timestamptz NOT NULL DEFAULT now(), code text NOT NULL UNIQUE, result text NOT NULL CHECK (result IN ('Complete', 'Incomplete')), delivered_ng integer NOT NULL CHECK (delivered_ng IN (0, 40)), order_log jsonb NOT NULL, idempotency_key text UNIQUE);`;
const Q_PARTS=`SELECT category, count(*) AS systems FROM subsystems WHERE online = true GROUP BY category HAVING count(*) > 1 ORDER BY systems DESC LIMIT 3;`;
const Q_LOOKUP=`EXPLAIN ANALYZE SELECT * FROM sorties WHERE pilot_id = 5;`;
const INS_SORTIE=`INSERT INTO sorties (pilot_id, mission, code, result, delivered_ng, order_log, idempotency_key) VALUES (5, 'Aster retrieval', 'M-058', 'Complete', 40, '[]', 'ada-run-058');`;
const DDL_NOTES=[
['CREATE TABLE pilots (','Build a new rack in the memory bay (create a table) named pilots. The column definitions go between the brackets, separated by commas. Table names are plural, lower case, with underscores [[DAT-07]]. Postgres turns unquoted names into lower case anyway.'],
['  id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,','A whole-number column that Postgres fills in by itself: 1, 2, 3 and so on. PRIMARY KEY says this value identifies the row, so it must be unique and can never be empty. Older tutorials write <code>serial</code> for the same idea. Identity is the modern, standard form, and the one the requirements ask for [[DAT-07]].'],
['  callsign varchar(30) NOT NULL UNIQUE,','Text of at most 30 characters. NOT NULL means a pilot without a callsign is refused. UNIQUE means no two pilots may share one, and the database enforces that even when two requests arrive at the same instant. In Postgres <code>varchar(30)</code> is no faster than <code>text</code>: the 30 is only a length rule.'],
['  joined_at timestamptz NOT NULL DEFAULT now(),','A date and time with a time zone. DEFAULT now() fills in the current moment when you do not supply a value. Always use <code>timestamptz</code>, never plain <code>timestamp</code> [[DAT-07]]: it records an exact instant and avoids time-zone surprises.'],
['  grade varchar(20),','Nothing after the type, so this column is optional. A missing value is stored as NULL, which means "unknown". It is not an empty string and it is not zero.'],
['  clearance integer NOT NULL,','A required whole number: the pilot\'s clearance level.'],
['  email text NOT NULL UNIQUE,','What the pilot signs in with. <code>text</code> has no length limit and is the usual choice for strings.'],
["  role text NOT NULL CHECK (role IN ('pilot', 'tech'))",'CHECK accepts any condition about the row. This one allows exactly two values, so a typo such as <code>pilto</code> can never be stored. Lesson 5 returns to this.'],
[');','Close the bracket and end the statement with a semicolon.']];
const SORTIE_NOTES=[
['CREATE TABLE sorties (','A second rack (table). The screens and the API call these missions; the table is named sorties. Each sortie belongs to one pilot, and a pilot can have many sorties. This is called a one-to-many relationship.'],
['  id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,','The same self-numbering primary key as in pilots.'],
['  pilot_id integer NOT NULL REFERENCES pilots(id),','The foreign key. REFERENCES pilots(id) means: whatever number is stored here must exist as an id in pilots. Postgres checks this on every insert and update. It also stops you deleting a pilot who still has sorties.'],
['  mission varchar(40) NOT NULL,','The mission flown. In version 1 of the simulator it is always Aster retrieval.'],
['  launched_at timestamptz NOT NULL DEFAULT now(),','Filled in with the current time automatically.'],
['  code text NOT NULL UNIQUE,','The mission number shown in the mission log, such as M-058. UNIQUE, so two sorties can never show the same number.'],
["  result text NOT NULL CHECK (result IN ('Complete', 'Incomplete')),",'Only these two words are allowed. The server decides the result [[FLT-20]]; the CHECK is the last line of defence if the server is ever wrong.'],
['  delivered_ng integer NOT NULL CHECK (delivered_ng IN (0, 40)),','Nanograms of antimatter handed over to the vault. The flight rules say it is 0 or 40 and nothing in between [[FLT-41]], so the database says so too.'],
['  order_log jsonb NOT NULL,','The orders the pilot gave, as replayed by the server, kept as one JSON document. <code>jsonb</code> is the type for data whose shape varies.'],
['  idempotency_key text UNIQUE','A token the cockpit sends with each mission report [[API-04]]. It is optional, but UNIQUE: if the same report arrives twice, the second copy is refused.'],
[');','End of the statement.']];
const SEL_NOTES=[
['SELECT category, count(*) AS systems','<strong>Written first, runs fourth.</strong> Chooses what each result row contains: plain columns, calculations, or summaries such as count(*). AS gives a column a new name in the result.'],
['FROM subsystems','<strong>Runs first.</strong> Names the table the rows come from.'],
['WHERE online = true','<strong>Runs second.</strong> Keeps only the rows where the condition is true. It looks at one row at a time, so it cannot use count() or any other summary.'],
['GROUP BY category','<strong>Runs third.</strong> Collapses the remaining rows into one row for each distinct category. After this, SELECT may only show the grouped column, or summaries of the other columns.'],
['HAVING count(*) > 1','<strong>Runs after grouping.</strong> A filter on whole groups, where summaries are allowed. Think of it as WHERE for groups.'],
['ORDER BY systems DESC','<strong>Runs fifth.</strong> Sorts the result. Without ORDER BY the order of rows is not guaranteed, even if it looks stable today. DESC means largest first.'],
['LIMIT 3;','<strong>Runs last.</strong> Keeps only the first few rows of the sorted result.']];

const LESSONS=[
{id:1,title:'What Postgres is',mins:8,setup:'fresh',
idea:`
<p>The KF-07 Kestrel Mk II forgets nothing it is told to keep: who its pilots are, and every mission they have flown. The part of the suit that does the remembering is a database, and the database is PostgreSQL, which everyone shortens to Postgres.</p>
<p>A database is the part of a system whose whole job is to remember: to keep data safe on disk, to let many people read and change it at the same time, and never to hand back a half-finished change. Postgres is a free, open-source <em>relational</em> database. Relational means the data lives in tables of rows and columns, and you ask for it in a language called SQL.</p>
<p>This guide uses the same picture of the suit as the later guides. Each part of the story is followed by the real term in brackets, and the real term is the one to remember.</p>
<dl class="terms">
<dt>The comms mast (the server)</dt><dd>Postgres is a program that runs all the time and waits for connections, normally on port 5432. In Docker from Zero this was the suit's log store, the container named <code>db</code>.</dd>
<dt>The data cable (a connection)</dt><dd>Any program that wants data plugs in and sends requests down the cable: the API, a graphical tool, or the terminal client <code>psql</code> that this guide uses. Such a program is called a client.</dd>
<dt>SQL</dt><dd>The language of the requests. <code>SELECT callsign FROM pilots;</code> reads almost like English. SQL is a standard, so most of what you learn here carries over to other databases.</dd>
<dt>The suit's memory (a database)</dt><dd>One server holds several databases, each separate from the others. A connection is always to exactly one of them. The simulator's is named <code>kestrel</code>.</dd>
<dt>Racks in the memory bay (tables)</dt><dd>Where the data actually is: a named grid in which every row has the same columns.</dd>
<dt>The flight recorder (rows)</dt><dd>What has been stored in the racks: one row per pilot, one row per mission flown.</dd>
</dl>
<p>The mental model to keep: you never open the database's files yourself. You <strong>connect</strong> to the server, send <strong>SQL</strong>, and get <strong>rows</strong> back.</p>`,
widget:'hier',widgetTitle:'Where the data lives',
widgetIntro:'Postgres keeps things inside other things. Tap each box, working from the outside in.',
labIntro:'The Postgres container from Docker from Zero is running in Hangar 7. On wide screens the sandbox is on the right; on a phone it is just below these steps. The blueprint at the top shows what the server holds, callout by callout, and the terminal underneath is where you type. Tap a command to load it, then press Run.',

notes:`
<h2>Two kinds of command</h2>
<dl class="terms">
<dt>SQL statements</dt><dd><code>SELECT</code>, <code>CREATE</code>, <code>INSERT</code> and the rest. They go to the server, they work from any client or programming language, and they end with a semicolon. Capital letters are a habit, not a rule: <code>select</code> works just as well.</dd>
<dt>psql commands</dt><dd><code>\\l</code>, <code>\\c</code>, <code>\\dt</code>, <code>\\q</code>. They start with a backslash, exist only in psql, and need no semicolon. Type <code>\\?</code> to list them.</dd>
</dl>
<h2>On your own machine</h2>
<p>This guide runs a simulated PostgreSQL 17 in the page, so nothing is installed and nothing can break. The commands are the real ones. To do it for real, start the container from Docker from Zero and connect exactly as in step 1. The commands are the same in Command Prompt, PowerShell, and the macOS and Linux terminals, as long as each is typed on one line:</p>
<pre class="file">docker run -d --name db -e POSTGRES_PASSWORD=secret -p 5432:5432 -v pgdata:/var/lib/postgresql/data postgres:17
docker exec -it db psql -U postgres</pre>
<p>If you see <code>role "root" does not exist</code>, you left out <code>-U postgres</code>, so psql tried your operating-system user name instead. Graphical clients such as pgAdmin, DBeaver and TablePlus connect to the same server and send the same SQL. They are worth trying once the basics feel familiar.</p>
<h2>Where the real <code>kestrel</code> database will live</h2>
<p>For the finished simulator the database is hosted on Neon, a company that runs Postgres for you. You will not start a container for it. Everything in this guide works there unchanged, because it is the same Postgres. Lesson 9 shows how the API finds it.</p>`,

{id:2,title:'Tables, columns and types',mins:9,setup:'empty',focus:'pilots',
idea:`
<p>The Kestrel's memory bay is empty. The first rack to build is the roster: the <code>pilots</code> table, exactly as the requirements describe it.</p>
<p>A table looks like a spreadsheet, with one large difference: its shape is decided first and then enforced. Every column has a name and a <strong>type</strong>, and Postgres refuses anything that does not fit. You cannot put the word "soon" in a date column.</p>
<p>That strictness is the point. It means every program that reads the table can rely on what it finds there.</p>
<dl class="terms">
<dt>A rack (a table)</dt><dd>A named grid. <code>pilots</code> is the roster.</dd>
<dt>A slot (a column)</dt><dd>One named piece of information that every row has, such as <code>callsign</code>.</dd>
<dt>A recorder entry (a row)</dt><dd>One thing being recorded: one pilot, one sortie.</dd>
<dt>Type</dt><dd>What kind of value a column holds: whole number, text, true or false, date, and so on.</dd>
<dt>Primary key</dt><dd>The column that identifies a row for ever, usually a number called <code>id</code> that Postgres hands out.</dd>
<dt>Schema</dt><dd>The overall shape of your tables. (Postgres also uses the word for the folder tables live in, which lesson 1 showed.)</dd>
</dl>`,
