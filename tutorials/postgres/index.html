notes:`
<h2>The types you will use most</h2>
<div class="tscroll"><table class="types">
<thead><tr><th>Type</th><th>Holds</th><th>Good to know</th></tr></thead>
<tbody>
<tr><td><code>integer</code>, <code>bigint</code></td><td>Whole numbers</td><td>integer reaches about 2 billion. Use bigint for ids in tables that may grow very large.</td></tr>
<tr><td><code>numeric(4,1)</code></td><td>Exact decimals</td><td>Four digits in total, one after the point: enough for a draw such as 22.0 kW. Also the type for money.</td></tr>
<tr><td><code>text</code>, <code>varchar(30)</code></td><td>Text</td><td>text has no limit. varchar(n) is text with a maximum length.</td></tr>
<tr><td><code>boolean</code></td><td>true or false</td><td>psql displays them as t and f.</td></tr>
<tr><td><code>date</code></td><td>A calendar day</td><td>Written as '2026-11-09'.</td></tr>
<tr><td><code>timestamptz</code></td><td>An exact moment</td><td>Stored in UTC and shown in the viewer's time zone.</td></tr>
<tr><td><code>uuid</code></td><td>A random 128-bit id</td><td>For ids that must not be guessable. Generate one with gen_random_uuid().</td></tr>
<tr><td><code>jsonb</code></td><td>A JSON document</td><td>For data whose shape varies, such as a sortie's order log. Useful, but not a reason to skip proper columns.</td></tr>
</tbody></table></div>
<h2>Mistakes everyone makes once</h2>
<ul>
<li><strong>Double quotes around text.</strong> <code>WHERE callsign = "Wren"</code> fails with <em>column "Wren" does not exist</em>, because double quotes mean a name. Text takes single quotes.</li>
<li><strong>Supplying the id yourself.</strong> A GENERATED ALWAYS column refuses a value from you. Leave it out of the INSERT.</li>
<li><strong>Calling a table user or order.</strong> Both are reserved words in SQL. Plural names such as <code>pilots</code> and <code>sorties</code> avoid the problem.</li>
<li><strong>Storing exact amounts in <code>real</code> or <code>double precision</code>.</strong> Those are approximate. 0.1 + 0.2 is not exactly 0.3 in them.</li>
</ul>
<h2>In the real project</h2>
<p>You will not type this CREATE TABLE against the real <code>kestrel</code> database. The requirements say the schema is only ever changed by a migration [[DAT-04]], and SQLAlchemy + Alembic from Zero teaches that. Its migrations send this same SQL, so being able to read it is what this lesson is for.</p>`,
quiz:[
{q:'Which type suits an exact amount such as 19.99?',opts:['real','numeric(10,2)','text','integer'],a:1,why:'numeric stores exact decimals. real is floating point and can be off by a tiny fraction, which adds up.'},
{q:'A column holds NULL. What does that mean?',opts:['The number zero','An empty piece of text','No value is recorded: it is unknown','The row has been deleted'],a:2,why:'NULL is the absence of a value. It is different from zero and from an empty string, and lesson 3 shows that it behaves differently in comparisons.'}],
reading:[
['Data types','https://www.postgresql.org/docs/current/datatype.html','The full list. Read the numeric, character and date/time sections first.'],
['Table basics','https://www.postgresql.org/docs/current/ddl-basics.html','The official chapter on creating and dropping tables.'],
['Identity columns','https://www.postgresql.org/docs/current/ddl-identity-columns.html','How self-numbering columns work, and the ALWAYS and BY DEFAULT variants.'],
["Don't Do This","https://wiki.postgresql.org/wiki/Don%27t_Do_This",'The community list of common mistakes, each with the reason and the better choice.']]
},

{id:3,title:'Ask questions with SELECT',mins:9,setup:'worksheet',focus:'subsystems',
idea:`
<p>Reading data is most of what anyone does with a database, and it is all one statement: <code>SELECT</code>. You describe the result you want, and Postgres works out how to produce it.</p>
<p>A SELECT never changes anything, so you can explore without worry. To have something worth asking about, the hangar crew has loaded the preflight console's list of the Kestrel's nine subsystems into a table called <code>subsystems</code>: name, category, the load each puts on the test bench in kW, whether it is online, and the day it was last checked.</p>
<p class="hint">subsystems is a practice table for lessons 3 and 4. The finished simulator keeps that list in its code, and its database holds only pilots and sorties [[DAT-01]].</p>
<dl class="terms">
<dt>WHERE</dt><dd>Which rows you want. A condition that is tested against each row.</dd>
<dt>ORDER BY</dt><dd>What order to return them in.</dd>
<dt>LIMIT</dt><dd>How many to return at most.</dd>
<dt>Aggregate</dt><dd>A function that boils many rows down to one value: <code>count</code>, <code>sum</code>, <code>avg</code>, <code>min</code>, <code>max</code>.</dd>
<dt>GROUP BY</dt><dd>Run the aggregates once per group, for example once per category, instead of once for the whole table.</dd>
</dl>`,
widget:'sel',widgetTitle:'The parts of a query',
widgetIntro:'A query is written in one order and worked out in another. Tap each line: the note says what it does and when it runs. Then load the whole query and run it.',
labIntro:'Start broad and narrow down. Each step adds one idea.',
tasks:[
{what:'See the whole table',cmd:'SELECT * FROM subsystems;',
 parts:[['SELECT * FROM subsystems','Every column of every row.']],
 saw:'Nine subsystems. Notice the three empty cells under checked_on: those have not been checked yet, so the value is NULL.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&r.n===9},
{what:'Filter the rows',cmd:'SELECT name, draw_kw FROM subsystems WHERE draw_kw < 8;',
 parts:[['WHERE draw_kw < 8','Keep only rows where this is true. The other comparisons are =, <>, >, <= and >=.']],
 saw:'Four rows. WHERE is tested against each row, and only the rows that pass are returned.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/where/i.test(l)&&/draw_kw\s*</i.test(l)},
{what:'Combine conditions and sort',cmd:`SELECT name, draw_kw FROM subsystems WHERE category = 'motion' AND online = true ORDER BY draw_kw DESC;`,
 parts:[["category = 'motion'",'Text is compared with single quotes around it, and the comparison is case-sensitive.'],['AND online = true','Both conditions must hold. OR means either. NOT reverses one.'],['ORDER BY draw_kw DESC','Sort by draw, highest first. ASC, the default, is lowest first.']],
 saw:'The two motion subsystems, Locomotion and Limbs, heaviest draw first.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/\band\b/i.test(l)&&/order by/i.test(l)},
{what:'Take the top three',cmd:'SELECT name, draw_kw FROM subsystems ORDER BY draw_kw DESC LIMIT 3;',
 parts:[['ORDER BY draw_kw DESC','Sort first.'],['LIMIT 3','Then keep only the first three rows.']],
 saw:'Propulsion, Locomotion, Defense systems. ORDER BY with LIMIT is how every "top ten" list and every page of results is made.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/limit\s+3/i.test(l)},
{what:'Search inside text',cmd:`SELECT name FROM subsystems WHERE name ILIKE '%co%';`,
 parts:[['ILIKE','Match a pattern, ignoring upper and lower case. LIKE is the case-sensitive version.'],["'%co%'",'% stands for any run of characters, so this means "contains co".']],
 saw:'Locomotion, Communication array and Cockpit. This is the console\'s "Search systems" box, which ignores capitals. With LIKE you would get only Locomotion, because the other two are spelled with a capital C.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/i?like/i.test(l)},
{what:'Fall into the NULL trap',cmd:'SELECT name FROM subsystems WHERE checked_on = NULL;',
 parts:[['checked_on = NULL','Looks reasonable: find the subsystems that have not been checked.']],
 saw:'Zero rows, although three subsystems have no check date. NULL means unknown, and "is this equal to unknown?" is itself unknown, never true. No error, just a wrong answer.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&r.n===0&&/=\s*null/i.test(l)},
{what:'Ask the right way',cmd:'SELECT name FROM subsystems WHERE checked_on IS NULL;',
 parts:[['IS NULL','The only correct test for a missing value. Its opposite is IS NOT NULL.']],
 saw:'Three rows. Whenever a query on an optional column returns fewer rows than you expected, suspect NULL.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/is\s+null/i.test(l)},
{what:'Add up the whole bench',cmd:'SELECT count(*), sum(draw_kw) FROM subsystems;',
 parts:[['count(*)','An aggregate: it takes all the rows and returns one number, how many there are.'],['sum(draw_kw)','Another aggregate: the draws added together.']],
 saw:'One row: 9 subsystems drawing 94.0 kW between them. An aggregate turns many rows into one.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/(count|sum)\s*\(/i.test(l)&&!/group/i.test(l)},
{what:'Summarise by category',cmd:'SELECT category, count(*), round(avg(draw_kw), 1) AS avg_kw FROM subsystems GROUP BY category ORDER BY category;',
 parts:[['GROUP BY category','Make one group for each distinct category, and run the aggregates once per group.'],['count(*)','How many rows are in each group.'],['round(avg(draw_kw), 1) AS avg_kw','The average draw, rounded to one decimal, in a result column named avg_kw.']],
 saw:'Six rows, one per category. Try the same query without round() to see why it is there.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/group by/i.test(l)}],
notes:`
<h2>Conditions you can use in WHERE</h2>
<div class="tscroll"><table class="types">
<thead><tr><th>Write</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td><code>draw_kw &lt;&gt; 9</code></td><td>Not equal. <code>!=</code> also works.</td></tr>
<tr><td><code>draw_kw BETWEEN 5 AND 10</code></td><td>From 5 to 10, including both ends.</td></tr>
<tr><td><code>category IN ('nav', 'power')</code></td><td>Any one of a list.</td></tr>
<tr><td><code>name LIKE 'Co%'</code></td><td>Starts with Co. <code>_</code> matches exactly one character.</td></tr>
<tr><td><code>checked_on IS NOT NULL</code></td><td>Has a value.</td></tr>
<tr><td><code>NOT online</code></td><td>A boolean column can stand alone as a condition.</td></tr>
</tbody></table></div>
<h2>Good to know</h2>
<ul>
<li>Without ORDER BY, rows come back in whatever order is convenient for Postgres. It often looks like insertion order, and then one day it is not.</li>
<li>In application code, list the columns you need instead of writing <code>SELECT *</code>. The query keeps working when someone adds a column, and less data travels.</li>
<li><code>SELECT DISTINCT category FROM subsystems;</code> returns each different value once.</li>
<li>After GROUP BY, every column in SELECT must be either in the GROUP BY list or inside an aggregate. Otherwise Postgres cannot know which of the group's values you mean, and says so.</li>
</ul>`,
quiz:[
{q:'Why does WHERE checked_on = NULL return no rows?',opts:['NULL has to be written in lower case','Comparing anything with NULL gives unknown, never true','The checked_on column has no index','WHERE cannot be used on date columns'],a:1,why:'NULL means unknown, so an equality test against it is never true. Use IS NULL or IS NOT NULL.'},
{q:'You want only the categories that contain more than one subsystem. Which clause holds that condition?',opts:['WHERE','ORDER BY','HAVING','LIMIT'],a:2,why:'WHERE filters single rows before grouping and cannot see count(). HAVING filters the groups afterwards.'}],
reading:[
['Querying a table','https://www.postgresql.org/docs/current/tutorial-select.html','The tutorial chapter on SELECT, WHERE and ORDER BY.'],
['Aggregate functions','https://www.postgresql.org/docs/current/tutorial-agg.html','count, sum, avg, GROUP BY and HAVING, with worked examples.'],
['Pattern matching','https://www.postgresql.org/docs/current/functions-matching.html','LIKE, ILIKE and regular expressions.'],
['PostgreSQL Exercises','https://pgexercises.com/','Free practice questions that run against a real database in the browser.']]
},

{id:4,title:'Change data without fear',mins:9,setup:'worksheet',focus:'subsystems',
idea:`
<p>Two statements change existing rows. <code>UPDATE</code> alters them and <code>DELETE</code> removes them. Both act on <em>every row that matches the WHERE clause</em>, and if you leave WHERE out, that is every row in the table. There is no confirmation and no recycle bin.</p>
<p>The safety net is the <strong>transaction</strong>. Between <code>BEGIN</code> and <code>COMMIT</code> your changes are drafts that only your connection can see. <code>ROLLBACK</code> throws the drafts away. Either everything in the transaction happens, or none of it does. On the blueprint the visor light (callout W) is amber for as long as a transaction is open.</p>
<dl class="terms">
<dt>UPDATE ... SET ... WHERE</dt><dd>Change columns in the matching rows.</dd>
<dt>DELETE FROM ... WHERE</dt><dd>Remove the matching rows.</dd>
<dt>BEGIN</dt><dd>Open a transaction.</dd>
<dt>COMMIT</dt><dd>Make every change since BEGIN permanent, all at once.</dd>
<dt>ROLLBACK</dt><dd>Undo every change since BEGIN.</dd>
</dl>
<p>When you do not type BEGIN, each statement is its own tiny transaction and is committed the instant it succeeds. That is called autocommit.</p>`,
widget:'tx',widgetTitle:'What another connection sees',
widgetIntro:'The API and your psql window are separate connections to the same server. Step through a transaction and watch what each of them can see. Press the outlined button each time.',
labIntro:'Still on the subsystems practice table. First two ordinary updates, then the classic accident and its rescue. Watch the prompt and the visor light while a transaction is open.',
tasks:[
{what:'Change one row',cmd:'UPDATE subsystems SET draw_kw = 7.0 WHERE id = 1;',
 parts:[['UPDATE subsystems','The table to change.'],['SET draw_kw = 7.0','The column and its new value. Several columns can be set, separated by commas.'],['WHERE id = 1','Which rows. Using the primary key guarantees exactly one.']],
 saw:'UPDATE 1 is the number of rows changed. Always read that number: 0 means your WHERE matched nothing.',
 test:(l,w,r)=>r.ok&&r.stmt==='update'&&r.n===1},
{what:'Change several rows, using the old value',cmd:`UPDATE subsystems SET draw_kw = draw_kw * 1.10 WHERE category = 'motion' RETURNING name, draw_kw;`,
 parts:[['SET draw_kw = draw_kw * 1.10','The new value may be calculated from the old one. This raises the draw by ten per cent.'],["WHERE category = 'motion'",'Two rows match.'],['RETURNING name, draw_kw','Show the rows as they are after the change.']],
 saw:'Limbs and Locomotion, ten per cent higher, rounded to one decimal because the column is numeric(4,1).',
 test:(l,w,r)=>r.ok&&r.stmt==='update'&&r.n===2},
{what:'Open a transaction',cmd:'BEGIN;',
 parts:[['BEGIN','From here on, changes are drafts until you COMMIT or ROLLBACK.']],
 saw:'The prompt gained a star: kestrel=*#. That star means a transaction is open. The visor light on the blueprint has turned amber.',
 test:(l,w,r)=>w.sess.tx==='active'},
{what:'Make the classic mistake',cmd:'DELETE FROM subsystems;',
 parts:[['DELETE FROM subsystems','You meant to delete a few rows and forgot the WHERE clause.']],
 saw:'DELETE 9. Every subsystem is gone, and Postgres did not ask whether you were sure.',
 test:(l,w,r)=>r.ok&&r.stmt==='delete'&&w.sess.tx==='active'},
{what:'Check the damage',cmd:'SELECT count(*) FROM subsystems;',
 parts:[['count(*)','How many rows are left, as your connection sees it.']],
 saw:'Zero. But the table card marks the table as uncommitted: so far, this is only a draft.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&w.sess.tx==='active'},
{what:'Undo it',cmd:'ROLLBACK;',
 parts:[['ROLLBACK','Throw away everything since BEGIN.']],
 saw:'The star has left the prompt, the visor light is off, and the transaction is over.',
 test:(l,w,r)=>r.ok&&r.tag==='ROLLBACK'&&!w.sess.tx},
{what:'Count again',cmd:'SELECT count(*) FROM subsystems;',
 parts:[['count(*)','The same question as before.']],
 saw:'Nine. The delete never happened. No other connection ever saw the empty table.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&!w.sess.tx},
{what:'Do it properly: open a transaction',cmd:'BEGIN;',
 parts:[['BEGIN','A fresh transaction for the delete you actually wanted.']],
 saw:'The star and the amber visor are back.',
 test:(l,w,r)=>w.sess.tx==='active'},
{what:'Delete only what you mean',cmd:'DELETE FROM subsystems WHERE online = false;',
 parts:[['WHERE online = false','Only the subsystems that are offline, to strike them from tonight\'s check list.']],
 saw:'DELETE 2. That is the number you expected, so it is safe to keep.',
 test:(l,w,r)=>r.ok&&r.stmt==='delete'&&r.n<9&&w.sess.tx==='active'},
{what:'Make it permanent',cmd:'COMMIT;',
 parts:[['COMMIT','Keep everything since BEGIN. From this moment every connection sees it, and it survives a crash.']],
 saw:'Seven subsystems remain. After COMMIT there is no undo. Only a backup can bring the rows back.',
 test:(l,w,r)=>r.ok&&r.tag==='COMMIT'&&!w.sess.tx}],
notes:`
<h2>Habits worth forming</h2>
<ul>
<li>Before an UPDATE or DELETE, run a <code>SELECT</code> with the same WHERE clause and look at what it matches.</li>
<li>For anything you type by hand against real data, start with <code>BEGIN</code>. Check the row count, then decide between COMMIT and ROLLBACK.</li>
<li>Keep transactions short. While one is open it can hold locks that make other connections wait.</li>
</ul>
<h2>When something fails inside a transaction</h2>
<p>If any statement in a transaction raises an error, Postgres marks the whole transaction as failed. The prompt shows <code>kestrel=!#</code>, the visor light turns red, and every further statement is refused with <em>current transaction is aborted</em> until you type <code>ROLLBACK</code>. This is deliberate: a group of changes that was meant to happen together must not happen by halves. Try it in the sandbox: BEGIN, then a SELECT from a table that does not exist, then anything else.</p>
<h2>Why the Kestrel needs this</h2>
<p>The requirements say a write that touches more than one row or table must happen inside one transaction [[DAT-10]]. Enlisting a pilot and recording their first sortie is two inserts. If the server lost power between them outside a transaction, the roster and the mission log would disagree. Inside one transaction that cannot happen: after a restart Postgres has either both rows or neither. People call this property "atomic", and it is the A in ACID.</p>`,
quiz:[
{q:'Inside a transaction you run DELETE FROM sorties; and see DELETE 5000. You wanted to delete 5. What now?',opts:['Nothing can be done','Type ROLLBACK;','Type COMMIT; quickly','Restart the server'],a:1,why:'Until COMMIT the delete is only a draft in your connection. ROLLBACK discards it and the 5000 rows were never gone for anyone else.'},
{q:'You run an UPDATE without typing BEGIN first. When does it become permanent?',opts:['When you quit psql','After five minutes','Immediately, as soon as the statement succeeds','Never, until you type COMMIT'],a:2,why:'Without BEGIN, each statement is its own transaction and commits at once. That is why BEGIN is the habit for risky work.'}],
reading:[
['Transactions','https://www.postgresql.org/docs/current/tutorial-transactions.html','The tutorial chapter, built around a bank-transfer example.'],
['Updating data','https://www.postgresql.org/docs/current/dml-update.html','UPDATE in detail.'],
['Returning data from modified rows','https://www.postgresql.org/docs/current/dml-returning.html','RETURNING with INSERT, UPDATE and DELETE.'],
['Introduction to concurrency control','https://www.postgresql.org/docs/current/mvcc-intro.html','Why readers and writers do not block each other. For when you are curious.']]
},
{id:5,title:'Rules the database enforces',mins:9,setup:'pilots',focus:'sorties',
idea:`
<p>The Kestrel's requirements insist that a rule that matters is checked in more than one place, so that one mistake cannot break it: once in the cockpit, once in the API, and once more in the database [[DAT-02]]. This lesson is about that last check.</p>
<p>Application code has bugs, and more than one program usually writes to the same database. A <strong>constraint</strong> is a rule stored with the table itself. It holds no matter which program, script or person does the writing.</p>
<dl class="terms">
<dt>NOT NULL</dt><dd>The column must have a value.</dd>
<dt>UNIQUE</dt><dd>No two rows may share the value.</dd>
<dt>PRIMARY KEY</dt><dd>NOT NULL and UNIQUE together, marking the column that identifies the row. One per table.</dd>
<dt>FOREIGN KEY</dt><dd>The value must exist in another table. Written with <code>REFERENCES</code>.</dd>
<dt>CHECK</dt><dd>Any condition of your own, such as "delivered_ng is 0 or 40".</dd>
</dl>
<p>The foreign key is what puts the "relational" in relational database. Instead of copying a pilot's callsign and email into every sortie, a sortie stores only the pilot's id, and the database guarantees that the id points at a real pilot.</p>`,
widget:'ddl2',widgetTitle:'A table that points at another table',
widgetIntro:'The mission log needs its rack: the sorties table from the requirements. Tap each line to see which rule it sets up.',
labIntro:'The pilots table is back with five pilots. Ada is pilot 5. Create sorties, then try to break each rule in turn. Four of these steps are supposed to end in an error.',
tasks:[
{what:'Create the sorties table',cmd:T_SORTIES,
 parts:[['CREATE TABLE sorties ( ... );','The statement above, on one line.']],
 saw:'The memory bay now holds two racks. On the sorties card, the fk mark on pilot_id shows that it points at pilots.',
 test:(l,w,r)=>!!w.dbs.kestrel.tables.sorties},
{what:'Record a valid sortie',cmd:INS_SORTIE,
 parts:[['(pilot_id, mission, code, ...)','The columns supplied. id and launched_at fill themselves in.'],["VALUES (5, 'Aster retrieval', 'M-058', 'Complete', 40, ...)",'Pilot 5 is Ada. She delivered the full 40 ng.'],["'[]'",'An empty JSON list, standing in for the order log.'],["'ada-run-058'",'The idempotency key the cockpit sent with this report.']],
 saw:'Accepted. Pilot 5 exists, the result is one of the two allowed words, and 40 is an allowed amount.',
 test:(l,w,r)=>r.ok&&r.stmt==='insert'&&r.n===1},
{what:'A sortie for a pilot who does not exist',cmd:`INSERT INTO sorties (pilot_id, mission, code, result, delivered_ng, order_log) VALUES (99, 'Aster retrieval', 'M-059', 'Complete', 40, '[]');`,
 parts:[['VALUES (99, ...)','There is no pilot with id 99.']],
 saw:'Refused by the foreign key. Without it this row would be stored, and the mission log would hold a mission that nobody flew.',
 test:(l,w,r)=>r.code==='23503'&&/insert or update/.test(r.out)},
{what:'An impossible amount of antimatter',cmd:`INSERT INTO sorties (pilot_id, mission, code, result, delivered_ng, order_log) VALUES (5, 'Aster retrieval', 'M-059', 'Incomplete', 25, '[]');`,
 parts:[['25','Pilot 5 exists, but 25 ng is not an amount the flight rules allow.']],
 saw:'Refused by the CHECK. The message names the rule, sorties_delivered_ng_check, and shows the row that failed.',
 test:(l,w,r)=>r.code==='23514'},
{what:'The same mission report, sent twice',cmd:`INSERT INTO sorties (pilot_id, mission, code, result, delivered_ng, order_log, idempotency_key) VALUES (5, 'Aster retrieval', 'M-059', 'Complete', 40, '[]', 'ada-run-058');`,
 parts:[["'M-059'",'A new mission number, as if the server had not noticed the repeat.'],["'ada-run-058'",'The same idempotency key as the sortie in step 2: the cockpit lost its signal and sent the report again.']],
 saw:'Refused by the unique rule on idempotency_key. Even if the API\'s own check were skipped, the mission cannot be recorded twice.',
 test:(l,w,r)=>r.code==='23505'},
{what:'Delete a pilot who has sorties',cmd:'DELETE FROM pilots WHERE id = 5;',
 parts:[['DELETE FROM pilots WHERE id = 5','Remove Ada, who flew the sortie in step 2.']],
 saw:'Refused from the other direction. The foreign key protects both ends: no sortie without a pilot, and no deleting a pilot out from under a sortie.',
 test:(l,w,r)=>r.code==='23503'&&/update or delete/.test(r.out)},
{what:'See the rules listed',cmd:'\\d sorties',
 parts:[['\\d sorties','Describe the table, constraints included.']],
 saw:'Each rule has a generated name such as sorties_pilot_id_fkey. Those names appear in error messages, so the API can tell exactly which rule was broken.',
 test:(l,w,r)=>r.ok&&r.meta.cmd==='d'&&r.meta.arg==='sorties'},
{what:'Check what was stored',cmd:'SELECT code, pilot_id, result, delivered_ng FROM sorties;',
 parts:[['SELECT ... FROM sorties','The sorties that made it in.']],
 saw:'Only the one valid sortie. Four bad writes were attempted and none of them left a trace in the flight recorder.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/from\s+sorties/i.test(l)}],
notes:`
<h2>Where each of these rules is also checked</h2>
<div class="tscroll"><table class="types">
<thead><tr><th>Rule</th><th>In the API</th><th>In the database</th></tr></thead>
<tbody>
<tr><td>A mission belongs to its pilot [[API-03]]</td><td>The pilot is taken from the sign-in token</td><td>Foreign key on <code>pilot_id</code></td></tr>
<tr><td>Antimatter is 0 or 40 ng [[FLT-41]]</td><td>The server works out the result itself</td><td>CHECK on <code>delivered_ng</code></td></tr>
<tr><td>A mission is recorded once [[API-04]]</td><td>The server looks the key up first</td><td>UNIQUE on <code>idempotency_key</code></td></tr>
<tr><td>Callsigns are unique</td><td>Answers 409 "Callsign already taken"</td><td>UNIQUE on <code>callsign</code></td></tr>
</tbody></table></div>
<h2>What should happen on delete?</h2>
<p>By default a foreign key refuses to delete a row that others point at, as you saw. You can choose differently when you declare it:</p>
<dl class="terms">
<dt><code>REFERENCES pilots(id) ON DELETE CASCADE</code></dt><dd>Deleting the pilot deletes their sorties too. Right for things that cannot exist alone. Wrong for a mission log, which is a record.</dd>
<dt><code>REFERENCES pilots(id) ON DELETE SET NULL</code></dt><dd>Deleting the pilot keeps the sorties and empties their pilot_id. The column must allow NULL.</dd>
</dl>
<h2>Good to know</h2>
<ul>
<li>Rules can be added to an existing table: <code>ALTER TABLE sorties ADD CONSTRAINT sorties_code_format CHECK (code LIKE 'M-%');</code>. Postgres first checks every existing row and refuses if any of them breaks the rule.</li>
<li>Real psql displays a CHECK with IN in its own spelling, <code>= ANY (ARRAY[...])</code>. It means the same thing. This sandbox shows it as you typed it.</li>
<li>Validate in both places. The API checks input so it can answer with a clear message. The database checks so the data stays right even when the API is wrong.</li>
</ul>`,
quiz:[
{q:'What does the foreign key on sorties.pilot_id guarantee?',opts:['Every pilot has at least one sortie','Every sortie points at a pilot that really exists','Pilot ids are handed out in order','Sorties are deleted after a year'],a:1,why:'The stored value must exist in the referenced table, and it stays that way: the referenced row cannot be deleted while something points at it.'},
{q:'The API already checks that delivered_ng is 0 or 40. Why does the table have a CHECK as well?',opts:['It makes inserts faster','So the rule still holds if the API has a bug or another program writes to the table','CHECK is required on integer columns','It replaces the API check'],a:1,why:'A constraint lives with the data, so it applies to every writer. The two checks back each other up.'}],
reading:[
['Constraints','https://www.postgresql.org/docs/current/ddl-constraints.html','The official chapter covering every kind, with the ON DELETE options.'],
['Foreign keys','https://www.postgresql.org/docs/current/tutorial-fk.html','A two-minute tutorial page on the idea.'],
['Default values','https://www.postgresql.org/docs/current/ddl-default.html','How defaults are declared and when they apply.']]
},

{id:6,title:'Combine tables with JOIN',mins:9,setup:'sorties',focus:'sorties',
idea:`
<p>Good table design stores each fact once: a pilot's callsign lives in <code>pilots</code>, and a sortie only carries the pilot's id. That keeps data consistent, but the console's mission log has to show who flew each mission, and that now needs two tables.</p>
<p>A <strong>JOIN</strong> puts them side by side for the length of one query. You say which tables, and which columns have to match.</p>
<dl class="terms">
<dt>JOIN ... ON</dt><dd>Pair up rows from two tables wherever the ON condition is true. Almost always that is "foreign key equals primary key".</dd>
<dt>INNER JOIN</dt><dd>The default. Keep only rows that found a partner.</dd>
<dt>LEFT JOIN</dt><dd>Keep every row of the first table, even those with no partner. The missing side is filled with NULL.</dd>
<dt>Alias</dt><dd>A short stand-in name for a table within one query: <code>FROM sorties s</code> lets you write <code>s.code</code>.</dd>
</dl>`,
widget:'joins',widgetTitle:'See what each JOIN keeps',
widgetIntro:'Two small tables: three pilots, four sorties. Kite has no sorties, and sortie 9 was an unpiloted drone test, so it has no pilot. (The real sorties table would refuse that row. This toy one allows it, to show what the joins do.) Switch between the join types and watch which rows survive.',
labIntro:'The recorder now holds five pilots and eight sorties. Kite has not flown yet, which makes Kite useful for testing.',
tasks:[
{what:'Look at the sorties alone',cmd:'SELECT id, pilot_id, code, result FROM sorties;',
 parts:[['SELECT ... FROM sorties','Eight sorties. The pilot appears only as a number.']],
 saw:'pilot_id 1, 2, 3, 5. Correct, and not very readable. The callsigns are in the other table.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&r.n===8&&!/join/i.test(l)},
{what:'Join in the callsigns',cmd:'SELECT sorties.code, pilots.callsign, sorties.result FROM sorties JOIN pilots ON pilots.id = sorties.pilot_id;',
 parts:[['FROM sorties JOIN pilots','Take sorties, and attach rows from pilots.'],['ON pilots.id = sorties.pilot_id','The rule for pairing: the sortie\'s pilot_id equals the pilot\'s id.'],['sorties.code, pilots.callsign','Both tables have a column called id, so each column is written as table.column.']],
 saw:'Eight rows again, now with callsigns. Each sortie found exactly one pilot. This is the console\'s mission log.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/join/i.test(l)&&r.n===8},
{what:'Shorten it with aliases, and filter',cmd:`SELECT s.code, p.callsign, s.delivered_ng FROM sorties s JOIN pilots p ON p.id = s.pilot_id WHERE s.result = 'Complete';`,
 parts:[['FROM sorties s JOIN pilots p','s and p are aliases: short names that last for this query.'],["WHERE s.result = 'Complete'",'WHERE works on the joined rows exactly as it does on one table.']],
 saw:'The six completed missions. Aliases are how joins are written in practice.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/join/i.test(l)&&/where/i.test(l)},
{what:'Start from pilots instead',cmd:'SELECT p.callsign, s.code FROM pilots p LEFT JOIN sorties s ON s.pilot_id = p.id;',
 parts:[['FROM pilots p LEFT JOIN sorties s','Keep every pilot, whether or not they have flown.']],
 saw:'Nine rows. Pilots with several sorties appear several times, and Kite appears once with an empty code. A plain JOIN would have dropped Kite.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/left\s+(outer\s+)?join/i.test(l)&&!/where/i.test(l)},
{what:'Find pilots who have not flown',cmd:'SELECT p.callsign FROM pilots p LEFT JOIN sorties s ON s.pilot_id = p.id WHERE s.id IS NULL;',
 parts:[['LEFT JOIN sorties s','Keep every pilot.'],['WHERE s.id IS NULL','Then keep only the rows where no sortie was found.']],
 saw:'Kite. LEFT JOIN followed by IS NULL is the standard way to ask "which of these have none of those?".',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/left\s+(outer\s+)?join/i.test(l)&&/is\s+null/i.test(l)},
{what:'Total delivered per pilot',cmd:'SELECT p.callsign, count(s.id) AS flown, coalesce(sum(s.delivered_ng), 0) AS delivered FROM pilots p LEFT JOIN sorties s ON s.pilot_id = p.id GROUP BY p.callsign ORDER BY delivered DESC;',
 parts:[['count(s.id)','Counts sorties. Unlike count(*), it skips the NULL in Kite\'s row, so Kite gets 0 and not 1.'],['coalesce(sum(s.delivered_ng), 0)','sum of nothing is NULL. coalesce returns its first argument that is not NULL, so here it turns NULL into 0.'],['GROUP BY p.callsign','One result row per pilot.']],
 saw:'Joins and GROUP BY work together: join first, then summarise. This one query is a complete squadron report.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/join/i.test(l)&&/group by/i.test(l)&&!/having/i.test(l)},
{what:'Keep only the pilots who delivered twice',cmd:'SELECT p.callsign, sum(s.delivered_ng) AS delivered FROM pilots p JOIN sorties s ON s.pilot_id = p.id GROUP BY p.callsign HAVING sum(s.delivered_ng) > 40;',
 parts:[['HAVING sum(s.delivered_ng) > 40','A filter on the groups. WHERE could not do this, because the sum does not exist until after grouping.']],
 saw:'Wren, Ibis and Ada, with 80 ng each. Every clause from lesson 3 still applies once tables are joined.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/having/i.test(l)}],
notes:`
<h2>Good to know</h2>
<ul>
<li>If two joined tables share a column name and you leave off the table, Postgres stops with <em>column reference "id" is ambiguous</em>. Writing <code>s.id</code> and <code>p.id</code> everywhere in a join avoids it.</li>
<li>A join can make more rows than either table has. One pilot with three sorties becomes three rows. Keep that in mind before you <code>count(*)</code> or <code>sum()</code> across a join.</li>
<li>You can chain joins: <code>FROM sorties s JOIN pilots p ON ... JOIN other_table o ON ...</code>. Each JOIN adds one more table to the rows built so far.</li>
<li>RIGHT JOIN and FULL JOIN exist, and the widget above shows them. They are rare in practice: most people reorder the tables and use LEFT JOIN.</li>
<li>Screens and the API say "missions". The table is named <code>sorties</code>. That is a ruling in the requirements, and it is why this guide uses both words.</li>
</ul>`,
quiz:[
{q:'You want a list of all pilots with their sortie count, including pilots who have never flown. Which join, starting FROM pilots?',opts:['JOIN sorties','LEFT JOIN sorties','CROSS JOIN sorties','No join is needed'],a:1,why:'LEFT JOIN keeps every row of the left table. A plain JOIN drops pilots with no matching sortie.'},
{q:'In that query, why count(s.id) and not count(*)?',opts:['count(*) is slower','count(*) is not allowed with joins','count(*) counts rows, so a pilot with no sorties would show 1. count(s.id) skips NULL and shows 0','They always give the same result'],a:2,why:'The LEFT JOIN still produces one row for a pilot with no sorties, with NULL in the sortie columns. count(column) ignores NULLs.'}],
reading:[
['Joins between tables','https://www.postgresql.org/docs/current/tutorial-join.html','The tutorial chapter, with inner and outer joins on a small example.'],
['Table expressions','https://www.postgresql.org/docs/current/queries-table-expressions.html','The reference for FROM, JOIN, WHERE, GROUP BY and HAVING.'],
['PostgreSQL Exercises: joins','https://pgexercises.com/questions/joins/','Practice questions that get harder gradually.']]
},

{id:7,title:'Make it fast: indexes and EXPLAIN',mins:9,setup:'big',focus:'sorties',
idea:`
<p>When Ada opens her mission log, the API asks for <em>her</em> sorties: <code>WHERE pilot_id = 5</code>. To find them, Postgres by default reads the whole table from start to finish. That is called a <strong>sequential scan</strong>. On eight sorties nobody notices. On the whole squadron's history, every page load becomes slow.</p>
<p>An <strong>index</strong> is a second, sorted structure kept next to the table, like the index at the back of a book. Instead of reading every page to find a word, you look it up and go straight to the right page. On the blueprint, indexes you add are the wing binders (callout I).</p>
<dl class="terms">
<dt>Sequential scan</dt><dd>Read every row and test it. The cost grows with the size of the table.</dd>
<dt>Index scan</dt><dd>Look the value up in the index and fetch only the matching rows. The cost barely grows at all.</dd>
<dt>B-tree</dt><dd>The standard kind of index. It handles <code>=</code>, <code>&lt;</code>, <code>&gt;</code>, BETWEEN and sorting.</dd>
<dt>EXPLAIN</dt><dd>Put it in front of a query and Postgres shows its plan instead of running it.</dd>
<dt>EXPLAIN ANALYZE</dt><dd>Runs the query as well, and reports what actually happened and how long it took.</dd>
</dl>
<p>Indexes are not free. Each one takes disk space, and every INSERT, UPDATE and DELETE has to keep it up to date. So you add them where a real query needs one, and you measure. The requirements name one that is always needed: foreign-key columns must be indexed [[DAT-07]].</p>`,
widget:'scan',widgetTitle:'When does an index help?',
widgetIntro:'Compare the work each approach has to do, and see which one Postgres would choose. Follow the three suggestions in order.',
labIntro:'This sandbox holds the fleet archive: 500 pilots and 50,000 sorties. The cards show only the first few rows. Find Ada\'s sorties, measure it, add the index the requirements ask for, and measure again.',
tasks:[
{what:'See how big the table is',cmd:'SELECT count(*) FROM sorties;',
 parts:[['count(*)','Count every row.']],
 saw:'50,000 sorties. Small by database standards, and large enough to show the difference.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&/count/i.test(l)},
{what:'Measure one pilot\'s mission log, with no index',cmd:Q_LOOKUP,
 parts:[['EXPLAIN ANALYZE','Run the query, but show the plan and timings in place of the rows.'],['WHERE pilot_id = 5','Ada\'s sorties, out of 50,000. This is the query behind GET /missions.']],
 saw:'Seq Scan: Postgres read all 50,000 rows and threw nearly all of them away (Rows Removed by Filter) to return about a hundred. Note the execution time.',
 test:(l,w,r)=>r.ok&&r.stmt==='explain'&&r.planKind==='seq'&&/pilot_id/i.test(l)},
{what:'Create an index on the foreign key',cmd:'CREATE INDEX sorties_pilot_id_idx ON sorties (pilot_id);',
 parts:[['CREATE INDEX sorties_pilot_id_idx','The name is yours to choose. table_column_idx is the usual pattern.'],['ON sorties (pilot_id)','The table, and the column to keep sorted.']],
 saw:'Postgres read the table once and built the index. The wing binders on the blueprint are lit, and the sorties card lists the index.',
 test:(l,w,r)=>w.dbs.kestrel.tables.sorties.indexes.some(i=>i.cols[0]==='pilot_id')},
{what:'Measure the same query again',cmd:Q_LOOKUP,
 parts:[['EXPLAIN ANALYZE ...','Exactly the query from step 2. You change nothing in the SQL: Postgres notices the index by itself.']],
 saw:'Index Scan using sorties_pilot_id_idx. It went straight to Ada\'s rows, in a fraction of the time. The gap grows as the table grows.',
 test:(l,w,r)=>r.ok&&r.stmt==='explain'&&r.planKind==='index'&&/pilot_id/i.test(l)},
{what:'Look a mission up by its number',cmd:`EXPLAIN SELECT * FROM sorties WHERE code = 'M-31337';`,
 parts:[['EXPLAIN','Without ANALYZE: show the plan only, do not run the query.'],["WHERE code = 'M-31337'",'A lookup on the code column, which is UNIQUE.']],
 saw:'Index Scan using sorties_code_key. You never created that index: a primary key or UNIQUE rule always comes with one, which is how Postgres checks uniqueness quickly.',
 test:(l,w,r)=>r.ok&&r.stmt==='explain'&&r.planKind==='index'&&/\bcode\s*=/.test(l)},
{what:'Try a query an index cannot help',cmd:'EXPLAIN SELECT * FROM sorties WHERE delivered_ng = 40;',
 parts:[['WHERE delivered_ng = 40','A condition that matches most of the table: every completed mission.']],
 saw:'Seq Scan again. There is no index on delivered_ng, and even with one, four rows in five match. Reading the table straight through is the cheaper plan, and Postgres knows it.',
 test:(l,w,r)=>r.ok&&r.stmt==='explain'&&r.planKind==='seq'&&/delivered_ng/i.test(l)},
{what:'List the indexes on the table',cmd:'\\d sorties',
 parts:[['\\d sorties','The Indexes section lists every index on the table.']],
 saw:'Four indexes: three automatic ones for the primary key and the two UNIQUE columns, and yours. A foreign key does not come with an index, which is why the requirements spell it out.',
 test:(l,w,r)=>r.ok&&r.meta.cmd==='d'&&r.meta.arg==='sorties'}],
notes:`
<h2>Reading a plan line</h2>
<pre class="file">Seq Scan on sorties  (cost=0.00..1162.00 rows=99 width=58) (actual time=0.011..4.920 rows=100 loops=1)</pre>
<dl class="terms">
<dt>Seq Scan on sorties</dt><dd>What Postgres does at this step. Plans with several steps are indented, and you read them from the innermost step outwards.</dd>
<dt>cost=0.00..1162.00</dt><dd>The planner's estimate in its own made-up units, not milliseconds. The first number is the cost before the first row can be returned, the second is the total. It is only useful for comparing plans.</dd>
<dt>rows=99 width=58</dt><dd>How many rows the planner expects, and their average size in bytes.</dd>
<dt>actual time=0.011..4.920 rows=100</dt><dd>With ANALYZE only: real milliseconds and the real row count. A large gap between expected and actual rows is the usual sign of a badly chosen plan.</dd>
</dl>
<p class="hint">The costs and timings in this sandbox are plausible figures, not measurements. The choice between Seq Scan and Index Scan follows the same reasoning real Postgres uses.</p>
<h2>What to index</h2>
<ul>
<li>Foreign-key columns such as <code>sorties.pilot_id</code>. Joins and "all sorties for this pilot" depend on them, and Postgres does not create these indexes automatically [[DAT-07]].</li>
<li>Columns that appear in WHERE or JOIN conditions of queries you run often, on tables that are large.</li>
<li>Not every column. A table with ten indexes pays for all ten on every write.</li>
</ul>
<h2>Good to know</h2>
<ul>
<li>Real Postgres often shows a <em>Bitmap Heap Scan</em> when an index matches more than a few rows, as it would for a hundred sorties. It is a middle way: collect the matches from the index first, then read the table in one pass. This sandbox shows only the two basic kinds.</li>
<li>EXPLAIN ANALYZE really runs the statement. That is harmless for SELECT, but an <code>EXPLAIN ANALYZE DELETE ...</code> really deletes. Wrap it in BEGIN and ROLLBACK.</li>
<li>On a busy production table use <code>CREATE INDEX CONCURRENTLY</code>, which builds the index without blocking writes.</li>
<li>In the real project this index is declared on the model and created by a migration, not typed by hand [[DAT-04]].</li>
</ul>`,
quiz:[
{q:'After you add an index on pilot_id, a query with WHERE delivered_ng = 40 still shows Seq Scan. Why?',opts:['Indexes only work on text columns','The index is on a different column, and the condition matches a large share of the table','EXPLAIN turns indexes off','The index has to warm up first'],a:1,why:'An index helps only conditions on its own columns, and only when few enough rows match that jumping around beats reading straight through.'},
{q:'What is the cost of adding an index?',opts:['Queries on other columns get slower','Nothing, indexes are free','It takes disk space, and every write to the table must also update it','The table can no longer be changed'],a:2,why:'Reads on the indexed column get faster and writes get a little slower. That trade is why you add indexes for real queries, not just in case.'}],
reading:[
['Indexes: introduction','https://www.postgresql.org/docs/current/indexes-intro.html','The start of the official chapter. Short and clear.'],
['Using EXPLAIN','https://www.postgresql.org/docs/current/using-explain.html','How to read plans, from simple scans to joins.'],
['Use The Index, Luke','https://use-the-index-luke.com/','A free online book on indexing for developers.'],
['explain.depesz.com','https://explain.depesz.com/','Paste a plan and get it colour-coded, with the slow steps highlighted.']]
},

{id:8,title:'Who may see what: roles and row-level security',mins:10,setup:'access',focus:'sorties',
idea:`
<p>So far you have been <code>postgres</code>, the superuser, who can read, change and delete anything. That is the master key to the suit. The requirements forbid the API from using it: it must connect as a role that is neither the owner nor a superuser [[DAT-08]]. If the API has a bug, or an attacker finds a way in, the damage should be limited to what that one account is allowed to do.</p>
<dl class="terms">
<dt>A key (a role)</dt><dd>An account on the server. A role with LOGIN can connect, and that is what people call a user. On the blueprint it is the key slot, callout K.</dd>
<dt>Privilege</dt><dd>Permission to do one kind of thing to one table: SELECT, INSERT, UPDATE or DELETE.</dd>
<dt>GRANT / REVOKE</dt><dd>Give a privilege to a role, or take it away.</dd>
<dt>The shield (row-level security, RLS)</dt><dd>A filter that the database applies to every query on a table, so that a connection sees and changes only the rows it is entitled to. Callout S.</dd>
<dt>Policy</dt><dd>The condition a row must pass. For example: "the row's pilot_id equals the pilot who is signed in".</dd>
</dl>
<p>Privileges work per table: a role can read all of <code>sorties</code> or none of it. But a pilot must see and record only their own missions [[IAM-02]], and every pilot's missions are in the same table. Row-level security is how the database itself keeps pilots apart, even if a query in the API forgets its WHERE clause.</p>
<p class="hint">Version 1 of the simulator enforces that rule in the API, where the pilot comes from the sign-in token [[API-03]]. The requirements do not ask for row-level security. It is taught here because it is the database's version of the same rule, and the second lock that the "checked in more than one place" principle points towards.</p>`,
widget:'rls',widgetTitle:'Try the policy before you build it',
widgetIntro:'The sorties table holds six rows flown by two pilots: Wren is pilot 1 and Ada is pilot 5. Change who is asking and see which rows come back. Work through the four suggestions in order.',
labIntro:'Build exactly that, step by step. You will switch between two keys: postgres to set things up, and kestrel_api to see what the API would see. Two steps are supposed to end in an error.',
tasks:[
{what:'Cut a key for the API (create a role)',cmd:`CREATE ROLE kestrel_api LOGIN PASSWORD 'change-me';`,
 parts:[['CREATE ROLE kestrel_api','A new role. CREATE USER is the same command with LOGIN switched on.'],['LOGIN','This role may connect to the server.'],["PASSWORD 'change-me'",'Its password. In real life, a long random one kept as a secret.']],
 saw:'The Roles list under the blueprint shows kestrel_api. Roles belong to the whole server, not to one database.',
 test:(l,w,r)=>!!w.roles.kestrel_api},
{what:'Connect as the API would',cmd:'\\c kestrel kestrel_api',
 parts:[['\\c kestrel kestrel_api','Reconnect to kestrel, this time as the role kestrel_api.']],
 saw:'The prompt now ends in > where it used to end in #. That means you are not a superuser. Callout K shows a limited key.',
 test:(l,w,r)=>w.sess.psql&&w.sess.user==='kestrel_api'},
{what:'Try to read the mission log',cmd:'SELECT * FROM sorties;',
 parts:[['SELECT * FROM sorties','A harmless read.']],
 saw:'Permission denied. A new role can connect and nothing more. The table cards show both tables as locked from where you now stand.',
 test:(l,w,r)=>r.code==='42501'&&w.sess.user==='kestrel_api'},
{what:'Go back to the administrator',cmd:'\\c kestrel postgres',
 parts:[['\\c kestrel postgres','Reconnect as postgres to hand out permissions.']],
 saw:'Back to the # prompt and the master key.',
 test:(l,w,r)=>w.sess.psql&&w.sess.user==='postgres'},
{what:'Grant only what the API needs',cmd:'GRANT SELECT, INSERT ON sorties TO kestrel_api;',
 parts:[['GRANT SELECT, INSERT','The privileges to give: read rows and add rows.'],['ON sorties TO kestrel_api','On which table, and to which role.']],
 saw:'kestrel_api may now read and add sorties and nothing else: no UPDATE, no DELETE, no dropping the table. A mission log is only ever added to. The Roles list shows the grant.',
 test:(l,w,r)=>((w.dbs.kestrel.tables.sorties.grants.kestrel_api)||[]).includes('SELECT')},
{what:'Raise the shield (switch on row-level security)',cmd:'ALTER TABLE sorties ENABLE ROW LEVEL SECURITY;',
 parts:[['ALTER TABLE sorties','Change a setting of the table.'],['ENABLE ROW LEVEL SECURITY','From now on, rows are filtered by policies.']],
 saw:'RLS is on and there is no policy yet. For everyone except superusers and the table\'s owner that means no rows at all, which is the safe starting point.',
 test:(l,w,r)=>w.dbs.kestrel.tables.sorties.rls},
{what:'Write the policy',cmd:`CREATE POLICY own_sorties ON sorties USING (pilot_id = current_setting('app.pilot_id')::integer);`,
 parts:[['CREATE POLICY own_sorties ON sorties','Add a named row filter to the table.'],['USING ( ... )','The condition. A row is visible only when this is true for it. With no separate WITH CHECK clause, the same condition applies to rows being written.'],["current_setting('app.pilot_id')",'Read a setting from the current connection. The API sets it to say which pilot the request is for. The name is your choice, as long as it contains a dot.'],['::integer','Settings are always text. This converts the value to a number so it can be compared with pilot_id.']],
 saw:'CREATE POLICY. You, as postgres, still see all six rows, because superusers bypass row-level security. Callout S says so.',
 test:(l,w,r)=>w.dbs.kestrel.tables.sorties.policies.length>0},
{what:'Become the API again',cmd:'\\c kestrel kestrel_api',
 parts:[['\\c kestrel kestrel_api','A fresh connection as kestrel_api.']],
 saw:'The sorties card reports a policy error: the setting the policy reads has not been set on this connection, so no rows can be shown. It fails closed.',
 test:(l,w,r)=>w.sess.psql&&w.sess.user==='kestrel_api'&&w.dbs.kestrel.tables.sorties.policies.length>0},
{what:'Say which pilot is signed in',cmd:`SET app.pilot_id = '5';`,
 parts:[['SET app.pilot_id','Set a value on this connection only. The API does this at the start of each request, once it has read the pilot from the sign-in token.'],["= '5'",'Pilot 5, Ada.']],
 saw:'Look at the sorties card: three rows visible and three hidden by the policy. The shield is up.',
 test:(l,w,r)=>w.sess.user==='kestrel_api'&&w.sess.settings['app.pilot_id']==='5'},
{what:'Read the mission log',cmd:'SELECT code, pilot_id, result FROM sorties;',
 parts:[['SELECT ... FROM sorties','The query that was refused in step 3. It has no WHERE clause.']],
 saw:'Only Ada\'s three missions. The database added the filter, so a forgotten WHERE in the API cannot leak another pilot\'s rows.',
 test:(l,w,r)=>r.ok&&r.stmt==='select'&&r.n===3&&w.sess.user==='kestrel_api'},
{what:'Switch pilot',cmd:`SET app.pilot_id = '1';`,
 parts:[["SET app.pilot_id = '1'",'As if the next request came from Wren.']],
 saw:'The sorties card now shows the other three rows. Same table, same key, different view.',
 test:(l,w,r)=>w.sess.user==='kestrel_api'&&w.sess.settings['app.pilot_id']==='1'},
{what:'Try to record a mission for another pilot',cmd:`INSERT INTO sorties (pilot_id, mission, code, result, delivered_ng, order_log) VALUES (5, 'Aster retrieval', 'M-099', 'Complete', 40, '[]');`,
 parts:[['VALUES (5, ...)','The signed-in pilot is Wren, pilot 1, trying to add a mission to Ada\'s log.']],
 saw:'Refused: the new row violates the policy. Row-level security guards writes as well as reads.',
 test:(l,w,r)=>r.code==='42501'&&/row-level/.test(r.out)}],
notes:`
<h2>Things that catch people out</h2>
<ul>
<li><strong>Superusers and the table's owner bypass RLS.</strong> If the API connects as the role that created the tables, the policies do nothing. That is one more reason for the separate key [[DAT-08]]. <code>ALTER TABLE sorties FORCE ROW LEVEL SECURITY;</code> makes the owner filtered too.</li>
<li><strong>RLS with no policy shows nothing.</strong> Enabling it before writing a policy does not expose data. It hides everything.</li>
<li><strong>An unset setting is an error.</strong> If the API forgets to set <code>app.pilot_id</code>, queries fail with <em>unrecognized configuration parameter</em>. That is better than quietly returning every pilot's rows.</li>
<li><strong>Connections are reused.</strong> The API keeps a pool of open connections and hands them from request to request. A plain SET would stay on the connection for the next request, which belongs to a different pilot. Use <code>SET LOCAL app.pilot_id = '5';</code> inside a transaction, or <code>SELECT set_config('app.pilot_id', '5', true);</code>. Both reset themselves when the transaction ends.</li>
<li><strong>One policy is not the whole story.</strong> A hangar tech must be able to see every mission [[IAM-02]]. That needs a second policy, or a second role for techs. Policies on the same table are combined with OR.</li>
</ul>
<h2>Good to know</h2>
<ul>
<li><code>\\du</code> lists roles and <code>\\dp</code> lists who has which privileges on each table.</li>
<li>A role without LOGIN works as a group. Grant privileges to the group once, then <code>GRANT group_name TO some_user;</code>.</li>
<li>In this lab pilots stayed locked for kestrel_api, because nothing was granted on it. The real API reads the roster too, so it would also need <code>GRANT SELECT ON pilots</code>.</li>
<li>Row-level security exists only in the real database, so test it against a real Postgres. A stand-in such as SQLite or a mock cannot check it.</li>
</ul>`,
quiz:[
{q:'You enable RLS and create a policy. Connected as postgres, you still see every row. Why?',opts:['The policy has a typo','Policies take a few minutes to apply','Superusers, and by default the table\'s owner, bypass row-level security','RLS only affects INSERT'],a:2,why:'This is the most common RLS surprise. Always test policies as the role the application really uses.'},
{q:'A table has RLS enabled and no policies. A role with SELECT on it runs SELECT *. What comes back?',opts:['Every row','No rows','An error','Only rows the role inserted'],a:1,why:'With RLS on and no policy that lets a row through, nothing is visible. The default is to deny.'}],
reading:[
['Database roles','https://www.postgresql.org/docs/current/user-manag.html','How roles, logins and group membership work.'],
['Privileges','https://www.postgresql.org/docs/current/ddl-priv.html','GRANT, REVOKE and the full list of privileges.'],
['Row security policies','https://www.postgresql.org/docs/current/ddl-rowsecurity.html','The official chapter, with worked examples.'],
['CREATE POLICY','https://www.postgresql.org/docs/current/sql-createpolicy.html','The reference page: USING, WITH CHECK, and policies per command.']]
},

{id:9,title:'Living with a real database',mins:10,setup:'premig',focus:'pilots',
idea:`
<p>A database outlives the code around it. The cockpit is redeployed every week, while the mission log has to stay intact for years. Three routine jobs make that work.</p>
<dl class="terms">
<dt>A refit (changing the schema)</dt><dd>Requirements change, so tables change. <code>ALTER TABLE</code> adds, renames and removes columns on a table that already holds data.</dd>
<dt>Migration</dt><dd>A schema change saved as a small numbered script and kept in git with the code, so that every copy of the database (your laptop, the test server, production) goes through the same changes in the same order. Alembic manages this for the Kestrel.</dd>
<dt>Backup</dt><dd><code>pg_dump</code> writes a whole database out as a file kept in the hangar, outside the suit. Restoring that file somewhere else is how you prove the backup works [[DAT-12]]. Callout G, on the gantry.</dd>
<dt>Connection string</dt><dd>The one line of configuration that tells the API where the database is and how to sign in [[DAT-09]].</dd>
</dl>
<p class="hint">This lab starts from an older <code>pilots</code> table: the grade column is still called rank, and clearance does not exist yet. That is where SQLAlchemy + Alembic from Zero starts too. Here you make both changes by hand, to see the SQL a migration sends. Against the real database you never type ALTER yourself [[DAT-04]].</p>`,
widget:'conn',widgetTitle:'Read a connection string',
widgetIntro:'The API finds its database through an environment variable named DATABASE_URL. Tap each part of the address. The host shown is a made-up example of the kind Neon gives you.',

notes:`
<h2>On Windows</h2>
<ul>
<li><strong>Command Prompt:</strong> every command in this lab works as written, except that <code>cat</code> is spelled <code>type</code>.</li>
<li><strong>PowerShell:</strong> <code>&lt;</code> is not supported. Restore with <code>Get-Content kestrel.sql | docker exec -i db psql -U postgres kestrel_copy</code>.</li>
<li><strong>Older Windows PowerShell (version 5):</strong> <code>&gt;</code> saves the file in a text encoding that psql cannot read back. Run the backup step from Command Prompt, or use PowerShell 7.</li>
</ul>
<h2>What the requirements say about this database</h2>
<dl class="terms">
<dt>Migrations only [[DAT-04]]</dt><dd>The schema is changed by Alembic and by nothing else. A model change and its migration are committed together [[DAT-05]], and every generated migration is read before it is applied [[DAT-06]]. SQLAlchemy + Alembic from Zero is the next guide and covers all of it.</dd>
<dt>Hosted on Neon</dt><dd>The real <code>kestrel</code> database is a managed Postgres: Neon handles installation, storage and failover. Choose PostgreSQL 17 when you create the project, because new projects default to a later version.</dd>
<dt>The connection string is a secret [[DAT-09]]</dt><dd>It is supplied as <code>DATABASE_URL</code>, never written in the code or committed to git, and it must end in <code>sslmode=require</code> so the connection is encrypted.</dd>
<dt>A limited key [[DAT-08]]</dt><dd>The role in that string is the API's own, from lesson 8, not the owner and not a superuser.</dd>
<dt>Backups [[DAT-12]]</dt><dd>Take one before any release that migrates, and prove once that it restores. You have just done both.</dd>
<dt>Seed data [[DAT-11]]</dt><dd>A fresh database starts with the roster (Wren, Ibis, Heron), the pilot Ada, and missions M-041 and M-058.</dd>
</dl>
<h2>Where this leads</h2>
<ul>
<li><strong>SQLAlchemy + Alembic from Zero</strong> describes these tables as Python classes and writes the migrations. Everything here still applies: those tools send the SQL you have been typing.</li>
<li><strong>FastAPI from Zero</strong> builds the endpoints that run these queries, one transaction per request.</li>
<li>Later topics, once the basics feel easy: subqueries and WITH, views, querying inside jsonb, window functions, and how Postgres cleans up after itself (VACUUM).</li>
</ul>`,
quiz:[
{q:'Adding a NOT NULL column to a table that already has rows fails. What is the safe way?',opts:['Run it twice','Add it as optional, fill in the existing rows, then make it required','Delete the primary key first','Use a bigger data type'],a:1,why:'Existing rows need a value before the rule can hold. The three steps let you decide what that value is. (A DEFAULT on the new column is the one-step shortcut when every old row should get the same value.)'},
{q:'What is inside a plain pg_dump file?',opts:['A copy of the server\'s raw data files','A compressed disk image','SQL statements that recreate the tables and reload the data','Only the table definitions, with no data'],a:2,why:'It is a script. Feeding it to psql replays the CREATE TABLE statements and the data, which is why it also works across machines and versions.'}],

['DAT-05','A model change and its migration must be committed together. A revision already applied to a shared database must not be edited.'],
['DAT-06','Every autogenerated migration must be read before it is applied. A required column on a table with rows is added in three steps (add as optional, backfill, make required). A rename uses a rename, never drop and add.'],

function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];
    if(k==='html')n.innerHTML=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);

  kids.flat(Infinity).forEach(c=>{if(c!=null)n.append(c);});

}

        if(ok){for(let s=cur;s<k;s++)skipped.add(s);jump=k-cur;cur=k;pass=true;break;}}
      /* went back to a skipped step: tick it off */
      if(!pass)for(const s of [...skipped]){let ok=false;try{ok=l===norm(tasks[s].cmd)&&!!tasks[s].test(l,sim.world,r);}catch(e){}
        if(ok){skipped.delete(s);print('✓ Step '+(s+1)+' of '+tasks.length+' done. '+plain(tasks[s].saw),'ok');drawTasks();break;}}
      if(pass){
        const t=tasks[cur];cur++;
        print('✓ Step '+cur+' of '+tasks.length+' done'+(jump?' ('+jump+' earlier step'+(jump>1?'s':'')+' skipped). ':'. ')+plain(t.saw),'ok');
        if(cur>=tasks.length){saved.done[L.id]=true;save();renderNav(L.id);print('✓ Lesson '+L.id+' lab complete.','ok');}
        drawTasks();
        if(WIDE.matches){const n=$('.task.now',list)||banner;if(n.scrollIntoView)n.scrollIntoView({block:'nearest'});}
      }else if(!r.ok&&!r.cont){print('Hint: read the message above. This step is waiting for: '+tasks[cur].cmd,'note');}
    }
    drawMap(fx,false,refit);
    if(WIDE.matches)input.focus();
    if(ctx.hold)ctx.hold=false;else requestAnimationFrame(keepInView);
  }
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();runLine();}
    else if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);input.value=hist[hi];}
    else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);input.value=hist[hi]||'';}
  });
  if(sec&&tasks.length)sec.append(el('p',{text:L.labIntro}),list,banner);
  const bench=el('div',{class:'bench-in'},
    el('section',{class:'map','aria-label':'What Postgres holds right now'},el('div',{class:'map-head'},el('b',{text:'What Postgres holds right now'}),statusEl),map,strip),
    stepbar,
    el('section',{class:'term','aria-label':'Terminal'},el('div',{class:'term-bar'},el('span',{text:'Terminal (simulated)'}),el('span',{class:'row'},el('button',{type:'button',class:'mini dark',text:'help',onclick:()=>{if(!busy)print(sim.help,'note');}}),el('button',{type:'button',class:'mini dark',text:'reset',onclick:()=>{if(cur<tasks.length)cur=0;reset(true);}}))),term,form));
  ctx.sim=()=>sim;ctx.load=c=>loadCmd(c,true);redrawBench=()=>drawMap(lastFx,true);
  reset(false);
  return bench;
}

/* ----- quiz ----- */
function quiz(L,sec){
  L.quiz.forEach((q,i)=>{
    const key=L.id+'-'+i,fb=el('p',{class:'fb','aria-live':'polite'}),opts=el('div',{class:'opts'});
    function draw(){
      const ch=saved.quiz[key];opts.textContent='';
      q.opts.forEach((o,k)=>opts.append(el('button',{type:'button',class:'opt'+(ch===k?(k===q.a?' right':' wrong'):''),'aria-pressed':ch===k,text:o,onclick:()=>{saved.quiz[key]=k;save();draw();renderNav(L.id);}})));
      fb.className='fb'+(ch==null?'':ch===q.a?' good':' bad');
      fb.textContent=ch==null?'':ch===q.a?'Correct. '+q.why:'Not quite. Have another look at the options, or re-read the section above.';
    }
    sec.append(el('div',{class:'q'},el('p',{class:'qt',text:(i+1)+'. '+q.q}),opts,fb));draw();
  });
}

/* ----- page ----- */
function mount(art,bench,slot){
  const main=$('#main'),old=benchEl;main.textContent='';if(old)old.remove();
  main.append(art);benchEl=bench;slotEl=slot;placeBench();
}
function showLesson(id){
  const L=LESSONS.find(x=>x.id===id)||LESSONS[0];
  const art=el('article',{}),slot=el('div',{class:'slot'}),ctx={};
  art.append(el('p',{class:'eyebrow',text:'Lesson '+L.id+' of '+LESSONS.length+' · about '+L.mins+' minutes'}),el('h1',{text:L.title}),el('section',{class:'prose',html:rq(L.idea)}));
  if(L.widget){const box=el('div',{class:'widget'});art.append(el('section',{},el('h2',{text:L.widgetTitle}),el('p',{text:L.widgetIntro}),box));W[L.widget](box,ctx);}
  const s=el('section',{class:'lab'},el('h2',{text:'Try it'}));art.append(s);const bench=lab(L,s,ctx);s.append(slot);
  if(L.notes)art.append(el('section',{class:'prose notes',html:rq(L.notes)}));
  const qs=el('section',{},el('h2',{text:'Check yourself'}));art.append(qs);quiz(L,qs);
  art.append(el('section',{},el('h2',{text:'Further reading'}),el('ul',{class:'reading'},L.reading.map(r=>el('li',{},el('a',{href:r[1],target:'_blank',rel:'noopener',text:r[0]}),el('span',{text:r[2]}))))));
  const prev=LESSONS.find(x=>x.id===L.id-1),next=LESSONS.find(x=>x.id===L.id+1);
  art.append(el('nav',{class:'pager','aria-label':'Lessons'},prev?el('a',{href:'#lesson-'+prev.id,class:'btn ghost',text:'← '+prev.title}):el('span'),next?el('a',{href:'#lesson-'+next.id,class:'btn',text:next.title+' →'}):el('a',{href:'#cheat-sheet',class:'btn',text:'Cheat sheet →'})));
  mount(art,bench,slot);renderNav(L.id);
}
function showCheats(){
  const box=el('div',{class:'widget'}),slot=el('div',{class:'slot'});
  const art=el('article',{},el('p',{class:'eyebrow',text:'\\?  # reference'}),el('h1',{text:'Cheat sheet'}),el('p',{class:'prose',text:'Every command from the nine lessons. Words in capitals, and single letters such as t and col, are placeholders for your own names. The sandbox here is free play, with the pilots and sorties tables loaded.'}),box,el('section',{class:'slot-sec'},el('h2',{text:'Sandbox'}),slot));
  W.cheats(box);mount(art,lab({id:0,setup:'sorties'},null),slot);renderNav('cheats');

function buildReq(){
  const d=$('#req');d.textContent='';
  const T=(heads,rows,ids)=>el('div',{class:'tscroll'},el('table',{class:'types'},el('thead',{},el('tr',{},heads.map(h=>el('th',{text:h})))),el('tbody',{},rows.map(r=>el('tr',{id:ids?'rq-'+r[0]:null},r.map((c,i)=>el('td',{},i===0?el('code',{text:c}):c)))))));
  d.append(el('div',{class:'req-h'},el('b',{id:'req-t',text:'Kestrel Simulator Requirements'}),el('button',{type:'button',class:'mini',text:'close',onclick:()=>d.close()})),
    el('div',{class:'req-b'},
      el('p',{text:'The Kestrel simulator is a web app in which a pilot powers up the KF-07 Kestrel Mk II, flies one mission, and has the result recorded. This panel holds the parts of its requirements that this guide touches: section 8, Data, and the five rules from other sections that the lessons cite.'}),
      el('p',{text:'The database is PostgreSQL 17, named kestrel, hosted on Neon. It keeps two tables.'}),
      REQ_TABLES.map(t=>[el('h3',{text:'Table: '+t[0]}),T(['Column','Type','Rule'],t[1])]),
      el('h3',{text:'Requirements'}),T(['ID','Requirement'],REQS,true),
      el('p',{},'"Must" marks a requirement the build fails without. "Should" marks one that can be deferred. ',el('a',{href:REQ_URL,target:'_blank',rel:'noopener',text:'Open the full requirements document'}),' (it opens only for people it has been shared with).')));
}
function openReq(id){
  const d=$('#req');if(!d.firstChild)buildReq();
  d.querySelectorAll('tr.hit').forEach(r=>r.classList.remove('hit'));
  if(!d.open){if(d.showModal)d.showModal();else d.setAttribute('open','');}
  const row=id&&d.querySelector('#rq-'+id);
  if(row){row.classList.add('hit');row.scrollIntoView({block:'center'});}else d.scrollTop=0;
}
$('#req-open').addEventListener('click',()=>openReq());
$('#req').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close();});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button.rq');if(b)openReq(b.dataset.rq);});
function route(){
  const h=location.hash.replace('#','');const m=/^lesson-(\d+)$/.exec(h);
  if(h==='cheat-sheet')showCheats();else showLesson(m?+m[1]:1);
  $('#main').scrollTop=0;window.scrollTo(0,0);

window.addEventListener('hashchange',route);route();
})();
