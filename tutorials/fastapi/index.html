{id:7,title:'Signing in with tokens',mins:14,setup:'l7',
idea:`
<p>A mission in the log must belong to the pilot who flew it, so Kestrel control needs to know <em>who</em> is calling. HTTP has no memory: each request stands alone. The client has to prove who it is on every single request, and sending the password each time would be a bad idea. The usual answer is a <strong>token</strong>. On the blueprint it is the key in the shoulder slot.</p>
<ol>
<li>The pilot sends an email and password <strong>once</strong>, to <code>POST /token</code>.</li>
<li>The server checks them and replies with a token: a long string that means "this is pilot 4, role pilot, until 5 o'clock".</li>
<li>The cockpit sends that token in a header on every later request: <code>Authorization: Bearer &lt;token&gt;</code>.</li>
<li>The server checks the token and knows who is asking.</li>
</ol>
<dl class="terms">
<dt>JWT</dt><dd>JSON Web Token, the common token format. It carries a little JSON (who, which role, and until when) and a <em>signature</em> made with a signing key that only the server has. Anyone can read a JWT. Nobody can alter one without breaking the signature. The server must check that signature and the expiry every time, never just decode it: [[IAM-08]].</dd>
<dt>Password hash</dt><dd>A one-way scramble of a password. The server stores only the hash ([[IAM-06]]). At sign-in it scrambles what was typed and compares. If the database leaks, the passwords do not.</dd>
<dt>OAuth2 password flow</dt><dd>The standard that fixes the details: the sign-in path receives <code>username</code> and <code>password</code> as <em>form fields</em>, not JSON, and answers with <code>access_token</code> and <code>token_type</code>. The field is called username even though Kestrel pilots put their email in it. Because it is a standard, the /docs page grows a working Authorize button.</dd>
</dl>
<p>There are two roles, <code>pilot</code> and <code>tech</code> ([[IAM-01]]). A pilot sees only their own missions; a hangar tech sees the roster. Two different refusals follow, and [[IAM-04]] insists they are never swapped: <strong>401</strong> means "I do not know who you are", and <strong>403</strong> means "I know who you are, and you may not".</p>
<p>In FastAPI, all of this is dependencies. <code>get_current_pilot</code> reads the header, checks the token, and returns the pilot. <code>require_tech</code> depends on it and checks the role.</p>`,
widget:'token',widgetTitle:'The token round trip',
widgetIntro:'Press Next to follow a sign-in and the request after it. Underneath, tap the three parts of a token.',

notes:`<h2>Worth knowing</h2>
<ul>
<li>A real signing key is long and random, and anyone who has it can forge a token for any pilot. On your own machine, set it before starting the server. Generate one with <code>openssl rand -hex 32</code>.</li>
<li>Tokens expire. This file gives them 30 minutes, the most [[IAM-07]] allows. After that the cockpit signs in again.</li>
<li>The cockpit must not keep the token in localStorage ([[IAM-09]]). It holds it in memory.</li>
<li>Tokens and passwords are only safe over HTTPS. That is arranged when you deploy.</li>
<li>Version 1 of the simulator signs in this way. The OAuth guide's identity-provider flow is the plan for version 2, and the dependency pattern stays the same.</li>
</ul>`,

{q:'How does GET /missions know whose missions to return?',opts:['From a pilot_id query parameter','From the request body','From the token, through the get_current_pilot dependency','From the IP address'],a:2,why:'The pilot must come from the token and never from anything the client can simply type.'}],

{id:8,title:'A real database',mins:14,setup:'l8',
idea:`
<p>In lesson 3 the pilots disappeared when the server restarted. Now the roster goes where it belongs: the <code>kestrel</code> database, PostgreSQL, the one you built in the Postgres guide and migrated in the SQLAlchemy + Alembic guide. On the blueprint it is the flight recorder.</p>
<p>The official FastAPI tutorial uses SQLModel on SQLite for this chapter. The Kestrel requirements settle on <strong>SQLAlchemy 2.0 on PostgreSQL</strong> ([[DAT-03]]), which you already know, so this lesson uses that. The FastAPI side is identical either way.</p>
<dl class="terms">
<dt>Table model</dt><dd>A class that maps to a table. Each instance is a row, and each <code>Mapped[...]</code> attribute is a column. <code>class Pilot(Base)</code> is the Python twin of the <code>pilots</code> table.</dd>
<dt>Engine</dt><dd>The object that holds the connection to the database. You create one, with a connection string, for the whole application.</dd>
<dt>Session</dt><dd>A short conversation with the database: a few reads and writes that are committed together. It is the transaction from the Postgres guide, seen from Python. Each request gets its own.</dd>
</dl>
<p>The session is delivered by a dependency with <code>yield</code>:</p>
<pre class="file"><code>def get_session():
    with Session(engine) as session:
        yield session</code></pre>
<p>FastAPI runs it up to the <code>yield</code>, gives the session to your function, and after the response has gone out, runs the rest, which closes the session. Every request cleans up after itself, even one that fails. That is [[API-11]].</p>
<p>Two rules from the earlier guides still hold. The connection string is a secret and arrives as <code>DATABASE_URL</code> ([[DAT-09]]). And the app never creates or alters tables itself: there is no <code>create_all()</code> in this file, because the schema only ever changes through an Alembic migration ([[DAT-04]]).</p>
<p>Notice also that there are now <em>two</em> kinds of model: the table model <code>Pilot</code>, and the API models <code>PilotCreate</code>, <code>PilotUpdate</code> and <code>PilotPublic</code>. The table has an email column; <code>PilotPublic</code> does not list it, so it never leaves the server.</p>`,

notes:`<h2>On your own machine</h2>
<p>Set <code>DATABASE_URL</code> before starting the server. For the simulator it is the Neon connection string, in this form:</p>
<pre class="file"><code>postgresql+psycopg://USER:PASSWORD@HOST/kestrel?sslmode=require</code></pre>
<p>The <code>+psycopg</code> tells SQLAlchemy which driver to use, and <code>sslmode=require</code> is the TLS that [[DAT-09]] demands. Keep the line in a <code>.env</code> file that git ignores, and connect as a role that is not the owner ([[DAT-08]]).</p>
<h2>Worth knowing</h2>
<ul>
<li>The table model here must match what the migrations built. If you add a column, change the model and write the migration in the same commit.</li>
<li>Plain <code>def</code> path operations and an ordinary (synchronous) session go together. Lesson 11 explains why that is the safe default.</li>
<li>Note the separate models again: <code>PilotCreate</code> in, <code>PilotPublic</code> out, <code>Pilot</code> for the table. Each one changes for a different reason.</li>
</ul>`,
quiz:[
{q:'In get_session(), when does the code after the yield run?',opts:['Before the path operation function','After the response has been sent','Only if the request fails','Once, when the server starts'],a:1,why:'FastAPI runs a yield dependency up to the yield, runs your function, sends the response, and then finishes the dependency.'},
{q:'Why is there no create_all() call in the lesson 8 file?',opts:['SQLAlchemy creates tables automatically','The requirements say the schema is only ever changed by an Alembic migration','Postgres does not support it','It would be too slow'],a:1,why:'The tables already exist, built by migrations. An app that creates tables on startup can drift away from the migrated schema.'}],
reading:[
['SQL (Relational) Databases',D+'/tutorial/sql-databases/','The official version of this lesson, with SQLModel. The session dependency is the same.'],
['SQLAlchemy 2.0 ORM Quick Start','https://docs.sqlalchemy.org/en/20/orm/quickstart.html','Mapped, mapped_column, select and Session in one page.'],
['Full Stack FastAPI Template','https://github.com/fastapi/full-stack-fastapi-template','The official starter project: FastAPI, Postgres, Docker and a frontend, already wired together.'],
['Lifespan Events',D+'/advanced/events/','How to run code at startup and shutdown.']]},

{id:9,title:'Bigger applications',mins:12,setup:'l9',
idea:`
<p>Everything so far has lived in one file. That stops being comfortable at about two hundred lines, and Kestrel control has a dozen path operations plus sign-in, the database and the flight rules. FastAPI's tool for splitting them up is the <strong>router</strong>.</p>
<p>An <code>APIRouter</code> is a small app-shaped object. You hang path operations on it with <code>@router.get(...)</code> exactly as you did with <code>@app.get(...)</code>, in a file of its own. Then <code>main.py</code> gathers the routers:</p>
<pre class="file"><code># app/routers/pilots.py
router = APIRouter(prefix="/pilots", tags=["pilots"])

@router.get("/{pilot_id}")        # the full path is /pilots/{pilot_id}
def read_pilot(pilot_id: int, ...): ...

# app/main.py
app.include_router(pilots.router)</code></pre>
<ul>
<li><code>prefix</code> is put in front of every path in the router, so you write it once.</li>
<li><code>tags</code> group the operations under a heading on the /docs page.</li>
<li>A path operation can carry <code>dependencies=[Depends(require_tech)]</code>, and so can a whole router.</li>
</ul>
<p>The layout is the one [[API-14]] prescribes. Two files in it are new ideas:</p>
<dl class="terms">
<dt>config.py</dt><dd>Reads every setting from the environment in one place. If one is missing, the app refuses to start and says which one. A server that is half configured never takes a request. That is [[API-13]].</dd>
<dt>CORS, in main.py</dt><dd>Browsers refuse to let a page on one address call an API on another unless the API says it may. The cockpit lives on GitHub Pages and the API on a server, so <code>main.py</code> names the cockpit's address, and only that one. No wildcard: [[API-12]].</dd>
</dl>
<p>Everything else in the package you have already written: the session from lesson 8, the token dependencies from lesson 7, the response models from lesson 5. They have only moved into files of their own.</p>`,

{id:10,title:'The flight rules on the server',mins:16,setup:'l10',
idea:`
<p>This is the lesson the rest were building to. In Business Logic from Zero you wrote the Kestrel's flight rules as a pure TypeScript core, and in Wiring the Rules you connected it to the cockpit. When the suit docks, the cockpit sends a <em>mission report</em> to Kestrel control. The question is what the server should do with it.</p>
<p>The report says, in effect, "I flew Aster retrieval and delivered 40 ng". The server cannot take that on trust. Anyone can send a POST with curl, as you have been doing for nine lessons. So the report carries <strong>evidence</strong> and a <strong>claim</strong>:</p>
<pre class="file"><code>{
  "mission": "Aster retrieval",
  "actions": [ {"type": "START_PREFLIGHT"}, {"type": "ORDER", "name": "launch"}, ... ],
  "claim":   { "phase": "docked", "deliveredNg": 40 }
}</code></pre>
<p>Kestrel control ignores the claim until it has <em>flown the actions again</em> through its own copy of the rules. If its replay ends somewhere else, the mission is refused with 422 and nothing is stored. If it agrees, the server stores <em>its own</em> result, not the browser's. That is [[API-02]].</p>
<p>For this to work the rules must exist twice, in TypeScript and in Python, and give the same answers ([[FLT-55]]). <code>app/flight.py</code> is the Python copy. It is a line-for-line translation of the core you already know:</p>
<table class="types"><thead><tr><th>Cockpit (TypeScript)</th><th>Kestrel control (Python)</th><th>Rule</th></tr></thead><tbody>
<tr><td><code>ORDERS</code> table</td><td><code>ORDERS</code> dict</td><td>Orders only in their phases: [[FLT-12]]</td></tr>
<tr><td><code>flightDraw</code>, <code>withinBudget</code></td><td><code>flight_draw</code>, <code>within_budget</code></td><td>Draw never over 25 kW: [[FLT-32]]</td></tr>
<tr><td><code>giveOrder</code>, <code>setBurn</code></td><td><code>give_order</code>, <code>set_burn</code></td><td>Answer with a new state or a refusal: FLT-51</td></tr>
<tr><td><code>reducer</code></td><td><code>apply</code></td><td>One function every change goes through: FLT-53</td></tr>
<tr><td><code>replay</code></td><td><code>replay</code></td><td>Fly the actions from the hangar</td></tr>
</tbody></table>
<p>Three more things in <code>routers/missions.py</code> finish the job:</p>
<ul>
<li>The pilot is taken from the token, never from the report ([[API-03]]).</li>
<li>The result is decided by the server: Complete when the suit is docked with 40 ng delivered ([[FLT-20]]).</li>
<li>An <code>Idempotency-Key</code> header makes a retry safe. If the cockpit's request times out and it sends the report again with the same key, the mission is recorded once ([[API-04]]).</li>
</ul>
<p><code>flight.py</code> has no FastAPI and no database in it, for the same reason the TypeScript core has no React: so it can be tested on its own, in milliseconds.</p>`,

notes:`<h2>Where each rule is enforced</h2>
<p>A rule that matters is checked in more than one place, so that one mistake cannot break it. This is the picture the requirements end on:</p>
<div class="tscroll"><table class="types"><thead><tr><th>Rule</th><th>Flight core (browser)</th><th>Kestrel control (this guide)</th><th>Database</th></tr></thead><tbody>
<tr><td>Draw never exceeds 25 kW</td><td>Refuses the order at once</td><td>Refuses the mission on replay</td><td>Not stored</td></tr>
<tr><td>Orders only in their phases</td><td>Transition table</td><td>The same table in Python</td><td>Not applicable</td></tr>
<tr><td>Mission result</td><td>Shown to the pilot</td><td>Decided by the server</td><td>Check constraint on result</td></tr>
<tr><td>A mission belongs to its pilot</td><td>Not decided here</td><td>Taken from the token</td><td>Foreign key on pilot_id</td></tr>
<tr><td>A mission is recorded once</td><td>Sends one key per mission</td><td>Checks the key</td><td>Unique idempotency_key</td></tr>
<tr><td>Callsigns are unique</td><td>Not decided here</td><td>Answers 409</td><td>Unique constraint</td></tr>
</tbody></table></div>
<h2>Worth knowing</h2>
<ul>
<li>The cockpit writes <code>deliveredNg</code> and the API's rule is snake_case. The <code>Claim</code> model bridges the two with <code>Field(alias="deliveredNg")</code>: the name on the wire is the cockpit's, and the Python attribute is <code>delivered_ng</code>.</li>
<li>The cockpit's half of this request, the <code>fetch</code> call that posts the report, belongs in <code>features/flight/services/</code>. Wiring the Rules left that file for this guide. Its job is small: build the report with <code>toMissionReport</code>, attach the token and a fresh Idempotency-Key, and show whether the mission was recorded.</li>
<li>When a rule changes, it changes in both copies and in the shared test list in the same pull request. A test that passes in one language and fails in the other is the alarm.</li>
<li>In tests you can replace a dependency, for example swap the real session for a throwaway one, with <code>app.dependency_overrides</code>. The reading list has the page.</li>
</ul>`,

{id:11,title:'Running it for real',mins:12,setup:'l11',
idea:`
<p><code>fastapi dev</code> is built for you: it restarts on every save and listens only to your own machine. Production is a different job, with a different command.</p>
<table class="types"><thead><tr><th></th><th><code>fastapi dev</code></th><th><code>fastapi run</code></th></tr></thead><tbody>
<tr><td>Restarts when files change</td><td>yes</td><td>no</td></tr>
<tr><td>Listens on</td><td><code>127.0.0.1</code>: this machine only</td><td><code>0.0.0.0</code>: every network interface, so other machines can reach it</td></tr>
<tr><td>Use for</td><td>writing code</td><td>serving pilots</td></tr>
</tbody></table>
<dl class="terms">
<dt>Worker</dt><dd>One copy of your app, running as its own process. Several workers let one machine use several processor cores. On the blueprint they are the wing binders. Each has its own memory, which is one more reason the roster lives in Postgres and not in a Python variable.</dd>
<dt>Container image</dt><dd>From the Docker guide: your code, Python, and every package, frozen into one thing that runs the same everywhere. Kestrel control ships as one ([[OPS-06]]).</dd>
<dt>Environment variables</dt><dd>How settings that differ between your laptop and Hangar 7 reach the app without being written in the code or baked into the image.</dd>
</dl>
<h3>def or async def?</h3>
<p>You have written plain <code>def</code> functions throughout, and that was deliberate. FastAPI runs each plain function in a pool of threads, so one slow request does not hold up the others. <code>async def</code> is the other option, and it is faster <em>if</em> everything slow inside the function is awaited. The widget below shows what goes wrong when it is not.</p>`,

notes:`<h2>What a deployment adds around this</h2>
<ul>
<li><strong>HTTPS.</strong> Something in front of the container, a proxy, holds the certificate and forwards plain HTTP to the app ([[API-15]]). The Cloud Deploy guide uses Caddy for it. When there is one, add <code>--proxy-headers</code> to the <code>fastapi run</code> command.</li>
<li><strong>Restarts.</strong> The platform starts the container again if it stops. On the simulator's one small server, run a single worker in the container.</li>
<li><strong>Migrations first.</strong> A new release runs its Alembic migrations before it takes traffic.</li>
<li><strong>The database</strong> is on Neon, never inside the API's container.</li>
<li>The documentation also offers <code>uv run fastapi deploy</code>, which sends the project to FastAPI Cloud, a hosting service run by the FastAPI team. It needs an account, so the sandbox does not simulate it.</li>
</ul>
<h2>Where to go next</h2>
<p>You have now built the server half of the Kestrel simulator. HTTP + Networking explains the layer underneath it, Cloud Deploy puts this container on a real server, and Observability teaches the running system to explain itself. In the official documentation, the Advanced User Guide uses the same pieces for WebSockets, background tasks, streaming and more. Read a page when you need it.</p>`,

{q:'Why did the first docker run in this lesson exit straight away?',opts:['The port was already in use','The image was built wrongly','The container had none of the environment variables, so config.py refused to start','Docker needs --workers'],a:2,why:'Containers start with an empty environment. The settings must be passed in with -e or an env file.'},
{q:'An async def path operation calls a slow, ordinary (not awaited) database function. What is the effect?',opts:['Nothing, async is always faster','Every other request waits until it finishes','FastAPI moves it to a thread automatically','The server refuses to start'],a:1,why:'A blocking call inside async def holds up the single event loop. Use plain def, which FastAPI runs in a thread pool, or await an async library.'}],
reading:[
['Concurrency and async / await',D+'/async/','The clearest explanation of def versus async def anywhere. Read the "In a hurry?" section first.'],
['Deployment',D+'/deployment/','The concepts: HTTPS, restarts, replication, memory.'],
['FastAPI in Containers - Docker',D+'/deployment/docker/','The source of this lesson\'s Dockerfile, explained line by line.'],
['Server Workers - Uvicorn with Workers',D+'/deployment/server-workers/','When to use --workers and when not to.']]}
];

en the suit is docked and 40 ng were delivered."], ["FLT-32", "The flight draw must never exceed the 25 kW budget. A draw of exactly 25 kW is allowed."], ["FLT-51", "A rule must answer with either the new state or a refusal and its reason. A refusal is an ordinary answer, not an exception."], ["FLT-52", "A refused order must change nothing except the alert. The next accepted order must clear the alert."], ["FLT-53", "Every change to the flight state must go through one function that takes the state and an order and returns the new state."], ["FLT-55", "The flight rules must exist twice with the same results: in TypeScript in the browser and in Python on the server."], ["DAT-02", "Every rule in the tables must be enforced by the database itself (unique, foreign key, not null, and check constraints on role, result and delivered_ng), as well as by the API."], ["DAT-03", "Models must use SQLAlchemy 2.0 typed mapping (Mapped, mapped_column) with psycopg 3, one engine for the app."], ["DAT-04", "The schema must only ever be changed by an Alembic migration. create_all, drop_all and hand-typed ALTER must not be run against a migrated database."], ["DAT-08", "The API must connect as a role that is not the owner or a superuser."], ["DAT-09", "The connection string is a secret, supplied as DATABASE_URL, and must require TLS (sslmode=require)."], ["QA-06", "The server's flight rules must be tested with pytest, and one shared set of order logs must give the same results in both languages (FLT-55)."], ["QA-07", "API tests must use FastAPI's TestClient and run without a server. Database rules must be tested against real PostgreSQL, not SQLite."], ["OPS-06", "The API must ship as a container image built from a Dockerfile, with a pinned base image, dependencies installed before the code is copied, and no secret baked in."], ["OPS-08", "The container must have a health check and a restart policy. A release counts as live only once its health check passes."]];
