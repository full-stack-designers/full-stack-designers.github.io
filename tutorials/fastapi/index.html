<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastAPI from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right the Kestrel Mk II blueprint with a callout per part of the FastAPI app, the same parts as rows beside it with the last call, code and routes underneath, above a terminal that changes them. One dark terminal world; on phones the bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:attr(data-p) " ";color:var(--term-dim)}
.ran::before{content:attr(data-p) " ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-tables{border-top-color:var(--good)}.z-session{border-top-color:var(--accent)}.z-databases{border-top-color:var(--warn)}.z-roles{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-tables .zlist{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}

.req-b tr.hit td{background:var(--accent-soft)}
.req-b tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
p.hint{border-left:3px solid var(--warn);padding:2px 0 2px 10px;color:var(--muted);font-size:.9rem}
/* ---- FastAPI guide additions ---- */
:root{--accent:#2fd4b5;--accent-ink:#031a16;--accent-soft:#0d2b27}
.tl{white-space:pre-wrap;overflow-wrap:anywhere}
.tl.prog{display:flex;gap:10px;align-items:center;color:var(--term-dim)}
.prog .track{flex:0 0 150px;height:8px;background:var(--term-line);border-radius:2px;overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--good);transition:width .1s linear}
.map-head .pill{font-size:.7rem}
.fz{display:grid;grid-template-columns:minmax(0,1fr)}
.fz .zone{border-right:0;border-bottom:1px solid var(--line)}
.z-code{border-top-color:var(--accent)}.z-routes{border-top-color:var(--good)}.z-exchange{border-top-color:var(--warn)}.z-server{border-top-color:#b392f0}.z-data{border-top-color:var(--muted)}
.fz .zlist{flex-direction:column;flex-wrap:nowrap}
.ftabs{display:flex;flex-wrap:wrap;gap:4px}
.ftab{font:500 .68rem var(--mono);padding:2px 7px;border-radius:3px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.ftab[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ftab.chg::after{content:" \25CF";color:var(--good)}
.pycode{background:var(--term);border:1px solid var(--line);border-radius:4px;max-height:250px;overflow:auto;padding:6px 0;font:400 .7rem/1.5 var(--mono);color:var(--term-ink)}
.pl{display:block;white-space:pre;padding-right:10px;border-left:3px solid transparent;min-width:max-content}
.pl.new{background:var(--good-soft);border-left-color:var(--good)}
.pl i{font-style:normal;display:inline-block;width:2.6em;text-align:right;padding-right:.8em;color:var(--term-dim);user-select:none}
.pl .k{color:#ff9eb0}.pl .s{color:#e6c07b}.pl .c{color:var(--term-dim)}.pl .d{color:var(--accent)}.pl .n{color:#9fd0ff}
.rt{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:4px 6px;border-radius:3px;border:1px solid transparent}
.rt.hit{border-color:var(--accent);background:var(--accent-soft)}
.meth{font:700 .64rem var(--mono);padding:1px 5px;border-radius:3px;min-width:4.2em;text-align:center}
.m-GET{background:#12283f;color:#6db8ff}.m-POST{background:var(--good-soft);color:var(--good)}.m-PUT,.m-PATCH{background:var(--warn-soft);color:var(--warn)}.m-DELETE{background:var(--bad-soft);color:var(--bad)}
.rt b{font:500 .8rem var(--mono);overflow-wrap:anywhere}
.rt .sub{flex-basis:auto}
.xreq{font:500 .82rem var(--mono);overflow-wrap:anywhere}
.xsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.xsteps li{display:flex;gap:6px;font-size:.78rem;line-height:1.35;overflow-wrap:anywhere}
.xsteps li::before{content:"\2713";color:var(--good);font-family:var(--mono);flex:none}
.xsteps li.no::before{content:"\2717";color:var(--bad)}
.xsteps li.skip::before{content:"\2013";color:var(--muted)}
.xsteps li.skip{color:var(--muted)}
.rbody{margin:0;background:var(--term);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:400 .7rem/1.45 var(--mono);max-height:180px;overflow:auto;white-space:pre;color:var(--term-ink)}
.slog{font:400 .66rem/1.45 var(--mono);color:var(--term-dim);white-space:pre;overflow-x:auto;background:var(--term);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.slog .w{color:var(--warn)}.slog .e{color:var(--bad)}.slog .r{color:var(--term-ink)}
.zone .kv .row{gap:4px 6px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
@media (min-width:720px){
  .fz{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .fz .z-code{grid-row:span 2;border-right:1px solid var(--line)}
  .fz .z-server{border-right:1px solid var(--line);border-bottom:0}
  .fz .z-data{border-bottom:0}
}
@media (min-width:1040px){.map{max-height:60%}}
/* widgets */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px}
.fstep{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--sunk);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;padding:7px 9px}
.fstep .fnum{font:500 .68rem var(--mono);color:var(--muted)}
.fstep .ft{font:500 .82rem var(--mono)}
.fstep .fs{font-size:.74rem;color:var(--muted);overflow-wrap:anywhere}
.fstep.past{border-left-color:var(--good)}
.fstep[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cs button{overflow-wrap:anywhere;text-align:left}
.lanes{display:flex;flex-direction:column;gap:6px}
.lane{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;align-items:center;font:400 .78rem var(--mono);color:var(--muted)}
.lane .track{position:relative;height:16px;background:var(--sunk);border-radius:2px}
.lane .fill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px;transition:left .3s,width .3s}
.lane .fill.wait{background:var(--line)}
.axis{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;font:400 .68rem var(--mono);color:var(--muted)}
.axis div{display:flex;justify-content:space-between}
.prose h3{font-family:var(--mono)}
.prose pre.file{font-size:.82rem}

.fz .zlist{min-width:0}
.pycode,.rbody,.slog{min-width:0}

/* ---- Kestrel blueprint layout for this guide ---- */
.pz{display:grid;grid-template-columns:minmax(0,1fr)}
.pcol{display:flex;flex-direction:column;min-width:0}
.pz .zone{border-right:0;border-bottom:1px solid var(--line);min-width:0;flex:none}
.pz .zlist{flex-direction:column;flex-wrap:nowrap;min-width:0}
.lanes2{display:flex;flex-direction:column;gap:5px}
.z-path{border-top-color:#7aa7ff}.z-sys{border-top-color:var(--accent)}
.ccard .sub{font-size:.72rem}
.kfig.bp svg{max-height:340px}
.zone.flash{background:var(--accent-soft);transition:none}
.widget .steps li.hit{border-left-color:var(--good)}
@media (max-width:719px){.ccard .sub{display:none}.ccard .real{flex-basis:100%;font-size:.64rem}.ccard .pill{white-space:normal;font-size:.64rem}.lanes2{display:grid;grid-template-columns:1fr 1fr;gap:4px}.ccard{padding:3px 5px}}
@media (min-width:720px){
  .pz{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr)}
  .pcol:first-child{border-right:1px solid var(--line)}
  .lanes2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .kfig.bp svg{max-height:440px}
}
@media (min-width:1040px){
  .map{display:flex;flex-direction:column;overflow:hidden;max-height:70%;flex:0 1 auto}
  .map>.pz{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1fr);overflow:hidden}
  .pz>.pcol{min-height:0}
  .pz>.pcol:first-child{overflow:hidden}
  .pz>.pcol:last-child{overflow:auto}
  .kfig.bp svg{max-height:max(230px,calc(70vh - 220px))}
  .term{min-height:190px}
}

.ccard .pill{white-space:normal}
.widget .steps li{list-style:none}

<script>
const STEP_FILES={"01_status.py": "from fastapi import FastAPI\n\napp = FastAPI(title=\"kestrel-control\")\n\n\n@app.get(\"/status\")\ndef read_status():\n    return {\"frame\": \"KF-07 Kestrel Mk II\", \"mission\": \"Aster retrieval\"}\n", "02_params.py": "from enum import Enum\n\nfrom fastapi import FastAPI\n\napp = FastAPI(title=\"kestrel-control\")\n\n# The squadron roster, held in memory for now. Lesson 8 moves it into Postgres.\nPILOTS = {\n    1: {\"id\": 1, \"callsign\": \"Wren\", \"grade\": \"captain\", \"clearance\": 3},\n    2: {\"id\": 2, \"callsign\": \"Ibis\", \"grade\": \"lieutenant\", \"clearance\": 2},\n    3: {\"id\": 3, \"callsign\": \"Heron\", \"grade\": \"ensign\", \"clearance\": 1},\n    4: {\"id\": 4, \"callsign\": \"Ada\", \"grade\": None, \"clearance\": 2},\n}\n\n\nclass Grade(str, Enum):\n    captain = \"captain\"\n    lieutenant = \"lieutenant\"\n    ensign = \"ensign\"\n\n\n@app.get(\"/status\")\ndef read_status():\n    return {\"frame\": \"KF-07 Kestrel Mk II\", \"mission\": \"Aster retrieval\"}\n\n\n@app.get(\"/pilots\")\ndef list_pilots(limit: int = 25, min_clearance: int = 1, grade: Grade | None = None):\n    found = [\n        p\n        for p in PILOTS.values()\n        if p[\"clearance\"] >= min_clearance and (grade is None or p[\"grade\"] == grade)\n    ]\n    return found[:limit]\n\n\n@app.get(\"/pilots/{pilot_id}\")\ndef read_pilot(pilot_id: int):\n    return PILOTS[pilot_id]\n", "03_body.py": "from fastapi import FastAPI\nfrom pydantic import BaseModel\n\napp = FastAPI(title=\"kestrel-control\")\n\n\nclass Pilot(BaseModel):\n    callsign: str\n    email: str\n    clearance: int = 1\n    grade: str | None = None\n\n\nPILOTS: dict[int, Pilot] = {}\n\n\n@app.get(\"/pilots\")\ndef list_pilots():\n    return [{\"id\": i, **p.model_dump()} for i, p in PILOTS.items()]\n\n\n@app.post(\"/pilots\")\ndef enlist_pilot(pilot: Pilot):\n    pilot_id = len(PILOTS) + 1\n    PILOTS[pilot_id] = pilot\n    return {\"id\": pilot_id, **pilot.model_dump()}\n\n\n@app.put(\"/pilots/{pilot_id}\")\ndef replace_pilot(pilot_id: int, pilot: Pilot):\n    PILOTS[pilot_id] = pilot\n    return {\"id\": pilot_id, **pilot.model_dump()}\n", "04_validation.py": "from typing import Annotated\n\nfrom fastapi import FastAPI, Path, Query\nfrom pydantic import BaseModel, Field\n\napp = FastAPI(title=\"kestrel-control\")\n\n\nclass Pilot(BaseModel):\n    callsign: str = Field(min_length=2, max_length=30)\n    email: str\n    clearance: int = Field(default=1, ge=1, description=\"1 is the lowest clearance\")\n    grade: str | None = None\n    ratings: list[str] = []\n\n\nPILOTS: dict[int, Pilot] = {}\n\n\n@app.get(\"/pilots\")\ndef list_pilots(\n    q: Annotated[str | None, Query(min_length=3, max_length=30)] = None,\n    limit: Annotated[int, Query(ge=1, le=100)] = 25,\n):\n    found = [\n        {\"id\": i, **p.model_dump()}\n        for i, p in PILOTS.items()\n        if q is None or q.lower() in p.callsign.lower()\n    ]\n    return found[:limit]\n\n\n@app.get(\"/pilots/{pilot_id}\")\ndef read_pilot(pilot_id: Annotated[int, Path(ge=1)]):\n    return PILOTS.get(pilot_id)\n\n\n@app.post(\"/pilots\")\ndef enlist_pilot(pilot: Pilot):\n    pilot_id = len(PILOTS) + 1\n    PILOTS[pilot_id] = pilot\n    return {\"id\": pilot_id, **pilot.model_dump()}\n", "05_responses.py": "from fastapi import FastAPI, HTTPException, status\nfrom pydantic import BaseModel, Field\n\napp = FastAPI(title=\"kestrel-control\")\n\n\nclass PilotCreate(BaseModel):\n    callsign: str = Field(min_length=2, max_length=30)\n    email: str\n    password: str  # kept as typed only in this lesson: lesson 7 stores a hash instead\n    clearance: int = Field(default=1, ge=1)\n\n\nclass PilotPublic(BaseModel):\n    id: int\n    callsign: str\n    clearance: int\n\n\nPILOTS: dict[int, dict] = {}\n\n\n@app.post(\"/pilots\", response_model=PilotPublic, status_code=status.HTTP_201_CREATED)\ndef enlist_pilot(pilot: PilotCreate):\n    if any(p[\"callsign\"] == pilot.callsign for p in PILOTS.values()):\n        raise HTTPException(status_code=409, detail=\"Callsign already taken\")\n    pilot_id = max(PILOTS, default=0) + 1\n    PILOTS[pilot_id] = {\"id\": pilot_id, **pilot.model_dump()}\n    return PILOTS[pilot_id]\n\n\n@app.get(\"/pilots\", response_model=list[PilotPublic])\ndef list_pilots():\n    return list(PILOTS.values())\n\n\n@app.get(\"/pilots/{pilot_id}\", response_model=PilotPublic)\ndef read_pilot(pilot_id: int):\n    if pilot_id not in PILOTS:\n        raise HTTPException(status_code=404, detail=\"No such pilot\")\n    return PILOTS[pilot_id]\n\n\n@app.delete(\"/pilots/{pilot_id}\", status_code=status.HTTP_204_NO_CONTENT)\ndef discharge_pilot(pilot_id: int):\n    if pilot_id not in PILOTS:\n        raise HTTPException(status_code=404, detail=\"No such pilot\")\n    del PILOTS[pilot_id]\n", "06_dependencies.py": "from typing import Annotated\n\nfrom fastapi import Depends, FastAPI, Header, HTTPException, Query\nfrom pydantic import BaseModel, Field\n\napp = FastAPI(title=\"kestrel-control\")\n\nPILOTS = [\n    {\"id\": 1, \"callsign\": \"Wren\", \"grade\": \"captain\", \"clearance\": 3},\n    {\"id\": 2, \"callsign\": \"Ibis\", \"grade\": \"lieutenant\", \"clearance\": 2},\n    {\"id\": 3, \"callsign\": \"Heron\", \"grade\": \"ensign\", \"clearance\": 1},\n    {\"id\": 4, \"callsign\": \"Ada\", \"grade\": None, \"clearance\": 2},\n]\nMISSIONS = [\n    {\"id\": 1, \"code\": \"M-041\", \"date\": \"2026-11-02\", \"result\": \"Complete\"},\n    {\"id\": 2, \"code\": \"M-047\", \"date\": \"2026-11-05\", \"result\": \"Complete\"},\n    {\"id\": 3, \"code\": \"M-058\", \"date\": \"2026-11-09\", \"result\": \"Complete\"},\n]\n\n\nclass PilotCreate(BaseModel):\n    callsign: str = Field(min_length=2, max_length=30)\n    clearance: int = Field(default=1, ge=1)\n\n\ndef pagination(\n    limit: Annotated[int, Query(ge=1, le=100)] = 25,\n    cursor: Annotated[str | None, Query(pattern=r\"^\\d+$\")] = None,\n):\n    return {\"limit\": limit, \"after\": int(cursor or 0)}\n\n\nPagination = Annotated[dict, Depends(pagination)]\n\n\ndef one_page(rows: list[dict], page: dict):\n    later = [r for r in rows if r[\"id\"] > page[\"after\"]]\n    data = later[: page[\"limit\"]]\n    more = len(later) > page[\"limit\"]\n    return {\"data\": data, \"next_cursor\": str(data[-1][\"id\"]) if more else None}\n\n\ndef require_hangar_key(x_hangar_key: Annotated[str | None, Header()] = None):\n    if x_hangar_key != \"gantry-7\":\n        raise HTTPException(status_code=401, detail=\"Invalid or missing hangar key\")\n\n\n@app.get(\"/pilots\")\ndef list_pilots(page: Pagination):\n    return one_page(PILOTS, page)\n\n\n@app.get(\"/missions\")\ndef list_missions(page: Pagination):\n    return one_page(MISSIONS, page)\n\n\n@app.post(\"/pilots\", status_code=201, dependencies=[Depends(require_hangar_key)])\ndef enlist_pilot(pilot: PilotCreate):\n    new = {\"id\": len(PILOTS) + 1, \"callsign\": pilot.callsign, \"grade\": None, \"clearance\": pilot.clearance}\n    PILOTS.append(new)\n    return new\n", "07_security.py": "import os\nfrom datetime import datetime, timedelta, timezone\nfrom typing import Annotated\n\nimport jwt\nfrom fastapi import Depends, FastAPI, HTTPException, status\nfrom fastapi.security import OAuth2PasswordBearer, OAuth2PasswordRequestForm\nfrom jwt.exceptions import InvalidTokenError\nfrom pwdlib import PasswordHash\nfrom pydantic import BaseModel\n\n# Secrets come from the environment, never from the code.\nSIGNING_KEY = os.environ[\"KESTREL_SIGNING_KEY\"]\nALGORITHM = \"HS256\"\nTOKEN_MINUTES = 30\n\npassword_hash = PasswordHash.recommended()\noauth2_scheme = OAuth2PasswordBearer(tokenUrl=\"token\")\n\n# A stand-in for the pilots table. Only the hash of the password is kept.\nPILOTS = {\n    4: {\n        \"id\": 4,\n        \"callsign\": \"Ada\",\n        \"email\": \"ada@example.com\",\n        \"role\": \"pilot\",\n        \"hashed_password\": password_hash.hash(os.environ[\"SEED_PILOT_PASSWORD\"]),\n    }\n}\nMISSIONS = [\n    {\"code\": \"M-041\", \"pilot_id\": 4, \"date\": \"2026-11-02\", \"result\": \"Complete\"},\n    {\"code\": \"M-047\", \"pilot_id\": 1, \"date\": \"2026-11-05\", \"result\": \"Complete\"},\n    {\"code\": \"M-058\", \"pilot_id\": 4, \"date\": \"2026-11-09\", \"result\": \"Complete\"},\n]\n\napp = FastAPI(title=\"kestrel-control\")\n\n\nclass Token(BaseModel):\n    access_token: str\n    token_type: str\n\n\nclass Pilot(BaseModel):\n    id: int\n    callsign: str\n    role: str\n\n\ndef get_current_pilot(token: Annotated[str, Depends(oauth2_scheme)]):\n    credentials_error = HTTPException(\n        status_code=status.HTTP_401_UNAUTHORIZED,\n        detail=\"Could not validate credentials\",\n        headers={\"WWW-Authenticate\": \"Bearer\"},\n    )\n    try:\n        payload = jwt.decode(token, SIGNING_KEY, algorithms=[ALGORITHM])\n        pilot = PILOTS.get(int(payload[\"sub\"]))\n    except (InvalidTokenError, KeyError, ValueError):\n        raise credentials_error\n    if pilot is None:\n        raise credentials_error\n    return Pilot(**pilot)\n\n\nCurrentPilot = Annotated[Pilot, Depends(get_current_pilot)]\n\n\ndef require_tech(pilot: CurrentPilot):\n    if pilot.role != \"tech\":\n        raise HTTPException(status_code=403, detail=\"Hangar techs only\")\n\n\n@app.post(\"/token\")\ndef sign_in(form: Annotated[OAuth2PasswordRequestForm, Depends()]) -> Token:\n    # The OAuth2 form calls the field \"username\". Pilots put their email in it.\n    pilot = next((p for p in PILOTS.values() if p[\"email\"] == form.username), None)\n    if not pilot or not password_hash.verify(form.password, pilot[\"hashed_password\"]):\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Wrong email or password\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        )\n    expires = datetime.now(timezone.utc) + timedelta(minutes=TOKEN_MINUTES)\n    claims = {\"sub\": str(pilot[\"id\"]), \"role\": pilot[\"role\"], \"exp\": expires}\n    return Token(access_token=jwt.encode(claims, SIGNING_KEY, algorithm=ALGORITHM), token_type=\"bearer\")\n\n\n@app.get(\"/pilots/me\")\ndef read_me(pilot: CurrentPilot) -> Pilot:\n    return pilot\n\n\n@app.get(\"/missions\")\ndef my_missions(pilot: CurrentPilot):\n    return [m for m in MISSIONS if m[\"pilot_id\"] == pilot.id]\n\n\n@app.get(\"/pilots\", dependencies=[Depends(require_tech)])\ndef list_pilots():\n    return [Pilot(**p) for p in PILOTS.values()]\n", "08_database.py": "import os\nfrom datetime import datetime\nfrom typing import Annotated\n\nfrom fastapi import Depends, FastAPI, HTTPException, Query, Response\nfrom pydantic import BaseModel, ConfigDict, Field\nfrom sqlalchemy import DateTime, String, create_engine, func, select, text\nfrom sqlalchemy.exc import IntegrityError, SQLAlchemyError\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, Session, mapped_column\n\n# One engine for the whole app. The address is a secret, so it comes from the environment.\nengine = create_engine(os.environ[\"DATABASE_URL\"])\n\n\nclass Base(DeclarativeBase):\n    pass\n\n\n# The table model: one object is one row of the pilots table.\nclass Pilot(Base):\n    __tablename__ = \"pilots\"\n\n    id: Mapped[int] = mapped_column(primary_key=True)\n    callsign: Mapped[str] = mapped_column(String(30), unique=True)\n    email: Mapped[str] = mapped_column(unique=True)\n    grade: Mapped[str | None] = mapped_column(String(20))\n    clearance: Mapped[int] = mapped_column(default=1)\n    role: Mapped[str] = mapped_column(default=\"pilot\")\n    joined_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())\n\n\n# The API models: what comes in and what goes out.\nclass PilotCreate(BaseModel):\n    callsign: str = Field(min_length=2, max_length=30)\n    email: str\n    clearance: int = Field(default=1, ge=1)\n    grade: str | None = Field(default=None, max_length=20)\n\n\nclass PilotUpdate(BaseModel):\n    clearance: int | None = Field(default=None, ge=1)\n    grade: str | None = Field(default=None, max_length=20)\n\n\nclass PilotPublic(BaseModel):\n    model_config = ConfigDict(from_attributes=True)\n\n    id: int\n    callsign: str\n    grade: str | None\n    clearance: int\n\n\ndef get_session():\n    with Session(engine) as session:\n        yield session\n\n\nSessionDep = Annotated[Session, Depends(get_session)]\n\napp = FastAPI(title=\"kestrel-control\")\n\n\n@app.get(\"/healthz\")\ndef healthz():\n    return {\"status\": \"ok\"}\n\n\n@app.get(\"/readyz\")\ndef readyz(session: SessionDep, response: Response):\n    try:\n        session.execute(text(\"SELECT 1\"))\n    except SQLAlchemyError:\n        response.status_code = 503\n        return {\"status\": \"not ready\", \"failed\": \"database\"}\n    return {\"status\": \"ready\"}\n\n\n@app.post(\"/pilots\", response_model=PilotPublic, status_code=201)\ndef enlist_pilot(pilot: PilotCreate, session: SessionDep):\n    row = Pilot(**pilot.model_dump())\n    session.add(row)\n    try:\n        session.commit()\n    except IntegrityError:\n        session.rollback()\n        raise HTTPException(status_code=409, detail=\"Callsign already taken\")\n    session.refresh(row)\n    return row\n\n\n@app.get(\"/pilots\", response_model=list[PilotPublic])\ndef list_pilots(session: SessionDep, limit: Annotated[int, Query(ge=1, le=100)] = 25):\n    return session.scalars(select(Pilot).order_by(Pilot.id).limit(limit)).all()\n\n\n@app.get(\"/pilots/{pilot_id}\", response_model=PilotPublic)\ndef read_pilot(pilot_id: int, session: SessionDep):\n    row = session.get(Pilot, pilot_id)\n    if not row:\n        raise HTTPException(status_code=404, detail=\"No such pilot\")\n    return row\n\n\n@app.patch(\"/pilots/{pilot_id}\", response_model=PilotPublic)\ndef update_pilot(pilot_id: int, changes: PilotUpdate, session: SessionDep):\n    row = session.get(Pilot, pilot_id)\n    if not row:\n        raise HTTPException(status_code=404, detail=\"No such pilot\")\n    for name, value in changes.model_dump(exclude_unset=True).items():\n        setattr(row, name, value)\n    session.commit()\n    session.refresh(row)\n    return row\n\n\n@app.delete(\"/pilots/{pilot_id}\", status_code=204)\ndef discharge_pilot(pilot_id: int, session: SessionDep):\n    row = session.get(Pilot, pilot_id)\n    if not row:\n        raise HTTPException(status_code=404, detail=\"No such pilot\")\n    session.delete(row)\n    session.commit()\n", "09_app/__init__.py": "", "09_app/config.py": "import os\n\n# Every setting comes from the environment. If one is missing the app refuses\n# to start and says which, so a half-configured server never takes a request.\nREQUIRED = (\"KESTREL_ENV\", \"DATABASE_URL\", \"KESTREL_SIGNING_KEY\", \"KESTREL_COCKPIT_ORIGIN\")\n\nmissing = [name for name in REQUIRED if not os.environ.get(name)]\nif missing:\n    raise RuntimeError(\"Missing settings: \" + \", \".join(missing))\n\nENV = os.environ[\"KESTREL_ENV\"]\nDATABASE_URL = os.environ[\"DATABASE_URL\"]\nSIGNING_KEY = os.environ[\"KESTREL_SIGNING_KEY\"]\nCOCKPIT_ORIGIN = os.environ[\"KESTREL_COCKPIT_ORIGIN\"]\nLOG_LEVEL = os.environ.get(\"LOG_LEVEL\", \"info\")\n\nALGORITHM = \"HS256\"\nTOKEN_MINUTES = 30\nVERSION = \"1.0.0\"\n", "09_app/db.py": "from typing import Annotated\n\nfrom fastapi import Depends\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import Session\n\nfrom . import config\n\nengine = create_engine(config.DATABASE_URL)\n\n\ndef get_session():\n    with Session(engine) as session:\n        yield session\n\n\nSessionDep = Annotated[Session, Depends(get_session)]\n", "09_app/flight.py": "\"\"\"The Kestrel's flight rules, in Python.\n\nThis is the server's own copy of the rules the cockpit runs in TypeScript.\nNothing here knows about FastAPI, HTTP or the database: a rule takes a state\nand answers with a new state, or with a Refusal that says why not.\n\"\"\"\n\nfrom dataclasses import dataclass, replace\n\nBUDGET_KW = 25  # the reactor's hard power budget\nSAMPLE_NG = 40\nMAIN_FIELD_TESLA = 5.2\n\nLOADS = {\"flight_computer\": 1, \"navigation\": 1, \"sensors\": 2, \"containment\": 6, \"cruise\": 9, \"sprint\": 21}\n\nPHASE_TEXT = {\n    \"hangar\": \"parked in Hangar 7\",\n    \"transit\": \"in transit to gate-alpha\",\n    \"aster\": \"in the Aster system\",\n    \"trap\": \"holding off the trap station\",\n    \"captured\": \"holding off the trap station, sample aboard\",\n    \"return\": \"homebound from gate-alpha\",\n    \"docked\": \"docked in Hangar 7\",\n}\n\n# order -> {phase it is allowed in: phase it moves the suit to}\nORDERS = {\n    \"launch\": {\"hangar\": \"transit\"},\n    \"align\": {\"transit\": \"transit\", \"return\": \"return\"},\n    \"jump\": {\"transit\": \"aster\", \"captured\": \"return\"},\n    \"approach\": {\"aster\": \"trap\"},\n    \"scan\": {\"trap\": \"trap\"},\n    \"capture\": {\"trap\": \"captured\"},\n    \"hold\": {\"captured\": \"captured\", \"return\": \"return\"},\n    \"trim\": {\"transit\": \"transit\", \"aster\": \"aster\", \"trap\": \"trap\", \"captured\": \"captured\", \"return\": \"return\"},\n    \"dock\": {\"return\": \"docked\"},\n}\n\n\n@dataclass(frozen=True)\nclass FlightState:\n    phase: str = \"hangar\"\n    burn: str = \"cruise\"\n    preflight_started: bool = False\n    scanned: bool = False\n    antimatter_ng: int = 0\n    field_tesla: float = 0.0\n    delivered_ng: int = 0\n    clock_seconds: int = 0\n    log: tuple = ()\n    alert: str | None = None\n\n\n@dataclass(frozen=True)\nclass Refusal:\n    reason: str\n\n\ndef flight_draw(state: FlightState) -> int:\n    parked = state.phase in (\"hangar\", \"docked\")\n    thrusters = 0 if parked else LOADS[state.burn]\n    containment = LOADS[\"containment\"] if state.antimatter_ng > 0 else 0\n    return LOADS[\"flight_computer\"] + LOADS[\"navigation\"] + LOADS[\"sensors\"] + containment + thrusters\n\n\ndef within_budget(state: FlightState) -> FlightState | Refusal:\n    draw = flight_draw(state)\n    if draw > BUDGET_KW:\n        return Refusal(f\"power request denied: over budget (budget {BUDGET_KW} kW, asked {draw} kW)\")\n    return state\n\n\ndef set_burn(state: FlightState, burn: str) -> FlightState | Refusal:\n    if burn not in (\"cruise\", \"sprint\"):\n        return Refusal(f\"unknown burn profile: {burn}\")\n    return within_budget(replace(state, burn=burn))\n\n\ndef give_order(state: FlightState, name: str) -> FlightState | Refusal:\n    if name not in ORDERS:\n        return Refusal(f\"unknown order: {name}\")\n    to = ORDERS[name].get(state.phase)\n    if to is None:\n        return Refusal(f\"cannot {name}: the Kestrel is {PHASE_TEXT[state.phase]}\")\n    if name == \"launch\" and not state.preflight_started:\n        return Refusal(\"cannot launch: no preflight has been started\")\n    if name == \"capture\" and not state.scanned:\n        return Refusal(\"cannot capture: scan the trap station first\")\n    if name == \"dock\" and state.burn == \"sprint\":\n        return Refusal(\"cannot dock at sprint burn: set the thrusters to cruise first\")\n\n    moved = replace(state, phase=to, clock_seconds=state.clock_seconds + 15)\n    if name == \"scan\":\n        return replace(moved, scanned=True)\n    if name == \"capture\":\n        return within_budget(replace(moved, antimatter_ng=SAMPLE_NG, field_tesla=MAIN_FIELD_TESLA))\n    if name == \"dock\":\n        return replace(moved, delivered_ng=moved.antimatter_ng, antimatter_ng=0, field_tesla=0.0)\n    return within_budget(moved)\n\n\ndef _settle(state: FlightState, order: str, answer: FlightState | Refusal) -> FlightState:\n    \"\"\"Write the order into the log. A refusal changes nothing else but the alert.\"\"\"\n    if isinstance(answer, Refusal):\n        return replace(state, alert=answer.reason, log=state.log + ({\"order\": order, \"result\": \"refused\"},))\n    return replace(answer, alert=None, log=state.log + ({\"order\": order, \"result\": \"ok\"},))\n\n\ndef apply(state: FlightState, action: dict) -> FlightState:\n    \"\"\"The one function every change goes through. Mirrors the cockpit's reducer.\"\"\"\n    kind = action.get(\"type\")\n    if kind == \"START_PREFLIGHT\":\n        return replace(state, preflight_started=True)\n    if kind == \"ORDER\":\n        name = str(action.get(\"name\"))\n        return _settle(state, name, give_order(state, name))\n    if kind == \"SET_BURN\":\n        burn = str(action.get(\"burn\"))\n        return _settle(state, \"burn \" + burn, set_burn(state, burn))\n    return state\n\n\ndef replay(actions: list[dict]) -> FlightState:\n    \"\"\"Fly a mission again from the hangar, one action at a time.\"\"\"\n    state = FlightState()\n    for action in actions:\n        state = apply(state, action)\n    return state\n\n\ndef result_of(state: FlightState) -> str:\n    return \"Complete\" if state.phase == \"docked\" and state.delivered_ng == SAMPLE_NG else \"Incomplete\"\n", "09_app/main.py": "from fastapi import FastAPI\nfrom fastapi.middleware.cors import CORSMiddleware\n\nfrom . import config\nfrom .routers import auth, health, missions, pilots\n\napp = FastAPI(title=\"kestrel-control\", version=config.VERSION)\n\n# Only the cockpit's own address may call this API from a browser.\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[config.COCKPIT_ORIGIN],\n    allow_methods=[\"GET\", \"POST\"],\n    allow_headers=[\"Authorization\", \"Content-Type\", \"Idempotency-Key\"],\n)\n\napp.include_router(health.router)\napp.include_router(auth.router)\napp.include_router(pilots.router)\napp.include_router(missions.router)\n", "09_app/models.py": "from datetime import datetime\n\nfrom sqlalchemy import DateTime, ForeignKey, String, func\nfrom sqlalchemy.dialects.postgresql import JSONB\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column\n\n\nclass Base(DeclarativeBase):\n    pass\n\n\nclass Pilot(Base):\n    __tablename__ = \"pilots\"\n\n    id: Mapped[int] = mapped_column(primary_key=True)\n    callsign: Mapped[str] = mapped_column(String(30), unique=True)\n    email: Mapped[str] = mapped_column(unique=True)\n    hashed_password: Mapped[str | None]\n    grade: Mapped[str | None] = mapped_column(String(20))\n    clearance: Mapped[int] = mapped_column(default=1)\n    role: Mapped[str] = mapped_column(default=\"pilot\")\n    joined_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())\n\n\n# The table is called sorties. Screens and the API call them missions.\nclass Sortie(Base):\n    __tablename__ = \"sorties\"\n\n    id: Mapped[int] = mapped_column(primary_key=True)\n    pilot_id: Mapped[int] = mapped_column(ForeignKey(\"pilots.id\"), index=True)\n    mission: Mapped[str] = mapped_column(String(40))\n    launched_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())\n    code: Mapped[str] = mapped_column(unique=True)\n    result: Mapped[str]\n    delivered_ng: Mapped[int]\n    order_log: Mapped[list] = mapped_column(JSONB)\n    idempotency_key: Mapped[str | None] = mapped_column(unique=True)\n", "09_app/routers/__init__.py": "", "09_app/routers/auth.py": "from typing import Annotated\n\nfrom fastapi import APIRouter, Depends, HTTPException, status\nfrom fastapi.security import OAuth2PasswordRequestForm\nfrom pydantic import BaseModel\nfrom sqlalchemy import select\n\nfrom ..db import SessionDep\nfrom ..models import Pilot\nfrom ..security import make_token, password_hash\n\nrouter = APIRouter(tags=[\"sign-in\"])\n\n\nclass Token(BaseModel):\n    access_token: str\n    token_type: str\n\n\n@router.post(\"/token\")\ndef sign_in(form: Annotated[OAuth2PasswordRequestForm, Depends()], session: SessionDep) -> Token:\n    pilot = session.scalar(select(Pilot).where(Pilot.email == form.username))\n    if not pilot or not pilot.hashed_password or not password_hash.verify(form.password, pilot.hashed_password):\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail=\"Wrong email or password\",\n            headers={\"WWW-Authenticate\": \"Bearer\"},\n        )\n    return Token(access_token=make_token(pilot), token_type=\"bearer\")\n", "09_app/routers/health.py": "from fastapi import APIRouter, Response\nfrom sqlalchemy import text\nfrom sqlalchemy.exc import SQLAlchemyError\n\nfrom .. import config\nfrom ..db import SessionDep\n\nrouter = APIRouter(tags=[\"health\"])\n\n\n@router.get(\"/healthz\")\ndef healthz():\n    return {\"status\": \"ok\"}\n\n\n@router.get(\"/readyz\")\ndef readyz(session: SessionDep, response: Response):\n    try:\n        session.execute(text(\"SELECT 1\"))\n    except SQLAlchemyError:\n        response.status_code = 503\n        return {\"status\": \"not ready\", \"failed\": \"database\"}\n    return {\"status\": \"ready\"}\n\n\n@router.get(\"/version\")\ndef version():\n    return {\"version\": config.VERSION}\n\n\n@router.get(\"/status\")\ndef read_status():\n    return {\"frame\": \"KF-07 Kestrel Mk II\", \"mission\": \"Aster retrieval\"}\n", "09_app/routers/missions.py": "from datetime import datetime\nfrom typing import Annotated, Literal\n\nfrom fastapi import APIRouter, Header, HTTPException, Query\nfrom pydantic import BaseModel, ConfigDict, Field\nfrom sqlalchemy import func, select\n\nfrom .. import flight\nfrom ..db import SessionDep\nfrom ..models import Sortie\nfrom ..security import CurrentPilot\n\nrouter = APIRouter(prefix=\"/missions\", tags=[\"missions\"])\n\n\n# One thing the pilot did. The cockpit sends exactly these three shapes.\nclass Action(BaseModel):\n    type: Literal[\"START_PREFLIGHT\", \"ORDER\", \"SET_BURN\"]\n    name: str | None = None\n    burn: str | None = None\n\n\n# What the browser believes happened. The cockpit writes deliveredNg, so the\n# alias lets it arrive under that name while Python keeps snake_case.\nclass Claim(BaseModel):\n    phase: str\n    delivered_ng: int = Field(alias=\"deliveredNg\")\n\n\nclass MissionReport(BaseModel):\n    mission: Literal[\"Aster retrieval\"]\n    actions: list[Action] = Field(max_length=500)\n    claim: Claim\n\n\nclass MissionPublic(BaseModel):\n    model_config = ConfigDict(from_attributes=True)\n\n    code: str\n    mission: str\n    launched_at: datetime\n    result: str\n    delivered_ng: int\n\n\nclass MissionPage(BaseModel):\n    data: list[MissionPublic]\n    next_cursor: str | None\n\n\n@router.post(\"\", response_model=MissionPublic, status_code=201)\ndef record_mission(\n    report: MissionReport,\n    pilot: CurrentPilot,\n    session: SessionDep,\n    idempotency_key: Annotated[str | None, Header(max_length=100)] = None,\n):\n    # A retry with the same key gets the mission that was already recorded.\n    if idempotency_key:\n        seen = session.scalar(\n            select(Sortie).where(Sortie.idempotency_key == idempotency_key, Sortie.pilot_id == pilot.id)\n        )\n        if seen:\n            return seen\n\n    # Never trust the claim: fly the actions again through the server's own rules.\n    state = flight.replay([a.model_dump() for a in report.actions])\n    if (state.phase, state.delivered_ng) != (report.claim.phase, report.claim.delivered_ng):\n        raise HTTPException(\n            status_code=422,\n            detail=f\"The order log does not replay to the claimed result: \"\n            f\"the server ends {state.phase} with {state.delivered_ng} ng delivered\",\n        )\n\n    # The pilot comes from the token, and the result from the replay.\n    last = session.scalar(select(func.max(Sortie.code))) or \"M-000\"\n    row = Sortie(\n        pilot_id=pilot.id,\n        mission=report.mission,\n        code=f\"M-{int(last[2:]) + 1:03d}\",\n        result=flight.result_of(state),\n        delivered_ng=state.delivered_ng,\n        order_log=list(state.log),\n        idempotency_key=idempotency_key,\n    )\n    session.add(row)\n    session.commit()\n    session.refresh(row)\n    return row\n\n\n@router.get(\"\", response_model=MissionPage)\ndef list_missions(\n    pilot: CurrentPilot,\n    session: SessionDep,\n    limit: Annotated[int, Query(ge=1, le=100)] = 25,\n    cursor: Annotated[str | None, Query(pattern=r\"^\\d+$\")] = None,\n):\n    query = select(Sortie).where(Sortie.id > int(cursor or 0)).order_by(Sortie.id).limit(limit + 1)\n    if pilot.role != \"tech\":\n        query = query.where(Sortie.pilot_id == pilot.id)\n    rows = session.scalars(query).all()\n    data = rows[:limit]\n    return {\"data\": data, \"next_cursor\": str(data[-1].id) if len(rows) > limit else None}\n\n\n# mission_id is the mission's code, the number shown in the log, such as M-058.\n@router.get(\"/{mission_id}\", response_model=MissionPublic)\ndef read_mission(mission_id: str, pilot: CurrentPilot, session: SessionDep):\n    row = session.scalar(select(Sortie).where(Sortie.code == mission_id))\n    if not row:\n        raise HTTPException(status_code=404, detail=\"No such mission\")\n    if pilot.role != \"tech\" and row.pilot_id != pilot.id:\n        raise HTTPException(status_code=403, detail=\"Not your mission\")\n    return row\n", "09_app/routers/pilots.py": "from typing import Annotated\n\nfrom fastapi import APIRouter, Depends, HTTPException, Query\nfrom pydantic import BaseModel, ConfigDict, Field\nfrom sqlalchemy import select\nfrom sqlalchemy.exc import IntegrityError\n\nfrom ..db import SessionDep\nfrom ..models import Pilot\nfrom ..security import CurrentPilot, password_hash, require_tech\n\nrouter = APIRouter(prefix=\"/pilots\", tags=[\"pilots\"])\n\n\nclass PilotCreate(BaseModel):\n    callsign: str = Field(min_length=2, max_length=30)\n    email: str\n    password: str = Field(min_length=8)\n    clearance: int = Field(default=1, ge=1)\n    grade: str | None = Field(default=None, max_length=20)\n\n\nclass PilotPublic(BaseModel):\n    model_config = ConfigDict(from_attributes=True)\n\n    id: int\n    callsign: str\n    grade: str | None\n    clearance: int\n    role: str\n\n\nclass PilotPage(BaseModel):\n    data: list[PilotPublic]\n    next_cursor: str | None\n\n\n# Declared before /{pilot_id}, or \"me\" would be read as a pilot id.\n@router.get(\"/me\", response_model=PilotPublic)\ndef read_me(pilot: CurrentPilot):\n    return pilot\n\n\n@router.get(\"\", response_model=PilotPage, dependencies=[Depends(require_tech)])\ndef list_pilots(\n    session: SessionDep,\n    limit: Annotated[int, Query(ge=1, le=100)] = 25,\n    cursor: Annotated[str | None, Query(pattern=r\"^\\d+$\")] = None,\n):\n    rows = session.scalars(\n        select(Pilot).where(Pilot.id > int(cursor or 0)).order_by(Pilot.id).limit(limit + 1)\n    ).all()\n    data = rows[:limit]\n    return {\"data\": data, \"next_cursor\": str(data[-1].id) if len(rows) > limit else None}\n\n\n@router.post(\"\", response_model=PilotPublic, status_code=201, dependencies=[Depends(require_tech)])\ndef enlist_pilot(pilot: PilotCreate, session: SessionDep):\n    fields = pilot.model_dump(exclude={\"password\"})\n    row = Pilot(**fields, hashed_password=password_hash.hash(pilot.password))\n    session.add(row)\n    try:\n        session.commit()\n    except IntegrityError:\n        session.rollback()\n        raise HTTPException(status_code=409, detail=\"Callsign already taken\")\n    session.refresh(row)\n    return row\n\n\n@router.get(\"/{pilot_id}\", response_model=PilotPublic)\ndef read_pilot(pilot_id: int, me: CurrentPilot, session: SessionDep):\n    if me.role != \"tech\" and me.id != pilot_id:\n        raise HTTPException(status_code=403, detail=\"Hangar techs only\")\n    row = session.get(Pilot, pilot_id)\n    if not row:\n        raise HTTPException(status_code=404, detail=\"No such pilot\")\n    return row\n", "09_app/security.py": "from datetime import datetime, timedelta, timezone\nfrom typing import Annotated\n\nimport jwt\nfrom fastapi import Depends, HTTPException, status\nfrom fastapi.security import OAuth2PasswordBearer\nfrom jwt.exceptions import InvalidTokenE const FLIGHT=(()=>{
  const BUDGET=25,LOADS={flight_computer:1,navigation:1,sensors:2,containment:6,cruise:9,sprint:21};
  const TEXT={hangar:'parked in Hangar 7',transit:'in transit to gate-alpha',aster:'in the Aster system',trap:'holding off the trap station',captured:'holding off the trap station, sample aboard',return:'homebound from gate-alpha',docked:'docked in Hangar 7'};
  const ORDERS={launch:{hangar:'transit'},align:{transit:'transit',return:'return'},jump:{transit:'aster',captured:'return'},approach:{aster:'trap'},scan:{trap:'trap'},capture:{trap:'captured'},hold:{captured:'captured',return:'return'},trim:{transit:'transit',aster:'aster',trap:'trap',captured:'captured',return:'return'},dock:{return:'docked'}};
  const init=()=>({phase:'hangar',burn:'cruise',preflight_started:false,scanned:false,antimatter_ng:0,field_tesla:0,delivered_ng:0,clock_seconds:0,log:[],alert:null});
  const draw=s=>4+(s.antimatter_ng>0?6:0)+(s.phase==='hangar'||s.phase==='docked'?0:LOADS[s.burn]);
  const within=s=>{const d=draw(s);return d>BUDGET?{refused:'power request denied: over budget (budget '+BUDGET+' kW, asked '+d+' kW)'}:s;};
  const setBurn=(s,b)=>b!=='cruise'&&b!=='sprint'?{refused:'unknown burn profile: '+b}:within(Object.assign({},s,{burn:b}));
  function give(s,n){
    if(!Object.prototype.hasOwnProperty.call(ORDERS,n))return {refused:'unknown order: '+n};
    const to=ORDERS[n][s.phase];
    if(to===undefined)return {refused:'cannot '+n+': the Kestrel is '+TEXT[s.phase]};
    if(n==='launch'&&!s.preflight_started)return {refused:'cannot launch: no preflight has been started'};
    if(n==='capture'&&!s.scanned)return {refused:'cannot capture: scan the trap station first'};
    if(n==='dock'&&s.burn==='sprint')return {refused:'cannot dock at sprint burn: set the thrusters to cruise first'};
    const m=Object.assign({},s,{phase:to,clock_seconds:s.clock_seconds+15});
    if(n==='scan')return Object.assign(m,{scanned:true});
    if(n==='capture')return within(Object.assign(m,{antimatter_ng:40,field_tesla:5.2}));
    if(n==='dock')return Object.assign(m,{delivered_ng:m.antimatter_ng,antimatter_ng:0,field_tesla:0});
    return within(m);
  }
  const settle=(s,o,a)=>a.refused?Object.assign({},s,{alert:a.refused,log:s.log.concat([{order:o,result:'refused'}])}):Object.assign({},a,{alert:null,log:s.log.concat([{order:o,result:'ok'}])});
  function apply(s,a){
    if(a.type==='START_PREFLIGHT')return Object.assign({},s,{preflight_started:true});
    if(a.type==='ORDER'){const n=String(a.name);return settle(s,n,give(s,n));}
    if(a.type==='SET_BURN'){const b=String(a.burn);return settle(s,'burn '+b,setBurn(s,b));}
    return s;
  }
  const replay=actions=>actions.reduce(apply,init());
  const resultOf=s=>s.phase==='docked'&&s.delivered_ng===40?'Complete':'Incomplete';
  return {replay,resultOf,draw,TEXT,apply,init};
})();

function missionReport(req,errs){
  const E=(type,loc,msg,input,ctx)=>{const e={type,loc:['body'].concat(loc),msg,input};if(ctx)e.ctx=ctx;errs.push(e);};
  let j;
  if(req.body==null||req.body===''){E('missing',[],'Field required',null);return;}
  try{j=JSON.parse(req.body);}catch(e){errs.push({type:'json_invalid',loc:['body',0],msg:'JSON decode error',input:{},ctx:{error:'Expecting value'}});return;}
  if(j===null||typeof j!=='object'||Array.isArray(j)){E('model_attributes_type',[],'Input should be a valid dictionary or object to extract fields from',j);return;}
  if(!('mission' in j))E('missing',['mission'],'Field required',j);
  else if(j.mission!=='Aster retrieval')E('literal_error',['mission'],"Input should be 'Aster retrieval'",j.mission,{expected:"'Aster retrieval'"});
  if(!('actions' in j))E('missing',['actions'],'Field required',j);
  else if(!Array.isArray(j.actions))E('list_type',['actions'],'Input should be a valid list',j.actions);
  else j.actions.forEach((a,i)=>{
    if(a===null||typeof a!=='object'){E('model_attributes_type',['actions',i],'Input should be a valid dictionary or object to extract fields from',a);return;}
    if(!('type' in a))E('missing',['actions',i,'type'],'Field required',a);
    else if(!['START_PREFLIGHT','ORDER','SET_BURN'].includes(a.type))E('literal_error',['actions',i,'type'],"Input should be 'START_PREFLIGHT', 'ORDER' or 'SET_BURN'",a.type,{expected:"'START_PREFLIGHT', 'ORDER' or 'SET_BURN'"});
  });
  const c=j.claim;
  if(!('claim' in j))E('missing',['claim'],'Field required',j);
  else if(c===null||typeof c!=='object')E('model_attributes_type',['claim'],'Input should be a valid dictionary or object to extract fields from',c);
  else{
    if(typeof c.phase!=='string')E(c.phase===undefined?'missing':'string_type',['claim','phase'],c.phase===undefined?'Field required':'Input should be a valid string',c.phase===undefined?c:c.phase);
    if(!Number.isInteger(c.deliveredNg))E(c.deliveredNg===undefined?'missing':'int_type',['claim','deliveredNg'],c.deliveredNg===undefined?'Field required':'Input should be a valid integer',c.deliveredNg===undefined?c:c.deliveredNg);
  }
  return j;
}

  function tokens(line){
    const t=[];let cur='',q=null,has=false,amp=false;

      if(c==='"'||c==="'"){q=c;has=true;continue;}
      if(c==='\\'&&i+1<line.length){cur+=line[++i];has=true;continue;}
      if(c==='&'&&line[i+1]!=='&')amp=true;
      if(/\s/.test(c)){if(cur||has){t.push(cur);cur='';has=false;}continue;}
      cur+=c;has=true;}
    if(q)return {err:'quote'};
    if(cur||has)t.push(cur);
    return {t,amp};
  }

{id:1,title:'What FastAPI is',mins:10,setup:'fresh',
idea:`
<p>The Kestrel simulator has two halves. The <strong>flight core</strong> runs in the pilot's browser and enforces the flight rules every second of a mission. <strong>Kestrel control</strong> runs on a server in Hangar 7 and does the three things a browser cannot be trusted with: it signs pilots in, keeps the roster, and keeps a mission log it can vouch for. In this guide you build Kestrel control.</p>
<p>Kestrel control is an <em>API</em>: a program that other programs talk to. The cockpit sends it a <em>request</em> ("record this mission") over the hangar downlink (HTTP) and gets back a <em>response</em>, almost always as JSON. It is also the only thing allowed to touch the database from the Postgres guide.</p>
<p><strong>FastAPI</strong> is the Python framework it is written in. You write ordinary Python functions and put type hints on their parameters. From those hints FastAPI works out how to read each request, how to reject a bad one, how to turn your return value into JSON, and how to document the whole API. You do not write any of that yourself.</p>
<dl class="terms">
<dt>Path operation</dt><dd>One thing the API can do: an HTTP method plus a path, such as <code>GET /pilots</code>. FastAPI's name for what other frameworks call a route or an endpoint. The requirements list every one Kestrel control must have, in [[API-01]].</dd>
<dt>Uvicorn</dt><dd>The server program that listens on a port, speaks HTTP, and calls your FastAPI code for each request. On the blueprint it is the comms mast. The <code>fastapi</code> command starts it for you.</dd>
<dt>Pydantic</dt><dd>The library that checks and converts data using Python type hints. FastAPI hands it every input.</dd>
<dt>Starlette</dt><dd>The lower-level web toolkit FastAPI is built on. You will see its name in error traces.</dd>
<dt>OpenAPI</dt><dd>A standard JSON description of an API. FastAPI generates it from your code, and the interactive documentation page at <code>/docs</code> is drawn from it.</dd>
<dt>uv</dt><dd>The tool the FastAPI documentation uses to create a project, install packages into it, and run commands inside it.</dd>
</dl>
<p>The mental model to keep: <strong>a request comes in, FastAPI checks it against your type hints, your function runs, and its return value goes back as JSON.</strong></p>`,

{id:2,title:'Path and query parameters',mins:10,setup:'l2',
idea:`
<p>A request carries its inputs in a few standard places. The two simplest are both inside the URL. This lesson uses them to read the squadron roster: Wren, Ibis, Heron and Ada.</p>
<dl class="terms">
<dt>Path parameter</dt><dd>A piece of the path itself: the <code>2</code> in <code>/pilots/2</code>. It identifies <em>which thing</em> you want. You declare it by putting a name in curly braces in the path, <code>"/pilots/{pilot_id}"</code>, and a parameter with the same name on the function.</dd>
<dt>Query parameter</dt><dd>A <code>name=value</code> pair after the question mark: <code>/pilots?limit=2</code>. It adjusts <em>how</em> you want the result: filtering, sorting, paging. Any function parameter that is not in the path is read from the query.</dd>
</dl>
<p>Here is the part that makes FastAPI different. Everything in a URL is text. When you write <code>pilot_id: int</code>, FastAPI converts the text <code>"2"</code> to the number <code>2</code> before your function sees it, and refuses the request if the text is not a number. The type hint is the validation, which is what [[API-05]] asks for.</p>
<pre class="file"><code>@app.get("/pilots")
def list_pilots(limit: int = 25, min_clearance: int = 1, grade: Grade | None = None):</code></pre>
<ul>
<li><code>limit: int = 25</code> has a default, so the client may leave it out.</li>
<li><code>grade: Grade | None = None</code> is optional and, when given, must be one of the values listed in the <code>Grade</code> enum.</li>
<li>A parameter with no default would be <strong>required</strong>.</li>
</ul>`,

notes:`<h2>Worth knowing</h2>
<ul>
<li><strong>Order matters.</strong> FastAPI tries path operations from top to bottom. Kestrel control has both <code>/pilots/me</code> and <code>/pilots/{pilot_id}</code>, so <code>/pilots/me</code> must be declared first, or "me" would be treated as a pilot id.</li>
<li>A query parameter the function does not declare is ignored.</li>
<li>For a <code>bool</code> parameter, <code>true</code>, <code>1</code>, <code>yes</code> and <code>on</code> all count as true.</li>
<li>Names in the URL and in JSON are <code>snake_case</code>, as [[API-17]] requires.</li>
</ul>`,

{id:3,title:'Request bodies and Pydantic',mins:12,setup:'l3',
idea:`
<p>A URL is fine for a few short values. To enlist a pilot, with a callsign, an email and a clearance, the client puts JSON in the <em>body</em> of the request. Later the cockpit will send a whole flown mission the same way. Bodies go with the methods that change things:</p>
<table class="types"><thead><tr><th>Method</th><th>Means</th><th>Typical path</th></tr></thead><tbody>
<tr><td><code>GET</code></td><td>Read. Never changes anything.</td><td><code>/pilots</code>, <code>/pilots/2</code></td></tr>
<tr><td><code>POST</code></td><td>Create a new thing.</td><td><code>/pilots</code>, <code>/missions</code></td></tr>
<tr><td><code>PUT</code></td><td>Replace a thing completely.</td><td><code>/pilots/2</code></td></tr>
<tr><td><code>PATCH</code></td><td>Change part of a thing.</td><td><code>/pilots/2</code></td></tr>
<tr><td><code>DELETE</code></td><td>Remove a thing.</td><td><code>/pilots/2</code></td></tr>
</tbody></table>
<p>You describe the JSON you expect with a <strong>Pydantic model</strong>: a class that lists the fields and their types. Use the model as the type of a function parameter and FastAPI does the rest: it reads the body, checks every field, converts what can be converted, and gives your function an object with real attributes, so <code>pilot.clearance</code> is an integer you can compare.</p>
<p>FastAPI decides where each parameter comes from by its type:</p>
<ul>
<li>named in the path → <strong>path</strong> parameter</li>
<li>a simple type such as <code>int</code> or <code>str</code> → <strong>query</strong> parameter</li>
<li>a Pydantic model → the JSON <strong>body</strong></li>
</ul>`,

{id:4,title:'Validation rules',mins:10,setup:'l4',
idea:`
<p>A type says <em>what kind</em> of value is acceptable. Usually you also want to say <em>which</em> values: a clearance of at least 1, a callsign that is not one letter long, a page size no larger than 100. FastAPI lets you attach such rules to the type hint, and enforces them the same way it enforces the type.</p>
<p>This is the first layer of the Kestrel's business logic on the server. The flight core's rule is "a screen may decide what to show; it may not decide what is allowed". The server's version is the same idea one step further out: <strong>the cockpit may check a form before sending it, but only Kestrel control decides what is accepted.</strong></p>
<p>The tool for attaching rules is <code>Annotated</code>, from Python's standard library. It wraps a type together with extra information:</p>
<pre class="file"><code>limit: Annotated[int, Query(ge=1, le=100)] = 25</code></pre>
<p>Read it as: <code>limit</code> is an <code>int</code>, with the note that it is a query parameter which must be at least 1 and at most 100, and it defaults to 25. Those are the numbers [[API-08]] sets for every list.</p>
<table class="types"><thead><tr><th>Where the value comes from</th><th>Use</th><th>Common rules</th></tr></thead><tbody>
<tr><td>Query string</td><td><code>Query(...)</code></td><td><code>min_length</code>, <code>max_length</code>, <code>pattern</code>, <code>ge</code>, <code>le</code></td></tr>
<tr><td>Path</td><td><code>Path(...)</code></td><td><code>ge</code>, <code>gt</code>, <code>le</code>, <code>lt</code></td></tr>
<tr><td>A field of a body model</td><td><code>Field(...)</code>, from Pydantic</td><td>all of the above, plus <code>description</code></td></tr>
</tbody></table>
<p><code>gt</code> is "greater than", <code>ge</code> is "greater than or equal", and <code>lt</code> and <code>le</code> are the same for "less".</p>
<p>The rules are checked on every request, and they are also written into the OpenAPI document. Your documentation and your validation cannot drift apart, because they are generated from the same line.</p>`,

notes:`<h2>Worth knowing</h2>

</ul>`,

{id:5,title:'Responses and errors',mins:10,setup:'l5',
idea:`
<p>So far FastAPI has checked what comes <em>in</em>. It can also control what goes <em>out</em>, and that matters just as much: the response is a promise to the cockpit and to every other client.</p>
<dl class="terms">
<dt>Response model</dt><dd>A Pydantic model that describes the response. Whatever your function returns is passed through it, and <strong>any field the model does not list is removed</strong>. This is how you make sure a password never leaves the server, even if the function returns the whole stored record. [[API-06]] requires one on every endpoint.</dd>
<dt>Status code</dt><dd>The three-digit number at the start of every response. Clients look at it before they look at the body, and the cockpit must show a different message for each kind.</dd>
<dt>HTTPException</dt><dd>What you <code>raise</code> to stop the function and send an error response with a status code and a message of your choosing.</dd>
</dl>
<p>The codes Kestrel control uses are fixed by [[API-07]]:</p>
<table class="types"><thead><tr><th>Code</th><th>Meaning</th><th>Who sends it</th></tr></thead><tbody>
<tr><td><code>200</code></td><td>OK</td><td>FastAPI, by default</td></tr>
<tr><td><code>201</code></td><td>Created</td><td>You, with <code>status_code=201</code> on a POST</td></tr>
<tr><td><code>204</code></td><td>Done, and there is no body</td><td>You, typically on a DELETE</td></tr>
<tr><td><code>401</code> / <code>403</code></td><td>Not signed in / signed in but not allowed</td><td>You (lesson 7)</td></tr>
<tr><td><code>404</code></td><td>No such thing</td><td>You, with <code>HTTPException</code></td></tr>
<tr><td><code>409</code></td><td>Conflict: it clashes with what is already there</td><td>You, for a callsign that is taken</td></tr>
<tr><td><code>422</code></td><td>The request failed validation</td><td>FastAPI, and you in lesson 10</td></tr>
<tr><td><code>500</code></td><td>The server has a bug</td><td>Nobody on purpose</td></tr>
</tbody></table>
<p>The first digit is the summary: 2 means it worked, 4 means the client did something wrong, 5 means the server did.</p>`,

</ul>`,

{id:6,title:'Dependencies',mins:10,setup:'l6',
idea:`
<p>As an API grows, the same needs turn up in one path operation after another: read the page size, open a database session, check who is calling. Copying that code into every function is how bugs are born. FastAPI's answer is <strong>dependency injection</strong>, which sounds grander than it is.</p>
<p>A <em>dependency</em> is just a function. You tell a path operation that it <em>depends on</em> that function, and FastAPI calls it first, on every request, and passes its result in. Think of it as the pre-call checks the hangar runs before a call is put through.</p>
<pre class="file"><code>def pagination(limit: Annotated[int, Query(ge=1, le=100)] = 25, cursor: ... = None):
    return {"limit": limit, "after": int(cursor or 0)}

@app.get("/pilots")
def list_pilots(page: Annotated[dict, Depends(pagination)]):
    ...</code></pre>
<p>Three things make this more useful than calling the function yourself:</p>
<ul>
<li>A dependency declares its inputs exactly as a path operation does. <code>pagination</code> asks for <code>limit</code> and <code>cursor</code>, so they become query parameters of every path that uses it, validated and documented.</li>
<li>A dependency can <code>raise HTTPException</code>, and then your function is never called. This is how access checks work.</li>
<li>Dependencies can depend on other dependencies, and FastAPI works out the order.</li>
</ul>
<p>The pagination here is the one [[API-08]] describes: the answer is <code>data</code> plus a <code>next_cursor</code>, and the client asks for the next page by sending that cursor back. The client never does arithmetic on it.</p>
<p>When a dependency only needs to run, and returns nothing useful, list it on the decorator instead: <code>@app.post("/pilots", dependencies=[Depends(require_hangar_key)])</code>.</p>`,

notes:`<h2>Worth knowing</h2>
<ul>
<li><strong>Dependencies with yield.</strong> A dependency can hand over a value with <code>yield</code> instead of <code>return</code>. The code after the <code>yield</code> runs once the response has been sent. This is the standard way to open something at the start of a request and be sure to close it at the end. Lesson 8 uses it for the database session, which is [[API-11]].</li>
<li>If a dependency is needed twice in one request, FastAPI calls it once and reuses the result.</li>
<li>A dependency can be attached to a whole router or the whole app. Lesson 9 shows where that goes.</li>
<li>One shared hangar key is a stepping stone. It cannot tell one pilot from another, so the next lesson replaces it with a sign-in.</li>
</ul>`,
