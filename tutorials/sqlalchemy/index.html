],
notes:`<h2>What autogenerate can and cannot see</h2>
<table class="types"><thead><tr><th>It detects</th><th>It cannot detect</th></tr></thead><tbody>
<tr><td>Tables added or removed</td><td>A table or column <strong>rename</strong>. It sees one thing removed and another added (lesson 9)</td></tr>
<tr><td>Columns added or removed</td><td>Anything about the <strong>data</strong>: whether existing rows fit a new rule (lesson 8)</td></tr>
<tr><td>A column changing between NULL and NOT NULL</td><td>Constraints that have no name, in some cases</td></tr>
<tr><td>Indexes, unique constraints and foreign keys, in the common cases</td><td>Changes you made by hand in the database that the models do not describe</td></tr>
<tr><td>Column type changes (in current versions)</td><td>Whether a type change is safe for the values stored</td></tr>
</tbody></table>
<p>The exact list moves between versions, so check the autogenerate page in the further reading for yours.</p>
<h2>Downgrade is for structure</h2>
<p>You reversed the sorties revision while the table was empty. Had it held rows, the downgrade would have dropped them with it. Lesson 9 comes back to this.</p>
<h2>When two people add a revision at once</h2>
<p>If two branches each add a revision on top of the same parent, the chain forks and Alembic reports "multiple heads". The fix is <code>alembic merge heads</code>, or simpler: after merging the other branch, regenerate your revision so it sits on top of theirs.</p>
<h2>Relationships and query count</h2>
<p><code>pilot.sorties</code> runs a query the first time you touch it (lazy loading). Do that in a loop over 100 pilots and you have sent 101 queries. When you know you need the related rows, ask for them up front: <code>select(Pilot).options(selectinload(Pilot.sorties))</code>.</p>`,
quiz:[
{q:'After --autogenerate writes a revision, what should you do before upgrade?',opts:['Nothing, it is always right','Open the file and read it','Delete downgrade()','Restart Postgres'],a:1,why:'Autogenerate is a draft. It sees structure, not intent, and the next two lessons show it getting things wrong.'},
{q:'What does relationship() add to the database?',opts:['A foreign key column','An index','Nothing. It is a Python-side convenience built on an existing foreign key','A new table'],a:2,why:'ForeignKey makes the column and constraint. relationship only tells the ORM how to navigate between objects.'},
{q:'What is alembic check for?',opts:['Applying migrations','Failing loudly when models and database differ, without changing anything','Printing the history','Creating the alembic_version table'],a:1,why:'It is the drift detector. Run it in CI so a model change without a revision cannot be merged.'}],
reading:[
['Alembic: Operation Reference','https://alembic.sqlalchemy.org/en/latest/ops.html','Every op.* function a revision can call.'],
['SQLAlchemy: Basic Relationship Patterns','https://docs.sqlalchemy.org/en/20/orm/basic_relationships.html','One-to-many, many-to-one, one-to-one and many-to-many, each with the model code.'],
['Alembic: Working with Branches','https://alembic.sqlalchemy.org/en/latest/branches.html','What multiple heads are and how merge resolves them.']]},

{id:8,title:'A slot every pilot must have',mins:12,
idea:`
<p>New requirement: every pilot must have a <strong>clearance level</strong>, a whole number, and it may never be empty. In the blueprint:</p>
<pre class="file">clearance: Mapped[int] = mapped_column(default=1)</pre>
<p><code>Mapped[int]</code> without <code>| None</code> means NOT NULL. And here is the trap: <strong>there are already three pilots on file.</strong> The moment the column is added they have no clearance, which the column forbids. Postgres will refuse to create a rule that existing rows already break.</p>
<p>Note the <code>default=1</code>. From lesson 2: that is a Python-side default. It fills in the value when SQLAlchemy inserts a <em>new</em> pilot. It does nothing for rows that already exist, and it is not part of the table definition at all, so autogenerate does not write it into the migration.</p>
<p>The safe way to add a required column to a table that has rows is three moves in one refit order:</p>
<ol>
<li><strong>Expand.</strong> Add the column with empty values allowed.</li>
<li><strong>Backfill.</strong> Give every existing row a value.</li>
<li><strong>Contract.</strong> Now that no row is empty, tighten the rule to NOT NULL.</li>
</ol>
<p>Autogenerate cannot write this for you. It sees that a NOT NULL column is missing and drafts exactly that. Knowing what the existing rows should contain is a decision, and decisions are your half of the job.</p>`,
widget:'expand',widgetTitle:'Expand, backfill, contract',
widgetIntro:'Step through the three moves and watch what the pilots table looks like after each.',
labIntro:'This time the first draft fails, on purpose. Watch what the failure leaves behind: check the refit plate (P) and the flight recorder straight after it.',
tasks:[
{what:`File the new blueprint`,cmd:`cp drafts/models_clearance.py app/models.py`,parts:[['cp','Put the designer\'s edit in place: one new line on Pilot.']],
 saw:`Gantry locked. The blueprint has clearance, the table does not.`,test:(l,w,r)=>MODEL_V.get(w.files['app/models.py'])===4},
{what:`Draft the refit order`,cmd:AUTOGEN('add clearance'),parts:P_AUTOGEN,
 saw:`"Detected added column 'pilots.clearance'". Structurally correct.`,test:(l,w,r)=>r.meta.sub==='revision'&&w.revs.length>=3},
{what:`Review it`,cmd:`cat `+F3,parts:P_CAT('The drafted revision.'),
 saw:`One line: op.add_column(... nullable=False). No default, no mention of the three pilots already stored. Can you see what Postgres will say?`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path===F3},
{what:`Run it anyway`,cmd:`alembic upgrade head`,parts:P_UP,
 saw:`NotNullViolation: column "clearance" of relation "pilots" contains null values. Postgres refused the rule because three existing rows would break it.`,test:(l,w,r)=>r.meta.sub==='upgrade'&&r.meta.err==='NotNullViolation'},
{what:`Check what the failure left behind`,cmd:`alembic current`,parts:[['alembic current','Read the plate.']],
 saw:`Still ${R2}, and no "(head)": one order is waiting. The table is unchanged and so are the rows. Postgres runs schema changes inside a transaction, so a failed migration is undone completely. Not every database does this (MySQL does not).`,test:(l,w,r)=>r.meta.sub==='current'&&!r.meta.head&&r.meta.ver===R2},
{what:`Read the corrected order`,cmd:`cat drafts/add_clearance_safe.py`,parts:P_CAT('The same revision, rewritten by hand in three moves.'),
 saw:`add_column with nullable=True, then op.execute with an UPDATE that sets clearance to 1 where it is empty, then alter_column to nullable=False. Same revision id, same place in the chain.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path==='drafts/add_clearance_safe.py'},
{what:`Replace the draft with it`,cmd:`cp drafts/add_clearance_safe.py `+F3,parts:[['cp ... migrations/versions/...','Overwrite the generated file. Editing a revision is normal and expected, as long as it has not been applied anywhere yet. This one failed, so it has not.']],
 saw:`The revision file now holds the three-move version.`,test:(l,w,r)=>{const x=w.revs.find(q=>q.path===F3);return !!x&&x.ups.length===3;}},
{what:`Run it`,cmd:`alembic upgrade head`,parts:P_UP,
 saw:`It ran. The plate moved to ${R3} and the gantry released.`,test:(l,w,r)=>r.meta.sub==='upgrade'&&r.ok&&w.db.ver===R3},
{what:`Inspect the table`,cmd:`psql -c "\\d pilots"`,parts:[['\\d pilots','Describe the table.']],
 saw:`clearance: integer, not null. And the Default column is empty for it: the Python default=1 is nowhere in the database, as promised.`,test:(l,w,r)=>r.meta.q==='d'&&r.meta.table==='pilots'},
{what:`Inspect the rows`,cmd:`psql -c "SELECT * FROM pilots"`,parts:[['SELECT * FROM pilots','Every row, every column.']],
 saw:`Three pilots, ranks intact, each with clearance 1. A required column was added to a table with data, and nothing was lost.`,test:(l,w,r)=>r.meta.q==='select'&&r.meta.table==='pilots'}
],
notes:`<h2>The one-line alternative: a server default</h2>
<p>If every existing row should get the same constant, you can let Postgres fill it in while adding the column:</p>
<pre class="file">op.add_column('pilots',
    sa.Column('clearance', sa.Integer(), nullable=False, server_default='1'))</pre>
<p>Postgres applies the default to existing rows, so NOT NULL is satisfied at once. To get this from autogenerate, put <code>server_default="1"</code> in the model. Use three moves when the value differs per row (computed from other columns, or looked up), and the one-liner when a constant will do.</p>
<h2>On large tables</h2>
<ul>
<li>A single UPDATE over millions of rows holds locks for a long time. Backfill in batches, often in a separate revision or a separate script.</li>
<li><code>SET NOT NULL</code> makes Postgres scan the whole table while blocking writes to it. On very large tables teams add a <code>CHECK (col IS NOT NULL) NOT VALID</code> constraint, validate it, then set NOT NULL.</li>
<li>None of that matters at three rows. Learn the three-move shape now, and read the Postgres ALTER TABLE notes before you first do it on a big table.</li>
</ul>
<h2>Expand and contract across deploys</h2>
<p>While a new version is rolling out (see <em>Cloud Deploy from Zero</em>), old and new application code run at the same time against one database. A migration that old code cannot live with will break it mid-deploy. The general pattern is the same three words stretched over several releases: <strong>expand</strong> the schema in a way old code tolerates, deploy code that uses the new shape, then <strong>contract</strong> in a later release. Fowler calls it parallel change.</p>`,
quiz:[
{q:'Why did adding a NOT NULL column fail?',opts:['Integers cannot be NOT NULL','The existing rows would have had no value, breaking the rule immediately','Alembic was misconfigured','The table was locked'],a:1,why:'A new column starts empty in every existing row. NOT NULL forbids empty, so Postgres refuses.'},
{q:'After the failed upgrade, what state was the database in?',opts:['Half migrated','Exactly as before: Postgres rolled the whole migration back','The column existed but was empty','The plate had moved forward'],a:1,why:'Postgres supports transactional DDL and Alembic runs the upgrade in one transaction.'},
{q:'The model says mapped_column(default=1). What does that do for rows already in the table?',opts:['Sets them to 1','Sets them to 1 on the next commit','Nothing. It applies only when SQLAlchemy inserts new rows','Adds DEFAULT 1 to the table'],a:2,why:'default= lives in Python. Existing rows, and the table definition, never hear of it. server_default= is the database-side one.'}],
reading:[
['Parallel Change (Martin Fowler)','https://martinfowler.com/bliki/ParallelChange.html','Expand, migrate, contract: the general pattern for changing anything that has live users.'],
['PostgreSQL: ALTER TABLE','https://www.postgresql.org/docs/current/sql-altertable.html','The reference, including the Notes section on which changes rewrite or scan the table and what they lock.'],
['Alembic Operation Reference: execute','https://alembic.sqlalchemy.org/en/latest/ops.html#alembic.operations.Operations.execute','Running SQL inside a revision, which is how backfills are written.']]},

{id:9,title:'Rename without wiping the recorder',mins:13,
idea:`
<p>The last change looks like the smallest. The squadron has decided that <code>rank</code> should be called <code>grade</code>. In the blueprint that is one word.</p>
<p>Think about what Alembic can see. It compares the blueprints with the suit and finds: a column called <code>grade</code> that is drawn but not built, and a column called <code>rank</code> that is built but not drawn. Nothing in either place says they are the same column. So the draft says: <strong>add grade, drop rank.</strong></p>
<p>That refit order is valid. It will run without an error or a warning. And when it has finished, every pilot's rank is gone, because <code>DROP COLUMN</code> deletes the values with the column.</p>
<p>In this lab you run it, on purpose, to see three things that are hard to believe until you have watched them:</p>
<ol>
<li>A data-destroying migration can succeed silently.</li>
<li><code>alembic downgrade</code> puts the <em>column</em> back. It cannot put the <em>values</em> back. A downgrade restores structure, never data.</li>
<li>What brings data back is a <strong>backup</strong>, taken before the migration ran.</li>
</ol>
<p>Then you fix the draft. A rename is one operation, and it keeps every value:</p>
<pre class="file">op.alter_column('pilots', 'rank', new_column_name='grade')</pre>`,
labIntro:'Watch the reactor ring (R, the flight recorder) and the rank column in the pilots table at the bottom. The file backups/ranks.sql stands in for last night\'s backup.',
tasks:[
{what:`File the new blueprint`,cmd:`cp drafts/models_grade.py app/models.py`,parts:[['cp','The designer\'s edit: the attribute rank is now called grade.']],
 saw:`Gantry locked, with two differences listed: grade is drawn but not built, rank is built but not drawn.`,test:(l,w,r)=>MODEL_V.get(w.files['app/models.py'])===5},
{what:`Draft the refit order`,cmd:AUTOGEN('rename rank to grade'),parts:P_AUTOGEN,
 saw:`Read the two INFO lines: "Detected added column 'pilots.grade'" and "Detected removed column 'pilots.rank'". Your message says rename. The tech heard add and remove.`,test:(l,w,r)=>r.meta.sub==='revision'&&w.revs.length>=4},
{what:`Review it`,cmd:`cat `+F4,parts:P_CAT('The drafted revision.'),
 saw:`op.add_column('pilots', grade ...) then op.drop_column('pilots', 'rank'). In a real review, this is where you stop. A drop_column in a draft is always a reason to stop and think.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path===F4},
{what:`Run it, to see what happens`,cmd:`alembic upgrade head`,parts:P_UP,
 saw:`No error. The plate moved, the gantry released, every check is green. And the reactor ring is red: three ranks were destroyed.`,test:(l,w,r)=>r.meta.sub==='upgrade'&&r.ok&&r.meta.lost>0},
{what:`Look at the damage`,cmd:`psql -c "SELECT * FROM pilots"`,parts:[['SELECT * FROM pilots','Every row, every column.']],
 saw:`A grade column, empty for every pilot. No rank column. Nothing in Alembic's output said so.`,test:(l,w,r)=>r.meta.q==='select'&&r.meta.table==='pilots'},
{what:`Try to undo it`,cmd:`alembic downgrade -1`,parts:[['alembic downgrade -1','Run this revision\'s downgrade(): add rank back, drop grade.']],
 saw:`The rank column is back, and it is empty. Downgrade rebuilt the slot. It has no idea what used to be stored in it.`,test:(l,w,r)=>r.meta.sub==='downgrade'&&r.ok&&w.db.ver===R3},
{what:`Restore the values from the backup`,cmd:`psql -f backups/ranks.sql`,parts:[['psql -f FILE','Run the SQL statements in a file.'],['backups/ranks.sql','Three UPDATE statements taken from last night\'s backup.']],
 saw:`UPDATE 1, three times. The ranks are back and the reactor ring is green. This only worked because a backup existed.`,test:(l,w,r)=>r.meta.q==='file'&&r.ok},
{what:`Replace the draft with a real rename`,cmd:`cp drafts/rename_rank_safe.py `+F4,parts:[['cp ... migrations/versions/...','Overwrite the drafted revision. It is not applied at the moment (you downgraded past it), so editing it is safe.']],
 saw:`The revision now contains one operation: alter_column with new_column_name.`,test:(l,w,r)=>{const x=w.revs.find(q=>q.path===F4);return !!x&&x.ups.length===1&&x.ups[0].op==='rename_column';}},
{what:`Run it`,cmd:`alembic upgrade head`,parts:P_UP,
 saw:`Plate at ${R4}, gantry released, and this time the reactor stayed green.`,test:(l,w,r)=>r.meta.sub==='upgrade'&&r.ok&&w.db.ver===R4&&!r.meta.lost},
{what:`Read the roster through the ORM`,cmd:`python scripts/roster.py`,parts:P_PY('roster','The script from lesson 3, unchanged. It prints whatever columns the model has.'),
 saw:`captain, lieutenant, ensign, now under the key grade. Same values, new name.`,test:(l,w,r)=>r.meta.script==='roster'&&r.ok},
{what:`Confirm nothing is out of step`,cmd:`alembic check`,parts:[['alembic check','The drift detector.']],
 saw:`"No new upgrade operations detected." Blueprints, log and suit agree.`,test:(l,w,r)=>r.meta.sub==='check'&&r.meta.drift===0},
{what:`Ask the API one last time`,cmd:`curl -s `+API,parts:[['curl -s '+API,'The endpoint from lesson 4.']],
 saw:`Three pilots, id and callsign, exactly as before. Two columns were added and one renamed underneath it, and the API's contract (PilotOut) never moved.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===200}
],
notes:`<h2>Changes that can destroy data</h2>
<table class="types"><thead><tr><th>Change</th><th>What autogenerate drafts</th><th>What to do</th></tr></thead><tbody>
<tr><td>Rename a column</td><td>add_column + drop_column</td><td>Replace with <code>op.alter_column(..., new_column_name=...)</code></td></tr>
<tr><td>Rename a table</td><td>create_table + drop_table</td><td>Replace with <code>op.rename_table(old, new)</code></td></tr>
<tr><td>Remove a column or table</td><td>drop_column / drop_table (correct)</td><td>Be sure nothing reads it, and that a backup exists. Often done one release after the code stops using it</td></tr>
<tr><td>Add a required column</td><td>add_column nullable=False</td><td>Expand, backfill, contract, or a server_default (lesson 8)</td></tr>
<tr><td>Change a column's type</td><td>alter_column type_=...</td><td>Check every stored value converts. Postgres may need a <code>USING</code> expression (<code>postgresql_using=</code>)</td></tr>
<tr><td>Add a unique constraint</td><td>create_unique_constraint</td><td>Find and resolve existing duplicates first, or it fails</td></tr>
</tbody></table>
<h2>A renamed column and running code</h2>
<p>A rename keeps the data and still breaks any running code that uses the old name. During a rolling deploy, old code is running. For a busy production system the careful route is expand and contract again: add the new column, write to both, backfill, switch reads, and drop the old column in a later release.</p>
<h2>Migrations in the deploy routine</h2>
<p>Tying this to <em>Cloud Deploy from Zero</em> and <em>CI from Zero</em>:</p>
<ol>
<li><strong>In CI</strong>, on every pull request: start an empty Postgres, run <code>alembic upgrade head</code> (proves the whole chain runs from nothing), then <code>alembic check</code> (proves no model change is missing its revision).</li>
<li><strong>Before a release that migrates</strong>, take a backup (<code>pg_dump</code>, or your provider's snapshot) and know how you would restore it.</li>
<li><strong>In the deploy script</strong>, run <code>alembic upgrade head</code> once, before the new application version starts taking traffic. With Docker Compose that is one extra line: <code>docker compose run --rm control alembic upgrade head</code>. On Kubernetes it is usually a Job or an init container.</li>
<li><strong>Never</strong> edit a revision that has been applied to a shared database. Write a new one. You edited drafts in this guide only because they had not been applied.</li>
<li><strong>Never</strong> run <code>create_all</code>, <code>drop_all</code> or hand-typed ALTER TABLE against a migrated database. The plate would no longer describe the suit.</li>
</ol>
<h2>Where to go next</h2>
<p>The cheat sheet has every command from the nine lessons, and its sandbox is the finished project for free play. Try <code>alembic downgrade base</code> followed by <code>alembic upgrade head</code> and watch the whole chain run.</p>`,
quiz:[
{q:'You rename an attribute in a model and autogenerate. What does the draft contain?',opts:['A rename operation','An add_column and a drop_column','Nothing','A new table'],a:1,why:'Alembic compares names. It cannot know the removed column and the added one are the same thing.'},
{q:'A migration dropped a column that had data. You run alembic downgrade -1. What do you get?',opts:['The column and its data','The column, empty','An error','A backup file'],a:1,why:'Downgrade reverses structure. The values were deleted and Alembic never had a copy.'},
{q:'A revision has already been applied in production and you find a mistake in it. What do you do?',opts:['Edit the file and redeploy','Delete the file','Write a new revision that corrects it','Run create_all'],a:2,why:'An applied revision is history: databases that have run it will never run it again. Corrections go in a new revision on top.'}],
reading:[
['Alembic: What does Autogenerate Detect (and what does it not Detect?)','https://alembic.sqlalchemy.org/en/latest/autogenerate.html#what-does-autogenerate-detect-and-what-does-it-not-detect','The authoritative list, including the note that renames are seen as an add and a drop.'],
['PostgreSQL: pg_dump','https://www.postgresql.org/docs/current/app-pgdump.html','The standard backup tool. Read it before your first production migration.'],
['Alembic: Generating SQL Scripts (Offline Mode)','https://alembic.sqlalchemy.org/en/latest/offline.html','The --sql mode in full, for teams where migrations are reviewed or applied as SQL.']]}
];
