<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQLAlchemy + Alembic from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Shared guide engine styles, then this guide's additions at the end. Layout idea: lesson on the left; on the right a live schematic of the Kestrel (the database, its tables, rows and migration state) above a terminal that changes it. One dark terminal world; on phones the map-and-terminal bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:attr(data-p) " ";color:var(--term-dim)}
.ran::before{content:attr(data-p) " ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-tables{border-top-color:var(--good)}.z-session{border-top-color:var(--accent)}.z-databases{border-top-color:var(--warn)}.z-roles{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-tables .zlist{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}

.wcards{display:flex;flex-direction:column;gap:10px}
.wcard{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.wcard>code{overflow-wrap:anywhere;font-size:.8rem;color:var(--good)}
.wcard .caption{font-size:.88rem}
.wtrack{position:relative;height:18px;background:var(--sunk);border-radius:2px;margin:0 6px}
.wtrack i{position:absolute}
.wtrack .upd{top:-2px;bottom:-2px;width:2px;background:var(--good)}
.wtrack .chk{top:5px;width:8px;height:8px;border-radius:50%;margin-left:-4px}
.chk.n{background:var(--bad)}.chk.y{background:var(--good);box-shadow:0 0 0 2px var(--sunk)}
.notes table.types code{white-space:nowrap}
.widget .bw-page{max-height:none}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}

/* ---- CI guide additions ---- */
:root{--accent:#a78bfa;--accent-ink:#150a33;--accent-soft:#251d44}
.prose code,.task code,.explain code,.saw code{color:#cfc0ff}
.z-git{border-top-color:var(--accent)}
.pz .z-run{border-bottom:0}
.xsteps li.going::before{content:"\25B8";color:var(--warn)}
.xsteps li.wait::before{content:"\00B7";color:var(--muted)}
.xsteps li.going code{color:var(--warn)}
.xsteps li.wait code,.xsteps li.skip code{color:var(--muted)}
.xsteps{margin:0 0 4px 22px}
.tm.passed,.tm.failed,.tm.running,.tm.queued{line-height:1.5}
.rbody{white-space:pre-wrap;overflow-wrap:anywhere;max-height:210px}
.runlist{max-height:96px}
.crow{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line);font:400 .76rem/1.4 var(--mono)}
.crow:last-child{border-bottom:0}
.crow .sha{color:var(--warn)}
.crow .cmsg{flex:1 1 12ch;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.crow .sub{flex-basis:auto}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.pdot.warn{background:var(--warn)}
.z-git .kv{gap:4px}
.z-git .zlist{gap:10px}
.lane .track{height:18px}
.lanes .lane span{overflow-wrap:anywhere}
.widget .segs{flex-wrap:wrap}
.pl .d{color:var(--accent)}
.prose ol{padding-left:22px;margin:0 0 12px}
.z-steps .tr b{font-size:.8rem}

.jobs{display:flex;flex-wrap:wrap;gap:4px}
.jtab{display:flex;align-items:center;gap:6px;font:500 .74rem var(--mono);padding:3px 9px 3px 4px;border-radius:3px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.jtab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.strip{border-top:1px solid var(--line)}
.strip .zone{border-top:0;border-right:0;padding:8px 12px;gap:6px}
.strip .zsub{display:none}
.strip h3{font-size:.7rem;color:var(--muted)}
.strip .zlist{flex-direction:row;flex-wrap:wrap;gap:6px 18px}
.strip .kv .empty{font:400 .75rem var(--mono)}
@media (min-width:1040px){
  .map{display:flex;flex-direction:column;overflow:hidden;max-height:66%}
  .map>.pz{flex:1 1 auto;min-height:0;overflow:auto}
  .map>.strip{flex:none;max-height:36%;overflow:auto}
}
/* ---- NGINX guide additions ---- */
:root{--accent:#22d3ee;--accent-ink:#031a1f;--accent-soft:#0c2b33}
.prose code,.task code,.explain code,.saw code{color:#a5ecf7}
.pl .d{color:var(--accent)}.pl .k{color:#ffb86b}
.z-path{border-top-color:var(--good)}.z-reactor{border-top-color:var(--warn)}
.pz .z-path{border-bottom:0}
.pycode{max-height:330px}
.gate{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.arrowr{align-self:center;color:var(--muted);font:500 1rem var(--mono)}
.node{flex:1 1 120px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.node b{font:500 .8rem var(--mono)}
.node.on{border-color:var(--accent)}
.node.off{opacity:.55;border-style:dashed}
.node.bad{animation:refuse .5s}
@keyframes refuse{20%,60%{border-color:var(--bad);background:var(--bad-soft)}}
.lanes2{display:flex;flex-direction:column;gap:5px}
.ln{display:grid;grid-template-columns:minmax(26px,.32fr) minmax(0,2.4fr);align-items:center}
.ltrack{position:relative;height:2px;background:var(--accent)}
.ln.unwired .ltrack{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
.pkt{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);opacity:0;animation:fly .55s ease-in forwards}
.pkt.hit{background:var(--good);box-shadow:0 0 6px var(--good)}
.pkt.limit{background:var(--bad);box-shadow:0 0 6px var(--bad)}
@keyframes fly{0%{left:0;opacity:1}90%{opacity:1}100%{left:calc(100% - 10px);opacity:0}}
.ccard{border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;background:var(--sunk);padding:5px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ccard b{font:500 .82rem var(--mono)}
.ccard.up{border-left-color:var(--good)}
.ccard.down{border-left-color:var(--bad);opacity:.7}
.ccard.over{border-left-color:var(--bad)}
.ccard.spec{border-left-color:var(--accent);border-style:dashed;border-left-style:solid}
.ccard.glow{animation:glow .9s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--accent)}35%{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.ccard .sub,.node .sub{flex-basis:auto}
.lbar{height:6px;border-radius:2px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--good);transition:width .4s}
.lbar.over i{background:var(--bad)}
.strip .z-reactor .zlist{align-items:flex-end}
.kv.grow{flex:1 1 220px}
.gauge{position:relative;flex:1 1 120px;min-width:100px;height:12px;border-radius:2px;background:var(--sunk);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--good);transition:width .5s}
.gauge.over i{background:var(--bad)}
.gauge em{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--warn)}
.kv b.hot{color:var(--bad)}
.kv .row{flex-wrap:nowrap}
.pill.re{white-space:nowrap}
@media (min-width:1040px){.map{max-height:68%}}
@media (prefers-reduced-motion:reduce){.pkt{animation:none}.ccard.glow,.node.bad{animation:none}}

/* the Kestrel load map */
.duo2{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:start}
@media (min-width:720px){.duo2{grid-template-columns:minmax(170px,.82fr) minmax(0,1.18fr)}.kfig{position:sticky;top:0}}
.kfig{border:1px solid var(--line);border-radius:4px;padding:2px;min-width:0;background:linear-gradient(var(--term-line) 1px,transparent 1px) 0 0/100% 20px,linear-gradient(90deg,var(--term-line) 1px,transparent 1px) 0 0/20px 100%,var(--term)}
.kfig svg{display:block;width:100%;height:auto;max-height:340px;margin:0 auto;overflow:visible}
.kes .pl{fill:var(--lf,#121a22);stroke:var(--ls,#52697b);stroke-width:1.4;stroke-linejoin:round;transition:fill .6s,stroke .6s}
.kes .ln{fill:none;stroke:#3d5263;stroke-width:1}
.kes .nd.dark .pl{stroke-dasharray:4 3}
.kes .nd.skip .pl{stroke:var(--warn);stroke-dasharray:7 3}
.kes .nd.hot .pl{animation:hot .5s ease-in-out 4 alternate}
@keyframes hot{to{fill:rgba(255,123,114,.85)}}
.kes .nd.aux{opacity:.28;transition:opacity .6s}
.kes .nd.aux.used{opacity:1}
.kes .nd.head .pl{stroke:var(--accent)}
.kes .reactor .ring{fill:none;stroke:var(--good);stroke-width:2.2}
.kes .reactor .glow{fill:var(--good);transition:fill-opacity .6s}
.kes .reactor .pip{fill:var(--term);stroke:var(--good);stroke-width:1.4}
.kes .reactor.idle .ring,.kes .reactor.idle .pip{stroke:#52697b}
.kes .reactor.over .ring,.kes .reactor.over .pip{stroke:var(--bad)}
.kes .reactor.over .glow{fill:var(--bad);animation:melt .45s ease-in-out infinite alternate}
@keyframes melt{to{fill-opacity:.25}}
.kes .cd{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 4;opacity:.85}
.kes .cd.bk{stroke:var(--warn)}
.kes .cd.dead{stroke:var(--bad);opacity:.55}
.kes .cd.skip{stroke:var(--warn);opacity:.55}
.kes .cd.mem{stroke:var(--good)}
.kes.refit .cd{stroke-dasharray:320;animation:cdraw .9s ease-out}
@keyframes cdraw{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
.kes .scan{fill:var(--accent);opacity:0}
.kes.refit .scan{animation:sweep 1s ease-out}
@keyframes sweep{from{transform:translateY(0);opacity:.9}to{transform:translateY(370px);opacity:0}}
.kes .mk circle,.kes .mk rect{fill:var(--term);stroke:#7d8d99;stroke-width:1.4}
.kes .mk text{font:700 11px var(--mono);fill:var(--ink);text-anchor:middle}
.kes .mk.on circle,.kes .mk.on rect{stroke:var(--good)}
.kes .mk.bal.on circle,.kes .mk.pilot circle{stroke:var(--accent)}
.kes .mk.off{opacity:.5}
.kes .mk.down circle,.kes .mk.hot circle{stroke:var(--bad)}
.kes .mk.down text{fill:var(--bad)}
.kes .mk.hit circle,.kes .mk.hit rect{animation:mkhit .9s ease-out}
@keyframes mkhit{30%{fill:var(--accent);stroke-width:4}}
.kes .mk.err circle{animation:mkerr .6s}
@keyframes mkerr{30%,70%{fill:var(--bad)}}
.kes .gatebar{stroke:var(--bad);stroke-width:3;stroke-linecap:round;opacity:.55}
.kes .gatebar.shut{animation:shut .8s}
@keyframes shut{30%{opacity:1;stroke-width:6}}
.kes .pk{fill:var(--accent);opacity:0;offset-rotate:0deg;animation:pkrun .8s linear forwards;filter:drop-shadow(0 0 3px var(--accent))}
.kes .pk.hit{fill:var(--good);filter:drop-shadow(0 0 3px var(--good))}
.kes .pk.limit{fill:var(--bad);filter:drop-shadow(0 0 3px var(--bad));animation-duration:.5s}
@keyframes pkrun{0%{offset-distance:0%;opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.bdg{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:50%;border:1.5px solid var(--muted);font:700 .68rem var(--mono);color:var(--ink);background:var(--term)}
.bdg.on{border-color:var(--good)}.bdg.down,.bdg.over{border-color:var(--bad)}.bdg.lim{border-color:var(--bad);color:var(--bad);border-radius:4px}
.ccard.gatec{border-left-color:var(--accent)}
.gatec .bdg{border-color:var(--accent)}
.gatec .arrowr{font-size:.8rem}
@media (prefers-reduced-motion:reduce){.kes .pk,.kes .nd.hot .pl,.kes .reactor.over .glow,.kes.refit .cd,.kes.refit .scan,.kes .mk.hit circle,.kes .mk.hit rect,.kes .mk.err circle,.kes .gatebar.shut{animation:none}}
@media (min-width:720px){.pz{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr)}.duo2{grid-template-columns:minmax(200px,1fr) minmax(0,1.05fr)}}
.kfig svg{max-height:none}

['class PilotOut(BaseModel):','A second schema: the shape the API promises to return. Columns you add to the table later do not leak out unless you add them here.'],

['def list_pilots(db: Session = Depends(get_db)):','<code>Depends(get_db)</code> is the bridge. FastAPI calls get_db for every request and passes the Session in as <code>db</code>. One request, one session, one transaction.'],
['    return db.scalars(select(Pilot).order_by(Pilot.id)).all()','<code>select(Pilot)</code> builds a SELECT. <code>db.scalars(...)</code> runs it and gives back Pilot objects. <code>response_model</code> then converts each one to a PilotOut.'],
['    pilot = db.get(Pilot, pilot_id)','Fetch one row by primary key. Returns <code>None</code> when there is no such row, which the next line turns into a 404.'],
['    db.add(pilot)','Hand the new object to the session. Nothing is sent to Postgres yet.'],
['        db.commit()','Send the INSERT and make it permanent. After this line <code>pilot.id</code> holds the number Postgres assigned.'],
['    except IntegrityError:','The database refused: the callsign already exists. Roll the session back so it is usable again, and answer 409 Conflict. The UNIQUE constraint is the real guard; this only translates its refusal into a clear HTTP answer.']];

const LESSONS=[
{id:1,title:'Blueprints, a suit and a cable',mins:8,
idea:`
<p><em>Postgres from Zero</em> taught you the database: tables, rows, SQL. <em>FastAPI from Zero</em> taught you the API: Python functions that answer HTTP requests. Between them is a gap. The API speaks Python objects, the database speaks SQL, and something has to carry data across. Something also has to change the tables when the application changes, without wiping what is stored in them.</p>
<p>Two libraries fill that gap, and this guide is about both:</p>
<ul>
<li><strong>SQLAlchemy</strong> lets you describe tables as Python classes and work with rows as Python objects. It writes the SQL.</li>
<li><strong>Alembic</strong>, from the same authors, changes the tables of a live database step by step, and records which steps have been done.</li>
</ul>
<p>Back to the hangar. The Kestrel's control system needs to remember things: its pilots, their sorties. Picture it like this:</p>
<dl class="terms">
<dt>The blueprints (models)</dt><dd>Python classes in <code>app/models.py</code>. Each one is a drawing of a rack in the suit's memory bay: which slots it has and what fits in each. A blueprint is paper. Drawing one builds nothing.</dd>
<dt>The suit (the database)</dt><dd>The Postgres database called <code>kestrel</code>. Its memory bay holds the racks that were really built (tables), and its flight recorder holds what has been stored in them (rows).</dd>
<dt>The data cable (Engine)</dt><dd>The connection between your Python code and the database. Every statement travels down it.</dd>
<dt>A work session (Session)</dt><dd>One sitting at the suit: you make some changes, then either sign them all off (commit) or abandon them all (rollback).</dd>
<dt>A refit order (migration)</dt><dd>A small script that takes the suit from one blueprint revision to the next: "add this slot to that rack". Alembic writes them, runs them and keeps the log.</dd>
</dl>
<p>The whole difficulty of this subject is in one sentence: <strong>the blueprints and the suit are two separate things, and nothing keeps them in step automatically.</strong> Change a class and the table does not change. Rebuild the table carelessly and the flight recorder is wiped. The second half of this guide is the routine that changes both together and keeps the data.</p>
<h2>Translation key</h2>
<p>The Kestrel is there to make things easier to picture, so the real term always travels with it. The letters are the callouts on the blueprint in the sandbox.</p>
<table class="types"><thead><tr><th>On the Kestrel</th><th>Callout</th><th>In a real project</th></tr></thead><tbody>
<tr><td>the designer's blueprints</td><td></td><td>models: classes in app/models.py</td></tr>
<tr><td>the suit</td><td></td><td>the Postgres database</td></tr>
<tr><td>data cable</td><td>D</td><td>the Engine and its connection pool</td></tr>
<tr><td>memory bay, racks, slots</td><td>M</td><td>the schema: tables and columns</td></tr>
<tr><td>flight recorder</td><td>R</td><td>the rows: your data</td></tr>
<tr><td>visor light, work session</td><td>W</td><td>a Session (one transaction)</td></tr>
<tr><td>comms mast</td><td>A</td><td>the FastAPI endpoints</td></tr>
<tr><td>refit order</td><td></td><td>a migration (an Alembic revision file)</td></tr>
<tr><td>refit log</td><td>L</td><td>the folder migrations/versions</td></tr>
<tr><td>refit plate</td><td>P</td><td>the alembic_version table</td></tr>
<tr><td>the tech</td><td></td><td>the alembic command</td></tr>
<tr><td>hangar gantry</td><td>G</td><td>locked while models and database disagree (drift)</td></tr>
</tbody></table>`,

notes:`<h2>Reading a database URL</h2>
<pre class="file">postgresql+psycopg :// control : dev-only @ localhost : 5432 / kestrel
dialect + driver      user      password   host        port   database</pre>
<p>The <strong>dialect</strong> tells SQLAlchemy which flavour of SQL to write. The <strong>driver</strong> is the Python package that carries it. Swap the URL and the same models can run against SQLite in a quick test, though you should test against Postgres whenever the details matter.</p>
<h2>Two layers in one library</h2>
<table class="types"><thead><tr><th>Layer</th><th>You write</th><th>Used in this guide for</th></tr></thead><tbody>
<tr><td>Core</td><td>Tables, columns and SQL expressions: <code>select(...)</code>, <code>text("...")</code></td><td>The Engine, and every query</td></tr>
<tr><td>ORM (object-relational mapper)</td><td>Classes and objects: <code>Pilot(callsign="Wren")</code></td><td>Models and Sessions</td></tr>
</tbody></table>
<p>The ORM is built on Core. You will use both without having to think about where one ends.</p>
<h2>One Engine, many connections</h2>
<p>Opening a database connection is slow, so the Engine keeps a few open and lends them out. That is the <strong>connection pool</strong>. Create one Engine when the application starts and share it. Never create one per request.</p>
<h2>If you have seen SQLModel</h2>
<p>The FastAPI documentation teaches databases with SQLModel. It is a layer over SQLAlchemy and Pydantic by FastAPI's author. Its engine, sessions and queries are SQLAlchemy's, and its migrations are done with Alembic, so everything here carries over.</p>`,

{q:'What is the Engine?',opts:['The Postgres server','The object that holds the database address and a pool of connections','A table that stores models','The migration tool'],a:1,why:'The Engine is the cable: created once from the URL, shared by everything that talks to the database.'},

{id:2,title:'Blueprints: drawing the first rack',mins:10,
idea:`
<p>A <strong>model</strong> is a Python class that describes one table. The mapping is simple enough to memorise:</p>
<table class="types"><thead><tr><th>In Python</th><th>In Postgres</th><th>On the Kestrel</th></tr></thead><tbody>
<tr><td>a model class (<code>Pilot</code>)</td><td>a table (<code>pilots</code>)</td><td>the drawing of one rack</td></tr>
<tr><td>an attribute (<code>callsign</code>)</td><td>a column</td><td>a slot in that rack</td></tr>
<tr><td>an object (<code>Pilot(callsign="Wren")</code>)</td><td>a row</td><td>one record in the flight recorder</td></tr>
</tbody></table>
<p>SQLAlchemy 2.0 reads ordinary Python type hints. The type inside <code>Mapped[...]</code> chooses the column type, and whether it allows empty values:</p>
<table class="types"><thead><tr><th>You write</th><th>Column you get</th></tr></thead><tbody>
<tr><td><code>Mapped[int]</code></td><td>INTEGER NOT NULL</td></tr>
<tr><td><code>Mapped[str]</code></td><td>VARCHAR NOT NULL (give a length with <code>String(30)</code>)</td></tr>
<tr><td><code>Mapped[str | None]</code></td><td>VARCHAR, empty values allowed (nullable)</td></tr>
<tr><td><code>Mapped[datetime]</code></td><td>TIMESTAMP NOT NULL</td></tr>
<tr><td><code>Mapped[bool]</code>, <code>Mapped[float]</code>, <code>Mapped[Decimal]</code></td><td>BOOLEAN, FLOAT, NUMERIC</td></tr>
</tbody></table>
<p>Everything else about a column goes in <code>mapped_column(...)</code>: primary key, uniqueness, defaults, foreign keys.</p>
<p>Every model inherits from one class, conventionally called <code>Base</code>. Base keeps a registry of all the tables drawn so far, <code>Base.metadata</code>. Think of it as the designer's folder of current blueprints. SQLAlchemy can build tables from that folder with one call, <code>Base.metadata.create_all(engine)</code>, and that is how this lesson builds the first rack. Lesson 5 shows why that call is only good for a first build.</p>`,
widget:'model',widgetTitle:'Read the blueprint line by line',

notes:`<h2>default and server_default are different things</h2>
<table class="types"><thead><tr><th>Option</th><th>Who fills the value in</th><th>Visible in the table definition?</th></tr></thead><tbody>
<tr><td><code>default=1</code></td><td>SQLAlchemy, in Python, when <em>it</em> inserts a row</td><td>No. Postgres knows nothing about it</td></tr>
<tr><td><code>server_default=func.now()</code></td><td>Postgres, for any insert from anywhere</td><td>Yes: <code>DEFAULT now()</code></td></tr>
</tbody></table>
<p>The difference matters a great deal in lesson 8, when a new required column meets rows that already exist.</p>
<h2>Naming</h2>
<p>You did not name the constraints, so Postgres did: <code>pilots_pkey</code>, <code>pilots_callsign_key</code>. Larger projects set a <strong>naming convention</strong> on the metadata so every constraint gets a predictable name on every database. Alembic needs a name to drop or alter a constraint later, so this is worth doing early. The Alembic documentation has the recipe.</p>
<h2>Keep models in one importable place</h2>
<p>A table only joins <code>Base.metadata</code> when the module containing its class is imported. One file, or one package whose <code>__init__</code> imports every model, avoids the classic surprise of a table that "does not exist" as far as the tools can see.</p>`,

{q:'What is Base.metadata?',opts:['A table in Postgres','The registry of every table your models describe','A log of SQL statements','The connection pool'],a:1,why:'Each model class registers its table there. create_all reads it now; Alembic will read it later.'},

{id:3,title:'Work sessions: add, commit, roll back',mins:11,
idea:`
<p>The rack is built and the flight recorder is empty. Rows are written and read through a <strong>Session</strong>.</p>
<p>A Session is one sitting at the suit. You hand it new objects, change attributes on objects it loaded, and mark others for deletion. It keeps a list. It sends nothing until it has to. When you call <code>commit()</code> it sends everything in one <strong>transaction</strong>, which Postgres applies completely or not at all. If you leave without committing, or something fails, the transaction is <strong>rolled back</strong> and the database is as it was. On the blueprint, the visor light (W) shows how the last session ended.</p>
<dl class="terms">
<dt>session.add(obj)</dt><dd>Put a new object on the session's list. Nothing has been sent.</dd>
<dt>session.flush()</dt><dd>Send the pending SQL now, inside the open transaction. Other connections cannot see it yet. Rarely called by hand: the session flushes by itself before a query and before a commit.</dd>
<dt>session.commit()</dt><dd>Flush, then make the transaction permanent.</dd>
<dt>session.rollback()</dt><dd>Abandon everything since the last commit.</dd>
<dt>with Session(engine) as session:</dt><dd>Open a session and guarantee it is closed at the end of the block. Closing without a commit rolls back.</dd>
</dl>
<p>Reading uses <code>select()</code>:</p>
<pre class="file">session.get(Pilot, 3)                                   # one row by primary key, or None
session.scalars(select(Pilot)).all()                    # every pilot, as a list of objects
session.scalars(select(Pilot).where(Pilot.callsign == "Wren")).one()
session.scalars(select(Pilot).order_by(Pilot.id).limit(10)).all()</pre>
<p>To update, change an attribute on a loaded object and commit. To delete, <code>session.delete(obj)</code> and commit. The session works out the SQL.</p>`,
widget:'life',widgetTitle:'The life of one object',
widgetIntro:'Follow Pilot(callsign="Wren") from a plain Python object to a stored row. Press Next, or tap a box.',
labIntro:'Stored rows appear at the bottom of the status panel, under "Flight recorder". Watch that table, and the visor light, as each script runs. Read the INFO lines too: they are the SQL the session wrote for you.',

{what:`Read a script that stores three pilots`,cmd:`cat scripts/enlist.py`,parts:P_CAT('scripts/enlist.py: opens a session, adds three Pilot objects, commits.'),
 saw:`No SQL anywhere in the file. Three objects are created, handed to the session, and committed.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path==='scripts/enlist.py'},

 saw:`One SELECT, three objects. The ROLLBACK at the end is normal: the session only read, so it has nothing to keep and hands the connection back clean.`,test:(l,w,r)=>r.meta.script==='roster'&&r.ok},
{what:`Read a script with a mistake in it`,cmd:`cat scripts/forgot.py`,parts:P_CAT('scripts/forgot.py: adds a pilot called Ghost, flushes, and never commits.'),

 saw:`Inside the session Ghost had an id, 4. Then the block ended without a commit and the session sent ROLLBACK. The visor went amber.`,test:(l,w,r)=>r.meta.script==='forgot'&&r.ok},
{what:`Check the roster`,cmd:`python scripts/roster.py`,parts:P_PY('roster','The same query as before.'),
 saw:`Still three pilots. Ghost was sent to Postgres and then undone. Without a commit nothing lasts.`,test:(l,w,r)=>r.meta.script==='roster'&&r.ok&&r.meta.n===3},
{what:`Enlist the same three again`,cmd:`python scripts/enlist.py`,parts:P_PY('enlist','The first script, unchanged.'),
 saw:`IntegrityError: the UNIQUE constraint on callsign refused a second Wren. The session rolled back, so no part of the batch was stored. The constraint you drew in the model is enforced by the database itself.`,test:(l,w,r)=>r.meta.script==='enlist'&&r.meta.err==='UniqueViolation'},

notes:`<h2>Why the session waits</h2>
<p>Collecting changes and sending them together is called the <strong>unit of work</strong> pattern. It means a request that touches five objects either stores all five changes or none, and you never have to write the bookkeeping.</p>
<h2>Ids are not reused</h2>
<p>Ghost was given id 4 and then rolled back. The next pilot will get 5. Postgres sequences only move forward, so a rollback leaves a gap. Gaps in an id column are normal and mean nothing.</p>
<h2>Updates and deletes</h2>
<pre class="file">pilot = session.get(Pilot, 2)
pilot.callsign = "Ibis-2"        # the session notices the change
session.commit()                 # UPDATE pilots SET callsign=... WHERE id = 2

session.delete(pilot)
session.commit()                 # DELETE FROM pilots WHERE id = 2</pre>
<h2>echo=True is for learning</h2>
<p>Seeing every statement is valuable while you learn and while you debug. Turn it off in production: it is slow, noisy, and can write personal data into logs.</p>`,
quiz:[
{q:'A script adds an object and the with-block ends without commit(). What is stored?',opts:['The object, because add() saves it','The object, because flush() saves it','Nothing: closing without a commit rolls back','Half of the object'],a:2,why:'Only commit makes a transaction permanent. add and flush both happen inside it.'},
{q:'Three inserts are committed together and the third violates a UNIQUE constraint. How many rows are stored?',opts:['Two','Three','None','One'],a:2,why:'A transaction is all or nothing. The failure rolls back the first two as well.'},
{q:'How do you change a stored pilot\'s callsign with the ORM?',opts:['Write an UPDATE statement by hand','Load the object, set the attribute, commit','Delete the row and insert a new one','Call create_all again'],a:1,why:'The session tracks loaded objects and writes the UPDATE for any attribute you changed.'}],

['SQLAlchemy: Session Basics','https://docs.sqlalchemy.org/en/20/orm/session_basics.html','What a Session is, when to open and close one, and a frequently-asked-questions section worth reading twice.'],
['Unified Tutorial: Data Manipulation with the ORM','https://docs.sqlalchemy.org/en/20/tutorial/orm_data_manipulation.html','Insert, update, delete, flush and rollback, step by step.'],
['Unified Tutorial: Using SELECT Statements','https://docs.sqlalchemy.org/en/20/tutorial/data_select.html','where, order_by, joins and everything else select() can do.']]},

{id:4,title:'The comms mast: wire it into FastAPI',mins:11,
idea:`
<p>Scripts are useful for learning. The real consumer of the database is the API. At the moment <code>app/main.py</code> keeps its pilots in a Python list, which is how a first FastAPI application usually starts, and which forgets everything each time the server restarts. In this lesson you plug the comms mast (the FastAPI endpoints) into the flight recorder.</p>
<p>Three ideas do the work:</p>
<dl class="terms">
<dt>One session per request (the get_db dependency)</dt><dd>A small function in <code>app/db.py</code> opens a Session, <code>yield</code>s it to the endpoint, and closes it afterwards, whatever happened. Endpoints ask for it with <code>db: Session = Depends(get_db)</code>. No request ever shares a session with another.</dd>
<dt>Two kinds of class, two jobs</dt><dd>The <strong>SQLAlchemy model</strong> (<code>Pilot</code>) is the shape of a stored row. The <strong>Pydantic schemas</strong> (<code>PilotIn</code>, <code>PilotOut</code>) are the shape of what travels over HTTP. Keeping them separate means a client cannot set columns it should not, and a new column does not leak into responses by accident.</dd>
<dt>The database has the last word</dt><dd>The UNIQUE constraint will refuse a duplicate callsign even if two requests arrive in the same millisecond. The endpoint's job is to catch that refusal (<code>IntegrityError</code>), roll back, and answer with a clear status code.</dd>
</dl>
<p>The server is already running with <code>uvicorn --reload</code>, so it restarts by itself whenever a file in <code>app/</code> changes.</p>`,
widget:'main',widgetTitle:'The database-backed API, line by line',

 saw:`"Callsign already taken". Postgres refused the insert, the endpoint caught IntegrityError, rolled back and answered 409 Conflict.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===409},
{what:`Ask for a pilot who does not exist`,cmd:`curl -si `+API+`/99`,parts:[['-i','Also print the status line and headers of the response.'],['/pilots/99','One pilot, by id.']],
 saw:`404 Not Found. db.get returned None and the endpoint turned that into a 404.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===404},
{what:`Confirm Kite is really stored`,cmd:`psql -c "SELECT * FROM pilots"`,parts:[['SELECT * FROM pilots','Ask Postgres directly, bypassing the API.']],
 saw:`Four rows, Kite among them, with a joined_at the API never mentioned. Restart the server as often as you like: the data is in the database now.`,test:(l,w,r)=>r.meta.q==='select'&&r.meta.n===4}
],
notes:`<h2>How get_db works</h2>
<pre class="file">def get_db():
    with SessionLocal() as session:   # 1. runs before the endpoint
        yield session                 # 2. the endpoint runs here, using the session
                                      # 3. the with-block closes the session, even after an error</pre>
<p>A dependency that uses <code>yield</code> has a before part and an after part. FastAPI runs the after part once the response is ready. That is the whole "one session per request" mechanism.</p>
<h2>def or async def?</h2>
<p>These endpoints are plain <code>def</code>. FastAPI runs such endpoints in a thread pool, so a blocking database call does not freeze the server. SQLAlchemy also has an async API (<code>create_async_engine</code>, <code>AsyncSession</code>) for <code>async def</code> endpoints. It is the same ideas with <code>await</code> in front. Do not call the blocking Session from inside an <code>async def</code> endpoint.</p>
<h2>Testing</h2>
<p>Because endpoints receive their session through a dependency, a test can replace it: <code>app.dependency_overrides[get_db] = ...</code> points every endpoint at a test database. This is the hook the fixtures in <em>Playwright + pytest from Zero</em> would use.</p>
<h2>What not to return</h2>
<p>Always give endpoints a <code>response_model</code>. Returning raw model objects without one is how a password-hash column ends up in a JSON response.</p>`,
quiz:[
{q:'What does Depends(get_db) give an endpoint?',opts:['The Engine','A fresh Session for this request, closed automatically afterwards','A list of all pilots','A Pydantic model'],a:1,why:'get_db opens a session, yields it, and closes it when the request is over.'},
{q:'Why are PilotIn / PilotOut separate from the Pilot model?',opts:['Pydantic cannot read SQLAlchemy objects','It is required by Postgres','One is the shape stored in the database, the others are the shapes exchanged over HTTP, and they change for different reasons','To make the code longer'],a:2,why:'The model is storage; schemas are the API contract. Keeping them apart protects both.'},
{q:'Two clients POST the same callsign at the same instant. What stops a duplicate?',opts:['The Pydantic schema','A check in the endpoint before inserting','The UNIQUE constraint in the database','uvicorn'],a:2,why:'Only the database sees both inserts. A check in Python can be beaten by timing; a constraint cannot.'}],
reading:[
['FastAPI: Dependencies with yield','https://fastapi.tiangolo.com/tutorial/dependencies/dependencies-with-yield/','How a dependency can run code before and after the endpoint. The pattern behind get_db.'],
['FastAPI: Response Model','https://fastapi.tiangolo.com/tutorial/response-model/','Why and how to declare what an endpoint returns.'],
['SQLAlchemy: Asynchronous I/O (asyncio)','https://docs.sqlalchemy.org/en/20/orm/extensions/asyncio.html','The async engine and session, for when you move to async def endpoints.']]},

{id:5,title:'The blueprint changes. The suit does not',mins:9,
idea:`
<p>Everything works, so of course the requirements change. The squadron wants each pilot to have a <strong>rank</strong>. In the blueprint that is one new line:</p>
<pre class="file">rank: Mapped[str | None] = mapped_column(String(20))</pre>
<p>This lesson does that the naive way and lets it go wrong, because the two failures you are about to see are the reason migrations exist.</p>
<dl class="terms">
<dt>Drift</dt><dd>The models and the database disagree. The blueprint shows a slot that the rack does not have, or the other way round. SQLAlchemy writes its SQL from the blueprint, so every query that mentions the missing column fails. On the Kestrel, the gantry clamps lock.</dd>
<dt>Schema</dt><dd>The structure of a database: its tables, columns, types and constraints. Everything except the rows.</dd>
<dt>DDL and DML</dt><dd>Two families of SQL. <strong>DDL</strong> (data definition language) changes structure: CREATE TABLE, ALTER TABLE, DROP TABLE. <strong>DML</strong> (data manipulation language) changes rows: INSERT, UPDATE, DELETE.</dd>
</dl>
<p>You already know one tool that builds tables from blueprints: <code>create_all</code>. Watch what it does when the table already exists, and what the obvious workaround costs.</p>`,
labIntro:'Keep an eye on three things: the gantry (G), the status pill at the top of the panel, and the flight recorder at the bottom. There are four pilots on file at the start of this lab.',
tasks:[
{what:`See what the designer wants to change`,cmd:`diff app/models.py drafts/models_rank.py`,parts:[['diff OLD NEW','Show only the lines that differ between two files: "-" is removed, "+" is added.']],
 saw:`One added line: a rank column, text, nullable. Nothing else differs.`,test:(l,w,r)=>r.meta.cmd==='diff'&&r.meta.b==='drafts/models_rank.py'},
{what:`File the new blueprint`,cmd:`cp drafts/models_rank.py app/models.py`,parts:[['cp drafts/models_rank.py app/models.py','Replace the models file with the version that has rank. This is the edit you would make in your editor.']],
 saw:`The gantry locked and the status pill says drift. Stage 1 shows pilots with 4 columns, stage 3 still has 3. The server restarted with the new model.`,test:(l,w,r)=>MODEL_V.get(w.files['app/models.py'])===2},
{what:`Read the roster`,cmd:`python scripts/roster.py`,parts:P_PY('roster','The same script that worked in lesson 3.'),
 saw:`"column pilots.rank does not exist". SQLAlchemy built its SELECT from the blueprint and asked for four columns. The table has three.`,test:(l,w,r)=>r.meta.script==='roster'&&r.meta.err==='UndefinedColumn'},
{what:`Ask the API`,cmd:`curl -si `+API,parts:[['curl -si','GET the list and show the status line.']],
 saw:`500 Internal Server Error. One line in a Python file, and the whole API is down, with the database untouched and healthy.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===500},
{what:`Try the builder you know`,cmd:`python scripts/create_all.py`,parts:P_PY('create_all','Base.metadata.create_all(engine), as in lesson 2.'),
 saw:`It did nothing. A table called pilots exists, so create_all skipped it. It never compares columns and it never sends ALTER TABLE.`,test:(l,w,r)=>r.meta.script==='create_all'&&r.meta.made===0},
{what:`Confirm in Postgres`,cmd:`psql -c "\\d pilots"`,parts:[['\\d pilots','Describe the table as it really is.']],
 saw:`Three columns. No rank.`,test:(l,w,r)=>r.meta.q==='d'&&r.meta.table==='pilots'},
{what:`The tempting fix: tear it out and rebuild`,cmd:`python scripts/rebuild.py`,parts:P_PY('rebuild','drop_all followed by create_all: remove every table, then build from the current blueprints.'),
 saw:`The gantry released: the new table has rank. Now look at the flight recorder. The reactor ring went red because DROP TABLE took all four pilots with it.`,test:(l,w,r)=>r.meta.script==='rebuild'&&r.ok},
{what:`Read the roster`,cmd:`python scripts/roster.py`,parts:P_PY('roster','The same query.'),
 saw:`0 pilots on file. The schema is right and the data is gone. On your own machine that is an annoyance. In production it is the worst day of the year.`,test:(l,w,r)=>r.meta.script==='roster'&&r.ok&&r.meta.n===0}
],
notes:`<h2>What went wrong, exactly</h2>
<ol>
<li>The models changed and the database did not. Nothing warned you until a query ran.</li>
<li><code>create_all</code> can build a table that is missing. It cannot change one that exists.</li>
<li>Dropping and rebuilding gives the right structure and destroys the contents.</li>
</ol>
<h2>What is needed instead</h2>
<p>The change Postgres needed was one statement, which keeps every row:</p>
<pre class="file">ALTER TABLE pilots ADD COLUMN rank VARCHAR(20);</pre>
<p>You could type that into psql. Then you would have to type it again, identically, on every other copy of the database: each teammate's machine, the CI database, staging, production. And remember which copies have had it. A <strong>migration</strong> is that statement written down as a small script, kept in git next to the model change, with a record in each database of which scripts it has already run. That is all Alembic is, and it is the next lesson.</p>
<h2>Where create_all still belongs</h2>
<p>Throwaway databases: a quick experiment, or a test database created fresh and deleted after each run. Anywhere the data must survive, use migrations and never call create_all.</p>`,
quiz:[
{q:'What is drift?',opts:['A slow query','The models and the database schema disagreeing','A failed commit','Two sessions open at once'],a:1,why:'Drift is the gap between what the code believes the tables look like and what they really look like.'},
{q:'Why did create_all not add the rank column?',opts:['The column was nullable','It only creates tables that do not exist; it never alters existing ones','echo was on','The session was not committed'],a:1,why:'create_all checks table names. An existing table is left exactly as it is.'},
{q:'drop_all followed by create_all fixes the structure. What does it cost?',opts:['Nothing','A slower server','Every row in the dropped tables','The Engine'],a:2,why:'DROP TABLE removes the table and everything in it, without asking.'}],
reading:[
['PostgreSQL: Modifying Tables','https://www.postgresql.org/docs/current/ddl-alter.html','What ALTER TABLE can do: add and remove columns and constraints, change defaults and types, rename.'],
['Evolutionary Database Design (Martin Fowler)','https://martinfowler.com/articles/evodb.html','The article that made "every schema change is a migration, kept in version control" standard practice.'],
['SQLAlchemy: Describing Databases with MetaData','https://docs.sqlalchemy.org/en/20/core/metadata.html','What create_all and drop_all do, and their limits.']]},

{id:6,title:'The refit log: Alembic\'s first order',mins:13,
idea:`
<p><strong>Alembic</strong> is the tech who refits the suit by the book. It adds three things to the project:</p>
<dl class="terms">
<dt>Refit orders (revision files, also called migrations)</dt><dd>Python files in <code>migrations/versions/</code>. Each has an <code>upgrade()</code> function that makes one change, and a <code>downgrade()</code> that reverses it. Each has an id, and names the revision that comes before it (<code>down_revision</code>), so together they form a chain.</dd>
<dt>The refit log (the migrations folder)</dt><dd>The chain of all revision files, committed to git with the rest of the code. The newest revision is called <strong>head</strong>. The state before any revision is <strong>base</strong>.</dd>
<dt>The refit plate (the alembic_version table)</dt><dd>A tiny table inside each database with one row: the id of the last revision applied to <em>that</em> database. Riveted to the suit, not kept in the hangar. This is how Alembic knows what a given database still needs.</dd>
</dl>
<p><code>alembic upgrade head</code> therefore means: read the plate, find that revision in the log, and run every order after it, in sequence, up to the newest.</p>
<p>Alembic also has to be told two things before it can work: where the database is, and what your models are. Both go in <code>migrations/env.py</code>, a script Alembic runs at the start of every command.</p>
<p>From this lesson on there is one rule: <strong>the suit is only ever changed by a refit order.</strong> No more create_all. To make that true from the first table, the lab starts by clearing the empty development database and letting the first revision build it.</p>`,
widget:'env',widgetTitle:'migrations/env.py: the lines that matter',
widgetIntro:'alembic init writes this file with two blanks. These are the lines you add or change, and the ones worth understanding. Tap a line.',
labIntro:'New callouts come alive in this lab: the refit log (L, the wing binders) and the refit plate (P, on the shoulder). In the strip, stage 2 shows each revision, amber while it is waiting and green once it has been applied.',

{what:`Clear the development database`,cmd:`python scripts/drop_all.py`,parts:P_PY('drop_all','Base.metadata.drop_all(engine). The table is empty after lesson 5, so nothing is lost.'),
 saw:`The memory bay is bare again. From here, tables will only come from revisions.`,test:(l,w,r)=>!w.db.tables.pilots&&r.meta.script==='drop_all'},
{what:`Start a refit log`,cmd:`alembic init migrations`,parts:[['alembic init','Create the files Alembic needs. Run once per project.'],['migrations','The folder to create. Any name works; this one is common.']],
 saw:`A migrations folder with env.py and an empty versions folder, plus alembic.ini. Read the last line of the output: it tells you the configuration is not finished.`,test:(l,w,r)=>w.files['alembic.ini']!==undefined},
{what:`Ask which revision the suit is at`,cmd:`alembic current`,parts:[['alembic current','Read the refit plate: print the revision this database is at.']],
 saw:`"Can't load plugin: sqlalchemy.dialects:driver". alembic.ini still has a placeholder address. Alembic does not know where the database is.`,test:(l,w,r)=>r.meta.sub==='current'&&r.meta.err==='url'},
{what:`Read the corrected env.py`,cmd:`cat drafts/env.py`,parts:P_CAT('drafts/env.py: the generated env.py with three lines added and one changed.'),
 saw:`Two imports, one line that sets the database address from your settings, and target_metadata = Base.metadata. The widget above explains each.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path==='drafts/env.py'},
{what:`Put it in place`,cmd:`cp drafts/env.py migrations/env.py`,parts:[['cp drafts/env.py migrations/env.py','Replace the generated file with the configured one.']],
 saw:`Alembic now knows the address and the blueprints.`,test:(l,w,r)=>w.files['migrations/env.py']===ENV_GOOD},
{what:`Have the tech draft the first refit order`,cmd:AUTOGEN('create pilots'),parts:P_AUTOGEN,
 saw:`"Detected added table 'pilots'". Alembic compared the blueprints (a pilots table) with the database (nothing) and wrote the difference into a new file. Stage 2 shows it in amber: written, not applied. Nothing in the database has changed.`,test:(l,w,r)=>w.revs.length>=1&&r.meta.sub==='revision'},
{what:`Read the order before running it`,cmd:`cat `+F1,parts:P_CAT('The generated revision file. The first part of its name is the revision id.'),
 saw:`upgrade() calls op.create_table with the four columns, rank included. downgrade() drops the table. down_revision is None: this is the first link in the chain.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path===F1},
{what:`Carry it out`,cmd:`alembic upgrade head`,parts:P_UP,
 saw:`"Running upgrade  -> ${R1}, create pilots". The frame assembled, the rack exists, and the plate was stamped. The gantry released.`,test:(l,w,r)=>r.meta.sub==='upgrade'&&!!w.db.tables.pilots&&w.db.ver===R1},
{what:`List the tables`,cmd:`psql -c "\\dt"`,parts:[['\\dt','List the tables.']],
 saw:`Two tables: pilots, and alembic_version. The second is the refit plate. Alembic created it.`,test:(l,w,r)=>r.meta.q==='dt'&&r.meta.n===2},
{what:`Read the plate`,cmd:`alembic current`,parts:[['alembic current','The same command that failed four steps ago.']],
 saw:`${R1} (head). This database has had every revision in the log.`,test:(l,w,r)=>r.meta.sub==='current'&&r.meta.head},
{what:`Enlist the pilots again`,cmd:`python scripts/enlist.py`,parts:P_PY('enlist','The script from lesson 3.'),
 saw:`Wren, Ibis and Heron are back, with ids 1 to 3 in the new table and an empty rank each.`,test:(l,w,r)=>r.meta.script==='enlist'&&r.ok},
{what:`Give them ranks`,cmd:`python scripts/promote.py`,parts:P_PY('promote','Loads each pilot, sets pilot.rank, commits. An ORM update.'),
 saw:`One UPDATE, sent for three rows. The script only assigned attributes; the session wrote the SQL. These ranks are the data the rest of the guide is careful not to lose.`,test:(l,w,r)=>r.meta.script==='promote'&&r.ok&&r.meta.n>0}
],
notes:`<h2>Anatomy of a revision file</h2>
<pre class="file">revision: str = '${R1}'             # this order's id
down_revision: Union[str, None] = None      # the order before it (None = first)

def upgrade() -> None:                      # go forward
    op.create_table('pilots', ...)

def downgrade() -> None:                    # go back
    op.drop_table('pilots')</pre>
<p><code>op</code> is Alembic's toolbox: <code>create_table</code>, <code>add_column</code>, <code>drop_column</code>, <code>alter_column</code>, <code>create_index</code>, <code>execute</code> for raw SQL, and more. Each call becomes one DDL statement.</p>
<h2>Adopting Alembic on a database that already has tables</h2>
<p>You cleared the database because it was empty and local. In an existing project you cannot. The usual route:</p>
<ol>
<li>Generate a first revision that creates the current tables (autogenerate against an empty scratch database).</li>
<li>On every database that already has those tables, run <code>alembic stamp head</code>. That writes the revision id on the plate <em>without running the order</em>: "this suit is already at that revision".</li>
<li>From then on, every change is a new revision, applied everywhere with <code>alembic upgrade head</code>.</li>
</ol>
<h2>What goes in git</h2>
<p><code>alembic.ini</code> and the whole <code>migrations/</code> folder. A model change and the revision that carries it belong in the same commit and the same pull request, so they are reviewed together.</p>`,
quiz:[
{q:'Where does Alembic record which revisions a database has had?',opts:['In alembic.ini','In a file in migrations/versions','In the alembic_version table inside that database','In git'],a:2,why:'The plate is on the suit. Each database carries its own record, so each can be upgraded from wherever it is.'},
{q:'What does alembic revision --autogenerate change in the database?',opts:['It creates the new tables','Nothing. It only writes a revision file','It stamps the plate','It drops unused tables'],a:1,why:'Autogenerate reads the database to compare, then writes a file. Only upgrade changes the database.'},
{q:'Why must env.py import your models?',opts:['To run the API','So target_metadata contains every table and autogenerate has something to compare','To install psycopg','It does not need to'],a:1,why:'Autogenerate compares Base.metadata with the database. A model that is never imported is invisible to it.'}],
reading:[
['Alembic Tutorial','https://alembic.sqlalchemy.org/en/latest/tutorial.html','The official walk-through: init, the env.py and .ini files, a first revision, upgrade and downgrade.'],
['Alembic: Auto Generating Migrations','https://alembic.sqlalchemy.org/en/latest/autogenerate.html','How autogenerate is wired up, and the list of what it can and cannot detect.'],
['Alembic Cookbook: Building an Up to Date Database from Scratch','https://alembic.sqlalchemy.org/en/latest/cookbook.html#building-an-up-to-date-database-from-scratch','create_all plus stamp, and when that combination is appropriate.']]},

{id:7,title:'A routine refit: draft, review, apply, reverse',mins:12,
idea:`
<p>With the log in place, every schema change follows the same loop. This lesson runs it once on a safe change so the loop becomes a habit before the dangerous changes arrive.</p>
<ol>
<li><strong>Change the blueprint.</strong> Edit the models.</li>
<li><strong>Draft.</strong> <code>alembic revision --autogenerate -m "..."</code> writes a revision from the difference.</li>
<li><strong>Review.</strong> Open the file and read it. Autogenerate is a draft by a tech who can see structure and cannot see intent. The file even says so: "please adjust!".</li>
<li><strong>Apply.</strong> <code>alembic upgrade head</code>.</li>
<li><strong>Commit</strong> the model change and the revision together.</li>
</ol>
<p>The change: the squadron wants to record <strong>sorties</strong>, and each sortie belongs to one pilot. That is a new table with a <strong>foreign key</strong>, and a <strong>relationship</strong> so Python code can go from a pilot to their sorties without writing a join.</p>
<dl class="terms">
<dt>ForeignKey("pilots.id")</dt><dd>A column whose value must be the id of an existing row in pilots. Postgres enforces it. This is the database-level link.</dd>
<dt>relationship(...)</dt><dd>A Python-level convenience on top of the foreign key: <code>pilot.sorties</code> is a list of Sortie objects, and <code>sortie.pilot</code> is the Pilot. It creates no column. <code>back_populates</code> names the attribute on the other side so the two stay in step.</dd>
<dt>alembic check</dt><dd>Compares models and database and exits with an error if they differ. Changes nothing. Ideal in CI: a pull request that changes a model without a revision fails the build.</dd>
</dl>`,
labIntro:'A new table adds no risk to existing rows, which makes this a good change to practise the loop on, including going backwards. Watch the wing binders when you downgrade.',
tasks:[
{what:`See the designer's change`,cmd:`diff app/models.py drafts/models_sorties.py`,parts:[['diff OLD NEW','Lines that differ.']],
 saw:`A new Sortie class with a pilot_id foreign key, a relationship on each side, and two extra imports.`,test:(l,w,r)=>r.meta.cmd==='diff'&&r.meta.b==='drafts/models_sorties.py'},
{what:`File the new blueprint`,cmd:`cp drafts/models_sorties.py app/models.py`,parts:[['cp','Put the edit in place.']],
 saw:`Gantry locked: the blueprints now draw a sorties table the suit does not have.`,test:(l,w,r)=>MODEL_V.get(w.files['app/models.py'])===3},
{what:`Ask the tech whether anything is out of step`,cmd:`alembic check`,parts:[['alembic check','Compare models with database. Succeeds only when there is nothing to migrate.']],
 saw:`FAILED: New upgrade operations detected, an add_table for sorties. This is drift, caught by a command you can run in CI before anything breaks.`,test:(l,w,r)=>r.meta.sub==='check'&&r.meta.drift>0},
{what:`Draft the refit order`,cmd:AUTOGEN('add sorties'),parts:P_AUTOGEN,
 saw:`"Detected added table 'sorties'". A second file in the log, amber in stage 2.`,test:(l,w,r)=>r.meta.sub==='revision'&&w.revs.length>=2},
{what:`Review it`,cmd:`cat `+F2,parts:P_CAT('The new revision.'),
 saw:`create_table with a ForeignKeyConstraint to pilots.id. down_revision points at the first revision: the chain has two links. The relationship lines do not appear, because they are Python only.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path===F2},
