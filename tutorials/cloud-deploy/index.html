{id:4,title:'Pilot keys: configuration and secrets',mins:11,
idea:`
<p>The same image has to run in the hangar and aboard the suit, yet the two places differ: a different database, different keys, different log level. Those differences are <strong>configuration</strong>, and the rule is that configuration lives <em>outside</em> the image, supplied when the container starts.</p>
<p>The standard way to supply it is through <strong>environment variables</strong>: named values handed to a process as it starts. In the story they are the <strong>pilot keys</strong> slotted into the suit at boot. Some are harmless (<code>LOG_LEVEL=info</code>). Some are <strong>secrets</strong>: a database password, an API key. Anyone holding a secret can act as your application.</p>
<p>Three rules for secrets:</p>
<ul>
<li><strong>Never in the image.</strong> Anyone who can pull the image could read them.</li>
<li><strong>Never in git.</strong> History is permanent, and a secret committed once is leaked for good.</li>
<li><strong>Only where they are needed</strong>, readable by as few accounts as possible.</li>
</ul>
<dl class="terms">
<dt><code>.env</code> file</dt><dd>A plain text file of NAME=value lines. It sits on the server, next to where you run Docker, and is listed in <code>.gitignore</code>.</dd>
<dt><code>.env.example</code></dt><dd>The same names with the values left blank. This one <em>is</em> committed, so everyone knows which settings exist.</dd>
<dt><code>--env-file .env</code></dt><dd>Tell <code>docker run</code> to load every line of the file into the container's environment.</dd>
<dt><code>chmod 600</code></dt><dd>Set a file's permissions so that only its owner can read or write it.</dd>
</dl>`,
labIntro:'On a real server you would create .env with an editor and type or paste the values. The sandbox has no editor, so a filled-in file is waiting in keys/, as if the quartermaster had left it for you. Watch the key slot (K) on the blueprint.',
tasks:[
T_SSH,
{what:'See which settings the control system expects',cmd:'cat .env.example',parts:[['cat .env.example','The template: every setting by name, no values.']],
 saw:'Five names. DATABASE_URL was the one the logs complained about. Two of the five are secrets.',test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path==='.env.example'},
{what:'Put the production values in place',cmd:'cp keys/production.env .env',parts:[['cp keys/production.env .env','Copy the filled-in file to the name Docker will be told to read.']],
 saw:'.env now exists on the server. The blueprint shows the key slot (K) loaded, with a warning: the file is readable by every account on the machine.',test:(l,w,r)=>w.srv.files['.env']!==undefined},
{what:'Lock the file down',cmd:'chmod 600 .env',parts:[['chmod','Change a file\'s permissions.'],['600','Owner may read and write (6). Group and everyone else get nothing (0 and 0).']],
 saw:'Only the pilot account can read it now.',test:(l,w,r)=>w.srv.mode['.env']==='600'},
{what:'Confirm the permissions',cmd:'ls -l .env',parts:[['ls -l','List with details. The first column shows permissions.']],
 saw:'-rw------- : read and write for the owner, nothing for anyone else.',test:(l,w,r)=>r.meta.cmd==='ls'&&r.meta.mode==='600'},
{what:'Remove the crashed container',cmd:'docker rm control',parts:[['docker rm control','Delete the stopped container. Its name is then free to reuse. The image is untouched.']],
 saw:'Gone. A container cannot be given new settings after it is created, so you replace it. That habit, replacing instead of repairing, runs through everything that follows.',test:(l,w,r)=>r.meta.cmd==='rm'},
{what:'Start it again, with its keys',cmd:'docker run -d --name control --env-file .env -p 8000:8000 '+V1,parts:[['--env-file .env','Load every NAME=value line from .env into the container\'s environment.'],['the rest','The same command as in lesson 3.']],
 saw:'This time it stays up. The cockpit core is outlined in green and the reactor is lit. The same image, different result: only the configuration changed.',test:(l,w,r)=>ctl(w).state==='running'&&ctl(w).env},
{what:'Read its logs',cmd:'docker logs control',parts:[['docker logs control','What the new container has printed so far.']],
 saw:'"config loaded: 5 settings", then a warning: it cannot reach the database at db:5432. The address in DATABASE_URL is right, but no database is running on this server yet.',test:(l,w,r)=>r.meta.cmd==='logs'&&r.meta.env},
{what:'Run the self-test',cmd:'curl -s localhost:8000/health',parts:[['localhost:8000','From the server itself, straight to the published port.']],
 saw:'It answers, which is progress, but with status "degraded": db unreachable. The control system is up and one subsystem is missing. Notice the visor is still dark: so far nothing checks health except you.',test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===503&&w.where==='server'},
T_EXIT()
],
notes:`<h2>Beyond a .env file</h2>
<p>A locked-down .env file on one server is a reasonable start. As a system grows, secrets move into a <strong>secret manager</strong>, which stores them encrypted, controls who may read each one, records every access and makes rotation easy: AWS Secrets Manager, Google Secret Manager, Azure Key Vault, HashiCorp Vault, Doppler. Container platforms have a "secrets" or "environment" page that does the same job. The application does not change: it still reads environment variables.</p>
<h2>If a secret leaks</h2>
<p>Deleting it from the file or the commit is not enough, because copies exist. <strong>Rotate</strong> it: issue a new value, deploy it, and revoke the old one. Assume any secret that reached git or a chat message has been read.</p>
<h2>Configuration per environment</h2>
<p>Development, staging and production run the same image with different .env files. That is the whole trick that makes "build once" possible.</p>`,
quiz:[
{q:'Where should a production database password live?',opts:['In the Dockerfile','In the git repository, in .env','On the server or in a secret manager, supplied to the container at start','In the image tag'],a:2,why:'Secrets stay out of the image and out of git, and reach the process as environment variables when it starts.'},
{q:'Why did you remove and re-create the container instead of editing it?',opts:['docker rm is faster','A container\'s environment is fixed when it is created','The image was broken','Docker limits you to one container'],a:1,why:'Environment variables are set at creation. New settings mean a new container from the same image.'},
{q:'What is .env.example for?',opts:['It holds the real production values','It documents which settings exist, without their values, and is safe to commit','It is a backup of .env','Docker reads it automatically'],a:1,why:'The names are documentation. The values are the secret part.'}],
reading:[
['The Twelve-Factor App: Config','https://12factor.net/config','The original argument for keeping configuration in the environment, in a few paragraphs.'],
['FastAPI: Settings and Environment Variables','https://fastapi.tiangolo.com/advanced/settings/','How a FastAPI application reads and validates its settings at start-up.'],
['Set environment variables in Compose (Docker docs)','https://docs.docker.com/compose/how-tos/environment-variables/set-environment-variables/','env_file, environment, and how they combine. Useful for the next lesson.']]},

{id:5,title:'One file for the whole suit',mins:13,
idea:`
<p>The control system is up but degraded: it needs a database beside it. You could start Postgres with a second long <code>docker run</code>, then a network, then a volume, and remember all of it. On a server, <strong>commands you have to remember are a liability.</strong> The next person, or you in three months, cannot see them.</p>
<p>So the suit's entire configuration goes in one file, <code>compose.yml</code>, kept in git. The file is <strong>declarative</strong>: it describes the state you want, and <code>docker compose up -d</code> works out what to create, replace or leave alone. You met Compose in <em>Docker from Zero</em>. Three additions make it fit for production:</p>
<dl class="terms">
<dt>Health check (the self-test)</dt><dd>A command Docker runs inside the container on a timer. It turns "the process exists" into "the application answers correctly". A container is <em>starting</em>, then <em>healthy</em> or <em>unhealthy</em>. On the blueprint this is the visor: dark with no check, amber while starting, lit when healthy, red when unhealthy.</dd>
<dt>Restart policy</dt><dd><code>restart: unless-stopped</code> starts the container again if its process dies or the server reboots.</dd>
<dt>Named volume</dt><dd>Storage that outlives containers. The database's files go here, so replacing the container never loses data.</dd>
</dl>
<p>When the control system is running <em>and</em> its health check passes, the gantry releases the suit. That is the definition of "deployed" this guide uses from here on: <strong>running, and proven healthy.</strong></p>`,
widget:'compose',widgetTitle:'compose.yml, line by line',widgetIntro:'This is deploy/compose.yml, slightly shortened. Tap any line.',
labIntro:'The file is in your repository, in the hangar. First it has to get to the server. Watch the visor (H) and the gantry (G).',
tasks:[
{what:'Read the suit\'s configuration',cmd:'cat deploy/compose.yml',parts:[['cat deploy/compose.yml','The production compose file, kept in the repository with the code.']],
 saw:'Two services, control and db, with a health check and a restart policy on each, and a volume for the database.',test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path==='deploy/compose.yml'},
{what:'Copy it to the server',cmd:'scp deploy/compose.yml pilot@'+IP+':~/kestrel/compose.yml',parts:[['scp','Secure copy: send a file to another machine over SSH.'],['deploy/compose.yml','The file on your workstation.'],['pilot@'+IP+':~/kestrel/compose.yml','The account, the server, and after the colon the path on that server.']],
 saw:'One small text file is now on the server. That file and .env are everything the server needs: no source code is ever copied there.',test:(l,w,r)=>w.srv.files['compose.yml']!==undefined},
T_SSH,
{what:'Remove the hand-started container',cmd:'docker rm -f control',parts:[['docker rm -f','Stop and remove in one step.'],['control','The container from lesson 4. Compose will create its own.']],
 saw:'Removed. It also held port 8000, which the compose stack needs.',test:(l,w,r)=>!w.srv.c['control']},
{what:'Bring the whole suit up',cmd:'docker compose up -d',parts:[['docker compose up','Read compose.yml in this folder and make the running containers match it.'],['-d','In the background.']],
 saw:'Compose pulled Postgres, created a network and a volume, started the database, waited for it to be healthy, then started the control system. On the blueprint the armour reassembles as the new container boots, and the visor turns amber: the self-test has begun.',test:(l,w,r)=>!!w.srv.c['kestrel-control-1']},
{what:'Check the status',cmd:'docker compose ps',parts:[['docker compose ps','List this stack\'s containers with their state and health.']],
 saw:'The control container is "Up" with "health: starting". Docker has not yet finished its first checks, so it will not call it healthy.',test:(l,w,r)=>r.meta.cmd==='compose ps'&&r.meta.health==='starting'},
{what:'Check again',cmd:'docker compose ps',parts:[['docker compose ps','The same command, a few seconds later.']],
 saw:'"healthy". The visor is lit and the gantry clamps have released. This is the first moment the Kestrel is truly deployed.',test:(l,w,r)=>r.meta.cmd==='compose ps'&&r.meta.health==='healthy'},
{what:'Run the self-test yourself',cmd:'curl -s localhost:8000/health',parts:[['/health','The same endpoint Docker\'s health check calls.']],
 saw:'status ok, db connected, version 1.0.0.',test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===200&&w.where==='server'},
{what:'Crash the control system on purpose',cmd:'docker exec kestrel-control-1 kill 1',parts:[['docker exec kestrel-control-1','Run a command inside the running container.'],['kill 1','Stop process number 1, the application itself, as a crash would.']],
 saw:'The process died and the container stopped. Nobody was paged, because the restart policy had already started it again.',test:(l,w,r)=>r.meta.cmd==='exec'&&r.meta.restarted},
{what:'See that it came back',cmd:'docker compose ps',parts:[['docker compose ps','Look at the uptime and health columns.']],
 saw:'Up 2 seconds, health: starting. It restarted by itself and the self-test is running again.',test:(l,w,r)=>r.meta.cmd==='compose ps'&&r.meta.state==='running'},
T_EXIT('The suit keeps itself running now, which is the difference between a demonstration and a deployment.')
],
notes:`<h2>What a health check should test</h2>
<p>A good /health endpoint is cheap and honest: it confirms the application can do its job, which usually means "I am up and I can reach my database". Avoid checks that call other companies' services, or one outage elsewhere will mark you unhealthy. Many systems split this in two: <strong>liveness</strong> (is the process stuck? restart it) and <strong>readiness</strong> (can it take traffic yet? wait). Kubernetes uses exactly those two words.</p>
<h2>Unhealthy is a status, not an action</h2>
<p>Plain Docker marks a container unhealthy and does nothing more. The restart policy reacts to the process <em>exiting</em>, not to a failed check. Acting on health is the job of whatever sits above: a deploy script (lesson 8), a load balancer that stops sending traffic, or an orchestrator such as Kubernetes that replaces the container.</p>
<h2>The data is the part that matters</h2>
<p>Containers and even servers are replaceable. The database volume is not. A real deployment needs <strong>backups</strong> taken on a schedule and stored somewhere other than this server, and a rehearsed restore. Many teams avoid the problem by renting a managed database (Amazon RDS, Cloud SQL, Neon, Supabase) and pointing DATABASE_URL at it.</p>`,
quiz:[
{q:'What does a health check add over "the container is running"?',opts:['It makes the container start faster','It tests that the application answers correctly, not merely that its process exists','It encrypts traffic','It restarts the server'],a:1,why:'A process can be alive and useless. The check asks the application a real question on a timer.'},
{q:'The application process crashes at 3 a.m. What brings it back?',opts:['The health check','The restart policy','docker compose ps','The volume'],a:1,why:'restart: unless-stopped starts the container again whenever its process exits.'},
{q:'Why keep compose.yml in git instead of typing docker run commands on the server?',opts:['docker run is deprecated','The file is a reviewable, repeatable record of exactly what the server should run','Compose is faster','git is required by Docker'],a:1,why:'A file can be read, reviewed, diffed and re-applied. Commands typed into a terminal are gone when the window closes.'}],
reading:[
['Compose file reference: services','https://docs.docker.com/reference/compose-file/services/','Every key used here: image, env_file, depends_on, restart, healthcheck, volumes.'],
['Start containers automatically (Docker docs)','https://docs.docker.com/engine/containers/start-containers-automatically/','The four restart policies and exactly when each one applies.'],
['docker compose up (Docker reference)','https://docs.docker.com/reference/cli/docker/compose/up/','Including --wait, which lesson 8\'s script relies on.']]},

{id:6,title:'A callsign and a scrambler',mins:13,
idea:`
<p>The Kestrel is healthy, but nobody outside can reach it properly. It has a number where a name should be, and it speaks in the clear. This lesson gives it a <strong>callsign</strong> (a domain name) and a <strong>scrambler</strong> (HTTPS). Both live at the comms mast (A) on the blueprint.</p>
<h3>The callsign: DNS</h3>
<p><strong>DNS</strong> is the internet's address book. It turns a name into an IP address. You own a domain, and in your registrar's or DNS provider's dashboard you add one <strong>A record</strong>:</p>
<table class="types"><thead><tr><th>Type</th><th>Name</th><th>Value</th><th>TTL</th></tr></thead><tbody>
<tr><td>A</td><td>kestrel</td><td>203.0.113.7</td><td>300</td></tr></tbody></table>
<p>That reads: "kestrel.hangar-7.dev is at 203.0.113.7; remember this for 300 seconds." A dashboard form is the only step in this guide that is not a command, so the quartermaster has added the record for you. You will verify it from the terminal.</p>
<h3>The scrambler: HTTPS</h3>
<p>Plain HTTP sends everything as readable text, including passwords and tokens. <strong>HTTPS</strong> is HTTP inside an encrypted <strong>TLS</strong> connection. To offer it, a server needs a <strong>certificate</strong>: a file, signed by a trusted authority, proving it really is kestrel.hangar-7.dev. <strong>Let's Encrypt</strong> issues certificates free, automatically, to any server that can prove it controls the name.</p>
<p>You will not teach the application any of this. You put a <strong>reverse proxy</strong> in front of it, the same idea as <em>NGINX from Zero</em>. This guide uses <strong>Caddy</strong>, because it obtains and renews certificates by itself. The proxy takes ports 80 and 443 and handles the encryption (<strong>TLS termination</strong>). The application stops being published at all and is reachable only through the gateway.</p>
<dl class="terms">
<dt>A record</dt><dd>A DNS entry that maps a name to an IPv4 address.</dd>
<dt>Port 80, port 443</dt><dd>The standard ports for HTTP and HTTPS. Browsers use them when no port is given.</dd>
<dt>Firewall</dt><dd>A rule list on the server saying which ports accept connections from outside. A production server opens 22 (SSH), 80 and 443, and nothing else.</dd>
</dl>`,
labIntro:'You start in the hangar. Watch the comms mast (A): it lights when the name resolves and begins transmitting when HTTPS is live.',
tasks:[
{what:'Look the callsign up',cmd:'dig +short '+HOST,parts:[['dig','Ask DNS a question.'],['+short','Print only the answer.'],[HOST,'The name to resolve.']],
 saw:'203.0.113.7, the server\'s address. The A record is in place, so the name now leads to the Kestrel.',test:(l,w,r)=>r.meta.cmd==='dig'&&r.meta.ip===IP},
{what:'Ask for the self-test by name, on the app\'s own port',cmd:'curl -s http://'+HOST+':8000/health',parts:[['http://','Plain HTTP, unencrypted.'],[':8000','The port the compose file publishes. The application is exposed directly to the internet.']],
 saw:'It answers. But look at what you had to type: an odd port, and http. Anything sent this way can be read in transit, and the application server is taking raw internet traffic.',test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.via==='direct'&&r.meta.host===HOST},
{what:'Try the address you actually want',cmd:'curl -s '+PUB+'/health',parts:[[PUB,'https and no port, so port 443.']],
 saw:'Connection refused on port 443. Nothing on the server listens there, and nothing holds a certificate.',test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.refused&&r.meta.port===443},
{what:'Read the gateway\'s configuration',cmd:'cat deploy/Caddyfile',parts:[['cat deploy/Caddyfile','Caddy\'s configuration file.']],
 saw:'Three lines. A site named kestrel.hangar-7.dev, and one instruction: pass requests to the control service on port 8000. Naming the site with a real domain is all Caddy needs to go and get a certificate for it.',test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.path==='deploy/Caddyfile'},
{what:'Send the gateway config to the server',cmd:'scp deploy/Caddyfile pilot@'+IP+':~/kestrel/Caddyfile',parts:[['scp … Caddyfile','Copy the file next to compose.yml on the server.']],
 saw:'Copied.',test:(l,w,r)=>w.srv.files['Caddyfile']!==undefined},
{what:'Send the updated compose file',cmd:'scp deploy/compose.gateway.yml pilot@'+IP+':~/kestrel/compose.yml',parts:[['deploy/compose.gateway.yml','The compose file with a third service, gateway (Caddy), publishing ports 80 and 443. The control service no longer has a ports section.'],['…:~/kestrel/compose.yml','It replaces the file on the server.']],
 saw:'The server\'s compose.yml now describes three services. Nothing has changed on the server yet: a file is a description, not an action.',test:(l,w,r)=>w.srv.files['compose.yml']===FILES.laptop['deploy/compose.gateway.yml']},
T_SSH,
{what:'Apply the new description',cmd:'docker compose up -d',parts:[['docker compose up -d','Compare the file with what is running, and change only what differs.']],
 saw:'Compose left the database alone, re-created the control container without its published port, and started the gateway. On the blueprint the comms mast is transmitting.',test:(l,w,r)=>!!w.srv.c['kestrel-gateway-1']},
{what:'See how the gateway got its certificate',cmd:'docker compose logs gateway',parts:[['docker compose logs gateway','The log of one service in the stack.']],
 saw:'Caddy asked Let\'s Encrypt for a certificate, solved a challenge proving it controls the name, and received one. It will renew it automatically before it expires. You configured none of that.',test:(l,w,r)=>r.meta.cmd==='logs'&&r.meta.svc==='gateway'},
{what:'Check the firewall',cmd:'sudo ufw status',parts:[['sudo','As root.'],['ufw status','Show the firewall\'s rules. ufw is Ubuntu\'s "uncomplicated firewall".']],
 saw:'Three ports are open: 22 for SSH, 80 and 443 for the gateway. Port 8000 is not on the list.',test:(l,w,r)=>r.meta.cmd==='ufw'},
T_EXIT(),
{what:'Call the Kestrel by its callsign, scrambled',cmd:'curl -si '+PUB+'/health',parts:[['-i','Show the response\'s status line and headers.'],[PUB+'/health','https, the name, no port.']],
 saw:'HTTP/2 200, with "via: 1.1 Caddy" in the headers. The request was encrypted to the gateway, which passed it to the control system inside the server. This is a real public address.',test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.via==='gateway'&&r.meta.status===200},
{what:'Try the old side door',cmd:'curl -s http://'+HOST+':8000/health',parts:[[':8000','The port that worked at the start of this lab.']],
 saw:'Refused. The application is no longer exposed. The only way in is through the gateway, over HTTPS.',test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.refused&&r.meta.port===8000}
],
notes:`<h2>How the certificate was earned</h2>
<p>Let's Encrypt will only sign a certificate for a name if the requester proves control of it. Caddy does this with the ACME protocol: it is given a challenge, answers it on port 443 or 80 at that name, and Let's Encrypt connects to check. This is why DNS had to point at the server <em>first</em>, and why ports 80 and 443 must be open.</p>
<h2>Plain HTTP still arrives</h2>
<p>Someone will type the address without https. Caddy answers on port 80 with a redirect to the https address, so nobody stays unencrypted. Try <code>curl -si http://kestrel.hangar-7.dev/health</code> to see the 308.</p>
<h2>DNS takes time</h2>
<p>A new or changed record is not seen everywhere at once. Resolvers remember answers for the record's TTL. Set a short TTL before a planned move, and expect a wait of minutes, occasionally hours.</p>
<h2>A service in front of the gateway</h2>
<p>Many products put a network such as Cloudflare in front of the server. DNS then points at Cloudflare, which terminates TLS at its edge, filters attacks, caches, and forwards to your server. The pieces are the ones in this lesson, one step further out.</p>`,
quiz:[
{q:'What does an A record do?',opts:['Encrypts traffic','Maps a domain name to an IP address','Opens a firewall port','Issues a certificate'],a:1,why:'DNS answers "where is this name?". An A record is that answer for IPv4.'},
{q:'Where is HTTPS handled in this setup?',opts:['Inside the FastAPI application','At the gateway (reverse proxy), which passes plain HTTP to the application inside the server','In the database','In the registry'],a:1,why:'That is TLS termination. The application stays simple, and certificates are managed in one place.'},
{q:'Why did DNS have to point at the server before a certificate could be issued?',opts:['Certificates contain the IP address','Let\'s Encrypt verifies control of the name by connecting to it','Caddy needs DNS to start','It did not have to'],a:1,why:'The authority checks the challenge at the name. If the name does not lead to your server, the proof fails.'}],
reading:[
['What is DNS? (Cloudflare)','https://www.cloudflare.com/learning/dns/what-is-dns/','How a name becomes an address, with the record types.'],
['How Let\'s Encrypt works','https://letsencrypt.org/how-it-works/','Domain validation and certificate issuance, illustrated.'],
['Caddy: Automatic HTTPS','https://caddyserver.com/docs/automatic-https','What Caddy does on your behalf, and the conditions that have to hold.']]},

{id:7,title:'A new release, and the retreat',mins:12,
idea:`
<p>Software is never deployed once. The crew has finished version <strong>1.1.0</strong> of the control system, and it has to replace 1.0.0 on a suit that is in service.</p>
<p>Everything you set up makes that a small act. The compose file takes its image tag from a variable, so a release is:</p>
<pre class="file">TAG=1.1.0 docker compose up -d</pre>
<p>Compose sees that the control service should now run a different image, pulls it, and replaces the one container. The database, the gateway and the keys are untouched.</p>
<p>And sometimes the new release is bad. This one is. What matters then is how fast you can be back on a version that worked. That is a <strong>rollback</strong>, the suit's <strong>retreat</strong> to its <strong>standby core</strong> (S), and because every release has its own tag and the old image is still on the server, it is the same command with the old number.</p>
<dl class="terms">
<dt>Rollback</dt><dd>Deploying the previous known-good release again.</dd>
<dt>Immutable release</dt><dd>A tag that never changes its contents. It is what makes "go back to 1.0.0" mean something.</dd>
<dt>Downtime</dt><dd>The time during which requests fail. Replacing one container on one server causes a second or two of it.</dd>
<dt>Roll forward</dt><dd>The alternative to rolling back: fix the bug and ship a newer release (1.1.1). Roll back first to stop the damage, then roll forward calmly.</dd>
</dl>`,
labIntro:'You start in the hangar. Watch the standby core (S, the wing binders) and the visor.',
tasks:[
{what:'Build and push release 1.1.0',cmd:'docker build -t '+V11+' . && docker push '+V11,parts:[['docker build -t …:1.1.0 .','Build the new version under a new tag.'],['&&','Only if the build succeeded…'],['docker push …:1.1.0','…shelve it in the armoury.']],
 saw:'1.1.0 is in the armoury beside 1.0.0. Nothing on the Kestrel has changed: pushing an image deploys nothing.',test:(l,w,r)=>w.reg.tags.includes('1.1.0')},
T_SSH,
{what:'Deploy 1.1.0',cmd:'TAG=1.1.0 docker compose up -d',parts:[['TAG=1.1.0','Set the TAG variable for this one command. The compose file\'s ${TAG:-1.0.0} picks it up.'],['docker compose up -d','Make the running stack match the file. Only the control service differs.']],
 saw:'The image came down the cable and the control container was re-created. 1.0.0 moved to the standby core: its image is still on the server. The gantry has locked again while the self-test runs.',test:(l,w,r)=>ctl(w).tag==='1.1.0'},
{what:'Check the status',cmd:'docker compose ps',parts:[['docker compose ps','State and health of each container.']],
 saw:'health: starting. So far this looks exactly like a good deploy.',test:(l,w,r)=>r.meta.cmd==='compose ps'&&ctl(w).tag==='1.1.0'},
{what:'Ask the public address',cmd:'curl -si '+PUB+'/health',parts:[['curl -si','Status line, headers and body.']],
 saw:'HTTP/2 503 and "status: failing". The visor is red. Release 1.1.0 is running, and broken, in production.',test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.status===503&&r.meta.via==='gateway'},
{what:'Find out why',cmd:'docker compose logs control',parts:[['docker compose logs control','The control service\'s log.']],

notes:`<h2>What went wrong with the process</h2>
<p>You deployed, then went to look. For a few moments production was broken and only your curiosity found out. A deployment should <strong>check health itself and retreat automatically</strong>. That is the script in the next lesson.</p>
<h2>Zero-downtime deploys</h2>
<p>Replacing the only container means a brief gap. Systems that cannot afford it start the new version <em>beside</em> the old one, check it, then move traffic:</p>
<ul>
<li><strong>Rolling update:</strong> replace copies one at a time behind a load balancer. This is what Kubernetes does by default.</li>
<li><strong>Blue-green:</strong> run two complete environments. Deploy to the idle one, test it, switch the gateway over. Rolling back is switching back.</li>
<li><strong>Canary:</strong> send a small share of real traffic to the new version first and watch the error rate.</li>
</ul>
<p>All three need more than one copy of the application, which is where <em>NGINX from Zero</em> and <em>Kubernetes from Zero</em> pick up.</p>
<h2>Databases do not roll back so easily</h2>
<p>Code can go back in seconds. A database change that dropped a column cannot. The working rule is <strong>backward-compatible migrations</strong>: a release may add tables and columns, but must still work with the previous release's code. Removing things is done in a later release, once nothing uses them. And take a backup before any migration.</p>`,
quiz:[
{q:'In this setup, what is a rollback?',opts:['Restoring the server from a backup','Running the same deploy command with the previous release\'s tag','Deleting the new image from the registry','Restarting the gateway'],a:1,why:'Because tags are immutable and the old image is still on the server, going back is one ordinary deploy.'},
{q:'You pushed 1.1.0 to the registry. What changed on the server at that moment?',opts:['The control system restarted on 1.1.0','Nothing. The server runs what it was last told to run','The health check failed','The database was migrated'],a:1,why:'Pushing only stores an image. Deploying is the separate act of telling the server to run it.'},
{q:'Why is rolling back a database change harder than rolling back code?',opts:['Databases are slower','Data that was changed or deleted is not restored by running older code','Postgres does not support versions','It is not harder'],a:1,why:'Old code is a file you still have. Old data, once altered, is gone unless you kept a backup, which is why migrations are designed to be backward compatible.'}],

{id:8,title:'The hangar crew: continuous deployment',mins:13,
idea:`
<p>You can now deploy by hand: build, push, board the suit, set the tag, bring it up, check health, retreat if needed. Six steps a person can forget or mistype, done from one person's workstation, with one person's access to production.</p>
<p><strong>Continuous deployment (CD)</strong> gives those steps to a machine. It extends the pipeline from <em>CI from Zero</em>: the same GitHub Actions runner that tests your code goes on to build the image, push it and deploy it. In the story this is <strong>the hangar crew</strong>. You hand them a version number, and they do the rest and report back.</p>
<p>The trigger is a <strong>git tag</strong>. Tagging a commit <code>1.1.1</code> and pushing the tag says "this exact commit is release 1.1.1". The workflow then runs three jobs in order, each only if the one before passed:</p>
<ol>
<li><strong>test:</strong> run the test suite.</li>
<li><strong>build:</strong> build the image and push it to the registry with that tag.</li>
<li><strong>deploy:</strong> connect to the server over SSH and run <code>deploy.sh</code>, which brings the new version up, waits for the health check, and retreats to the previous release if it fails.</li>
</ol>
<dl class="terms">
<dt>Pipeline</dt><dd>An ordered set of automated jobs between a change and production.</dd>
<dt>Repository secret</dt><dd>A value stored encrypted in the repository's settings and handed to workflow runs. The deploy SSH key lives there, not on anyone's laptop.</dd>
<dt>Deploy key</dt><dd>An SSH key that belongs to the pipeline. It can be revoked without locking a person out.</dd>
<dt>Continuous delivery / deployment</dt><dd><em>Delivery</em>: every change is built and ready, and a person presses the button. <em>Deployment</em>: the button presses itself. A tag-triggered release sits between the two.</dd>
</dl>`,

notes:`<h2>What you have built</h2>
<p>A commit is tagged. A pipeline tests it, packages it as an immutable image, stores it in a registry, and deploys it to a server that holds its own secrets, checks its own health, restarts itself, serves HTTPS on a real name, and falls back to the last good release without anyone awake. Each platform names these parts differently, but they are present in every one.</p>
<h2>Staging</h2>
<p>The 1.2.0 bug reached production before the health check caught it. A <strong>staging</strong> environment is a second, smaller Kestrel that receives every release first. The pipeline deploys there, runs the Playwright tests from <em>Playwright + pytest from Zero</em> against it, and only then goes on to production, often after a person approves.</p>
<h2>Seeing what production is doing</h2>
<p>A health check tells you "up" or "down". <strong>Observability</strong> covers the rest: <strong>logs</strong> collected in one searchable place, <strong>metrics</strong> such as request rate, error rate and latency on a dashboard, and <strong>alerts</strong> that reach a person when those cross a line. An external uptime monitor that requests /health every minute is the cheapest useful first step.</p>
<h2>The same pipeline on a platform</h2>
<table class="types"><thead><tr><th>You did</th><th>On a container platform</th></tr></thead><tbody>
<tr><td>docker build and push</td><td>The same, or the platform builds from your repository</td></tr>
<tr><td>.env on the server</td><td>The platform's environment or secrets page</td></tr>
<tr><td>compose.yml, restart policy</td><td>A service definition. Restarts are built in</td></tr>
<tr><td>healthcheck</td><td>A health check path you fill in</td></tr>
<tr><td>Caddy, DNS, certificate</td><td>"Add custom domain". HTTPS is automatic</td></tr>
<tr><td>deploy.sh with rollback</td><td>Rolling deploys that keep the old version until the new one is healthy</td></tr>
</tbody></table>
<h2>Least privilege</h2>
<p>The pipeline holds a key to production, so treat it as you would a person with that access: a dedicated deploy account, a key that can do only what deploying needs, required reviews on the workflow file, and an approval rule on the production environment.</p>`,

function el(tag,attrs,...kids){
  const n=document.createElement(tag);

}

    nav.append(el('a',{href:'#lesson-'+L.id,class:'nav-item'+(active===L.id?' active':'')+(lessonDone(L)?' done':''),'aria-current':active===L.id?'page':null},

function annotated(box,notes,label){
  const pre=el('div',{class:'code-lines',role:'group','aria-label':label}),panel=el('div',{class:'explain','aria-live':'polite'});

function flow(box,steps){
  let i=0;const row=el('div',{class:'flow'}),panel=el('div',{class:'explain','aria-live':'polite'}),btns=[];
  const next=el('button',{type:'button',class:'btn next',text:'Next',onclick:()=>{i=(i+1)%steps.length;draw();}});
  steps.forEach((s,k)=>{const b=el('button',{type:'button',class:'fstep',onclick:()=>{i=k;draw();}},el('span',{class:'fnum',text:'step '+(k+1)}),el('span',{class:'ft',text:s[0]}),el('span',{class:'fs',text:s[1]}));btns.push(b);row.append(b);});
  function draw(){btns.forEach((b,k)=>{b.setAttribute('aria-pressed',k===i);b.classList.toggle('past',k<i);});

const KNAME={C:'cockpit core',K:'key slot',H:'visor',A:'comms mast',U:'uplink',S:'standby core',G:'gantry',R:'reactor'};
function kStatus(v){
  const c=v.core,hp=c.state!=='running'?'none':!c.checked?'none':c.health==='starting'?'starting':c.health==='healthy'?'healthy':'bad';
  return {hp,
    C:c.state==='running'?[c.ok?'on':'warn','running '+c.tag]:c.state==='crashed'?['bad','exited']:['off','empty'],
    K:v.srv.env?(v.srv.envMode==='600'?['on','.env locked']:['warn','.env open']):['off','no .env'],
    H:hp==='healthy'?['on','healthy']:hp==='bad'?['bad','unhealthy']:hp==='starting'?['warn','starting']:['off','no check'],
    A:v.tls?['on','HTTPS']:v.dns?['warn','DNS only']:['off','no DNS'],
    U:v.srv.images.length?['on',v.srv.images.join(', ')+' aboard']:['off','nothing pulled'],
    S:v.srv.standby?['on',v.srv.standby]:['off','none'],
    G:v.gantry==='open'?['on','released']:['warn','locked'],
    R:v.srv.n?['on',v.srv.n+' running']:['off','idle']};
}
function kestrel(v,fx,refit,gmove,chg){
  chg=chg||new Set();const KS=kStatus(v);
  const P=(pts,cls)=>'<path class="'+cls+'" d="M'+pts.split('|').join(' L')+' z"/>';
  const L=(d,cls)=>'<path class="'+(cls||'ln')+'" d="'+d+'"/>';
  const both=h=>h+'<g transform="translate(400,0) scale(-1,1)">'+h+'</g>';
  const has=k=>fx.some(x=>x.k===k);

      stage('3 · Kestrel','running on the server',c.state==='empty'?el('span',{class:'empty',text:'—'}):[chip(c.tag,c.state==='running'?(hp==='bad'||!c.ok?'bad':'ix'):'bad'),v.srv.standby?chip('standby '+v.srv.standby,'vol'):null],has('boot')||has('rollback')),el('span',{class:'arrowr','aria-hidden':'true',text:'→'}),
      stage('4 · Public',v.pub==='https'?'https://'+HOST:v.pub==='http'?'http://'+(v.dns?HOST:IP)+':8000, unencrypted':'not reachable from outside',v.pub==='https'?chip(v.live?'live':'failing',v.live?'ix':'bad'):v.pub==='http'?chip('exposed','vol'):el('span',{class:'empty',text:'—'}),fx.some(x=>x.k==='req'&&x.pub)),
      last?stage('Pipeline','last run: '+last.tag,chip(last.status,last.status==='success'?'ix':last.status==='failure'?'bad':'vol')):null)));
    seenStamp=v.stamp;
  }
  function reset(clearTerm){
    sim=createSim(simId);skipped.clear();runId++;busy=false;seenStamp=-1;lastGantry=null;prevSt=null;lastFx=[];lastChg=new Set();form.classList.remove('busy');input.disabled=false;if(clearTerm)term.textContent='';
    print('A simulated terminal. Nothing is run on your device or on any real server: the workstation, the registry, the server and GitHub all live in this page. Press help for what the sandbox understands.','note');
    print('You start in the hangar: your own workstation, in the project folder ~/control. The server is at '+IP+'. '+(sim.world.srv.c['kestrel-control-1']?'It is running release '+sim.world.srv.c['kestrel-control-1'].tag+'.':sim.world.srv.c['control']?'It has one hand-started container.':'Nothing is deployed on it yet.'),'note');
    setPrompt();drawTasks();drawMap(null);

  }
  let busy=false,runId=0;
  /* output arrives one line at a time, and the newest line is kept in view */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function showLine(text,cls){const d=el('div',{class:'tl '+(cls||''),text:text});term.append(d);term.scrollTop=term.scrollHeight;term.scrollLeft=0;return d;}
  async function printOut(text,cls,id){
    if(text==='')return;
    const lines=text.split('\n'),gap=Math.max(16,Math.min(90,2000/lines.length));
    for(let n=0;n<lines.length;n++){
      const ln=lines[n],c0=ln.charCodeAt(0);
      if(c0===2){const ms=+ln.slice(1)||300;const d=showLine('…','wait');await sleep(ms);d.remove();}
      else if(c0===3){const k=ln.indexOf('|'),ms=+ln.slice(1,k)||300,label=ln.slice(k+1),fill=el('span',{class:'fill'}),lab=el('span',{text:label.replace(/(Pull complete|Pushed|Pulled)$/,m=>m==='Pulled'?'Pulling':m==='Pushed'?'Pushing':'Downloading')});
        const d=el('div',{class:'tl prog'},lab,el('span',{class:'track'},fill));term.append(d);term.scrollTop=term.scrollHeight;
        const t0=Date.now();while(Date.now()-t0<ms){fill.style.width=Math.min(100,(Date.now()-t0)/ms*100)+'%';await sleep(60);if(id!==runId)return;}
        d.className='tl';d.textContent=label;if(n<lines.length-1)await sleep(40);}
      else{showLine(ln,/^sandbox:/.test(ln)?'note':cls);if(n<lines.length-1)await sleep(gap);}

  function keepInView(){if(WIDE.matches)return;const b=form.getBoundingClientRect();if(b.bottom>window.innerHeight||b.top<80)form.scrollIntoView({block:'end',behavior:'smooth'});}
  async function runLine(){
    if(busy)return;

    const id=runId;busy=true;form.classList.add('busy');input.disabled=true;
    const soft=/^(curl|push|watch|ps|run)$/.test(r.meta.cmd||'');
    drawMap(r.meta.fx||[]);
    await printOut(r.out,r.ok||soft?'':'err',id);
    if(id!==runId)return;
    busy=false;form.classList.remove('busy');input.disabled=false;setPrompt();
    if(cur<tasks.length){
      const l=norm1(line);let pass=false,jump=0;try{pass=!!tasks[cur].test(l,sim.world,r);}catch(e){}

        if(ok){skipped.delete(s);print('✓ Step '+(s+1)+' of '+tasks.length+' done. '+tasks[s].saw,'ok');drawTasks();break;}}
      if(pass){
        const t=tasks[cur];cur++;
        print('✓ Step '+cur+' of '+tasks.length+' done'+(jump?' ('+jump+' earlier step'+(jump>1?'s':'')+' skipped). ':'. ')+t.saw,'ok');
        if(cur>=tasks.length){saved.done[L.id]=true;save();renderNav(L.id);print('✓ Lesson '+L.id+' lab complete.','ok');}
        drawTasks();
        if(WIDE.matches){const n=$('.task.now',list)||banner;if(n.scrollIntoView)n.scrollIntoView({block:'nearest'});}
      }else if(l===norm1(tasks[cur].cmd))print('That was the right command, but the step is not done yet. Read the output above: something it depends on has not happened yet. Running it again often does it.','note');
      else if(!r.ok&&!soft)print('Hint: read the message above. This step is waiting for: '+tasks[cur].cmd,'note');
    }
    if(WIDE.matches)input.focus();

  }
  input.addEventListener('keydown',e=>{

    else if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);input.value=hist[hi];}
    else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);input.value=hist[hi]||'';}
  });
  if(sec&&tasks.length)sec.append(el('p',{text:L.labIntro}),list,banner);
  const bench=el('div',{class:'bench-in'},
    el('section',{class:'map','aria-label':'Deployment status'},el('div',{class:'map-head'},el('b',{text:'Deploy status'}),statusEl),map,strip),
    stepbar,
    el('section',{class:'term','aria-label':'Terminal'},el('div',{class:'term-bar'},termTitle,el('span',{class:'row'},el('button',{type:'button',class:'mini dark',text:'help',onclick:()=>{if(!busy)print(sim.help,'note');}}),el('button',{type:'button',class:'mini dark',text:'reset',onclick:()=>{if(cur<tasks.length)cur=0;reset(true);}}))),term,form));
  reset(false);
  return bench;
}

/* ----- quiz ----- */
function quiz(L,sec){
  L.quiz.forEach((q,i)=>{
    const key=L.id+'-'+i,fb=el('p',{class:'fb','aria-live':'polite'}),opts=el('div',{class:'opts'});

      q.opts.forEach((o,k)=>opts.append(el('button',{type:'button',class:'opt'+(ch===k?(k===q.a?' right':' wrong'):''),'aria-pressed':ch===k,text:o,onclick:()=>{saved.quiz[key]=k;save();draw();renderNav(L.id);}})));
      fb.className='fb'+(ch==null?'':ch===q.a?' good':' bad');
      fb.textContent=ch==null?'':ch===q.a?'Correct. '+q.why:'Not quite. Have another look at the options, or re-read the section above.';
    }
    sec.append(el('div',{class:'q'},el('p',{class:'qt',text:(i+1)+'. '+q.q}),opts,fb));draw();
  });
}
