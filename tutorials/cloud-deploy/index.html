<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Deploy from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Shared guide engine styles, then this guide's additions at the end. Layout idea: lesson on the left; on the right a live schematic of the Kestrel's compute bay (the balancer's orders, the path each command takes to a core, the energy it cost) above a terminal that changes it. One dark terminal world; on phones the map-and-terminal bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:attr(data-p) " ";color:var(--term-dim)}
.ran::before{content:attr(data-p) " ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-tables{border-top-color:var(--good)}.z-session{border-top-color:var(--accent)}.z-databases{border-top-color:var(--warn)}.z-roles{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-tables .zlist{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}

<script>
const FILES={"laptop": {"Dockerfile": "# The recipe for the control system's image.\nFROM python:3.13-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY app ./app\nEXPOSE 8000\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n", ".env.example": "# Settings the control system needs at boot. Copy to .env and fill in.\n# .env is listed in .gitignore: real values never go into git or the image.\nKESTREL_ENV=\nDATABASE_URL=\nPOSTGRES_PASSWORD=\nPILOT_KEY=\nLOG_LEVEL=\n", "requirements.txt": "fastapi\nuvicorn[standard]\npsycopg[binary]\n", "app/main.py": "from fastapi import FastAPI\nfrom .config import settings      # reads the environment; fails loudly if a setting is missing\nfrom .selftest import run_self_test\n\napp = FastAPI(title=\"kestrel-control\")\n\n@app.get(\"/health\")\ndef health():\n    return run_self_test()        # 200 when every subsystem answers, 503 otherwise\n\n@app.get(\"/version\")\ndef version():\n    return {\"version\": settings.version}\n", "deploy/compose.yml": "# The Kestrel's flight systems. Lives on the server as ~/kestrel/compose.yml\nservices:\n  control:\n    image: ghcr.io/hangar-7/control:${TAG:-1.0.0}\n    env_file: .env\n    ports:\n      - \"8000:8000\"\n    depends_on:\n      db:\n        condition: service_healthy\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"python\", \"-c\", \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\"]\n      interval: 10s\n      timeout: 3s\n      retries: 3\n\n  db:\n    image: postgres:17\n    env_file: .env\n    environment:\n      POSTGRES_USER: control\n      POSTGRES_DB: kestrel\n    volumes:\n      - dbdata:/var/lib/postgresql/data\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U control -d kestrel\"]\n      interval: 5s\n\nvolumes:\n  dbdata:\n", "deploy/compose.gateway.yml": "# The Kestrel's flight systems. Lives on the server as ~/kestrel/compose.yml\nservices:\n  control:\n    image: ghcr.io/hangar-7/control:${TAG:-1.0.0}\n    env_file: .env\n    depends_on:\n      db:\n        condition: service_healthy\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"python\", \"-c\", \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\"]\n      interval: 10s\n      timeout: 3s\n      retries: 3\n\n  db:\n    image: postgres:17\n    env_file: .env\n    environment:\n      POSTGRES_USER: control\n      POSTGRES_DB: kestrel\n    volumes:\n      - dbdata:/var/lib/postgresql/data\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U control -d kestrel\"]\n      interval: 5s\n\n  gateway:\n    image: caddy:2\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./Caddyfile:/etc/caddy/Caddyfile:ro\n      - caddydata:/data\n    depends_on:\n      - control\n    restart: unless-stopped\n\nvolumes:\n  dbdata:\n  caddydata:\n", "deploy/Caddyfile": "kestrel.hangar-7.dev {\n    reverse_proxy control:8000\n}\n", "deploy/deploy.sh": "#!/usr/bin/env bash\n# Usage: ./deploy.sh TAG\n# Runs on the Kestrel. Deploys TAG, and retreats if the self-test fails.\nset -euo pipefail\ncd ~/kestrel\nNEW=\"$1\"\nOLD=\"$(cat .release 2>/dev/null || echo 1.0.0)\"\n\necho \"deploying $NEW (standby: $OLD)\"\nTAG=\"$NEW\" docker compose pull control\n\nif TAG=\"$NEW\" docker compose up -d --wait --wait-timeout 60; then\n  echo \"$NEW\" > .release\n  echo \"healthy: $NEW is live\"\n  exit 0\nfi\n\necho \"self-test failed: retreating to $OLD\"\nTAG=\"$OLD\" docker compose up -d --wait\nexit 1\n", ".github/workflows/deploy.yml": "name: deploy\non:\n  push:\n    tags: [\"*.*.*\"]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: pip install -r requirements.txt && pytest\n\n  build:\n    needs: test\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n      packages: write\n    steps:\n      - uses: actions/checkout@v4\n      - uses: docker/login-action@v3\n        with:\n          registry: ghcr.io\n          username: ${{ github.actor }}\n          password: ${{ secrets.GITHUB_TOKEN }}\n      - uses: docker/build-push-action@v6\n        with:\n          push: true\n          tags: ghcr.io/hangar-7/control:${{ github.ref_name }}\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment: production\n    steps:\n      - name: Run deploy.sh on the Kestrel\n        run: |\n          echo \"${{ secrets.DEPLOY_SSH_KEY }}\" > key && chmod 600 key\n          ssh -i key pilot@203.0.113.7 \"./kestrel/deploy.sh ${{ github.ref_name }}\"\n"}, "server": {".env.example": "# Settings the control system needs at boot. Copy to .env and fill in.\n# .env is listed in .gitignore: real values never go into git or the image.\nKESTREL_ENV=\nDATABASE_URL=\nPOSTGRES_PASSWORD=\nPILOT_KEY=\nLOG_LEVEL=\n", "keys/production.env": "KESTREL_ENV=production\nDATABASE_URL=postgresql://control:x7Lq-example-only@db:5432/kestrel\nPOSTGRES_PASSWORD=x7Lq-example-only\nPILOT_KEY=pk_live_example_9f2c41d7\nLOG_LEVEL=info\n"}};
/* ---------- The sandbox: your workstation in the hangar, a registry, and one rented server. Files are data, so what you read and what the sandbox runs cannot drift apart ---------- */
const IMG='ghcr.io/hangar-7/control',HOST='kestrel.hangar-7.dev',IP='203.0.113.7',SSH='ssh pilot@'+IP;
const REL={'1.0.0':{ok:true},'1.1.0':{ok:false,err:'self-test failed: gyro calibration table missing (config/gyro.json)'},'1.1.1':{ok:true},'1.2.0':{ok:false,err:'self-test failed: thruster map has 5 entries, expected 6'}};
const relOf=t=>REL[t]||{ok:true};
const idOf=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16).padStart(8,'0')+((h*31)>>>0).toString(16).padStart(8,'0').slice(0,4);};

function createSim(upto){
  const w={where:'laptop',stamp:0,booting:false,dns:upto>=6,
    lap:{files:Object.assign({},FILES.laptop),images:{},login:false,tags:[]},
    reg:{tags:[]},
    srv:{files:Object.assign({},FILES.server),mode:{},images:{},c:{},net:false,vol:false,standby:null,cert:false},
    runs:[],fx:[]};
  const WAIT=ms=>'\u0002'+Math.max(1,Math.round(w.booting?1:ms));
  const PROG=(ms,label)=>'\u0003'+Math.max(1,Math.round(w.booting?1:ms))+'|'+label;
  const E=(out,meta)=>({ok:false,out:Array.isArray(out)?out.join('\n'):out,meta:meta||{}}),OK=(out,meta)=>({ok:true,out:Array.isArray(out)?out.join('\n'):(out||''),meta:meta||{}});
  const fx=(k,o)=>w.fx.push(Object.assign({k},o||{}));
  const here=()=>w.where==='laptop'?w.lap:w.srv;
  const table=rows=>{const wd=rows[0].map((_,i)=>Math.max(...rows.map(r=>String(r[i]).length))+3);return rows.map(r=>r.map((x,i)=>String(x).padEnd(wd[i])).join('').trimEnd());};
  const C=()=>w.srv.c;
  const control=()=>C()['kestrel-control-1']||C()['control']||null;
  const gateway=()=>{const g=C()['kestrel-gateway-1'];return g&&g.state==='running'?g:null;};
  const dbUp=()=>{const d=C()['kestrel-db-1'];return !!(d&&d.state==='running');};

  /* ----- the control system answering one request ----- */
  function app(c,path){
    const rel=relOf(c.tag);
    if(path==='/health'){
      if(!rel.ok)return {status:503,body:JSON.stringify({status:'failing',system:'kestrel-control',version:c.tag,error:rel.err})};
      if(!dbUp())return {status:503,body:JSON.stringify({status:'degraded',system:'kestrel-control',version:c.tag,db:'unreachable'})};
      return {status:200,body:JSON.stringify({status:'ok',system:'kestrel-control',version:c.tag,db:'connected'})};
    }
    if(path==='/version')return {status:200,body:JSON.stringify({version:c.tag})};
    if(path==='/')return {status:200,body:JSON.stringify({system:'kestrel-control',message:rel.ok?'all systems nominal':'self-test failing'})};
    return {status:404,body:'{"detail":"Not Found"}'};
  }
  const healthOf=c=>app(c,'/health').status===200?'healthy':'unhealthy';
  const REASON={200:'OK',308:'Permanent Redirect',404:'Not Found',502:'Bad Gateway',503:'Service Unavailable'};
  function parseUrl(u){const m=/^(?:(https?):\/\/)?([^\/:?]+)(?::(\d+))?(\/[^?]*)?/.exec(u||'');if(!m)return null;const scheme=m[1]||'http';return {scheme,host:m[2],port:+(m[3]||(scheme==='https'?443:80)),path:m[4]||'/'};}

  function curl(a){
    let flags='',url=null;
    for(const x of a){if(/^-[a-zA-Z]+$/.test(x)){if(/[^siI]/.test(x.slice(1)))return E('sandbox: this curl understands -s (quiet), -i (show the response headers) and -I (headers only).');flags+=x.slice(1);}else if(x.startsWith('--'))return E('curl: option '+x+': is unknown');else url=x;}
    if(!url)return E("curl: (2) no URL specified");
    const U=parseUrl(url);if(!U)return E('curl: (3) URL rejected: Malformed input to a URL function');
    const refused=()=>E('curl: (7) Failed to connect to '+U.host+' port '+U.port+' after 0 ms: Could not connect to server',{cmd:'curl',refused:true,port:U.port,host:U.host});
    let r=null,via=null;const local=U.host==='localhost'||U.host==='127.0.0.1';
    if(local&&w.where==='laptop'){
      if(U.port!==8000||U.scheme==='https')return refused();
      r=app({tag:'dev',dev:true},U.path);r=U.path==='/health'?{status:200,body:JSON.stringify({status:'ok',system:'kestrel-control',version:'dev',db:'connected'})}:r;via='dev';
    }else{
      if(!local){
        if(U.host!==HOST&&U.host!==IP)return E('curl: (6) Could not resolve host: '+U.host,{cmd:'curl',dnsfail:true});
        if(U.host===HOST&&!w.dns)return E('curl: (6) Could not resolve host: '+U.host,{cmd:'curl',dnsfail:true,host:U.host});
      }
      const g=gateway(),c=control();
      if(U.port===443&&U.scheme==='https'&&g&&!local&&U.host===HOST){
        via='gateway';if(c&&c.state==='running'){r=app(c,U.path);fx('req',{ok:r.status===200,pub:true});}else{r={status:502,body:''};fx('req',{ok:false,pub:true});}
      }else if(U.port===80&&g&&U.scheme==='http'){r={status:308,body:'',loc:'https://'+HOST+U.path};via='redirect';}
      else if(U.port===8000&&c&&c.state==='running'&&c.ports.includes(8000)){
        if(U.scheme==='https')return E('curl: (35) TLS connect error: error:0A00010B:SSL routines::wrong version number\n\nsandbox: port 8000 speaks plain HTTP. Nothing on it can do HTTPS.',{cmd:'curl'});
        r=app(c,U.path);via='direct';fx('req',{ok:r.status===200,pub:!local});
      }else{if(!local)fx('req',{ok:false,pub:true,dead:true});return refused();}
    }
    const out=[],hd=/[iI]/.test(flags);
    if(hd){
      if(via==='gateway')out.push('HTTP/2 '+r.status,'alt-svc: h3=":443"; ma=2592000','content-type: application/json','date: Sat, 14 Nov 2026 10:42:07 GMT','server: uvicorn','via: 1.1 Caddy','content-length: '+r.body.length);
      else if(via==='redirect')out.push('HTTP/1.1 308 Permanent Redirect','Connection: close','Location: '+r.loc,'Server: Caddy','Date: Sat, 14 Nov 2026 10:42:07 GMT','Content-Length: 0');
      else out.push('HTTP/1.1 '+r.status+' '+REASON[r.status],'date: Sat, 14 Nov 2026 10:42:07 GMT','server: uvicorn','content-length: '+r.body.length,'content-type: application/json');
      out.push('');
    }
    if(!/I/.test(flags)&&r.body)out.push(r.body);
    return OK(out,{cmd:'curl',status:r.status,via,path:U.path,host:U.host,port:U.port,scheme:U.scheme,version:(()=>{try{return JSON.parse(r.body).version;}catch(e){return null;}})()});
  }

  /* ----- images ----- */
  const splitRef=ref=>{const i=ref.lastIndexOf(':');return i>ref.lastIndexOf('/')?[ref.slice(0,i),ref.slice(i+1)]:[ref,'latest'];};
  const known=ref=>ref==='postgres:17'||ref==='caddy:2'||(ref.startsWith(IMG+':')&&w.reg.tags.includes(ref.slice(IMG.length+1)));
  function pullLines(ref,quietIfHave){
    const [name,tag]=splitRef(ref);
    if(w.srv.images[ref])return quietIfHave?[]:[tag+': Pulling from '+name.replace(/^ghcr\.io\//,''),'Digest: sha256:'+idOf(ref)+idOf(ref+'x')+'…','Status: Image is up to date for '+ref,ref];
    w.srv.images[ref]=true;if(ref.startsWith(IMG))fx('pull',{tag});w.stamp++;
    return [tag+': Pulling from '+(name.includes('/')?name.replace(/^ghcr\.io\//,''):'library/'+name),PROG(900,idOf(ref+'a').slice(0,12)+': Pull complete'),PROG(1300,idOf(ref+'b').slice(0,12)+': Pull complete'),PROG(800,idOf(ref+'c').slice(0,12)+': Pull complete'),'Digest: sha256:'+idOf(ref)+idOf(ref+'x')+'…','Status: Downloaded newer image for '+ref,ref];
  }
  function imagesTable(set){
    const rows=[['REPOSITORY','TAG','IMAGE ID','CREATED','SIZE']];
    Object.keys(set).forEach(ref=>{const [n,t]=splitRef(ref);rows.push([n,t,idOf(ref),'2 minutes ago',n==='postgres'?'438MB':n==='caddy'?'49.8MB':'187MB']);});
    return table(rows);
  }
  /* ----- containers on the server ----- */
  function start(name,o){
    const c=Object.assign({name,state:'running',health:null,seen:false,restarts:0,ports:[],env:false,compose:false,exit:null},o);
    if(o.svc==='control'||!o.svc){
      if(!c.env){c.state='exited';c.exit=1;fx('crash');}
      else{fx('boot',{tag:c.tag});if(c.compose){c.health='starting';}}
    }
    C()[name]=c;w.stamp++;return c;
  }
  function psTable(all,composeOnly){
    const list=Object.values(C()).filter(c=>(all||c.state==='running')&&(!composeOnly||c.compose));
    const status=c=>c.state==='exited'?'Exited ('+c.exit+') 4 seconds ago':'Up '+(c.health==='starting'?'2 seconds':'About a minute')+(c.health?' ('+(c.health==='starting'?'health: starting':c.health)+')':'');
    const ports=c=>c.state!=='running'?'':c.ports.map(p=>'0.0.0.0:'+p+'->'+p+'/tcp').join(', ')||(c.svc==='control'?'8000/tcp':c.svc==='db'?'5432/tcp':'');
    if(composeOnly)return table([['NAME','IMAGE','SERVICE','STATUS','PORTS']].concat(list.map(c=>[c.name,c.image,c.svc,status(c),ports(c)])));
    return table([['CONTAINER ID','IMAGE','STATUS','PORTS','NAMES']].concat(list.map(c=>[idOf(c.name+c.tag).slice(0,12),c.image,status(c),ports(c),c.name])));
  }
  function logsOf(c){
    if(c.svc==='db')return ['PostgreSQL init process complete; ready for start up.','LOG:  database system is ready to accept connections'];
    if(c.svc==='gateway')return ['{"level":"info","msg":"using config from file","file":"/etc/caddy/Caddyfile"}','{"level":"info","logger":"http.auto_https","msg":"enabling automatic HTTP->HTTPS redirects","server_name":"srv0"}','{"level":"info","logger":"tls.obtain","msg":"obtaining certificate","identifier":"'+HOST+'"}','{"level":"info","logger":"tls.issuance.acme","msg":"trying to solve challenge","identifier":"'+HOST+'","challenge_type":"tls-alpn-01","ca":"https://acme-v02.api.letsencrypt.org/directory"}','{"level":"info","logger":"tls.obtain","msg":"certificate obtained successfully","identifier":"'+HOST+'","issuer":"acme-v02.api.letsencrypt.org-directory"}'];
    if(!c.env)return ['INFO:     kestrel-control '+c.tag+' booting','Traceback (most recent call last):','  File "/app/app/config.py", line 14, in <module>','    settings = Settings.from_env()','RuntimeError: missing required setting DATABASE_URL (also missing: KESTREL_ENV, PILOT_KEY)','sandbox: the program stopped itself, so the container exited with code 1.'];
    const L=['INFO:     kestrel-control '+c.tag+' booting','INFO:     config loaded: 5 settings from the environment (KESTREL_ENV=production)'];
    const rel=relOf(c.tag);
    if(!dbUp())L.push('WARNING:  database: could not connect to "db:5432" (name does not resolve). Retrying in 5s');
    else L.push('INFO:     database: connected to kestrel@db:5432');
    if(!rel.ok)L.push('ERROR:    '+rel.err);
    L.push('INFO:     Uvicorn running on http://0.0.0.0:8000 (Press CTRL+C to quit)');
    if(!rel.ok)L.push('INFO:     127.0.0.1 - "GET /health HTTP/1.1" 503 Service Unavailable');
    return L;
  }
  function composeUp(tag){
    const S=w.srv,f=S.files['compose.yml'];
    if(f===undefined)return E('no configuration file provided: not found\n\nsandbox: docker compose looks for compose.yml in the current folder, and there is none on the server yet.',{cmd:'up'});
    if(S.files['.env']===undefined)return E('env file /home/pilot/kestrel/.env not found: stat /home/pilot/kestrel/.env: no such file or directory',{cmd:'up'});
    const gw=f===FILES.laptop['deploy/compose.gateway.yml'],ref=IMG+':'+tag;
    if(gw&&S.files['Caddyfile']===undefined)return E('Error response from daemon: invalid mount config: bind source path does not exist: /home/pilot/kestrel/Caddyfile',{cmd:'up'});
    if(!known(ref))return E(['[+] Running 0/1',' ✘ control Error  manifest for '+ref+' not found: manifest unknown','Error response from daemon: manifest for '+ref+' not found: manifest unknown','','sandbox: the registry has no image with that tag. Build and push it from the hangar first.'],{cmd:'up'});
    const solo=C()['control'];
    if(solo&&solo.state==='running'&&!gw)return E(['Error response from daemon: driver failed programming external connectivity on endpoint kestrel-control-1: Bind for 0.0.0.0:8000 failed: port is already allocated','','sandbox: the container called "control" from the last lesson still holds port 8000. Remove it first: docker rm -f control'],{cmd:'up'});
    const out=[],done=[];
    ['postgres:17'].concat(gw?['caddy:2']:[]).concat([ref]).forEach(r=>{if(!S.images[r]){const svc=r.startsWith('postgres')?'db':r.startsWith('caddy')?'gateway':'control';S.images[r]=true;if(svc==='control')fx('pull',{tag});out.push(PROG(svc==='control'?2600:1500,' ✔ '+svc+' Pulled'));}});
    if(!S.net){S.net=true;done.push(' ✔ Network kestrel_default      Created');}
    if(!S.vol){S.vol=true;done.push(' ✔ Volume "kestrel_dbdata"      Created');}
    if(gw&&!S.cert)done.push(' ✔ Volume "kestrel_caddydata"   Created');
    if(!dbUp()){start('kestrel-db-1',{svc:'db',image:'postgres:17',tag:'17',env:true,compose:true,health:'healthy'});done.push(' ✔ Container kestrel-db-1       Healthy');}
    else done.push(' ✔ Container kestrel-db-1       Healthy');
    const old=C()['kestrel-control-1'],ports=gw?[]:[8000];
    let what='Running';
    if(!old||old.tag!==tag||old.state!=='running'||String(old.ports)!==String(ports)){
      let roll=false;
      if(old&&old.tag!==tag){roll=S.standby===tag;if(old.health==='healthy'||(old.health==='starting'&&healthOf(old)==='healthy'))S.standby=old.tag;else if(roll)S.standby=null;}
      what=old?'Recreated':'Started';
      start('kestrel-control-1',{svc:'control',image:ref,tag,env:true,compose:true,ports});
      if(roll){w.fx=w.fx.filter(x=>x.k!=='boot');fx('rollback',{tag});}
    }
    done.push(' ✔ Container kestrel-control-1  '+what);
    if(gw){const g=C()['kestrel-gateway-1'];if(!g||g.state!=='running'){start('kestrel-gateway-1',{svc:'gateway',image:'caddy:2',tag:'2',env:true,compose:true,ports:[80,443]});S.cert=true;fx('tls');done.push(' ✔ Container kestrel-gateway-1  Started');}else done.push(' ✔ Container kestrel-gateway-1  Running');}
    else if(C()['kestrel-gateway-1']){delete C()['kestrel-gateway-1'];}
    out.push('[+] Running '+done.length+'/'+done.length,WAIT(700));
    w.stamp++;
    return OK(out.concat(done),{cmd:'up',tag,what,gw});
  }
  function compose(a,env){
    if(w.where==='laptop'){
      if(a[0]==='ps')return OK(table([['NAME','IMAGE','SERVICE','STATUS','PORTS'],['control-control-1','control-control','control','Up 3 hours','0.0.0.0:8000->8000/tcp'],['control-db-1','postgres:17','db','Up 3 hours (healthy)','5432/tcp']]),{cmd:'compose ps',local:true});
      return E('sandbox: on your workstation the development stack is already running. The compose commands that matter in this guide are run on the server, after '+SSH);
    }
    const v=a[0];
    if(v==='up'){if(!a.includes('-d'))return E('sandbox: use docker compose up -d. Without -d the containers would take over this terminal.');return composeUp(env.TAG||'1.0.0');}
    if(v==='ps')return OK(Object.values(C()).some(c=>c.compose)?psTable(a.includes('-a'),true):['NAME   IMAGE   SERVICE   STATUS   PORTS'],{cmd:'compose ps',health:(C()['kestrel-control-1']||{}).health||null,state:(C()['kestrel-control-1']||{}).state||null});
    if(v==='logs'){const svc=a.slice(1).filter(x=>!x.startsWith('-'))[0]||'control',c=C()['kestrel-'+svc+'-1'];if(!c)return E('no such service: '+svc);return OK(logsOf(c).map(l=>svc+'-1  | '+l),{cmd:'logs',svc});}
    if(v==='down'){Object.keys(C()).forEach(n=>{if(C()[n].compose)delete C()[n];});w.srv.net=false;w.stamp++;return OK([' ✔ Container kestrel-control-1  Removed',' ✔ Container kestrel-db-1       Removed',' ✔ Network kestrel_default      Removed','sandbox: the dbdata volume is kept, so the database contents survive.'],{cmd:'down'});}
    if(v==='pull')return OK('sandbox: docker compose up -d pulls whatever is missing, so a separate pull is not needed here.');
    return E('sandbox: this docker compose understands up -d, ps, logs SERVICE and down.');
  }
  function docker(a,env,stdin){
    const v=a[0];
    if(v==='compose')return compose(a.slice(1),env);
    if(v==='images')return OK(imagesTable(here().images),{cmd:'images'});
    if(v==='login'){
      if(a[1]!=='ghcr.io')return E('sandbox: the only registry here is ghcr.io.');
      if(!a.includes('--password-stdin')||stdin===null)return E(['sandbox: typing a password at a prompt is not possible here, and it is the less safe habit anyway. Pipe the token in instead:','  echo $GHCR_TOKEN | docker login ghcr.io -u pilot --password-stdin']);
      here().login=true;w.stamp++;return OK('Login Succeeded',{cmd:'login'});}

      core,live,gantry:live?'open':'locked',pub:!g?(core.state==='running'&&core.ports&&core.ports.includes(8000)?'http':'none'):'https',runs:w.runs.map(r=>({tag:r.tag,status:r.status}))};
  }
  /* ----- starting state: replay every command of the lessons before this one ----- */
  (function boot(){
    w.booting=true;
    LESSONS.forEach(L=>{if(L.id<upto)L.tasks.forEach(t=>{try{exec(t.cmd);}catch(e){}});});
    try{exec('true');exec('true');}catch(e){}
    w.booting=false;w.fx=[];
  })();
  return {exec,world:w,view,prompt:()=>w.where==='laptop'?'hangar $':'kestrel $',get help(){return HELP();}};
}

const LESSONS=[
{id:1,title:'A control system with no suit',mins:8,
idea:`
<p>Across the earlier guides you built the Kestrel's control system: a FastAPI application with a Postgres database, packaged with Docker and tested by CI. All of it has only ever run in one place: <strong>the hangar</strong>, which is your own workstation.</p>
<p>This guide takes it out of the hangar. <strong>Deployment</strong> means getting a tested version of your software running on a machine that other people can reach, and keeping it running. Here that machine is the suit itself: the KF-07 Kestrel Mk II, standing in the gantry with its systems dark. In real terms it is a <strong>server</strong>: a Linux computer rented from a cloud provider, switched on all day, with a public address.</p>
<p>The route is the same on almost every platform, and each lesson adds one leg of it:</p>
<ol>
<li><strong>Build</strong> an image of the control system and <strong>push</strong> it to a registry (lesson 2).</li>
<li><strong>Pull</strong> that image onto the server and <strong>run</strong> it (lesson 3).</li>
<li>Give it its <strong>configuration and secrets</strong> (lesson 4).</li>
<li>Describe the whole stack in one file, with a <strong>health check</strong> and a restart policy (lesson 5).</li>
<li>Give it a <strong>domain name and HTTPS</strong> (lesson 6).</li>
<li>Ship a <strong>new release</strong>, and <strong>roll back</strong> when it goes wrong (lesson 7).</li>
<li>Hand the routine to a pipeline: <strong>continuous deployment</strong> (lesson 8).</li>
</ol>
<dl class="terms">
<dt>The hangar (local machine, development environment)</dt><dd>Your workstation. Software here is reachable only by you, at <code>localhost</code>.</dd>
<dt>The Kestrel (server, host, production environment)</dt><dd>A computer in a data centre that runs your software for real users. "The cloud" is other people's computers, rented by the hour.</dd>
<dt>Environment</dt><dd>One complete running copy of the system. Most teams keep at least two: development (yours) and production (the real one). Many add staging, a rehearsal copy of production.</dd>
<dt>Release</dt><dd>One specific, numbered version of the software, such as 1.0.0.</dd>
</dl>
<h2>Translation key</h2>
<p>The Kestrel is there to make things easier to picture, so the real term always travels with it. The letters are the callouts on the blueprint in the sandbox.</p>
<table class="types"><thead><tr><th>On the Kestrel</th><th>Callout</th><th>In a real system</th></tr></thead><tbody>
<tr><td>the hangar</td><td></td><td>your workstation (development)</td></tr>
<tr><td>the armoury</td><td></td><td>a container registry (here ghcr.io)</td></tr>
<tr><td>uplink cable</td><td>U</td><td>pulling an image from the registry</td></tr>
<tr><td>the suit</td><td></td><td>the server (production host)</td></tr>
<tr><td>boarding the suit</td><td></td><td>an SSH session on the server</td></tr>
<tr><td>cockpit core</td><td>C</td><td>the running container</td></tr>
<tr><td>key slot, pilot keys</td><td>K</td><td>environment variables and secrets</td></tr>
<tr><td>visor, self-test</td><td>H</td><td>the health check</td></tr>
<tr><td>comms mast, callsign, scrambler</td><td>A</td><td>domain name (DNS) and HTTPS (TLS)</td></tr>
<tr><td>standby core, retreat</td><td>S</td><td>the previous release, and a rollback to it</td></tr>
<tr><td>hangar gantry</td><td>G</td><td>locked until a healthy release is live</td></tr>
<tr><td>reactor</td><td>R</td><td>what the host provides: CPU, memory, and a monthly bill</td></tr>
<tr><td>the hangar crew</td><td></td><td>a CI/CD pipeline (GitHub Actions)</td></tr>
</tbody></table>`,

notes:`<h2>Where the server came from</h2>
<p>The sandbox starts with a server already rented. In real life that step is a few clicks or one command with a cloud provider: you choose a size (this one has 2 virtual CPUs and 4 GB of memory), a region, an operating system image (Ubuntu), and you paste in your <strong>public SSH key</strong>. A minute later you have an IP address. That product is called a virtual machine, VM, VPS, droplet or instance depending on the provider.</p>
<h2>SSH keys in one paragraph</h2>
<p>An SSH key is a pair of files. The <strong>private key</strong> stays on your machine and is never shared. The <strong>public key</strong> is copied to every server you should be able to enter. When you connect, the server checks that you hold the matching private key. Nothing secret travels over the network, and there is no password to guess.</p>
<h2>Ways to host a container</h2>
<table class="types"><thead><tr><th>Option</th><th>You manage</th><th>Examples</th></tr></thead><tbody>
<tr><td>A virtual machine</td><td>The operating system, Docker, everything. Most to learn, nothing hidden. This guide uses one for that reason.</td><td>DigitalOcean Droplets, AWS EC2, Hetzner, Azure VMs</td></tr>
<tr><td>A container platform (PaaS)</td><td>Only the image and its settings. The platform pulls, runs, health-checks and gives you HTTPS.</td><td>Google Cloud Run, Render, Fly.io, Railway, Azure Container Apps, AWS App Runner</td></tr>
<tr><td>Kubernetes</td><td>A cluster of machines and a lot of configuration. Worth it at larger scale.</td><td>GKE, EKS, AKS</td></tr>
</tbody></table>
<p>The platforms automate the steps you are about to do by hand. Knowing the steps is what makes their dashboards and error messages readable.</p>`,

{id:2,title:'The armoury: build, tag, push',mins:10,
idea:`
<p>The server cannot build your code, and it should not have to. What travels is a finished <strong>image</strong>: the application, its Python packages and a slice of operating system, frozen into one artifact. You made images in <em>Docker from Zero</em>. The new part is where they go.</p>
<p>A <strong>registry</strong> is a server that stores images, the way GitHub stores code. In the story it is <strong>the armoury</strong>: the hangar crew builds a control system, labels it, and shelves it there. Any machine with permission can then collect exactly that build. This guide uses GitHub's registry, <code>ghcr.io</code>.</p>
<p>An image's full name says where it lives:</p>
<pre class="file">ghcr.io / hangar-7 / control : 1.0.0
registry   owner      image    tag</pre>
<dl class="terms">
<dt>Tag</dt><dd>A label on one build of an image. Here it is the version number.</dd>
<dt>Push</dt><dd>Upload an image from this machine to the registry.</dd>
<dt>Pull</dt><dd>Download an image from the registry to this machine. The server does this in lesson 3.</dd>
<dt>Artifact</dt><dd>The built thing that gets deployed. The key habit: <strong>build once, deploy the same artifact everywhere</strong>. What you tested is byte for byte what runs in production.</dd>
</dl>
<p>Give every release its own tag and never reuse one. A tag called <code>latest</code> tells you nothing about what is running and gives you nothing to roll back to. A tag called <code>1.0.0</code> does both.</p>`,

notes:`<h2>Version numbers</h2>
<p>Most projects use <strong>semantic versioning</strong>: MAJOR.MINOR.PATCH. A bug fix raises the last number (1.0.0 to 1.0.1), a new feature the middle (1.1.0), and a breaking change the first (2.0.0). Some teams tag images with the git commit hash instead. Either works. What matters is that a tag names one build, permanently.</p>
<h2>Private images</h2>
<p>The sandbox lets the server pull without logging in, as if the image were public. A real product's images are private, so the server also runs <code>docker login</code>, with a token that can only read. Never give a server a token that can push.</p>
<h2>Other registries</h2>
<p>Docker Hub, GitHub Container Registry (ghcr.io), Amazon ECR, Google Artifact Registry and Azure Container Registry all work the same way: login, push, pull. If your code is on GitHub, ghcr.io is the least setup.</p>`,

{id:3,title:'First boot aboard the suit',mins:9,
idea:`
<p>Release 1.0.0 is in the armoury. Now you board the Kestrel, pull the image down the <strong>uplink cable</strong> and start it. This is the smallest possible deployment: two commands on the server.</p>
<pre class="file">docker pull IMAGE:TAG        # fetch the image from the registry
docker run -d … IMAGE:TAG    # start a container from it</pre>
<p>It will not go well, on purpose. The control system boots, finds something missing and shuts itself down. That is the most common first-deployment experience there is, and it teaches the first production skill: <strong>when something is not running, read its logs.</strong></p>
<dl class="terms">
<dt><code>-d</code> (detached)</dt><dd>Run the container in the background and give the terminal back. Without it the container dies when your SSH session ends.</dd>
<dt><code>-p 8000:8000</code></dt><dd>Publish a port: connect the server's port 8000 to the container's port 8000.</dd>
<dt><code>docker ps -a</code></dt><dd><code>docker ps</code> lists running containers. <code>-a</code> adds the ones that have stopped, with their exit code.</dd>
<dt>Exit code</dt><dd>The number a program leaves behind when it ends. 0 means it finished normally. Anything else means it stopped on an error.</dd>
<dt><code>docker logs NAME</code></dt><dd>Everything the container's program printed. It works on stopped containers too, which is the point.</dd>
</dl>`,
labIntro:'Watch the blueprint during the pull: the uplink cable (U) carries the image down to the suit. Then watch the cockpit core (C) when the container starts.',

T_SSH,

notes:`<h2>Fail loudly at start-up</h2>
<p>The application checked its settings as it started and stopped with a clear message. The alternative is an application that starts happily and fails later, on the first request that needs the database, at three in the morning. When you write a service, validate configuration at boot.</p>
<h2>The three questions</h2>
<p>For any container that is not behaving, in this order:</p>
<ol><li><code>docker ps -a</code>: is it running, restarting or exited, and with what code?</li>
<li><code>docker logs NAME</code>: what did it say?</li>
<li><code>curl localhost:PORT/health</code> from the server itself: does it answer when asked directly?</li></ol>`,

{q:'docker run printed a container ID, yet docker ps showed nothing. What happened?',opts:['The image was not pulled','The container was created and started, but its program exited straight away','docker ps is broken over SSH','The port was wrong'],a:1,why:'docker run -d reports that the container was created. Whether the program inside stays alive is a separate matter, which docker ps -a and docker logs reveal.'},
{q:'Which command shows what a stopped container printed?',opts:['docker ps','docker images','docker logs NAME','docker pull NAME'],a:2,why:'Logs are kept after the container stops, until the container is removed.'},
{q:'What does -d do in docker run -d?',opts:['Deletes the container afterwards','Runs it detached, in the background','Enables debug output','Downloads the image'],a:1,why:'Detached mode gives you the terminal back and keeps the container running after you log out.'}],
