],
notes:`<h2>Monitoring and observability</h2>
<p>The two words are often used as one. A useful difference: <strong>monitoring</strong> watches for problems you predicted (is the disk full? is the error rate above 5%?). <strong>Observability</strong> is having enough evidence coming out of the system to investigate a problem you did <em>not</em> predict, without shipping new code to find out. You need both.</p>
<h2>Where everything runs</h2>
<p>You are connected to the Kestrel's flight computer over the downlink, the same way you used SSH to reach the server in <em>Cloud Deploy from Zero</em>. Nine containers run there under Docker Compose: the seven services, <strong>Prometheus</strong> (collects metrics) and <strong>Jaeger</strong> (stores traces). On a small system that is a perfectly normal layout.</p>
<p>Larger systems move the collected evidence somewhere else, so that it survives when the thing being observed does not: a managed service such as Grafana Cloud, Datadog or Honeycomb, or the cloud provider's own tools. The ideas in this guide are the same in all of them.</p>
<h2>It has to be built in</h2>
<p>None of this appears by magic. A service writes logs because someone wrote log statements. It has a <code>/metrics</code> page because a library was added. It produces traces because it was <strong>instrumented</strong>. Each lesson ends with what that takes in a FastAPI app. The effort is small, and it has to be spent <em>before</em> the day you need it.</p>`,
quiz:[
{q:'Which signal is best at telling you WHY one specific order failed?',opts:['Metrics','Logs','Health checks','The status code'],a:1,why:'Logs record individual events in words, with the values involved. Metrics would tell you that orders are failing, and traces where.'},
{q:'The autopilot sends a course correction every second. What is the sensible way to keep track of them?',opts:['A log line for each one','A counter metric','A trace for each one, read by hand','A health check'],a:1,why:'Frequent, routine events are counted. Logging each one would bury the lines that matter.'},
{q:'Why can you not simply look at the Kestrel to see what is wrong?',opts:['It is too fast','It is in production: far away, and all you get is what it sends you','The blueprint is out of date','Docker hides it'],a:1,why:'That is the situation observability exists for. Whatever you will want to know later has to be sent out by the system itself.'}],
reading:[
['Observability primer (OpenTelemetry)',OTEL+'/concepts/observability-primer/','Short definitions of logs, metrics, traces, spans and instrumentation from the project that standardises them.'],
['Monitoring Distributed Systems (Google SRE book)',SRE+'/sre-book/monitoring-distributed-systems/','The classic chapter: symptoms against causes, and the four golden signals.'],
['The Twelve-Factor App: Logs','https://12factor.net/logs','One page on why a service should just write events to its output and let the platform collect them.']]},

{id:2,title:'Logs: the flight recorder',mins:14,
idea:`
<p>The Kestrel is in transit to gate-alpha. Every service aboard keeps a <strong>flight recorder</strong> (a <strong>log</strong>): a list of events, one per line, each stamped with the time. A log line is the service telling you, in its own words, what it just did.</p>
<p>In a container the rule is simple: the program writes each line to its standard output, and the platform collects it. <code>docker compose logs</code> shows what Docker collected.</p>
<p>Logs are the most detailed signal and the easiest to add, which is also their weakness. With seven services writing at once, the line you need is in there somewhere among thousands. Three habits make it findable:</p>
<dl class="terms">
<dt>Levels</dt><dd>Every line says how serious it is: <code>DEBUG</code>, <code>INFO</code>, <code>WARN</code>, <code>ERROR</code>. You can then ask for "warnings and worse" and skip the routine.</dd>
<dt>Structure</dt><dd>Each line is a small JSON object with named fields, not a free sentence. A sentence can only be searched for words. Fields can be filtered, counted and compared.</dd>
<dt>A shared id (correlation id)</dt><dd>Every line written while handling one order carries that order's <code>trace_id</code>. Search for the id and you get that order's whole story, across every service, in time order.</dd>
</dl>`,
widget:'logline',widgetTitle:'One log line, field by field',widgetIntro:'This is one line from the sensor mast, spread out so you can read it. Tap any field.',
labIntro:'The top-left panel lays out whatever logs your command returned: time, service, level, message, then the extra fields. Watch the magenta dots on the blueprint: that is telemetry coming down the link from each service you asked.',
tasks:[
{what:`Read the last few lines from every service`,cmd:`docker compose logs --tail 3`,parts:[P_LOGS,[`--tail 3`,`The last 3 lines from each service.`]],
 saw:`Lines from several services, merged in time order. Docker puts the container name and a bar in front of each line (nav-1 |) so you can tell them apart. Everything after the bar is what the service itself wrote: one JSON object.`,test:(l,w,r)=>isLogs(r)&&!r.meta.svcs.length&&r.meta.n>0&&!r.meta.pipe},
{what:`Read one service only`,cmd:`docker compose logs --tail 3 nav`,parts:[[`nav`,`Name a service to see only its lines. The names are the ones in the compose file.`]],
 saw:`Just navigation. Its last event was plotting the course to gate-alpha during the launch.`,test:(l,w,r)=>isLogs(r)&&r.meta.svcs.length===1&&r.meta.svcs[0]==='nav'},
{what:`Give the Kestrel something to do: line up with the gate`,cmd:`curl -s -X POST kestrel.test/orders/align`,parts:[P_S,P_POST,[`/orders/align`,`Line the Kestrel up with gate-alpha.`]],
 saw:`"result":"ok". On the blueprint the order went up the link, through the gate and the flight computer, then to the sensor mast, navigation and the thrusters. Note the trace_id in the answer. You will search for it in a moment.`,test:(l,w,r)=>isCurl(r,{status:200,order:'align'})},
{what:`See what that one order made everyone write`,cmd:`docker compose logs --since 1m`,parts:[[`--since 1m`,`Only lines from the last minute. Also 30s, 2h and so on.`]],retry:'The mission clock has moved on more than a minute. Send the align order again, then run this.',
 saw:`Six lines from five services, all from the last minute: accepted by the flight computer, a star fix by the sensors, alignment by navigation, a burn by the thrusters, completion, and the gate's own access line with the status code and how long it took. One order, told by everyone it touched. One of those lines is a WARN.`,test:(l,w,r)=>isLogs(r)&&!!r.meta.since&&r.meta.n>0},
{what:`Filter by level: show only the warnings`,cmd:`docker compose logs | grep WARN`,parts:[P_LOGS,[`| grep WARN`,`Keep only the lines that contain WARN.`]],
 saw:`One line. The sensors locked onto 2 of 3 reference stars. The order still succeeded, which is exactly what WARN means: something was off, and the service coped. An ERROR would mean it could not do what was asked.`,test:(l,w,r)=>isLogs(r)&&r.meta.grep==='WARN'},
{what:`Ask a question of the fields, not the text`,cmd:`docker compose logs --no-log-prefix sensors | jq -r 'select(.level=="WARN") | .msg'`,parts:[[`--no-log-prefix`,`Leave off the "sensors-1 |" in front of each line, so what is left is pure JSON.`],[`| jq -r '…'`,`jq reads JSON. -r prints plain text instead of quoted strings.`],[`select(.level=="WARN")`,`Keep the objects whose level field is exactly WARN.`],[`| .msg`,`From those, print only the msg field.`]],
 saw:`Just the message. grep can only match text anywhere on the line. jq understands the fields, so "level is WARN" cannot be fooled by the word WARN appearing inside a message. This is what structured logs buy you, and it is what log tools such as Loki, Elasticsearch and CloudWatch do at scale.`,test:(l,w,r)=>isLogs(r)&&!!r.meta.jq&&r.meta.n>0},
{what:`Follow one order across every service by its id`,cmd:`docker compose logs | grep ${ID_ALIGN}`,parts:[P_LOGS,[`| grep ${ID_ALIGN.slice(0,8)}…`,`The trace_id from your align order. Every line that order caused carries it.`]],
 saw:`The same six lines as before, found a different way: not by time, by identity. An hour from now, with thousands of other lines in between, this search would still return exactly these six. That id is called a correlation id, and here it is also the trace id, which lesson 4 puts to work.`,test:(l,w,r)=>isLogs(r)&&r.meta.grep===ID_ALIGN&&r.meta.n>0}
],
notes:`<h2>What to log, and what not to</h2>
<ul>
<li><strong>Do log</strong> the start and end of meaningful work, every failure with its reason, every decision that changes behaviour (a retry, a fallback, a config change), and who asked.</li>
<li><strong>Do not log</strong> passwords, tokens, card numbers or personal data. Logs are copied, stored for a long time and read by many people. Treat anything written to a log as public inside the company.</li>
<li><strong>Do not log routine traffic line by line.</strong> The autopilot's course trims are logged at DEBUG, which is switched off, and counted by a metric instead.</li>
</ul>
<h2>In a FastAPI app</h2>
<p>Python's standard <code>logging</code> module does the work. A formatter such as <code>python-json-logger</code>, or the <code>structlog</code> library, turns each record into one line of JSON. The level is set by configuration, usually an environment variable, so production can run at INFO and a debugging session at DEBUG without a code change.</p>
<pre class="file">log.warning("star fix degraded", extra={"locked": 2, "wanted": 3})</pre>
<p>A small piece of middleware puts the current trace id on every line automatically, so nobody has to remember to pass it along.</p>
<h2>Elsewhere</h2>
<div class="tscroll"><table class="types"><thead><tr><th>Where</th><th>Command</th></tr></thead><tbody>
<tr><td>Docker Compose</td><td><code>docker compose logs -f --tail 50 SERVICE</code></td></tr>
<tr><td>Kubernetes</td><td><code>kubectl logs -f deploy/SERVICE --tail 50</code></td></tr>
<tr><td>A managed platform</td><td>a "Logs" tab, with the same ideas: time range, level, text search, field filters</td></tr>
</tbody></table></div>
<p><code>-f</code> (follow) keeps the stream open and prints new lines as they arrive, until you press Ctrl+C.</p>`,
quiz:[
{q:'What does WARN mean, compared with ERROR?',opts:['They are the same','WARN: something was off but the work got done. ERROR: the work failed','WARN is more serious','WARN is for debugging only'],a:1,why:'Levels are a promise to the reader. If everything is an ERROR, nobody can find the real failures.'},
{q:'Why write log lines as JSON with named fields?',opts:['It is shorter','So tools can filter and count by field, not just search for words','JSON is required by Docker','It hides sensitive data'],a:1,why:'A field such as level or status can be matched exactly, compared and counted. A sentence can only be searched.'},
{q:'What makes it possible to pull one order\'s lines out of seven services\' logs?',opts:['The timestamp','The log level','An id that every service writes on every line for that order','The container name'],a:2,why:'A correlation id (here the trace id) is passed from service to service with the order, and each one writes it on its lines.'}],
reading:[
['docker compose logs (Docker docs)','https://docs.docker.com/reference/cli/docker/compose/logs/','Every flag: --tail, --since, --until, -f, --no-log-prefix.'],
['Logging HOWTO (Python docs)','https://docs.python.org/3/howto/logging.html','Levels, loggers, handlers and formatters in the module FastAPI apps use.'],
['jq manual','https://jqlang.org/manual/','The whole filter language. select() and the pipe are most of what you need for logs.']]},

{id:3,title:'Metrics: the instrument panel',mins:15,
idea:`
<p>A log line describes one event. To fly a machine you also need the <strong>instrument panel</strong>: numbers that say how the whole thing is doing right now, and how that compares with a minute ago. Those numbers are <strong>metrics</strong>.</p>
<p>The arrangement used almost everywhere is the one built by <strong>Prometheus</strong>:</p>
<ol>
<li>Each service keeps its numbers in memory and publishes them as plain text at <code>/metrics</code>.</li>
<li>Prometheus visits every service's <code>/metrics</code> page on a timer, here every 15 seconds. One visit is a <strong>scrape</strong>.</li>
<li>It stores each number with the time it was read. A number followed over time is a <strong>time series</strong>.</li>
<li>You ask questions of the stored series in a small query language, <strong>PromQL</strong>.</li>
</ol>
<p>There are three kinds of metric worth knowing:</p>
<dl class="terms">
<dt>Counter</dt><dd>Only ever goes up: orders handled, requests served, errors. The raw value is rarely interesting. Its speed is, and <code>rate()</code> turns a counter into "per second".</dd>
<dt>Gauge</dt><dd>A reading that goes up and down: reactor output, memory in use, items in a queue. Useful exactly as it is.</dd>
<dt>Histogram</dt><dd>Sorts measurements, usually durations, into buckets, so you can ask "how long do the slowest 5% of requests take?". That answer is the 95th <strong>percentile</strong>, written p95.</dd>
</dl>
<p>For any service that answers requests, three numbers cover most of what you need. They are remembered as <strong>RED</strong>: <strong>R</strong>ate (requests per second), <strong>E</strong>rrors (how many fail), <strong>D</strong>uration (how long they take).</p>`,
widget:'expo',widgetTitle:'Reading a /metrics page',widgetIntro:'A few lines of the text Prometheus collects. Tap any line.',
labIntro:'The card marked M beside the blueprint always shows the three RED numbers for the Kestrel. This lab is where they come from. The mission clock moves on 15 seconds, one scrape, after every command you run.',
tasks:[
{what:`Look at the raw numbers the flight computer publishes`,cmd:`curl -s kestrel.test/metrics | head -n 12`,parts:[[`kestrel.test/metrics`,`The page Prometheus scrapes. It is ordinary text over HTTP.`],[`| head -n 12`,`Only the first 12 lines. The whole page is long.`]],
 saw:`Lines starting # are for people: HELP describes a metric and TYPE says what kind it is. Every other line is a name, optional labels in braces, and a number. The panel above colours the three parts.`,test:(l,w,r)=>isCurl(r,{path:'/metrics'})&&r.meta.pipe==='head'},
{what:`Read one gauge: reactor output`,cmd:`curl -s kestrel.test/metrics | grep reactor_output`,parts:[[`| grep reactor_output`,`Keep the lines for this one metric.`]],
 saw:`TYPE gauge, value 13: the reactor is producing 13 kW at this moment. A gauge is a reading. Hold on to that number.`,test:(l,w,r)=>isCurl(r,{path:'/metrics'})&&r.meta.grep==='reactor_output'},
{what:`Jump: through gate-alpha to the Aster system`,cmd:`curl -s -X POST kestrel.test/orders/jump`,parts:[P_S,P_POST,[`/orders/jump`,`Take the Kestrel through the gate.`]],
 saw:`The Kestrel is now in the Aster system, 12 light-years from Hangar 7: watch the chart. A jump needs a surge from the reactor.`,test:(l,w,r)=>isCurl(r,{status:200,order:'jump'})},
{what:`Read the same gauge again, straight away`,cmd:`curl -s kestrel.test/metrics | grep reactor_output`,parts:[[`same command`,`The same gauge, seconds after the jump.`]],
 saw:`24 kW if you were quick, one short of the 25 kW limit; it falls back to 13 within a minute. A gauge goes up and down, and reading it tells you about now and nothing else. Whether anyone noticed the peak depends on something having written it down at the time. That is Prometheus's job.`,test:(l,w,r)=>isCurl(r,{path:'/metrics'})&&r.meta.grep==='reactor_output'&&w.phase>=2},
{what:`Ask Prometheus instead: which services is it scraping?`,cmd:`${PQ} 'up'`,parts:[P_PQ,[`'up'`,`The query. up is a metric Prometheus makes itself: 1 if its last scrape of a service worked, 0 if not.`]],
 saw:`Seven series, one per service, told apart by the job label, all 1. The format is: series => value @[time]. You get up for free, and it is the simplest "is it there?" check there is.`,test:(l,w,r)=>isQ(r,/^up$/)&&r.meta.n===7},
{what:`Query a gauge`,cmd:`${PQ} 'kestrel_reactor_output_kw'`,parts:[P_PQ,[`'kestrel_reactor_output_kw'`,`A metric name by itself returns its current value.`]],
 saw:`The reactor's output as Prometheus last recorded it. The difference from curl is that Prometheus also kept every earlier reading, so the surge during the jump is on record even though the gauge has moved on.`,test:(l,w,r)=>isQ(r,/^kestrel_reactor_output_kw$/)},
{what:`Turn a counter into a speed`,cmd:`${PQ} 'rate(kestrel_orders_total{order="trim"}[1m])'`,parts:[[`kestrel_orders_total`,`A counter: orders handled since start-up.`],[`{order="trim"}`,`A label matcher: only the series whose order label is trim.`],[`[1m]`,`Look at the last minute of readings.`],[`rate( … )`,`How fast the counter rose over that window, per second.`]],
 saw:`1.5: the autopilot is sending one and a half course trims a second. The counter itself is some large number that means nothing by itself. Its rate is what you watch. Always wrap a counter in rate().`,test:(l,w,r)=>isQ(r,/^rate\(kestrel_orders_total\{order="trim"\}\[1m\]\)$/)&&r.meta.n===1},
{what:`R for rate: requests per second, all routes together`,cmd:`${PQ} 'sum(rate(http_requests_total[1m]))'`,parts:[[`http_requests_total`,`A counter with one series per route, method and status code.`],[`rate( … [1m])`,`Each series as a per-second speed.`],[`sum( … )`,`Add all the series into one number.`]],
 saw:`About 3.5 requests a second: 2 status polls and 1.5 trims, plus a trickle from your own commands. This is the number on the M card. Put "by (route)" after sum and you get one number per route.`,test:(l,w,r)=>isQ(r,/^sum\(rate\(http_requests_total\[1m\]\)\)$/)},
{what:`D for duration: how slow are the slowest 5%?`,cmd:`${PQ} 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m])))'`,parts:[[`…_bucket`,`The histogram's buckets: counts of requests that took up to 0.05 s, 0.1 s, 0.25 s and so on.`],[`sum by (le) (rate( … [1m]))`,`Per-second rate of each bucket, added across routes but kept apart by le, the bucket's upper limit.`],[`histogram_quantile(0.95, … )`,`From those buckets, estimate the value that 95% of requests were faster than.`]],
 saw:`About 0.22 seconds: 95 of every 100 requests finished faster than that. This is p95, and it is the last number on the M card. An average would hide the slow ones. A percentile is about them.`,test:(l,w,r)=>isQ(r,/^histogram_quantile\(0\.95, ?sum by ?\(le\) ?\(rate\(http_request_duration_seconds_bucket\[1m\]\)\)\)$/)}
],
notes:`<h2>Labels are powerful, and can hurt</h2>
<p>Every distinct combination of label values is its own series, stored separately. <code>route</code> and <code>status</code> are fine: a few dozen combinations. A label holding a user id, an order id or a full URL creates a new series for every value, and Prometheus slows down and fills up. This is called a <strong>cardinality</strong> problem. Rule of thumb: labels are for things with a small, fixed set of values. Details about one particular request belong in logs and traces.</p>
<h2>In a FastAPI app</h2>
<p>The <code>prometheus-fastapi-instrumentator</code> package adds the <code>/metrics</code> page and the request counter and duration histogram in two lines. Your own numbers come from the <code>prometheus_client</code> library:</p>
<pre class="file">from prometheus_client import Counter, Gauge

ORDERS = Counter("kestrel_orders_total", "Orders handled.", ["order", "result"])
REACTOR = Gauge("kestrel_reactor_output_kw", "Reactor output right now.")

ORDERS.labels(order="jump", result="ok").inc()
REACTOR.set(24)</pre>
<h2>From queries to dashboards</h2>
<p>Nobody types PromQL all day. The same queries are saved as panels in <strong>Grafana</strong>, which draws them as graphs over time. A good first dashboard for any service is three graphs: rate, error fraction and p95 duration. Everything you ran here goes into Grafana's query box unchanged.</p>
<h2>Why not just count log lines?</h2>
<p>You could, and some tools do. Metrics are far cheaper: one number per series per scrape, however busy the service is. That is why you can afford to keep them for months and query them across the whole system in a moment.</p>`,
quiz:[
{q:'kestrel_orders_total reads 4812. What does that tell you?',opts:['The Kestrel is busy','4812 orders since the service last started, and nothing about now. Use rate() to see the current speed','There are 4812 errors','Nothing: counters are random'],a:1,why:'A counter is a running total. rate() over a time window turns it into "per second", which is the useful number.'},
{q:'Which type of metric would you use for "requests waiting in a queue"?',opts:['Counter','Gauge','Histogram','Label'],a:1,why:'A queue length goes up and down, so it is a gauge.'},
{q:'p95 latency is 0.22 seconds. What does that mean?',opts:['The average request takes 0.22 s','95% of requests were faster than 0.22 s, and 5% were slower','95 requests took 0.22 s','The slowest request took 0.22 s'],a:1,why:'A percentile describes the slow tail directly, which an average hides.'}],
reading:[
['Metric types (Prometheus docs)',PROM+'/concepts/metric_types/','Counter, gauge, histogram and summary, each in a few paragraphs.'],
['Querying basics (Prometheus docs)',PROM+'/prometheus/latest/querying/basics/','Selectors, label matchers and range vectors: everything inside the quotes.'],
['The RED Method (Grafana Labs)','https://grafana.com/blog/2018/08/02/the-red-method-how-to-instrument-your-services/','Why rate, errors and duration are the three numbers to start with for any request-driven service.']]},

{id:4,title:'Traces: following one order',mins:14,
idea:`
<p>The Kestrel has arrived in the Aster system. Next it has to close in on the trap station and scan for the sample. Each of those is a single order, and a single order now fans out across several services: the gate passes it to the flight computer, which calls the sensors, navigation and others in turn.</p>
<p>When such an order is slow, metrics tell you <em>that</em> it was slow. Logs give you a pile of lines from five services. Neither shows the shape of the thing. A <strong>trace</strong> does: it is the complete record of one order's journey, as a tree of timed steps.</p>
<dl class="terms">
<dt>Trace</dt><dd>Everything that happened for one request, end to end. It has a <strong>trace id</strong>, the 32-character code you have been seeing in every answer and every log line.</dd>
<dt>Span</dt><dd>One timed step inside a trace: a service handling the request, or one call it made. A span has a name, a start time, a duration, and a pointer to its <strong>parent</strong> span.</dd>
<dt>Context propagation</dt><dd>How the pieces stay connected. When one service calls another, it adds a <code>traceparent</code> header to the request, carrying the trace id and its own span id. The service receiving it carries on the same trace, not a new one.</dd>
<dt>Instrumentation</dt><dd>The code that creates spans. Libraries do most of it for you. The usual one is <strong>OpenTelemetry</strong>, which every tracing tool understands.</dd>
</dl>
<p>Each service sends its finished spans to a collector. Here that is <strong>Jaeger</strong>, which stitches them into trees by trace id and draws them as a <strong>waterfall</strong>.</p>`,
widget:'span',widgetTitle:'Reading a waterfall',widgetIntro:'Each row is a span. Where a bar starts is when that step began, and its length is how long it took.',
labIntro:'Traces are normally read in Jaeger\'s web page. Here you fetch them from the same address that page uses, and the top-left panel draws the waterfall. The route the order took is drawn on the blueprint too.',
tasks:[
{what:`Close in on the trap station`,cmd:`curl -s -X POST kestrel.test/orders/approach`,parts:[P_S,P_POST,[`/orders/approach`,`Bring the Kestrel to 200 metres from the trap station.`]],
 saw:`"result":"ok" in about 0.6 seconds. The Kestrel is holding off the trap station, and the answer carries a trace_id as every order does.`,test:(l,w,r)=>isCurl(r,{status:200,order:'approach'})},
{what:`Scan for the antimatter sample`,cmd:`curl -s -X POST kestrel.test/orders/scan`,parts:[P_S,P_POST,[`/orders/scan`,`Sweep the trap station and analyse what is inside.`]],
 saw:`It worked, and it found 40 nanograms of antihydrogen. It also took about 2.4 seconds, four times longer than the approach. Nothing failed, so there is no error to search for. The question is: where did the time go?`,test:(l,w,r)=>isCurl(r,{status:200,order:'scan'})&&!r.meta.continued},
{what:`Open that order's trace`,cmd:`curl -s localhost:16686/api/traces/${ID_SCAN}`,parts:[[`localhost:16686`,`Jaeger.`],[`/api/traces/${ID_SCAN.slice(0,8)}…`,`The trace with this id: the trace_id from your scan order's answer.`]],
 saw:`Six spans. The gate's bar spans the whole 2.4 seconds, the flight computer's sits just inside it, and under that are four calls. Three are short. One, sensors · spectrum, is about 1.9 seconds on its own. You found the slow step without guessing and without touching any code.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.jaeger&&r.meta.trace===ID_SCAN},
{what:`Ask the slow service why, using the same id`,cmd:`docker compose logs sensors | grep ${ID_SCAN}`,parts:[[`docker compose logs sensors`,`The service the trace pointed at.`],[`| grep ${ID_SCAN.slice(0,8)}…`,`Only the lines written for this order.`]],
 saw:`Two lines. The second is a WARN: the antimatter signature was weak, so the spectrum analysis needed 3 passes. The trace said where. The log said why. They are joined by one id, which is why a service writes its trace id on every log line.`,test:(l,w,r)=>isLogs(r)&&r.meta.svcs.includes('sensors')&&r.meta.grep===ID_SCAN&&r.meta.n>0},
{what:`Send an order that carries a trace id of your own`,cmd:`curl -s -X POST -H "traceparent: 00-${ID_MINE}-b7ad6b7169203331-01" kestrel.test/orders/scan`,parts:[[`-H "traceparent: …"`,`Add the header services use to hand a trace to each other.`],[`00-`,`The format version.`],[`${ID_MINE.slice(0,8)}…`,`The trace id: 32 characters. This time you chose it.`],[`-b7ad6b7169203331-01`,`The id of the calling span (16 characters), and a flag meaning "record this one".`]],
 saw:`Look at trace_id in the answer: it is the id you sent. The gate did not start a new trace. It joined yours. This is context propagation, and it is the same thing every service on the Kestrel does when it calls the next.`,test:(l,w,r)=>isCurl(r,{status:200,order:'scan',continued:true})&&r.meta.trace===ID_MINE},
{what:`Open the trace you started`,cmd:`curl -s localhost:16686/api/traces/${ID_MINE}`,parts:[[`/api/traces/${ID_MINE.slice(0,8)}…`,`The id from your traceparent header.`]],
 saw:`The same shape as before, filed under your id. In a real system the caller would be a browser or another service, and its own spans would sit above these in one tree. That is how a trace can run from a click in a web page to a database query and back.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.jaeger&&r.meta.trace===ID_MINE}
],
notes:`<h2>In a FastAPI app</h2>
<p>OpenTelemetry's instrumentation packages create the spans for you: one for every incoming request, one for every outgoing HTTP call and database query. You add the packages, say where to send the spans, and call:</p>
<pre class="file">from opentelemetry.instrumentation.fastapi import FastAPIInstrumentor
from opentelemetry.instrumentation.httpx import HTTPXClientInstrumentor

FastAPIInstrumentor.instrument_app(app)   # a span per request, reads traceparent
HTTPXClientInstrumentor().instrument()    # a span per outgoing call, adds traceparent</pre>
<p>For a step of your own that deserves its own bar, wrap it:</p>
<pre class="file">with tracer.start_as_current_span("spectrum") as span:
    span.set_attribute("passes", 3)
    analyse()</pre>
<p>Where the trace id appears in the response (the <code>x-trace-id</code> header and <code>trace_id</code> field here) is a choice the app makes. It is a kindness to whoever has to report a problem: "it failed, here is the id" is the most useful bug report there is.</p>
<h2>Sampling</h2>
<p>Keeping every trace of a busy system costs real storage. Most setups keep a fraction, for example 1 in 10, and all of the ones that failed or were slow. That is why this guide's Jaeger has your orders, and only the autopilot's failures.</p>
<h2>What a trace is good and bad at</h2>
<ul>
<li><strong>Good:</strong> "why was this one request slow?", "which service does this request actually touch?", "which hop failed?"</li>
<li><strong>Bad:</strong> "how often does this happen?" That is a metric. One trace is one example.</li>
</ul>`,
quiz:[
{q:'In a waterfall, one child span takes up most of its parent\'s bar. What does that tell you?',opts:['The parent is broken','That step is where the time went','The trace is incomplete','Nothing: bars are not to scale'],a:1,why:'Bars are drawn to scale in time. The longest child is the first place to look.'},
{q:'How does a service know that an incoming request belongs to an existing trace?',opts:['It asks Jaeger','It reads the traceparent header, which carries the trace id and the caller\'s span id','It compares timestamps','It cannot know'],a:1,why:'That header is how the trace context travels from one service to the next.'},
{q:'You want to know how many orders took longer than 2 seconds today. Which signal?',opts:['Traces','Metrics, from the duration histogram','Health checks','One log line'],a:1,why:'"How many" and "how often" are metric questions. A trace is the detailed story of one example.'}],
reading:[
['Traces (OpenTelemetry docs)',OTEL+'/concepts/signals/traces/','Spans, attributes, events, parents and children, with diagrams.'],
['Context propagation (OpenTelemetry docs)',OTEL+'/concepts/context-propagation/','How trace context crosses from one service to another.'],
['Trace Context (W3C)','https://www.w3.org/TR/trace-context/','The standard that defines the traceparent header, field by field.']]},

{id:5,title:'Health checks: the self-test',mins:14,
idea:`
<p>The Kestrel is 200 metres from the trap station and about to take antimatter aboard. This is the moment to be sure every subsystem is fit for it.</p>
<p>Logs, metrics and traces are things a service <em>sends out</em> as it works. A <strong>health check</strong> is different: it is a question you <em>ask</em>, at any time, with a yes-or-no answer. A service offers a small URL, and anything that needs to know, a person, Docker, Kubernetes or a load balancer, can call it.</p>
<p>There are two questions, and mixing them up causes real outages:</p>
<dl class="terms">
<dt>Liveness: are you alive?</dt><dd>"Is the program running and able to answer at all?" By convention <code>/healthz</code>. It must check <em>nothing but the program itself</em>. If it fails, the cure is a restart.</dd>
<dt>Readiness: are you ready?</dt><dd>"Can you do your job right now?" By convention <code>/readyz</code>. It checks what the service <em>depends on</em>: a database, another service, a warm cache. If it fails, the cure is to stop sending it work until it recovers. Restarting it would not help, because the problem is somewhere else.</dd>
</dl>
<p>Both answer with a status code: <strong>200</strong> for yes and <strong>503 Service Unavailable</strong> for no, so a machine can read the answer without understanding the body. On the blueprint the Kestrel's visor is its readiness: cyan when ready, amber when not.</p>`,
widget:'bottle',widgetTitle:'The magnetic bottle, opened up',widgetIntro:'The new equipment on the Kestrel\'s right arm is the clearest picture of the two checks. Tap a part.',
labIntro:'Watch the visor, the bottle on the right arm (marker A) and the service cards. Antimatter cannot touch ordinary matter, so the bottle\'s magnetic field must never drop. It has backup cells good for 45 minutes.',
tasks:[
{what:`Liveness: is the flight computer alive?`,cmd:`curl -si kestrel.test/healthz`,parts:[P_SI,[`/healthz`,`The liveness check.`]],
 saw:`200 and {"status":"ok"}. The process is running and answering. That is all this check claims.`,test:(l,w,r)=>isCurl(r,{status:200,path:'/healthz'})},
{what:`Readiness: is it ready to take orders?`,cmd:`curl -s kestrel.test/readyz`,parts:[P_S,[`/readyz`,`The readiness check.`]],
 saw:`"ready", with one result per thing the flight computer depends on: reactor, navigation and containment (the bottle), each ok. The visor is cyan.`,test:(l,w,r)=>isCurl(r,{status:200,path:'/readyz'})},
{what:`See what Docker makes of everyone`,cmd:`docker compose ps`,parts:[[`docker compose ps`,`Each container's state, including the result of its own health check.`]],
 saw:`All seven (healthy). Docker runs each service's health check every 10 seconds. The compose file says how: cat compose.yaml shows it.`,test:(l,w,r)=>r.meta.cmd==='docker'&&r.meta.sub==='ps'&&!r.meta.unhealthy.length},
{what:`Capture the sample`,cmd:`curl -s -X POST kestrel.test/orders/capture`,parts:[P_S,P_POST,[`/orders/capture`,`Open the trap, draw the antimatter into the bottle and seal it.`]],
 saw:`"sample_ng":40. The bottle on the right arm lit up: 40 nanograms of antimatter are aboard. Then look again. The bottle's lamp is blinking red and the visor has gone amber.`,test:(l,w,r)=>isCurl(r,{status:200,order:'capture'})},
{what:`Ask Docker again`,cmd:`docker compose ps`,parts:[[`same command`,`The same list, a few seconds after the capture.`]],
 saw:`containment is Up … (unhealthy). Read both halves. "Up" means the container is running: the process did not crash. "unhealthy" means its health check has failed three times in a row. Alive, and not well.`,test:(l,w,r)=>r.meta.cmd==='docker'&&r.meta.sub==='ps'&&r.meta.unhealthy.includes('containment')},
{what:`Ask the flight computer if it is ready`,cmd:`curl -si kestrel.test/readyz`,parts:[P_SI,[`/readyz`,`Readiness again, this time with the status line.`]],
 saw:`503 Service Unavailable, and the body says exactly which dependency failed: containment, "field controller not responding". Reactor and navigation are still ok. A good readiness answer names the part that is wrong.`,test:(l,w,r)=>isCurl(r,{status:503,path:'/readyz'})},
{what:`And is it alive?`,cmd:`curl -si kestrel.test/healthz`,parts:[P_SI,[`/healthz`,`Liveness again.`]],
 saw:`Still 200. The flight computer itself is fine: restarting it would achieve nothing and would drop every order in flight. Liveness green with readiness red means "I am fine, something I need is not". That one difference tells you where to look.`,test:(l,w,r)=>isCurl(r,{status:200,path:'/healthz'})&&w.stalled},
{what:`Look at the sick service's own log`,cmd:`docker compose logs --tail 2 containment`,parts:[P_LOGS,[`--tail 2 containment`,`The bottle's last two lines.`]],
 saw:`ERROR: field controller not responding, watchdog missed 3 beats. The program is running but stuck, a state health checks exist to catch. The bottle is on its backup field. The signals agree with each other, which is how you know you have the right culprit.`,test:(l,w,r)=>isLogs(r)&&r.meta.svcs.includes('containment')&&r.meta.levels.includes('ERROR')},
{what:`Restart the stuck service`,cmd:`docker compose restart containment`,parts:[[`docker compose restart`,`Stop and start a service's container.`],[`containment`,`Only this one. Everything else keeps running.`]],
 saw:`The container restarted and passed its health check: the bottle's lamp is green again and the main field is back. A stuck process is the one case where "turn it off and on again" is the correct fix, and where an orchestrator would have done it for you.`,test:(l,w,r)=>r.meta.cmd==='docker'&&r.meta.sub==='restart'&&r.meta.svc==='containment'&&!w.stalled},
{what:`Confirm the Kestrel is ready again`,cmd:`curl -s kestrel.test/readyz`,parts:[P_S,[`/readyz`,`Readiness, one last time.`]],
 saw:`"ready", all three checks ok, visor cyan. Always finish a fix by asking the same question that showed you the problem.`,test:(l,w,r)=>isCurl(r,{status:200,path:'/readyz'})&&w.sample}
],
notes:`<h2>Who acts on a health check</h2>
<div class="tscroll"><table class="types"><thead><tr><th>Platform</th><th>Liveness fails</th><th>Readiness fails</th></tr></thead><tbody>
<tr><td>Docker Compose</td><td>marks the container unhealthy. It does <em>not</em> restart it by itself.</td><td>no separate idea of readiness, but <code>depends_on: condition: service_healthy</code> makes other services wait at start-up</td></tr>
<tr><td>Kubernetes</td><td>restarts the container (<code>livenessProbe</code>)</td><td>stops sending it traffic until it passes again (<code>readinessProbe</code>)</td></tr>
<tr><td>Load balancer, NGINX, cloud platforms</td><td colspan="2">take the instance out of rotation while its check fails, and put it back when it passes</td></tr>
</tbody></table></div>
<p>So on this Kestrel, which runs Docker Compose, you did the restart by hand. On the Kubernetes cluster from <em>Kubernetes from Zero</em> the kubelet would have restarted the bottle's container within half a minute.</p>
<h2>Declaring one</h2>
<p>In a compose file, as on the Kestrel:</p>
<pre class="file">healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
  interval: 10s     # ask this often
  timeout: 2s       # give up on one answer after this long
  retries: 3        # this many failures in a row = unhealthy
  start_period: 5s  # do not count failures while it boots</pre>
<p>In FastAPI the two endpoints are a few lines each:</p>
<pre class="file">@app.get("/healthz")
def healthz():
    return {"status": "ok"}          # no database, no other services

@app.get("/readyz")
async def readyz(response: Response):
    checks = {"db": await db_ok(), "reactor": await reactor_ok()}
    if not all(v == "ok" for v in checks.values()):
        response.status_code = 503
    return {"status": "ready" if response.status_code == 200 else "not ready", "checks": checks}</pre>
<h2>The classic mistake</h2>
<p>Putting a dependency check inside <strong>liveness</strong>. The database has a bad minute, every copy of the API fails its liveness check, the platform restarts all of them at once, and a short slowdown becomes a full outage. Liveness must only ever fail for a reason a restart can fix.</p>`,
quiz:[
{q:'/healthz answers 200 and /readyz answers 503. What is the most likely situation?',opts:['The service has crashed','The service is running, but something it depends on is not available','The network is down','Both checks are broken'],a:1,why:'Liveness passing means the process is fine. Readiness failing means a dependency is not. Look at the dependency.'},
{q:'What should a liveness check test?',opts:['The database connection','Every downstream service','Only that the process itself can answer','The disk, the network and the database'],a:2,why:'If liveness depends on anything outside the process, a problem elsewhere causes needless restarts.'},
{q:'docker compose ps shows a container as "Up 20 minutes (unhealthy)". What does that mean?',opts:['It has stopped','It is running, and its health check is failing','It is still starting','Docker cannot see it'],a:1,why:'Up is about the process. (unhealthy) is the verdict of the health check. They are separate facts.'}],
reading:[
['Liveness, readiness and startup probes (Kubernetes docs)','https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/','The three probe types and exactly what Kubernetes does when each fails.'],
['HEALTHCHECK (Dockerfile reference)','https://docs.docker.com/reference/dockerfile/#healthcheck','How Docker runs a check and what interval, timeout, retries and start period mean.'],
['Compose file: healthcheck (Docker docs)','https://docs.docker.com/reference/compose-file/services/#healthcheck','The same settings in a compose file, and how depends_on can wait for healthy.']]},

{id:6,title:'Alerts: the alarm at mission control',mins:13,
idea:`
<p>The sample is aboard and the Kestrel is heading home. For the last four lessons you found things out by asking. That only works while someone is looking. At three in the morning nobody is.</p>
<p>An <strong>alert</strong> is a query that Prometheus runs for you at every scrape, with an instruction: if this ever returns something, tell a person. It turns a metric into an alarm bell.</p>
<p>Good alerts are hard to write, and the reason is human. An alarm that rings when nothing is wrong teaches people to ignore it, and then they ignore the one that matters. Three rules keep alerts worth trusting:</p>
<dl class="terms">
<dt>Alert on symptoms, not causes</dt><dd>"More than 5% of orders are failing" is a symptom: users are hurt right now. "CPU is at 90%" is a possible cause that is often harmless. Page people for symptoms. Keep causes on a dashboard.</dd>
<dt>Give it time: <code>for</code></dt><dd>A condition must stay true for a set time before the alert <strong>fires</strong>. Until then it is only <strong>pending</strong>. One bad second is not an emergency.</dd>
<dt>Every alert needs an action</dt><dd>If the person who is woken can do nothing about it, it should not be a page.</dd>
</dl>
<p>Behind good alerts sits a promise called a <strong>service level objective</strong> (SLO): a target such as "99% of orders succeed". The allowed 1% is the <strong>error budget</strong>. You alert when the budget is being spent too fast, and not on every single failure.</p>`,
widget:'rules',widgetTitle:'One alert rule',widgetIntro:'A rule is a few lines of YAML in a file Prometheus loads. Tap any line.',
labIntro:'The pill at the top right of the telemetry panel is the alarm: green, amber for pending, red for firing. You will set one off on purpose by switching off the sensor mast, which the Kestrel can spare on the way home.',
tasks:[
{what:`Read the Kestrel's alert rules`,cmd:`cat alerts.yml`,parts:[[`cat`,`Print a file.`],[`alerts.yml`,`The rules file Prometheus was started with.`]],
 saw:`Two rules. ServiceDown: any service whose up is 0 for a minute. OrderErrorsHigh: more than 5% of requests failing for a minute. Both are symptoms, both have a for, both say severity: page.`,test:(l,w,r)=>r.meta.cmd==='cat'&&r.meta.file==='alerts.yml'},
{what:`Check the file before trusting it`,cmd:`promtool check rules alerts.yml`,parts:[[`promtool check rules`,`Read a rules file and report mistakes, without loading it into Prometheus.`]],
 saw:`SUCCESS: 2 rules found. A typo in this file would mean an alert that silently never fires, the worst kind of bug. This check belongs in the CI pipeline from CI from Zero.`,test:(l,w,r)=>r.meta.cmd==='promtool'&&r.meta.sub==='check'},
{what:`Ask which alerts are active`,cmd:`${PQ} 'ALERTS'`,parts:[P_PQ,[`'ALERTS'`,`A metric Prometheus makes itself: one series per alert that is pending or firing.`]],
 saw:`Empty. Nothing is pending, nothing is firing. For an alarm, silence is the normal state, and it should be.`,test:(l,w,r)=>isQ(r,/^ALERTS$/)&&r.meta.n===0},
{what:`Jump for home`,cmd:`curl -s -X POST kestrel.test/orders/jump`,parts:[P_S,P_POST,[`/orders/jump`,`Back through the Aster gate.`]],
 saw:`The Kestrel is on the home side of gate-alpha with the sample aboard. No alarm rang during the jump. That is not luck: the reactor surge is expected, so nobody wrote an alert for it.`,test:(l,w,r)=>isCurl(r,{status:200,order:'jump'})},
{what:`Switch off the sensor mast, to test the alarm`,cmd:`docker compose stop sensors`,parts:[[`docker compose stop`,`Stop a service's container.`],[`sensors`,`The sensor mast.`]],
 saw:`The mast has gone dark on the blueprint and its card says stopped. Nothing else changed: no order needs the sensors on this leg. Now see how long the alarm takes.`,test:(l,w,r)=>r.meta.cmd==='docker'&&r.meta.sub==='stop'&&r.meta.svc==='sensors'},
{what:`Check what Prometheus sees`,cmd:`${PQ} 'up{job="sensors"}'`,parts:[[`up{job="sensors"}`,`The up metric, for the sensors service only.`]],
 saw:`0. Prometheus tried to scrape the sensors' /metrics page and nobody answered. The alert's condition, up == 0, is now true.`,test:(l,w,r)=>isQ(r,/^up\{job="sensors"\}$/)&&r.meta.first===0},
{what:`Is the alarm ringing?`,cmd:`${PQ} 'ALERTS'`,parts:[[`'ALERTS'`,`Active alerts again.`]],
 saw:`ServiceDown for job="sensors", with alertstate="pending" (or firing already, if more than a minute has passed). Pending means the condition is true and the for: 1m clock is running. Nobody has been paged yet. If the mast came back now, the alert would vanish without anyone knowing.`,test:(l,w,r)=>alertIs(r,'ServiceDown',['pending','firing'])},
{what:`Let a minute pass`,cmd:`sleep 60`,parts:[[`sleep 60`,`Do nothing for 60 seconds. In the sandbox the mission clock jumps forward instead.`]],
 saw:`A minute has gone by on the mission clock and the mast is still off.`,test:(l,w,r)=>r.meta.cmd==='sleep'},
{what:`Check the alarm again`,cmd:`${PQ} 'ALERTS'`,parts:[[`'ALERTS'`,`Active alerts.`]],
 saw:`alertstate="firing". The pill at the top of the panel is red. In a real system this is the moment Prometheus hands the alert to Alertmanager, which sends the page, the chat message or the email.`,test:(l,w,r)=>alertIs(r,'ServiceDown',['firing'])},
{what:`Switch the mast back on`,cmd:`docker compose start sensors`,parts:[[`docker compose start`,`Start a stopped service.`]],
 saw:`The mast is back and its card is green.`,test:(l,w,r)=>r.meta.cmd==='docker'&&r.meta.sub==='start'&&r.meta.svc==='sensors'},
{what:`Confirm the alarm has cleared`,cmd:`${PQ} 'ALERTS'`,parts:[[`'ALERTS'`,`Active alerts.`]],
 saw:`Empty again. At the next scrape up was 1, the condition stopped being true and the alert resolved. Alertmanager would send a "resolved" message. An alert that clears by itself when the problem is gone is one people can trust.`,test:(l,w,r)=>isQ(r,/^ALERTS$/)&&r.meta.n===0&&!w.stopped.sensors}
],
notes:`<h2>The pieces around Prometheus</h2>
<ul>
<li><strong>Prometheus</strong> evaluates the rules and decides pending or firing.</li>
<li><strong>Alertmanager</strong> receives firing alerts and handles the human side: grouping related alerts into one message, silencing during maintenance, and routing by label (<code>severity: page</code> to the on-call phone, <code>severity: ticket</code> to a queue).</li>
<li><strong>A paging service</strong> such as PagerDuty or Opsgenie, or simply a chat channel, is where it lands.</li>
</ul>
<h2>From SLO to alert</h2>
<p>Pick a number users would agree means "working": 99% of orders succeed, measured over 30 days. That is the SLO. The 1% that may fail is the error budget: at 4 requests a second, about 100,000 failures a month.</p>
<p>A rule like the one here (5% failing for a minute) fires when the budget is being burned five times faster than planned, which is worth waking someone for. A slow leak, 1.5% failing for a day, deserves a ticket, not a page. The Google SRE workbook chapter below shows how to write both.</p>
<h2>For product and UX work</h2>
<p>An SLO is a product decision before it is a technical one. "How reliable does this need to be for users to trust it?" and "what do we show them during the 1%?" are questions for the person who owns the requirements. Lesson 3 of <em>HTTP + Networking from Zero</em> made the same point about status codes.</p>`,
quiz:[
{q:'An alert is "pending". What does that mean?',opts:['It has been sent to the on-call person','Its condition is true, but not yet for as long as its for: setting requires','It is disabled','It has resolved'],a:1,why:'Pending is the waiting room. Only when the condition has held for the whole for: time does the alert fire.'},
{q:'Which is the better thing to page a person for?',opts:['CPU above 90% on one server','More than 5% of user requests failing for several minutes','One log line at ERROR level','A container restarted once'],a:1,why:'It is a symptom users feel, and it has lasted long enough to be real. The others are possible causes, often harmless.'},
{q:'Why run promtool check rules in CI?',opts:['It makes alerts fire faster','A mistake in a rules file can mean an alert that never fires, and you would not find out until you needed it','It restarts Prometheus','It is required by Docker'],a:1,why:'A broken alert fails silently. Checking the file on every change is cheap insurance.'}],
reading:[
['Alerting rules (Prometheus docs)',PROM+'/prometheus/latest/configuration/alerting_rules/','The rule format, pending against firing, and templates for annotations.'],
['Service Level Objectives (Google SRE book)',SRE+'/sre-book/service-level-objectives/','SLIs, SLOs and error budgets, from the people who named them.'],
['Alerting on SLOs (Google SRE workbook)',SRE+'/workbook/alerting-on-slos/','How to turn an error budget into alerts that page for fast burns and ticket for slow ones.']]},

{id:7,title:'Incident: why did it break?',mins:18,
idea:`
<p>The Kestrel is homebound from gate-alpha with 40 nanograms of antimatter aboard. An hour from Hangar 7, the alarm at mission control goes off.</p>
<p>This lesson is the reason for the other six. You will work one real failure from the first alarm to the fix, using each signal for the question it answers best. The order matters, because each step narrows the search for the next:</p>
<ol>
<li><strong>Alert</strong>: is something wrong? (yes, and roughly what)</li>
<li><strong>Metrics</strong>: what exactly, how bad, since when?</li>
<li><strong>Trace</strong>: where, in the path of one failing order?</li>
<li><strong>Logs</strong>: why, in the words of the service that failed?</li>
<li><strong>Fix, then verify</strong> with the same signals, in reverse.</li>
</ol>
<p>Two habits to hold on to while you work. First, <strong>do not guess</strong>. Every step below is a question whose answer decides the next one. Second, <strong>look for what changed</strong>. Systems that worked a moment ago rarely break on their own: someone deployed something, changed a setting, or the load shifted.</p>
<p>One fact about the Kestrel you will need: the reactor has a hard <strong>power budget of 25 kW</strong>, shared by everything aboard. You met it in <em>NGINX from Zero</em>.</p>`,
widget:'incident',widgetTitle:'The path from alarm to cause',widgetIntro:'Press Next to walk through it, or tap any box.',
labIntro:'The lab opens with the alarm already red. Read each answer before running the next command: the point is to see how one answer chooses the next question. The bottle is running on backup cells, so there is a clock on this, although the sandbox will not punish you for reading carefully.',
tasks:[
{what:`Alert: what is the alarm?`,cmd:`${PQ} 'ALERTS'`,parts:[P_PQ,[`'ALERTS'`,`Which alerts are pending or firing.`]],
 saw:`OrderErrorsHigh, firing. More than 5% of orders have been failing for over a minute. That is a symptom and nothing more. You know users (here, the autopilot) are being hurt. You do not know which orders, or why.`,test:(l,w,r)=>alertIs(r,'OrderErrorsHigh',['firing'])},
{what:`Metrics: which orders are failing?`,cmd:`${PQ} 'sum by (route) (rate(http_requests_total{status=~"5.."}[1m]))'`,parts:[[`{status=~"5.."}`,`Only requests answered with a 5xx status. =~ matches a pattern, and each dot stands for any one character.`],[`rate( … [1m])`,`Per second, over the last minute.`],[`sum by (route) ( … )`,`Added up, keeping one number per route.`]],
 saw:`One route only: /orders/hold, at 0.4 failures a second. hold is the order the autopilot sends every two seconds to keep the bottle's magnetic field powered. Status polls and course trims are fine. The search has gone from "the Kestrel" to one order.`,test:(l,w,r)=>isQ(r,/by ?\(route\)/)&&/5\.\./.test(r.meta.expr)&&r.meta.series.some(x=>x.labels.route==='/orders/hold'&&x.value>0)},
{what:`Metrics: are they failing fast, or slowly?`,cmd:`${PQ} 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route="/orders/hold"}[1m])))'`,parts:[[`{route="/orders/hold"}`,`Only the failing route.`],[`histogram_quantile(0.95, … )`,`Its p95 duration, as in lesson 3.`]],
 saw:`About 2.9 seconds. A healthy hold takes under 0.1. Failures that take almost exactly 3 seconds are not crashes. Something is waiting for an answer and giving up: a timeout. So something downstream of hold is not answering.`,test:(l,w,r)=>isQ(r,/histogram_quantile/)&&/orders\/hold/.test(r.meta.expr)&&r.meta.first>2},
{what:`Reproduce it once, to get a trace id`,cmd:`curl -si -X POST kestrel.test/orders/hold`,parts:[P_SI,P_POST,[`/orders/hold`,`Send one hold order yourself.`]],
 saw:`After three seconds: 504 Gateway Timeout. The body says containment timed out waiting for reactor power, and the x-trace-id header gives you this order's id. One failing example in hand is worth more than any amount of theory.`,test:(l,w,r)=>isCurl(r,{status:504,order:'hold'})},
{what:`Trace: where does it fail?`,cmd:`curl -s localhost:16686/api/traces/${ID_HOLD}`,parts:[[`/api/traces/${ID_HOLD.slice(0,8)}…`,`The trace of the hold order you just sent.`]],
 saw:`Four spans, nested: gate, flight, containment · hold, and reactor · draw, which ran 3000 ms and ended with "deadline exceeded". Every bar above it is red only because the one at the bottom is. The bottle is not the problem. It asked the reactor for power and never got it.`,test:(l,w,r)=>r.meta.cmd==='curl'&&r.meta.jaeger&&r.meta.trace===ID_HOLD&&r.meta.traceOk===false},
{what:`Logs: why did the reactor say no?`,cmd:`docker compose logs | grep ${ID_HOLD}`,parts:[P_LOGS,[`| grep ${ID_HOLD.slice(0,8)}…`,`Every line any service wrote for that order.`]],
 saw:`Five lines. The one that matters is the reactor's WARN: power request denied, over budget. budget_kw 25, thrusters_kw 21, other_kw 4, asked_kw 6. The thrusters alone are drawing 21 of the 25 kW. There is nothing left for the bottle's 6.`,test:(l,w,r)=>isLogs(r)&&r.meta.grep===ID_HOLD&&r.meta.n>0},
{what:`Metrics: confirm who is using the power`,cmd:`${PQ} 'kestrel_power_draw_kw'`,parts:[[`'kestrel_power_draw_kw'`,`A gauge with one series per subsystem.`]],
 saw:`thrusters 21, sensors 2, flight 1, nav 1, containment 0. In lesson 3 the thrusters drew 9. One log line could have been a fluke. The gauge says it is the standing state of the machine.`,test:(l,w,r)=>isQ(r,/^kestrel_power_draw_kw$/)},
{what:`What changed?`,cmd:`docker compose logs thrusters | grep "burn profile"`,parts:[[`docker compose logs thrusters`,`The thrusters' own log.`],[`| grep "burn profile"`,`Lines about the burn setting. Quotes keep the two words together.`]],
 saw:`One line, a few minutes old: burn profile changed, from cruise to sprint, by the pilot, draw_kw 21. There is the cause. The pilot opened the throttle to get home sooner, the thrusters took the whole budget, and the reactor started refusing the bottle. Nothing crashed. A reasonable change had an effect nobody predicted.`,test:(l,w,r)=>isLogs(r)&&r.meta.svcs.includes('thrusters')&&/burn/.test(r.meta.grep||'')&&r.meta.n>0},

notes:`<h2>What each signal did</h2>
<div class="tscroll"><table class="types"><thead><tr><th>Step</th><th>Signal</th><th>It narrowed the search to</th></tr></thead><tbody>
<tr><td>Alarm</td><td>alert</td><td>something is failing</td></tr>
<tr><td>Error rate by route</td><td>metric</td><td>one order: hold</td></tr>
<tr><td>p95 of that route</td><td>metric</td><td>it is a timeout, so something downstream</td></tr>
<tr><td>Waterfall of one failure</td><td>trace</td><td>one hop: containment → reactor</td></tr>
<tr><td>Lines for that trace id</td><td>log</td><td>one reason: over the power budget</td></tr>
<tr><td>Power by subsystem</td><td>metric</td><td>one culprit: thrusters</td></tr>
<tr><td>Thrusters' log</td><td>log</td><td>one change: cruise → sprint</td></tr>
</tbody></table></div>
<p>Take any one signal away and a step becomes a guess. That is the case for having all of them.</p>
<h2>After the incident</h2>
<p>The fix is not the end. A short written review (often called a <strong>postmortem</strong>) records what happened, how it was found, and what would make it impossible or easier next time. It is about the system, never about blaming a person: the pilot made a sensible choice with the information available. Good follow-ups here would be:</p>
<ul>
<li>The thrusters refuse sprint while the bottle is full, or ask the reactor first.</li>
<li>An alert on <code>sum(kestrel_power_draw_kw) / kestrel_power_budget_kw &gt; 0.9</code>, to warn before orders fail.</li>
<li>The reactor says no immediately when over budget, so callers fail in milliseconds and not after a 3 second wait.</li>
<li>The burn change is recorded as a marker on the dashboard, so "what changed?" is answered at a glance.</li>
</ul>
<h2>On your own platform</h2>
<p>For a FastAPI service behind NGINX with Postgres, the same day-one kit is: JSON logs with a trace id on every line; the request counter and duration histogram at <code>/metrics</code>; OpenTelemetry instrumentation for FastAPI, the HTTP client and the database driver; <code>/healthz</code> and <code>/readyz</code>; and two alerts, error fraction and p95 duration. That is an afternoon of work, and it is the difference between "it is broken" and "this is why".</p>`,
quiz:[
{q:'An alert says 12% of requests are failing. What is the most useful next step?',opts:['Restart everything','Read all the logs from the last hour','Break the failing requests down by route and status with a metric query','Wait and see'],a:2,why:'Metrics shrink the search cheaply: from the whole system to one route or one status code, before you read a single log line.'},
{q:'In the failing trace, four spans were marked as errors. Which one do you investigate first?',opts:['The top one, the gate','The deepest one that failed: the others failed because it did','The shortest one','All of them at once'],a:1,why:'Errors travel upward. The lowest failing span is where the failure started.'},
{q:'You applied a fix and one test request now succeeds. Are you done?',opts:['Yes','No: watch the error rate fall and the alert clear, measured the same way that raised it','No: restart every service as well','Yes, if the logs are quiet'],a:1,why:'One success is one example. The incident is over when the signals that showed the problem show that it has gone.'}],
reading:[
['Postmortem Culture: Learning from Failure (Google SRE book)',SRE+'/sre-book/postmortem-culture/','Why incident reviews are blameless, and what a good one contains.'],
['Effective Troubleshooting (Google SRE book)',SRE+'/sre-book/effective-troubleshooting/','A method for working a problem: triage, examine, diagnose, test, cure.'],
['FastAPI instrumentation (OpenTelemetry Python)','https://opentelemetry-python-contrib.readthedocs.io/en/latest/instrumentation/fastapi/fastapi.html','The package that gives a FastAPI app a span for every request.']]}
];

function flow(box,steps){

  function draw(){btns.forEach((b,k)=>{b.setAttribute('aria-pressed',k===i);b.classList.toggle('past',k<i);});
    panel.innerHTML='<code>'+(i+1)+' of '+steps.length+': '+esc(steps[i][0])+'</code><p>'+steps[i][2]+'</p>';

}

    el('section',{class:'term','aria-label':'Terminal'},el('div',{class:'term-bar'},el('span',{text:'Terminal (simulated)'}),el('span',{class:'row'},el('button',{type:'button',class:'mini dark',text:'help',onclick:()=>{if(!busy)print(sim.help,'note');}}),el('button',{type:'button',class:'mini dark',text:'reset',onclick:()=>{if(cur<tasks.length)cur=0;reset(true);}}))),term,form));

/* ----- quiz ----- */
function quiz(L,sec){
  L.quiz.forEach((q,i)=>{
    const key=L.id+'-'+i,fb=el('p',{class:'fb','aria-live':'polite'}),opts=el('div',{class:'opts'});
    function draw(){
      const ch=saved.quiz[key];opts.textContent='';
      q.opts.forEach((o,k)=>opts.append(el('button',{type:'button',class:'opt'+(ch===k?(k===q.a?' right':' wrong'):''),'aria-pressed':ch===k,text:o,onclick:()=>{saved.quiz[key]=k;save();draw();renderNav(L.id);}})));
      fb.className='fb'+(ch==null?'':ch===q.a?' good':' bad');
      fb.textContent=ch==null?'':ch===q.a?'Correct. '+q.why:'Not quite. Have another look at the options, or re-read the section above.';
    }
    sec.append(el('div',{class:'q'},el('p',{class:'qt',text:(i+1)+'. '+q.q}),opts,fb));draw();
  });
}

/* ----- page ----- */
function mount(art,bench,slot){

function showLesson(id){

  const s=el('section',{class:'lab'},el('h2',{text:'Try it'}));art.append(s);const bench=lab(L,s,ctx);s.append(slot);
  if(L.notes)art.append(el('section',{class:'prose notes',html:L.notes}));
  const qs=el('section',{},el('h2',{text:'Check yourself'}));art.append(qs);quiz(L,qs);
  art.append(el('section',{},el('h2',{text:'Further reading'}),el('ul',{class:'reading'},L.reading.map(r=>el('li',{},el('a',{href:r[1],target:'_blank',rel:'noopener',text:r[0]}),el('span',{text:r[2]}))))));
  const prev=LESSONS.find(x=>x.id===L.id-1),next=LESSONS.find(x=>x.id===L.id+1);
  art.append(el('nav',{class:'pager','aria-label':'Lessons'},prev?el('a',{href:'#lesson-'+prev.id,class:'btn ghost',text:'← '+prev.title}):el('span'),next?el('a',{href:'#lesson-'+next.id,class:'btn',text:next.title+' →'}):el('a',{href:'#cheat-sheet',class:'btn',text:'Cheat sheet →'})));
  mount(art,bench,slot);renderNav(L.id);

function showCheats(){

  const art=el('article',{},el('p',{class:'eyebrow',text:'reference'}),el('h1',{text:'Cheat sheet'}),el('p',{class:'prose',text:'Every command and query from the seven lessons, and the translation key. Words in capitals are placeholders for your own values. The sandbox here is free play: the Kestrel is on its way home with the sample aboard and nothing is wrong, until you break something.'}),box,el('section',{class:'slot-sec'},el('h2',{text:'Sandbox'}),slot));

function route(){

})();
