    zone('networks','Networks','who can reach whom by name',w.networks.filter(n=>n.name!=='host'&&n.name!=='none').map(n=>{const m=w.containers.filter(c=>c.network===n.name&&c.status==='running').map(c=>c.alias||c.name);
      return el('div',{class:'rowi'},el('b',{text:n.name+(n.builtin?' (default)':'')}),el('span',{class:'sub',text:m.length?m.join(' ↔ '):'no running containers'}));}),'','docker network ls');

  function reset(clearTerm){
    sim=createSim();sig={};ksig=null;skipped.clear();runId++;busy=false;form.classList.remove('busy');input.disabled=false;if(clearTerm)term.textContent='';
    print('Simulated Docker sandbox. Nothing is installed or run on your device. Type help for the command list.','note');
    if(L.id===8)print('You are in the folder kestrel. Type ls to see its files, or cat compose.yaml to read one.','note');
    drawTasks();drawMap(false);
    if(ctx.onReset)ctx.onReset();
  }
  /* image downloads: a three-second progress bar per layer, like the real client */
  let busy=false,runId=0;
  function pullAnim(marker,id){
    const f=marker.split('|'),mode=f[1],ref=f[2],lay=f[3].split(',').map(x=>{const p=x.split('~'),m=/^([\d.]+)(\w+)$/.exec(p[1])||[0,'0','B'];return {name:p[0],num:+m[1],unit:m[2]};});
    const shown=lay.slice(0,8),more=lay.length-shown.length,DUR=3000,W=18;
    const rows=shown.map(()=>{const d=el('div',{class:'tl'});term.append(d);return d;});
    if(more>0)term.append(el('div',{class:'tl note',text:'(+'+more+' more layers)'}));
    const bar=p=>{const n=Math.round(p*W);return '['+'='.repeat(Math.max(0,n-1))+(n>0&&n<W?'>':n>=W?'=':'')+' '.repeat(W-n)+']';};
    const kb=$('.kb',kwrap);if(kb)kb.classList.add('fx-pull');
    let mapRow=null,bars=[],cap=null,lastDone=-1;

      const zl=$('.z-images .zlist',map);

        mapRow=el('div',{class:'rowi pulling'},el('b',{text:ref}),el('div',{class:'lstack'},bars),cap);zl.append(mapRow);}
    }
    return new Promise(res=>{
      const t0=performance.now();
      const tick=()=>{
        if(id!==runId){clearInterval(iv);res();return;}
        const t=Math.min(DUR,performance.now()-t0);let done=0;
        rows.forEach((d,i)=>{
          const L=shown[i],st=i*180,en=DUR*(0.55+0.45*(i+1)/rows.length),p=Math.max(0,Math.min(1,(t-st)/(en-st))),dl=Math.min(1,p/0.85),full=L.num.toFixed(1)+L.unit;
          const lab=mode==='C'?' '+(p>=1?'✔':'⠇')+' '+L.name+' ':L.name+': ';
          if(p>=1)done++;
          d.textContent=p>=1||(p>0&&L.num===0)?lab+(mode==='C'?'Pulled':'Pull complete'):p<=0?lab+'Waiting':p<0.85?lab+(mode==='C'?'Pulling     ':'Downloading ')+bar(dl)+' '+(L.num*dl).toFixed(1)+L.unit+'/'+full:lab+'Extracting  '+bar(1)+' '+full+'/'+full;
        });
        if(mapRow&&done!==lastDone){lastDone=done;const k=done>=rows.length?lay.length:done;bars.forEach((b,n)=>b.classList.toggle('on',n<k));cap.textContent='downloading: '+k+' of '+lay.length+' layers';}
        term.scrollTop=term.scrollHeight;
        if(t>=DUR){clearInterval(iv);if(kb)kb.classList.remove('fx-pull');res();}
      };
      const iv=setInterval(tick,80);tick();
    });
  }
  /* output arrives one line at a time, and the newest line is kept in view */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function showLine(text,cls){const d=el('div',{class:'tl '+(cls||''),text:text});term.append(d);term.scrollTop=term.scrollHeight;term.scrollLeft=0;return d;}
  async function printOut(text,cls,id){
    if(text==='')return;
    const lines=text.split('\n'),gap=Math.max(25,Math.min(110,2600/lines.length));

      const ln=lines[n];
      if(ln.charCodeAt(0)===1)await pullAnim(ln,id);
      else{showLine(ln,cls);if(n<lines.length-1)await sleep(gap);}
      if(id!==runId)return;
    }
    await sleep(gap);
  }
  function keepInView(){if(WIDE.matches)return;const b=form.getBoundingClientRect();if(b.bottom>window.innerHeight||b.top<80)form.scrollIntoView({block:'end',behavior:'smooth'});}
  async function runLine(){
    if(busy)return;
    const line=input.value.trim();if(!line)return;input.value='';hist.push(line);hi=hist.length;
    print('$ '+line,'in');
    keepInView();
    const r=sim.exec(line);
    if(r.clear){term.textContent='';return;}
    const id=runId;busy=true;form.classList.add('busy');input.disabled=true;
    await printOut(r.out,r.ok?'':'err',id);
    if(id!==runId)return;
    busy=false;form.classList.remove('busy');input.disabled=false;
    if(ctx.onRun)ctx.onRun(line,r);
    if(cur<tasks.length){
      const l=norm(line);let pass=false,jump=0;try{pass=!!tasks[cur].test(l,sim.world,r);}catch(e){}
      /* ran a later step's command: move on to it and mark the ones in between as skipped */
      if(!pass)for(let k=cur+1;k<tasks.length;k++){let ok=false;try{ok=l===norm(tasks[k].cmd)&&!!tasks[k].test(l,sim.world,r);}catch(e){}
        if(ok){for(let s=cur;s<k;s++)skipped.add(s);jump=k-cur;cur=k;pass=true;break;}}
      /* went back to a skipped step: tick it off */
      if(!pass)for(const s of [...skipped]){let ok=false;try{ok=l===norm(tasks[s].cmd)&&!!tasks[s].test(l,sim.world,r);}catch(e){}
        if(ok){skipped.delete(s);print('✓ Step '+(s+1)+' of '+tasks.length+' done. '+tasks[s].saw,'ok');drawTasks();break;}}
      if(pass){
        const t=tasks[cur];cur++;
        print('✓ Step '+cur+' of '+tasks.length+' done'+(jump?' ('+jump+' earlier step'+(jump>1?'s':'')+' skipped). ':'. ')+t.saw,'ok');
        if(cur>=tasks.length){saved.done[L.id]=true;save();renderNav(L.id);print('✓ Lesson '+L.id+' lab complete.','ok');}
        drawTasks();
        if(WIDE.matches){const n=$('.task.now',list)||banner;if(n.scrollIntoView)n.scrollIntoView({block:'nearest'});}

  }
  input.addEventListener('keydown',e=>{

    else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);input.value=hist[hi]||'';}
  });
  if(sec&&tasks.length)sec.append(el('p',{text:L.labIntro}),list,banner);
  const bench=el('div',{class:'bench-in'},
    el('section',{class:'map','aria-label':'What Docker holds right now'},el('div',{class:'map-head'},el('b',{text:'KF-07 Kestrel Mk II · Hangar 7'}),el('span',{text:'what Docker holds right now'})),kwrap,map),
    stepbar,
    el('section',{class:'term','aria-label':'Terminal'},el('div',{class:'term-bar'},el('span',{text:'Terminal (simulated)'}),el('span',{class:'row'},el('button',{type:'button',class:'mini dark',text:'help',onclick:()=>{input.value='help';runLine();}}),el('button',{type:'button',class:'mini dark',text:'reset',onclick:()=>{if(cur<tasks.length)cur=0;reset(true);}}))),term,form));
  ctx.sim=()=>sim;ctx.load=c=>loadCmd(c,true);
  reset(false);
  return bench;
}

/* ----- quiz ----- */
function quiz(L,sec){
  L.quiz.forEach((q,i)=>{
    const key=L.id+'-'+i,fb=el('p',{class:'fb','aria-live':'polite'}),opts=el('div',{class:'opts'});
    function draw(){
      const ch=saved.quiz[key];opts.textContent='';
      q.opts.forEach((o,k)=>opts.append(el('button',{type:'button',class:'opt'+(ch===k?(k===q.a?' right':' wrong'):''),'aria-pressed':ch===k,text:o,onclick:()=>{saved.quiz[key]=k;save();draw();renderNav(L.id);}})));
      fb.className='fb'+(ch==null?'':ch===q.a?' good':' bad');
      fb.textContent=ch==null?'':ch===q.a?'Correct. '+q.why:'Not quite. Have another look at the options, or re-read the section above.';
    }
    sec.append(el('div',{class:'q'},el('p',{class:'qt',text:(i+1)+'. '+q.q}),opts,fb));draw();
  });
}

/* ----- page ----- */
function mount(art,bench,slot){
  const main=$('#main'),old=benchEl;main.textContent='';if(old)old.remove();
  main.append(art);benchEl=bench;slotEl=slot;placeBench();
}
function showLesson(id){
  const L=LESSONS.find(x=>x.id===id)||LESSONS[0];
  const art=el('article',{}),slot=el('div',{class:'slot'}),ctx={};
  art.append(el('p',{class:'eyebrow',text:'Lesson '+L.id+' of '+LESSONS.length+' · about '+L.mins+' minutes'}),el('h1',{text:L.title}),L.brief?el('aside',{class:'brief'},el('span',{class:'sb-h',text:'Hangar 7 briefing'}),el('p',{html:L.brief})):null,el('section',{class:'prose',html:L.idea}));
  const widget=()=>{if(!L.widget)return;const box=el('div',{class:'widget'});art.append(el('section',{},el('h2',{text:L.widgetTitle}),el('p',{text:L.widgetIntro}),box));W[L.widget](box,ctx);};
  if(L.widget!=='cheats')widget();
  let bench;
  if(L.tasks){const s=el('section',{class:'lab'},el('h2',{text:'Try it'}));art.append(s);bench=lab(L,s,ctx);s.append(slot);}
  else{bench=lab(L,null,ctx);art.append(el('section',{class:'slot-sec'},el('h2',{text:'Sandbox'}),el('p',{text:'This lesson has no lab, but the sandbox is open if you want to look around.'}),slot));}
  if(L.widget==='cheats')widget();

  const qs=el('section',{},el('h2',{text:'Check yourself'}));art.append(qs);quiz(L,qs);
  art.append(el('section',{},el('h2',{text:'Further reading'}),el('ul',{class:'reading'},L.reading.map(r=>el('li',{},el('a',{href:r[1],target:'_blank',rel:'noopener',text:r[0]}),el('span',{text:r[2]}))))));

  art.append(el('nav',{class:'pager','aria-label':'Lessons'},prev?el('a',{href:'#lesson-'+prev.id,class:'btn ghost',text:'← '+prev.title}):el('span'),next?el('a',{href:'#lesson-'+next.id,class:'btn',text:next.title+' →'}):el('a',{href:'#cheat-sheet',class:'btn',text:'Cheat sheet →'})));
  mount(art,bench,slot);renderNav(L.id);

function showCheats(){
  const box=el('div',{class:'widget'}),slot=el('div',{class:'slot'});
  const art=el('article',{},el('p',{class:'eyebrow',text:'man docker  # reference'}),el('h1',{text:'Cheat sheet'}),el('p',{class:'prose',text:'Every command from the nine lessons. Words in capitals are placeholders for your own names. The sandbox here is free play: try any of them.'}),box,el('section',{class:'slot-sec'},el('h2',{text:'Sandbox'}),slot));

}
function route(){
  const h=location.hash.replace('#','');const m=/^lesson-(\d+)$/.exec(h);

window.addEventListener('hashchange',route);route();
})();
