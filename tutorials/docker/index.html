<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right the Kestrel Mk II blueprint and a live map of what Docker holds, above a terminal that changes it. One dark terminal world; on phones the map-and-terminal bench sits inside the lesson, under the steps. */
:root{
  --bg:#0a0e13; --surface:#10161c; --sunk:#172029; --ink:#d6dfe6; --muted:#8696a3; --line:#222e38;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#12283f;
  --good:#3ddc97; --good-soft:#0f2e22; --warn:#f2b84b; --warn-soft:#33270d; --bad:#ff7b72; --bad-soft:#3b1716;
  --term:#05080b; --term-ink:#cfdae2; --term-dim:#7d8d99; --term-line:#1a242d;
  --display:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
code,pre{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.brand{font:700 1.25rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
#progress-text{font-size:.85rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{flex-basis:100%;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
#nav{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:8px;flex:none;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;white-space:nowrap}
.nav-item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--mono)}
.nav-item.done .num{background:var(--good-soft);color:var(--good)}
.nav-item.active{border-color:var(--accent);background:var(--accent-soft)}
.nav-item.active .num{background:var(--accent);color:var(--accent-ink)}
main{padding:8px 16px 64px;min-width:0}
article{max-width:760px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
h1{font:700 clamp(1.9rem,6vw,2.7rem)/1.1 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font:600 1.35rem/1.25 var(--display);margin:40px 0 8px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--body);margin:20px 0 6px}
h4{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin-bottom:6px}
.prose code,.task code,.explain code,.saw code{background:var(--sunk);padding:1px 5px;border-radius:4px}
dl.terms{margin:16px 0;display:grid;gap:10px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;padding-left:14px;border-left:3px solid var(--accent-soft);color:var(--ink)}
pre.file{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.caption{font-size:.92rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:9px 14px;font-weight:600;text-decoration:none;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:.85rem}
.mini.dark{background:transparent;border-color:var(--term-line);color:var(--term-ink)}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;align-self:flex-start}
.seg{background:var(--surface);border:0;padding:8px 14px;font-weight:500}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.re{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
/* stack diagram */
.stack{display:flex;flex-direction:column;gap:6px}
.stack-row{display:flex;gap:6px}
.blk{flex:1;text-align:center;padding:10px 6px;border-radius:4px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--sunk)}
.blk.app{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blk.lib{background:var(--accent-soft)}
.blk.os{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.blk.eng{background:var(--good-soft);color:var(--good);border-color:transparent}
/* layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.col-h{font:500 .75rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.layer{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:8px 10px;margin-bottom:4px;display:flex;flex-direction:column}
.layer span{font:400 .75rem var(--mono);color:var(--muted)}
.layer.rw{background:var(--good-soft);border-color:transparent}
.cons{display:flex;flex-wrap:wrap;gap:10px}
.con{flex:1 1 130px;border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px}
.uses{font-size:.75rem;color:var(--muted);text-align:center}
/* annotated code */
.scroll-x{overflow-x:auto;border-radius:4px;background:var(--term)}
.code-lines{display:inline-flex;flex-direction:column;min-width:100%;padding:10px 0}
.cl{font:400 .84rem/1.5 var(--mono);white-space:pre;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--term-ink);padding:3px 14px 3px 11px}
.cl.plain{color:var(--term-dim)}
button.cl:hover{background:var(--term-line)}
.cl[aria-pressed="true"]{background:var(--term-line);border-left-color:var(--accent)}
.explain{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.explain code{display:inline-block;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.explain p{margin:0}
.cache{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:12px}
.cache h3,.cache p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.steps code{overflow-wrap:anywhere;font-size:.82rem}
/* ports */
.port-form{display:flex;align-items:flex-end;gap:8px}
.port-form label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
.port-form input,#cheat-filter{font:500 16px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:118px}
.colon{font:600 1.4rem var(--mono);padding-bottom:6px}
.cmdline{background:var(--term);color:var(--term-ink);padding:10px 12px;border-radius:4px;overflow-x:auto;white-space:nowrap;display:block}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hop{flex:1 1 130px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:.82rem;color:var(--muted);background:var(--sunk)}
.hop b{color:var(--ink);font-family:var(--mono);font-weight:500}
.arrow{font-size:1.2rem;color:var(--good)}
.arrow.broken{color:var(--bad)}
.verdict{margin:0;padding:10px 12px;border-radius:4px;font-size:.95rem}
.verdict.good,.fb.good{background:var(--good-soft);color:var(--good)}
.verdict.bad,.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* tasks */
.tasks{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.task.todo{opacity:.6;background:transparent}
.task.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task-h{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .78rem var(--mono);margin-top:1px}
.task.done .mark{background:var(--good-soft);color:var(--good)}
.task.now .mark{background:var(--accent);color:var(--accent-ink)}
.what{font-weight:600}
.ran{display:block;margin:8px 0 6px 34px;overflow-wrap:anywhere}
.saw{margin:0 0 0 34px;font-size:.92rem;color:var(--muted)}
.cmd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;margin:10px 0;background:var(--term);color:var(--term-ink);border:0;border-radius:4px;padding:10px 12px}
.task .cmd code{background:none;padding:0;overflow-wrap:anywhere;font-size:.9rem}
.tap{font:500 .72rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
dl.parts{margin:0;display:grid;gap:6px}
dl.parts dt code{font-weight:500}
dl.parts dd{margin:0 0 4px;font-size:.92rem;color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.banner .mini{color:var(--ink);margin-top:6px}
/* terminal */
.term{background:var(--term);border-radius:4px;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--term-line);font:500 .75rem var(--mono);color:var(--term-dim);text-transform:uppercase;letter-spacing:.06em}
.term-out{height:260px;overflow:auto;padding:10px 12px;font:400 .8rem/1.5 var(--mono);color:var(--term-ink)}
.tl{white-space:pre;min-height:1.2em}
.tl.in{color:#fff;font-weight:500;margin-top:6px}
.tl.err{color:#ffb4a8}
.tl.note{color:var(--term-dim);white-space:pre-wrap}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--term-line)}
.prompt{font:500 1rem var(--mono);color:#7fd1a6}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--mono);padding:6px 0}
.term-in input::placeholder{color:var(--term-dim)}
.term-in input:focus{outline:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.run{background:#7fd1a6;color:#06231a;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.world-wrap{margin-top:14px}
.world{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wg{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.wg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.9rem}
.wg b{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.sub{flex-basis:100%;font:400 .75rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.pill.off{background:var(--sunk)}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.qt{font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:10px 0 0;border-radius:4px;font-size:.93rem}
.fb.good,.fb.bad{padding:9px 12px}
.reading{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.reading li{display:flex;flex-direction:column}
.reading a{font-weight:600}
.reading span{font-size:.92rem;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.cheats h3{font:500 .75rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
dl.cheat{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.cheat dt code{font-weight:500;overflow-wrap:anywhere}
dl.cheat dd{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
#cheat-filter{width:100%;font-family:var(--body)}
@media (min-width:640px){dl.cheat{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 16px}dl.cheat dd{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* terminal / dashboard chrome */
header.top{background:var(--surface);padding:10px 16px 0}
.top-in{align-items:center;gap:6px 12px}
.dots{display:inline-flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--bad)}
.dots i:nth-child(2){background:var(--warn)}
.dots i:nth-child(3){background:var(--good)}
.brand{font:500 .95rem/1.2 var(--mono);letter-spacing:0;color:var(--ink)}
.brand span{color:var(--good)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--good);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-text{font:400 .78rem var(--mono)}
.bar{height:2px;border-radius:0;margin-top:10px;background:var(--line)}
#progress-bar{background:var(--good)}
.nav-item{font:400 .82rem var(--mono);padding:5px 10px 5px 5px}
.nav-item .num{border-radius:3px;width:28px;height:24px;font-size:.75rem}
.nav-item.active{background:var(--accent-soft)}
.eyebrow{color:var(--good);text-transform:none;letter-spacing:0}
.eyebrow::before{content:"$ ";color:var(--muted)}
h1{font:700 clamp(1.5rem,5.4vw,2.1rem)/1.2 var(--mono);letter-spacing:-.01em}
h1::before{content:"> ";color:var(--accent)}
h2{font:700 1.08rem/1.3 var(--mono);padding-top:20px;border-top:1px solid var(--line)}
h2::before{content:"## ";color:var(--muted);font-weight:400}
.cache h3,.world-wrap h3,.cheats h3{font-family:var(--mono)}
.btn,.mini,.seg,.what,.qt,.col-h,dl.terms dt{font-family:var(--mono)}
.btn,.what,.qt,dl.terms dt{font-size:.92rem}
.btn{font-weight:500}
.btn::before{content:"[ "}.btn::after{content:" ]"}
.mini{background:var(--sunk)}
.seg{font-size:.85rem}
dl.terms dt::before{content:"\25B8  ";color:var(--good)}
dl.terms dd{border-left-color:var(--line)}
.prose code,.task code,.explain code,.saw code{color:#9fd0ff}
.task .cmd code{color:var(--good)}
.cmd{border:1px solid var(--term-line)}
.cmd code::before{content:"$ ";color:var(--term-dim)}
.ran::before{content:"$ ";color:var(--muted)}
.widget,.q,.wg,.task{background:var(--surface)}
.task.now{box-shadow:none;border-color:var(--accent);background:var(--accent-soft)}
.mark{border-radius:3px}
.term,.scroll-x{border:1px solid var(--line)}
.term-bar{background:var(--surface);color:var(--muted)}
.term-bar>span:first-child::before{content:"\25CF \25CF \25CF  ";color:var(--line);letter-spacing:1px}
.prompt{color:var(--good)}
.run{background:var(--good);color:#04121f;font-family:var(--mono)}
.wg{padding:0;overflow:hidden}
.wg h4{padding:8px 12px;margin:0;border-bottom:1px solid var(--line);background:var(--sunk)}
.wg ul{gap:0}
.wg li{padding:8px 12px;border-bottom:1px solid var(--line)}
.wg li:last-child{border-bottom:0}
.wg .empty{padding:8px 12px;font-family:var(--mono);font-size:.8rem}
.pill.ok::before,.pill.bad::before,.pill.off::before{content:"\25CF  "}
.opt{background:var(--sunk)}
.opt::before{content:"( )  ";font-family:var(--mono);color:var(--muted)}
.opt.right::before{content:"(\2713)  ";color:var(--good)}
.opt.wrong::before{content:"(\00D7)  ";color:var(--bad)}
.reading a{font-family:var(--mono);font-size:.9rem;font-weight:500}
.blk.app{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}

/* split layout: lesson | bench (map above terminal) */
html,body{height:100%}
.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:static;padding:10px 16px 0}
#nav{padding:10px 0 10px;flex:1 1 100%;order:3}
.bar{order:4;margin-top:0}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
main.lesson{padding:8px 16px 56px;min-width:0}
article{max-width:70ch;margin:0 auto}
.bench{display:none}
.bench-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{margin-top:16px}
.map{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:auto}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font:400 .75rem var(--mono);color:var(--muted)}
.map-head b{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--muted);border-right:1px solid var(--line);min-width:0;transition:background-color .7s}
.zone.wide{grid-column:span 2}
.zone.flash{background:var(--accent-soft);transition:none}
.z-containers{border-top-color:var(--good)}.z-images{border-top-color:var(--accent)}.z-volumes{border-top-color:var(--warn)}.z-networks{border-top-color:#b392f0}
.zone h3{font:700 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:0}
.zsub{font-size:.75rem;color:var(--muted);margin-top:-6px}
.zlist{display:flex;flex-direction:column;gap:8px;flex:1}
.z-containers .zlist{flex-direction:row;flex-wrap:wrap}
.zone .exit{font:500 .72rem var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.zone .exit::before{content:"$ ";color:var(--good)}
.card{flex:1 1 132px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:4px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.up{border-left-color:var(--good)}
.card-h{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card b,.rowi b{font:500 .85rem var(--mono);overflow-wrap:anywhere}
.rowi{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 .68rem/1.3 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.chip.port{border-color:var(--accent);color:var(--accent)}
.chip.vol{border-color:var(--warn);color:var(--warn)}
.chip.net{border-color:#b392f0;color:#b392f0}
.stepbar{display:flex;flex-direction:column;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:10px 12px}
.sb-h{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sb-w{font:500 .9rem var(--mono)}
.stepbar .cmd{margin:6px 0 0}
.stepbar .cmd code{color:var(--good);overflow-wrap:anywhere;font-size:.88rem}

<script>
/* ---------- Docker simulator: pure logic, no DOM ---------- */
function createSim(){
  let seed=20261113;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const hex=n=>{let s='';while(s.length<n)s+=Math.floor(rnd()*16).toString(16);return s;};
  const REG={
    'hello-world':{tags:['latest'],size:'20.4kB',layers:1},
    'hangar-7/kestrel-reactor':{tags:['1.0','latest'],size:'187MB',layers:8},
    nginx:{tags:['latest'],size:'192MB',layers:7},
    postgres:{tags:['17','latest'],size:'432MB',layers:14},
    python:{tags:['3.14-slim','latest'],size:'124MB',layers:4},
    alpine:{tags:['latest'],size:'7.8MB',layers:1},
    redis:{tags:['7','latest'],size:'117MB',layers:8}
  };
  const DEB=['ADD rootfs.tar.xz /  (Debian base system)','74.8MB'];
  const LAYERS={
    'hello-world':[['COPY hello /','20.4kB']],
    alpine:[['ADD alpine-minirootfs.tar.gz /','7.8MB']],
    nginx:[DEB,['RUN apt-get install nginx','117MB'],['COPY docker-entrypoint.sh /','1.6kB'],['COPY 10-listen-on-ipv6-by-default.sh','2.1kB'],['COPY 15-local-resolvers.envsh','0.4kB'],['COPY 20-envsubst-on-templates.sh','3.0kB'],['COPY 30-tune-worker-processes.sh','4.6kB']],
    python:[DEB,['RUN apt-get install ca-certificates tzdata','9.2MB'],['RUN build and install Python 3.14','40.0MB'],['RUN ln -s python3 /usr/local/bin/python','0.1kB']]
  };
  const APP_LAYERS=[['WORKDIR /app','0B'],['COPY requirements.txt .','0.1kB'],['RUN pip install --no-cache-dir -r requirements.txt','62.9MB'],['COPY . .','1.2kB']];
  function layersFor(repo){
    if(repo==='hangar-7/kestrel-reactor')return layersFor('python').concat(APP_LAYERS.map(x=>({id:hex(12),by:x[0],size:x[1]})));
    let L=LAYERS[repo];
    if(!L){const r=REG[repo],n=r.layers,rest=((parseFloat(r.size)-74.8)/(n-1)).toFixed(1)+'MB';L=[DEB];for(let i=1;i<n;i++)L.push([`RUN set up ${repo} (step ${i} of ${n-1})`,rest]);}
    return L.map(x=>({id:hex(12),by:x[0],size:x[1]}));
  }
  const LISTEN={nginx:80,postgres:5432,redis:6379,api:8000};
  const AUTO=['brave_hopper','quiet_lovelace','eager_turing','keen_ride','calm_noether','bold_curie','wise_hamilton','kind_franklin'];
  const PGDATA='/var/lib/postgresql/data';
  const PIP='RUN pip install --no-cache-dir -r requirements.txt';
  const ORDERS={
    good:[['FROM python:3.14-slim',[],8],['WORKDIR /app',[],0.1],['COPY requirements.txt .',['req'],0.1],[PIP,[],19],['COPY . .',['main','req'],0.2]],
    bad:[['FROM python:3.14-slim',[],8],['WORKDIR /app',[],0.1],['COPY . .',['main','req'],0.2],[PIP,[],19]]};
  const w={images:[],containers:[],volumes:[],binds:{},builds:{},nameIx:0,proj:{ord:'good',dirty:[],valid:0,ever:false},
    networks:[{name:'bridge',driver:'bridge',builtin:true},{name:'host',driver:'host',builtin:true},{name:'none',driver:'null',builtin:true}]};
  let meta={};

  const tok=s=>{const out=[];const re=/"([^"]*)"|'([^']*)'|(\S+)/g;let m;while((m=re.exec(s)))out.push(m[1]!==undefined?m[1]:m[2]!==undefined?m[2]:m[3]);return out;};
  const ref=s=>{const i=s.lastIndexOf(':');return i>0?[s.slice(0,i),s.slice(i+1)]:[s,'latest'];};
  const img=(repo,tag)=>w.images.find(i=>i.repo===repo&&i.tag===tag);
  const byName=n=>w.containers.find(c=>c.name===n)||(n.length>=3?w.containers.find(c=>c.id.startsWith(n)):undefined);
  const table=rows=>{const wd=rows[0].map((_,i)=>Math.max(...rows.map(r=>String(r[i]).length)));return rows.map(r=>r.map((c,i)=>String(c).padEnd(wd[i]+3)).join('').trimEnd()).join('\n');};
  const userNet=n=>{const x=w.networks.find(k=>k.name===n);return x&&!x.builtin;};
  const portBusy=(h,except)=>w.containers.find(c=>c!==except&&c.status==='running'&&c.ports.some(p=>p.h===h));

  function pull(repo,tag,out,implicit){
    const r=REG[repo];
    if(implicit)out.push(`Unable to find image '${repo}:${tag}' locally`);
    if(!r){out.push(`Error response from daemon: pull access denied for ${repo}, repository does not exist or may require 'docker login'`);return null;}
    if(!r.tags.includes(tag)){out.push(`Error response from daemon: manifest for ${repo}:${tag} not found: manifest unknown`);return null;}
    out.push(`${tag}: Pulling from ${repo.includes('/')?repo:'library/'+repo}`);
    const lay=layersFor(repo);
    out.push(`\u0001PULL|L|${repo}:${tag}|${lay.map(l=>l.id+'~'+l.size).join(',')}`);
    out.push(`Digest: sha256:${hex(20)}...`);
    out.push(`Status: Downloaded newer image for ${repo}:${tag}`);
    const im={repo,tag,id:hex(12),size:r.size,layers:lay};w.images.push(im);return im;
  }

  function addPort(o,v){
    const p=v.split(':');const c=+p[p.length-1];const h=p.length>1?+p[p.length-2]:32768+Math.floor(rnd()*1000);
    if(!Number.isInteger(c)||!Number.isInteger(h)||c<1||h<1||c>65535||h>65535)throw new Error(`invalid port mapping "${v}". Use HOST:CONTAINER, for example 8080:80`);
    o.ports.push({h,c});
  }
  function addEnv(o,v){const i=v.indexOf('=');if(i<1)throw new Error(`invalid environment variable "${v}". Use KEY=value`);o.env[v.slice(0,i)]=v.slice(i+1);}
  function addMount(o,v){
    const i=v.indexOf(':');if(i<1)throw new Error(`invalid volume "${v}". Use NAME:/path/in/container`);
    const src=v.slice(0,i),dst=v.slice(i+1).split(':')[0];
    o.mounts.push({src,dst,type:/^[\/.~]/.test(src)?'bind':'volume'});
  }
  function parseRun(a){
    const o={d:false,it:false,rm:false,ports:[],env:{},mounts:[],name:null,network:null,image:null,cmd:[]};
    let i=0;const need=f=>{if(i+1>=a.length)throw new Error(`flag needs an argument: ${f}`);return a[++i];};
    for(;i<a.length;i++){
      let t=a[i];
      if(!t.startsWith('-')){o.image=t;o.cmd=a.slice(i+1);break;}
      let val=null;
      if(t.startsWith('--')&&t.includes('=')){val=t.slice(t.indexOf('=')+1);t=t.slice(0,t.indexOf('='));}
      const arg=()=>val!==null?val:need(t);
      switch(t){
        case '--detach':o.d=true;break;
        case '--rm':o.rm=true;break;
        case '--interactive':case '--tty':o.it=true;break;
        case '--publish':addPort(o,arg());break;
        case '--name':o.name=arg();break;
        case '--env':addEnv(o,arg());break;
        case '--volume':addMount(o,arg());break;
        case '--network':case '--net':o.network=arg();break;
        default:{
          if(t.startsWith('--'))throw new Error(`unknown flag: ${t}`);
          const L=t.slice(1).split('');
          for(let k=0;k<L.length;k++){const ch=L[k];
            if(ch==='d')o.d=true;else if(ch==='i'||ch==='t')o.it=true;
            else if('pev'.includes(ch)){if(k!==L.length-1)throw new Error(`flag -${ch} needs a value right after it`);const v=need('-'+ch);ch==='p'?addPort(o,v):ch==='e'?addEnv(o,v):addMount(o,v);}
            else throw new Error(`unknown shorthand flag: '${ch}' in ${t}`);
          }
        }
      }
    }
    return o;
  }

  function store(c){
    const m=c.mounts.find(m=>m.dst.replace(/\/$/,'')===PGDATA);
    if(!m)return c.data;
    if(m.type==='volume')return w.volumes.find(v=>v.name===m.src).data;
    return w.binds[m.src]||(w.binds[m.src]={tables:[]});
  }
  function resolve(c,host){
    if(host==='localhost'||host==='127.0.0.1')return '127.0.0.1';
    if(!userNet(c.network))return null;
    const list=w.containers.filter(x=>x.network===c.network);
    const t=list.find(x=>x!==c&&x.status==='running'&&(x.name===host||x.alias===host));
    return t?`172.18.0.${2+list.indexOf(t)}`:null;
  }
  function sql(c,q){
    const st=store(c),s=q.trim();let m;
    if(/^\\dt/.test(s)){
      meta.tables=st.tables.length;
      if(!st.tables.length)return ['Did not find any relations.'];
      const wd=Math.max(4,...st.tables.map(t=>t.length));
      return ['        List of relations',` Schema | ${'Name'.padEnd(wd)} | Type  |  Owner`,`--------+-${'-'.repeat(wd)}-+-------+----------`,

        const dirs=[...new Set(c.rw.map(f=>f.slice(0,f.lastIndexOf('/'))).filter(Boolean))];
        out.push(...auto,...dirs.map(d=>'C '+d),...c.rw.map(f=>'A '+f));meta.diff=c;return true;
      }
      case 'build':return build(rest,out);
      case 'volume':{
        const s=rest[0],n=rest[1];
        if(s==='ls'){out.push(table([['DRIVER','VOLUME NAME'],...w.volumes.map(v=>['local',v.name])]));return true;}
        if(s==='create'){const name=n||hex(64);if(!w.volumes.some(v=>v.name===name))w.volumes.push({name,data:{tables:[]}});out.push(name);return true;}
        if(s==='rm'){const v=w.volumes.find(v=>v.name===n);if(!v){out.push(`Error response from daemon: get ${n}: no such volume`);return false;}
          const u=w.containers.find(c=>c.mounts.some(m=>m.type==='volume'&&m.src===n));
          if(u){out.push(`Error response from daemon: remove ${n}: volume is in use - [${u.id.slice(0,12)}]`);return false;}
          w.volumes.splice(w.volumes.indexOf(v),1);out.push(n);return true;}
        out.push('simulator: try docker volume ls, docker volume create NAME or docker volume rm NAME');return false;
      }
      case 'network':{
        const s=rest[0],n=rest[1];
        if(s==='ls'){out.push(table([['NETWORK ID','NAME','DRIVER'],...w.networks.map(k=>[(k.id||(k.id=hex(12))),k.name,k.driver])]));return true;}
        if(s==='create'){if(!n){out.push('"docker network create" requires exactly 1 argument: the network name');return false;}
          if(w.networks.some(k=>k.name===n)){out.push(`Error response from daemon: network with name ${n} already exists`);return false;}
          const id=hex(64);w.networks.push({name:n,driver:'bridge',id:id.slice(0,12)});out.push(id);return true;}
        if(s==='rm'){const k=w.networks.find(k=>k.name===n);if(!k||k.builtin){out.push(k?`Error response from daemon: ${n} is a pre-defined network and cannot be removed`:`Error response from daemon: network ${n} not found`);return false;}
          if(w.containers.some(c=>c.network===n)){out.push(`Error response from daemon: error while removing network: network ${n} has active endpoints`);return false;}
          w.networks.splice(w.networks.indexOf(k),1);out.push(n);return true;}
        out.push('simulator: try docker network ls, docker network create NAME or docker network rm NAME');return false;
      }
      case 'compose':return compose(rest,out);
      case 'system':{
        if(rest[0]!=='prune'){out.push('simulator: only docker system prune is modelled');return false;}
        out.push('WARNING! This will remove:','  - all stopped containers','  - all networks not used by at least one container','  - all dangling images','  - unused build cache','','Are you sure you want to continue? [y/N] y   (simulator answered for you)');
        const dead=w.containers.filter(c=>c.status!=='running');
        if(dead.length){out.push('Deleted Containers:',...dead.map(c=>c.id));dead.forEach(c=>w.containers.splice(w.containers.indexOf(c),1));}
        const nets=w.networks.filter(k=>!k.builtin&&!w.containers.some(c=>c.network===k.name));
        if(nets.length){out.push('','Deleted Networks:',...nets.map(k=>k.name));nets.forEach(k=>w.networks.splice(w.networks.indexOf(k),1));}
        out.push('',`Total reclaimed space: ${dead.length?(dead.length*4.1).toFixed(1)+'kB':'0B'}`);meta.pruned=dead.length;return true;
      }
      default:out.push(`docker: '${sub}' is not a docker command, or this sandbox does not model it.`,"Type help to see what it understands.");return false;
    }
  }
  function exec(line){
    const out=[];let ok=true;meta={};
    const a=tok(line.trim());
    if(!a.length)return {out:'',ok:true,meta};
    try{
      if(a[0]==='docker')ok=docker(a.slice(1),out);
      else if(a[0]==='docker-compose'){out.push('(docker-compose with a hyphen is the old v1 tool. The current command is: docker compose)');ok=compose(a.slice(1),out);}
      else if(a[0]==='curl')ok=curl(a.slice(1),out);
      else if(a[0]==='help'){out.push(HELP);}
      else if(a[0]==='clear'){return {out:'',ok:true,meta,clear:true};}
      else if(a[0]==='ls'){out.push('Dockerfile  compose.yaml  main.py  requirements.txt');}
      else if(a[0]==='cat'&&FILES[a[1]]){out.push(a[1]==='Dockerfile'?ORDERS[w.proj.ord].map(x=>x[0]).concat(FILES.Dockerfile.split('\n').slice(-2)).join('\n'):FILES[a[1]]);}
      else{out.push(`${a[0]}: this sandbox only understands docker, curl, ls, cat, help and clear`);ok=false;}
    }catch(e){out.push('docker: '+e.message+'.');ok=false;}
    return {out:out.join('\n'),ok:ok!==false,meta};
  }
  const project={
    steps:()=>ORDERS[w.proj.ord],
    edit(k){if(!w.proj.dirty.includes(k))w.proj.dirty.push(k);},
    order(o){if(o!==w.proj.ord&&ORDERS[o]){w.proj.ord=o;w.proj.valid=w.proj.ever?Math.min(w.proj.valid,2):0;}},
    reset(){w.proj.ord='good';w.proj.dirty=[];w.proj.valid=0;w.proj.ever=false;}
  };
  return {exec,world:w,project};
}

{id:1,title:'What Docker is',mins:6,
idea:`
<p>Software rarely runs on its own. A Python API needs a particular Python version, a set of libraries, some operating-system packages and a few settings. Your laptop, a teammate's laptop, the test server and the cloud all differ slightly, and those small differences are where "it works on my machine" comes from.</p>
<p>Docker fixes this by packing the app <em>together with everything it needs</em> into one sealed package. You then run that same package everywhere.</p>
<dl class="terms">
<dt>Image</dt><dd>The sealed package. A read-only snapshot of a filesystem (a slim Linux, Python, your libraries, your code) plus the command to start it. Think of it as a recipe, or a class in code.</dd>
<dt>Container</dt><dd>An image that is running. It is an ordinary process on your machine, fenced off so it sees only its own files, its own network and its own settings. Think of it as the meal cooked from the recipe, or an object made from the class. You can run many containers from one image.</dd>
<dt>Registry</dt><dd>A shelf where images are stored and shared. Docker Hub is the public one. Cloud providers and companies run private ones.</dd>
<dt>Docker Engine</dt><dd>The background service that builds images and runs containers. The <code>docker</code> command you type is only a remote control that sends requests to it.</dd>
</dl>
<p>That is the whole mental model: you <strong>build</strong> an image, <strong>ship</strong> it to a registry, and <strong>run</strong> it as a container.</p>`,
widget:'vm',widgetTitle:'Container or virtual machine?',
widgetIntro:'People often meet containers as "lightweight virtual machines". The comparison helps, but the difference matters. Switch between the two.',
notes:`
<h2>On your own machine</h2>
<p>This guide runs a simulated Docker in the page, so you can practise on any device and nothing is installed. The commands are the real ones. When you are ready to use the real thing:</p>
<ol>
<li>Install <strong>Docker Desktop</strong> (Mac or Windows) or <strong>Docker Engine</strong> (Linux). Docker Desktop is free for personal use and small businesses. Larger companies need a paid plan, so check the current terms.</li>
<li>Open a terminal and run <code>docker --version</code>. A version number means the remote control is installed.</li>
<li>Run <code>docker run hello-world</code>. A greeting means the engine is running too. If you see "Cannot connect to the Docker daemon", Docker Desktop is not started yet.</li>
</ol>`,

{id:2,title:'Run your first container',mins:10,
idea:`
<p>The command you will type most is <code>docker run</code>. It does three things in one go: finds the image (downloading it if you do not have it), creates a container from it, and starts that container.</p>
<p>A container has a simple life: <strong>created → running → exited</strong>. It runs for exactly as long as its main program runs. A program that prints a message and finishes gives a container that lasts a fraction of a second. A web server gives a container that runs until you stop it.</p>
<p>An exited container is not deleted. It stays on disk, with its logs, until you remove it. That surprises most beginners, and it is why <code>docker ps</code> (running only) and <code>docker ps -a</code> (everything) show different lists.</p>`,

{id:3,title:'Images and layers',mins:14,
idea:`
<p>An image has a name in two parts, <code>repository:tag</code>. In <code>postgres:17</code> the repository is postgres and the tag is 17. Leave the tag off and Docker assumes <code>latest</code>, which simply means "whatever the publisher last pushed under that label". For real projects, name a specific version so that everyone gets the same thing.</p>
<p>An image is not one big file. It is a stack of <strong>layers</strong>, and each layer records a set of file changes: "add Debian", "add Python", "add these libraries", "add my code". Layers are read-only and shared. If ten images are built on the same Python layer, your disk stores it once and downloads it once.</p>
<p>When a container starts, Docker adds one thin <strong>writable layer</strong> on top for that container alone. Anything the container writes goes there. Remove the container and that layer goes with it. This is why containers are cheap to create, and why they do not keep data on their own. Lesson 6 deals with that.</p>`,

<h2>Choosing images</h2>
<ul>
<li>On Docker Hub, prefer images marked <strong>Docker Official Image</strong> or from a <strong>Verified Publisher</strong>. Anyone can upload an image, so treat unknown ones as you would any download from a stranger.</li>
<li>Tags ending in <code>-slim</code> or <code>-alpine</code> are smaller variants with fewer tools included. <code>python:3.14-slim</code> is a sensible default for a Python service.</li>
<li>Images add up. <code>docker images</code> shows what is using your disk.</li>

</ul>`,

{id:4,title:'Build your own image',mins:12,
idea:`
<p>So far you have run other people's images. To package your own app you write a <strong>Dockerfile</strong>: a plain text file, named exactly <code>Dockerfile</code>, that lists the steps to assemble the image. Then <code>docker build</code> follows those steps.</p>
<p>The example in this lesson is the Kestrel's reactor control service, a very small FastAPI app. The project folder holds three files:</p>
<pre class="file"><b>main.py</b>            the reactor API: three routes, /, /status and /healthz
<b>requirements.txt</b>   the libraries it needs: fastapi and uvicorn
<b>Dockerfile</b>         the build steps, shown below</pre>
<p>Each instruction in a Dockerfile produces one layer. Docker <strong>caches</strong> every layer and reuses it on the next build if nothing that feeds into it has changed. Once one step has to be redone, every step after it is redone too. So the order of the steps decides how fast your rebuilds are.</p>`,
widget:'dockerfile',widgetTitle:'Read the Dockerfile, then see the cache work',
widgetIntro:'First, tap any line of the Dockerfile to see what it does. Underneath is a guided experiment that shows why the lines are in this order.',

 test:(l,w,r)=>up(w,c=>c.kind==='api'&&c.ports.some(p=>p.c===8000))},

notes:`
<h2>Good to know</h2>
<ul>
<li><strong>Why <code>--host 0.0.0.0</code>?</strong> By default a development server listens only on the container's own loopback address, where nothing outside can reach it. Listening on 0.0.0.0 means "all interfaces", so the published port works. A container that runs but cannot be reached is very often this.</li>
<li><strong>.dockerignore</strong> is a file listing what to leave out of the build context: <code>.git</code>, <code>.venv</code>, <code>__pycache__</code>, <code>.env</code>. It makes builds faster and keeps secrets out of images.</li>
<li><strong>Never bake secrets into an image.</strong> Anyone who has the image can read every layer. Pass passwords and keys at run time. The next lesson shows how.</li>
<li><strong>After you change code you must rebuild</strong> and start a new container. A running container keeps using the image it was started from.</li>
</ul>`,

{id:5,title:'Ports, settings and looking inside',mins:10,
idea:`
<p>A container is sealed off on purpose. That raises three practical questions, and each has a standard answer.</p>
<dl class="terms">
<dt>How do I reach it?</dt><dd>Publish a port with <code>-p host:container</code>. The container side must match the port the program inside is actually listening on.</dd>
<dt>How do I configure it?</dt><dd>With <strong>environment variables</strong>, set with <code>-e NAME=value</code>. The same image can then run in development, testing and production with different settings. Passwords and connection strings go in this way, never into the image.</dd>
<dt>How do I see what it is doing?</dt><dd><code>docker logs</code> shows everything the program has printed. <code>docker exec</code> runs an extra command inside a running container, so you can look around.</dd>
</dl>
<p>These three tools are also how you debug. When a container will not stay up, the answer is nearly always in its logs.</p>`,
widget:'ports',widgetTitle:'Try a port mapping',
widgetIntro:'This container runs the reactor service, which listens on port 8000 inside the container. Change the numbers and see whether a browser on your computer could reach it.',
labIntro:'The reactor needs somewhere to keep its readings: a PostgreSQL database in its own container, called db. You are going to start that database the wrong way on purpose, find out why it failed, and fix it. This is the debugging routine you will reuse constantly.',
tasks:[
{what:'Start PostgreSQL with no settings',cmd:'docker run -d --name db postgres:17',
 parts:[['postgres:17','The official PostgreSQL image.']],
 saw:'You got a container ID, so it looks like it worked. It did not.',
 test:(l,w,r)=>has(w,'db')&&/^docker (container )?run\b/.test(l)},
{what:'Check whether it is running',cmd:'docker ps -a',
 parts:[['-a','Without -a the list would be empty, which tells you something is wrong but not what.']],
 saw:'Status Exited (1). A code other than 0 means the program ended with an error.',
 test:(l,w,r)=>r.ok&&/^docker (ps|container ls)\b.*(-a|--all)/.test(l)},
{what:'Read its logs to find out why',cmd:'docker logs db',
 parts:[['docker logs','Print everything the container\'s main program wrote. Works on stopped containers too.']],
 saw:'The image refuses to start a database with no superuser password, and it tells you the exact variable to set.',
 test:(l,w,r)=>r.ok&&/^docker (container )?logs\b/.test(l)},
{what:'Remove the failed container',cmd:'docker rm db',
 parts:[['docker rm db','Free up the name db so you can try again.']],
 saw:'Clean slate.',
 test:(l,w,r)=>r.ok&&!has(w,'db')},
{what:'Start it properly',cmd:'docker run -d --name db -e POSTGRES_PASSWORD=secret -p 5432:5432 postgres:17',
 parts:[['-e POSTGRES_PASSWORD=secret','Set an environment variable inside the container. This image reads it on first start to set the database password.'],['-p 5432:5432','Publish PostgreSQL\'s standard port, so a database tool on your computer can connect to localhost:5432.']],
 saw:'The sandbox panel shows db as running this time.',
 test:(l,w,r)=>up(w,c=>c.kind==='postgres'&&c.env.POSTGRES_PASSWORD)},
{what:'Look at the settings from inside the container',cmd:'docker exec db env',
 parts:[['docker exec db','Run an extra command inside the running container named db.'],['env','The command to run: print all environment variables.']],
 saw:'POSTGRES_PASSWORD is there, visible to the program inside. On a real machine, docker exec -it db bash opens a shell inside the container so you can explore.',
 test:(l,w,r)=>r.ok&&/^docker (container )?exec\b/.test(l)},
{what:'Clean up',cmd:'docker rm -f db',
 parts:[['docker rm -f','Stop and remove.']],
 saw:'Done. Keep this routine in mind: ps -a, then logs, then fix and run again.',
 test:(l,w,r)=>r.ok&&!has(w,'db')}],
notes:`
<h2>Good to know</h2>
<ul>
<li><code>docker logs -f db</code> follows the logs live, like a ticker. Press Ctrl+C to stop following. The container keeps running.</li>
<li>With many settings, put them in a file of <code>NAME=value</code> lines and pass <code>--env-file .env</code>. Keep that file out of Git.</li>
<li><code>-it</code> on <code>docker exec</code> or <code>docker run</code> means "interactive, with a terminal". You need it for anything you type into, such as a shell.</li>
</ul>`,
quiz:[
{q:'A container shows Exited (1) straight after you start it. What is the best first move?',opts:['Reinstall Docker','Run docker logs with the container\'s name','Delete the image and pull it again','Restart your computer'],a:1,why:'The logs hold whatever the program printed before it died, which is usually the exact reason.'},
{q:'Where should a database password go?',opts:['In the Dockerfile, with ENV','In the image\'s source code','Passed at run time, for example with -e or an env file','In the image tag'],a:2,why:'Anything in the image can be read by anyone who has the image. Settings passed at run time stay out of it, and can differ per environment.'}],
reading:[
['postgres official image','https://hub.docker.com/_/postgres','Lists every environment variable the image understands. Most official images document their settings this way.'],
['docker exec reference','https://docs.docker.com/reference/cli/docker/container/exec/','Flags and examples.'],
['docker logs reference','https://docs.docker.com/reference/cli/docker/container/logs/','Following, tailing and timestamps.']]
},

{id:6,title:'Keep data with volumes',mins:10,
idea:`
<p>Lesson 3 said that a container's writes live in its own thin layer and die with it. For a web server that is fine. For a database it is a disaster: remove the container and your data is gone.</p>
<p>A <strong>volume</strong> is a storage area that Docker manages <em>outside</em> any container. You attach it to a folder inside the container with <code>-v name:/path</code>. The program writes to that folder as usual, but the files land in the volume. Remove the container, start a new one with the same volume attached, and the data is still there.</p>
<dl class="terms">
<dt>Named volume</dt><dd><code>-v pgdata:/var/lib/postgresql/data</code>. Docker stores the data and you refer to it by name. Use this for databases.</dd>
<dt>Bind mount</dt><dd><code>-v ./src:/app</code>. A folder from your own computer appears inside the container. Use this in development, so code edits show up without rebuilding.</dd>
</dl>
<p>The rule of thumb: containers are disposable, volumes are not.</p>`,
labIntro:'First lose some data, then keep it. Both halves use the same commands. The only difference is one -v flag.',
tasks:[
{what:'Start a database with no volume',cmd:'docker run -d --name db -e POSTGRES_PASSWORD=secret postgres:17',
 parts:[['(no -v)','Nothing tells Docker to keep the data anywhere but inside this container.']],
 saw:'A normal running database.',
 test:(l,w,r)=>up(w,c=>c.name==='db'&&c.kind==='postgres'&&!pgVol(c))},
{what:'Create a table in it',cmd:'docker exec db psql -U postgres -c "CREATE TABLE readings (id int)"',
 parts:[['docker exec db','Run a command inside the db container.'],['psql -U postgres','PostgreSQL\'s command-line client, connecting as the postgres user.'],['-c "..."','Run this one SQL statement and exit.']],
 saw:'CREATE TABLE confirms the table exists.',
 test:(l,w,r)=>r.ok&&r.meta.created},
{what:'Remove the container',cmd:'docker rm -f db',
 parts:[['docker rm -f db','Imagine this is an upgrade, a crash, or a tidy-up.']],
 saw:'The container and its writable layer are gone.',
 test:(l,w,r)=>r.ok&&!has(w,'db')},
{what:'Start a fresh database the same way',cmd:'docker run -d --name db -e POSTGRES_PASSWORD=secret postgres:17',
 parts:[['(same command as step 1)','Same image, same name, same settings.']],
 saw:'It starts happily.',
 test:(l,w,r)=>up(w,c=>c.name==='db'&&c.kind==='postgres')},
{what:'Look for your table',cmd:'docker exec db psql -U postgres -c "\\dt"',
 parts:[['\\dt','A psql shortcut meaning "list tables".']],
 saw:'"Did not find any relations." The table went with the old container. This new one is a brand-new, empty database.',
 test:(l,w,r)=>r.ok&&r.meta.tables===0},
{what:'Remove it and start again, this time with a volume',cmd:'docker rm -f db',
 parts:[['docker rm -f db','Clear the way for the proper setup.']],
 saw:'Gone.',
 test:(l,w,r)=>r.ok&&!has(w,'db')},
{what:'Start the database with a named volume',cmd:'docker run -d --name db -e POSTGRES_PASSWORD=secret -v pgdata:/var/lib/postgresql/data postgres:17',
 parts:[['-v pgdata:/var/lib/postgresql/data','Attach the volume called pgdata to the folder where this image keeps its database files. Docker creates the volume if it does not exist yet.']],
 saw:'A volume named pgdata has appeared in the sandbox panel.',
 test:(l,w,r)=>up(w,c=>c.name==='db'&&pgVol(c))},
{what:'Create the table again',cmd:'docker exec db psql -U postgres -c "CREATE TABLE readings (id int)"',
 parts:[['(same as step 2)','This time the files land in the volume.']],
 saw:'CREATE TABLE.',
 test:(l,w,r)=>r.ok&&r.meta.created},
{what:'Remove the container',cmd:'docker rm -f db',
 parts:[['docker rm -f db','The container goes. Look at the sandbox panel: the volume stays.']],
 saw:'No container, but pgdata is still listed.',
 test:(l,w,r)=>r.ok&&!has(w,'db')&&w.volumes.some(v=>v.name==='pgdata')},
{what:'Start a new container with the same volume',cmd:'docker run -d --name db -e POSTGRES_PASSWORD=secret -v pgdata:/var/lib/postgresql/data postgres:17',
 parts:[['(same as step 7)','A brand-new container, pointed at the existing data.']],
 saw:'PostgreSQL found existing data in the folder and skipped its first-time setup.',
 test:(l,w,r)=>up(w,c=>c.name==='db'&&pgVol(c))},
{what:'Look for your table',cmd:'docker exec db psql -U postgres -c "\\dt"',
 parts:[['\\dt','List tables.']],
 saw:'readings is there. The data outlived the container that created it.',
 test:(l,w,r)=>r.ok&&r.meta.tables>0}],
notes:`
<h2>Good to know</h2>
<ul>
<li><code>docker volume ls</code> lists volumes. <code>docker volume rm pgdata</code> deletes one, and the data in it, for good. Docker refuses while a container still uses it.</li>
<li>The folder to mount depends on the image. For PostgreSQL 17 and earlier it is <code>/var/lib/postgresql/data</code>. From PostgreSQL 18 the official image expects the volume at <code>/var/lib/postgresql</code>. Always check the image's Docker Hub page.</li>
<li>Environment variables such as POSTGRES_PASSWORD only take effect when the data folder is empty. If a volume already holds a database, changing the variable does not change the password.</li>
<li>A volume is not a backup. It protects data from container removal, not from mistakes or disk failure.</li>
</ul>`,
quiz:[
{q:'You run docker rm -f db on a database container that has a named volume attached. What happens to the data?',opts:['It is deleted with the container','It stays in the volume','It moves into the image','It is uploaded to Docker Hub'],a:1,why:'Removing a container never removes a named volume. A new container that mounts the same volume finds the data again.'},
{q:'Which mount suits live code editing during development?',opts:['A named volume','No mount, just rebuild each time','A bind mount of your project folder','An environment variable'],a:2,why:'A bind mount shows your computer\'s folder inside the container, so edits appear at once. Named volumes are for data Docker should look after.'}],
reading:[
['Volumes','https://docs.docker.com/engine/storage/volumes/','The official guide: creating, mounting, backing up.'],
['Bind mounts','https://docs.docker.com/engine/storage/bind-mounts/','When and how to share a host folder.'],
['Persisting container data','https://docs.docker.com/get-started/docker-concepts/running-containers/persisting-container-data/','A beginner walkthrough that uses PostgreSQL, like this lesson.']]
},

{id:7,title:'Let containers talk to each other',mins:8,
idea:`
<p>A real app is several containers: an API, a database, perhaps a cache. The API has to find the database. Inside a container, <code>localhost</code> means <em>that container itself</em>, so pointing the API at localhost:5432 fails. This is the most common networking mistake.</p>
<p>The answer is a <strong>user-defined network</strong>. Put containers on the same network and Docker gives them a private phone book: each container can reach the others <strong>by container name</strong>. If the database container is called <code>db</code>, the API connects to host <code>db</code>, port 5432.</p>
<p>Two more facts complete the picture:</p>
<ul>
<li>Containers on the same network reach each other on any port directly. <code>-p</code> is only for traffic coming from <em>your computer</em>. A database that only the API uses does not need a published port at all, which is also safer.</li>
<li>Containers on different networks cannot see each other. Networks are how you keep projects apart.</li>
</ul>`,
labIntro:'Create a network, put a database on it, then test whether other containers can find it by name.',
tasks:[
{what:'Create a network',cmd:'docker network create kestrel-net',
 parts:[['docker network create','Make a new private network.'],['kestrel-net','A name you choose.']],
 saw:'The long string is the network\'s ID.',
 test:(l,w,r)=>r.ok&&w.networks.some(n=>n.name==='kestrel-net')},
{what:'Start a database on that network',cmd:'docker run -d --name db --network kestrel-net -e POSTGRES_PASSWORD=secret postgres:17',
 parts:[['--network kestrel-net','Attach the container to kestrel-net. Its name, db, becomes its address on that network.'],['(no -p)','Deliberately not published. Only containers on kestrel-net can reach it.']],
 saw:'db is running and attached to kestrel-net.',
 test:(l,w,r)=>up(w,c=>c.name==='db'&&c.network==='kestrel-net')},
{what:'From another container on the same network, look for db',cmd:'docker run --rm --network kestrel-net alpine ping -c 1 db',
 parts:[['--rm ... alpine','A throwaway container, used as a test probe.'],['--network kestrel-net','Join the same network as the database.'],['ping -c 1 db','Send one network ping to the host named db.']],
 saw:'The name db resolved to a private address and answered. Any app on kestrel-net could now use db:5432 as its database host.',
 test:(l,w,r)=>r.meta.ping===true},
{what:'Try the same from a container that is not on the network',cmd:'docker run --rm alpine ping -c 1 db',
 parts:[['(no --network)','This container lands on Docker\'s default network, where names are not looked up.']],
 saw:'"bad address". From outside kestrel-net, db does not exist. That is isolation working as intended.',
 test:(l,w,r)=>r.meta.ping===false},
{what:'List networks',cmd:'docker network ls',
 parts:[['docker network ls','Show all networks. bridge, host and none are built in.']],
 saw:'kestrel-net sits beside the three built-in networks.',
 test:(l,w,r)=>r.ok&&/^docker network ls/.test(l)},
{what:'Clean up',cmd:'docker rm -f db',
 parts:[['docker rm -f db','Remove the database container.']],
 saw:'Done. docker network rm kestrel-net would remove the network too.',
 test:(l,w,r)=>r.ok&&!has(w,'db')}],
notes:`
<h2>Good to know</h2>
<ul>
<li>A connection string inside a container uses the <strong>container name</strong> as host: <code>postgresql://postgres:secret@db:5432/postgres</code>.</li>
<li>A container that needs to reach a service running directly on your computer, not in Docker, can use the special host name <code>host.docker.internal</code> on Docker Desktop.</li>
<li>Typing <code>--network</code> on every command gets tedious. Docker Compose, in the next lesson, creates the network for you.</li>
</ul>`,
quiz:[
{q:'Your API container and your database container are on the same user-defined network. The database container is named db. What host should the API connect to?',opts:['localhost','127.0.0.1','db','The database container\'s ID in full'],a:2,why:'On a user-defined network, container names work as host names. localhost would point the API back at itself.'},
{q:'Only the API uses the database. Does the database need -p 5432:5432?',opts:['Yes, or the API cannot reach it','No. Containers on the same network reach each other without published ports','Only on Linux','Only if the database has a volume'],a:1,why:'-p opens a door from your computer into the container. Container-to-container traffic on a shared network does not go through that door.'}],
reading:[
['Networking overview','https://docs.docker.com/engine/network/','How container networking works, and the network drivers.'],
['Bridge networks','https://docs.docker.com/engine/network/drivers/bridge/','Explains the difference between the default bridge and user-defined ones.']]
},

{id:8,title:'Run the whole stack with Compose',mins:12,
idea:`
<p>To run the API and its database by hand you would create a network, create a volume, build an image, and type two long <code>docker run</code> commands in the right order. Every teammate would have to do the same, exactly.</p>
<p><strong>Docker Compose</strong> replaces all of that with one file. In <code>compose.yaml</code> you <em>describe</em> the containers you want, called <strong>services</strong>, with their images, ports, settings and volumes. Then one command starts everything, and one command takes it all down.</p>
<p>Compose also does three helpful things without being asked:</p>
<ul>
<li>It creates a private network for the project and puts every service on it, so services reach each other by <strong>service name</strong>.</li>
<li>It prefixes everything with the project name, which is the folder name by default. That keeps one project's containers apart from another's.</li>
<li>When you run <code>up</code> again it only recreates what changed.</li>
</ul>
<p>The file belongs in Git beside your code. It is the written-down answer to "how do I run this project?"</p>`,
widget:'compose',widgetTitle:'Read the compose file',
widgetIntro:'This file describes the reactor service from lesson 4 and its PostgreSQL log store with a volume, as in lesson 6. Tap any line.',
labIntro:'The sandbox folder is called kestrel and already holds this compose.yaml. Bring the stack up, use it, and take it down.',
tasks:[
{what:'Start everything',cmd:'docker compose up -d',
 parts:[['docker compose','Compose is built into the docker command. Note the space: docker-compose with a hyphen is the old version.'],['up','Create and start everything the file describes: build images, create the network and volumes, start the containers.'],['-d','Detached, in the background, as with docker run.']],
 saw:'Compose built the reactor image, created a network and a volume, started the database, waited for it to report healthy, then started the reactor. Look at the names: all begin with kestrel. On the blueprint, reactor, log store, data cell and data bus are all live.',
 test:(l,w,r)=>r.ok&&r.meta.composeUp},
{what:'See the project\'s containers',cmd:'docker compose ps',
 parts:[['docker compose ps','Like docker ps, but only for this project, with a SERVICE column.']],
 saw:'Two services. Only reactor has a published port. The database is reachable from reactor, but not from your computer.',
 test:(l,w,r)=>r.ok&&/^docker compose ps/.test(l)},
{what:'Call the API',cmd:'curl localhost:8000/healthz',
 parts:[['localhost:8000','The port published by the reactor service.']],
 saw:'The reactor answered. It reached the database at host db, a name that exists only on the project\'s network.',
 test:(l,w,r)=>r.ok&&/^curl\b/.test(l)},
{what:'Read one service\'s logs',cmd:'docker compose logs reactor',
 parts:[['docker compose logs','Show logs for the project. Each line is labelled with its service.'],['reactor','Limit the output to one service. Leave it off to see every service interleaved.']],
 saw:'Start-up lines, the database connection, and the request you just made.',
 test:(l,w,r)=>r.ok&&/^docker compose logs/.test(l)},
{what:'Stop and remove everything',cmd:'docker compose down',
 parts:[['down','Stop and remove the project\'s containers and its network. The opposite of up.']],
 saw:'Containers and network removed. The volume is not in that list.',
 test:(l,w,r)=>r.ok&&r.meta.composeDown&&w.volumes.some(v=>v.name==='kestrel_pgdata')},
{what:'Check the volume survived',cmd:'docker volume ls',
 parts:[['docker volume ls','List all volumes.']],
 saw:'kestrel_pgdata is still there. down keeps your data, so the next up finds the same database.',
 test:(l,w,r)=>r.ok&&/^docker volume ls/.test(l)},
{what:'Remove the data as well',cmd:'docker compose down -v',
 parts:[['-v','Also remove the volumes named in the file. Use this when you want a completely fresh start. The data is gone for good.']],
 saw:'The volume is removed. The next up would create an empty database.',
 test:(l,w,r)=>r.ok&&r.meta.composeDown&&!w.volumes.some(v=>v.name==='kestrel_pgdata')}],
notes:`
<h2>Good to know</h2>
<ul>
<li><code>docker compose up -d --build</code> rebuilds images first. Use it after changing code or the Dockerfile.</li>
<li><code>docker compose exec db psql -U postgres</code> opens a database prompt in the running db service.</li>
<li><code>docker compose logs -f</code> follows all services live.</li>
<li>Keep real passwords out of the file. Write <code>POSTGRES_PASSWORD: \${DB_PASSWORD}</code> and put the value in a <code>.env</code> file next to it, which Compose reads automatically and which stays out of Git.</li>
<li><code>depends_on</code> alone only controls start order. The <code>healthcheck</code> plus <code>condition: service_healthy</code> is what makes the reactor wait until the database can actually accept connections.</li>
</ul>`,
quiz:[
{q:'In this compose file, what host name does the reactor service use to reach the database?',opts:['localhost','db, the service name','kestrel_pgdata','postgres:17'],a:1,why:'Compose puts every service on one project network and makes each service name a host name on it.'},
{q:'What is the difference between docker compose down and docker compose down -v?',opts:['-v is verbose output','down keeps named volumes. down -v deletes them too','-v also deletes the images','There is no difference'],a:1,why:'Plain down removes containers and the network but leaves volumes, so data survives. Adding -v removes the data as well.'}],
reading:[
['Docker Compose overview','https://docs.docker.com/compose/','What Compose is and how it fits with the rest of Docker.'],
['Compose file reference','https://docs.docker.com/reference/compose-file/','Every key you can put in compose.yaml.'],
['Compose quickstart','https://docs.docker.com/compose/gettingstarted/','A hands-on tutorial that builds a small Python web app with a second service.']]
},

{id:9,title:'Housekeeping and where next',mins:8,
idea:`
<p>Docker keeps things until you say otherwise: stopped containers, old images, unused networks, and build cache. After a few weeks of work this can take many gigabytes. Tidying is safe as long as you remember one rule: <strong>volumes hold your data, everything else can be recreated</strong>.</p>
<p>You now know the whole everyday workflow:</p>
<ol>
<li>Write a <strong>Dockerfile</strong> to package the app.</li>
<li>Write a <strong>compose.yaml</strong> to describe the app and the services it needs.</li>
<li><code>docker compose up -d</code> to start, <code>logs</code> and <code>exec</code> to look inside, <code>down</code> to stop.</li>
</ol>
<p>The same image you run locally is what gets deployed. You <code>docker push</code> it to a registry, and a hosting service pulls it from there and runs it. That is the point of the whole exercise: what you tested is what ships.</p>`,

notes:`
<h2>Where this leads in a FastAPI and PostgreSQL project</h2>
<dl class="terms">
<dt>Local development</dt><dd>One <code>compose.yaml</code> runs the API and a real PostgreSQL, so every developer and every coding agent starts from the same environment with one command.</dd>
<dt>Automated tests</dt><dd>Libraries such as <strong>Testcontainers</strong> start a throwaway PostgreSQL container from inside the test suite and remove it afterwards. Tests then run against a real database instead of a stand-in, which matters for features that only exist in the database itself, such as row-level security.</dd>
<dt>Continuous integration</dt><dd>The CI server builds the same Dockerfile and runs the same tests in containers, so "passes on my machine" and "passes in CI" mean the same thing.</dd>
<dt>Cloud hosting</dt><dd>Services such as Google Cloud Run, AWS App Runner and Azure Container Apps take a container image and run it for you. The database is usually a managed service rather than a container, and the API gets its address through an environment variable, exactly as in lesson 5.</dd>
</dl>
<h2>Good next steps</h2>
<ul>
<li>Install Docker Desktop and repeat lessons 2 to 8 for real. The commands are identical.</li>
<li>Take a small project you know and write a Dockerfile and a compose.yaml for it.</li>
<li>Later topics, once the basics feel easy: multi-stage builds for smaller images, running as a non-root user, health checks, and image scanning.</li>
</ul>`,

{q:'How does the image you tested locally reach a cloud hosting service?',opts:['You email the Dockerfile','You push the image to a registry and the service pulls it','The service logs into your laptop','It has to be rebuilt by hand on the server'],a:1,why:'Registries are the hand-off point. Build once, push, and every environment pulls the identical image.'}],

const DOCKERFILE_NOTES=[
['FROM python:3.14-slim','<b>Start from an existing image.</b> Every Dockerfile begins with FROM. This one gives you a small Debian Linux with Python 3.14 already installed, so you do not have to install Python yourself. Naming the version keeps builds the same over time.'],
['WORKDIR /app','<b>Set the working folder</b> inside the image, creating it if needed. Every later instruction, and the running app, starts from /app.'],
['COPY requirements.txt .','<b>Copy one file</b> from your project folder into the image. The first path is on your computer, the second is inside the image, and the dot means the working folder, /app. Only the list of libraries is copied at this point, on purpose. The cache test below shows why.'],
['RUN pip install --no-cache-dir -r requirements.txt','<b>Run a command while building</b> and save the result as a layer. Here it installs the libraries. This is the slow step. The --no-cache-dir flag stops pip keeping its download cache, which would only make the image bigger.'],
['COPY . .','<b>Copy everything else</b> from the project folder into /app: your code. It comes after the install so that editing code does not trigger a reinstall.'],
['EXPOSE 8000','<b>Documentation only.</b> It records that the app listens on port 8000. It does not open or publish anything. You still need -p when you run the container.'],
['CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]','<b>The command a container runs when it starts.</b> Here it launches uvicorn, the server that runs FastAPI apps. main:app means "the object called app in main.py". Listening on 0.0.0.0 is what lets traffic from outside the container reach it. RUN happens once, at build time. CMD happens every time a container starts.']
];
const COMPOSE_NOTES=[
['services:','<b>The list of containers to run.</b> Each entry below, indented by two spaces, is one service. Indentation matters in YAML: use spaces, never tabs.'],
['  db:','<b>A service named db.</b> The name is yours to choose. It also becomes the host name other services use to reach it.'],
['    image: postgres:17','<b>Use a ready-made image.</b> The same as naming the image in docker run.'],
['    environment:','<b>Environment variables</b> for this service. The same as -e.'],
['      POSTGRES_PASSWORD: secret','The password the database is created with. In a real project the value comes from a .env file, not from this file.'],
['    volumes:','<b>Storage to attach.</b> The same as -v.'],
['      - pgdata:/var/lib/postgresql/data','Mount the named volume pgdata at the folder where PostgreSQL keeps its files, so data survives when the container is replaced.'],
['    healthcheck:','<b>A way for Docker to ask "are you ready?"</b> Starting a database takes a few seconds. Running is not the same as ready.'],
['      test: ["CMD-SHELL", "pg_isready -U postgres"]','The command Docker runs inside the container. pg_isready is PostgreSQL\'s own readiness check.'],
['      interval: 5s','Ask every five seconds.'],
['      retries: 5','After five failures in a row, mark the service unhealthy.'],
['  reactor:','<b>A second service, named reactor.</b>'],
['    build: .','<b>Build the image from the Dockerfile</b> in this folder instead of pulling one. The same as docker build.'],
['    ports:','<b>Ports to publish.</b> The same as -p.'],
['      - "8000:8000"','Host port 8000 to container port 8000. The quotes stop YAML misreading the colon. Note that db has no ports section: nothing outside the project can reach the database.'],
['    environment:',''],
['      DATABASE_URL: postgresql://postgres:secret@db:5432/postgres','The connection string the API reads. The host is <b>db</b>, the service name, not localhost.'],
['    depends_on:','<b>Start order.</b> This service needs another one first.'],
['      db:',''],
['        condition: service_healthy','Wait until db passes its health check before starting reactor. Without this, the API could start first and crash because the database is not accepting connections yet.'],
['',''],
['volumes:','<b>Named volumes used by the project</b> are declared at the top level.'],
['  pgdata:','Declares the volume. Compose creates it as kestrel_pgdata, prefixed with the project name.']

const BRIEFS={
1:`Hangar 7 is fitting out the <b>KF-07 Kestrel Mk II</b>. Each of the suit's systems (reactor, guidance, propulsion) is software, and each one ships as a sealed module (an <b>image</b>) that runs as its own fenced-off process (a <b>container</b>). You are the tech responsible for one of them: the <b>reactor system</b>. Over nine lessons you will start it, look inside it, build it yourself, give it a log store, and finally bring the pair online with one command. The Kestrel is only the setting. Every command and every term in brackets is real Docker.`,
2:`First start-up. The reactor control module (the image <code>hangar-7/kestrel-reactor</code>) sits on the hangar's parts shelf (a <b>registry</b>). You will fetch it, start it as a container, check it answers, then shut it down. The image name is invented for this guide, so it only exists in this sandbox. On your own machine, practise the same commands with a real image such as <code>nginx</code>.`,
3:`Before you trust a module, look inside it. The reactor module is not one block: it is a stack of sealed plates (<b>layers</b>), and every suit in the hangar that uses the same plates shares one copy.`,
4:`So far the reactor module arrived ready-made. Now the engineers hand you its source and a build sheet (a <b>Dockerfile</b>), and you assemble the module (build the <b>image</b>) yourself.`,
5:`The reactor needs somewhere to keep its readings. That log store is a PostgreSQL database running in its own container, <code>db</code>. It refuses to start, and your job is to find out why. This is the tech's standard fault-finding routine.`,
6:`A container swap must not wipe the reactor's readings. Docker's answer is a data cell that lives outside any container (a <b>volume</b>). You will lose the readings once without it, then keep them with it.`,
7:`The reactor has to reach its log store over the suit's internal data bus (a user-defined <b>network</b>), where each system answers to its own name. Nothing outside the suit should be able to reach the log store at all.`,
8:`Typing every start-up command by hand does not scale to a whole suit. The start-up sheet (<code>compose.yaml</code>) describes the reactor and its log store together, and <b>Docker Compose</b> brings both online in the right order with one command.`,
9:`End of shift: clear the hangar floor of stopped containers and leftovers. The Kestrel's other systems are waiting, and running many containers across several machines is the next guide in this series, Kubernetes from Zero.`};
LESSONS.forEach(L=>{L.brief=BRIEFS[L.id];});

  for(const k in (attrs||{})){const v=attrs[k];
    if(k==='html')n.innerHTML=v;else if(k==='text')n.textContent=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v);}
  kids.flat(Infinity).forEach(c=>{if(c!=null)n.append(c);});

}

W.dockerfile=function(box,ctx){
  annotated(box,DOCKERFILE_NOTES,'Dockerfile');
  const wrap=el('div',{class:'cache'});
  const BUILD='docker build -t kestrel-reactor .';
  wrap.append(el('h3',{text:'See the cache work: a guided experiment'}),
    el('p',{text:'Building an image can be slow, mostly because of installing libraries. Docker avoids repeating work by remembering the result of every step. Three rules explain everything you are about to see:'}),
    el('ol',{class:'rules'},
      el('li',{text:'Docker runs the steps from top to bottom.'}),
      el('li',{text:'At each step it asks: has anything this step uses changed since last time? If not, it reuses the saved result. That is a cache hit, and it takes no time.'}),
      el('li',{text:'The first step that has to be redone breaks the chain. Every step below it is redone too, even if nothing they use has changed.'})),
    el('p',{text:'Follow the six short experiments below. You run every build yourself in the terminal, with the real command. The two Edit buttons stand in for changing a file in your code editor and saving it, and the order switch stands in for rearranging lines in the Dockerfile. The thing to press next is outlined.'}));
  const FN={main:'main.py',req:'requirements.txt'};
  const GUIDE=[
    ['Build for the first time','The Dockerfile below copies requirements.txt and installs the libraries before it copies your code. Load the build command, press Run in the terminal, and watch Docker work down the steps.'],
    ['Build again, changing nothing','Nothing in the project has changed. Run the same build command again. Predict first: how many steps will Docker redo?'],
    ['Change your code','Pretend you fixed a bug in main.py. Press Edit main.py, then run the build. Watch which step is the first to be redone.'],
    ['Try the other order','Now switch to "Copy everything first". This Dockerfile copies all files, code included, before installing. Switch, then run the build to fill its cache.'],
    ['Change your code again','Same one-line change as before, different order. Press Edit main.py, then run the build. Watch the install step.'],
    ['Change the libraries','Last one. Pretend you added a library: press Edit requirements.txt, then run the build.'],
    ['Done. Over to you','You have seen the whole idea. Keep experimenting with any combination, then carry on with the lab.']];
  const WHY={first:'run for the first time: nothing is cached yet',new:'run: this Dockerfile has no saved result for this step yet',cascade:'redone, because a step above it was redone',hit:'reused from cache: nothing it uses has changed'};
  let g=0;const times={};
  const coach=el('div',{class:'coach','aria-live':'polite'}),files=el('div',{class:'files'}),steps=el('ol',{class:'steps'}),msg=el('p',{class:'result','aria-live':'polite'}),score=el('div',{class:'score'});
  const seg={},B={};

    if(g===3)return P().ord!=='bad'?seg.bad:B.build;

  }
  function chrome(){

    coach.append(el('span',{class:'sb-h',text:g>5?'All six experiments done':'Experiment '+(g+1)+' of 6'}),el('b',{text:GUIDE[g][0]}),el('span',{text:GUIDE[g][1]}));

    const n=nextBtn();[seg.good,seg.bad,B.build,B.main,B.req].forEach(b=>b.classList.toggle('next',b===n));
    score.textContent='';
    if(times.good!=null||times.bad!=null){
      score.append(el('h4',{text:'Rebuild time after a one-line code change'}),
        el('div',{class:'sc-row'},el('span',{text:'Requirements first'}),el('b',{class:'ok',text:times.good!=null?times.good+' s':'not tried yet'})),
        el('div',{class:'sc-row'},el('span',{text:'Copy everything first'}),el('b',{class:'re',text:times.bad!=null?times.bad+' s':'not tried yet'})));
      if(times.good!=null&&times.bad!=null)score.append(el('p',{text:'Same change, same result, about '+Math.round(times.bad/times.good)+' times slower. The only difference is the order of two lines. On a real project the install step can take minutes, and you rebuild many times a day.'}));

  function idle(){
    const p=P();steps.textContent='';
    ctx.sim().project.steps().forEach((s,i)=>steps.append(el('li',{},el('div',{class:'st-top'},el('code',{text:s[0]}),el('span',{class:'pill',text:i<p.valid?'in cache':'not built'})),el('span',{class:'why',text:s[1].length?'uses: '+s[1].map(d=>FN[d]).join(', '):'uses no project files'}))));
    chrome();
  }
  function onBuild(b){
    steps.textContent='';
    b.steps.forEach(s=>steps.append(el('li',{class:s.broke?'redo':'hit'},el('div',{class:'st-top'},el('code',{text:s.text}),el('span',{class:'pill '+(s.broke?'re':'ok'),text:s.broke?'redone · '+s.t+' s':'cached · 0 s'})),
      el('span',{class:'why',text:s.why==='changed'?'redone: '+s.hit.map(x=>FN[x]).join(' and ')+' changed. The chain breaks here':WHY[s.why]}))));
    const codeOnly=b.dirty.includes('main')&&!b.dirty.includes('req')&&b.wasValid===b.n;let txt;
    if(b.first)txt='First build: about '+b.total+' seconds. Nothing was cached, so every step ran. Nearly all the time went to downloading the base image and installing libraries.';
    else if(b.wasValid<b.n)txt='About '+b.total+' seconds. The first two steps are identical in both Dockerfiles, so Docker reused them. From the first different line onward it had nothing saved.';

        el('span',{class:'kn'},el('b',{text:KNAME[k][0]}),el('i',{text:' ('+KNAME[k][1]+')'})),el('span',{class:'ks',text:KS[k][1]})))));
  }
  function drawMap(flash){

    const w=sim.world;map.textContent='';const next={};
    const chip=(t,c)=>el('span',{class:'chip '+(c||''),text:t});
    const zone=(key,title,sub,items,empty,exit,wide)=>{

      const z=el('div',{class:'zone z-'+key+(wide?' wide':'')},el('h3',{text:title}),el('div',{class:'zsub',text:sub}),el('div',{class:'zlist'},items.length?items:el('span',{class:'empty',text:empty})),el('div',{class:'exit',text:exit}));

      el('div',{class:'cstack'},
        el('div',{class:'cl-rw'},el('span',{text:'writable layer'}),el('em',{text:c.rw.length?c.rw.join(', '):'empty'})),
        (()=>{const im=w.images.find(i=>i.repo+':'+i.tag===(c.image.includes(':')?c.image:c.image+':latest'));const n=im?im.layers.length:0;const sh=w.containers.filter(x=>x!==c&&x.image===c.image).map(x=>x.name);
          return el('div',{class:'cl-ro'},el('div',{class:'lstack'},Array.from({length:n},()=>el('i',{class:'lb on'}))),el('span',{text:n+' read-only layer'+(n===1?'':'s')+' from '+c.image+(sh.length?' · shared with '+sh.join(', '):'')}));})()),
      el('div',{class:'chips'},
        c.ports.map(p=>chip('localhost:'+p.h+' → :'+p.c,c.status==='running'?'port':'')),
        c.mounts.map(m=>chip((m.type==='volume'?'vol ':'bind ')+m.src,'vol')),
        c.network!=='bridge'?chip('net '+c.network,'net'):null,
        Object.keys(c.env).map(k=>chip('env '+k))))),'none yet','docker ps -a',true);
    zone('images','Images','read-only templates',w.images.map(i=>el('div',{class:'rowi'},el('b',{text:i.repo+':'+i.tag}),el('div',{class:'lstack'},i.layers.map(()=>el('i',{class:'lb on'}))),el('span',{class:'sub',text:i.layers.length+' layer'+(i.layers.length===1?'':'s')+' · '+i.size+(i.built?' · built here':'')}))),'none yet','docker images');
