<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Basics Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: lesson on the left; on the right a four-station "map" of where work lives, above a terminal that moves work between stations. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#141D27; --muted:#566575; --line:#D2D9E0;
  --accent:#C93A16; --accent-soft:#FBE4DC;
  --add:#1B7447; --add-soft:#DDF2E6; --pr:#0B5CD6; --pr-soft:#DCE9FC; --del:#B4261C; --warn:#8A5A00; --warn-soft:#FBEFD0;
  --term-bg:#121A23; --term-ink:#DCE4EC; --term-muted:#8496A8; --term-line:#263341;
  --t-add:#6FD39A; --t-del:#FF8F84; --t-accent:#FF8A66; --t-coach:#F2C14E;
  --font-display:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#17202A; --sunk:#121A23; --ink:#E4EAF0; --muted:#94A4B4; --line:#2A3743;
    --accent:#FF7A55; --accent-soft:#3A2018;
    --add:#5BC98C; --add-soft:#16301F; --pr:#7DB4FF; --pr-soft:#13294B; --del:#FF8A7E; --warn:#E3B341; --warn-soft:#33290F;
    --term-bg:#090E14; --term-line:#1E2935;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#17202A; --sunk:#121A23; --ink:#E4EAF0; --muted:#94A4B4; --line:#2A3743;
  --accent:#FF7A55; --accent-soft:#3A2018;
  --add:#5BC98C; --add-soft:#16301F; --pr:#7DB4FF; --pr-soft:#13294B; --del:#FF8A7E; --warn:#E3B341; --warn-soft:#33290F;
  --term-bg:#090E14; --term-line:#1E2935;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--font-mono);font-size:.9em}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}

.app{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:700 22px/1 var(--font-display);letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px;display:none}
@media (min-width:1500px){.brand span{display:inline}}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1 1 420px;padding:2px}
.nav button{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;font-size:14px;white-space:nowrap}
.nav button .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font:600 12px/1 var(--font-mono)}
.nav button.done .n{background:var(--add);border-color:var(--add);color:var(--surface)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.nav button[aria-current="true"] .n{color:var(--ink)}
.nav button[aria-current="true"].done .n{color:var(--surface)}
.nav button.sheet{padding-left:12px}

.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1}
.lesson{padding:24px 20px 40px;background:var(--surface)}
.lesson-in{max-width:66ch;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{margin:0;font:600 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lesson h1{font-size:34px;font-weight:700}
.lesson h2{font-size:20px;font-weight:700;margin-top:8px}
.prose{display:flex;flex-direction:column;gap:12px}
.prose p,.prose ul,.prose dl{margin:0}
.prose ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prose dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.prose dt{font-weight:600}
.prose dd{margin:0;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:15px}
.note p{margin:0}
.note p+p{margin-top:6px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.step .dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font:600 13px/1 var(--font-mono);color:var(--muted)}
.step.done .dot{background:var(--add);border-color:var(--add);color:var(--surface)}
.step.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step.now .dot{border-color:var(--accent);color:var(--accent)}
.step.next{background:var(--sunk);color:var(--muted)}
.step .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.step p{margin:0}
.steps .part{font:600 12.5px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.flow{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.flow li{flex:1 1 150px;border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.4;background:var(--sunk)}
.flow b{display:block;font:600 13px/1.5 var(--font-mono);color:var(--accent)}
.owntoggle{display:flex;flex-direction:column;gap:8px;border:1px solid var(--pr);border-left-width:3px;background:var(--pr-soft);border-radius:0 8px 8px 0;padding:10px 12px;font-size:15px;cursor:pointer}
.owntoggle label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.step .own.ide{border-left-color:var(--ink)}
.owntoggle input{margin-top:4px;width:16px;height:16px;flex:none;accent-color:var(--pr)}
.step.next .own{color:var(--muted)}
.step .own{font-size:14.5px;border-left:3px solid var(--pr);padding-left:10px}
.step .after{font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.cmd{display:inline-block;max-width:100%;text-align:left;font:500 13.5px/1.4 var(--font-mono);padding:3px 8px;margin:1px 0;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--sunk);color:var(--ink);overflow-wrap:anywhere}
.cmd:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14.5px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a0d08}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a0d08}}
.btn.primary:hover{filter:brightness(1.08)}
.complete{border:1px solid var(--add);background:var(--add-soft);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.complete h3{font-size:18px}
.complete ul{margin:0;padding-left:20px}
.reading ul{margin:6px 0 0;padding-left:20px;font-size:15px}
.sheet-table{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}

.bench{display:flex;flex-direction:column;gap:12px;padding:16px 20px 24px;min-width:0}
.map{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:auto}
.map-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.map-head b{font:700 14px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone.wide{grid-column:span 2}
.zone{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-top:3px solid var(--ink);border-right:1px solid var(--line);min-width:0;transition:background-color .6s}
.zone.flash{background:var(--accent-soft);transition:none}
.zone h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.zone .sub{font-size:12px;color:var(--muted);margin-top:2px}
.zone .list{display:flex;flex-direction:column;gap:6px;flex:1;font-size:13px}
.zone .empty{color:var(--muted);font-size:13px}
.zone .exit{font:500 12px/1.3 var(--font-mono);color:var(--accent);border-top:1px dashed var(--line);padding-top:6px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.file .mono{overflow-wrap:anywhere}
.chip{font:500 11px/1 var(--font-mono);padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.untracked{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.chip.changed{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.staged,.chip.new{border-color:var(--add);color:var(--add);background:var(--add-soft)}
.chip.head{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.merged{background:var(--add);border-color:var(--add);color:var(--surface)}
.file.ignored .mono{color:var(--muted);text-decoration:line-through}
.commit{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;position:relative}
.commit::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);margin-top:4px;z-index:1}
.commit.side::before{border-color:var(--accent);margin-left:0}
.commit:not(:last-child)::after{content:"";position:absolute;left:4px;top:14px;bottom:-10px;width:2px;background:var(--line)}
.commit .c-body{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;min-width:0}
.commit .hash{font:400 12px/1.3 var(--font-mono);color:var(--muted)}
.commit .msg{overflow-wrap:anywhere}
.commit .chip,.pr .chip{white-space:normal;overflow-wrap:anywhere;line-height:1.3}
.ico{width:14px;height:14px;flex:none;color:var(--muted)}
.ico.dir{color:var(--accent)}
.win,.repo{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);font-size:12.5px}
.win{box-shadow:0 2px 8px rgba(20,29,39,.10)}
.win-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--sunk);border-bottom:1px solid var(--line)}
.win-bar .dots{display:flex;gap:4px}
.win-bar .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.win-title{display:flex;gap:5px;align-items:center;font-weight:600}
.win-path{padding:4px 8px;color:var(--muted);font:400 11.5px/1.4 var(--font-mono);border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.win-cols{display:flex;justify-content:space-between;padding:4px 8px;font:600 10.5px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.win-row{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;width:100%;padding:5px 8px;border:0;background:none;text-align:left;font-size:12.5px;color:var(--ink)}
button.win-row:hover{background:var(--accent-soft)}
.win-row .mono{overflow-wrap:anywhere}
.win-row .chip{margin-left:auto}
.win-row.dotfile .ico,.win-row.dotfile .mono{opacity:.72}
.win-row.empty{color:var(--muted)}
.snip{tab-size:4;max-height:190px;overflow:auto}
.win-row.ignored .mono{color:var(--muted);text-decoration:line-through}
.win-foot{padding:4px 8px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
.repo-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:8px 10px 4px;font-size:13.5px}
.repo-head .owner{color:var(--muted)}
.repo-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 6px;border-bottom:1px solid var(--line)}
.repo-tabs button{display:flex;gap:4px;align-items:center;border:0;border-bottom:2px solid transparent;background:none;padding:6px 6px;font-size:12px;color:var(--muted);white-space:nowrap}
.repo-tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.count{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:0 6px;font:500 11px/1.5 var(--font-mono);color:var(--ink)}
.repo-body{display:flex;flex-direction:column;gap:8px;padding:8px}
.repo-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.repo select{font:600 12px/1.3 var(--font-body);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);max-width:100%}
.repo-box{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.repo-latest{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;padding:6px 8px;background:var(--sunk);border-bottom:1px solid var(--line)}
.repo-latest .msg{overflow-wrap:anywhere}
.repo-latest .hash{font:400 11.5px/1.3 var(--font-mono);color:var(--muted);margin-left:auto}
.avatar{display:grid;place-items:center;width:18px;height:18px;flex:none;border-radius:50%;background:var(--ink);color:var(--surface);font:600 10px/1 var(--font-body)}
.repo-file{display:grid;grid-template-columns:14px minmax(0,auto) minmax(0,1fr);gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line)}
.repo-file:last-child{border-bottom:0}
.repo-file .mono{overflow-wrap:anywhere}
.repo-file .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;font-size:11.5px}
.pr{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--sunk);font-size:13px}
.pr.open{border-color:var(--pr);border-left-width:3px}
.pr-name{display:inline-block;background:var(--pr-soft);color:var(--pr);border:1px solid var(--pr);border-radius:5px;padding:2px 8px;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.pr label{font-weight:600;color:var(--pr)}
.pr .pr-input{border-color:var(--pr);color:var(--pr);font-weight:600}
.count.hot{background:var(--pr);border-color:var(--pr);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.term-out .pr{color:#8FC0FF;border:0;padding:0;display:block;background:none;font-size:inherit}
.pr.banner{border-color:var(--warn);background:var(--warn-soft)}
.pr input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.pr .btn{font-size:13px;padding:6px 10px}
.pr .btn.merge{background:var(--add);border-color:var(--add);color:var(--surface)}
.diff{font:400 12px/1.5 var(--font-mono);border:1px solid var(--line);border-radius:5px;background:var(--surface);overflow-x:auto}
.diff div{padding:0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .f{color:var(--muted);border-bottom:1px solid var(--line)}
.diff .a{color:var(--add);background:var(--add-soft)}
.diff .d{color:var(--del)}

.term{display:flex;flex-direction:column;border-radius:8px;background:var(--term-bg);color:var(--term-ink);font:400 13.5px/1.5 var(--font-mono);min-height:300px;border:1px solid var(--term-line);overflow:hidden}
.term-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--term-line);color:var(--term-muted);font-size:12px}
.term-bar button{background:none;border:1px solid var(--term-line);color:var(--term-muted);border-radius:4px;padding:2px 8px;font-size:12px}
.term-bar select{background:var(--term-bg);border:1px solid var(--term-line);color:var(--term-muted);border-radius:4px;padding:2px 4px;font:inherit;font-size:12px;max-width:150px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.errs{display:flex;flex-direction:column;gap:10px}
.err{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.err p{margin:0}
.err .m{font:500 12.5px/1.5 var(--font-mono);color:var(--del);background:var(--sunk);border-radius:5px;padding:6px 8px;overflow-wrap:anywhere}
.fix{font:500 13px/1.5 var(--font-mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 6px;overflow-wrap:anywhere}
.note .mono{overflow-wrap:anywhere}
.shellbox{border:1px solid var(--line);border-left:3px solid var(--pr);border-radius:0 8px 8px 0;background:var(--sunk);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.shellbox p{margin:0}
.shellbox h3{font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.term-bar button:hover{color:var(--term-ink);border-color:var(--term-muted)}
.pane{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px}
.term-bar .tabs button{border-color:transparent;font:600 13px/1.4 var(--font-body);padding:4px 12px}
.term-bar .tabs button[aria-selected="true"]{color:var(--term-ink);background:var(--term-line);border-color:var(--term-line)}
.ed-files{display:flex;gap:2px;align-items:center;overflow-x:auto;padding:6px 8px 0;border-bottom:1px solid var(--term-line)}
.ed-files button,.ed-files input{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--term-muted);font:inherit;font-size:12.5px;padding:5px 9px;white-space:nowrap}
.ed-files button:hover{color:var(--term-ink)}
.ed-files button[aria-selected="true"]{color:var(--term-ink);border-bottom-color:var(--t-accent)}
.ed-files form{display:flex;gap:4px;align-items:center}
.ed-files input{border:1px solid var(--term-line);border-radius:4px;color:var(--term-ink);width:130px}
.ed-files #ed-add,.ed-files form button{color:var(--t-accent)}
#ed-text{flex:1 1 240px;min-height:240px;width:100%;resize:none;border:0;background:transparent;color:var(--term-ink);font:inherit;line-height:1.6;padding:10px 12px;tab-size:4;white-space:pre;overflow:auto}
#ed-text:focus{outline:none;box-shadow:inset 0 0 0 2px var(--t-accent)}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--term-line);color:var(--term-muted);font-size:12.5px}
.ed-foot button{background:var(--t-accent);color:#1a0d08;border:0;border-radius:5px;padding:5px 14px;font:600 13px/1.4 var(--font-body)}
.ed-foot button:disabled{opacity:.45;cursor:default}
.ed-foot button{white-space:nowrap}
.ed-foot button.ghost{background:none;border:1px solid var(--term-muted);color:var(--term-ink)}
.ed-foot .row{flex-wrap:nowrap;gap:8px}
.chip.conflict{border-color:var(--del);color:var(--del);align-self:flex-start}
.snip{display:block;width:100%;text-align:left;font:500 13.5px/1.5 var(--font-mono);padding:6px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:5px;background:var(--sunk);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.snip:hover{border-color:var(--accent);color:var(--accent)}
.term-out{flex:1 1 240px;height:240px;overflow:auto;padding:10px 12px}
.term-out div{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}

<script id="engine">
/* ---------- Simulated git: pure functions, no DOM ---------- */
const Engine = (() => {
  const dirOf = s => '/home/you/' + (s.proj || 'hello-api');
  const INIT = {
    'README.md': '# hello-api\nA tiny API for learning Git.\n',
    'main.py': 'from fastapi import FastAPI\n\napp = FastAPI()\n'
  };
  const fresh = () => ({ files: {}, repo: null, commits: {}, seq: 0, remote: null, hooks: {}, dir: 'home', proj: null });

  function hid(n, msg) {
    let h = 2166136261; const s = n + ':' + msg;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }

  }
  const tree = (s, id) => (id ? s.commits[id].tree : {});
  const headId = s => (s.repo ? (s.repo.branches[s.repo.head] || null) : null);
  function ancestors(s, id) {

  }
  const isAnc = (s, a, b) => !a || (!!b && ancestors(s, b).has(a));
  function aheadBehind(s, a, b) {
    const A = ancestors(s, a), B = ancestors(s, b); let ah = 0, be = 0;
    A.forEach(x => { if (!B.has(x)) ah++; }); B.forEach(x => { if (!A.has(x)) be++; });

  }
  function patterns(s) {
    return (s.files['.gitignore'] || '').split('\n').map(l => l.trim())
      .filter(l => l && !l.startsWith('#') && !l.startsWith('!'))
      .map(l => l.replace(/^\//, '').replace(/\/$/, ''));

  function ignored(s, p) {
    return patterns(s).some(pt => new RegExp('^' + pt.replace(/[.+^${}()|[\]\\?]/g, '\\$&').replace(/\*/g, '.*') + '$').test(p));

    const staged = [], unstaged = [], untracked = [], ign = [], um = r.merging ? r.merging.conflicts : [];

      else if (!(p in I)) staged.push(['deleted', p]);

  /* ----- GitHub side ----- */

    const base = s.remote.branches.main;

  }
  function prCandidates(s) {

  function openPR(s, branch, title) {

  /* ----- command runner ----- */
  function run(s, line) {
    const out = [], res = { out, event: null, clear: false };

      say('Folders: pwd · mkdir <name> · cd <name> · cd ..');
      say('Files:  ls -a · cat <file> · echo "text" > file (replace) · echo "text" >> file (append) · touch · rm');
      say('Git:    init · status · add · commit -m · log --oneline · diff · restore · rm --cached');
      say('        branch · switch -c · remote add · push · pull · fetch · merge · merge --abort');

    }
    const home = s.dir === 'home';
    if (cmd === 'pwd') { say(home ? '/home/you' : dirOf(s)); return res; }
    if (cmd === 'mkdir') {
      const n = clean(args.find(x => !x.startsWith('-'))).replace(/\/$/, '');

      if (cmd === 'ls') { say(s.proj ? s.proj + '/' : ''); return res; }

    }

      const p = clean(args[0]); if (!p) { say('usage: cat <file>'); return res; }

      const oi = tk.findIndex(t => t.op);

      { own: `create a real <span class="mono">README.md</span> now. Open the project folder in your code editor (in VS Code: File, then Open Folder), make a new file named exactly <span class="mono">README.md</span>, type a title line, and save it inside the project folder. Avoid Notepad, which tends to save it as <span class="mono">README.md.txt</span>. Git can only add files that exist, and the next lessons add this one.`, do: `<strong>Create the README file.</strong> The following lessons use it, so do not skip this step. In the <strong>Editor</strong> tab, choose <strong>+ New file</strong>, name it <code>README.md</code>, enter these two lines and press <strong>Save</strong>. Clicking the block sets it up for you: ${ed('README.md', '# hello-api\nA tiny API for learning Git.', 'replace')}`,
        moves: [{ t: 'edit', file: 'README.md', text: '# hello-api\nA tiny API for learning Git.', mode: 'replace' }], check: s => 'README.md' in s.files,
        after: `A <code>README.md</code> is the front page of a project: what it is and how to run it. GitHub displays it automatically.` },
      { own: `you do not need this exact file. Any file of your own will do. Use its name wherever the lessons say <span class="mono">main.py</span>.`, do: `Now the code. Create a second file named <code>main.py</code> with this content and save: ${ed('main.py', 'from fastapi import FastAPI\n\napp = FastAPI()', 'replace')}`,
        moves: [{ t: 'edit', file: 'main.py', text: 'from fastapi import FastAPI\n\napp = FastAPI()', mode: 'replace' }], check: s => 'main.py' in s.files },
      { own: `run this in your real terminal and confirm that <span class="mono">README.md</span> is in the list before you go on.`, do: `List what the folder contains: ${c('ls')}`, cmd: 'ls', check: (s, x) => /^ls\b/.test(x),
        after: `A working folder with two files. Git is not involved yet: there is no history and nothing is being tracked.` }
    ],
    extra: `<div class="note"><p><strong>The other way to start: clone</strong></p><p>If the project already exists on GitHub, you do not make the folder yourself. <code>git clone &lt;address&gt;</code> creates the folder, downloads every file and the full history, and connects it to GitHub in one step. You then <code>cd</code> into it and start work. Joining an existing project almost always starts with a clone. Starting a brand-new one starts the way this lesson does.</p></div>
      <div class="note"><p><strong>Following along with your own project?</strong></p><p>Use your own folder and file names wherever the lessons say <span class="mono">hello-api</span>, <span class="mono">README.md</span> or <span class="mono">main.py</span>. Open your terminal the normal way, not with "Run as administrator". Tick <em>I am also doing this on my own project</em> above the steps of any lesson, and every step gains a line saying what to do on your own computer or on github.com. If you work in VS Code, tick <em>I use VS Code</em> as well to see the button for each step. If your machine answers with a message the sandbox did not show, look it up under the <strong>Help</strong> tab.</p></div>`,
    recap: ['A working folder is an ordinary folder that holds the project\'s files.', '<code>pwd</code> shows where you are, <code>mkdir</code> makes a folder, <code>cd hello-api</code> moves into it.', 'New project: make a folder. Existing project: <code>git clone</code> it.'],
    reading: [['Pro Git: Getting a Git Repository', 'https://git-scm.com/book/en/v2/Git-Basics-Getting-a-Git-Repository'], ['GitHub Docs: Cloning a repository', 'https://docs.github.com/en/repositories/creating-and-managing-repositories/cloning-a-repository']]
  },
  {
    short: 'Repo', title: 'Create a repository',
    intro: `
      <p>A <strong>repository</strong> (repo) is a working folder plus Git's record of its history. You create one by running a single command inside the folder. From then on Git can save snapshots of the project, so you can see what changed, go back to an earlier version, and combine your work with other people's.</p>
      <p>The one idea that makes every later command make sense: your work is always in one of <strong>four places</strong>, and each command moves it from one place to the next. The map on this page shows all four, live.</p>
      <dl>
        <dt>Working folder</dt><dd>The ordinary files you open and edit. You made this in lesson 1.</dd>
        <dt>Staging area</dt><dd>The changes you have picked for your next save.</dd>
        <dt>Local repository</dt><dd>The history of saves, kept on your computer in a hidden <code>.git</code> folder.</dd>
        <dt>Remote</dt><dd>A copy of that history on GitHub, which the team shares. You create that one in lesson 5.</dd>
      </dl>`,
    steps: [
      { do: `Turn the folder into a Git repository: ${c('git init')}`, cmd: 'git init', check: s => !!s.repo,
        after: `You run <code>git init</code> once per project, from inside its folder. The staging area and local repository on the map now exist, both empty. The grey <em>hint</em> lines are about the branch name, which you will deal with in step 4.` },
      { do: `See what Git added. This form of the list command includes hidden files: ${c('ls -a')}`, cmd: 'ls -a', check: (s, x) => /^ls\b/.test(x),
        after: `The hidden <code>.git</code> folder <em>is</em> the local repository: Git keeps the whole history in there. It also shows, greyed out, in the Working folder window. You never edit it by hand, and deleting it would delete the history while leaving your files.` },
      { do: `Ask Git what it sees: ${c('git status')}`, cmd: 'git status', check: (s, x) => /^git\s+status/.test(x),
        after: `<code>git status</code> only reads, it never changes anything, so run it as often as you like. Both files are <strong>untracked</strong>: Git can see them but has not been told to save them. Now read its first line: <em>On branch master</em>.` },
      { own: `run <span class="mono">git status</span> and read the first line. If it already says <span class="mono">On branch main</span> you can skip this, though running it anyway does no harm.`,
        do: `<strong>Name the branch <code>main</code>.</strong> A branch is the named line of history your commits go onto. Git called yours <code>master</code>, its older default, but GitHub and this course call the first branch <code>main</code>, and the two must match when you push. Rename it: ${c('git branch -M main')}`, cmd: 'git branch -M main', check: s => s.repo.head === 'main',
        after: `It prints nothing when it works. The prompt and the Local repository panel now say <code>main</code>. <code>git branch -M &lt;name&gt;</code> renames the branch you are on to any name you give it. To make every future repository start as <code>main</code>, run <span class="mono">git config --global init.defaultBranch main</span> once on your computer. If you skip the rename, <span class="mono">git push -u origin main</span> later fails with <span class="mono">src refspec main does not match any</span>.` }
    ],
    extra: `<div class="note"><p><strong>On your own machine</strong></p>
      <p><span class="mono">fatal: not a git repository</span> means the terminal is not inside the project folder, or <span class="mono">git init</span> has not been run there yet. Move into the folder first.</p>
      <p><span class="mono">fatal: detected dubious ownership in repository</span> appears on Windows when the repository was created from a terminal opened as administrator. Git prints the exact fix: copy the <span class="mono">git config --global --add safe.directory ...</span> line it shows, run it, then repeat your command.</p><p>The full list of common messages and fixes is under the <strong>Help</strong> tab.</p></div>`,
    recap: ['A repository is a working folder plus its history. <code>git init</code> creates it, in a hidden <code>.git</code> folder.', 'Work moves through four places: working folder, staging area, local repository, remote.', '<code>git status</code> tells you where everything is, starting with which branch you are on.', 'Name the first branch <code>main</code> with <code>git branch -M main</code>, so it matches GitHub.'],
    reading: [['Pro Git: What is Git?', 'https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F'], ['GitHub Docs: About Git', 'https://docs.github.com/en/get-started/using-git/about-git']]
  },
  {
    short: 'Commits', title: 'Commits: saving a snapshot',
    intro: `
      <p>A <strong>commit</strong> is one saved snapshot of the whole project, with a short message, an author, a time, and a link to the commit before it. That chain of commits is the project's history.</p>
      <p>Saving takes two commands on purpose:</p>
      <ul>
        <li><code>git add</code> picks which changes go into the next snapshot (it <em>stages</em> them).</li>
        <li><code>git commit</code> saves everything that is staged.</li>
      </ul>
      <p>The staging step lets you keep each commit about one thing, even if you changed five files for three different reasons. A good message says what the commit does, in the imperative, like an instruction: <em>Add health check endpoint</em>, <em>Fix date format on invoices</em>.</p>
      <p><strong>The sequence, however many files are involved:</strong></p>
      <ol class="flow">
        <li><b>1. Edit and save</b>Change as many files as you like. Nothing is recorded yet.</li>
        <li><b>2. git status</b>See the list of files that changed.</li>
        <li><b>3. git add</b>Pick the files that belong to one idea: one, several, or all.</li>
        <li><b>4. git commit</b>Save everything you picked as one snapshot.</li>
        <li><b>5. Repeat</b>Files you did not pick are still waiting. Go back to step 2 for the next idea.</li>
      </ol>
      <ul>
        <li><code>git add README.md</code> stages one file. <code>git add README.md main.py</code> stages several. <code>git add .</code> stages every changed file in the folder.</li>
        <li><strong>Staging adds up.</strong> Each <code>git add</code> puts a file into the staging area alongside whatever is already there. Running <code>git add README.md</code> and then <code>git add main.py</code> leaves <em>both</em> staged, exactly as if you had named them in one command. Nothing leaves the staging area until you commit.</li>
        <li>One <code>git commit</code> saves <em>all</em> staged files together. Files you did not stage are left exactly as they are, still marked as changed.</li>
        <li>Staging is not permanent. If you edit a file again after <code>git add</code>, run <code>git add</code> on it again, or the commit will contain the older version.</li>
        <li>Group by purpose, not by file: two files changed for the same reason go in one commit, and two unrelated changes go in two commits.</li>
      </ul>
      <p>The steps below go through this three times: one new file, one change to an existing file, then several files at once.</p>`,
    steps: [
      { part: 'Part A: one file, one commit', own: `this works only if a file named <span class="mono">README.md</span> exists in the folder (lesson 1, step 4). If Git answers <span class="mono">pathspec 'README.md' did not match any files</span>, create the file first, or add a file you do have.`, do: `Stage the README file you created in lesson 1: ${c('git add README.md')}`, cmd: 'git add README.md', check: s => s.repo && 'README.md' in s.repo.index,
        after: `Watch the map: <code>README.md</code> now also sits in the staging area. Git prints nothing when <code>add</code> works.` },
      { do: `Check the state: ${c('git status')}`, cmd: 'git status', check: (s, x) => /^git\s+status/.test(x),
        after: `Green lines under <em>Changes to be committed</em> are staged. Red lines are not. <code>main.py</code> is still untracked and will not be part of this commit.` },
      { do: `Save the snapshot: ${c('git commit -m "Add README"')}`, cmd: 'git commit -m "Add README"', check: s => !!E.headId(s),
        after: `Your first commit. The seven characters in the output are its ID (a short hash). <code>-m</code> supplies the message inline.` },
      { do: `Now the second file. Stage it: ${c('git add main.py')}`, cmd: 'git add main.py', check: s => 'main.py' in s.repo.index },
      { do: `Commit it: ${c('git commit -m "Add API entry point"')}`, cmd: 'git commit -m "Add API entry point"', check: s => 'main.py' in HT(s),
        after: `Two commits, each about one thing.` },
      { part: 'Part B: changing a file Git already tracks', do: `Change a file. Open the <strong>Editor</strong> tab, pick <code>main.py</code>, add this line at the bottom and press <strong>Save</strong>. Clicking the line places it for you: ${ed('main.py', '# TODO: add a health check')}`, cmd: 'echo "# TODO: add a health check" >> main.py', check: s => s.files['main.py'] !== HT(s)['main.py'],
        after: `Saving in an editor only changes the working folder. The map marks <code>main.py</code> as <em>changed</em>: the file no longer matches the last commit, and Git has recorded nothing yet.` },
      { do: `See exactly what changed: ${c('git diff')}`, cmd: 'git diff', check: (s, x) => /^git\s+diff/.test(x),
        after: `Lines starting with <code>+</code> were added, lines with <code>-</code> were removed. Reading the diff before you commit is the habit that catches most mistakes.` },
      { do: `Stage and commit the change: ${c('git add main.py')} then ${c('git commit -m "Note the health check TODO"')}`, cmd: ['git add main.py', 'git commit -m "Note the health check TODO"'], check: s => HT(s)['main.py'] !== E.INIT['main.py'] && HT(s)['main.py'] === s.files['main.py'] },
      { part: 'Part C: several files at once',
        own: `edit and save two or three of your own files before you look at the status.`,
        do: `Sequence step 1: edit and save. This time three files change before you commit anything. In the <strong>Editor</strong>, make these three saves, in this order. Create <code>requirements.txt</code>: ${ed('requirements.txt', 'fastapi\nuvicorn', 'replace')} Add this line to <code>README.md</code>: ${ed('README.md', 'Install with: pip install -r requirements.txt')} Add this line to <code>main.py</code>: ${ed('main.py', '# TODO: add logging')}`,
        moves: [{ t: 'edit', file: 'requirements.txt', text: 'fastapi\nuvicorn', mode: 'replace' }, { t: 'edit', file: 'README.md', text: 'Install with: pip install -r requirements.txt', mode: 'append' }, { t: 'edit', file: 'main.py', text: '# TODO: add logging', mode: 'append' }],
        check: s => 'requirements.txt' in s.files && s.files['README.md'].includes('requirements.txt') && s.files['main.py'].includes('add logging'),
        after: `Three files now differ from the last commit, and Git has recorded none of it. Two of the changes are one idea (listing the dependencies and telling readers how to install them). The <code>main.py</code> note is a different idea.` },
      { do: `Sequence step 2: see everything that changed. ${c('git status')}`, cmd: 'git status', check: (s, x) => /^git\s+status/.test(x),
        after: `Two files are <em>modified</em> and one is <em>untracked</em> (new). All three are red: nothing is staged. The Working folder window shows the same thing.` },
      { do: `Sequence step 3: stage only the two files that belong together, one command each. ${c('git add README.md')} then ${c('git add requirements.txt')}`, cmd: ['git add README.md', 'git add requirements.txt'],
        check: s => 'requirements.txt' in s.repo.index && s.repo.index['README.md'] === s.files['README.md'] && s.repo.index['main.py'] !== s.files['main.py'],
        after: `Watch the Staging area on the map: the second <code>git add</code> did not replace the first. Both files are staged, and the next commit will contain both. You could have typed it as one command, <code>git add README.md requirements.txt</code>, with the same result. <code>git add .</code> would have taken all three files, which is not what you want here.` },
      { do: `Check what the commit will contain before you make it: ${c('git status')}`, cmd: 'git status', check: (s, x) => /^git\s+status/.test(x),
        after: `Both files you added are green, even though you added them separately. Green files, under <em>Changes to be committed</em>, go into the next commit. <code>main.py</code> is still red, under <em>Changes not staged</em>, and will be left out. This check before every commit is the habit that prevents surprises.` },
      { do: `Sequence step 4: commit the two staged files as one snapshot. ${c('git commit -m "List the dependencies"')}`, cmd: 'git commit -m "List the dependencies"', check: s => 'requirements.txt' in HT(s) && HT(s)['main.py'] !== s.files['main.py'],
        after: `One commit, two files. On the map, <code>README.md</code> and <code>requirements.txt</code> are <em>committed</em> and <code>main.py</code> is still <em>changed</em>: your edit is safe in the working folder, waiting.` },
      { do: `Sequence step 5: repeat for the next idea. Stage and commit the file that was left. ${c('git add main.py')} then ${c('git commit -m "Note the logging TODO"')}`, cmd: ['git add main.py', 'git commit -m "Note the logging TODO"'], check: s => 'requirements.txt' in HT(s) && HT(s)['main.py'] === s.files['main.py'] && trackedClean(s),
        after: `Three changed files became two commits, each about one thing. Anyone reading the history can understand, or undo, either one without touching the other.` },
      { do: `Read the history: ${c('git log --oneline')}`, cmd: 'git log --oneline', check: (s, x) => /^git\s+log/.test(x),
        after: `Newest first. <code>HEAD -&gt; main</code> marks where you are: on a branch called <code>main</code>, at its latest commit.` }
    ],
    extra: `<div class="note"><p><strong>On your own machine</strong></p>
      <p><span class="mono">fatal: pathspec 'README.md' did not match any files</span> means there is no file with that exact name in the folder. Run <span class="mono">git status</span> to see the real names, and add those. On Windows, Notepad may have saved the file as <span class="mono">README.md.txt</span>.</p>
      <p><span class="mono">Author identity unknown</span> on your first commit means Git does not know who you are yet. Run these once, then commit again: <span class="mono">git config --global user.name "Your Name"</span> and <span class="mono">git config --global user.email "you@example.com"</span>.</p>
      <p>If you run <span class="mono">git commit</span> without <span class="mono">-m</span> and the terminal turns into a text editor, type <span class="mono">:q!</span> and press Enter to leave, then commit again with <span class="mono">-m "message"</span>.</p><p>The full list of common messages and fixes is under the <strong>Help</strong> tab.</p></div>`,
    recap: ['The loop is: edit and save, <code>git status</code> / <code>git diff</code>, <code>git add</code>, <code>git commit -m</code>.', 'With several changed files, stage only the ones that belong together, commit, then repeat for the rest.', 'Staging adds up: every <code>git add</code> joins what is already staged, and a commit takes all of it.', 'One commit saves every staged file. Unstaged files wait, unchanged.', 'One commit, one idea. Write the message as an instruction.', 'Commits are still only on your computer.'],
    reading: [['Pro Git: Recording Changes to the Repository', 'https://git-scm.com/book/en/v2/Git-Basics-Recording-Changes-to-the-Repository']]
  },
  {
    short: '.env', title: '.env: keeping secrets out of Git',
    intro: `
      <p>Most apps need settings that should not live in the code: API keys, database passwords, the address of a server. The convention is a file named <code>.env</code> in the project folder, one <code>NAME=value</code> per line, which the app reads when it starts.</p>
      <p><strong><code>.env</code> must never be committed.</strong> A commit is permanent history. Anyone who can read the repository can read every file in every commit, and automated bots scan public GitHub repositories for keys within minutes of a push.</p>
      <p>Two small files solve this:</p>
      <dl>
        <dt><code>.gitignore</code></dt><dd>A list of files Git should act as if it cannot see. It <em>is</em> committed, so the whole team ignores the same files.</dd>
        <dt><code>.env.example</code></dt><dd>A committed copy of <code>.env</code> with the names but no real values, so a teammate knows what to fill in.</dd>
      </dl>`,
    steps: [
      { do: `In the <strong>Editor</strong>, choose <strong>+ New file</strong>, name it <code>.env</code>, give it this line (a fake secret) and press <strong>Save</strong>: ${ed('.env', 'API_KEY=sk_live_4f9a2c', 'replace')}`, cmd: 'echo "API_KEY=sk_live_4f9a2c" > .env', check: s => '.env' in s.files },
      { do: `Check the state: ${c('git status')}`, cmd: 'git status', check: (s, x) => /^git\s+status/.test(x),
        after: `<code>.env</code> shows up as untracked. That is the danger: one careless <code>git add .</code> (which stages everything) and the secret is on its way into history.` },
      { do: `Tell Git to ignore it. Create a new file named <code>.gitignore</code> containing this one line, and save: ${ed('.gitignore', '.env', 'replace')}`, cmd: 'echo ".env" > .gitignore', check: s => E.ignored(s, '.env'),
        after: `Each line of <code>.gitignore</code> is a file name or pattern. Real projects add more, such as <code>node_modules/</code>, <code>__pycache__/</code> and <code>*.log</code>.` },
      { do: `Check again: ${c('git status')}`, cmd: 'git status', check: (s, x) => /^git\s+status/.test(x),
        after: `<code>.env</code> has vanished from the list, and the map shows it as <em>ignored</em>. The new untracked file is <code>.gitignore</code> itself, which you do want to commit.` },
      { do: `Add the template for teammates. Create a new file named <code>.env.example</code> with the name but no value, and save: ${ed('.env.example', 'API_KEY=', 'replace')}`, cmd: 'echo "API_KEY=" > .env.example', check: s => '.env.example' in s.files },
      { do: `Stage everything and commit: ${c('git add .')} then ${c('git commit -m "Ignore .env and add an example"')}`, cmd: ['git add .', 'git commit -m "Ignore .env and add an example"'], check: s => '.gitignore' in HT(s) && '.env.example' in HT(s) && !('.env' in HT(s)),
        after: `<code>git add .</code> was safe this time because the ignore rule was in place first. In Free play, try <code>git add .env</code> to see Git refuse.` }
    ],
    extra: `<div class="note"><p><strong>If a secret has already been committed</strong></p><p>Adding it to <code>.gitignore</code> afterwards is not enough, because ignore rules only apply to files Git is not yet tracking. Run <code>git rm --cached .env</code> (stop tracking it, keep the file), commit, and then <strong>replace the key</strong> with a new one from the service that issued it. The old key is still readable in earlier commits, so treat it as leaked.</p></div>`,
    recap: ['Secrets go in <code>.env</code>. <code>.env</code> goes in <code>.gitignore</code>. Do this before the first commit.', 'Commit <code>.gitignore</code> and <code>.env.example</code>, never <code>.env</code>.', 'A leaked key must be replaced, not just deleted.'],
    reading: [['GitHub Docs: Ignoring files', 'https://docs.github.com/en/get-started/getting-started-with-git/ignoring-files'], ['Git reference: gitignore patterns', 'https://git-scm.com/docs/gitignore'], ['Ready-made .gitignore templates', 'https://github.com/github/gitignore']]
  },
  {
    short: 'Push & pull', title: 'Push and pull: syncing with GitHub',
    intro: `
      <p>Everything so far lives only on your computer. A <strong>remote</strong> is a copy of the repository hosted somewhere else, usually GitHub. It is your backup and the place your team (or a coding agent) meets. Your computer holds the <em>local</em> repository, GitHub holds the <em>remote</em> one, and the two are separate until you sync them.</p>
      <ul>
        <li><code>git push</code> uploads your new commits to the remote.</li>
        <li><code>git pull</code> downloads commits you do not have yet and updates your files.</li>
      </ul>
      <p>Git gives the remote a nickname so you do not retype its address. By convention the main one is called <code>origin</code>.</p>
      <p>The remote repository has to exist before you can push to it, so the first step is to create it on GitHub. The GitHub panel of the map now shows GitHub's <em>New repository</em> form.</p>`,
    steps: [
      { do: `On the <strong>GitHub</strong> panel of the map, click <strong>Create repository</strong>.`, gh: true, moves: [{ t: 'gh', v: 'create' }], check: s => !!s.remote,
        after: `An empty repository now exists at <code>github.com/you/hello-api</code>. On the real form you choose an owner, a name, and public or private. Leave "Add a README" unticked when your project already has files, so the two histories do not clash. GitHub then shows the two commands you need next, as it does here.` },
      { do: `Link your folder to the GitHub repository: ${c('git remote add origin https://github.com/you/hello-api.git')}`, cmd: 'git remote add origin https://github.com/you/hello-api.git', check: s => !!s.repo.remotes.origin,
        after: `Nothing has been uploaded yet. You have only told your local repository where <code>origin</code> is. The address is the one GitHub showed you.` },
      { do: `Upload your commits: ${c('git push -u origin main')}`, cmd: 'git push -u origin main', check: s => s.remote && s.remote.branches.main === s.repo.branches.main && !!s.repo.upstream.main,
        after: `Read it as: push to <code>origin</code>, the branch <code>main</code>. The <code>-u</code> is needed once per branch. It links your local <code>main</code> to the one on GitHub so that from now on a bare <code>git push</code> or <code>git pull</code> knows where to go.` },
      { do: `Make one more commit. In the <strong>Editor</strong>, add this line to <code>README.md</code> and save: ${ed('README.md', 'Run with: uvicorn main:app')} Then ${c('git add README.md')} then ${c('git commit -m "Document how to run the app"')}`, cmd: ['echo "Run with: uvicorn main:app" >> README.md', 'git add README.md', 'git commit -m "Document how to run the app"'], check: s => s.repo.tracking.main && E.aheadBehind(s, s.repo.branches.main, s.repo.tracking.main)[0] >= 1 && trackedClean(s),
        after: `Compare the two right-hand panels of the map: your local repository has a new commit, while the GitHub page still shows the older one as its latest.` },

    <div class="sheet-table"><table><thead><tr><th>File</th><th>What it tells the agent</th></tr></thead><tbody>

/* Each step is an ordered list of moves: a command, an editor save, or a GitHub button. */
function movesOf(step) {
  if (step.moves) return step.moves;
  return [].concat(step.cmd || []).map(x => {
    const tk = Engine.tokenize(x), oi = tk.findIndex(t => t.op);
    if (tk[0].v === 'echo' && oi > 0) return { t: 'edit', file: tk[oi + 1].v, text: tk.slice(1, oi).map(t => t.v).join(' '), mode: tk[oi].op === '>' ? 'replace' : 'append' };
    return { t: 'cmd', v: x };
  });
}
function editOk(m, content) {
  const L = (content || '').split('\n');
  if (m.t === 'resolve') return !Engine.hasMarkers(content);
  if (m.mode === 'swap') return L.includes(m.text) && !L.includes(m.find);
  return m.text.split('\n').every(l => L.includes(l));
}
function applyMove(s, m) {
  if (m.t === 'cmd') { Engine.run(s, m.v); return; }
  if (m.t === 'gh') { if (m.v === 'create') Engine.createRepo(s); else if (m.v === 'open') Engine.openPR(s, s.repo.head); else Engine.mergePR(s, s.remote.prs.find(p => p.status === 'open').id); return; }
  if (m.t === 'resolve') { s.files[m.file] = Engine.resolve(s.files[m.file], 'theirs'); return; }
  const cur = s.files[m.file] || '';
  if (m.mode === 'replace') s.files[m.file] = m.text + '\n';
  else if (m.mode === 'swap') s.files[m.file] = cur.split('\n').map(l => (l === m.find ? m.text : l)).join('\n');
  else if (!cur.split('\n').includes(m.text)) s.files[m.file] = cur + (cur && !cur.endsWith('\n') ? '\n' : '') + m.text + '\n';
}
function isMutating(tk) {
  const w = tk.filter(t => !t.op).map(t => t.v), c0 = w[0];
  if (c0 === 'echo') return tk.some(t => t.op);
  if (['touch', 'rm', 'gh', 'mkdir', 'cd'].includes(c0)) return true;
  if (c0 !== 'git') return false;
  const sub = w[1];
  if (['init', 'add', 'commit', 'restore', 'rm', 'switch', 'checkout', 'push', 'pull', 'merge'].includes(sub)) return true;
  if (sub === 'branch') return w.slice(2).length > 0;
  if (sub === 'remote') return w[2] === 'add' || w[2] === 'set-url';
  return false;
}
function cmdMatches(expected, typed) {
  const a = Engine.tokenize(expected).map(t => t.op || t.v), b = Engine.tokenize(typed).map(t => t.op || t.v);
  if (!isMutating(Engine.tokenize(expected))) return a[0] === b[0] && (a[0] !== 'git' || a[1] === b[1]);
  if (a[1] === 'add' && b[0] === 'git' && b[1] === 'add') return a.length === b.length && a.slice(2).sort().join('\n') === b.slice(2).sort().join('\n');
  if (a[1] === 'commit' && a[2] === '-m') return b.length === 4 && b[0] === 'git' && b[1] === 'commit' && b[2] === '-m' && b[3].trim() !== '';
  return a.length === b.length && a.every((x, i) => x === b[i]);
}
function runStep(s, step) {
  if (step.before && !s.hooks[step.do]) { step.before(s); s.hooks[step.do] = 1; }
  let last = '';
  movesOf(step).forEach(m => { applyMove(s, m); if (m.t === 'cmd') last = m.v; });
  return last;
}
function replayTo(lessonIndex) {
  const s = Engine.fresh();
  LESSONS.slice(0, lessonIndex).forEach(L => L.steps.forEach(st => runStep(s, st)));
  return s;
}

  function commitList(ids, labelsFor, mainId) {
    const all = new Set(); ids.forEach(id => E.ancestors(S, id).forEach(x => all.add(x)));
    const list = [...all].map(x => S.commits[x]).sort((a, b) => b.n - a.n), show = list.slice(0, 4);
    if (!list.length) return '';
    return show.map(cm => `<div class="commit ${E.isAnc(S, cm.id, mainId) ? '' : 'side'}"><div class="c-body"><span class="hash">${cm.id}</span><span class="msg">${esc(cm.msg)}</span>${labelsFor(cm.id)}</div></div>`).join('')
      + (list.length > 4 ? `<div class="empty">+ ${list.length - 4} earlier</div>` : '');
  }
  function renderMap() {

    const n = names.length + (r ? 1 : 0);
    const files = atHome()
      ? `<div class="win"><div class="win-bar"><span class="dots"><i></i><i></i><i></i></span><span class="win-title">${dirIcon}you</span></div>

          body += `<div class="pr open"><span class="row"><span class="chip new">Open</span>${prName(pr)}</span><span><span class="chip">${esc(pr.branch)}</span> → <span class="chip head">main</span></span>
            <div class="diff">${d.map(f => `<div class="f">${esc(f.path)}  +${f.add} −${f.del}</div>` + f.lines.filter(l => l.k !== ' ').map(l => `<div class="${l.k === '+' ? 'a' : 'd'}">${l.k}${esc(l.t)}</div>`).join('')).join('')}</div>
            <button type="button" class="btn merge" data-act="pr-merge" data-id="${pr.id}"${lock('merge')}>Merge pull request</button></div>`;
        });
        if (!R.prs.length) body = '<div class="empty">No pull requests yet. Push a branch, then open one from the Code tab.</div>';
      }
      const tab = (id, label, count, hot) => `<button type="button" role="tab" data-ghtab="${id}" aria-selected="${ghTab === id}">${label}${count == null ? '' : `<span class="count ${hot ? 'hot' : ''}">${count}</span>`}</button>`;
      remote = `<div class="repo"><div class="repo-head">${dirIcon}<span class="owner">you /</span><b>${esc(proj())}</b><span class="chip">Private</span></div>
        <div class="repo-tabs" role="tablist">${tab('code', 'Code')}${tab('commits', 'Commits', all.size)}${tab('prs', 'Pull requests', openN, openN > 0)}</div>
        <div class="repo-body">${body}</div></div>`;
    }
    $('map').innerHTML = `<div class="map-head"><b>Where your work lives</b><span>${free() ? 'Free play sandbox' : `Lesson ${P.cur + 1} sandbox`}</span></div><div class="zones">
      <div class="zone wide" id="z1"><div><h3>Working folder</h3><div class="sub">the files you edit, on your computer</div></div><div class="list">${files}</div><div class="exit">git add →</div></div>
      <div class="zone" id="z2"><div><h3>Staging area</h3><div class="sub">picked for the next commit</div></div><div class="list">${mergeNote}${staged}</div><div class="exit">git commit →</div></div>
      <div class="zone" id="z3"><div><h3>Local repository</h3><div class="sub">history on your computer</div></div><div class="list">${local}</div><div class="exit">git push →</div></div>
      <div class="zone wide" id="z4"><div><h3>GitHub</h3><div class="sub">the shared remote, <span class="mono">origin</span>, in your browser</div></div><div class="list">${remote}</div><div class="exit">← git pull</div></div>
    </div>`;
  }
  function render() { renderNav(); renderLesson(); renderMap(); renderEditor(); localize(); $('tprompt').textContent = promptText(); $('shell-sel').value = shell(); }

  /* ----- events ----- */
  document.addEventListener('click', e => {
    const opn = e.target.closest('[data-open]'); if (opn) { edFile = opn.dataset.open; edMsg = ''; naming = false; setPanel('ed'); return; }
    const shb = e.target.closest('[data-shell]'); if (shb) { setShell(shb.dataset.shell); return; }
    const gt = e.target.closest('[data-ghtab]'); if (gt) { ghTab = gt.dataset.ghtab; renderMap(); return; }
    const snip = e.target.closest('.snip');
    if (snip) { edOpen(snip.dataset.file, snip.dataset.text, snip.dataset.mode, snip.dataset.find); return; }
    const keep = e.target.closest('[data-keep]');
    if (keep && edFile != null) { const t = E.resolve($('ed-text').value, keep.dataset.keep); if (t === S.files[edFile]) delete drafts[edFile]; else drafts[edFile] = t; edMsg = ''; renderEditor(); return; }
    const tab = e.target.closest('[data-panel]'); if (tab) { setPanel(tab.dataset.panel); return; }
    const ef = e.target.closest('[data-edfile]'); if (ef) { edFile = ef.dataset.edfile; edMsg = ''; naming = false; renderEditor(); return; }
    if (e.target.closest('#ed-add')) { if (atHome()) { edMsg = 'No project folder is open. In the terminal, create one with mkdir, then move into it with cd.'; renderEditor(); return; } naming = true; renderEditor(); $('ed-name').focus(); return; }
    if (e.target.closest('#ed-save')) { edSave(); return; }
    const cmdBtn = e.target.closest('.cmd');
    if (cmdBtn) {
      setPanel('term');
      const inp = $('tin'); inp.value = cmdBtn.dataset.cmd; inp.focus({ preventScroll: true });
      if (window.matchMedia('(max-width:1039px)').matches) inp.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    const goBtn = e.target.closest('[data-go]'); if (goBtn) { go(+goBtn.dataset.go); return; }
    if (e.target.closest('#restart')) { restart(); return; }
    const act = e.target.closest('[data-act]');
    if (act && !act.disabled) {
      const a = act.dataset.act;
      if (a === 'maya-readme' || a === 'maya-main') { maya(a.slice(5)); return; }
      if (a === 'free-history' || a === 'free-empty') { SF = freshFree(a.slice(5)); S = SF; resetUi(); line(''); line(`Free play reset: ${a === 'free-empty' ? 'a blank start in your home folder, before mkdir' : 'a project with history, connected to GitHub'}.`, 'meta'); save(); render(); bottom(); return; }
      if (a === 'repo-create') { E.createRepo(S); ghTab = 'code'; line(`GitHub: created the empty repository you/${proj()}.`, 'pr'); }
      if (a === 'pr-new') { const b = act.dataset.branch; prDraft = { branch: b, title: S.commits[S.remote.branches[b]].msg }; renderMap(); const t = $('pr-title'); if (t) { t.focus(); t.select(); } return; }
      if (a === 'pr-create') { const pr = E.openPR(S, prDraft.branch, ($('pr-title').value || '').trim()); prDraft = null; ghTab = 'prs'; line(`GitHub: opened pull request #${pr.id} "${pr.title}".`, 'pr'); }
      if (a === 'pr-merge') { const pr = E.mergePR(S, +act.dataset.id); if (pr) line(`GitHub: merged pull request #${pr.id} "${pr.title}" into main.`, 'pr'); }
      if (free()) freeFlags(); else advance();
      save(); render(); flash('pr'); bottom(); follow();
    }
  });
  $('map').addEventListener('change', e => { if (e.target.id === 'gh-branch') { ghBranch = e.target.value; renderMap(); localize(); } });
  $('shell-sel').addEventListener('change', e => setShell(e.target.value));
  $('lesson').addEventListener('change', e => { if (e.target.id === 'own-toggle' || e.target.id === 'ide-toggle') { P[e.target.id === 'own-toggle' ? 'own' : 'ide'] = e.target.checked; save(); const y = $('lesson').scrollTop; render(); $('lesson').scrollTop = y; } });
  $('tform').addEventListener('submit', e => { e.preventDefault(); const v = $('tin').value; $('tin').value = ''; exec(v); });
  $('ed-text').addEventListener('input', () => {
    if (edFile == null) return;
    const v = $('ed-text').value; if (v === S.files[edFile]) delete drafts[edFile]; else drafts[edFile] = v;
    edMsg = ''; renderEditor();
  });
  $('ed-text').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); edSave(); } });
  $('ed-tabs').addEventListener('submit', e => {
    e.preventDefault();
    const name = ($('ed-name').value || '').trim().replace(/^\.\//, '');
    if (!name || /[\s\/]/.test(name)) { $('ed-status').textContent = 'Use a file name without spaces or slashes, for example .env'; return; }
    if (!(name in S.files) && !(name in drafts)) drafts[name] = '';
    edFile = name; naming = false; edMsg = ''; renderEditor(); $('ed-text').focus();
  });
  $('tin').addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && hist.length) { e.preventDefault(); hi = Math.max(0, hi - 1); $('tin').value = hist[hi]; }
    else if (e.key === 'ArrowDown' && hist.length) { e.preventDefault(); hi = Math.min(hist.length, hi + 1); $('tin').value = hist[hi] || ''; }
  });
  $('btn-help').addEventListener('click', () => exec('help'));
  $('btn-clear').addEventListener('click', () => { $('tout').textContent = ''; });
  $('tout').addEventListener('click', () => { if (!String(window.getSelection())) $('tin').focus({ preventScroll: true }); });

  /* ----- boot ----- */
  function start(data) {
    const d = (data && data.SL && data.SF && data.P) ? data : load();
    if (d && d.SL) { SL = d.SL; SF = d.SF; P = d.P; }
    else { SL = Engine.fresh(); SF = freshFree('history'); P = { cur: 0, view: 0, prog: 0, sub: 0, best: (d && d.best) || LESSONS.map(() => 0), mode: 'lesson' }; }
    S = free() ? SF : SL;
    welcome(); ensureBefore(); render();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ SL, SF, P }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
